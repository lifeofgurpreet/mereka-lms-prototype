---
# MFE Caddy domain env vars for CSP header template interpolation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe
  labels:
    app.kubernetes.io/name: mfe
spec:
  template:
    spec:
      containers:
        - name: mfe
          env:
            - name: LMS_HOST
              value: staging.academyv2.mereka.io
            - name: CMS_HOST
              value: staging.studio.academyv2.mereka.io
            - name: AUTH_HOST
              value: staging.auth0.mereka.io
            - name: TENANT_BIJIBIJI_HOST
              value: staging.academy.biji-biji.com
            - name: TENANT_SOF_HOST
              value: staging.skillourfuture.academy.mereka.io
