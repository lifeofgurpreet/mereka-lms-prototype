# Domain overrides for staging environment.
#
# Staging uses staging.academyv2.mereka.io domains on the rke2-nonprod cluster.
# AUTH DOMAIN NOTE (issue #174): same ownership rules as rke2-nonprod.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
spec:
  template:
    spec:
      containers:
        - name: lms
          env:
            - name: MEREKA_LMS_DOMAIN
              value: staging.academyv2.mereka.io
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.io
            - name: LMS_BASE_URL
              value: https://staging.academyv2.mereka.io
            - name: MFE_BASE_URL
              value: https://staging.apps.academyv2.mereka.io
            - name: MEREKA_AUTH_DOMAIN
              value: staging.auth0.mereka.io
            - name: MEREKA_CREDENTIALS_DOMAIN
              value: staging.credentials.academyv2.mereka.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
spec:
  template:
    spec:
      containers:
        - name: cms
          env:
            - name: MEREKA_LMS_DOMAIN
              value: staging.academyv2.mereka.io
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.io
            - name: LMS_BASE_URL
              value: https://staging.academyv2.mereka.io
            - name: MFE_BASE_URL
              value: https://staging.apps.academyv2.mereka.io
            - name: MEREKA_AUTH_DOMAIN
              value: staging.auth0.mereka.io
            - name: MEREKA_CREDENTIALS_DOMAIN
