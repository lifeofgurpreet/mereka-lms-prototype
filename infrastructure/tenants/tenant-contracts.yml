# Tenant Contracts — tenant metadata and identity
#
# OWNERSHIP BOUNDARY:
#   This file owns: tenant identity (slug, name, org_code), contact info,
#   country, registry_slug, MFE env file paths, and aliases.
#
#   This file does NOT own: canonical hostnames. The source of truth for all
#   live domains (FQDNs, TLS, auth classification, proof priority) is:
#     deploy/k8s/tenancy/tenant-registry.yaml
#
#   The "domains" section is a DERIVED REFERENCE verified by CI alignment
#   checks. Operational scripts (sync, provision) read domains from the
#   canonical registry, not from this file. If domains here drift from
#   the registry, the alignment gate fails.
#
# Consumers:
#   - scripts/tenants/sync-tenant-registry-configmap.sh (metadata only — domains from registry)
#   - scripts/tenants/provision-all-tenants.sh (metadata only — domains from registry)
#   - scripts/qa/verify-tenant-contract-alignment.sh (alignment check — reads both)
#   - scripts/qa/verify-tenant-dns-inventory.sh (inventory visibility — reads both)
#   - scripts/shared/config.sh mereka_lms_canonical_domain_map_json() (slug mapping only)
version: 1

tenants:
  - slug: mereka
    registry_slug: mereka-academy
    name: Mereka Academy
    org_code: MEREKA
    active: true
    contact_email: team@mereka.io
    country: MY
    domains:
      lms: academyv2.mereka.io
      studio: studio.academyv2.mereka.io
      apps: apps.academyv2.mereka.io
      admin: admin.academyv2.mereka.io
    aliases: []
    mfe_env_file: deploy/k8s/base/apps/enterprise/mfe/enterprise-mfe-env.js

  - slug: bijibiji
    registry_slug: biji-biji
    name: Biji-Biji Academy
    org_code: BIJIBIJI
