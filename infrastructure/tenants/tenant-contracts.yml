    country: MY
    domains:
      lms: academy.biji-biji.com
      studio: studio.academy.biji-biji.com
      apps: apps.academy.biji-biji.com
      admin: admin.academyv2.mereka.io
    aliases: []
    mfe_env_file: deploy/k8s/base/apps/enterprise/mfe/biji-biji-mfe-env.js

  - slug: skillourfuture
    registry_slug: skillourfuture
    name: Skill Our Future
