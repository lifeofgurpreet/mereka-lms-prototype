  # ArgoCD ConfigMap Ignore
  - id: argocd-configmap-ignore
    name: "ArgoCD CSS ConfigMap ignoreDifferences"
    category: argocd
    description: "Prevents ArgoCD from triggering pod rolling on CSS ConfigMap hash changes (mereka-lms-dcd)"
    target_file: "deploy/k8s/patches/argocd-configmap-ignore.yaml"
    verify_command: "test -f deploy/k8s/patches/argocd-configmap-ignore.yaml"
    verify_pattern: "ignoreDifferences"
    severity: critical
    required: true
    bead: mereka-lms-dcd
    notes: "Requires manual application: kubectl patch application mereka-lms -n argocd --type=merge --patch-file=deploy/k8s/patches/argocd-configmap-ignore.yaml"
