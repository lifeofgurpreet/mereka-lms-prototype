# Local-first sanitized Tutor configuration overrides. Copy to tutor_env/config.yml and fill in secrets via `tutor config save`.
LMS_HOST: localhost
CMS_HOST: studio.localhost
DISCOVERY_HOST: discovery.localhost
ECOMMERCE_HOST: ecommerce.localhost
MFE_HOST: apps.localhost
XQUEUE_HOST: xqueue.localhost
DOCKER_REGISTRY: mirror.gcr.io/
DOCKER_IMAGE_OPENEDX: openedx:nightly
DOCKER_IMAGE_CADDY: mirror.gcr.io/library/caddy:2.7.4
DOCKER_IMAGE_MEILISEARCH: mirror.gcr.io/getmeili/meilisearch:v1.8.4
DOCKER_IMAGE_MONGODB: mirror.gcr.io/library/mongo:7.0.28
DOCKER_IMAGE_MYSQL: mirror.gcr.io/library/mysql:8.4.0
DOCKER_IMAGE_REDIS: mirror.gcr.io/library/redis:7.4.5
DOCKER_IMAGE_SMTP: mirror.gcr.io/devture/exim-relay:4.96-r1-0
MYSQL_ROOT_HOST: '%'
MFE_DOCKER_IMAGE: openedx-mfe:nightly
MFE_COMMON_VERSION: release/ulmo.2
OPENEDX_COMMON_VERSION: open-release/ulmo.1
OPENEDX_LMS_VERSION: open-release/ulmo.1
OPENEDX_CMS_VERSION: open-release/ulmo.1
PLUGINS:
  - mereka_lms
  - mereka_lms_mfe_slots
  - discovery
  - mfe
  - notes
  - ecommerce  # DEPRECATED — legacy Oscar ecommerce. Do NOT enable for new deployments. Replaced by Purchase Gateway (services/purchase-gateway/).
  - xqueue
  - forum
  - aspects
RUN_MONGODB: true   # Local/dev bootstrap default. Production uses Atlas and must set this false in env-specific config.
MONGODB_URI: ""
MONGODB_HOST: mongodb
MONGODB_PORT: 27017
MONGODB_AUTH: ""
MYSQL_HOST: mysql
MYSQL_PORT: 3306
REDIS_HOST: redis
REDIS_PORT: 6379
AWS_S3_REGION_NAME: asia-southeast1
AWS_STORAGE_BUCKET_NAME: staging-academy-mereka-io-content  # Environment-specific — replace per env (staging/prod). Do not copy this value verbatim.
LMS_DEFAULT_SITE_THEME: mereka
ADDL_INSTALLED_APPS:
  - openedx.core.djangoapps.content_libraries.apps.ContentLibrariesConfig
  - openedx.core.djangoapps.bookmarks.apps.BookmarksConfig
  - openedx.core.djangoapps.discussions.apps.DiscussionsConfig
  - openedx.core.djangoapps.theming.apps.ThemingConfig
# Google OAuth2 Configuration
# Get these from Google Cloud Console > APIs & Services > Credentials
# See docs/GOOGLE_OAUTH_SETUP.md for detailed setup instructions
SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ""
SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ""
