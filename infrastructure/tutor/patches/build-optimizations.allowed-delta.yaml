version: "2026-04-20"
owner: platform-team
source_script: infrastructure/tutor/patches/build-optimizations.sh
inventory_doc: docs/reference/architecture/TUTOR_PATCHES_INVENTORY.md
review_date: "2026-04-27"
default_policy: fail_closed
notes: >
  J-exit contract for the remaining named post-render Dockerfile mutations.
  The intended chain is raw Tutor render -> explicit allowed delta -> artifact.
  This file is not permission to add more post-render authority.
allowed_deltas:
  - id: dependency-image-mirror-normalization
    authority_class: temporary_compatibility_layer
    owner: platform build authority lane
    reason: >
      Tutor 21/tutormfe emit Docker Hub dependency refs before source hooks can
      select Dockerfile frontend/base/helper image acquisition refs.
    source_script: infrastructure/tutor/patches/dependency-image-mirrors.sh
    source_markers:
      - REPLACEMENTS
      - REQUIRED_BY_SUFFIX
    retirement_trigger: >
      Tutor/tutormfe exposes source-owned Dockerfile frontend/base/helper image
      settings, or CI and local cold-start image acquisition no longer depend on
      anonymous Docker Hub pulls for these upstream-emitted refs.
    added_patterns:
      - '# syntax=mirror\.gcr\.io/docker/dockerfile:1'
      - 'FROM mirror\.gcr\.io/library/ubuntu:22\.04 AS minimal'
      - 'COPY --link --from=mirror\.gcr\.io/powerman/dockerize:0\.19\.0 '
      - 'FROM mirror\.gcr\.io/library/node:24\.11\.0-bullseye-slim AS base'
      - 'FROM mirror\.gcr\.io/library/caddy:2\.7\.4 AS production'
    removed_patterns:
      - '# syntax=docker/dockerfile:1'
      - 'FROM docker\.io/ubuntu:22\.04 AS minimal'
      - 'COPY --link --from=docker\.io/powerman/dockerize:0\.19\.0 '
      - 'FROM docker\.io/node:24\.11\.0-bullseye-slim AS base'
      - 'FROM docker\.io/caddy:2\.7\.4 AS production'
  - id: base-assets-no-build-isolation
    authority_class: temporary_compatibility_layer
    owner: platform build authority lane
    reason: >
      Tutor emits the Open edX requirements install line as rendered Dockerfile
      shell text, and no current source hook owns the no-build-isolation flag.
    source_markers:
      - BASE_ASSETS_INSTALL
      - BASE_ASSETS_NO_BUILD_ISOLATION_INSTALL
    retirement_trigger: >
      Tutor/upstream exposes a source hook or bake-owned dependency install
      stage that can express the exact install contract before render.
    added_patterns:
      - '\$PIP_COMMAND install --no-build-isolation -r /openedx/edx-platform/requirements/edx/base\.txt'
    removed_patterns:
      - '\$PIP_COMMAND install -r /openedx/edx-platform/requirements/edx/base\.txt'
  - id: uwsgi-plain-pip-fallback
    authority_class: temporary_compatibility_layer
    owner: platform build authority lane
    reason: >
      The rendered production stage installs uwsgi through the shared pip command,
      but the proven build path requires a plain pip fallback for this package.
    source_markers:
      - UWSGI_UV_INSTALL
      - UWSGI_PIP_INSTALL
    retirement_trigger: >
      The uwsgi install is proven under source-owned hook, upstream image, or
      bake stage semantics without rendered-line replacement.
    added_patterns:
      - 'pip install --no-cache-dir --no-build-isolation uwsgi==2\.0\.24'
    removed_patterns:
      - '\$PIP_COMMAND install --no-cache-dir --compile uwsgi==2\.0\.24'
  - id: production-build-profile-arg
    authority_class: intentional_architecture_change
    owner: platform build authority lane
    reason: >
      The source-owned Bake profile needs a rendered Dockerfile arg/env bridge
      until proof-vs-fast build profile semantics move fully into Bake/HCL.
    source_markers:
      - PRODUCTION_BUILD_PROFILE_ARG
    retirement_trigger: >
      Bake/HCL owns proof-vs-fast build profile semantics directly and render no
      longer requires Dockerfile arg injection.
    added_patterns:
      - 'ARG MEREKA_BUILD_PROFILE=proof'
      - 'ENV PYTHONPATH=/openedx/edx-platform'
      - 'ENV NODE_OPTIONS="--max-old-space-size=6144"'
      - 'ENV REQUIRE_BUILD_PROFILE_OPTIMIZE=none'
    removed_patterns: []
  - id: translation-settings-preflight
    authority_class: intentional_architecture_change
    owner: platform build authority lane
    reason: >
      Translation discovery fails too late without a production settings import
      preflight, and Tutor exposes no source hook at this exact build point.
    source_markers:
      - TRANSLATION_SETTINGS_PREFLIGHT
    retirement_trigger: >
      Translation settings preflight becomes source-owned through a Tutor hook
      or upstream-supported build step before translation discovery.
    added_patterns:
      - 'Skipping translation settings import preflight \(fast build profile\)'
      - 'DJANGO_SETTINGS_MODULE'
      - 'translation settings import preflight ok'
    removed_patterns: []
  - id: advanced-xblocks-production-copy
    authority_class: intentional_architecture_change
    owner: platform build authority lane
    reason: >
      XBlock entry-point discovery needs repo-owned advanced XBlock source in
      the production stage before translation commands run.
    source_markers:
      - ADVANCED_XBLOCKS_PRODUCTION_COPY
    retirement_trigger: >
      XBlock source placement becomes bake/source-hook owned before translation
      discovery.
    added_patterns:
      - 'Carry openedx_advanced_xblocks into production before translation'
      - 'XBlock entry-point discovery'
      - 'venv from python-requirements'
      - 'this stage before pull_plugin_translations / compile_xblock_translations'
      - 'COPY --from=python-requirements --chown=app:app /openedx/openedx_advanced_xblocks /openedx/openedx_advanced_xblocks'
    removed_patterns: []
  - id: fast-profile-translation-wrappers
    authority_class: temporary_compatibility_layer
    owner: platform build authority lane
    reason: >
      Tutor emits translation refresh/compile commands as rendered shell lines,
      and the fast/proof profile switch cannot yet be expressed as source config.
    source_markers:
      - TRANSLATION_REFRESH
      - wrap_translation_step
    retirement_trigger: >
      Bake/HCL or a source hook owns fast/proof translation semantics without
      rendered command-line text rewrites.
    added_patterns:
      - 'MEREKA_BUILD_PROFILE'
      - 'Skipping .*translation.*fast build profile'
      - 'Skipping .*compile.*fast build profile'
      - 'translations/studio-frontend/src/i18n/messages:conf/plugins-locale/studio-frontend; fi'
      - 'mkdir -p /openedx/staticfiles/js/i18n /openedx/staticfiles/studio/js/i18n'
    removed_patterns:
      - 'RUN make clean_translations'
      - 'pull_plugin_translations'
      - 'pull_xblock_translations'
      - 'atlas pull'
      - 'translations/studio-frontend/src/i18n/messages:conf/plugins-locale/studio-frontend'
      - 'compile_xblock_translations'
      - 'compile_plugin_translations'
      - 'compilemessages -v1'
      - 'compilejsi18n'
