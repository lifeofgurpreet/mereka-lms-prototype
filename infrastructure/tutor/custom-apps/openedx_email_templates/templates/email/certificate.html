{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>{% trans "Certificate Earned" %}</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="text-align: center; padding: 20px 0;">
    {% if org_logo_url %}<img src="{{ org_logo_url }}" alt="{{ org_display_name }}" style="max-height: 60px;">{% endif %}
  </div>
  <h1 style="color: {{ org_primary_color|default:'#1a73e8' }};">{% trans "Congratulations!" %}</h1>
  <p>{% trans "Hi" %} {{ user_name }},</p>
  <p>{% trans "You have earned a certificate for completing:" %}</p>
  <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center;">
    <h2 style="margin: 0; color: {{ org_primary_color|default:'#1a73e8' }};">{{ course_name }}</h2>
  </div>
  <div style="text-align: center; margin: 30px 0;">
    <a href="{{ certificate_url }}" style="background-color: {{ org_primary_color|default:'#1a73e8' }}; color: #fff; padding: 12px 30px; text-decoration: none; border-radius: 4px;">{% trans "View Certificate" %}</a>
  </div>
  <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
  <p style="font-size: 12px; color: #666;">{{ org_display_name }}</p>
</body>
</html>
