{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>{% trans "Activate Your Account" %}</title></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="text-align: center; padding: 20px 0;">
    {% if org_logo_url %}<img src="{{ org_logo_url }}" alt="{{ org_display_name }}" style="max-height: 60px;">{% endif %}
  </div>
  <h1 style="color: {{ org_primary_color|default:'#1a73e8' }};">{% trans "Activate Your Account" %}</h1>
  <p>{% trans "Hi" %} {{ user_name }},</p>
  <p>{% trans "Please click the button below to activate your account:" %}</p>
  <div style="text-align: center; margin: 30px 0;">
    <a href="{{ activation_url }}" style="background-color: {{ org_primary_color|default:'#1a73e8' }}; color: #fff; padding: 12px 30px; text-decoration: none; border-radius: 4px;">{% trans "Activate Account" %}</a>
  </div>
  <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
  <p style="font-size: 12px; color: #666;">{{ org_display_name }}</p>
</body>
</html>
