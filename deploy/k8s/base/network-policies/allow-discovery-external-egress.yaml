# Allow discovery service to reach external course provider APIs.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-discovery-external-egress
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: discovery
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
