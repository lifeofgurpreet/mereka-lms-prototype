          port: 443

# --- Prometheus metrics: allow scraping from monitoring namespace ---
# Covers all services with ServiceMonitors in deploy/k8s/base/monitoring/.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  labels:
    app.kubernetes.io/component: network-policy
spec:
  # All pods may be scraped — scoped by ports + source namespace
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        # Application HTTP ports (LMS, CMS, discovery, credentials, notes,
        # xqueue, enterprise-catalog, enterprise-access, enterprise-subsidy,
        # license-manager, payments-gateway expose /metrics on their main port)
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8160
        - protocol: TCP
          port: 18170
        - protocol: TCP
          port: 18270
        - protocol: TCP
          port: 18280
        # Dedicated exporter / admin ports
        - protocol: TCP
          port: 9121
        - protocol: TCP
          port: 9104
        - protocol: TCP
          port: 2019
