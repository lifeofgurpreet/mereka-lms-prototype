# Allow specific pods to make outbound connections to external services.
# Only pods that genuinely need external access are whitelisted.
#
# External dependencies:
#   LMS/CMS:          MongoDB Atlas (SRV), OAuth/OIDC providers, HTTPS APIs
#   Workers:          MongoDB Atlas (SRV), external webhooks
#   Payments-gateway: Stripe API (HTTPS)
#   SMTP:             External mail relay (port 25/587)
#   Enterprise:       LMS OAuth (internal, covered by namespace-internal)

# --- LMS: needs MongoDB Atlas, OAuth, external APIs ---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lms-external-egress
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lms
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 27017

# --- CMS: same external needs as LMS ---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cms-external-egress
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cms
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 27017

