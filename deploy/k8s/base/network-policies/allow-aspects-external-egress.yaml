# Allow Aspects pods (Superset, ClickHouse) HTTPS egress for pip install and API calls.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aspects-external-egress
  labels:
    app.kubernetes.io/name: allow-aspects-external-egress
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: aspects
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
