# Allow SMTP relay pods to reach external mail servers.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smtp-external-egress
  labels:
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smtp
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 587
