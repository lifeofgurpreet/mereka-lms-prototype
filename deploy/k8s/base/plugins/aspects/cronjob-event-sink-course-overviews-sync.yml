---
# CronJob to refresh event_sink.course_overviews separately from the core
# dimension sync. This isolates the modulestore/Mongo-dependent path so it
# cannot block the higher-frequency core dimensional refresh job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aspects-event-sink-course-overviews-sync
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: aspects-event-sink-course-overviews-sync
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: aspects
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: aspects-event-sink-course-overviews-sync
        app.kubernetes.io/component: job
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: aspects-event-sink-course-overviews-sync
            app.kubernetes.io/component: pod
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          activeDeadlineSeconds: 1800
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/biji-biji-initiative/mereka-lms/openedx:pin-required
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  CLICKHOUSE_URL="http://${ASPECTS_CLICKHOUSE_HOST}:${ASPECTS_CLICKHOUSE_PORT}"

                  echo "=== Aspects course_overviews sync - $(date -u) ==="
                  timeout 20m python manage.py lms dump_data_to_clickhouse \
                    --object course_overviews \
                    --url "${CLICKHOUSE_URL}" \
                    --username "${ASPECTS_CLICKHOUSE_USER}" \
                    --password "${ASPECTS_CLICKHOUSE_PASSWORD}" \
                    --database "${ASPECTS_CLICKHOUSE_DATABASE}" \
                    --batch_size 1000 \
                    --sleep_time 0 \
                    --force
                  echo "=== Aspects course_overviews sync complete ==="
              env:
                - name: SERVICE_VARIANT
                  value: lms
                - name: DJANGO_SETTINGS_MODULE
                  value: lms.envs.tutor.production
                - name: MONGODB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: FORUM_MONGODB_HOST
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: JWT_SECRET_KEY_LMS
                - name: ASPECTS_CLICKHOUSE_HOST
                  value: clickhouse
                - name: ASPECTS_CLICKHOUSE_PORT
                  value: "8123"
                - name: ASPECTS_CLICKHOUSE_USER
                  value: openedx
                - name: ASPECTS_CLICKHOUSE_DATABASE
                  value: event_sink
                - name: ASPECTS_CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aspects-secrets
                      key: clickhouse-password
              envFrom:
                - secretRef:
                    name: openedx-secrets
                - secretRef:
                    name: enterprise-sso-secrets
                    optional: true
                - secretRef:
                    name: database-secrets
                - secretRef:
                    name: mereka-lms-runtime-secrets
                    optional: true
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: settings-lms
                  mountPath: /openedx/edx-platform/lms/envs/tutor/
                - name: settings-cms
                  mountPath: /openedx/edx-platform/cms/envs/tutor/
                - name: config
                  mountPath: /openedx/config
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: settings-lms
              configMap:
                name: openedx-settings-lms
            - name: settings-cms
              configMap:
                name: openedx-settings-cms
            - name: config
              configMap:
                name: openedx-config
            - name: tmp
              emptyDir: {}
