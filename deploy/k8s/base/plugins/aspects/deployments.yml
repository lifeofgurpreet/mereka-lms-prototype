---
# ClickHouse - Analytics Data Warehouse
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: aspects
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate  # ClickHouse uses persistent storage
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/part-of: aspects
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: aspects
        app.kubernetes.io/managed-by: kustomize
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: clickhouse
          image: docker.io/clickhouse/clickhouse-server:25.8-alpine
          ports:
            - containerPort: 8123  # HTTP interface
              name: http
            - containerPort: 9000  # Native interface
              name: native
          env:
            - name: CLICKHOUSE_DB
              value: openedx
            - name: CLICKHOUSE_USER
              value: openedx
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: clickhouse-password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/logging.xml
              subPath: logging.xml
            - name: config
              mountPath: /etc/clickhouse-server/config.d/network.xml
              subPath: network.xml
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data
        - name: config
          configMap:
            name: clickhouse-config
---
# Superset - Analytics Visualization
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  labels:
    app.kubernetes.io/name: superset
    app.kubernetes.io/part-of: aspects
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superset
      app.kubernetes.io/part-of: aspects
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset
        app.kubernetes.io/part-of: aspects
        app.kubernetes.io/managed-by: kustomize
    spec:
      # Disable automatic service environment variables to avoid conflicts
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: docker.io/busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 2; done']
      containers:
        - name: superset
          image: docker.io/edunext/aspects-superset:3.0.3
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: PYTHONPATH
              value: "/app/pythonpath"
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: superset-secret-key
            - name: DATABASE_HOST
              value: mysql
            - name: SUPERSET_DB_PORT
              value: "3306"
            - name: DATABASE_DB
              value: superset
            - name: DATABASE_USER
              value: superset
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: superset-db-password
            - name: REDIS_HOST
              value: redis
            - name: SUPERSET_REDIS_PORT
              value: "6379"
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_USER
              value: openedx
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: clickhouse-password
            # OAuth2 with Authentik (optional - comment out if not using SSO)
            - name: OAUTH_CLIENT_ID
              value: "superset-analytics"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: oauth-client-secret
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/pythonpath/
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: superset-config
---
# Superset Worker - Background Tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-worker
  labels:
    app.kubernetes.io/name: superset-worker
    app.kubernetes.io/part-of: aspects
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superset-worker
      app.kubernetes.io/part-of: aspects
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset-worker
        app.kubernetes.io/part-of: aspects
        app.kubernetes.io/managed-by: kustomize
    spec:
      # Disable automatic service environment variables to avoid conflicts
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: docker.io/edunext/aspects-superset:3.0.3
          command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "-O", "fair", "-c", "2"]
          env:
            - name: PYTHONPATH
              value: "/app/pythonpath"
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: superset-secret-key
            - name: DATABASE_HOST
              value: mysql
            - name: SUPERSET_DB_PORT
              value: "3306"
            - name: DATABASE_DB
              value: superset
            - name: DATABASE_USER
              value: superset
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: superset-db-password
            - name: REDIS_HOST
              value: redis
            - name: SUPERSET_REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: config
              mountPath: /app/pythonpath/
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: superset-config
