---
# CronJob for scheduled sync (runs daily at 2 AM)
# Populates ClickHouse from MySQL: enrollments, completions, courses
# To trigger manually: kubectl create job --from=cronjob/clickhouse-data-sync-daily manual-sync -n <namespace>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-data-sync-daily
  labels:
    app.kubernetes.io/name: clickhouse-sync
    app.kubernetes.io/part-of: aspects
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-sync
            app.kubernetes.io/part-of: aspects
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: sync
              image: docker.io/edunext/aspects-superset:3.0.3
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  python3 << 'PYTHON_SCRIPT'
                  import os, MySQLdb, clickhouse_connect

                  mc = MySQLdb.connect(
                      host=os.environ.get('MYSQL_HOST', 'mysql'),
                      port=int(os.environ.get('MYSQL_PORT', 3306)),
                      user=os.environ.get('MYSQL_USER', 'openedx'),
                      passwd=os.environ.get('MYSQL_PASSWORD', ''),
                      db=os.environ.get('MYSQL_DATABASE', 'openedx')
                  )
                  ch = clickhouse_connect.get_client(
                      host=os.environ.get('CLICKHOUSE_HOST', 'clickhouse'),
                      port=int(os.environ.get('CLICKHOUSE_PORT', 8123)),
                      username=os.environ.get('CLICKHOUSE_USER', 'openedx'),
                      password=os.environ.get('CLICKHOUSE_PASSWORD', '')
                  )
                  cur = mc.cursor()

                  # Sync Enrollments
                  print("Syncing enrollments...")
                  cur.execute("""
                      SELECT id, user_id, course_id,
                             SUBSTRING_INDEX(course_id, ':', 1) as org_id,
                             created, is_active, mode
                      FROM student_courseenrollment
                  """)
                  rows = cur.fetchall()
                  print(f"Found {len(rows)} enrollments")
                  if rows:
                      ch.command("TRUNCATE TABLE IF EXISTS openedx.enrollments")
                      data = [[r[0], r[1], r[2],
                               (r[3] or "").replace("course-v1", ""),
                               r[4], 1 if r[5] else 0, r[6] or "audit"]
                              for r in rows]
                      ch.insert("openedx.enrollments", data,
                          column_names=["enrollment_id", "user_id", "course_id", "org_id",
                                        "enrollment_date", "is_active", "mode"])
                      print(f"Synced {len(data)} enrollments")

                  # Sync Completions
                  print("Syncing completions...")
                  cur.execute("""
                      SELECT user_id, course_key, block_key, block_type, completion, modified
                      FROM completion_blockcompletion
                  """)
                  rows = cur.fetchall()
                  print(f"Found {len(rows)} completions")
                  if rows:
                      ch.command("TRUNCATE TABLE IF EXISTS openedx.completions")
                      data = [[r[0], r[1], r[2], r[3] or "",
                               float(r[4]) if r[4] else 0.0, r[5]]
                              for r in rows]
                      ch.insert("openedx.completions", data,
                          column_names=["user_id", "course_id", "block_id", "block_type",
                                        "completion", "completed_at"])
                      print(f"Synced {len(data)} completions")

                  # Sync Courses
                  print("Syncing courses...")
                  cur.execute("""
                      SELECT id, org, display_name, start, end,
                             enrollment_start, enrollment_end, created, modified
                      FROM course_overviews_courseoverview
                  """)
                  rows = cur.fetchall()
                  print(f"Found {len(rows)} courses")
                  if rows:
                      ch.command("""
                          CREATE TABLE IF NOT EXISTS openedx.courses (
                              course_id String, org String, display_name String,
                              start_date Nullable(DateTime), end_date Nullable(DateTime),
                              enrollment_start Nullable(DateTime), enrollment_end Nullable(DateTime),
                              created DateTime, modified DateTime
                          ) ENGINE = ReplacingMergeTree(modified) ORDER BY course_id
                      """)
                      ch.command("TRUNCATE TABLE IF EXISTS openedx.courses")
                      data = [[r[0], r[1] or "", r[2] or "", r[3], r[4],
                               r[5], r[6], r[7], r[8]] for r in rows]
                      ch.insert("openedx.courses", data,
                          column_names=["course_id", "org", "display_name", "start_date",
                                        "end_date", "enrollment_start", "enrollment_end",
                                        "created", "modified"])
                      print(f"Synced {len(data)} courses")

                  # Summary
                  for t in ["enrollments", "completions", "courses"]:
                      r = ch.query(f"SELECT count() FROM openedx.{t}")
                      print(f"{t}: {r.result_rows[0][0]}")
                  print("Daily sync completed!")
                  PYTHON_SCRIPT
              env:
                - name: MYSQL_HOST
                  value: mysql
                - name: MYSQL_PORT
                  value: "3306"
                - name: MYSQL_USER
                  value: openedx
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-secrets
                      key: OPENEDX_MYSQL_PASSWORD
                - name: MYSQL_DATABASE
                  value: openedx
                - name: CLICKHOUSE_HOST
                  value: clickhouse
                - name: CLICKHOUSE_PORT
                  value: "8123"
                - name: CLICKHOUSE_USER
                  value: openedx
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aspects-secrets
                      key: clickhouse-password
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "1"
