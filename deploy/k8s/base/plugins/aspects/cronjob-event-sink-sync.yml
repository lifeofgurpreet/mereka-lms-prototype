---
# CronJob definition for event_sink dimensional refresh.
#
# Suspended by default: `dump_data_to_clickhouse --force` appends new snapshots
# into raw event_sink tables, and several downstream tables are not raw-row
# idempotent under periodic re-dumps. Use manual one-off jobs only until an
# idempotent sync contract exists for scheduled execution.
#
# This job is intentionally explicit:
# - It uses the same settings/config/secret surface as the LMS deployment.
# - It passes ClickHouse connection details directly so it does not depend on
#   optional LMS runtime env wiring that may be disabled in shared environments.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aspects-event-sink-sync
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: aspects-event-sink-sync
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: aspects
spec:
  schedule: "0 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: aspects-event-sink-sync
        app.kubernetes.io/component: job
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: aspects-event-sink-sync
            app.kubernetes.io/component: pod
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/biji-biji-initiative/mereka-lms/openedx:pin-required
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  CLICKHOUSE_URL="http://${ASPECTS_CLICKHOUSE_HOST}:${ASPECTS_CLICKHOUSE_PORT}"
                  OBJECTS=(
                    external_id
                    course_overviews
                    user_profile
                    course_enrollment
                    tag
                    taxonomy
                    object_tag
                  )

                  echo "=== Aspects event_sink sync - $(date -u) ==="
                  for object_name in "${OBJECTS[@]}"; do
                    echo "--- syncing ${object_name} ---"
                    python manage.py lms dump_data_to_clickhouse \
                      --object "${object_name}" \
                      --url "${CLICKHOUSE_URL}" \
                      --username "${ASPECTS_CLICKHOUSE_USER}" \
                      --password "${ASPECTS_CLICKHOUSE_PASSWORD}" \
                      --database "${ASPECTS_CLICKHOUSE_DATABASE}" \
                      --batch_size 1000 \
                      --sleep_time 0 \
                      --force
                  done
                  echo "=== Aspects event_sink sync complete ==="
              env:
                - name: SERVICE_VARIANT
                  value: lms
                - name: DJANGO_SETTINGS_MODULE
                  value: lms.envs.tutor.production
                - name: MONGODB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: FORUM_MONGODB_HOST
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: JWT_SECRET_KEY_LMS
                - name: ASPECTS_CLICKHOUSE_HOST
                  value: clickhouse
                - name: ASPECTS_CLICKHOUSE_PORT
                  value: "8123"
                - name: ASPECTS_CLICKHOUSE_USER
                  value: openedx
                - name: ASPECTS_CLICKHOUSE_DATABASE
                  value: event_sink
                - name: ASPECTS_CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aspects-secrets
                      key: clickhouse-password
              envFrom:
                - secretRef:
                    name: openedx-secrets
                - secretRef:
                    name: enterprise-sso-secrets
                    optional: true
                - secretRef:
                    name: database-secrets
                - secretRef:
                    name: mereka-lms-runtime-secrets
                    optional: true
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: settings-lms
                  mountPath: /openedx/edx-platform/lms/envs/tutor/
                - name: settings-cms
                  mountPath: /openedx/edx-platform/cms/envs/tutor/
                - name: config
                  mountPath: /openedx/config
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: settings-lms
              configMap:
                name: openedx-settings-lms
            - name: settings-cms
              configMap:
                name: openedx-settings-cms
            - name: config
              configMap:
                name: openedx-config
            - name: tmp
              emptyDir: {}
