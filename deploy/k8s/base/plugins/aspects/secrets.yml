---
# IMPORTANT: This file contains placeholder values.
# Replace with actual secrets before deploying, or use kubectl create secret.
#
# To create secrets manually:
#   kubectl create secret generic aspects-secrets -n mereka-lms \
#     --from-literal=clickhouse-password='YOUR_CLICKHOUSE_PASSWORD' \
#     --from-literal=superset-secret-key='YOUR_SUPERSET_SECRET_KEY' \
#     --from-literal=superset-db-password='YOUR_SUPERSET_DB_PASSWORD'
#
apiVersion: v1
kind: Secret
metadata:
  name: aspects-secrets
  labels:
    app.kubernetes.io/part-of: aspects
type: Opaque
stringData:
  # ClickHouse password for the 'openedx' user
  clickhouse-password: "CHANGE_ME_clickhouse_password"
  # Superset secret key for session encryption (generate with: openssl rand -hex 32)
  superset-secret-key: "CHANGE_ME_superset_secret_key"
  # Superset MySQL database password
  superset-db-password: "CHANGE_ME_superset_db_password"
