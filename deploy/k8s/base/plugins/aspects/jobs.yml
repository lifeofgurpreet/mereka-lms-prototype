---
# Superset database initialization job
# Run this ONCE after first deployment to set up the database schema and admin user
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init
  labels:
    app.kubernetes.io/name: superset-init
    app.kubernetes.io/part-of: aspects
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superset-init
        app.kubernetes.io/part-of: aspects
    spec:
      restartPolicy: OnFailure
      # Disable automatic service environment variables to avoid conflicts
      enableServiceLinks: false
      # Kyverno require-non-root-security-context compliance
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: docker.io/busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 2; done']
      containers:
        - name: init
          image: docker.io/edunext/aspects-superset:3.0.3
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== Creating Superset database if not exists ==="
              superset db upgrade
              echo "=== Creating admin user ==="
              superset fab create-admin \
                --username admin \
                --firstname Admin \
                --lastname User \
                --email admin@openedx.org \
                --password admin || echo "Admin user may already exist"
              echo "=== Initializing Superset ==="
              superset init
              echo "=== Setup complete ==="
          env:
            - name: PYTHONPATH
              value: "/app/pythonpath"
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: superset-secret-key
            - name: DATABASE_HOST
              value: mysql
            - name: SUPERSET_DB_PORT
              value: "3306"
            - name: DATABASE_DB
              value: superset
            - name: DATABASE_USER
              value: superset
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: superset-db-password
            - name: REDIS_HOST
              value: redis
            - name: SUPERSET_REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: config
              mountPath: /app/pythonpath/
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: superset-config
---
# ClickHouse database initialization job
# Creates the openedx database and tables for event tracking
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  labels:
    app.kubernetes.io/name: clickhouse-init
    app.kubernetes.io/part-of: aspects
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-init
        app.kubernetes.io/part-of: aspects
    spec:
      restartPolicy: OnFailure
      # Kyverno require-non-root-security-context compliance
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-clickhouse
          image: docker.io/busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until nc -z clickhouse 8123; do echo "Waiting for ClickHouse..."; sleep 2; done']
      containers:
        - name: init
          image: docker.io/clickhouse/clickhouse-server:25.8-alpine
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== Initializing ClickHouse databases ==="
              clickhouse-client --host clickhouse --user openedx --password "${CLICKHOUSE_PASSWORD}" --query "
              CREATE DATABASE IF NOT EXISTS openedx;
              "
              clickhouse-client --host clickhouse --user openedx --password "${CLICKHOUSE_PASSWORD}" --query "
              CREATE DATABASE IF NOT EXISTS xapi;
              "
              echo "=== Creating xapi_events_all table (Ralph target) ==="
              clickhouse-client --host clickhouse --user openedx --password "${CLICKHOUSE_PASSWORD}" --query "
              CREATE TABLE IF NOT EXISTS xapi.xapi_events_all (
                event_id UUID DEFAULT generateUUIDv4(),
                emission_time DateTime64(6) DEFAULT now64(6),
                event String
              ) ENGINE = MergeTree()
              ORDER BY (emission_time, event_id);
              "
              echo "=== Creating xAPI events table ==="
              clickhouse-client --host clickhouse --user openedx --password "${CLICKHOUSE_PASSWORD}" --query "
              CREATE TABLE IF NOT EXISTS openedx.xapi_events (
                event_id UUID DEFAULT generateUUIDv4(),
                actor_id String,
                actor_name String,
                verb_id String,
                verb_display String,
                object_id String,
                object_type String,
                course_id String,
                org_id String,
                timestamp DateTime64(3),
                received_at DateTime64(3) DEFAULT now64(3),
                raw_event String
              ) ENGINE = MergeTree()
              PARTITION BY toYYYYMM(timestamp)
              ORDER BY (org_id, course_id, timestamp, event_id);
              "
              echo "=== Creating enrollments table ==="
              clickhouse-client --host clickhouse --user openedx --password "${CLICKHOUSE_PASSWORD}" --query "
              CREATE TABLE IF NOT EXISTS openedx.enrollments (
                enrollment_id UInt64,
                user_id UInt64,
                course_id String,
                org_id String,
                enrollment_date DateTime,
                is_active UInt8,
                mode String,
                updated_at DateTime DEFAULT now()
              ) ENGINE = ReplacingMergeTree(updated_at)
              PARTITION BY toYYYYMM(enrollment_date)
              ORDER BY (org_id, course_id, user_id);
              "
              echo "=== Creating completions table ==="
              clickhouse-client --host clickhouse --user openedx --password "${CLICKHOUSE_PASSWORD}" --query "
              CREATE TABLE IF NOT EXISTS openedx.completions (
                user_id UInt64,
                course_id String,
                block_id String,
                block_type String,
                completion Float32,
                completed_at DateTime,
                updated_at DateTime DEFAULT now()
              ) ENGINE = ReplacingMergeTree(updated_at)
              PARTITION BY toYYYYMM(completed_at)
              ORDER BY (course_id, user_id, block_id);
              "
              echo "=== ClickHouse initialization complete ==="
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aspects-secrets
                  key: clickhouse-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
