# Container hardening patch for enterprise services, portal MFEs, and ancillary services.
# Applied via patches in kustomization.yaml alongside container-hardening.yaml.
#
# Design notes:
# - Pod-level securityContext: runAsNonRoot + seccompProfile (RuntimeDefault)
# - Container-level on ALL containers (init + main): allowPrivilegeEscalation: false,
#   capabilities.drop: ["ALL"]
# - readOnlyRootFilesystem is NOT set: enterprise services write config YAML to an
#   emptyDir volume at runtime (config-gen init container), and portal MFEs (Caddy)
#   need filesystem write access for socket/tmp paths.
# - No new volumeMounts or volumes: all services already have /config emptyDir volumes.
#
# T087 — Container hardening (non-root, read-only FS, seccomp) — enterprise extension
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-catalog
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-gen
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: migrate
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: enterprise-catalog
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
