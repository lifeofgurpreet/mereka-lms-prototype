# Container hardening patch — applied via patchesStrategicMerge in kustomization.yaml
# Enforces non-root, read-only root filesystem, dropped capabilities, and RuntimeDefault
# seccomp profile for all LMS Deployments.
#
# Design notes:
# - Pod-level securityContext adds runAsNonRoot + seccompProfile (RuntimeDefault)
# - Container-level securityContext adds allowPrivilegeEscalation: false,
#   readOnlyRootFilesystem: true, and capabilities.drop: ["ALL"]
# - emptyDir volumes are added for any writable paths not already served by PVCs
# - mfe is exempt from readOnlyRootFilesystem because its entrypoint creates
#   symlinks inside /openedx/dist (image filesystem) at runtime
# - mysql mysqld-exporter and redis-exporter sidecar containers are hardened inline
#
# T087 — Container hardening (non-root, read-only FS, seccomp)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lms
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /openedx/data
              name: openedx-data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: openedx-data
          emptyDir: {}
