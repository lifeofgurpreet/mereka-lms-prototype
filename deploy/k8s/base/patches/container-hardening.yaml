---
# mysql: mysqld requires /var/run/mysqld for socket + /tmp for temp files.
# /var/lib/mysql is already a PVC. readOnlyRootFilesystem is set; writable
# paths provided via emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/mysqld
              name: mysqld-run
        - name: mysqld-exporter
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mysqld-run
          emptyDir: {}
---
