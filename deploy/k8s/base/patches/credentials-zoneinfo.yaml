apiVersion: apps/v1
kind: Deployment
metadata:
  name: credentials
spec:
  template:
    spec:
      initContainers:
        - name: seed-zoneinfo
          image: debian:12-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a
          command:
            - /bin/sh
            - -c
            - cp -a /usr/share/zoneinfo/. /zoneinfo/
          volumeMounts:
            - name: zoneinfo
              mountPath: /zoneinfo
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: credentials
          env:
            - name: TZ
              value: UTC
            - name: PYTHONTZPATH
              value: /zoneinfo
          volumeMounts:
            - name: zoneinfo
              mountPath: /zoneinfo
              readOnly: true
      volumes:
        - name: zoneinfo
          emptyDir: {}
