apiVersion: apps/v1
kind: Deployment
metadata:
  name: credentials
spec:
  template:
    spec:
      initContainers:
        - name: seed-zoneinfo
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - cp -a /usr/share/zoneinfo/. /zoneinfo/
          volumeMounts:
            - name: zoneinfo
              mountPath: /zoneinfo
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: credentials
          env:
            - name: TZ
              value: UTC
            - name: PYTHONTZPATH
              value: /zoneinfo
          volumeMounts:
            - name: zoneinfo
              mountPath: /zoneinfo
              readOnly: true
      volumes:
        - name: zoneinfo
          emptyDir: {}
