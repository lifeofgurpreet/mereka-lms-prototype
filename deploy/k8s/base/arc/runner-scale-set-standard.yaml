---
# Standard RunnerScaleSet — label: mereka-k8s-runners
#
# Purpose: linting, spec verification, cron audits, lightweight checks.
# These workloads need a clean Ubuntu environment but not Docker-in-Docker
# or heavy RAM. Pods are ephemeral — destroyed after each job.
#
# Usage in workflows:
#   jobs:
#     my-job:
#       runs-on: mereka-k8s-runners
#
# Ref: https://github.com/actions/actions-runner-controller/blob/main/docs/scale-set-runner.md
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: mereka-k8s-runners
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: mereka-k8s-runners
    app.kubernetes.io/component: runner-scale-set
    app.kubernetes.io/part-of: mereka-ci
    runner-tier: standard
spec:
  # GitHub App credentials — stored as a K8s Secret in arc-runners namespace.
  # Secret must be created manually before deploying (see CI_CD_RUNNERS.md).
  githubConfigUrl: https://github.com/Biji-Biji-Initiative
  githubConfigSecret: arc-github-app-secret

  # Scale bounds: 0 idle runners (no cost at rest), burst to 10 for parallel jobs.
  minRunners: 0
  maxRunners: 10

  # Runner pod template — ubuntu-22.04 equivalent (actions/runner image).
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mereka-k8s-runners
        app.kubernetes.io/component: runner-pod
        app.kubernetes.io/part-of: mereka-ci
        runner-tier: standard
    spec:
      # Ephemeral: each runner pod serves exactly one job then terminates.
      # ARC enforces this via the runner lifecycle; this label is for clarity.
      automountServiceAccountToken: false

      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.321.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNNER_TOOL_CACHE
              value: /opt/hostedtoolcache
            - name: RUNNER_WORK_DIR
              value: /runner/_work
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /runner/_work

      volumes:
        # emptyDir work dir — destroyed when pod terminates (clean env guarantee)
        - name: work
          emptyDir: {}

      # Schedule standard runners on any available node (no heavy resource contention)
      tolerations: []
