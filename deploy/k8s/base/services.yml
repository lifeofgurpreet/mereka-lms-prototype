
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/component: loadbalancer
spec:
  # Ingress terminates TLS; Caddy stays internal.
  type: ClusterIP
  ports:
    - port: 80
      name: http
    - port: 443
      name: https
  selector:
    app.kubernetes.io/name: caddy

