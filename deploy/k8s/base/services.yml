---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/component: loadbalancer
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/managed-by: tutor
spec:
  # Ingress terminates TLS; Caddy stays internal.
  type: ClusterIP
  ports:
    - port: 80
      name: http
    - port: 443
      name: https
    - port: 2019
      name: metrics
  selector:
    app.kubernetes.io/name: caddy

---
apiVersion: v1
kind: Service
metadata:
  name: cms
  labels:
    app.kubernetes.io/name: cms
spec:
  type: ClusterIP
  ports:
    - port: 8000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cms
---
apiVersion: v1
kind: Service
metadata:
  name: lms
  labels:
    app.kubernetes.io/name: lms
spec:
  type: ClusterIP
  ports:
    - port: 8000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: lms

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  type: ClusterIP
  ports:
    - port: 9200
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
    - name: metrics
      port: 9104
      targetPort: 9104
      protocol: TCP
  selector:
    app.kubernetes.io/name: mysql
---
# NOTE: MongoDB is provided by Atlas (cluster-mereka-lms.2pjex4s.mongodb.net).
# There are no in-cluster mongodb pods — this Service has no backing Endpoints.
# Production removes it via patches/remove-legacy-mongodb-service.yaml.
# Kept here so local/dev overlays that don't apply that patch don't break
# references; Atlas connection strings are set via environment variables.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      protocol: TCP
  selector:
    app.kubernetes.io/name: mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
    - name: metrics
      port: 9121
      targetPort: 9121
      protocol: TCP
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: smtp
  labels:
    app.kubernetes.io/name: smtp
spec:
  type: ClusterIP
  ports:
    - port: 8025
      protocol: TCP
  selector:
    app.kubernetes.io/name: smtp

