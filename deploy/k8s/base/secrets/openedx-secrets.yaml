# OpenEdX Secrets - Populated via ExternalSecret or manually
# DO NOT commit actual values - use sealed secrets or external secrets operator
apiVersion: v1
kind: Secret
metadata:
  name: openedx-secrets
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: openedx
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # LMS/CMS Core Secrets (generate unique 50-char keys)
  OPENEDX_SECRET_KEY: ""
  CMS_SECRET_KEY: ""

  # JWT Secrets (MUST be unique per service)
  JWT_SECRET_KEY_LMS: ""
  JWT_SECRET_KEY_CMS: ""
  JWT_SECRET_KEY_DISCOVERY: ""
  JWT_SECRET_KEY_ECOMMERCE: ""
  JWT_SECRET_KEY_NOTES: ""
  JWT_SECRET_KEY_XQUEUE: ""

  # API Keys
  EDX_API_KEY: ""

  # Service-specific secrets
  DISCOVERY_SECRET_KEY: ""
  DISCOVERY_SOCIAL_AUTH_EDX_OAUTH2_SECRET: ""
  DISCOVERY_BACKEND_OAUTH2_SECRET: ""
  ECOMMERCE_SECRET_KEY: ""
  ECOMMERCE_SOCIAL_AUTH_EDX_OAUTH2_SECRET: ""
  ECOMMERCE_BACKEND_OAUTH2_SECRET: ""
  ECOMMERCE_EDX_API_KEY: ""
  ECOMMERCE_API_SIGNING_KEY: ""
  NOTES_SECRET_KEY: ""
  NOTES_CLIENT_SECRET: ""
  XQUEUE_SECRET_KEY: ""
  XQUEUE_LMS_PASSWORD: ""
  CMS_SOCIAL_AUTH_EDX_OAUTH2_SECRET: ""

  # MongoDB (Atlas)
  MONGODB_USERNAME: ""
  MONGODB_PASSWORD: ""
  # Forum v2 (Python) - MongoDB connection for in-process forum
  FORUM_MONGODB_HOST: ""
  FORUM_MONGODB_PASSWORD: ""
  # Meilisearch (forum search engine)
  MEILISEARCH_MASTER_KEY: ""
  MEILISEARCH_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: openedx
    app.kubernetes.io/component: database
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ""
  OPENEDX_MYSQL_PASSWORD: ""
  MYSQL_DISCOVERY_PASSWORD: ""
  MYSQL_ECOMMERCE_PASSWORD: ""
  MYSQL_NOTES_PASSWORD: ""
  MYSQL_XQUEUE_PASSWORD: ""
