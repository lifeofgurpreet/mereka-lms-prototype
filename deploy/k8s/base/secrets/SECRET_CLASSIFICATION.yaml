  - key: MEREKA_LMS_SENTRY_PROFILES_SAMPLE_RATE
    class: env_unique
    notes: "Sentry profile sample rate; typically lower in prod than dev/staging"

  # ── Mux Video ────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_MUX_TOKEN_ID
    class: env_unique
    notes: "Mux API token ID; separate Mux environments (or test/live token pairs) per env"

  - key: MEREKA_LMS_MUX_TOKEN_SECRET
    class: env_unique
    notes: "Mux API token secret; paired with token ID, unique per environment"

  # ── Email / SES ───────────────────────────────────────────────────────────

  - key: MEREKA_LMS_EMAIL_HOST_USER
