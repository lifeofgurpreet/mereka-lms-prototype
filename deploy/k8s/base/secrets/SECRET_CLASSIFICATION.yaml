# Secret Classification Registry
# Each secret referenced by ExternalSecrets is classified to prevent
# cross-environment copying and ensure correct lifecycle management.
#
# Categories:
#   env_unique: MUST differ per environment. Never copy between envs.
#   shared_by_design: Intentionally identical across envs (document why).
#   generated_at_deploy: Produced by init/config flows, preserved thereafter.
#
# Source: all deploy/** and services/** ExternalSecret manifests
# Total unique remoteRef.key values: 81
# Last verified: 2026-03-06

secrets:
  # ── LMS/CMS Core ─────────────────────────────────────────────────────────

  - key: MEREKA_LMS_OPENEDX_SECRET_KEY
    class: env_unique
    notes: "Django SECRET_KEY for LMS; unique per environment"

  - key: MEREKA_LMS_CMS_SECRET_KEY
    class: env_unique
    notes: "Django SECRET_KEY for CMS/Studio; unique per environment"

  # ── MongoDB Atlas ─────────────────────────────────────────────────────────

  - key: MEREKA_LMS_MONGODB_USERNAME
    class: env_unique
    notes: "MongoDB Atlas username; each env has its own Atlas cluster or user"

  - key: MEREKA_LMS_MONGODB_PASSWORD
    class: env_unique
    notes: "MongoDB Atlas password; unique per environment"

  - key: MEREKA_LMS_FORUM_MONGODB_SRV
    class: env_unique
    notes: "SRV connection string for Forum v2 MongoDB; env-specific Atlas cluster"

  # ── Meilisearch ───────────────────────────────────────────────────────────

  - key: MEREKA_LMS_MEILISEARCH_MASTER_KEY
    class: env_unique
    notes: "Meilisearch master key; unique per environment instance"

  - key: MEREKA_LMS_MEILISEARCH_API_KEY
    class: env_unique
    notes: "Meilisearch API key derived from master key; unique per environment"

  # ── JWT Secrets ───────────────────────────────────────────────────────────

  - key: MEREKA_LMS_JWT_SECRET_KEY
    class: env_unique
    notes: "JWT HMAC signing key for LMS; unique per environment"

  - key: MEREKA_LMS_JWT_SECRET_KEY_CMS
    class: env_unique
    notes: "JWT HMAC signing key for CMS; unique per environment"

  - key: MEREKA_LMS_JWT_SECRET_KEY_DISCOVERY
    class: env_unique
    notes: "JWT HMAC signing key for Discovery service; unique per environment"

  - key: MEREKA_LMS_JWT_SECRET_KEY_NOTES
    class: env_unique
    notes: "JWT HMAC signing key for Notes service; unique per environment"

  - key: MEREKA_LMS_JWT_SECRET_KEY_XQUEUE
    class: env_unique
    notes: "JWT HMAC signing key for XQueue; unique per environment"

  - key: MEREKA_LMS_JWT_PRIVATE_SIGNING_JWK
    class: env_unique
    notes: "RSA private key JWK for JWT asymmetric signing; unique per environment"

  - key: MEREKA_LMS_JWT_SECRET_KEY_CREDENTIALS
    class: env_unique
    notes: "JWT HMAC signing key for Credentials service; unique per environment"

  # ── API Keys ──────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_EDX_API_KEY
    class: env_unique
    notes: "Internal edX API key used for service-to-service auth; unique per environment"

  # ── Discovery ─────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_DISCOVERY_SECRET_KEY
    class: env_unique
    notes: "Django SECRET_KEY for Discovery service; unique per environment"

  - key: MEREKA_LMS_DISCOVERY_OAUTH2_SECRET
    class: env_unique
    notes: "OAuth2 client secret for Discovery SSO; registered per-env in LMS"

  - key: MEREKA_LMS_DISCOVERY_BACKEND_OAUTH2_SECRET
    class: env_unique
    notes: "OAuth2 backend client secret for Discovery; registered per-env in LMS"

  # ── Notes ─────────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_NOTES_SECRET_KEY
    class: env_unique
    notes: "Django SECRET_KEY for Notes service; unique per environment"

  - key: MEREKA_LMS_NOTES_CLIENT_SECRET
    class: env_unique
    notes: "OAuth2 client secret for Notes; registered per-env in LMS"

  # ── XQueue ───────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_XQUEUE_SECRET_KEY
    class: env_unique
    notes: "Django SECRET_KEY for XQueue; unique per environment"

  - key: MEREKA_LMS_XQUEUE_PASSWORD
    class: env_unique
    notes: "Password for XQueue LMS service account; unique per environment"

  # ── CMS OAuth2 ────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_CMS_OAUTH2_SECRET
    class: env_unique
    notes: "OAuth2 client secret for CMS SSO; registered per-env in LMS"

  # ── OIDC (Authentik) ──────────────────────────────────────────────────────

  - key: MEREKA_LMS_OIDC_CLIENT_SECRET
