    notes: "Stripe webhook signing secret; unique per registered webhook endpoint per env"

  # ── Sentry ────────────────────────────────────────────────────────────────

  - key: MEREKA_LMS_SENTRY_DSN
    class: env_unique
    notes: "Sentry DSN; typically unique per environment (separate Sentry projects or envs)"

  - key: MEREKA_LMS_SENTRY_ENVIRONMENT
