# ExternalSecret for OpenEdX - Syncs from GCP Secret Manager
# Infisical is the source of truth, synced to GCP SM, then to K8s
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openedx-secrets
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: openedx-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openedx-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # LMS/CMS Core Secrets
    - secretKey: OPENEDX_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OPENEDX_SECRET_KEY
        metadataPolicy: None
    - secretKey: SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OPENEDX_SECRET_KEY
        metadataPolicy: None
    - secretKey: CMS_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CMS_SECRET_KEY
        metadataPolicy: None

    # MongoDB Atlas
    - secretKey: MONGODB_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MONGODB_USERNAME
        metadataPolicy: None
    - secretKey: MONGODB_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MONGODB_PASSWORD
        metadataPolicy: None
    # Forum v2 (Python) - MongoDB connection for in-process forum.
    # The SRV-style value is stored in Infisical/GCP as MEREKA_LMS_FORUM_MONGODB_SRV,
    # but Open edX expects it as a host/URI at FORUM_MONGODB_HOST.
    - secretKey: FORUM_MONGODB_HOST
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_FORUM_MONGODB_SRV
        metadataPolicy: None
    - secretKey: FORUM_MONGODB_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MONGODB_PASSWORD
        metadataPolicy: None
    # Meilisearch (forum search engine)
    - secretKey: MEILISEARCH_MASTER_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MEILISEARCH_MASTER_KEY
        metadataPolicy: None
    - secretKey: MEILISEARCH_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MEILISEARCH_API_KEY
        metadataPolicy: None

    # JWT Secrets (unique per service)
    - secretKey: JWT_SECRET_KEY_LMS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_CMS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_CMS
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_DISCOVERY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_DISCOVERY
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_NOTES
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_NOTES
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_XQUEUE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_XQUEUE
        metadataPolicy: None
    - secretKey: JWT_PRIVATE_SIGNING_JWK
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_PRIVATE_SIGNING_JWK
        metadataPolicy: None

    # API Keys
    - secretKey: EDX_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EDX_API_KEY
        metadataPolicy: None
    # Service-specific secrets
    - secretKey: DISCOVERY_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_DISCOVERY_SECRET_KEY
        metadataPolicy: None
    - secretKey: DISCOVERY_SOCIAL_AUTH_EDX_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_DISCOVERY_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: DISCOVERY_BACKEND_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_DISCOVERY_BACKEND_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: NOTES_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_NOTES_SECRET_KEY
        metadataPolicy: None
    - secretKey: NOTES_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_NOTES_CLIENT_SECRET
        metadataPolicy: None
    - secretKey: XQUEUE_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_XQUEUE_SECRET_KEY
        metadataPolicy: None
    - secretKey: XQUEUE_LMS_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_XQUEUE_PASSWORD
        metadataPolicy: None
    - secretKey: CMS_SOCIAL_AUTH_EDX_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CMS_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OIDC_CLIENT_SECRET
        metadataPolicy: None
    - secretKey: CREDENTIALS_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CREDENTIALS_SECRET_KEY
        metadataPolicy: None
    - secretKey: CREDENTIALS_BACKEND_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CREDENTIALS_BACKEND_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: CREDENTIALS_SSO_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CREDENTIALS_SSO_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_CREDENTIALS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_CREDENTIALS
        metadataPolicy: None
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_STRIPE_SECRET_KEY
        metadataPolicy: None
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_STRIPE_PUBLISHABLE_KEY
        metadataPolicy: None
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_STRIPE_WEBHOOK_SECRET
        metadataPolicy: None

    # Sentry Error Tracking — backend (LMS/CMS server-side)
    - secretKey: SENTRY_DSN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SENTRY_DSN
        metadataPolicy: None
    - secretKey: SENTRY_ENVIRONMENT
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SENTRY_ENVIRONMENT
        metadataPolicy: None
    - secretKey: SENTRY_TRACES_SAMPLE_RATE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SENTRY_TRACES_SAMPLE_RATE
        metadataPolicy: None
    - secretKey: SENTRY_PROFILES_SAMPLE_RATE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SENTRY_PROFILES_SAMPLE_RATE
        metadataPolicy: None
    # Sentry Error Tracking — MFE client-side (OBS-001, bead mereka-lms-9ib2).
    # These keys are READ by lms_settings.py at LMS pod startup and injected
    # into MFE_CONFIG["SENTRY_DSN"] / MFE_CONFIG["SENTRY_ENVIRONMENT"].
    # The DSN is a PUBLIC browser key (safe to bake into MFE_CONFIG); still
    # flows through Infisical per the secrets management policy.
    # Infisical path: /k8s/mereka-lms/MEREKA_MFE_SENTRY_DSN  (per env: dev/staging/prod)
    # Infisical path: /k8s/mereka-lms/MEREKA_MFE_SENTRY_ENVIRONMENT
    # bbi-infrastructure MUST declare ExternalSecret entries using
    # the Infisical ClusterSecretStore (not GCP SM) for each overlay — see
    # deploy/k8s/overlays/*/patches/ follow-up in that repo.
    - secretKey: MEREKA_MFE_SENTRY_DSN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MEREKA_MFE_SENTRY_DSN
        metadataPolicy: None
    - secretKey: MEREKA_MFE_SENTRY_ENVIRONMENT
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MEREKA_MFE_SENTRY_ENVIRONMENT
        metadataPolicy: None

    # Mux Video (video hosting/streaming)
    - secretKey: MUX_TOKEN_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MUX_TOKEN_ID
        metadataPolicy: None
    - secretKey: MUX_TOKEN_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MUX_TOKEN_SECRET
        metadataPolicy: None

    # Email / SES Secrets
    # SES SMTP credentials — used by Django EMAIL_HOST_USER / EMAIL_HOST_PASSWORD.
    # Endpoint: email-smtp.ap-southeast-1.amazonaws.com:587 (STARTTLS)
    # These are IAM SMTP credentials (not IAM access keys); generate via:
    #   aws iam create-access-key --user-name ses-smtp-user
    #   then convert secret key to SMTP password using SES SMTP credential formula.
    - secretKey: EMAIL_HOST_USER
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EMAIL_HOST_USER
        metadataPolicy: None
    - secretKey: EMAIL_HOST_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EMAIL_HOST_PASSWORD
        metadataPolicy: None
    - secretKey: SES_SNS_WEBHOOK_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SES_SNS_WEBHOOK_SECRET
        metadataPolicy: None
    - secretKey: UNSUBSCRIBE_HMAC_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_UNSUBSCRIBE_HMAC_SECRET
        metadataPolicy: None

    # Verifiable Credentials — Ed25519 signing key (base64-encoded)
    - secretKey: VC_SIGNING_PRIVATE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_VC_SIGNING_PRIVATE_KEY
        metadataPolicy: None
---
