# Enterprise SSO secrets — SAML SP certificate and key for third_party_auth.
# Created via: scripts/tenants/generate-saml-keypair.sh
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enterprise-sso-secrets
  namespace: mereka-lms
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: enterprise-sso-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SAML_SP_PUBLIC_CERT
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SAML_SP_PUBLIC_CERT
        metadataPolicy: None
    - secretKey: SAML_SP_PRIVATE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SAML_SP_PRIVATE_KEY
        metadataPolicy: None
    # OIDC enterprise client secret — template for per-tenant OIDC integrations
    - secretKey: OIDC_ENTERPRISE_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OIDC_ENTERPRISE_CLIENT_SECRET
        metadataPolicy: None
    # SCIM endpoint authentication token — bearer token for SCIM provisioning
    - secretKey: SCIM_BEARER_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_SCIM_BEARER_TOKEN
        metadataPolicy: None
