# SES SMTP relay credentials — used by the smtp Deployment (namelesshk/smtp image).
# The relay expects RELAY_USERNAME + RELAY_PASSWORD in a secret named ses-smtp-credentials.
# These map to the same SES IAM SMTP credentials used by Django (EMAIL_HOST_USER/PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ses-smtp-credentials
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: ses-smtp-credentials
    app.kubernetes.io/component: smtp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: ses-smtp-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RELAY_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EMAIL_HOST_USER
        metadataPolicy: None
    - secretKey: RELAY_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EMAIL_HOST_PASSWORD
        metadataPolicy: None
