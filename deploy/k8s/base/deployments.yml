---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: caddy
    app.kubernetes.io/part-of: mereka-lms
spec:
  # Recreate strategy: Caddy uses a RWO PVC. RollingUpdate would schedule the
  # new pod before the old one terminates, causing a volume mount deadlock on
  # multi-node clusters. Recreate terminates first, then creates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: caddy
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: caddy
        app.kubernetes.io/part-of: mereka-lms
    spec:
      containers:
        - name: caddy
          image: docker.io/caddy:2.7.4
          env:
          - name: default_site_port
            value: ":80"
          # Domain env vars consumed by Caddyfile {$VAR} placeholders.
          # Base defaults use localhost/placeholder values; overlays MUST override
          # these with environment-specific hostnames.
          - name: LMS_HOST
            value: "localhost"
          - name: LMS_HOST_PREVIEW
            value: "preview.localhost"
          - name: STUDIO_HOST
            value: "studio.localhost"
          - name: DISCOVERY_HOST
            value: "discovery.localhost"
          - name: MFE_HOST
            value: "apps.localhost"
          - name: NOTES_HOST
            value: "notes.localhost"
          - name: CREDENTIALS_HOST
            value: "credentials.localhost"
          - name: ENTERPRISE_ADMIN_HOST
            value: "admin.localhost"
          - name: ENTERPRISE_LEARNER_HOST
            value: "learner.localhost"
          volumeMounts:
            - mountPath: /etc/caddy/
              name: config
            - mountPath: /data/
              name: data
          ports:
            - containerPort: 80
            - containerPort: 443
            - containerPort: 2019
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: cms
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: cms
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: cms
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: cms
          image: docker.io/overhangio/openedx:21.0.0-indigo
          env:
          - name: SERVICE_VARIANT
            value: cms
          - name: DJANGO_SETTINGS_MODULE
            value: cms.envs.tutor.production
          - name: OTEL_SERVICE_NAME
            value: cms
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://tempo.monitoring.svc.cluster.local:4318
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: http/protobuf
          - name: OTEL_PROPAGATORS
            value: tracecontext,baggage
          - name: OTEL_TRACES_SAMPLER
            value: parentbased_traceidratio
          - name: OTEL_TRACES_SAMPLER_ARG
            value: "0.1"
          - name: MEREKA_PLATFORM_ADMIN_EMAILS
            value: "gurpreet@biji-biji.com,malasari@mereka.my"
          - name: UWSGI_WORKERS
            value: "2"
          - name: MONGODB_HOST
            valueFrom:
              secretKeyRef:
                name: openedx-secrets
                key: FORUM_MONGODB_HOST
          # Open edX Tutor settings expect JWT_SECRET_KEY (not JWT_SECRET_KEY_LMS).
          - name: JWT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: openedx-secrets
                key: JWT_SECRET_KEY_CMS
          # Open edX Tutor settings expect XQUEUE_PASSWORD (not XQUEUE_LMS_PASSWORD).
          - name: XQUEUE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openedx-secrets
                key: XQUEUE_LMS_PASSWORD
          # Open edX Tutor settings expect SOCIAL_AUTH_OIDC_SECRET (not OIDC_CLIENT_SECRET).
          - name: SOCIAL_AUTH_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: openedx-secrets
                key: OIDC_CLIENT_SECRET
          envFrom:
            - secretRef:
                name: openedx-secrets
            - secretRef:
                name: enterprise-sso-secrets
                optional: true
            - secretRef:
                name: database-secrets
            - secretRef:
                name: mereka-lms-runtime-secrets
                optional: true
          ports:
            - containerPort: 8000
          volumeMounts:
            - mountPath: /openedx/edx-platform/lms/envs/tutor/
              name: settings-lms
            - mountPath: /openedx/edx-platform/cms/envs/tutor/
              name: settings-cms
            - mountPath: /openedx/config
              name: config
            # Provide a CMS-side hook if any templates opt-in to including `head-extra.html`.
            - mountPath: /openedx/edx-platform/cms/templates/head-extra.html
              name: theme-head-extra
              subPath: head-extra.html
            - mountPath: /openedx/uwsgi.ini
              name: uwsgi-config
              subPath: uwsgi.ini
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /heartbeat
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /heartbeat
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          # collectstatic runs at image build time, not pod startup
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: settings-lms
          configMap:
            name: openedx-settings-lms
        - name: settings-cms
          configMap:
            name: openedx-settings-cms
        - name: config
          configMap:
            name: openedx-config
        - name: uwsgi-config
          configMap:
            name: openedx-uwsgi-config
            items:
              - key: uwsgi.ini
                path: uwsgi.ini
        - name: theme-head-extra
          configMap:
            name: openedx-theme-head-extra
            items:
            - key: head-extra.html
              path: head-extra.html
---
