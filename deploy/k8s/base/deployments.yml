  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: mfe
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: mfe
        app.kubernetes.io/part-of: mereka-lms
    spec:
      containers:
        - name: mfe
          image: docker.io/overhangio/openedx-mfe:21.0.0-indigo
          command: ["sh", "-c"]
          args:
            - |
              # Execute capability-stripped copy to avoid EPERM with hardened container runtime.
              cp /usr/bin/caddy /tmp/caddy && chmod +x /tmp/caddy
              exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /etc/caddy/
              name: config
      volumes:
        - name: config
          configMap:
            name: mfe-caddy-config
