apiVersion: apps/v1
kind: Deployment
metadata:
  name: xqueue
  labels:
    app.kubernetes.io/name: xqueue
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xqueue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xqueue
    spec:
      containers:
        - name: xqueue
          image: docker.io/overhangio/openedx-xqueue:18.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: xqueue.tutor
          volumeMounts:
            - mountPath: /openedx/xqueue/xqueue/tutor.py
              name: settings
              subPath: tutor.py
        - name: xqueue-consumer
          image: docker.io/overhangio/openedx-xqueue:18.0.0
          command: ["sh", "-e", "-c"]
          args: ["while true; do echo 'running consumers'; ./manage.py run_consumer; sleep 10; done"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: xqueue.tutor
          volumeMounts:
            - mountPath: /openedx/xqueue/xqueue/tutor.py
              name: settings
              subPath: tutor.py
      volumes:
        - name: settings
          configMap:
            name: xqueue-settings