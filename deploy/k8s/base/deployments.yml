---
# Forum v2 (Python) is integrated into the LMS container as of Tutor v19+ (Sumac).
# The standalone Ruby forum deployment has been removed. Forum configuration is now
# in LMS Django settings (FORUM_SEARCH_BACKEND, FORUM_MONGODB_CLIENT_PARAMETERS).
# Search is handled by Meilisearch instead of Elasticsearch for forum queries.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/part-of: mereka-lms
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: meilisearch
          image: docker.io/getmeili/meilisearch:v1.8.4
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: openedx-secrets
                  key: MEILISEARCH_MASTER_KEY
          ports:
            - containerPort: 7700
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /meili_data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: meilisearch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: mfe
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: mfe
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: mfe
        app.kubernetes.io/part-of: mereka-lms
    spec:
      containers:
        - name: mfe
          image: docker.io/overhangio/openedx-mfe:21.0.0-indigo
          command: ["sh", "-c"]
          args:
            - |
              # Execute capability-stripped copy to avoid EPERM with hardened container runtime.
              cp /usr/bin/caddy /tmp/caddy && chmod +x /tmp/caddy
              exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - mountPath: /etc/caddy/
              name: config
      volumes:
        - name: config
          configMap:
            name: mfe-caddy-config
---
