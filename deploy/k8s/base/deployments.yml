            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ses-smtp-credentials
                  key: RELAY_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ses-smtp-credentials
                  key: RELAY_PASSWORD
            - name: HOSTNAME
              value: "mail.academyv2.mereka.io"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi


