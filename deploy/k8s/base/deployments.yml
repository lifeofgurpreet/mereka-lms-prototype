apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: forum
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: forum
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: forum
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: forum
          image: docker.io/overhangio/openedx-forum:18.1.1
          ports:
            - containerPort: 4567
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: openedx-secrets
                  key: FORUM_API_KEY
            - name: SEARCH_SERVER
              value: "http://elasticsearch:9200"
            # MongoDB Atlas configuration
            - name: MONGODB_AUTH
              value: "openedx"
            - name: MONGODB_HOST
              valueFrom:
                secretKeyRef:
                  name: openedx-secrets
                  key: FORUM_MONGODB_SRV
            - name: MONGODB_PORT
              value: "27017"
            - name: MONGODB_DATABASE
              value: "cs_comments_service"
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openedx-secrets
                  key: MONGODB_PASSWORD
            - name: MONGOID_AUTH_SOURCE
              value: "admin"
            - name: MONGOID_AUTH_MECH
              value: ""
            - name: MONGOID_USE_SSL
              value: "true"
            - name: DD_TRACE_ENABLED
              value: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: mfe
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: mfe
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: mfe
        app.kubernetes.io/part-of: mereka-lms
    spec:
      containers:
        - name: mfe
          image: docker.io/overhangio/openedx-mfe:18.1.0-indigo
          ports:
            - containerPort: 8002
          volumeMounts:
            - mountPath: /etc/caddy/
              name: config
      volumes:
        - name: config
          configMap:
            name: mfe-caddy-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: notes
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: notes
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: notes
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: notes
          image: docker.io/overhangio/openedx-notes:18.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: notesserver.settings.tutor
          envFrom:
            - secretRef:
                name: openedx-secrets
            - secretRef:
                name: database-secrets
          volumeMounts:
            - mountPath: /app/edx-notes-api/notesserver/settings/tutor.py
              name: settings
              subPath: tutor.py
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: settings
          configMap:
            name: notes-settings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xqueue
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: xqueue
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: xqueue
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: xqueue
        app.kubernetes.io/part-of: mereka-lms
    spec:
      containers:
        - name: xqueue
          image: docker.io/overhangio/openedx-xqueue:18.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: xqueue.tutor
          volumeMounts:
            - mountPath: /openedx/xqueue/xqueue/tutor.py
              name: settings
              subPath: tutor.py
        - name: xqueue-consumer
          image: docker.io/overhangio/openedx-xqueue:18.0.0
          command: ["sh", "-e", "-c"]
          args: ["while true; do echo 'running consumers'; ./manage.py run_consumer; sleep 10; done"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: xqueue.tutor
          volumeMounts:
            - mountPath: /openedx/xqueue/xqueue/tutor.py
              name: settings
              subPath: tutor.py
      volumes:
        - name: settings
          configMap:
            name: xqueue-settings
