          "comment": "Deny system manipulation"
        }
      ]
    }

---
# AppArmor profile for XQueue grader sandbox
# This should be loaded on nodes as /etc/apparmor.d/xqueue-grader-sandbox
apiVersion: v1
kind: ConfigMap
metadata:
  name: xqueue-grader-apparmor-profile
  namespace: kube-system
  labels:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: security-profile
data:
  xqueue-grader-sandbox: |
    #include <tunables/global>

    profile xqueue-grader-sandbox flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>

      # Allow Python and standard libraries
      /usr/bin/python3* ix,
      /usr/lib/python3*/** r,
      /usr/local/lib/python3*/** r,

      # AC-ASS-017: Allow writes to /tmp only
      /tmp/** rw,

      # Deny writes to system directories
      /** r,
      /etc/** r,
      /usr/** r,
      /lib/** r,
      /lib64/** r,

      # Deny network access (AC-ASS-016)
      deny network tcp,
      deny network udp,
      deny network raw,

      # Deny capability escalation
      deny capability sys_admin,
      deny capability sys_module,
      deny capability sys_rawio,
      deny capability sys_boot,
      deny capability sys_ptrace,
      deny capability mac_admin,
      deny capability mac_override,
      deny capability net_admin,
      deny capability net_raw,

      # Allow basic capabilities
      capability dac_override,
      capability dac_read_search,
      capability setuid,
      capability setgid,
      capability fowner,
      capability fsetid,
      capability kill,
      capability chown,
    }
