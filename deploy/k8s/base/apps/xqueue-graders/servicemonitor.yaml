apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: xqueue-graders
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: grader-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xqueue-graders
      app.kubernetes.io/component: grader-worker-metrics

  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
apiVersion: v1
kind: Service
metadata:
  name: xqueue-graders-metrics
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: grader-worker-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: grader-worker
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
