apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xqueue-graders
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: grader-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xqueue-graders

  # AC-ASS-020: Auto-scale 1-3 replicas based on CPU (threshold 70%)
  minReplicas: 1
  maxReplicas: 3

  metrics:
  # CPU-based scaling (AC-ASS-020: threshold 70%)
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale up when CPU > 70%

  # Memory-based scaling (secondary metric)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale up when memory > 80%

  # Queue depth custom metric (if metrics server supports it)
  # Commented out for now; can be enabled with custom metrics adapter
  # - type: Pods
  #   pods:
  #     metric:
  #       name: xqueue_queue_depth_pending
  #     target:
  #       type: AverageValue
  #       averageValue: "50"  # Scale up when avg queue depth > 50 per pod

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling up
      policies:
      - type: Percent
        value: 100  # Double the number of pods
        periodSeconds: 60
      - type: Pods
        value: 1    # Or add 1 pod
        periodSeconds: 60
      selectPolicy: Max  # Choose the policy that scales up most aggressively

    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50   # Remove 50% of pods
        periodSeconds: 60
      - type: Pods
        value: 1    # Or remove 1 pod
        periodSeconds: 60
      selectPolicy: Min  # Choose the policy that scales down most conservatively
