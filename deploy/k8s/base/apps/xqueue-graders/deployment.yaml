apiVersion: apps/v1
kind: Deployment
metadata:
  name: xqueue-graders
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: grader-worker
    app.kubernetes.io/part-of: xqueue
spec:
  replicas: 1  # HPA will manage this (AC-ASS-020)
  selector:
    matchLabels:
      app.kubernetes.io/name: xqueue-graders
      app.kubernetes.io/component: grader-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xqueue-graders
        app.kubernetes.io/component: grader-worker
        app.kubernetes.io/part-of: xqueue
      annotations:
        # AC-ASS-016 & AC-ASS-017: Sandbox policy enforcement
        container.apparmor.security.beta.kubernetes.io/grader: localhost/xqueue-grader-sandbox
        seccomp.security.alpha.kubernetes.io/pod: localhost/xqueue-grader-sandbox
    spec:
      serviceAccountName: xqueue-graders
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: Localhost
          localhostProfile: xqueue-grader-sandbox.json

      containers:
      - name: grader
        image: ghcr.io/biji-biji-initiative/mereka-lms/xqueue-graders:pin-required
        imagePullPolicy: Always

        # AC-ASS-021: No secrets in environment variables (use ExternalSecrets mounted as files)
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DJANGO_SETTINGS_MODULE
          value: "lms.envs.production"
        - name: SERVICE_VARIANT
          value: "xqueue-grader"
        - name: WORKER_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        # Resource limits for sandbox execution
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m      # AC-ASS-020: HPA threshold 70% = 700m CPU
            memory: 1Gi     # Sufficient for 256MB per sandbox + overhead

        # Security context for sandbox isolation
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

        # Volume mounts for secrets and writable directories
        volumeMounts:
        # AC-ASS-021: Secrets mounted as files from ExternalSecrets
        - name: mysql-credentials
          mountPath: /etc/secrets/mysql
          readOnly: true

        # Writable /tmp for sandbox execution (AC-ASS-017)
        - name: tmp
          mountPath: /tmp

        # Application code
        - name: app
          mountPath: /app

        # Readiness and liveness probes
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - "from openedx_xqueue_graders.models import GraderSubmission; sys.exit(0)"
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5

      # Volumes
      volumes:
      # AC-ASS-021: MySQL credentials from ExternalSecrets
      - name: mysql-credentials
        secret:
          secretName: openedx-secret
          items:
          - key: MYSQL_PASSWORD
            path: password

      # Writable /tmp directory (emptyDir)
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi

      # Application code (from ConfigMap or image)
      - name: app
        emptyDir: {}

      # Scheduling preferences
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - xqueue-graders
              topologyKey: kubernetes.io/hostname

      # Restart policy
      restartPolicy: Always

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xqueue-graders
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: xqueue-graders
    app.kubernetes.io/component: grader-worker
