## mako
<%page expression_filter="h"/>
<%namespace name="static" file="static_content.html"/>

<link
  rel="preload"
  as="font"
  type="font/woff2"
  crossorigin
  href="${static.url('mereka/fonts/Poppins-Regular.woff2')}"
/>
<link
  rel="preload"
  as="font"
  type="font/woff2"
  crossorigin
  href="${static.url('mereka/fonts/Poppins-SemiBold.woff2')}"
/>
<link
  rel="stylesheet"
  href="${static.url('mereka/css/mereka-overrides.css')}"
  type="text/css"
  media="all"
/>

<style id="mereka-course-card-hotfix">
  .courses-listing li,
  .courses-listing-item,
  .dashboard .listing-courses li {
    display: flex;
    min-width: 0;
  }

  .courses-listing li > .course,
  .courses-listing-item > .course,
  .dashboard .listing-courses li .course {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 100%;
  }

  /* Learner dashboard: consistent spacing + non-squashed list cards */
  .dashboard .listing-courses {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
    margin: 0;
    padding: 0;
  }

  .dashboard .my-courses .listing-courses {
    display: flex;
    flex-direction: column;
    /* Avoid relying on flex-gap (inconsistent on older Safari builds). */
  }

  .dashboard .my-courses .listing-courses > * + * {
    margin-top: 1.25rem;
  }

  .dashboard .my-courses .course-item {
    margin: 0;
    width: 100%;
  }

  .dashboard .my-courses .course-item .course {
    display: flex;
    align-items: stretch;
    min-height: 200px;
    border-radius: 28px;
    border: 1px solid rgba(26, 22, 35, 0.08);
    overflow: hidden;
    background: #fff;
  }

  .dashboard .my-courses .course-item .wrapper-course-image {
    flex: 0 0 clamp(220px, 34%, 360px);
    max-width: 360px;
    margin: 0;
  }

  .dashboard .my-courses .course-item .wrapper-course-image a,
  .dashboard .my-courses .course-item .course-image,
  .dashboard .my-courses .course-item .course-image .cover-image {
    display: block;
    height: 100%;
  }

  .dashboard .my-courses .course-item .wrapper-course-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  @media (max-width: 992px) {
    .dashboard .my-courses .course-item .course {
      flex-direction: column;
      min-height: 0;
    }

    .dashboard .my-courses .course-item .wrapper-course-image {
      flex: 0 0 auto;
      max-width: none;
    }

    .dashboard .my-courses .course-item .course-image,
    .dashboard .my-courses .course-item .course-image .cover-image,
    .dashboard .my-courses .course-item .wrapper-course-image img {
      height: 200px;
    }
  }

  .course .course-image,
  .dashboard .course .course-image {
    min-height: 180px;
    background: linear-gradient(135deg, rgba(45, 137, 139, 0.22), rgba(41, 92, 173, 0.25));
  }

  .course .course-image .cover-image,
  .dashboard .course .course-image .cover-image {
    height: 180px;
    min-height: 180px;
    background: inherit;
  }

  .course .course-image img,
  .dashboard .course .course-image img {
    display: block;
    height: 180px;
    width: 100%;
    object-fit: cover;
    object-position: center;
  }

  .course .course-info {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }

  /* learn-more overlay: .cover-image must be position:relative for absolute children */
  .course .course-image .cover-image {
    position: relative;
  }
  /* ── Header layout hotfix ─────────────────────────────────────
     mereka-overrides.css has the full header rules but the staticfiles
     volume is read-only at runtime. These essential rules are inlined
     here so they take effect via ConfigMap without an image rebuild. */
  .global-header { position: sticky; top: 0; z-index: 1000; width: 100%;
    /* build-lms-v1 sets overflow:hidden + position:relative on .global-header,
       clipping the absolutely-positioned .dropdown-user-menu. Override: */
    overflow: visible !important;
  }
  .main-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 0 1.5rem; height: 64px; max-width: 1400px; margin: 0 auto;
  }
  .header-logo { margin: 0; padding: 0; line-height: 1; flex-shrink: 0; }
  .header-logo .logo { display: block; height: 36px; width: auto; }
  .nav-links {
    display: flex; align-items: center; gap: 0.5rem; flex: 1; justify-content: flex-end;
  }
  .nav-links .main { display: flex; align-items: center; gap: 0.25rem; margin-right: auto; }
  .nav-links .secondary { display: flex; align-items: center; gap: 0.5rem; }
  .nav-links .secondary > div { display: flex; align-items: center; gap: 0.5rem; }
  .nav-item, .mobile-nav-item { display: flex; align-items: center; }
  .nav-links .nav-item a {
    display: inline-block; padding: 0.5rem 0.85rem; font-size: 0.9rem;
    font-weight: 500; color: var(--mereka-color-ink-700, #4a494a);
    text-decoration: none; border-radius: 8px; white-space: nowrap;
    transition: color 150ms ease, background 150ms ease;
  }
  .nav-links .nav-item a:hover, .nav-links .nav-item a:focus {
    color: var(--mereka-color-teal, #237072);
    background: rgba(35, 112, 114, 0.06); text-decoration: none;
  }
  .nav-links .register-btn, .nav-links a.register-btn {
    display: inline-flex; align-items: center; padding: 0.55rem 1.1rem;
    font-size: 0.875rem; font-weight: 600; color: var(--pgn-color-white, #fff);
    background: var(--mereka-color-magenta, #ab3b78); border: none;
    border-radius: 999px; text-decoration: none; white-space: nowrap;
    box-shadow: 0 8px 20px rgba(171, 59, 120, 0.25);
    transition: background 150ms ease, box-shadow 150ms ease;
  }
  .nav-links .register-btn:hover, .nav-links a.register-btn:hover {
    background: var(--mereka-color-magenta-dark, #8a2f60); color: #fff;
    text-decoration: none; box-shadow: 0 10px 24px rgba(171, 59, 120, 0.35);
  }
  .nav-links .sign-in-btn, .nav-links a.sign-in-btn {
    display: inline-flex; align-items: center; padding: 0.5rem 1.1rem;
    font-size: 0.875rem; font-weight: 600; color: var(--mereka-color-teal, #237072);
    background: transparent; border: 1.5px solid var(--mereka-color-teal, #237072);
    border-radius: 999px; text-decoration: none; white-space: nowrap;
    transition: color 150ms ease, background 150ms ease, border-color 150ms ease;
  }
  .nav-links .sign-in-btn:hover, .nav-links a.sign-in-btn:hover {
    background: var(--mereka-color-teal, #237072); color: #fff; text-decoration: none;
  }
  .hamburger-menu {
    display: none; flex-direction: column; justify-content: center; align-items: center;
    gap: 5px; width: 40px; height: 40px; cursor: pointer; border-radius: 8px;
    padding: 4px; flex-shrink: 0;
  }
  .hamburger-menu .line {
    display: block; width: 22px; height: 2px;
    background: var(--mereka-color-ink-700, #4a494a); border-radius: 2px;
    transition: transform 200ms ease, opacity 200ms ease;
  }
  .hamburger-menu[aria-expanded="true"] .line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger-menu[aria-expanded="true"] .line:nth-child(2) { opacity: 0; }
  .hamburger-menu[aria-expanded="true"] .line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .mobile-menu { background: var(--pgn-color-white, #fff); border-top: 1px solid rgba(26, 22, 35, 0.08); padding: 0.75rem 1.5rem 1rem; }
  .mobile-menu.hidden { display: none; }
  @media (max-width: 768px) {
    .main-header { padding: 0 1rem; height: 56px; }
    .hamburger-menu { display: flex; }
    .hidden-mobile { display: none !important; }
    .nav-links { display: none; }
  }
  /* ── build-lms-v1 specificity overrides (0,4,1) ────────────────────────
     build-lms-v1 sets register-btn=outlined-teal and sign-in-btn=filled-magenta
     (inverted). Correct treatment: register=filled-magenta, sign-in=outlined-teal.
     The selectors below match build-lms-v1 specificity so later-in-cascade wins. */
  .global-header .nav-links .secondary a.register-btn {
    background: var(--mereka-color-magenta, #ab3b78); color: #fff;
    border: none; border-radius: 999px; font-weight: 600;
    padding: 0.55rem 1.1rem; box-shadow: 0 8px 20px rgba(171,59,120,0.25);
    text-decoration: none;
  }
  .global-header .nav-links .secondary a.register-btn:hover,
  .global-header .nav-links .secondary a.register-btn:focus {
    background: var(--mereka-color-magenta-dark, #8a2f60); color: #fff;
    text-decoration: none; box-shadow: 0 10px 24px rgba(171,59,120,0.35);
  }
  .global-header .nav-links .secondary a.sign-in-btn {
    background: transparent; color: var(--mereka-color-teal, #237072);
    border: 1.5px solid var(--mereka-color-teal, #237072);
    border-radius: 999px; font-weight: 600; padding: 0.5rem 1.1rem; text-decoration: none;
  }
  .global-header .nav-links .secondary a.sign-in-btn:hover,
  .global-header .nav-links .secondary a.sign-in-btn:focus {
    background: var(--mereka-color-teal, #237072); color: #fff; text-decoration: none;
  }
  /* Cancel build-lms-v1 border-bottom separator on global header.
     build-lms-v1 uses !important → must match with !important. */
  .global-header { border-bottom: none !important; }
  /* Cancel build-lms-v1 float override on .main nav (keeps Explore courses left-aligned) */
  @media (min-width: 992px) {
    .global-header .nav-links .main { float: none; margin: 0; margin-right: auto; }
    .global-header .nav-links .secondary { float: none; margin: 0; }
  }
  /* Eyebrow: build-lms-v1 sets body:not(.courseware) .home>header .title>.heading-group p
     at 0,4,3 → overrides our 0,2,0 rule. Force correct magenta colour. */
  .mereka-hero .eyebrow { color: var(--mereka-color-magenta, #ab3b78) !important; }
  /* learn-more overlay: runtime bridge fix (authoritative fix is in _custom.scss).
     Stock lms-main-v1 (compiled into theme) sets at 0,6,0:
       top: 55px; opacity: 0; width: 200px; height: 50px; border-radius: 3px
     head-extra inline <style> is last in the document so equal-specificity wins.
     TODO: remove this block once image is rebuilt with the _custom.scss fix. */
  .courses-container .courses .course .course-image .cover-image .learn-more {
    opacity: 1;
    position: absolute;
    top: auto;
    bottom: 0.75rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    white-space: nowrap;
    width: auto;
    height: auto;
    border-radius: 999px;
    box-sizing: border-box;
  }

  /* ── User dropdown: ensure menu is reachable ────────────────────────────────
     .dropdown-user-menu is position:absolute; z-index:10 in the compiled theme.
     With overflow:visible restored on .global-header (above), it will show.
     Raise z-index above any page content that might sit at z-index:100+. */
  .global-header .nav-links .secondary .dropdown-user-menu {
    z-index: 1001;
    position: absolute;
    top: 55px;
    right: 30px;
  }

  /* ── Dashboard logged-in shell: course image + card layout ─────────────────
     build-lms-v1 hides .wrapper-course-image at specificity 0,6,0:
       .dashboard .main-container .my-courses .course .details .wrapper-course-image { display:none }
     The selectors below match that specificity. Since this inline <style> is the
     LAST stylesheet in the document (after lms-main-v1.css link), equal-specificity
     rules here win in cascade order — no !important needed. */

  /* Show the course image column */
  .dashboard .main-container .my-courses .course .details .wrapper-course-image {
    display: block;
    float: none;
    width: clamp(200px, 30%, 320px);
    max-width: 320px;
    max-height: none;
    overflow: hidden;
    flex-shrink: 0;
    margin: 0;
  }

  /* Horizontal card layout: image left, details right */
  .dashboard .main-container .my-courses .course .details {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }

  /* Course image fills its container */
  .dashboard .main-container .my-courses .course .details .wrapper-course-image a.fade-cover,
  .dashboard .main-container .my-courses .course .details .wrapper-course-image .cover {
    display: block;
    float: none;
    width: 100%;
    height: 100%;
    position: relative;
  }

  .dashboard .main-container .my-courses .course .details .wrapper-course-image a.fade-cover .course-image,
  .dashboard .main-container .my-courses .course .details .wrapper-course-image .cover .course-image {
    width: 100%;
    height: 100%;
    min-height: 160px;
    padding: 0;
  }

  .dashboard .main-container .my-courses .course .details .wrapper-course-image a.fade-cover .course-image img,
  .dashboard .main-container .my-courses .course .details .wrapper-course-image .cover .course-image img {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 160px;
    object-fit: cover;
    object-position: center;
  }

  /* Details text panel: flex-grow to fill remaining space */
  .dashboard .main-container .my-courses .course .details .wrapper-course-details {
    flex: 1;
    padding: 1.25rem;
    min-width: 0;
  }

  /* On mobile: stack vertically */
  @media (max-width: 768px) {
    .dashboard .main-container .my-courses .course .details {
      flex-direction: column;
    }
    .dashboard .main-container .my-courses .course .details .wrapper-course-image {
      width: 100%;
      max-width: none;
    }
  }
</style>
