---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubspot-webhook
  labels:
    app.kubernetes.io/name: hubspot-webhook
    app.kubernetes.io/component: webhook-service
    app.kubernetes.io/part-of: mereka-lms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hubspot-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hubspot-webhook
        app.kubernetes.io/component: webhook-service
    spec:
      containers:
      - name: hubspot-webhook
        # NOT DEPLOYABLE: no container image has been published for this service.
        # The current implementation lives in services/hubspot-webhook/ as a Firebase
        # Cloud Function. This Deployment must NOT be included in any overlay until
        # a real image is built and pushed to:
        #   ghcr.io/biji-biji-initiative/mereka-lms/hubspot-webhook:<tag>
        # See docs/migrations/ for the containerisation timeline.
        image: ghcr.io/biji-biji-initiative/mereka-lms/hubspot-webhook:pin-required
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        # Add environment variables from secrets when ready
        # envFrom:
        # - secretRef:
        #     name: hubspot-webhook-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
