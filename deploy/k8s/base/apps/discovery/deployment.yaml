---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: discovery
    app.kubernetes.io/part-of: mereka-lms
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: discovery
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: discovery
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: discovery
          image: docker.io/overhangio/openedx-discovery:21.0.1
          ports:
            - containerPort: 8000
          env:
            - name: MEREKA_PLATFORM_ADMIN_EMAILS
              value: "gurpreet@biji-biji.com,malasari@mereka.my"
          envFrom:
            - secretRef:
                name: openedx-secrets
            - secretRef:
                name: database-secrets
          volumeMounts:
            - mountPath: /openedx/discovery/course_discovery/settings/tutor/production.py
              name: settings
              subPath: production.py
            - mountPath: /openedx/discovery/course_discovery/settings/tutor/mereka_platform_admin.py
              name: settings
              subPath: mereka_platform_admin.py
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: settings
          configMap:
            name: discovery-settings
