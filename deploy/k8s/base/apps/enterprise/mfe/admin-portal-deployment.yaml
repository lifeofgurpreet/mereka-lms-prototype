---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-admin-portal
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: enterprise-admin-portal
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: enterprise-admin-portal
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: enterprise-admin-portal
        app.kubernetes.io/part-of: mereka-lms
        app.kubernetes.io/component: enterprise
    spec:
      initContainers:
        - name: sanitize-enterprise-index-html
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-admin-portal:latest
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              # Copy image's /openedx/dist (NOT shadowed — emptyDir is at /openedx/dist-output)
              # to the shared emptyDir, then strip the New Relic NREUM inline script block.
              cp -a /openedx/dist/. /openedx/dist-output/

              if [ -f /openedx/dist-output/index.html ]; then
                awk '
                  BEGIN {in_script=0; buf=""; has_nreum=0}
                  {
                    if (in_script) {
                      buf = buf $0 "\n"
                      if ($0 ~ /NREUM/) {
                        has_nreum = 1
                      }
                      if ($0 ~ /<\/script>/) {
                        if (!has_nreum) {
                          printf "%s", buf
                        }
                        in_script = 0
                        buf = ""
                        has_nreum = 0
                      }
                      next
                    }

                    if ($0 ~ /<script/) {
                      in_script = 1
                      has_nreum = ($0 ~ /NREUM/) ? 1 : 0
                      buf = $0 "\n"
                      if ($0 ~ /<\/script>/) {
                        if (!has_nreum) {
                          printf "%s", buf
                        }
                        in_script = 0
                        buf = ""
                        has_nreum = 0
                      }
                      next
                    }

                    print
                  }
                  END {
                    if (in_script && !has_nreum) {
                      printf "%s", buf
                    }
                  }
                ' /openedx/dist-output/index.html > /tmp/index.html
                mv /tmp/index.html /openedx/dist-output/index.html
              fi
          volumeMounts:
            - name: enterprise-admin-portal-dist
              mountPath: /openedx/dist-output
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: enterprise-admin-portal
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-admin-portal:latest
          command:
            - /bin/sh
            - -c
          args:
            - |
              exec /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ports:
            - containerPort: 8002
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - mountPath: /etc/caddy/
              name: caddy-config
            - mountPath: /openedx/dist
              name: enterprise-admin-portal-dist
            - mountPath: /openedx/dist/env.config.js
              name: mfe-env
              subPath: env.config.js
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: enterprise-admin-portal-dist
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: enterprise-admin-portal-caddy-config
        - name: mfe-env
          configMap:
            name: enterprise-mfe-env
