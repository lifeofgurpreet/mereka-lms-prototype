---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-admin-portal
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: enterprise-admin-portal
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: enterprise-admin-portal
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: enterprise-admin-portal
        app.kubernetes.io/part-of: mereka-lms
        app.kubernetes.io/component: enterprise
    spec:
      initContainers:
        - name: sanitize-enterprise-index-html
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-admin-portal:latest
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              # Copy image's /openedx/dist (NOT shadowed — emptyDir is at /openedx/dist-output)
              # to the shared emptyDir, then strip the New Relic NREUM inline script block.
              cp -a /openedx/dist/. /openedx/dist-output/

              if [ -f /openedx/dist-output/index.html ]; then
                python3 -c "
import re
p = '/openedx/dist-output/index.html'
h = open(p).read()
h2 = re.sub(r'<script[^>]*>(?:(?!</script>).)*NREUM(?:(?!</script>).)*</script>', '', h, flags=re.DOTALL)
open(p, 'w').write(h2)
print('NREUM stripped:', 'NREUM' not in h2, 'size:', len(h2))
"
              fi
          volumeMounts:
            - name: enterprise-admin-portal-dist
              mountPath: /openedx/dist-output
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: enterprise-admin-portal
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-admin-portal:latest
          command:
            - /bin/sh
            - -c
          args:
            - |
              exec /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ports:
            - containerPort: 8002
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - mountPath: /etc/caddy/
              name: caddy-config
            - mountPath: /openedx/dist
              name: enterprise-admin-portal-dist
            - mountPath: /openedx/dist/env.config.js
              name: mfe-env
              subPath: env.config.js
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: enterprise-admin-portal-dist
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: enterprise-admin-portal-caddy-config
        - name: mfe-env
          configMap:
            name: enterprise-mfe-env
