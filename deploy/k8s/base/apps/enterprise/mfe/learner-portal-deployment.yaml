---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-learner-portal
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: enterprise-learner-portal
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: enterprise-learner-portal
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: enterprise-learner-portal
        app.kubernetes.io/part-of: mereka-lms
        app.kubernetes.io/component: enterprise
    spec:
      containers:
        - name: enterprise-learner-portal
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-learner-portal:latest
          ports:
            - containerPort: 8002
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - mountPath: /etc/caddy/
              name: caddy-config
            - mountPath: /openedx/dist/env.config.js
              name: mfe-env
              subPath: env.config.js
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: caddy-config
          configMap:
            name: enterprise-learner-portal-caddy-config
        - name: mfe-env
          configMap:
            name: enterprise-mfe-env
