---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-learner-portal
  labels:
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/managed-by: tutor
    app.kubernetes.io/name: enterprise-learner-portal
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/managed-by: tutor
      app.kubernetes.io/name: enterprise-learner-portal
      app.kubernetes.io/part-of: mereka-lms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/managed-by: tutor
        app.kubernetes.io/name: enterprise-learner-portal
        app.kubernetes.io/part-of: mereka-lms
        app.kubernetes.io/component: enterprise
    spec:
      initContainers:
        # Step 1: copy the built MFE dist from the enterprise image to the shared emptyDir.
        # The emptyDir is mounted at /openedx/dist-output (NOT /openedx/dist) so the
        # image's own /openedx/dist is visible and can be copied.
        - name: copy-dist
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-learner-portal:latest
          command: [/bin/sh, -c]
          args:
            - cp -a /openedx/dist/. /openedx/dist-output/
          volumeMounts:
            - name: enterprise-learner-portal-dist
              mountPath: /openedx/dist-output
          securityContext:
            allowPrivilegeEscalation: false
        # Step 2: strip the New Relic NREUM inline <script> block from index.html.
        # Uses python:3-alpine (has Python) to handle single-line minified HTML.
        - name: strip-nreum
          image: python:3-alpine
          command: [python3, -c]
          args:
            - "import re; p='/openedx/dist-output/index.html'; h=open(p).read(); h2=re.sub(r'<script[^>]*>(?:(?!</script>).)*NREUM(?:(?!</script>).)*</script>','',h,flags=re.DOTALL); open(p,'w').write(h2); print('stripped:', 'NREUM' not in h2, 'size:', len(h2))"
          volumeMounts:
            - name: enterprise-learner-portal-dist
              mountPath: /openedx/dist-output
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: enterprise-learner-portal
          image: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-learner-portal:latest
          command:
            - /bin/sh
            - -c
          args:
            - |
              exec /usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ports:
            - containerPort: 8002
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - mountPath: /etc/caddy/
              name: caddy-config
            - mountPath: /openedx/dist
              name: enterprise-learner-portal-dist
            - mountPath: /openedx/dist/env.config.js
              name: mfe-env
              subPath: env.config.js
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: enterprise-learner-portal-dist
          emptyDir: {}
        - name: caddy-config
          configMap:
            name: enterprise-learner-portal-caddy-config
        - name: mfe-env
          configMap:
            name: enterprise-mfe-env
