---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-manager
  labels:
    app.kubernetes.io/name: license-manager
    app.kubernetes.io/component: enterprise
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/name: license-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-manager
        app.kubernetes.io/component: enterprise
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: config-gen
          image: ghcr.io/biji-biji-initiative/mereka-lms/license-manager:latest
          command: ["python3", "-c"]
          args:
            - |
              import os, yaml
              config = {
                  'SECRET_KEY': os.environ['DJANGO_SECRET_KEY'],
                  'ALLOWED_HOSTS': ['*'],
                  'DATABASES': {
                      'default': {
                          'ENGINE': 'django.db.backends.mysql',
                          'NAME': os.environ.get('DB_NAME', 'license_manager'),
                          'USER': os.environ.get('DB_USER', 'license_manager'),
                          'PASSWORD': os.environ['DB_PASSWORD'],
                          'HOST': os.environ.get('DB_HOST', 'mysql'),
                          'PORT': 3306,
                          'ATOMIC_REQUESTS': False,
                          'CONN_MAX_AGE': 60,
                      }
                  },
                  'CACHES': {
                      'default': {
                          'BACKEND': 'django.core.cache.backends.redis.RedisCache',
                          'LOCATION': os.environ.get('CACHE_LOCATION', 'redis://redis:6379/12'),
                          'KEY_PREFIX': 'license_manager',
                      }
                  },
                  'CELERY_BROKER_TRANSPORT': 'redis',
                  'CELERY_BROKER_USER': '',
                  'CELERY_BROKER_PASSWORD': '',
                  'CELERY_BROKER_HOSTNAME': os.environ.get('CELERY_BROKER_HOSTNAME', 'redis:6379'),
                  'CELERY_BROKER_VHOST': os.environ.get('CELERY_BROKER_VHOST', '14'),
                  'SOCIAL_AUTH_EDX_OAUTH2_KEY': os.environ.get('SOCIAL_AUTH_EDX_OAUTH2_KEY', 'license-manager-key'),
                  'SOCIAL_AUTH_EDX_OAUTH2_SECRET': os.environ.get('SOCIAL_AUTH_EDX_OAUTH2_SECRET', ''),
                  'SOCIAL_AUTH_EDX_OAUTH2_URL_ROOT': 'http://lms:8000',
                  'SOCIAL_AUTH_EDX_OAUTH2_PUBLIC_URL_ROOT': os.environ.get('LMS_ROOT_URL', 'https://academyv2.mereka.io'),
                  'BACKEND_SERVICE_EDX_OAUTH2_KEY': os.environ.get('BACKEND_SERVICE_EDX_OAUTH2_KEY', 'license-manager-key'),
                  'BACKEND_SERVICE_EDX_OAUTH2_SECRET': os.environ.get('BACKEND_SERVICE_EDX_OAUTH2_SECRET', ''),
                  'LMS_BASE_URL': 'http://lms:8000',
                  'LMS_ROOT_URL': os.environ.get('LMS_ROOT_URL', 'https://academyv2.mereka.io'),
                  'ENTERPRISE_CATALOG_URL': 'http://enterprise-catalog:8000',
                  'ENTERPRISE_SUBSIDY_URL': 'http://enterprise-subsidy:8000',
              }
              with open('/config/license_manager.yml', 'w') as f:
                  yaml.dump(config, f, default_flow_style=False)
              print('Config generated successfully')
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: LICENSE_MANAGER_SECRET_KEY
            - name: DB_NAME
              value: license_manager
            - name: DB_USER
              value: license_manager
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: MYSQL_LICENSE_MANAGER_PASSWORD
            - name: DB_HOST
              value: mysql
            - name: CACHE_LOCATION
              value: redis://redis:6379/12
            - name: CELERY_BROKER_HOSTNAME
              value: "redis:6379"
            - name: CELERY_BROKER_VHOST
              value: "14"
            - name: SOCIAL_AUTH_EDX_OAUTH2_KEY
              value: license-manager-key
            - name: SOCIAL_AUTH_EDX_OAUTH2_SECRET
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: LICENSE_MANAGER_OAUTH2_SECRET
            - name: BACKEND_SERVICE_EDX_OAUTH2_KEY
              value: license-manager-key
            - name: BACKEND_SERVICE_EDX_OAUTH2_SECRET
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: LICENSE_MANAGER_OAUTH2_SECRET
            - name: LMS_ROOT_URL
              value: "https://academyv2.mereka.io"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
        - name: migrate
          image: ghcr.io/biji-biji-initiative/mereka-lms/license-manager:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: license_manager.settings.production
            - name: LICENSE_MANAGER_CFG
              value: /config/license_manager.yml
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: license-manager
          image: ghcr.io/biji-biji-initiative/mereka-lms/license-manager:latest
          ports:
            - containerPort: 18170
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: license_manager.settings.production
            - name: LICENSE_MANAGER_CFG
              value: /config/license_manager.yml
          readinessProbe:
            httpGet:
              path: /health/
              port: 18170
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 18170
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          emptyDir: {}
