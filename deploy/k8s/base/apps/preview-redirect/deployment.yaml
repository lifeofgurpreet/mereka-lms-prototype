---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-redirect
  labels:
    app.kubernetes.io/name: preview-redirect
    app.kubernetes.io/component: redirect-service
    app.kubernetes.io/part-of: mereka-lms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-redirect
        app.kubernetes.io/component: redirect-service
    spec:
      containers:
      - name: preview-redirect
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: html
        configMap:
          name: preview-redirect-html
      restartPolicy: Always
