---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: enterprise-alerts
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: enterprise
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus
spec:
  groups:
    - name: openedx-enterprise-catalog
      interval: 30s
      rules:
        # Pod availability alerts
        - alert: EnterpriseCatalogPodDown
          expr: up{job="enterprise-catalog-metrics", namespace="mereka-lms"} == 0
          for: 5m
          labels:
            severity: critical
            component: enterprise-catalog
          annotations:
            summary: "Enterprise Catalog pod is down"
            description: "Enterprise Catalog pod {{ $labels.pod }} has been down for more than 5 minutes."

        # Compatibility alias for legacy alert contract
        - alert: EnterpriseCatalogDown
          expr: up{job="enterprise-catalog-metrics", namespace="mereka-lms"} == 0
          for: 5m
          labels:
            severity: critical
            component: enterprise-catalog
          annotations:
            summary: "Enterprise Catalog pod is down"
            description: "Enterprise Catalog pod {{ $labels.pod }} has been down for more than 5 minutes."

        - alert: EnterpriseCatalogPodRestarting
          expr: rate(kube_pod_container_status_restarts_total{namespace="mereka-lms", pod=~"enterprise-catalog-.*"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            component: enterprise-catalog
          annotations:
            summary: "Enterprise Catalog pod is restarting frequently"
            description: "Enterprise Catalog pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes."

        # Memory alerts
        - alert: EnterpriseCatalogMemoryHigh
          expr: |
            (
              container_memory_working_set_bytes{namespace="mereka-lms", pod=~"enterprise-catalog-.*", container="enterprise-catalog"}
              / container_spec_memory_limit_bytes{namespace="mereka-lms", pod=~"enterprise-catalog-.*", container="enterprise-catalog"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
            component: enterprise-catalog
          annotations:
            summary: "Enterprise Catalog pod memory usage is high"
            description: "Enterprise Catalog pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."

        # CPU alerts
        - alert: EnterpriseCatalogCPUHigh
          expr: |
            (
              rate(container_cpu_usage_seconds_total{namespace="mereka-lms", pod=~"enterprise-catalog-.*", container="enterprise-catalog"}[5m])
              / container_spec_cpu_quota{namespace="mereka-lms", pod=~"enterprise-catalog-.*", container="enterprise-catalog"}
              * container_spec_cpu_period{namespace="mereka-lms", pod=~"enterprise-catalog-.*", container="enterprise-catalog"}
            ) > 0.85
          for: 10m
          labels:
            severity: warning
            component: enterprise-catalog
          annotations:
            summary: "Enterprise Catalog pod CPU usage is high"
            description: "Enterprise Catalog pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its CPU limit."

