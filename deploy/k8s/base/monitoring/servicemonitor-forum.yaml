# QUARANTINE: Forum v2 runs in-process inside the LMS pod (openedx-forum v0.3.8,
# integrated as of Tutor v19+). There is no separate forum Service or process.
# Forum metrics are already scraped via servicemonitor-lms.yaml (job="lms-metrics").
# Creating a second ServiceMonitor targeting the same lms Service endpoint would
# cause duplicate time-series with label job="forum-metrics".
#
# This file is kept for documentation but is NOT included in kustomization.yaml.
# Re-enable if a standalone Forum deployment is introduced.
#
# ---
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: forum-metrics
#   namespace: mereka-lms
#   labels:
#     app.kubernetes.io/name: forum
#     app.kubernetes.io/instance: mereka-lms
#     app.kubernetes.io/part-of: mereka-lms
#     app.kubernetes.io/component: monitoring
# spec:
#   selector:
#     matchLabels:
#       app.kubernetes.io/name: lms
#   namespaceSelector:
#     matchNames:
#       - mereka-lms
#   endpoints:
#     - port: http
#       path: /metrics
#       interval: 30s
#       scrapeTimeout: 10s
#       scheme: http
