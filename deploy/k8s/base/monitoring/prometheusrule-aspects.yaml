---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aspects-alerts
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: aspects
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: aspects
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus
spec:
  groups:
    - name: aspects-availability
      interval: 30s
      rules:
        - alert: ClickHousePodDown
          expr: |
            kube_deployment_status_available_replicas{namespace=~"mereka-lms.*|stg-mereka-lms", deployment="clickhouse"} == 0
            and kube_deployment_spec_replicas{namespace=~"mereka-lms.*|stg-mereka-lms", deployment="clickhouse"} > 0
          for: 5m
          labels:
            severity: critical
            component: clickhouse
          annotations:
            summary: "ClickHouse pod is down"
            description: "ClickHouse deployment in {{ $labels.namespace }} has 0 available replicas for 5+ minutes."

        - alert: SupersetPodDown
          expr: |
            kube_deployment_status_available_replicas{namespace=~"mereka-lms.*|stg-mereka-lms", deployment="superset"} == 0
            and kube_deployment_spec_replicas{namespace=~"mereka-lms.*|stg-mereka-lms", deployment="superset"} > 0
          for: 5m
          labels:
            severity: critical
            component: superset
          annotations:
            summary: "Superset pod is down"
            description: "Superset deployment in {{ $labels.namespace }} has 0 available replicas for 5+ minutes."

        - alert: RalphPodDown
          expr: |
            kube_deployment_status_available_replicas{namespace=~"mereka-lms.*|stg-mereka-lms", deployment="ralph"} == 0
            and kube_deployment_spec_replicas{namespace=~"mereka-lms.*|stg-mereka-lms", deployment="ralph"} > 0
          for: 5m
          labels:
            severity: critical
            component: ralph
          annotations:
            summary: "Ralph xAPI LRS is down"
            description: "Ralph deployment in {{ $labels.namespace }} has 0 available replicas for 5+ minutes. xAPI events are being lost."

        - alert: AspectsPodRestarting
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"mereka-lms.*|stg-mereka-lms", pod=~"(clickhouse|superset|ralph).*"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            component: aspects
          annotations:
            summary: "Aspects pod restarting"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has restarted {{ $value | humanize }} times in 15 minutes."

    - name: aspects-resources
      interval: 60s
      rules:
        - alert: ClickHouseStorageHigh
          expr: |
            (kubelet_volume_stats_used_bytes{namespace=~"mereka-lms.*|stg-mereka-lms", persistentvolumeclaim=~".*clickhouse.*"}
            / kubelet_volume_stats_capacity_bytes{namespace=~"mereka-lms.*|stg-mereka-lms", persistentvolumeclaim=~".*clickhouse.*"}) > 0.85
          for: 10m
          labels:
            severity: warning
            component: clickhouse
          annotations:
            summary: "ClickHouse storage > 85%"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $value | humanizePercentage }} full."

        - alert: ClickHouseStorageCritical
          expr: |
            (kubelet_volume_stats_used_bytes{namespace=~"mereka-lms.*|stg-mereka-lms", persistentvolumeclaim=~".*clickhouse.*"}
            / kubelet_volume_stats_capacity_bytes{namespace=~"mereka-lms.*|stg-mereka-lms", persistentvolumeclaim=~".*clickhouse.*"}) > 0.95
          for: 5m
          labels:
            severity: critical
            component: clickhouse
          annotations:
            summary: "ClickHouse storage > 95%"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $value | humanizePercentage }} full. Immediate action required."

        - alert: SupersetPodMemoryHigh
          expr: |
            container_memory_working_set_bytes{namespace=~"mereka-lms.*|stg-mereka-lms", pod=~"superset-.*", container="superset"}
            / on(pod, namespace) kube_pod_container_resource_limits{resource="memory", namespace=~"mereka-lms.*|stg-mereka-lms", pod=~"superset-.*"} > 0.9
          for: 10m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "Superset memory usage > 90%"
            description: "Superset pod {{ $labels.pod }} in {{ $labels.namespace }} is using {{ $value | humanizePercentage }} of its memory limit."
