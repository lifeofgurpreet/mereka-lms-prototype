---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: credentials-alerts
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: credentials
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus
spec:
  groups:
    - name: verifiable-credentials
      interval: 30s
      rules:
        # Issuance latency alert
        - alert: VCIssuanceLatencyHigh
          expr: |
            histogram_quantile(0.95,
              rate(credentials_vc_issuance_duration_seconds_bucket{namespace="mereka-lms"}[5m])
            ) > 30
          for: 5m
          labels:
            severity: warning
            component: credentials
            runbook: docs/operations/credential-issuance-failure-runbook.md
          annotations:
            summary: "Verifiable Credential issuance latency is high"
            description: "95th percentile VC issuance duration is {{ $value | humanizeDuration }} (threshold: 30s). This may indicate signing service performance issues or database contention."

        # Signing failure alert
        - alert: VCIssuanceFailureSpike
          expr: |
            rate(credentials_vc_signing_errors_total{namespace="mereka-lms"}[2m]) > 0.1
          for: 2m
          labels:
            severity: critical
            component: credentials
            runbook: docs/operations/credential-issuance-failure-runbook.md
          annotations:
            summary: "Verifiable Credential signing errors are spiking"
            description: "VC signing error rate is {{ $value | humanize }} errors/second (threshold: 0.1/s). Check signing key availability and health endpoint."

        # Claim token expiry alert
        - alert: VCClaimTokenExpiryHigh
          expr: |
            (
              sum(rate(credentials_vc_claim_tokens_expired_total{namespace="mereka-lms"}[1h]))
              /
              sum(rate(credentials_vc_claim_tokens_generated_total{namespace="mereka-lms"}[1h]))
            ) > 0.5
          for: 15m
          labels:
            severity: warning
            component: credentials
            runbook: docs/operations/credential-verification-failure-runbook.md
          annotations:
            summary: "High rate of VC claim tokens expiring unused"
            description: "{{ $value | humanizePercentage }} of claim tokens are expiring unused (threshold: 50%). Learners may not be completing the claim flow. Check email delivery and claim page UX."

        # Verification endpoint down alert
        - alert: VCVerificationEndpointDown
          expr: |
            (
              sum(rate(credentials_vc_verification_requests_total{namespace="mereka-lms", result=~"5xx|error"}[2m]))
              /
              sum(rate(credentials_vc_verification_requests_total{namespace="mereka-lms"}[2m]))
            ) > 0.5
          for: 2m
          labels:
            severity: critical
            component: credentials
            runbook: docs/operations/credential-verification-failure-runbook.md
          annotations:
            summary: "VC verification endpoint returning errors"
            description: "{{ $value | humanizePercentage }} of verification requests are failing (threshold: 50%). Check DID Document availability and signing key lookup."

        # DID Document unavailable alert
        - alert: VCDIDDocumentUnavailable
          expr: |
            (
              sum(rate(credentials_did_document_requests_total{namespace="mereka-lms", status!="200"}[5m]))
              /
              sum(rate(credentials_did_document_requests_total{namespace="mereka-lms"}[5m]))
            ) > 0.1
          for: 5m
          labels:
            severity: critical
            component: credentials
            runbook: docs/operations/credential-verification-failure-runbook.md
          annotations:
            summary: "DID Document endpoint is unavailable"
            description: "{{ $value | humanizePercentage }} of DID Document requests are failing (threshold: 10%). This will prevent external verifiers from validating credentials. Check DID Document caching and availability."

        # Signing key expiry reminder alert
        - alert: VCSigningKeyExpiringSoon
          expr: |
            (time() - credentials_vc_signing_key_created_timestamp{namespace="mereka-lms"}) / 86400 > 350
          for: 1h
          labels:
            severity: warning
            component: credentials
            runbook: docs/operations/credential-key-rotation-runbook.md
          annotations:
            summary: "VC signing key is approaching 1-year age"
            description: "Signing key is {{ $value }} days old (threshold: 350 days). Plan key rotation within 15 days. Old keys must remain in DID Document for 5 years per CRED-020."
