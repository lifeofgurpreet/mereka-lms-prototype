---
# ServiceMonitor for Enterprise Catalog service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: enterprise-catalog-metrics
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: enterprise-catalog
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: monitoring
    release: monitoring  # bead mereka-lms-33d8: required by prod Prometheus serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-catalog
      app.kubernetes.io/instance: mereka-lms
  # namespaceSelector intentionally omitted — default "same namespace as SM"
  # works across all envs (prod mereka-lms / dev mereka-lms-dev / staging
  # stg-mereka-lms). Previous hardcoded matchNames:[mereka-lms] yielded zero
  # targets on dev+staging. See bead mereka-lms-33d8.
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace

