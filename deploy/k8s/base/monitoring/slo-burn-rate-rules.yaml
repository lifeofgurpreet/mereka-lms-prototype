                / clamp_min(sum(increase(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[30d])), 1)
