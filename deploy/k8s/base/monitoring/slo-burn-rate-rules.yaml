              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_1h
          labels:
            service: purchase-gateway
            tier: "1"
            journey: journey_purchase_webhook
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(http_requests_total{job="purchase-gateway-metrics",status_code=~"5..",handler=~".*/webhook.*|.*/stripe/.*|.*/events/.*"}[1h]))
                /
                clamp_min(sum(rate(http_requests_total{job="purchase-gateway-metrics",status_code!~"4..",handler=~".*/webhook.*|.*/stripe/.*|.*/events/.*"}[1h])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_6h
          labels:
            service: purchase-gateway
            tier: "1"
            journey: journey_purchase_webhook
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(http_requests_total{job="purchase-gateway-metrics",status_code=~"5..",handler=~".*/webhook.*|.*/stripe/.*|.*/events/.*"}[6h]))
                /
                clamp_min(sum(rate(http_requests_total{job="purchase-gateway-metrics",status_code!~"4..",handler=~".*/webhook.*|.*/stripe/.*|.*/events/.*"}[6h])), 1e-10)
              ),
              0
            )

        # ── Tier-1 LMS Journey Availability (Owner: LMS) ───────────────
        # Journey: LMS login/SSO handoff and authentication surface.
        - record: mereka:http_requests:availability_ratio_5m
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_login
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[5m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[5m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_30m
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_login
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[30m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[30m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_1h
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_login
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[1h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[1h])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_6h
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_login
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[6h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*auth.*|.*login.*|.*oidc.*|.*sso.*"}[6h])), 1e-10)
              ),
              0
            )

        # ── Tier-1 LMS Journey Availability (Owner: LMS) ───────────────
        # Journey: learner launches and navigates courseware content.
        - record: mereka:http_requests:availability_ratio_5m
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_course_access
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[5m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[5m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_30m
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_course_access
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[30m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[30m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_1h
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_course_access
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[1h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[1h])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_6h
          labels:
            service: lms
            tier: "1"
            journey: journey_lms_course_access
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[6h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~".*/courses/.*/courseware.*|.*/learn/.*/info/?.*|.*/api/courseware/.*"}[6h])), 1e-10)
              ),
              0
            )

        # ── Tier-1 CMS Journey Availability (Owner: CMS) ───────────────
        # Journey: Studio authoring and course content edit flow.
        - record: mereka:http_requests:availability_ratio_5m
          labels:
            service: cms
            tier: "1"
            journey: journey_cms_authoring
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status=~"5..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[5m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status!~"4..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[5m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_30m
          labels:
            service: cms
            tier: "1"
            journey: journey_cms_authoring
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status=~"5..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[30m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status!~"4..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[30m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_1h
          labels:
            service: cms
            tier: "1"
            journey: journey_cms_authoring
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status=~"5..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[1h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status!~"4..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[1h])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_6h
          labels:
            service: cms
            tier: "1"
            journey: journey_cms_authoring
            journey_tier: "1"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status=~"5..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[6h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="cms-metrics",status!~"4..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[6h])), 1e-10)
              ),
              0
            )

        # ── Forum Availability (Tier 3, in-process with LMS) ────────────
        # Forum runs in the LMS process. Filter by view label for forum paths.
        # Uses django-prometheus via lms-metrics job.
        - record: mereka:http_requests:availability_ratio_5m
          labels:
            service: forum
            tier: "3"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~"forum.*|thread.*|comment.*"}[5m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~"forum.*|thread.*|comment.*"}[5m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_30m
          labels:
            service: forum
            tier: "3"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~"forum.*|thread.*|comment.*"}[30m]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~"forum.*|thread.*|comment.*"}[30m])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_1h
          labels:
            service: forum
            tier: "3"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~"forum.*|thread.*|comment.*"}[1h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~"forum.*|thread.*|comment.*"}[1h])), 1e-10)
              ),
              0
            )

        - record: mereka:http_requests:availability_ratio_6h
          labels:
            service: forum
            tier: "3"
          expr: |
            clamp_min(
              1 - (
                sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status=~"5..",view=~"forum.*|thread.*|comment.*"}[6h]))
                /
                clamp_min(sum(rate(django_http_responses_total_by_status_total{job="lms-metrics",status!~"4..",view=~"forum.*|thread.*|comment.*"}[6h])), 1e-10)
              ),
              0
            )

    # ── Burn Rate Recording Rules ─────────────────────────────────────────
    - name: slo.recording.rules.extended
      interval: 60s
      rules:

        # ── MFE Burn Rates (Tier 2: error_budget = 0.005) ──────────────
        - record: mereka:slo:burn_rate_5m
          labels:
            service: mfe
            tier: "2"
          expr: |
            (1 - mereka:http_requests:availability_ratio_5m{service="mfe"})
            / 0.005

        - record: mereka:slo:burn_rate_30m
          labels:
            service: mfe
            tier: "2"
          expr: |
            (1 - mereka:http_requests:availability_ratio_30m{service="mfe"})
            / 0.005

        - record: mereka:slo:burn_rate_1h
          labels:
            service: mfe
            tier: "2"
          expr: |
            (1 - mereka:http_requests:availability_ratio_1h{service="mfe"})
            / 0.005

        - record: mereka:slo:burn_rate_6h
          labels:
            service: mfe
            tier: "2"
          expr: |
            (1 - mereka:http_requests:availability_ratio_6h{service="mfe"})
            / 0.005

        # ── Purchase Gateway Burn Rates (Tier 1: error_budget = 0.0005) ─
        - record: mereka:slo:burn_rate_5m
          labels:
            service: purchase-gateway
            tier: "1"
          expr: |
