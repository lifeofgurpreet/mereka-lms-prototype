                / clamp_min(sum(increase(django_http_responses_total_by_status_total{job="cms-metrics",status!~"4..",view=~".*/course/.*/(settings|course_outline|updates|xblock|edit|group_configurations).*|.*/account/.*/dashboard.*"}[30d])), 1)
