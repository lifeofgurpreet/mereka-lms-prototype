    # ── Burn-Rate Alert Rules ─────────────────────────────────────────────
    # Multi-window burn-rate alerting per Google SRE Workbook §6.
    # Complements alerts in prometheusrule-slo.yaml (which covers LMS/CMS).
    - name: slo.alert.rules.extended
      rules:

        # ── Fast Burn (P1): 1h+5m > 14.4× ────────────────────────────
        # 2% of monthly budget consumed in 1 hour → page immediately.
        - alert: SLOBudgetFastBurnExtended
          expr: |
            mereka:slo:burn_rate_1h{service=~"mfe|purchase-gateway|forum"} > 14.4
            and
            mereka:slo:burn_rate_5m{service=~"mfe|purchase-gateway|forum"} > 14.4
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "{{ $labels.service }} SLO fast burn rate exceeded (P1)"
            description: >-
              {{ $labels.service }} (tier {{ $labels.tier }}) is consuming error budget
              at {{ $value | printf "%.1f" }}x the sustainable rate over the last hour.
              At this rate, the 30-day error budget will be exhausted within hours.
              Page on-call immediately.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/runbooks/operations/ONCALL_OBSERVABILITY_PLAYBOOK.md"

        # ── Slow Burn (P2): 6h+30m > 6× ─────────────────────────────
        # 5% of monthly budget consumed in 6 hours → create ticket.
        - alert: SLOBudgetSlowBurnExtended
          expr: |
            mereka:slo:burn_rate_6h{service=~"mfe|purchase-gateway|forum"} > 6
            and
            mereka:slo:burn_rate_30m{service=~"mfe|purchase-gateway|forum"} > 6
          for: 5m
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: "{{ $labels.service }} SLO slow burn rate exceeded (P2)"
            description: >-
              {{ $labels.service }} (tier {{ $labels.tier }}) is consuming error budget
              at {{ $value | printf "%.1f" }}x the sustainable rate over the last 6 hours.
              Create incident ticket and investigate within 2 hours.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/policies/operations/SLO_POLICY.md"

        # ── Journey Fast Burn (P1): 1h+5m > 14.4× ─────────────────────
        # Journey-owner contract (Tier-1): alert on direct journey burn-rate signals.
        - alert: SLOBudgetFastBurnJourney
          expr: |
            mereka:slo:journey_burn_rate_1h{journey=~"journey_lms_login|journey_lms_course_access|journey_cms_authoring|journey_purchase_checkout|journey_purchase_webhook"} > 14.4
            and
            mereka:slo:journey_burn_rate_5m{journey=~"journey_lms_login|journey_lms_course_access|journey_cms_authoring|journey_purchase_checkout|journey_purchase_webhook"} > 14.4
          for: 2m
          labels:
            severity: critical
            slo: availability
            journey_tier: "1"
          annotations:
            summary: "{{ $labels.journey }} journey fast burn rate exceeded"
            description: >-
              {{ $labels.journey }} ({{ $labels.service }}, tier {{ $labels.tier }}) is burning
              error budget at {{ $value | printf "%.1f" }}x sustainable rate over the last hour.
              Triggered on multi-window 5m/1h burn-rate check; investigate and mitigate immediately.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/runbooks/operations/ONCALL_OBSERVABILITY_PLAYBOOK.md"

        # ── Journey Slow Burn (P2): 6h+30m > 6× ────────────────────────
        - alert: SLOBudgetSlowBurnJourney
          expr: |
            mereka:slo:journey_burn_rate_6h{journey=~"journey_lms_login|journey_lms_course_access|journey_cms_authoring|journey_purchase_checkout|journey_purchase_webhook"} > 6
            and
            mereka:slo:journey_burn_rate_30m{journey=~"journey_lms_login|journey_lms_course_access|journey_cms_authoring|journey_purchase_checkout|journey_purchase_webhook"} > 6
          for: 5m
          labels:
            severity: warning
            slo: availability
            journey_tier: "1"
          annotations:
            summary: "{{ $labels.journey }} journey slow burn rate exceeded"
            description: >-
              {{ $labels.journey }} ({{ $labels.service }}, tier {{ $labels.tier }}) is burning
              error budget at {{ $value | printf "%.1f" }}x sustainable rate over the last 6 hours.
              Open ticket and include service owner + affected journey.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/policies/operations/SLO_POLICY.md"

        # ── Very Slow Burn (P3): 6h burn > 1× for 3 days ─────────────
        # Budget on track to fully exhaust by end of 30-day window.
        - alert: SLOBudgetVerySlowBurnExtended
          expr: |
            mereka:slo:burn_rate_6h{service=~"mfe|purchase-gateway|forum"} > 1
          for: 3h
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: "{{ $labels.service }} SLO very slow burn (P3)"
            description: >-
              {{ $labels.service }} (tier {{ $labels.tier }}) burn rate {{ $value | printf "%.2f" }}x
              sustained for 3+ hours. At this pace the monthly error budget will be exhausted
              before month-end. Add to weekly review agenda.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/policies/operations/SLO_POLICY.md"

        # ── Journey Very Slow Burn (P3): 6h burn > 1× for 3 hours ────────
        - alert: SLOBudgetVerySlowBurnJourney
          expr: |
            mereka:slo:journey_burn_rate_6h{journey=~"journey_lms_login|journey_lms_course_access|journey_cms_authoring|journey_purchase_checkout|journey_purchase_webhook"} > 1
          for: 3h
          labels:
            severity: warning
            slo: availability
            journey_tier: "1"
          annotations:
            summary: "{{ $labels.journey }} journey very slow burn"
            description: >-
              {{ $labels.journey }} ({{ $labels.service }}, tier {{ $labels.tier }}) has
              sustained burn above 1× for 3 hours. Budget will likely exhaust by month-end.
              Track in weekly reliability review with owner follow-up.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/policies/operations/SLO_POLICY.md"

        # ── Budget Exhausted (P1) ──────────────────────────────────────
        - alert: SLOBudgetExhaustedExtended
          expr: |
            mereka:slo:error_budget_remaining_ratio{service=~"mfe|purchase-gateway|forum"} <= 0
          for: 5m
          labels:
            severity: critical
            slo: error_budget
          annotations:
            summary: "{{ $labels.service }} error budget exhausted (P1)"
            description: >-
              {{ $labels.service }} (tier {{ $labels.tier }}) has consumed its entire 30-day
              error budget. Deployment freeze active. Activate reliability sprint.
              No feature deployments until budget recovers to ≥ 10%.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/runbooks/operations/ONCALL_OBSERVABILITY_PLAYBOOK.md"

        # ── Budget Low (P2): < 25% remaining ──────────────────────────
        - alert: SLOBudgetLowExtended
          expr: |
            mereka:slo:error_budget_remaining_ratio{service=~"mfe|purchase-gateway|forum"} < 0.25
            and
            mereka:slo:error_budget_remaining_ratio{service=~"mfe|purchase-gateway|forum"} > 0
          for: 10m
          labels:
            severity: warning
            slo: error_budget
          annotations:
            summary: "{{ $labels.service }} error budget below 25% (P2)"
            description: >-
              {{ $labels.service }} (tier {{ $labels.tier }}) has only
              {{ $value | humanizePercentage }} of its 30-day error budget remaining.
              Restrict deployments to critical fixes only.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/policies/operations/SLO_POLICY.md"

        # ── SLI Measurement Gap ────────────────────────────────────────
        - alert: SLIMeasurementDownExtended
          expr: |
            absent_over_time(mereka:http_requests:availability_ratio_5m{service="mfe"}[10m])
            or
            absent_over_time(mereka:http_requests:availability_ratio_5m{service="purchase-gateway"}[10m])
          for: 1m
          labels:
            severity: warning
            slo: measurement
          annotations:
            summary: "SLI measurement data missing for {{ $labels.service }}"
            description: >-
              No availability SLI data recorded for {{ $labels.service }} in the last 10 minutes.
              Verify the ServiceMonitor is scraping the metrics endpoint and the job label is correct.
            runbook_url: "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/docs/policies/operations/SLO_POLICY.md"
