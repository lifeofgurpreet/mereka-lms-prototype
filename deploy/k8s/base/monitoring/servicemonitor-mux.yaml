# ServiceMonitor for Mux Delivery Monitor
#
# @spec: video-pipeline-delivery_spec.md
# @covers AC-VPD-029
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mux-delivery-monitor
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: mux-delivery-monitor
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: monitoring
    release: monitoring  # bead mereka-lms-33d8: required by prod Prometheus serviceMonitorSelector
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mux-delivery-monitor
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s
