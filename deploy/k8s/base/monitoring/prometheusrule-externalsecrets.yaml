---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: externalsecret-alerts
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus
spec:
  groups:
    - name: externalsecrets.rules
      rules:
        - alert: ExternalSecretSyncFailure
          expr: |
            externalsecret_status_condition{namespace="mereka-lms",condition="Ready",status="False"} == 1
          for: 10m
          labels:
            severity: critical
            component: external-secrets
          annotations:
            summary: "ExternalSecret {{ $labels.name }} sync failing"
            description: >-
              ExternalSecret {{ $labels.name }} in namespace {{ $labels.namespace }}
              has not been Ready for more than 10 minutes. Secret data may be stale.
              Check ESO operator logs and ClusterSecretStore connectivity.

        - alert: ExternalSecretStaleSync
          expr: |
            changes(externalsecret_status_condition{namespace="mereka-lms",condition="Ready",status="True"}[2h]) == 0
          for: 5m
          labels:
            severity: warning
            component: external-secrets
          annotations:
            summary: "ExternalSecret {{ $labels.name }} not reconciled in 2h"
            description: >-
              ExternalSecret {{ $labels.name }} in namespace {{ $labels.namespace }}
              has not been reconciled in more than 2x the configured refresh interval
              (1h). The ESO controller may be backlogged or the ClusterSecretStore
              may be intermittently failing.
