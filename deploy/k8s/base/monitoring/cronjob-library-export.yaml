apiVersion: batch/v1
kind: CronJob
metadata:
  name: library-export
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: library-export
    app.kubernetes.io/component: backup
spec:
  suspend: true  # SUSPENDED: backup_libraries command does not exist in Ulmo.
  # Available: content_libraries_import (import only). Needs rewrite for v2 Content Libraries API.
  schedule: "0 3 * * *"  # Nightly at 3 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: library-export
        spec:
          restartPolicy: OnFailure
          containers:
            - name: library-export
              # Image is overridden by the kustomization images[] transformer.
              # Base uses docker.io/overhangio/openedx (remapped to ghcr.io image).
              image: docker.io/overhangio/openedx
              command:
                - python
                - manage.py
                - lms
                - backup_libraries
              env:
                - name: DJANGO_SETTINGS_MODULE
                  value: lms.envs.tutor.production
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
