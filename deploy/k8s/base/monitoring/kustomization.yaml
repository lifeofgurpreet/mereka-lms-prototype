---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mux-delivery-monitor-script
    files:
      - mux_delivery_monitor.py=./mux_delivery_monitor.py
resources:
  # ── Active ServiceMonitors (target service exists, selectors verified) ──
  - servicemonitor-caddy.yaml
  - servicemonitor-credentials.yaml
  - servicemonitor-purchase-gateway.yaml
  - servicemonitor-lms.yaml
  - servicemonitor-cms.yaml
  - servicemonitor-discovery.yaml
  - servicemonitor-mysql.yaml
  - servicemonitor-redis.yaml
  - servicemonitor-enterprise.yaml
  - servicemonitor-notes.yaml
  # ── QUARANTINED ServiceMonitors (not rendered) ───────────────────────────
  # servicemonitor-xqueue.yaml  — xqueue disabled (replicas=0 in all overlays).
  #                               Re-enable when xqueue is activated.
  # servicemonitor-forum.yaml   — Forum v2 is in-process with LMS; no separate
  #                               Service. Use job="lms-metrics" for forum data.
  # servicemonitor-mfe.yaml     — MFE Caddy proxy has no /metrics endpoint.
  #                               MFE infra covered by servicemonitor-caddy.yaml.
  # ── Active PrometheusRules ───────────────────────────────────────────────
  - prometheusrule-caddy.yaml
  - prometheusrule-credentials.yaml
  - prometheusrule-libraries.yaml
  - prometheusrule-lms.yaml
  - prometheusrule-enterprise.yaml
  - prometheusrule-services.yaml
  # prometheusrule-xqueue.yaml     — xqueue disabled (replicas=0 in all overlays).
  #                                  Re-enable when xqueue is activated.
  - prometheusrule-velero.yaml
  - prometheusrule-slo.yaml
  - prometheusrule-auth.yaml
  - slo-burn-rate-rules.yaml
  - mux-exporter.yaml
  - servicemonitor-mux.yaml
  - prometheusrule-video.yaml
  - prometheusrule-externalsecrets.yaml
  - prometheusrule-aspects.yaml
  - hpa-enterprise.yaml
  # ── QUARANTINED PrometheusRules (not rendered) ───────────────────────────
  # prometheusrule-email.yaml          — References SES exporter metrics
  #                                      (ses_bounce_total etc.) — exporter not
  #                                      deployed. Re-enable with SES exporter.
  # prometheusrule-ora2.yaml           — References custom ORA2 metrics not
  #                                      emitted by standard Open edX. Re-enable
  #                                      when ORA2 custom instrumentation is added.
  # prometheusrule-tenant-isolation.yaml — Depends on tenant_isolation_failures
  #                                        pushed via Pushgateway (not deployed).
  # ── CronJobs ─────────────────────────────────────────────────────────────
  - cronjob-course-reindex.yaml
  - cronjob-library-export.yaml
  - cronjob-tenant-isolation.yaml
