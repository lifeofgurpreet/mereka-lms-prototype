apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ora2-operations
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: ora2-operations
    app.kubernetes.io/component: monitoring
    prometheus: kube-prometheus
spec:
  groups:
    - name: ora2-storage
      interval: 5m
      rules:
        - alert: ORA2StorageHigh
          expr: |
            (ora2_file_storage_used_bytes / ora2_file_storage_total_bytes) * 100 > 90
          for: 10m
          labels:
            severity: warning
            component: ora2
          annotations:
            summary: "ORA2 file storage exceeds 90% capacity"
            description: |
              ORA2 file storage is at {{ $value | humanizePercentage }} capacity on /openedx/data/ora2.
              Current usage: {{ $labels.ora2_file_storage_used_bytes | humanize }}B / {{ $labels.ora2_file_storage_total_bytes | humanize }}B
              Immediate action required: clean up old files or expand storage.

        - alert: ORA2StorageCritical
          expr: |
            (ora2_file_storage_used_bytes / ora2_file_storage_total_bytes) * 100 > 95
          for: 5m
          labels:
            severity: critical
            component: ora2
          annotations:
            summary: "ORA2 file storage exceeds 95% capacity - CRITICAL"
            description: |
              ORA2 file storage is at {{ $value | humanizePercentage }} capacity on /openedx/data/ora2.
              CRITICAL: Storage nearly full. File uploads may fail.
              Current usage: {{ $labels.ora2_file_storage_used_bytes | humanize }}B / {{ $labels.ora2_file_storage_total_bytes | humanize }}B

    - name: ora2-grading
      interval: 5m
      rules:
        - alert: ORA2StaffGradingQueueHigh
          expr: |
            max(ora2_staff_grading_queue_size) by (course_id) > 50
          for: 1h
          labels:
            severity: warning
            component: ora2
          annotations:
            summary: "High number of submissions waiting for staff grading"
            description: |
              Course {{ $labels.course_id }} has {{ $value }} submissions waiting for staff grading.
              Review staff grading capacity and consider assigning more graders.

        - alert: ORA2GradePropagationFailures
          expr: |
            rate(ora2_grade_propagation_total{status="failed"}[5m]) > 0.05
          for: 15m
          labels:
            severity: warning
            component: ora2
          annotations:
            summary: "ORA2 grade propagation failures detected"
            description: |
              Grade propagation to gradebook is failing for course {{ $labels.course_id }}.
              Failure rate: {{ $value | humanizePercentage }}.
              Check logs for errors and verify gradebook integration.

    - name: ora2-peer-assessment
      interval: 5m
      rules:
        - alert: ORA2PeerGradingFallbackRateHigh
          expr: |
            rate(ora2_fallback_to_staff_total[1h]) > 5
          for: 30m
          labels:
            severity: warning
            component: ora2
          annotations:
            summary: "High rate of peer grading fallbacks to staff"
            description: |
              Course {{ $labels.course_id }} is experiencing high fallback rate: {{ $value }} fallbacks/hour.
              Reason: {{ $labels.fallback_reason }}.
              Review peer assessment configuration and student engagement.

    - name: ora2-file-uploads
      interval: 5m
      rules:
        - alert: ORA2FileUploadRejectionRateHigh
          expr: |
            rate(ora2_file_uploads_total{status=~"rejected_.*"}[5m]) / rate(ora2_file_uploads_total[5m]) > 0.1
          for: 15m
          labels:
            severity: warning
            component: ora2
          annotations:
            summary: "High file upload rejection rate"
            description: |
              {{ $value | humanizePercentage }} of file uploads are being rejected.
              Course: {{ $labels.course_id }}, File type: {{ $labels.file_type }}.
              Review file size limits and allowed file types configuration.
