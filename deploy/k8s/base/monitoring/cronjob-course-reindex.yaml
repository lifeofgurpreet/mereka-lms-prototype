---
# CronJob to reindex courses into Meilisearch via edx-search (MeilisearchEngine).
# The /courses catalog page queries Meilisearch course_info via edx-search.
# Without this, a Meilisearch restart/reset leaves /courses empty until manual reindex.
# Runs every 6 hours. Idempotent — safe to rerun at any time.
#
# NOTE: This deployment uses Meilisearch (not Elasticsearch).
# SEARCH_ENGINE = "search.meilisearch.MeilisearchEngine" in LMS/CMS settings.
# The reindex_course command uses edx-search which routes to Meilisearch.
# Index name: tutor_course_info (prefix "tutor_" + "course_info").
apiVersion: batch/v1
kind: CronJob
metadata:
  name: course-reindex
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: course-reindex
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: mereka-lms
spec:
  schedule: "30 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: course-reindex
        app.kubernetes.io/component: job
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: course-reindex
            app.kubernetes.io/component: pod
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: reindex
              # Image is overridden by the kustomization images[] transformer.
              image: docker.io/overhangio/openedx
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  echo "=== Course Catalog Reindex - $(date -u) ==="

                  echo "[1/3] Reindexing all courses into Meilisearch course_info..."
                  # --setup flag is Elasticsearch-only and not valid with MeilisearchEngine.
                  # MeilisearchEngine creates/configures the index automatically on first use.
                  python manage.py cms reindex_course --all 2>&1

                  echo "[2/3] Verifying course_info doc count via Meilisearch..."
                  # Index prefix is "tutor_" (MEILISEARCH_INDEX_PREFIX), so index = tutor_course_info.
                  # Meilisearch stats endpoint returns {"numberOfDocuments": N, ...}.
                  COUNT=$(curl -sf \
                    -H "Authorization: Bearer ${MEILISEARCH_API_KEY:-}" \
                    "http://meilisearch:7700/indexes/tutor_course_info/stats" \
                    | python3 -c "import sys,json; print(json.load(sys.stdin).get('numberOfDocuments',0))" \
                    2>/dev/null || echo "0")

                  echo "tutor_course_info docs: ${COUNT}"

                  if [ "${COUNT:-0}" -eq 0 ]; then
                    echo "WARN: tutor_course_info is empty after reindex (may be expected if no published courses)"
                  fi

                  echo "[3/3] Verifying CourseOverview count..."
                  python manage.py cms shell -c "
                  from openedx.core.djangoapps.content.course_overviews.models import CourseOverview
                  print(f'CourseOverview total: {CourseOverview.objects.count()}')
                  " 2>&1 | tail -1 || echo "Could not verify CourseOverview count"

                  echo "Reindex complete."
              env:
                - name: DJANGO_SETTINGS_MODULE
                  value: cms.envs.tutor.production
                - name: SERVICE_VARIANT
                  value: cms
                - name: SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: OPENEDX_SECRET_KEY
                - name: JWT_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: JWT_SECRET_KEY_CMS
                - name: MONGODB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: openedx-secrets
                      key: FORUM_MONGODB_HOST
              envFrom:
                - secretRef:
                    name: openedx-secrets
                - secretRef:
                    name: database-secrets
                - secretRef:
                    name: mereka-lms-runtime-secrets
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /openedx/edx-platform/lms/envs/tutor/
                  name: settings-lms
                - mountPath: /openedx/edx-platform/cms/envs/tutor/
                  name: settings-cms
                - mountPath: /openedx/config
                  name: config
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
          volumes:
            - name: tmp
              emptyDir: {}
            - name: settings-lms
              configMap:
                name: openedx-settings-lms
            - name: settings-cms
              configMap:
                name: openedx-settings-cms
            - name: config
              configMap:
                name: openedx-config
