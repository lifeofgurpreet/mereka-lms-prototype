---
# CronJob to reindex courses into Elasticsearch course_info index.
# The /courses catalog page queries ES course_info via edx-search.
# Without this, an ES restart/reset leaves /courses empty until manual reindex.
# Runs every 6 hours. Idempotent — safe to rerun at any time.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: course-reindex
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: course-reindex
    app.kubernetes.io/component: cronjob
    app.kubernetes.io/part-of: mereka-lms
spec:
  schedule: "30 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: course-reindex
        app.kubernetes.io/component: job
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: course-reindex
            app.kubernetes.io/component: pod
        spec:
          restartPolicy: Never
          containers:
            - name: reindex
              # Image is overridden by the kustomization images[] transformer.
              image: docker.io/overhangio/openedx
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  echo "=== Course Catalog Reindex - $(date -u) ==="

                  echo "[1/3] Reindexing all courses into ES course_info..."
                  python manage.py cms reindex_course --setup --all 2>&1

                  echo "[2/3] Verifying course_info doc count..."
                  COUNT=$(curl -sf http://elasticsearch:9200/course_info/_count \
                    | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))")

                  echo "course_info docs: ${COUNT}"

                  if [ "${COUNT:-0}" -eq 0 ]; then
                    echo "FAIL: course_info is empty after reindex"
                    exit 1
                  fi

                  echo "[3/3] Verifying CourseOverview count..."
                  python manage.py cms shell -c "
                  from openedx.core.djangoapps.content.course_overviews.models import CourseOverview
                  print(f'CourseOverview total: {CourseOverview.objects.count()}')
                  " 2>&1 | tail -1 || echo "Could not verify CourseOverview count"

                  echo "Reindex complete."
              env:
                - name: DJANGO_SETTINGS_MODULE
                  value: cms.envs.tutor.production
              envFrom:
                - secretRef:
                    name: openedx-secrets
                - secretRef:
                    name: database-secrets
                - secretRef:
                    name: mereka-lms-runtime-secrets
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /openedx/edx-platform/lms/envs/tutor/
                  name: settings-lms
                - mountPath: /openedx/edx-platform/cms/envs/tutor/
                  name: settings-cms
                - mountPath: /openedx/config
                  name: config
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
          volumes:
            - name: tmp
              emptyDir: {}
            - name: settings-lms
              configMap:
                name: openedx-settings-lms
            - name: settings-cms
              configMap:
                name: openedx-settings-cms
            - name: config
              configMap:
                name: openedx-config
