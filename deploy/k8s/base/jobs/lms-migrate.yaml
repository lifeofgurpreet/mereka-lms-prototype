---
# Migration Job for LMS (Open edX platform).
# Run this Job BEFORE rolling out a new LMS Deployment when Django
# schema migrations are pending.  Migrations are idempotent.
#
# Release sequence:
#   1. kubectl delete job/lms-migrate -n mereka-lms --ignore-not-found
#   2. kubectl apply -f deploy/k8s/base/jobs/lms-migrate.yaml -n mereka-lms
#   3. kubectl wait --for=condition=complete job/lms-migrate -n mereka-lms --timeout=600s
#   4. kubectl apply -k deploy/k8s/overlays/<env>
#
# PARITY RULE: This Job MUST use the same image, settings module,
# configMaps, secrets, and env vars as the LMS Deployment.
# If you change the LMS Deployment, update this Job to match.
apiVersion: batch/v1
kind: Job
metadata:
  name: lms-migrate
  labels:
    app.kubernetes.io/name: lms-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lms-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/part-of: mereka-lms
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Image MUST match the LMS Deployment image.
          # Overlays pin the real tag via kustomize image transformer.
          image: ghcr.io/biji-biji-initiative/mereka-lms/openedx:pin-required
          command: ["python", "manage.py", "lms", "migrate", "--noinput"]
          env:
            - name: SERVICE_VARIANT
              value: lms
            - name: DJANGO_SETTINGS_MODULE
              value: lms.envs.tutor.production
            # Remapped secret keys — must match LMS Deployment env block.
            - name: MONGODB_HOST
              valueFrom:
                secretKeyRef:
                  name: openedx-secrets
                  key: FORUM_MONGODB_HOST
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openedx-secrets
                  key: JWT_SECRET_KEY_LMS
          envFrom:
            - secretRef:
                name: openedx-secrets
            - secretRef:
                name: enterprise-sso-secrets
                optional: true
            - secretRef:
                name: database-secrets
            - secretRef:
                name: mereka-lms-runtime-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: settings-lms
              mountPath: /openedx/edx-platform/lms/envs/tutor/
            - name: settings-cms
              mountPath: /openedx/edx-platform/cms/envs/tutor/
            - name: config
              mountPath: /openedx/config
      volumes:
        - name: settings-lms
          configMap:
            name: openedx-settings-lms
        - name: settings-cms
          configMap:
            name: openedx-settings-cms
        - name: config
          configMap:
            name: openedx-config
