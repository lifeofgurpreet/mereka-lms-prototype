  - name: payments-gateway
    schema_owner: true
    database: postgresql
    migration_command: "python -m alembic upgrade head"
    pending_check: "python -m alembic current 2>&1 | grep -c '(head)' || echo 0"
    health_endpoint: "/health/"
    health_port: 8080
    release_critical: true
    dependencies:
      - postgresql-payments
      - redis
