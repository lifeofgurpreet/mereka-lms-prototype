# Migration Registry — Mereka LMS
# Every schema-owning service must declare its migration contract.
# The release gate (scripts/release/release-gate.sh) uses this to verify.
#
# Fields:
#   name              - Kubernetes workload name (matches contract.json workloads[].name)
#   schema_owner      - true if this service owns one or more DB schemas
#   database          - Database engine: mysql | postgresql
#   migration_command - Command to run migrations (idempotent)
#   pending_check     - Command to count pending migrations (outputs integer; 0 = clean)
#   health_endpoint   - HTTP path for post-migration readiness check
#   health_port       - Port for post-migration readiness check
#   release_critical  - true if failures block production release
#   dependencies      - Services that must be reachable before migration runs
#   disabled          - true if the service is currently scaled to 0 / not deployed
#
version: "1.0.0"

services:
  - name: lms
    schema_owner: true
    database: mysql
    migration_command: "python manage.py lms migrate --noinput"
    pending_check: "python manage.py lms showmigrations --plan | grep '\\[ \\]' | wc -l"
    health_endpoint: "/heartbeat"
    health_port: 8000
    release_critical: true
    dependencies:
      - mysql
      - redis

  - name: cms
    schema_owner: true
    database: mysql
    migration_command: "python manage.py cms migrate --noinput"
    pending_check: "python manage.py cms showmigrations --plan | grep '\\[ \\]' | wc -l"
    health_endpoint: "/heartbeat"
    health_port: 8000
    release_critical: true
    dependencies:
