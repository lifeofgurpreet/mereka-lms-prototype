# Canonical Tenant/Domain Registry v1.0
#
# Source of truth for ALL active domains, their tenant ownership,
# service participation, auth classification, and proof priority.
#
# This file is consumed by:
#   - scripts/tenants/verify-dev-runtime-proof.sh
#   - scripts/tenants/verify-staging-runtime-proof.sh
#   - scripts/tenants/verify-staging-tenant-proof.sh
#   - scripts/tenants/lib/runtime-proof-common.sh
#   - scripts/qa/verify-rke2-tenant-routes.sh
#   - scripts/qa/verify-mfe-config-api.sh
#   - deploy/k8s/contract.json (domain_registry summary projection)
#
# Rules:
#   1. Every domain that appears in Ingress, Caddyfile, ALLOWED_HOSTS,
#      or CORS/CSRF lists MUST appear here.
#   2. Every domain marked status: active MUST be proven by release gate.
#   3. Tenant identifiers match django.contrib.sites Site.domain values.
#   4. The registry is environment-parameterized: ${LMS_ROOT} etc. are
#      replaced by scripts at audit time using the environment's host vars.
#
# Maintainer: app repo (mereka-lms). GitOps consumes, never modifies.
---
version: "1.5.0"

# ============================================================================
# TENANTS
# ============================================================================
tenants:
  - slug: mereka
    name: Mereka Academy
    org_filter: [MEREKA]
    site_domain: academyv2.mereka.io          # django_site.domain (prod)
    theme: mereka
    is_primary: true

  - slug: biji-biji
    name: Biji-Biji Academy
    org_filter: [BIJIBIJI]
    site_domain: academy.biji-biji.com        # django_site.domain (prod)
    theme: mereka
    is_primary: false

  - slug: skillourfuture
    name: Skill Our Future
    org_filter: [SKILLOURFUTURE]
    site_domain: skillourfuture.academy.mereka.io  # django_site.domain (prod) — CURRENT
    target_site_domain: skillourfuture.academyv2.mereka.io  # migration target
    theme: mereka
    is_primary: false

# ============================================================================
# ENVIRONMENTS
# ============================================================================
#
# Placement metadata fields (added v1.3.0):
#   cluster_ref:          Name of the K8s cluster hosting this environment
#                         (matches cluster-topology-catalog.yaml keys)
#   cluster_class:        Cluster classification: gke-prod | shared-nonprod | local
#   gitops_repo:          GitHub org/repo that owns the GitOps overlay
#                         (empty for local — overlay is app-repo owned)
#   gitops_overlay_path:  Path within gitops_repo (or app repo for local) to
#                         the Kustomize overlay rendered by ArgoCD
#   argocd_app:           ArgoCD Application (or ApplicationSet-generated app)
#                         name that deploys this environment (empty for local)
#   runtime_proof_script: Repo-relative path to the runtime proof verification
#                         script, or empty string if none exists yet
#   dns_zone:             Cloudflare DNS zone managing the root_domain
#
environments:
  production:
    scheme: https
    root_domain: mereka.io
    auth_host: auth0.mereka.io
    namespace: mereka-lms
    cluster_ref: prod-gke
    cluster_class: gke-prod
    gitops_repo: Biji-Biji-Initiative/bbi-infrastructure
    gitops_overlay_path: apps/mereka-lms/overlays/prod
    argocd_app: mereka-lms-prod
    runtime_proof_script: ""
    dns_zone: mereka.io
  dev:
    scheme: https
    root_domain: mereka.dev
    auth_host: auth0.mereka.dev
    namespace: mereka-lms-dev
    cluster_ref: nonprod-rke2
    cluster_class: shared-nonprod
    gitops_repo: Biji-Biji-Initiative/bbi-infrastructure
    gitops_overlay_path: apps/mereka-lms/overlays/profiles/dev
    argocd_app: mereka-lms-dev
    runtime_proof_script: scripts/tenants/verify-dev-runtime-proof.sh
    dns_zone: mereka.dev
  profiles-dev:
    scheme: https
    root_domain: mereka.dev
    auth_host: auth0.mereka.dev
    namespace: mereka-lms-dev
    cluster_ref: nonprod-rke2
    cluster_class: shared-nonprod
    gitops_repo: Biji-Biji-Initiative/bbi-infrastructure
    gitops_overlay_path: apps/mereka-lms/overlays/profiles/dev
    argocd_app: mereka-lms-dev
    runtime_proof_script: scripts/tenants/verify-dev-runtime-proof.sh
    dns_zone: mereka.dev
  staging:
    scheme: https
    root_domain: mereka.io
    auth_host: staging.auth0.mereka.io
    namespace: stg-mereka-lms
    cluster_ref: nonprod-rke2
    cluster_class: shared-nonprod
    gitops_repo: Biji-Biji-Initiative/bbi-infrastructure
    gitops_overlay_path: apps/mereka-lms/overlays/staging
    argocd_app: mereka-lms-staging
    runtime_proof_script: scripts/tenants/verify-staging-runtime-proof.sh
    dns_zone: mereka.io
  local:
    scheme: http
    root_domain: localhost
    auth_host: ""
    namespace: mereka-lms
    cluster_ref: kind-local
    cluster_class: local
    gitops_repo: ""
    gitops_overlay_path: deploy/k8s/overlays/local
    argocd_app: ""
    runtime_proof_script: ""
    dns_zone: ""

# ============================================================================
# DOMAIN REGISTRY
# ============================================================================
# Every live domain across all environments and tenants.
#
# Fields:
#   domain:           FQDN
#   environment:      production | dev | profiles-dev | staging | local
#   tenant:           slug from tenants[] above
#   status:           active | alias | redirect-only | deprecated | parked | planned
#   role:             primary | studio | mfe | preview | discovery | notes |
#                     credentials | forum | enterprise-admin | enterprise-learner |
#                     analytics | ecommerce | payments | auth
#   service:          K8s service name that handles traffic
#   caddy_backend:    backend in Caddyfile (e.g. lms:8000)
#   auth_class:       DIRECT_AUTH_PARTICIPANT | REDIRECT_TARGET | CORS_ORIGIN |
#                     AUTH_TRANSPARENT | OIDC_PROVIDER
#   in_allowed_hosts: true/false - must appear in Django ALLOWED_HOSTS
#   in_cors:          true/false - must appear in CORS_ORIGIN_WHITELIST
#   in_csrf:          true/false - must appear in CSRF_TRUSTED_ORIGINS
#   in_redirect_list: true/false - must appear in LOGIN_REDIRECT_WHITELIST
#   cookie_domain:    expected cookie Domain attribute for this host
#   ingress_tls:      true/false - has TLS cert in Ingress
#   release_critical: true/false - release gate must prove this domain
#   proof_priority:   P0 (must pass) | P1 (should pass) | P2 (best effort)
#   notes:            free text

domains:
  # ==========================================================================
  # PRODUCTION — Mereka Academy (primary tenant)
  # ==========================================================================
  - domain: academyv2.mereka.io
    environment: production
    tenant: mereka
    status: active
    role: primary
    service: caddy
    caddy_backend: "lms:8000"
    auth_class: DIRECT_AUTH_PARTICIPANT
    in_allowed_hosts: true
    in_cors: true
    in_csrf: true
    in_redirect_list: false
    cookie_domain: ".academyv2.mereka.io"
    ingress_tls: true
    release_critical: true
    proof_priority: P0

