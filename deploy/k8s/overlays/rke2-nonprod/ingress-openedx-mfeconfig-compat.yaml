# rke2-nonprod compat: normalize trailing-slash MFE config endpoint used by some authn clients.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openedx-mfe-mfeconfig-compat
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/mfe_config/v1
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: apps.academyv2.mereka.dev
      http:
        paths:
          - path: /api/mfe_config/v1/
            pathType: Exact
            backend:
              service:
                name: lms
                port:
                  number: 8000
