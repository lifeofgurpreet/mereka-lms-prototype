# TODO: Replace apps.academyv2.staging.mereka.dev with actual staging domain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openedx-mfe
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: openedx-mfe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: apps.academyv2.staging.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
  tls:
    - hosts:
        - apps.academyv2.staging.mereka.dev
      secretName: openedx-mfe-tls
