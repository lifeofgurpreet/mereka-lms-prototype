# ARC PVC storage class confirmation for rke2-nonprod.
#
# IMPORTANT: This file is NOT applied via the rke2-nonprod kustomization.yaml patches list.
# Reason: the rke2-nonprod overlay sets namespace: mereka-lms globally, which would override
# the arc-runners namespace in these PVCs. ARC resources must be applied separately:
#
#   kubectl apply -k deploy/k8s/base/arc/
#
# The base manifests already set storageClassName: local-path. This file documents the
# expected state for verification purposes only.
#
# To verify the PVCs have the correct storage class after apply:
#   kubectl get pvc -n arc-runners -o custom-columns='NAME:.metadata.name,SC:.spec.storageClassName'
#
# Expected output:
#   NAME               SC
#   arc-docker-cache   local-path
#   arc-dep-cache      local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arc-docker-cache
  namespace: arc-runners
spec:
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arc-dep-cache
  namespace: arc-runners
spec:
  storageClassName: local-path
