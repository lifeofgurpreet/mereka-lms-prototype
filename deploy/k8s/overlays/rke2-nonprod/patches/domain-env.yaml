            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.dev
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
            - name: MFE_BASE_URL
              value: https://apps.academyv2.mereka.dev
            - name: MEREKA_AUTH_DOMAIN
              value: auth0.mereka.dev
            - name: MEREKA_CREDENTIALS_DOMAIN
              value: credentials.academyv2.mereka.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-worker
spec:
  template:
    spec:
      containers:
        - name: cms-worker
          env:
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.dev
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
            - name: MFE_BASE_URL
              value: https://apps.academyv2.mereka.dev
            - name: MEREKA_AUTH_DOMAIN
