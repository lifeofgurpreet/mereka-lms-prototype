            - name: MEREKA_CREDENTIALS_DOMAIN
              value: credentials.academyv2.mereka.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credentials
spec:
  template:
    spec:
      containers:
        - name: credentials
          env:
            - name: MEREKA_CREDENTIALS_DOMAIN
              value: credentials.academyv2.mereka.dev
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: MEREKA_SCHEME
              value: https
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery
spec:
  template:
    spec:
      containers:
        - name: discovery
          env:
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
            - name: DISCOVERY_DOMAIN
              value: discovery.academyv2.mereka.dev
            - name: DISCOVERY_BASE_URL
              value: https://discovery.academyv2.mereka.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
spec:
  template:
    spec:
      containers:
        - name: notes
          env:
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: NOTES_DOMAIN
              value: notes.academyv2.mereka.dev
---
# CronJob domain overrides
apiVersion: batch/v1
kind: CronJob
metadata:
  name: discovery-sync
  namespace: mereka-lms
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              env:
                - name: LMS_URL
                  value: https://academyv2.mereka.dev
                - name: DISCOVERY_URL
                  value: https://discovery.academyv2.mereka.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-catalog
spec:
  template:
    spec:
      initContainers:
        - name: config-gen
          env:
            - name: LMS_ROOT_URL
              value: https://academyv2.mereka.dev
      containers:
        - name: enterprise-catalog
          env:
            - name: LMS_ROOT_URL
              value: https://academyv2.mereka.dev
---
