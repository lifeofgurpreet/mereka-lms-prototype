# Domain overrides for rke2-nonprod dev environment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
spec:
  template:
    spec:
      containers:
        - name: lms
          env:
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.dev
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
            - name: MFE_BASE_URL
              value: https://apps.academyv2.mereka.dev
            - name: MEREKA_AUTH_DOMAIN
              value: auth0.mereka.dev
            - name: MEREKA_CREDENTIALS_DOMAIN
              value: credentials.academyv2.mereka.dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
spec:
  template:
    spec:
      containers:
        - name: cms
          env:
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.dev
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
            - name: MFE_BASE_URL
              value: https://apps.academyv2.mereka.dev
            - name: MEREKA_AUTH_DOMAIN
              value: auth0.mereka.dev
            - name: MEREKA_CREDENTIALS_DOMAIN
              value: credentials.academyv2.mereka.dev
---
apiVersion: apps/v1
