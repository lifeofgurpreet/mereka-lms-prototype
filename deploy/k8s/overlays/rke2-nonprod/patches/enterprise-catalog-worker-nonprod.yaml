# enterprise-catalog-worker nonprod patch
#
# Fixes from bbi-infrastructure agent runtime hotfix (2026-02-25):
#   - Recreate strategy: avoids OldReplicaSet lingering on single-node cluster
#   - Probe hardening: Celery inspect ping can be slow under load (30s timeout)
#
# Evidence: 2026-02-25T23-55-40Z-wave-lms-enterprise-worker-and-secret-parity.md

apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-catalog-worker
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: enterprise-catalog-worker
          readinessProbe:
            timeoutSeconds: 30
            periodSeconds: 30
          livenessProbe:
            timeoutSeconds: 30
