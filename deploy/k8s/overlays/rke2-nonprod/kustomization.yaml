apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# rke2-nonprod overlay — bbi-infrastructure dev/staging cluster
#
# Differences from production (GKE):
#   - Secrets: uses infisical-secret-store (not gcp-secret-manager; no Workload Identity)
#   - Images: pulled from GHCR using ghcr-registry imagePullSecret (no Workload Identity)
#   - Domains: *.staging.mereka.dev (update to actual domain below)
#   - ArgoCD: SSH-only to github.com (port 443 blocked by Cilium)
#
# IMPORTANT: Before deploying, ensure these manual prerequisites exist on rke2-nonprod:
#   1. ClusterSecretStore infisical-secret-store (Valid/Ready)
#   2. Secret ghcr-registry in mereka-lms namespace (imagePullSecret for GHCR)
#   3. Default ServiceAccount patched: imagePullSecrets: [{name: ghcr-registry}]
#      OR each Deployment has spec.template.spec.imagePullSecrets set
#
# Domain: rke2-nonprod dev hostnames use *.academyv2.mereka.dev.
#
# AUTH KEY OWNERSHIP (issue #174):
#   This repo owns:
#     - OAUTH_OIDC_ISSUER (the LMS's own JWT issuer, domain-specific per env)
#     - THIRD_PARTY_AUTH_BACKENDS (the list of available auth backends)
#   bbi-infrastructure owns (canonical, set in overlays/dev/patches/production-staging.py):
#     - SOCIAL_AUTH_OIDC_OIDC_ENDPOINT (Authentik provider endpoint URL)
#     - SOCIAL_AUTH_OIDC_KEY (Authentik client ID / OIDC key)
#     - SOCIAL_AUTH_OIDC_SECRET (via K8s secret openedx-secrets → OIDC_CLIENT_SECRET)
#     - SOCIAL_AUTH_REDIRECT_IS_HTTPS / SOCIAL_AUTH_OIDC_REDIRECT_IS_HTTPS
#   Do NOT add these to config/lms.env.yml or config/cms.env.yml — bbi-infrastructure
#   is the single source of truth for Authentik/OIDC ownership.

namespace: mereka-lms

resources:
  - ../../base
  - ../../base/plugins/aspects
  - ingress-openedx-lms.yaml
  - ingress-openedx-mfe.yaml
  - ingress-openedx-mfeconfig-compat.yaml
  - ingress-openedx-studio.yaml
  - ingress-enterprise-admin.yaml
  - ingress-enterprise-learner.yaml
  - ingress-credentials.yaml
  - ingress-notes.yaml
  # NOTE: ARC resources (deploy/k8s/base/arc/) are NOT included here because this overlay
  # sets namespace: mereka-lms which would override arc-systems/arc-runners namespaces.
  # Apply ARC separately: kubectl apply -k deploy/k8s/base/arc/
  # See: docs/operations/CI_CD_RUNNERS.md for the full deploy sequence.

# Immutable SHA-pinned image tags (no mutable mereka-brand tag).
# Image Updater will manage these tags once enrolled.
images:
  # Keep canonical (docker.io) + transformed (GHCR) names aligned to avoid post-transform drift.
  - name: docker.io/overhangio/openedx
    newName: ghcr.io/biji-biji-initiative/mereka-lms/openedx
    newTag: c2719c3a
    digest: sha256:b6d75c8da854f160cc30cd169ba909cbc96de5cc3b8f9375353e9651cf5fd924
  - name: ghcr.io/biji-biji-initiative/mereka-lms/openedx
    newTag: c2719c3a
    digest: sha256:b6d75c8da854f160cc30cd169ba909cbc96de5cc3b8f9375353e9651cf5fd924
  - name: docker.io/overhangio/openedx-mfe
    newName: ghcr.io/biji-biji-initiative/mereka-lms/mfe
    newTag: c2719c3a
    digest: sha256:007d6bce86e3bec3f7a4e9357237ebe0b6809be26401c8679faaf60402bec792
  - name: ghcr.io/biji-biji-initiative/mereka-lms/mfe
    newTag: c2719c3a
    digest: sha256:007d6bce86e3bec3f7a4e9357237ebe0b6809be26401c8679faaf60402bec792
  # Enterprise MFEs — GHCR (migrated from GAR)
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-admin-portal
    newTag: nreum-clean-202602200416
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-learner-portal
    newTag: nreum-clean-202602200416
  # Enterprise backend services — frozen at 21.0.0 (archived upstream, Nov 2024)
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-catalog
    newTag: "21.0.0"
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-subsidy
    newTag: "21.0.0"
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-access
    newTag: "21.0.0"
  - name: ghcr.io/biji-biji-initiative/mereka-lms/license-manager
    newTag: "21.0.0"

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: openedx-config
    behavior: merge
    files:
      - config/cms.env.yml
      - config/lms.env.yml
  # Override enterprise MFE env.config.js with dev domains (*.mereka.dev)
  - name: enterprise-mfe-env
    behavior: replace
    files:
      - env.config.js=enterprise-mfe-env.js
    options:
      labels:
        app.kubernetes.io/component: enterprise

patches:
  # Remove stub mongodb Service — no in-cluster pods; Atlas is used
  - path: patches/remove-legacy-mongodb-service.yaml
  # Switch all ExternalSecrets from gcp-secret-manager to infisical-secret-store
  - path: patches/externalsecrets-infisical.yaml
  # Override domain env vars for rke2-nonprod dev hosts
  - path: patches/domain-env.yaml
  - path: patches/aspects-storage-class.yaml
  - path: patches/aspects-ingress-dev.yaml
  - path: patches/aspects-container-hardening.yaml
  # enterprise-catalog-worker: Recreate strategy + probe hardening (from infra agent handoff)
  - path: patches/enterprise-catalog-worker-nonprod.yaml
  # imagePullPolicy: Always patch removed — immutable SHA tags don't need it
  # payments-gateway: switch to infisical + DEV Stripe keys
  - path: patches/payments-gateway-secrets-infisical.yaml
    target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: payments-gateway-secrets

# Minimal replicas for nonprod (same as local)
replicas:
  - name: lms
    count: 1
  - name: cms
    count: 1
  - name: lms-worker
    count: 1
  - name: cms-worker
    count: 1
  - name: discovery
    count: 1
  - name: notes
    count: 1
  # Enterprise services: set to 1 if images are accessible, else keep 0
  - name: enterprise-access
    count: 1
  - name: enterprise-access-worker
    count: 1
  - name: enterprise-admin-portal
    count: 1
  - name: enterprise-catalog
    count: 1
  - name: enterprise-catalog-worker
    count: 1
  - name: enterprise-learner-portal
    count: 1
  - name: enterprise-subsidy
    count: 1
  # xqueue: disabled — XQUEUE_INTERFACE.url is null in lms/cms env; no courses use it
  - name: xqueue
    count: 0
  # Payments gateway: set to 1 when PostgreSQL is confirmed available
  - name: payments-gateway
    count: 1
  - name: clickhouse
    count: 1
  - name: superset
    count: 1
  - name: superset-worker
    count: 1
