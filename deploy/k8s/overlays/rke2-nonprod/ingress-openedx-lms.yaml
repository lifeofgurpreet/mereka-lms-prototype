# rke2-nonprod dev hosts (DNS + cert-manager TLS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openedx-lms
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: openedx-lms
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
    - host: preview.academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
    - host: discovery.academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
    - host: ecommerce.academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
    - host: notes.academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
    - host: credentials.academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
    - host: forum.academyv2.mereka.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
  tls:
    - hosts:
        - academyv2.mereka.dev
        - preview.academyv2.mereka.dev
        - discovery.academyv2.mereka.dev
        - ecommerce.academyv2.mereka.dev
        - notes.academyv2.mereka.dev
        - credentials.academyv2.mereka.dev
        - forum.academyv2.mereka.dev
      secretName: openedx-lms-tls
