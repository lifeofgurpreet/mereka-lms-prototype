apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
spec:
  template:
    spec:
      containers:
        - name: lms
          env:
            - name: MEREKA_LMS_DOMAIN
              value: academyv2.mereka.dev
            - name: MEREKA_SCHEME
              value: https
            - name: MEREKA_COOKIE_DOMAIN
              value: .academyv2.mereka.dev
            - name: LMS_BASE_URL
              value: https://academyv2.mereka.dev
            - name: MFE_BASE_URL
              value: https://apps.academyv2.mereka.dev
---
