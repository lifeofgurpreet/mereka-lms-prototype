# Patch for kind-dev: keep all Open edX secrets identical to base, but point
# Stripe env vars at *_DEV secrets so dev can use Stripe test keys safely.
#
# NOTE: This file intentionally contains the full `spec.data` list because
# `patchesStrategicMerge` cannot merge CRD lists safely; a partial list would
# replace the entire list and blank out required secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openedx-secrets
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: openedx-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: openedx-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENEDX_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OPENEDX_SECRET_KEY
        metadataPolicy: None
    - secretKey: SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OPENEDX_SECRET_KEY
        metadataPolicy: None
    - secretKey: CMS_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CMS_SECRET_KEY
        metadataPolicy: None

    - secretKey: MONGODB_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MONGODB_USERNAME
        metadataPolicy: None
    - secretKey: MONGODB_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MONGODB_PASSWORD
        metadataPolicy: None
    # Forum v2 (Python) - MongoDB connection for in-process forum
    - secretKey: FORUM_MONGODB_HOST
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_FORUM_MONGODB_SRV
        metadataPolicy: None
    - secretKey: FORUM_MONGODB_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MONGODB_PASSWORD
        metadataPolicy: None
    # Meilisearch (forum search engine)
    - secretKey: MEILISEARCH_MASTER_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MEILISEARCH_MASTER_KEY
        metadataPolicy: None
    - secretKey: MEILISEARCH_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_MEILISEARCH_API_KEY
        metadataPolicy: None

    - secretKey: JWT_SECRET_KEY_LMS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_CMS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_CMS
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_DISCOVERY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_DISCOVERY
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_ECOMMERCE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_ECOMMERCE
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_NOTES
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_NOTES
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_XQUEUE
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_XQUEUE
        metadataPolicy: None
    - secretKey: JWT_PRIVATE_SIGNING_JWK
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_PRIVATE_SIGNING_JWK
        metadataPolicy: None

    - secretKey: EDX_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EDX_API_KEY
        metadataPolicy: None
    - secretKey: ECOMMERCE_API_SIGNING_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_ECOMMERCE_API_SIGNING_KEY
        metadataPolicy: None
    - secretKey: ECOMMERCE_EDX_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_EDX_API_KEY
        metadataPolicy: None

    - secretKey: DISCOVERY_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_DISCOVERY_SECRET_KEY
        metadataPolicy: None
    - secretKey: DISCOVERY_SOCIAL_AUTH_EDX_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_DISCOVERY_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: DISCOVERY_BACKEND_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_DISCOVERY_BACKEND_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: ECOMMERCE_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_ECOMMERCE_SECRET_KEY
        metadataPolicy: None
    - secretKey: ECOMMERCE_SOCIAL_AUTH_EDX_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_ECOMMERCE_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: ECOMMERCE_BACKEND_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_ECOMMERCE_BACKEND_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: NOTES_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_NOTES_SECRET_KEY
        metadataPolicy: None
    - secretKey: NOTES_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_NOTES_CLIENT_SECRET
        metadataPolicy: None
    - secretKey: XQUEUE_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_XQUEUE_SECRET_KEY
        metadataPolicy: None
    - secretKey: XQUEUE_LMS_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_XQUEUE_PASSWORD
        metadataPolicy: None
    - secretKey: CMS_SOCIAL_AUTH_EDX_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CMS_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_OIDC_CLIENT_SECRET
        metadataPolicy: None
    - secretKey: CREDENTIALS_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CREDENTIALS_SECRET_KEY
        metadataPolicy: None
    - secretKey: CREDENTIALS_BACKEND_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CREDENTIALS_BACKEND_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: CREDENTIALS_SSO_OAUTH2_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_CREDENTIALS_SSO_OAUTH2_SECRET
        metadataPolicy: None
    - secretKey: JWT_SECRET_KEY_CREDENTIALS
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_JWT_SECRET_KEY_CREDENTIALS
        metadataPolicy: None

    # Stripe (dev only): point at *_DEV secrets so we can use Stripe test keys.
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_STRIPE_SECRET_KEY_DEV
        metadataPolicy: None
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_STRIPE_PUBLISHABLE_KEY_DEV
        metadataPolicy: None
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MEREKA_LMS_STRIPE_WEBHOOK_SECRET_DEV
        metadataPolicy: None
