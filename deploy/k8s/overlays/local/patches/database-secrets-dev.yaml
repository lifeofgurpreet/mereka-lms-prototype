apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-secrets
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: database-secrets
spec:
  # In kind dev we intentionally use *_DEV keys so local DB credentials can
  # diverge safely from production, while keeping Infisical as the source of truth
  # (dev env -> *_DEV secrets in GCP Secret Manager).
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_ROOT_PASSWORD_DEV
    - secretKey: OPENEDX_MYSQL_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_PASSWORD_DEV
    - secretKey: MYSQL_DISCOVERY_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_DISCOVERY_PASSWORD_DEV
    - secretKey: MYSQL_ECOMMERCE_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_ECOMMERCE_PASSWORD_DEV
    - secretKey: MYSQL_NOTES_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_NOTES_PASSWORD_DEV
    - secretKey: MYSQL_XQUEUE_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_XQUEUE_PASSWORD_DEV
    - secretKey: MYSQL_CREDENTIALS_PASSWORD
      remoteRef:
        key: MEREKA_LMS_MYSQL_CREDENTIALS_PASSWORD_DEV
