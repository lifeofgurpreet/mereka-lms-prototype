apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mereka-lms

resources:
  - ../../base
  - clusterissuer-letsencrypt-prod.yaml
  - ingress-openedx-lms.yaml
  - ingress-openedx-mfe.yaml
  - ingress-openedx-studio.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: ses-smtp-credentials
    literals:
      - RELAY_USERNAME=dev
      - RELAY_PASSWORD=dev

patchesStrategicMerge:
  - patches/domain-env.yaml
  - patches/clustersecretstore-gcp.yaml
  - patches/openedx-secrets-dev.yaml
  - patches/database-secrets-dev.yaml
  - patches/forum-dev.yaml

# Use local images
images:
  # Local overlay should not depend on `:latest` tags (which trigger AlwaysPull).
  # Keep images aligned with production tags; load them into kind nodes before apply.
  - name: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx
    newTag: 20260207-branding-pass7-5b26e45
  - name: docker.io/overhangio/openedx-mfe
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx-mfe
    newTag: 20260208-mfe-discussions-pass4-c17df16

# Minimal replicas for local dev
replicas:
  - name: lms
    count: 1
  - name: cms
    count: 1
  - name: lms-worker
    count: 1
  - name: cms-worker
    count: 1
