apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mereka-lms

resources:
  - ../../base
  - clusterissuer-letsencrypt-prod.yaml
  - ingress-openedx-lms.yaml
  - ingress-openedx-mfe.yaml
  - ingress-openedx-studio.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: ses-smtp-credentials
    literals:
      - RELAY_USERNAME=dev
      - RELAY_PASSWORD=dev

patchesStrategicMerge:
  - patches/domain-env.yaml
  - patches/clustersecretstore-gcp.yaml
  - patches/openedx-secrets-dev.yaml
  - patches/database-secrets-dev.yaml
  - patches/forum-dev.yaml

# Use local images
images:
  - name: openedx
    newName: openedx
    newTag: latest
  - name: openedx-mfe
    newName: openedx-mfe
    newTag: latest

# Minimal replicas for local dev
replicas:
  - name: lms
    count: 1
  - name: cms
    count: 1
  - name: lms-worker
    count: 1
  - name: cms-worker
    count: 1
