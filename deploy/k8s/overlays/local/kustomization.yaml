apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mereka-lms

resources:
  - ../../base
  - clusterissuer-letsencrypt-prod.yaml
  - ingress-openedx-lms.yaml
  - ingress-openedx-mfe.yaml
  - ingress-openedx-studio.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: enterprise-mfe-env
    behavior: replace
    files:
      - env.config.js=enterprise-mfe-env.js
    options:
      labels:
        app.kubernetes.io/component: enterprise

secretGenerator:
  - name: ses-smtp-credentials
    literals:
      - RELAY_USERNAME=dev
      - RELAY_PASSWORD=dev

patches:
  - path: patches/domain-env.yaml
  - path: patches/clustersecretstore-gcp.yaml
  - path: patches/openedx-secrets-dev.yaml
  - path: patches/database-secrets-dev.yaml
  - path: patches/meilisearch-security-context.yaml
  - path: patches/cms-memory-limits.yaml
  # forum-dev.yaml removed: Forum v2 runs in-process within LMS (no separate deployment)

# Use local images
images:
  # Local overlay should not depend on `:latest` tags (which trigger AlwaysPull).
  # Keep images aligned with production tags; load them into kind nodes before apply.
  - name: ghcr.io/biji-biji-initiative/mereka-lms/openedx
    newTag: 20260207-branding-pass7-5b26e45
  - name: docker.io/overhangio/openedx-mfe
    newName: ghcr.io/biji-biji-initiative/mereka-lms/mfe
    newTag: c1ef8f8f-20260301182820

# Minimal replicas for local dev
replicas:
  - name: lms
    count: 1
  - name: cms
    count: 1
  - name: lms-worker
    count: 1
  - name: cms-worker
    count: 1
  # Enterprise services disabled — images require GCR auth not available in Kind
  - name: enterprise-access
    count: 0
  - name: enterprise-access-worker
    count: 0
  - name: enterprise-admin-portal
    count: 0
  - name: enterprise-catalog
    count: 0
  - name: enterprise-catalog-worker
    count: 0
  - name: enterprise-learner-portal
    count: 0
  - name: enterprise-subsidy
    count: 0
  # Payments gateway disabled — image not loaded into Kind
  - name: payments-gateway
    count: 0
