# @covers AC-021
# @spec: disaster-recovery-business-continuity_spec.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mereka-lms

resources:
  - ../../base
  - ingress-openedx-lms.yaml
  - ingress-openedx-mfe.yaml
  - ingress-openedx-studio.yaml
  - ingress-enterprise-mfe.yaml

patches:
  - path: patches/remove-legacy-mongodb-service.yaml
  - path: patches/resource-limits.yaml

# Production-specific configurations

# Image tags for production (use specific SHA or version)
images:
  - name: docker.io/overhangio/openedx
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx
    newTag: mereka-brand-hotfix-full-v3
  - name: docker.io/overhangio/openedx-mfe
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx-mfe
    newTag: 1c66529-20260220023917
  - name: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx-mfe
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/openedx-mfe
    newTag: 1c66529-20260220023917
  # Enterprise MFE: NREUM-clean + env placeholder patching (strip-nreum.sh + patch-missing-env.sh)
  # Rebuilt 2026-02-20 after script hardening (ae7b125): env.config.js wired, MISSING_ENV_VAR patched
  - name: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-admin-portal
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-admin-portal
    newTag: nreum-clean-202602200322
  - name: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-learner-portal
    newName: asia-southeast1-docker.pkg.dev/mereka-lms/openedx/enterprise-learner-portal
    newTag: nreum-clean-202602200322

# Production replica counts (higher for availability)
replicas:
  - name: lms
    count: 2
  - name: cms
    count: 1
  - name: lms-worker
    count: 2
  - name: cms-worker
    count: 1
