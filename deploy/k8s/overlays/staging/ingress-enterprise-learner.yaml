# Enterprise Learner Portal — staging host
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-learner-portal
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: enterprise-learner-portal
    app.kubernetes.io/component: enterprise
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: learner.staging.academyv2.mereka.io
      http:
        paths:
          # LMS auth endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lms
                port:
                  number: 8000
          - path: /csrf
            pathType: Prefix
            backend:
              service:
                name: lms
                port:
                  number: 8000
          - path: /login_refresh
            pathType: Prefix
            backend:
              service:
                name: lms
                port:
                  number: 8000
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: lms
                port:
                  number: 8000
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: lms
                port:
                  number: 8000
          # Default — serve the learner portal MFE
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-learner-portal
                port:
                  number: 8002
  tls:
    - hosts:
        - learner.staging.academyv2.mereka.io
      secretName: staging-enterprise-learner-portal-tls
