# Staging — Credentials service (program certificates, learner records)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credentials
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: credentials
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: staging.credentials.academyv2.mereka.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: credentials
                port:
                  number: 8000
  tls:
    - hosts:
        - staging.credentials.academyv2.mereka.io
      secretName: staging-credentials-tls
