apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# DEPRECATED — boundary.debt — NOT consumed by ArgoCD.
# ArgoCD deploys from bbi-infrastructure/apps/mereka-lms/overlays/staging/.
# This overlay is retained for reference only. Do NOT add new files here.
# Scheduled for removal in Wave 9 (legacy deletion).

# Staging overlay — rke2-nonprod cluster, staging domains
#
# Environment: staging.academyv2.mereka.io (on rke2-nonprod)
# Shares cluster with dev (rke2-nonprod) but uses staging.* domains.
#
# Differences from dev (rke2-nonprod overlay):
#   - Domains: staging.academyv2.mereka.io (not academyv2.mereka.dev)
#   - Replicas: same minimal counts
#   - Purpose: pre-production validation before GKE rollout
#
# Prerequisites (same as rke2-nonprod — shared cluster):
#   1. ClusterSecretStore infisical-secret-store-staging (Valid/Ready)
#   2. Secret ghcr-registry in mereka-lms namespace (imagePullSecret for GHCR)
#   3. Default ServiceAccount patched: imagePullSecrets: [{name: ghcr-registry}]

namespace: mereka-lms

resources:
  - ../../base
  - ../../base/plugins/aspects
  - ingress-openedx-lms.yaml
  - ingress-openedx-mfe.yaml
  - ingress-openedx-studio.yaml
  - ingress-enterprise-admin.yaml
  - ingress-enterprise-learner.yaml
  - ingress-credentials.yaml
  - ingress-notes.yaml

# Staging-specific configurations
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      environment: staging

# Immutable SHA-pinned image tags (promote from dev after validation).
images:
  # Keep canonical (docker.io) + transformed (GHCR) names aligned to avoid post-transform drift.
  - name: docker.io/overhangio/openedx
    newName: ghcr.io/biji-biji-initiative/mereka-lms/openedx
    newTag: c2719c3a
    digest: sha256:b6d75c8da854f160cc30cd169ba909cbc96de5cc3b8f9375353e9651cf5fd924
  - name: ghcr.io/biji-biji-initiative/mereka-lms/openedx
    newTag: c2719c3a
    digest: sha256:b6d75c8da854f160cc30cd169ba909cbc96de5cc3b8f9375353e9651cf5fd924
  - name: docker.io/overhangio/openedx-mfe
    newName: ghcr.io/biji-biji-initiative/mereka-lms/mfe
    newTag: c2719c3a
    digest: sha256:007d6bce86e3bec3f7a4e9357237ebe0b6809be26401c8679faaf60402bec792
  - name: ghcr.io/biji-biji-initiative/mereka-lms/mfe
    newTag: c2719c3a
    digest: sha256:007d6bce86e3bec3f7a4e9357237ebe0b6809be26401c8679faaf60402bec792
  # Enterprise MFEs — GHCR
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-admin-portal
    newTag: nreum-clean-202602200416
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-learner-portal
    newTag: nreum-clean-202602200416
  # Enterprise backend services — frozen at 21.0.0 (archived upstream, Nov 2024)
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-catalog
    newTag: "21.0.0"
    digest: sha256:5ef5ee4bea398af0027c5e85d107860145a0dced7c0ad022edd99cd7fa5c1cbc
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-subsidy
    newTag: "21.0.0"
    digest: sha256:2d701f8f9c6482176eade8d028d0bff653fbc03e4b1b619d21238dd2b9f8a461
  - name: ghcr.io/biji-biji-initiative/mereka-lms/enterprise-access
    newTag: "21.0.0"
    digest: sha256:5315667f47d93beed464c59e9fb6c393428a4f0156e57a39f03c439f257caa22
  - name: ghcr.io/biji-biji-initiative/mereka-lms/license-manager
    newTag: "21.0.0"
    digest: sha256:11cad063c297761353b38df9255fdebfa244038f5ab90f660935bd9ecc39d138

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: openedx-config
    behavior: merge
    files:
      - config/cms.env.yml
      - config/lms.env.yml
  # Override enterprise MFE env.config.js with staging domains
  - name: enterprise-mfe-env
    behavior: replace
    files:
      - env.config.js=enterprise-mfe-env.js
    options:
      labels:
        app.kubernetes.io/component: enterprise

patches:
  # Remove stub mongodb Service — no in-cluster pods; Atlas is used
  - path: patches/remove-legacy-mongodb-service.yaml
  # Switch all ExternalSecrets from gcp-secret-manager to infisical-secret-store-staging
  - path: patches/externalsecrets-infisical.yaml
  # Override domain env vars for staging hosts
  - path: patches/domain-env.yaml
  - path: patches/aspects-storage-class.yaml
  - path: patches/aspects-ingress-staging.yaml
  - path: patches/aspects-container-hardening.yaml
  # enterprise-catalog-worker: Recreate strategy + probe hardening
  - path: patches/enterprise-catalog-worker-nonprod.yaml
  # payments-gateway: switch to infisical + DEV Stripe keys
  - path: patches/payments-gateway-secrets-infisical.yaml
    target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: payments-gateway-secrets

# Staging replica counts (minimal — same as dev)
replicas:
  - name: lms
    count: 1
  - name: cms
    count: 1
  - name: lms-worker
    count: 1
  - name: cms-worker
    count: 1
  - name: discovery
    count: 1
  - name: notes
    count: 1
  # Enterprise services
  - name: enterprise-access
    count: 1
  - name: enterprise-access-worker
    count: 1
  - name: enterprise-admin-portal
    count: 1
  - name: enterprise-catalog
    count: 1
  - name: enterprise-catalog-worker
    count: 1
  - name: enterprise-learner-portal
    count: 1
  - name: enterprise-subsidy
    count: 1
  # xqueue: disabled — XQUEUE_INTERFACE.url is null in lms/cms env; no courses use it
  - name: xqueue
    count: 0
  # Payments gateway
  - name: payments-gateway
    count: 1
  - name: clickhouse
    count: 1
  - name: superset
    count: 1
  - name: superset-worker
    count: 1
