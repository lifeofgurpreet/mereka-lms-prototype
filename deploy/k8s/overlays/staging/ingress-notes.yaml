# Staging — Notes service (learner notes / annotations)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes
  namespace: mereka-lms
  labels:
    app.kubernetes.io/name: notes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: staging.notes.academyv2.mereka.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notes
                port:
                  number: 8000
  tls:
    - hosts:
        - staging.notes.academyv2.mereka.io
      secretName: staging-notes-tls
