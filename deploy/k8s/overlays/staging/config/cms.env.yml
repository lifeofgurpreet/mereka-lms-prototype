SITE_NAME: "staging.studio.academyv2.mereka.io"
BOOK_URL: ""
LOG_DIR: "/openedx/data/logs"
LOGGING_ENV: "staging"
# OAUTH_OIDC_ISSUER: this is the LMS's own JWT/OAuth2 issuer URL (not the Authentik provider
# endpoint). Must match the staging domain. Ownership: this repo (domain-specific env override).
OAUTH_OIDC_ISSUER: "https://staging.academyv2.mereka.io/oauth2"
# NOTE: SOCIAL_AUTH_OIDC_OIDC_ENDPOINT, SOCIAL_AUTH_OIDC_KEY, SOCIAL_AUTH_OIDC_REDIRECT_IS_HTTPS,
# and SOCIAL_AUTH_REDIRECT_IS_HTTPS are intentionally omitted here.
# Canonical ownership: bbi-infrastructure (overlays/staging/patches/production-staging.py).
# Duplicating them here creates two sources of truth and risks divergence.
PLATFORM_NAME: "Mereka Academy"
THIRD_PARTY_AUTH_BACKENDS:
  - social_core.backends.open_id_connect.OpenIdConnectAuth
  - social_core.backends.google.GoogleOAuth2
  - social_core.backends.linkedin.LinkedinOAuth2
  - social_core.backends.facebook.FacebookOAuth2
  - social_core.backends.azuread.AzureADOAuth2
  - common.djangoapps.third_party_auth.appleid.AppleIdAuth
  - common.djangoapps.third_party_auth.identityserver3.IdentityServer3
  - common.djangoapps.third_party_auth.saml.SAMLAuthBackend
  - common.djangoapps.third_party_auth.lti.LTIAuthBackend
FEATURES:


  CERTIFICATES_HTML_VIEW: true
  PREVIEW_LMS_BASE: "staging.preview.academyv2.mereka.io"
  ENABLE_COURSEWARE_INDEX: true
  ENABLE_CSMH_EXTENDED: false
  ENABLE_LEARNER_RECORDS: false
  ENABLE_LIBRARY_INDEX: true
  MILESTONES_APP: true
  ENABLE_PREREQUISITE_COURSES: true
LMS_ROOT_URL: "https://staging.academyv2.mereka.io"
CMS_ROOT_URL: "https://staging.studio.academyv2.mereka.io"
CMS_BASE: "staging.studio.academyv2.mereka.io"
LMS_BASE: "staging.academyv2.mereka.io"
CONTACT_EMAIL: "contact@localhost"
CELERY_BROKER_TRANSPORT: "redis"
CELERY_BROKER_HOSTNAME: "redis:6379"
CELERY_BROKER_VHOST: "0"
CELERY_BROKER_USER: ""
CELERY_BROKER_PASSWORD: ""
ALTERNATE_WORKER_QUEUES: "lms"
ENABLE_COMPREHENSIVE_THEMING: true
EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
EMAIL_HOST: "smtp"
EMAIL_PORT: 8025
EMAIL_USE_TLS: false
HTTPS: "on"
LANGUAGE_CODE: "en"
SESSION_COOKIE_DOMAIN: ".staging.academyv2.mereka.io"

# SECRET_KEY is now provided via Kubernetes Secret (openedx-secrets)
# See deploy/k8s/base/secrets/openedx-secrets.yaml
SECRET_KEY: ""  # Populated from CMS_SECRET_KEY env var
AWS_ACCESS_KEY_ID: ""
AWS_SECRET_ACCESS_KEY: ""
DOC_STORE_CONFIG: null

XQUEUE_INTERFACE:
  django_auth: null
  url: null
DATABASES:
  default:
    ENGINE: "django.db.backends.mysql"
    HOST: "mysql"
    PORT: 3306
    NAME: "openedx"
    USER: "openedx"
    PASSWORD: ""  # Populated from OPENEDX_MYSQL_PASSWORD env var
    ATOMIC_REQUESTS: true
    OPTIONS:
      init_command: "SET sql_mode='STRICT_TRANS_TABLES'"
      charset: "utf8mb4"
EMAIL_HOST_USER: ""
EMAIL_HOST_PASSWORD: ""
