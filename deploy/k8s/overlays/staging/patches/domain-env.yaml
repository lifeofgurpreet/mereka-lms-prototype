---
# CronJob domain overrides
apiVersion: batch/v1
kind: CronJob
metadata:
  name: discovery-sync
  namespace: mereka-lms
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: sync
              env:
                - name: LMS_URL
                  value: https://staging.academyv2.mereka.io
                - name: DISCOVERY_URL
                  value: https://discovery.staging.academyv2.mereka.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-catalog
spec:
  template:
    spec:
      initContainers:
        - name: config-gen
          env:
            - name: LMS_ROOT_URL
              value: https://staging.academyv2.mereka.io
      containers:
        - name: enterprise-catalog
          env:
            - name: LMS_ROOT_URL
              value: https://staging.academyv2.mereka.io
