name: 'Set up Python environment'
description: 'Install Python with pip cache and base QA dependencies'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.12'
  requirements-file:
    description: 'Path to requirements file for pip install + cache key hashing'
    required: false
    default: 'requirements-ci.txt'
  extra-deps:
    description: 'Additional pip packages (only for one-off deps not in a requirements file)'
    required: false
    default: ''
  install-base-deps:
    description: 'Install from requirements-file (set false to skip)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Ensure pip cache directory exists
      shell: bash
      run: |
        # Some ARC/GitHub runners set HOME/.cache on a root-owned mount and
        # disallow sudo via no_new_privs. Pick a writable pip cache path
        # without privilege escalation and export it for setup-python + pip.
        choose_pip_cache_dir() {
          local candidate
          for candidate in "$HOME/.cache/pip" "${RUNNER_TEMP:-}/pip-cache" "/tmp/pip-cache"; do
            [ -n "$candidate" ] || continue
            mkdir -p "$candidate" 2>/dev/null || continue
            if [ -w "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          done
          return 1
        }

        PIP_CACHE_DIR="$(choose_pip_cache_dir)"
        echo "PIP_CACHE_DIR=$PIP_CACHE_DIR" >> "$GITHUB_ENV"
        echo "Using pip cache dir: $PIP_CACHE_DIR"

    - name: Ensure lsb_release exists for setup-python pip cache
      shell: bash
      run: |
        # actions/setup-python v5 calls `lsb_release -rs` and `lsb_release -is`
        # to build the pip cache key. ARC runner images lack the lsb-release
        # package and we cannot apt-install (no sudo). Provide a minimal stub.
        if ! command -v lsb_release &>/dev/null; then
          stub="$GITHUB_WORKSPACE/.cache/bin/lsb_release"
          mkdir -p "$(dirname "$stub")"
          cat > "$stub" <<'STUB'
        #!/bin/sh
        # Minimal lsb_release stub for actions/setup-python pip cache.
        # Handles: -r/-rs (release), -i/-is (id), -d/-ds (description),
        #          -c/-cs (codename), -a (all), -s (short modifier).
        short=0; cmd=""
        for arg in "$@"; do
          case "$arg" in
            -s|--short) short=1 ;;
            -rs) cmd=r; short=1 ;;
            -is) cmd=i; short=1 ;;
            -ds) cmd=d; short=1 ;;
            -cs) cmd=c; short=1 ;;
            -r|--release) cmd=r ;;
            -i|--id) cmd=i ;;
            -d|--description) cmd=d ;;
            -c|--codename) cmd=c ;;
            -a|--all) cmd=a ;;
          esac
        done
        case "$cmd" in
          r) [ "$short" = 1 ] && echo "0" || printf 'Release:\t0\n' ;;
          i) [ "$short" = 1 ] && echo "Linux" || printf 'Distributor ID:\tLinux\n' ;;
          d) [ "$short" = 1 ] && echo "ARC Runner" || printf 'Description:\tARC Runner\n' ;;
          c) [ "$short" = 1 ] && echo "arc" || printf 'Codename:\tarc\n' ;;
          a) printf 'Distributor ID:\tLinux\nDescription:\tARC Runner\nRelease:\t0\nCodename:\tarc\n' ;;
          *) echo "No LSB modules are available." ;;
        esac
        STUB
          chmod +x "$stub"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"
          echo "Installed lsb_release stub at $stub"
        fi

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Install dependencies from requirements file
      if: ${{ inputs.install-base-deps == 'true' }}
      shell: bash
      run: |
        pip install -U pip
        pip install -r ${{ inputs.requirements-file }}

    - name: Install extra dependencies
      if: ${{ inputs.extra-deps != '' }}
      shell: bash
      run: pip install ${{ inputs.extra-deps }}
