name: 'Set up Python environment'
description: 'Install Python with pip cache and base QA dependencies'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.12'
  requirements-file:
    description: 'Path to requirements file for pip install + cache key hashing'
    required: false
    default: 'requirements-ci.txt'
  extra-deps:
    description: 'Additional pip packages (only for one-off deps not in a requirements file)'
    required: false
    default: ''
  install-base-deps:
    description: 'Install from requirements-file (set false to skip)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Check system Python
      id: check-python
      shell: bash
      run: |
        # ARC runner image (arc-runner-general) ships Python 3.12 + pip.
        # Skip setup-python (7-18 min download) when system Python matches.
        REQUIRED="${{ inputs.python-version }}"
        SYSTEM_VER="$(python3 --version 2>/dev/null | sed 's/Python //' || echo 'missing')"
        if [[ "$SYSTEM_VER" == "$REQUIRED"* ]]; then
          echo "System Python $SYSTEM_VER satisfies $REQUIRED — skipping setup-python"
          echo "skip_setup=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::System Python ($SYSTEM_VER) does not match $REQUIRED — will use setup-python"
          echo "skip_setup=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Ensure pip cache directory exists
      if: steps.check-python.outputs.skip_setup == 'false'
      shell: bash
      run: |
        choose_pip_cache_dir() {
          local candidate
          for candidate in "$HOME/.cache/pip" "${RUNNER_TEMP:-}/pip-cache" "/tmp/pip-cache"; do
            [ -n "$candidate" ] || continue
            mkdir -p "$candidate" 2>/dev/null || continue
            if [ -w "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          done
          return 1
        }
        PIP_CACHE_DIR="$(choose_pip_cache_dir)"
        echo "PIP_CACHE_DIR=$PIP_CACHE_DIR" >> "$GITHUB_ENV"

    - name: Ensure lsb_release exists for setup-python pip cache
      if: steps.check-python.outputs.skip_setup == 'false'
      shell: bash
      run: |
        if ! command -v lsb_release &>/dev/null; then
          stub="$GITHUB_WORKSPACE/.cache/bin/lsb_release"
          mkdir -p "$(dirname "$stub")"
          cat > "$stub" <<'STUB'
        #!/bin/sh
        short=0; cmd=""
        for arg in "$@"; do
          case "$arg" in
            -s|--short) short=1 ;;
            -rs) cmd=r; short=1 ;;
            -is) cmd=i; short=1 ;;
            -ds) cmd=d; short=1 ;;
            -cs) cmd=c; short=1 ;;
            -r|--release) cmd=r ;;
            -i|--id) cmd=i ;;
            -d|--description) cmd=d ;;
            -c|--codename) cmd=c ;;
            -a|--all) cmd=a ;;
          esac
        done
        case "$cmd" in
          r) [ "$short" = 1 ] && echo "0" || printf 'Release:\t0\n' ;;
          i) [ "$short" = 1 ] && echo "Linux" || printf 'Distributor ID:\tLinux\n' ;;
          d) [ "$short" = 1 ] && echo "ARC Runner" || printf 'Description:\tARC Runner\n' ;;
          c) [ "$short" = 1 ] && echo "arc" || printf 'Codename:\tarc\n' ;;
          a) printf 'Distributor ID:\tLinux\nDescription:\tARC Runner\nRelease:\t0\nCodename:\tarc\n' ;;
          *) echo "No LSB modules are available." ;;
        esac
        STUB
          chmod +x "$stub"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"
        fi

    - name: Set up Python ${{ inputs.python-version }}
      if: steps.check-python.outputs.skip_setup == 'false'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Add user site-packages bin to PATH
      if: steps.check-python.outputs.skip_setup == 'true'
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install dependencies from requirements file
      if: ${{ inputs.install-base-deps == 'true' }}
      shell: bash
      run: |
        pip install --break-system-packages -U pip 2>/dev/null || pip install -U pip
        pip install --break-system-packages -r ${{ inputs.requirements-file }} 2>/dev/null \
          || pip install -r ${{ inputs.requirements-file }}

    - name: Install extra dependencies
      if: ${{ inputs.extra-deps != '' }}
      shell: bash
      run: |
        pip install --break-system-packages ${{ inputs.extra-deps }} 2>/dev/null \
          || pip install ${{ inputs.extra-deps }}
