name: 'Set up Python environment'
description: 'Install Python with pip cache and base QA dependencies'

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.12'
  requirements-file:
    description: 'Path to requirements file for pip install + cache key hashing'
    required: false
    default: 'requirements-ci.txt'
  extra-deps:
    description: 'Additional pip packages (only for one-off deps not in a requirements file)'
    required: false
    default: ''
  install-base-deps:
    description: 'Install from requirements-file (set false to skip)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Ensure pip cache directory exists
      shell: bash
      run: |
        # Some ARC/GitHub runners set HOME/.cache on a root-owned mount and
        # disallow sudo via no_new_privs. Pick a writable pip cache path
        # without privilege escalation and export it for setup-python + pip.
        choose_pip_cache_dir() {
          local candidate
          for candidate in "$HOME/.cache/pip" "${RUNNER_TEMP:-}/pip-cache" "/tmp/pip-cache"; do
            [ -n "$candidate" ] || continue
            mkdir -p "$candidate" 2>/dev/null || continue
            if [ -w "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          done
          return 1
        }

        PIP_CACHE_DIR="$(choose_pip_cache_dir)"
        echo "PIP_CACHE_DIR=$PIP_CACHE_DIR" >> "$GITHUB_ENV"
        echo "Using pip cache dir: $PIP_CACHE_DIR"

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Install dependencies from requirements file
      if: ${{ inputs.install-base-deps == 'true' }}
      shell: bash
      run: |
        pip install -U pip
        pip install -r ${{ inputs.requirements-file }}

    - name: Install extra dependencies
      if: ${{ inputs.extra-deps != '' }}
      shell: bash
      run: pip install ${{ inputs.extra-deps }}
