name: Select Build Lane
description: Repo-side fastlane selector contract for heavy build workflows

inputs:
  enabled:
    description: Whether fastlane routing is enabled
    required: true
  lane_mode:
    description: Routing override for build workflows
    required: false
    default: auto
  fastlane_label:
    description: Preferred fastlane runner label
    required: true
  timezone:
    description: Fastlane office-hours timezone
    required: false
    default: ''
  office_hours_start:
    description: Fastlane office-hours start
    required: false
    default: ''
  office_hours_end:
    description: Fastlane office-hours end
    required: false
    default: ''
  runner_status_token:
    description: Token for runner status lookup
    required: false
    default: ''
  github_app_id:
    description: GitHub App ID for fastlane checks
    required: false
    default: ''
  github_app_installation_id:
    description: GitHub App installation ID for fastlane checks
    required: false
    default: ''
  github_app_private_key:
    description: GitHub App private key for fastlane checks
    required: false
    default: ''

outputs:
  runner_label:
    description: Selected runner label
    value: ${{ steps.select.outputs.runner_label }}
  decision:
    description: Fastlane routing decision
    value: ${{ steps.select.outputs.decision }}
  reason:
    description: Reason for the selected lane
    value: ${{ steps.select.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Select GitHub-hosted fallback runner lane
      id: select
      shell: bash
      run: |
        {
          echo "runner_label=ubuntu-latest"
          echo "decision=public-repo-fallback"
          echo "reason=Public repo cannot resolve the private BBI runner selector; using GitHub-hosted runner"
        } >> "$GITHUB_OUTPUT"
