name: Docs Compliance

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-compliance.yml"
      - "docs/qa/verify-doc-command-refs.sh"
      - "docs/qa/verify-doc-command-ref-baseline.sh"
      - "docs/qa/verify-doc-command-ref-baseline-test.sh"
      - "docs/qa/verify-doc-link-integrity.sh"
      - "docs/qa/verify-doc-link-integrity.py"
      - "docs/qa/verify-doc-catalog-health-test.sh"
      - "docs/qa/verify-docs-policy.sh"
      - "docs/qa/verify-doc-catalog-health.py"
      - "docs/qa/build-docs-scorecard.py"
      - "docs/qa/build-docs-scorecard-test.sh"
      - "docs/qa/build-docs-compliance-summary.py"
      - "docs/qa/build-docs-compliance-summary-test.sh"
      - "docs/qa/verify-docs-foundation-gates.sh"
      - "docs/qa/verify-docs-foundation-gates-test.sh"
      - "docs/qa/generate-docs-scorecard-report.sh"
      - "docs/qa/generate-docs-scorecard-report-test.sh"
      - "docs/qa/verify-docs-scorecard-recency.sh"
      - "docs/qa/verify-docs-scorecard-recency-test.sh"
      - "docs/qa/verify-docs-scorecard-report-consistency.sh"
      - "docs/qa/verify-docs-scorecard-report-consistency-test.sh"
      - "docs/qa/verify-docs-scorecard-head-freshness.sh"
      - "docs/qa/verify-docs-scorecard-head-freshness-test.sh"
      - "docs/qa/verify-docs-scorecard-report-timestamp.sh"
      - "docs/qa/verify-docs-scorecard-report-timestamp-test.sh"
      - "docs/qa/verify-docs-scorecard-delta-artifact.sh"
      - "docs/qa/verify-docs-scorecard-delta-artifact-test.sh"
      - "docs/qa/verify-docs-scorecard-generation-drift.sh"
      - "docs/qa/verify-docs-scorecard-generation-drift-test.sh"
      - "docs/qa/verify-doc-command-refs-test.sh"
      - "docs/qa/compare-docs-scorecard-to-base.sh"
      - "docs/qa/compare-docs-scorecard-to-base-test.sh"
      - "docs/catalog.json"
      - "scripts/qa/verify-repo-structure.sh"

jobs:
  docs-compliance:
    name: Run docs compliance gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify docs policy
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-policy.sh
          DOCS_POLICY_SUMMARY="${RUNNER_TEMP}/docs-policy-summary.json"
          ./docs/qa/verify-docs-policy.sh \
            --range "origin/${{ github.base_ref }}...${{ github.sha }}" \
            --summary-json "$DOCS_POLICY_SUMMARY"
          python3 - "$DOCS_POLICY_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
import json
import sys

with open(sys.argv[1], "r", encoding="utf-8") as fp:
    payload = json.load(fp)

with open(sys.argv[2], "a", encoding="utf-8") as fp:
    fp.write("### Docs Policy\n")
    fp.write(f"- status={payload.get('status', 'unknown')}\n")
    fp.write(f"- range={payload.get('range', 'n/a')}\n")
    fp.write(f"- root_allowlist_violations={payload.get('root_allowlist_violations', 0)}\n")
    fp.write(f"- changed_markdown_files={payload.get('changed_markdown_files', 0)}\n")
    fp.write(f"- content_status={payload.get('content_status', 'unknown')}\n")
    fp.write(f"- content_files_checked={payload.get('content_files_checked', 0)}\n")
    fp.write(f"- content_errors={len(payload.get('content_errors', []))}\n")
PY

      - name: Verify repository structure
        run: |
          ./scripts/qa/verify-repo-structure.sh

      - name: Verify doc command references
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-doc-command-refs.sh
          chmod +x docs/qa/verify-doc-command-ref-baseline.sh
          DOCS_CMDREF_SUMMARY="${RUNNER_TEMP}/docs-command-refs-summary.json"
          DOCS_CMDREF_BASELINE_SUMMARY="${RUNNER_TEMP}/docs-cmdref-baseline-summary.json"
          mapfile -t CHANGED_DOCS < <(git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" -- 'docs/**/*.md' 'docs/*.md' || true)
          CHANGED_DOCS_COUNT=${#CHANGED_DOCS[@]}

          {
            echo "### Docs Command Reference Scope"
            echo "- Changed docs (PR scope): ${CHANGED_DOCS_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

          ./docs/qa/verify-doc-command-ref-baseline.sh --summary-json "$DOCS_CMDREF_BASELINE_SUMMARY"

          if [ "$CHANGED_DOCS_COUNT" -gt 0 ]; then
            echo "Changed docs (PR scoped):"
            printf '%s\n' "${CHANGED_DOCS[@]}"
            ./docs/qa/verify-doc-command-refs.sh --include-baseline --summary-json "$DOCS_CMDREF_SUMMARY" "${CHANGED_DOCS[@]}"
          else
            ./docs/qa/verify-doc-command-refs.sh --include-baseline --summary-json "$DOCS_CMDREF_SUMMARY"
          fi

          python3 - "$DOCS_CMDREF_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
import json
import sys

with open(sys.argv[1], "r", encoding="utf-8") as fp:
    payload = json.load(fp)

missing = payload.get("missing", [])

with open(sys.argv[2], "a", encoding="utf-8") as fp:
    fp.write("### Docs Command Reference Summary\n")
    fp.write(f"- files_checked={payload.get('files_checked', 0)}\n")
    fp.write(f"- total_candidates={payload.get('total_candidates', 0)}\n")
    fp.write(f"- missing_references={payload.get('missing_references', 0)}\n")
    fp.write(f"- status={payload.get('status')}\n")
    for item in missing[:15]:
        fp.write(f"- {item}\n")
PY

          python3 - "$DOCS_CMDREF_BASELINE_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
