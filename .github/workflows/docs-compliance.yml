name: Docs Compliance

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-compliance.yml"
      - "tools/docs/verify/verify-doc-command-refs.sh"
      - "tools/docs/verify/verify-doc-command-ref-baseline.sh"
      - "docs/qa/verify-doc-command-ref-baseline-test.sh"
      - "tools/docs/verify/verify-doc-link-integrity.sh"
      - "tools/docs/verify/verify-doc-link-integrity.py"
      - "tools/docs/verify/verify-doc-catalog-health-test.sh"
      - "tools/docs/verify/verify-docs-policy.sh"
      - "tools/docs/verify/verify-doc-catalog-health.py"
      - "tools/docs/scorecards/build-docs-scorecard.py"
      - "tools/docs/scorecards/build-docs-scorecard-test.sh"
      - "tools/docs/scorecards/build-docs-compliance-summary.py"
      - "docs/qa/build-docs-compliance-summary-test.sh"
      - "tools/docs/verify/verify-docs-foundation-gates.sh"
      - "docs/qa/verify-docs-foundation-gates-test.sh"
      - "tools/docs/verify/run-docs-world-class-gates.sh"
      - "tools/docs/verify/run-docs-world-class-gates-test.sh"
      - "docs/qa/verify-docs-compliance-workflow-contract-test.sh"
      - "tools/docs/scorecards/generate-docs-scorecard-report.sh"
      - "tools/docs/scorecards/generate-docs-scorecard-report-test.sh"
      - "tools/docs/verify/verify-docs-scorecard-recency.sh"
      - "docs/qa/verify-docs-scorecard-recency-test.sh"
      - "tools/docs/verify/verify-docs-scorecard-report-consistency.sh"
      - "docs/qa/verify-docs-scorecard-report-consistency-test.sh"
      - "tools/docs/verify/verify-docs-scorecard-head-freshness.sh"
      - "docs/qa/verify-docs-scorecard-head-freshness-test.sh"
      - "tools/docs/verify/verify-docs-scorecard-report-timestamp.sh"
      - "docs/qa/verify-docs-scorecard-report-timestamp-test.sh"
      - "tools/docs/verify/verify-docs-scorecard-delta-artifact.sh"
      - "docs/qa/verify-docs-scorecard-delta-artifact-test.sh"
      - "docs/qa/verify-docs-scorecard-generation-drift.sh"
      - "docs/qa/verify-docs-scorecard-generation-drift-test.sh"
      - "docs/qa/verify-doc-command-refs-test.sh"
      - "tools/docs/scorecards/compare-docs-scorecard-to-base.sh"
      - "tools/docs/scorecards/compare-docs-scorecard-to-base-test.sh"
      - "generated/catalogs/docs-catalog.json"
      - "scripts/qa/verify-repo-structure.sh"

jobs:
  docs-compliance:
    name: Run docs compliance gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout push SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve docs base ref context
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "DOCS_POLICY_RANGE=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            echo "DOCS_BASE_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "DOCS_POLICY_RANGE=HEAD~1...HEAD" >> "$GITHUB_ENV"
            echo "DOCS_BASE_REF=HEAD~1" >> "$GITHUB_ENV"
          fi

      - name: Verify docs policy
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-docs-policy.sh
          DOCS_POLICY_SUMMARY="${RUNNER_TEMP}/docs-policy-summary.json"
          ./tools/docs/verify/verify-docs-policy.sh \
            --range "$DOCS_POLICY_RANGE" \
            --summary-json "$DOCS_POLICY_SUMMARY"
          python3 docs/qa/helpers/summarize-docs-policy.py "$DOCS_POLICY_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify repository structure
        run: |
          ./scripts/qa/verify-repo-structure.sh

      - name: Verify doc command references
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-doc-command-refs.sh
          chmod +x tools/docs/verify/verify-doc-command-ref-baseline.sh
          if [ ! -f tools/docs/verify/.doc-command-ref-baseline ]; then
            cat > tools/docs/verify/.doc-command-ref-baseline <<'EOF'
# Baseline high-risk docs that must always be command-reference validated.
docs/ops/runbooks/DEPLOYMENT_RUNBOOK.md
docs/ops/quickref/QUICK_REFERENCE.md
docs/guides/branding/BRANDING_OPERATOR_GUIDE.md
docs/reference/operations/OBSERVABILITY_PARITY_MATRIX.md
EOF
          fi
          DOCS_CMDREF_SUMMARY="${RUNNER_TEMP}/docs-command-refs-summary.json"
          DOCS_CMDREF_BASELINE_SUMMARY="${RUNNER_TEMP}/docs-cmdref-baseline-summary.json"
          mapfile -t CHANGED_DOCS < <(git diff --name-only "$DOCS_POLICY_RANGE" -- 'docs/**/*.md' 'docs/*.md' || true)
          CHANGED_DOCS_COUNT=${#CHANGED_DOCS[@]}

          {
            echo "### Docs Command Reference Scope"
            echo "- Changed docs (PR scope): ${CHANGED_DOCS_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

          ./tools/docs/verify/verify-doc-command-ref-baseline.sh --summary-json "$DOCS_CMDREF_BASELINE_SUMMARY"

          if [ "$CHANGED_DOCS_COUNT" -gt 0 ]; then
            echo "Changed docs (PR scoped):"
            printf '%s\n' "${CHANGED_DOCS[@]}"
            ./tools/docs/verify/verify-doc-command-refs.sh --include-baseline --summary-json "$DOCS_CMDREF_SUMMARY" "${CHANGED_DOCS[@]}"
          else
            ./tools/docs/verify/verify-doc-command-refs.sh --include-baseline --summary-json "$DOCS_CMDREF_SUMMARY"
          fi

          python3 docs/qa/helpers/summarize-cmdref.py "$DOCS_CMDREF_SUMMARY" "$GITHUB_STEP_SUMMARY"
          python3 docs/qa/helpers/summarize-cmdref-baseline.py "$DOCS_CMDREF_BASELINE_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs link integrity
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-doc-link-integrity.sh
          DOCS_LINK_INTEGRITY_SUMMARY="${RUNNER_TEMP}/docs-link-integrity-summary.json"
          mapfile -t CHANGED_DOCS < <(git diff --name-only "$DOCS_POLICY_RANGE" -- 'docs/**/*.md' 'docs/*.md' || true)
          if [ "${#CHANGED_DOCS[@]}" -gt 0 ]; then
            tools/docs/verify/verify-doc-link-integrity.sh --summary-json "$DOCS_LINK_INTEGRITY_SUMMARY" "${CHANGED_DOCS[@]}"
          else
            tools/docs/verify/verify-doc-link-integrity.sh --summary-json "$DOCS_LINK_INTEGRITY_SUMMARY"
          fi
          python3 docs/qa/helpers/summarize-link-integrity.py "$DOCS_LINK_INTEGRITY_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard recency
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-docs-scorecard-recency.sh
          DOCS_SCORECARD_RECENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-recency-summary.json"
          tools/docs/verify/verify-docs-scorecard-recency.sh \
            --max-age-days 7 \
            --summary-json "$DOCS_SCORECARD_RECENCY_SUMMARY"
          python3 docs/qa/helpers/summarize-scorecard-recency.py "$DOCS_SCORECARD_RECENCY_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard report consistency
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-docs-scorecard-report-consistency.sh
          DOCS_SCORECARD_CONSISTENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-consistency-summary.json"
          tools/docs/verify/verify-docs-scorecard-report-consistency.sh \
            --summary-json "$DOCS_SCORECARD_CONSISTENCY_SUMMARY"
          python3 docs/qa/helpers/summarize-scorecard-consistency.py "$DOCS_SCORECARD_CONSISTENCY_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard head freshness
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-docs-scorecard-head-freshness.sh
          DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY="${RUNNER_TEMP}/docs-scorecard-head-freshness-summary.json"
          tools/docs/verify/verify-docs-scorecard-head-freshness.sh \
            --summary-json "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY"
          python3 docs/qa/helpers/summarize-scorecard-head-freshness.py "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard timestamp format
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-docs-scorecard-report-timestamp.sh
          DOCS_SCORECARD_TIMESTAMP_SUMMARY="${RUNNER_TEMP}/docs-scorecard-timestamp-summary.json"
          tools/docs/verify/verify-docs-scorecard-report-timestamp.sh \
            --summary-json "$DOCS_SCORECARD_TIMESTAMP_SUMMARY"
          python3 docs/qa/helpers/summarize-scorecard-timestamp.py "$DOCS_SCORECARD_TIMESTAMP_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard delta artifact
        run: |
          set -euo pipefail
          chmod +x tools/docs/verify/verify-docs-scorecard-delta-artifact.sh
          DOCS_SCORECARD_DELTA_SUMMARY="${RUNNER_TEMP}/docs-scorecard-delta-summary.json"
          tools/docs/verify/verify-docs-scorecard-delta-artifact.sh \
            --summary-json "$DOCS_SCORECARD_DELTA_SUMMARY"
          python3 docs/qa/helpers/summarize-scorecard-delta.py "$DOCS_SCORECARD_DELTA_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard generation drift
        env:
          # Drift checks tree truth only — unset diff-scoped variables
          # so sub-scripts don't inherit PR-range context.
          DOCS_POLICY_RANGE: ""
          GITHUB_EVENT_BEFORE: ""
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-generation-drift.sh
          DOCS_SCORECARD_DRIFT_SUMMARY="${RUNNER_TEMP}/docs-scorecard-drift-summary.json"
          docs/qa/verify-docs-scorecard-generation-drift.sh \
            --summary-json "$DOCS_SCORECARD_DRIFT_SUMMARY"
          python3 docs/qa/helpers/summarize-scorecard-drift.py "$DOCS_SCORECARD_DRIFT_SUMMARY" "$GITHUB_STEP_SUMMARY"

      - name: Verify docs catalog health
        run: |
          set -euo pipefail
          SYNC_STRATEGY="auto"
          DOCS_FOUNDATION_SUMMARY="${RUNNER_TEMP}/docs-foundation-summary.json"
          DOCS_CMDREF_SUMMARY="${RUNNER_TEMP}/docs-command-refs-summary.json"
          DOCS_CMDREF_BASELINE_SUMMARY="${RUNNER_TEMP}/docs-cmdref-baseline-summary.json"
          CATALOG_HEALTH_LOG="$(mktemp)"
          CATALOG_HEALTH_SUMMARY="${RUNNER_TEMP}/docs-catalog-health-summary.json"
          DOCS_SCORECARD_PATH="${RUNNER_TEMP}/docs-scorecard.json"
          DOCS_SCORECARD_COMPARISON_PATH="${RUNNER_TEMP}/docs-scorecard-comparison.json"
          DOCS_SCORECARD_RECENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-recency-summary.json"
          DOCS_SCORECARD_CONSISTENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-consistency-summary.json"
          DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY="${RUNNER_TEMP}/docs-scorecard-head-freshness-summary.json"
          DOCS_SCORECARD_TIMESTAMP_SUMMARY="${RUNNER_TEMP}/docs-scorecard-timestamp-summary.json"
          DOCS_SCORECARD_DELTA_SUMMARY="${RUNNER_TEMP}/docs-scorecard-delta-summary.json"
          DOCS_SCORECARD_DRIFT_SUMMARY="${RUNNER_TEMP}/docs-scorecard-drift-summary.json"
          DOCS_LINK_INTEGRITY_SUMMARY="${RUNNER_TEMP}/docs-link-integrity-summary.json"
          DOCS_COMPLIANCE_SUMMARY_PATH="${RUNNER_TEMP}/docs-compliance-summary.json"
          {
            echo "### Docs Compliance Runtime Context"
            echo "- sync_strategy=${SYNC_STRATEGY}"
            echo "- base_ref=${DOCS_BASE_REF}"
            echo "- policy_range=${DOCS_POLICY_RANGE}"
            echo "- head_sha=${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/docs/verify/verify-doc-catalog-health.py \
            --max-stale-days 45 \
            --summary-file "$CATALOG_HEALTH_SUMMARY" | tee "$CATALOG_HEALTH_LOG"
          tools/docs/verify/verify-docs-foundation-gates.sh \
            --policy-range "$DOCS_POLICY_RANGE" \
            --summary-json "$DOCS_FOUNDATION_SUMMARY"
          python3 docs/qa/helpers/summarize-foundation-gates.py "$DOCS_FOUNDATION_SUMMARY" "$GITHUB_STEP_SUMMARY"
          readarray -t CATALOG_HEALTH_FIELDS < <(
            python3 docs/qa/helpers/summarize-catalog-health-fields.py "$CATALOG_HEALTH_SUMMARY"
          )

          {
            echo "### Docs Catalog Health"
            echo "- \`max_stale_days\`: 45"
            printf '%s\n' "${CATALOG_HEALTH_FIELDS[@]}" | sed 's/^/ - /'
            cat "$CATALOG_HEALTH_LOG" \
              | sed 's/^/ - /'
          } >> "$GITHUB_STEP_SUMMARY"

          python3 tools/docs/scorecards/build-docs-scorecard.py \
            --summary-file "$CATALOG_HEALTH_SUMMARY" \
            --out "$DOCS_SCORECARD_PATH" \
            --min-score 80

          bash tools/docs/scorecards/compare-docs-scorecard-to-base.sh \
            --current-summary "$CATALOG_HEALTH_SUMMARY" \
            --base-ref "$DOCS_BASE_REF" \
            --regression-threshold 10 \
            --out "$DOCS_SCORECARD_COMPARISON_PATH"

          python3 tools/docs/scorecards/build-docs-compliance-summary.py \
            --foundation-summary "$DOCS_FOUNDATION_SUMMARY" \
            --cmdref-baseline-summary "$DOCS_CMDREF_BASELINE_SUMMARY" \
            --catalog-summary "$CATALOG_HEALTH_SUMMARY" \
            --cmdref-summary "$DOCS_CMDREF_SUMMARY" \
            --scorecard "$DOCS_SCORECARD_PATH" \
            --comparison "$DOCS_SCORECARD_COMPARISON_PATH" \
            --scorecard-recency-summary "$DOCS_SCORECARD_RECENCY_SUMMARY" \
            --scorecard-consistency-summary "$DOCS_SCORECARD_CONSISTENCY_SUMMARY" \
            --scorecard-head-freshness-summary "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY" \
            --scorecard-timestamp-summary "$DOCS_SCORECARD_TIMESTAMP_SUMMARY" \
            --scorecard-delta-summary "$DOCS_SCORECARD_DELTA_SUMMARY" \
            --scorecard-drift-summary "$DOCS_SCORECARD_DRIFT_SUMMARY" \
            --link-integrity-summary "$DOCS_LINK_INTEGRITY_SUMMARY" \
            --out "$DOCS_COMPLIANCE_SUMMARY_PATH"

          python3 docs/qa/helpers/summarize-scorecard-trend.py "$DOCS_SCORECARD_COMPARISON_PATH" "$GITHUB_STEP_SUMMARY"
          python3 docs/qa/helpers/summarize-compliance-summary.py "$DOCS_COMPLIANCE_SUMMARY_PATH" "$GITHUB_STEP_SUMMARY"

      - name: Upload docs catalog health scorecard
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: docs-catalog-health-scorecard
          path: |
            ${{ runner.temp }}/docs-policy-summary.json
            ${{ runner.temp }}/docs-catalog-health-summary.json
            ${{ runner.temp }}/docs-foundation-summary.json
            ${{ runner.temp }}/docs-cmdref-baseline-summary.json
            ${{ runner.temp }}/docs-link-integrity-summary.json
            ${{ runner.temp }}/docs-scorecard.json
            ${{ runner.temp }}/docs-scorecard-comparison.json
            ${{ runner.temp }}/docs-command-refs-summary.json
            ${{ runner.temp }}/docs-scorecard-recency-summary.json
            ${{ runner.temp }}/docs-scorecard-consistency-summary.json
            ${{ runner.temp }}/docs-scorecard-head-freshness-summary.json
            ${{ runner.temp }}/docs-scorecard-timestamp-summary.json
            ${{ runner.temp }}/docs-scorecard-delta-summary.json
            ${{ runner.temp }}/docs-scorecard-drift-summary.json
            ${{ runner.temp }}/docs-compliance-summary.json

      - name: Generate docs scorecard report markdown
        run: |
          set -euo pipefail
          CI_DATE="$(date -u +%Y%m%d)"
          REPORT_PATH="${RUNNER_TEMP}/DOCS_PROGRAM_SCORECARD_${CI_DATE}.md"
          QUALITY_REPORT_PATH="${RUNNER_TEMP}/DOCS_QUALITY_SCORECARD_${CI_DATE}.md"
          chmod +x tools/docs/scorecards/generate-docs-scorecard-report.sh
          ./tools/docs/scorecards/generate-docs-scorecard-report.sh \
            --base-ref "$DOCS_BASE_REF" \
            --output "$REPORT_PATH" \
            --quality-output "$QUALITY_REPORT_PATH"
          {
            echo "### Docs Program Scorecard Report"
            echo "- base_ref=${DOCS_BASE_REF}"
            echo "- report_path=${REPORT_PATH}"
            echo "- quality_report_path=${QUALITY_REPORT_PATH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs scorecard markdown report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: docs-program-scorecard-report
          path: |
            ${{ runner.temp }}/DOCS_PROGRAM_SCORECARD_*.md
            ${{ runner.temp }}/DOCS_QUALITY_SCORECARD_*.md

      - name: Verify docs catalog health self-test
        run: |
          chmod +x \
            tools/docs/verify/verify-doc-catalog-health-test.sh \
            docs/qa/verify-docs-policy-test.sh \
            tools/docs/verify/verify-docs-foundation-gates.sh \
            docs/qa/verify-docs-foundation-gates-test.sh \
            tools/docs/verify/run-docs-world-class-gates.sh \
            tools/docs/verify/run-docs-world-class-gates-test.sh \
            docs/qa/verify-docs-compliance-workflow-contract-test.sh \
            tools/docs/verify/verify-doc-command-ref-baseline.sh \
            docs/qa/verify-doc-command-ref-baseline-test.sh \
            docs/qa/verify-doc-command-refs-test.sh \
            docs/qa/verify-doc-link-integrity-test.sh \
            tools/docs/verify/verify-docs-scorecard-recency.sh \
            docs/qa/verify-docs-scorecard-recency-test.sh \
            tools/docs/verify/verify-docs-scorecard-report-consistency.sh \
            docs/qa/verify-docs-scorecard-report-consistency-test.sh \
            tools/docs/verify/verify-docs-scorecard-head-freshness.sh \
            docs/qa/verify-docs-scorecard-head-freshness-test.sh \
            tools/docs/verify/verify-docs-scorecard-report-timestamp.sh \
            docs/qa/verify-docs-scorecard-report-timestamp-test.sh \
            tools/docs/verify/verify-docs-scorecard-delta-artifact.sh \
            docs/qa/verify-docs-scorecard-delta-artifact-test.sh \
            docs/qa/verify-docs-scorecard-generation-drift.sh \
            docs/qa/verify-docs-scorecard-generation-drift-test.sh \
            tools/docs/scorecards/generate-docs-scorecard-report.sh \
            tools/docs/scorecards/generate-docs-scorecard-report-test.sh \
            tools/docs/scorecards/build-docs-scorecard-test.sh \
            tools/docs/scorecards/compare-docs-scorecard-to-base-test.sh \
            docs/qa/build-docs-compliance-summary-test.sh
          tools/docs/verify/verify-doc-catalog-health-test.sh
          docs/qa/verify-docs-policy-test.sh
          docs/qa/verify-docs-foundation-gates-test.sh
          tools/docs/verify/run-docs-world-class-gates-test.sh
          docs/qa/verify-docs-compliance-workflow-contract-test.sh
          docs/qa/verify-doc-command-ref-baseline-test.sh
          docs/qa/verify-doc-command-refs-test.sh
          docs/qa/verify-doc-link-integrity-test.sh
          docs/qa/verify-docs-scorecard-recency-test.sh
          docs/qa/verify-docs-scorecard-report-consistency-test.sh
          docs/qa/verify-docs-scorecard-head-freshness-test.sh
          docs/qa/verify-docs-scorecard-report-timestamp-test.sh
          docs/qa/verify-docs-scorecard-delta-artifact-test.sh
          docs/qa/verify-docs-scorecard-generation-drift-test.sh
          tools/docs/scorecards/generate-docs-scorecard-report-test.sh
          tools/docs/scorecards/build-docs-scorecard-test.sh
          tools/docs/scorecards/compare-docs-scorecard-to-base-test.sh
          docs/qa/build-docs-compliance-summary-test.sh
