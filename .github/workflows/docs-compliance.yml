      - name: Verify docs catalog health
        run: |
          set -euo pipefail
          DOCS_FOUNDATION_SUMMARY="${RUNNER_TEMP}/docs-foundation-summary.json"
          DOCS_CMDREF_BASELINE_SUMMARY="${RUNNER_TEMP}/docs-cmdref-baseline-summary.json"
          CATALOG_HEALTH_LOG="$(mktemp)"
          CATALOG_HEALTH_SUMMARY="${RUNNER_TEMP}/docs-catalog-health-summary.json"
          DOCS_SCORECARD_PATH="${RUNNER_TEMP}/docs-scorecard.json"
          DOCS_SCORECARD_COMPARISON_PATH="${RUNNER_TEMP}/docs-scorecard-comparison.json"
          DOCS_SCORECARD_RECENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-recency-summary.json"
          DOCS_SCORECARD_CONSISTENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-consistency-summary.json"
          DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY="${RUNNER_TEMP}/docs-scorecard-head-freshness-summary.json"
          DOCS_SCORECARD_TIMESTAMP_SUMMARY="${RUNNER_TEMP}/docs-scorecard-timestamp-summary.json"
          DOCS_SCORECARD_DELTA_SUMMARY="${RUNNER_TEMP}/docs-scorecard-delta-summary.json"
          DOCS_SCORECARD_DRIFT_SUMMARY="${RUNNER_TEMP}/docs-scorecard-drift-summary.json"
          DOCS_LINK_INTEGRITY_SUMMARY="${RUNNER_TEMP}/docs-link-integrity-summary.json"
          DOCS_COMPLIANCE_SUMMARY_PATH="${RUNNER_TEMP}/docs-compliance-summary.json"
          BASE_REF="origin/${{ github.base_ref }}"
          if [ -z "${BASE_REF}" ] || [ "$BASE_REF" = "origin/" ]; then
            BASE_REF="origin/main"
          fi
          python3 docs/qa/verify-doc-catalog-health.py \
            --max-stale-days 45 \
            --summary-file "$CATALOG_HEALTH_SUMMARY" | tee "$CATALOG_HEALTH_LOG"
          docs/qa/verify-docs-foundation-gates.sh \
            --policy-range "origin/${{ github.base_ref }}...${{ github.sha }}" \
            --summary-json "$DOCS_FOUNDATION_SUMMARY"
