name: Docs Compliance

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-compliance.yml"
      - "docs/qa/verify-doc-command-refs.sh"
      - "docs/qa/verify-doc-link-integrity.sh"
      - "docs/qa/verify-doc-link-integrity.py"
      - "docs/qa/verify-doc-catalog-health-test.sh"
      - "docs/qa/verify-docs-policy.sh"
      - "docs/qa/verify-doc-catalog-health.py"
      - "docs/qa/build-docs-scorecard.py"
      - "docs/qa/build-docs-scorecard-test.sh"
      - "docs/qa/build-docs-compliance-summary.py"
      - "docs/qa/build-docs-compliance-summary-test.sh"
      - "docs/qa/generate-docs-scorecard-report.sh"
      - "docs/qa/generate-docs-scorecard-report-test.sh"
      - "docs/qa/verify-docs-scorecard-recency.sh"
      - "docs/qa/verify-docs-scorecard-recency-test.sh"
      - "docs/qa/verify-docs-scorecard-report-consistency.sh"
      - "docs/qa/verify-docs-scorecard-report-consistency-test.sh"
      - "docs/qa/verify-docs-scorecard-head-freshness.sh"
      - "docs/qa/verify-docs-scorecard-head-freshness-test.sh"
      - "docs/qa/verify-docs-scorecard-report-timestamp.sh"
      - "docs/qa/verify-docs-scorecard-report-timestamp-test.sh"
      - "docs/qa/verify-doc-command-refs-test.sh"
      - "docs/qa/compare-docs-scorecard-to-base.sh"
      - "docs/qa/compare-docs-scorecard-to-base-test.sh"
      - "docs/catalog.json"
      - "scripts/qa/verify-repo-structure.sh"

jobs:
  docs-compliance:
    name: Run docs compliance gates
    runs-on: mereka-k8s-runners
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify docs policy
        run: |
          chmod +x docs/qa/verify-docs-policy.sh
          ./docs/qa/verify-docs-policy.sh

      - name: Verify repository structure
        run: |
          ./scripts/qa/verify-repo-structure.sh

      - name: Verify doc command references
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-doc-command-refs.sh
          DOCS_CMDREF_SUMMARY="${RUNNER_TEMP}/docs-command-refs-summary.json"
          mapfile -t CHANGED_DOCS < <(git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" -- 'docs/**/*.md' 'docs/*.md' || true)
          CHANGED_DOCS_COUNT=${#CHANGED_DOCS[@]}

          {
            echo "### Docs Compliance Summary"
            echo "- Changed docs (PR scope): ${CHANGED_DOCS_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHANGED_DOCS_COUNT" -gt 0 ]; then
            echo "Changed docs (PR scoped):"
            printf '%s\n' "${CHANGED_DOCS[@]}"
            ./docs/qa/verify-doc-command-refs.sh --summary-json "$DOCS_CMDREF_SUMMARY" "${CHANGED_DOCS[@]}"
          else
            ./docs/qa/verify-doc-command-refs.sh --summary-json "$DOCS_CMDREF_SUMMARY"
          fi

          mapfile -t CMDREF_MISSING < <(jq -r '.missing[]?' "$DOCS_CMDREF_SUMMARY")
          {
            echo "### Docs Command Reference Summary"
            echo "- files_checked=$(jq -r '.files_checked // 0' "$DOCS_CMDREF_SUMMARY")"
            echo "- total_candidates=$(jq -r '.total_candidates // 0' "$DOCS_CMDREF_SUMMARY")"
            echo "- missing_references=$(jq -r '.missing_references // 0' "$DOCS_CMDREF_SUMMARY")"
            echo "- status=$(jq -r '.status // \"unknown\"' "$DOCS_CMDREF_SUMMARY")"
            for item in "${CMDREF_MISSING[@]:0:15}"; do
              echo "- ${item}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify docs link integrity
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-doc-link-integrity.sh
          mapfile -t CHANGED_DOCS < <(git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" -- 'docs/**/*.md' 'docs/*.md' || true)
          if [ "${#CHANGED_DOCS[@]}" -gt 0 ]; then
            docs/qa/verify-doc-link-integrity.sh "${CHANGED_DOCS[@]}"
          else
            docs/qa/verify-doc-link-integrity.sh
          fi

      - name: Verify docs scorecard recency
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-recency.sh
          DOCS_SCORECARD_RECENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-recency-summary.json"
          docs/qa/verify-docs-scorecard-recency.sh \
            --max-age-days 7 \
            --summary-json "$DOCS_SCORECARD_RECENCY_SUMMARY"
          {
            echo "### Docs Scorecard Recency"
            echo "- status=$(jq -r '.status // \"unknown\"' "$DOCS_SCORECARD_RECENCY_SUMMARY")"
            echo "- latest_report=$(jq -r '.latest_report // \"n/a\"' "$DOCS_SCORECARD_RECENCY_SUMMARY")"
            echo "- latest_date=$(jq -r '.latest_date // \"n/a\"' "$DOCS_SCORECARD_RECENCY_SUMMARY")"
            echo "- age_days=$(jq -r '.age_days // \"n/a\"' "$DOCS_SCORECARD_RECENCY_SUMMARY")"
            echo "- max_age_days=$(jq -r '.max_age_days // \"n/a\"' "$DOCS_SCORECARD_RECENCY_SUMMARY")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard report consistency
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-report-consistency.sh
          DOCS_SCORECARD_CONSISTENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-consistency-summary.json"
          docs/qa/verify-docs-scorecard-report-consistency.sh \
            --summary-json "$DOCS_SCORECARD_CONSISTENCY_SUMMARY"
          {
            echo "### Docs Scorecard Report Consistency"
            echo "- status=$(jq -r '.status // \"unknown\"' "$DOCS_SCORECARD_CONSISTENCY_SUMMARY")"
            echo "- reports_checked=$(jq -r '.reports_checked // \"n/a\"' "$DOCS_SCORECARD_CONSISTENCY_SUMMARY")"
            echo "- invalid_reports=$(jq -r '.invalid_reports // \"n/a\"' "$DOCS_SCORECARD_CONSISTENCY_SUMMARY")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard head freshness
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-head-freshness.sh
          DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY="${RUNNER_TEMP}/docs-scorecard-head-freshness-summary.json"
          docs/qa/verify-docs-scorecard-head-freshness.sh \
            --summary-json "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY"
          {
            echo "### Docs Scorecard Head Freshness"
            echo "- status=$(jq -r '.status // \"unknown\"' "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY")"
            echo "- latest_report=$(jq -r '.latest_report // \"n/a\"' "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY")"
            echo "- latest_date=$(jq -r '.latest_date // \"n/a\"' "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY")"
            echo "- reference_date=$(jq -r '.reference_date // \"n/a\"' "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify docs scorecard timestamp format
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-report-timestamp.sh
          DOCS_SCORECARD_TIMESTAMP_SUMMARY="${RUNNER_TEMP}/docs-scorecard-timestamp-summary.json"
          docs/qa/verify-docs-scorecard-report-timestamp.sh \
            --summary-json "$DOCS_SCORECARD_TIMESTAMP_SUMMARY"
          {
            echo "### Docs Scorecard Timestamp Format"
            echo "- status=$(jq -r '.status // \"unknown\"' "$DOCS_SCORECARD_TIMESTAMP_SUMMARY")"
            echo "- reports_checked=$(jq -r '.reports_checked // \"n/a\"' "$DOCS_SCORECARD_TIMESTAMP_SUMMARY")"
            echo "- invalid_reports=$(jq -r '.invalid_reports // \"n/a\"' "$DOCS_SCORECARD_TIMESTAMP_SUMMARY")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify docs catalog health
        run: |
          set -euo pipefail
          CATALOG_HEALTH_LOG="$(mktemp)"
          CATALOG_HEALTH_SUMMARY="${RUNNER_TEMP}/docs-catalog-health-summary.json"
          DOCS_SCORECARD_PATH="${RUNNER_TEMP}/docs-scorecard.json"
          DOCS_SCORECARD_COMPARISON_PATH="${RUNNER_TEMP}/docs-scorecard-comparison.json"
          DOCS_SCORECARD_RECENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-recency-summary.json"
          DOCS_SCORECARD_CONSISTENCY_SUMMARY="${RUNNER_TEMP}/docs-scorecard-consistency-summary.json"
          DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY="${RUNNER_TEMP}/docs-scorecard-head-freshness-summary.json"
          DOCS_SCORECARD_TIMESTAMP_SUMMARY="${RUNNER_TEMP}/docs-scorecard-timestamp-summary.json"
          DOCS_COMPLIANCE_SUMMARY_PATH="${RUNNER_TEMP}/docs-compliance-summary.json"
          BASE_REF="origin/${{ github.base_ref }}"
          if [ -z "${BASE_REF}" ] || [ "$BASE_REF" = "origin/" ]; then
            BASE_REF="origin/main"
          fi
          python3 docs/qa/verify-doc-catalog-health.py \
            --max-stale-days 45 \
            --summary-file "$CATALOG_HEALTH_SUMMARY" | tee "$CATALOG_HEALTH_LOG"
          readarray -t CATALOG_HEALTH_FIELDS < <(
            jq -r '
              "catalog_entries=\(.all_entries // 0)",
              "canonical_entries=\(.canonical_total // 0)",
              "canonical_stale=\(.canonical_stale // 0)",
              "canonical_missing_owner=\(.canonical_missing_owner // 0)",
              "canonical_missing_verified=\(.canonical_missing_verified // 0)",
              "canonical_high_risk=\(.canonical_high_risk // 0)",
              "canonical_missing_file=\(.canonical_missing_file // 0)"
            ' "$CATALOG_HEALTH_SUMMARY"
          )

          {
            echo "### Docs Catalog Health"
            echo "- `max_stale_days`: 45"
            printf '%s\n' "${CATALOG_HEALTH_FIELDS[@]}" | sed 's/^/ - /'
            cat "$CATALOG_HEALTH_LOG" \
              | sed 's/^/ - /'
          } >> "$GITHUB_STEP_SUMMARY"

          python3 docs/qa/build-docs-scorecard.py \
            --summary-file "$CATALOG_HEALTH_SUMMARY" \
            --out "$DOCS_SCORECARD_PATH" \
            --min-score 80

          bash docs/qa/compare-docs-scorecard-to-base.sh \
            --current-summary "$CATALOG_HEALTH_SUMMARY" \
            --base-ref "$BASE_REF" \
            --regression-threshold 10 \
            --out "$DOCS_SCORECARD_COMPARISON_PATH"

          python3 docs/qa/build-docs-compliance-summary.py \
            --catalog-summary "$CATALOG_HEALTH_SUMMARY" \
            --cmdref-summary "$DOCS_CMDREF_SUMMARY" \
            --scorecard "$DOCS_SCORECARD_PATH" \
            --comparison "$DOCS_SCORECARD_COMPARISON_PATH" \
            --scorecard-recency-summary "$DOCS_SCORECARD_RECENCY_SUMMARY" \
            --scorecard-consistency-summary "$DOCS_SCORECARD_CONSISTENCY_SUMMARY" \
            --scorecard-head-freshness-summary "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY" \
            --scorecard-timestamp-summary "$DOCS_SCORECARD_TIMESTAMP_SUMMARY" \
            --out "$DOCS_COMPLIANCE_SUMMARY_PATH"

          {
            echo "### Docs Scorecard Trend"
            echo "- base_ref=$(jq -r '.base_ref // \"n/a\"' "$DOCS_SCORECARD_COMPARISON_PATH")"
            echo "- base_score=$(jq -r '.base_score // \"n/a\"' "$DOCS_SCORECARD_COMPARISON_PATH")"
            echo "- current_score=$(jq -r '.current_score // \"n/a\"' "$DOCS_SCORECARD_COMPARISON_PATH")"
            echo "- score_drop=$(jq -r '.score_drop // \"n/a\"' "$DOCS_SCORECARD_COMPARISON_PATH")"
            echo "- max_allowed_drop=$(jq -r '.max_allowed_drop // \"n/a\"' "$DOCS_SCORECARD_COMPARISON_PATH")"
            echo "- status=$(jq -r '.status // \"unknown\"' "$DOCS_SCORECARD_COMPARISON_PATH")"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "### Docs Compliance Summary"
            echo "- overall_status=$(jq -r '.overall_status // \"unknown\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- catalog_health_status=$(jq -r '.statuses.catalog_health // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- command_refs_status=$(jq -r '.statuses.command_references // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- docs_scorecard_status=$(jq -r '.statuses.docs_scorecard // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- scorecard_trend_status=$(jq -r '.statuses.scorecard_trend // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- scorecard_recency_status=$(jq -r '.statuses.scorecard_recency // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- scorecard_consistency_status=$(jq -r '.statuses.scorecard_consistency // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- scorecard_head_freshness_status=$(jq -r '.statuses.scorecard_head_freshness // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
            echo "- scorecard_timestamp_format_status=$(jq -r '.statuses.scorecard_timestamp_format // \"n/a\"' "$DOCS_COMPLIANCE_SUMMARY_PATH")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs catalog health scorecard
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: docs-catalog-health-scorecard
          path: |
            ${{ runner.temp }}/docs-catalog-health-summary.json
            ${{ runner.temp }}/docs-scorecard.json
            ${{ runner.temp }}/docs-scorecard-comparison.json
            ${{ runner.temp }}/docs-command-refs-summary.json
            ${{ runner.temp }}/docs-scorecard-recency-summary.json
            ${{ runner.temp }}/docs-scorecard-consistency-summary.json
            ${{ runner.temp }}/docs-scorecard-head-freshness-summary.json
            ${{ runner.temp }}/docs-scorecard-timestamp-summary.json
            ${{ runner.temp }}/docs-compliance-summary.json

      - name: Generate docs scorecard report markdown
        run: |
          set -euo pipefail
          REPORT_PATH="${RUNNER_TEMP}/DOCS_PROGRAM_SCORECARD_${{ github.run_id }}.md"
          chmod +x docs/qa/generate-docs-scorecard-report.sh
          ./docs/qa/generate-docs-scorecard-report.sh \
            --base-ref "origin/${{ github.base_ref }}" \
            --output "$REPORT_PATH"
          {
            echo "### Docs Program Scorecard Report"
            echo "- report_path=${REPORT_PATH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload docs scorecard markdown report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: docs-program-scorecard-report
          path: ${{ runner.temp }}/DOCS_PROGRAM_SCORECARD_${{ github.run_id }}.md

      - name: Verify docs catalog health self-test
        run: |
          chmod +x \
            docs/qa/verify-doc-catalog-health-test.sh \
            docs/qa/verify-doc-command-refs-test.sh \
            docs/qa/verify-doc-link-integrity-test.sh \
            docs/qa/verify-docs-scorecard-recency.sh \
            docs/qa/verify-docs-scorecard-recency-test.sh \
            docs/qa/verify-docs-scorecard-report-consistency.sh \
            docs/qa/verify-docs-scorecard-report-consistency-test.sh \
            docs/qa/verify-docs-scorecard-head-freshness.sh \
            docs/qa/verify-docs-scorecard-head-freshness-test.sh \
            docs/qa/verify-docs-scorecard-report-timestamp.sh \
            docs/qa/verify-docs-scorecard-report-timestamp-test.sh \
            docs/qa/generate-docs-scorecard-report.sh \
            docs/qa/generate-docs-scorecard-report-test.sh \
            docs/qa/build-docs-scorecard-test.sh \
            docs/qa/compare-docs-scorecard-to-base-test.sh \
            docs/qa/build-docs-compliance-summary-test.sh
          docs/qa/verify-doc-catalog-health-test.sh
          docs/qa/verify-doc-command-refs-test.sh
          docs/qa/verify-doc-link-integrity-test.sh
          docs/qa/verify-docs-scorecard-recency-test.sh
          docs/qa/verify-docs-scorecard-report-consistency-test.sh
          docs/qa/verify-docs-scorecard-head-freshness-test.sh
          docs/qa/verify-docs-scorecard-report-timestamp-test.sh
          docs/qa/generate-docs-scorecard-report-test.sh
          docs/qa/build-docs-scorecard-test.sh
          docs/qa/compare-docs-scorecard-to-base-test.sh
          docs/qa/build-docs-compliance-summary-test.sh
