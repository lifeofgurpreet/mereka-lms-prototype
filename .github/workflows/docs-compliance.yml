      - name: Verify docs link integrity
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-doc-link-integrity.sh
          DOCS_LINK_INTEGRITY_SUMMARY="${RUNNER_TEMP}/docs-link-integrity-summary.json"
          mapfile -t CHANGED_DOCS < <(git diff --name-only "origin/${{ github.base_ref }}...${{ github.sha }}" -- 'docs/**/*.md' 'docs/*.md' || true)
          if [ "${#CHANGED_DOCS[@]}" -gt 0 ]; then
            docs/qa/verify-doc-link-integrity.sh --summary-json "$DOCS_LINK_INTEGRITY_SUMMARY" "${CHANGED_DOCS[@]}"
          else
            docs/qa/verify-doc-link-integrity.sh --summary-json "$DOCS_LINK_INTEGRITY_SUMMARY"
          fi
          python3 - "$DOCS_LINK_INTEGRITY_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
import json
