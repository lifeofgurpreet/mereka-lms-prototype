      - name: Verify docs scorecard generation drift
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-generation-drift.sh
          DOCS_SCORECARD_DRIFT_SUMMARY="${RUNNER_TEMP}/docs-scorecard-drift-summary.json"
          docs/qa/verify-docs-scorecard-generation-drift.sh \
            --summary-json "$DOCS_SCORECARD_DRIFT_SUMMARY"
          python3 - "$DOCS_SCORECARD_DRIFT_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
