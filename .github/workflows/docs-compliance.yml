          docs/qa/verify-docs-scorecard-report-timestamp.sh \
            --summary-json "$DOCS_SCORECARD_TIMESTAMP_SUMMARY"
          python3 - "$DOCS_SCORECARD_TIMESTAMP_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
