          DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY="${RUNNER_TEMP}/docs-scorecard-head-freshness-summary.json"
          docs/qa/verify-docs-scorecard-head-freshness.sh \
            --summary-json "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY"
          python3 - "$DOCS_SCORECARD_HEAD_FRESHNESS_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
