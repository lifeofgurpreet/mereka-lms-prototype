      - name: Verify docs scorecard delta artifact
        run: |
          set -euo pipefail
          chmod +x docs/qa/verify-docs-scorecard-delta-artifact.sh
          DOCS_SCORECARD_DELTA_SUMMARY="${RUNNER_TEMP}/docs-scorecard-delta-summary.json"
          docs/qa/verify-docs-scorecard-delta-artifact.sh \
            --summary-json "$DOCS_SCORECARD_DELTA_SUMMARY"
          python3 - "$DOCS_SCORECARD_DELTA_SUMMARY" "$GITHUB_STEP_SUMMARY" <<'PY'
