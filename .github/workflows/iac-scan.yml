name: IaC Security Scan

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: infrastructure/terraform/.terraform.lock.hcl is absent from this
# repository. It is generated by `terraform init` and is gitignored or was
# never committed. To enable provider hash verification, run:
#   terraform init
#   git add infrastructure/terraform/.terraform.lock.hcl
#   git commit -m "chore(terraform): commit provider lock file"

jobs:
  trivy-k8s-manifests:
    name: Trivy — K8s Manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Run Trivy config scan on K8s manifests
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0  # v0.29.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: deploy/k8s/
          format: table
          output: trivy-k8s-results.txt
          exit-code: '1'

      - name: Upload K8s scan results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: trivy-k8s-results
          path: trivy-k8s-results.txt
          retention-days: 3
          if-no-files-found: ignore

  trivy-terraform:
    name: Trivy — Terraform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Run Trivy config scan on Terraform
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0  # v0.29.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: infrastructure/terraform/
          format: table
          output: trivy-terraform-results.txt
          exit-code: '1'

      - name: Upload Terraform scan results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: trivy-terraform-results
          path: trivy-terraform-results.txt
          retention-days: 3
          if-no-files-found: ignore
