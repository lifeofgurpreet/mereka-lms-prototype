name: IaC Security Scan

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep only the newest run per ref, including main, so stale pushes do not
  # consume runner capacity while the latest head waits in queue.
  cancel-in-progress: true

# NOTE: infrastructure/terraform/.terraform.lock.hcl is absent from this
# repository. It is generated by `terraform init` and is gitignored or was
# never committed. To enable provider hash verification, run:
#   terraform init
#   git add infrastructure/terraform/.terraform.lock.hcl
#   git commit -m "chore(terraform): commit provider lock file"

jobs:
  trivy-k8s-manifests:
    name: Trivy — K8s Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run Trivy config scan on K8s manifests
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        continue-on-error: true
        with:
          cache: false
          scan-type: config
          scan-ref: deploy/k8s/
          version: v0.69.3
          format: table
          output: trivy-k8s-results.txt
          exit-code: '1'

      - name: Upload K8s scan results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: trivy-k8s-results
          path: trivy-k8s-results.txt
          retention-days: 3
          if-no-files-found: ignore

  trivy-terraform:
    name: Trivy — Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run Trivy config scan on Terraform
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        continue-on-error: true
        with:
          cache: false
          scan-type: config
          scan-ref: infrastructure/terraform/
          version: v0.69.3
          format: table
          output: trivy-terraform-results.txt
          exit-code: '1'

      - name: Upload Terraform scan results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: trivy-terraform-results
          path: trivy-terraform-results.txt
          retention-days: 3
          if-no-files-found: ignore
