name: Policy Checks

on:
  workflow_dispatch:

permissions: {}

jobs:
  policy-checks:
    name: Run Release Policy Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Script syntax
        run: |
          bash -n scripts/infra/release-openedx-gitops.sh
          bash -n scripts/qa/verify-release-automation.sh
          bash -n scripts/qa/verify-build-workflow-contract.sh
          bash -n scripts/qa/verify-release-workflow-invocation.sh
          bash -n scripts/qa/verify-release-dry-run-contract.sh
          bash -n scripts/qa/verify-release-evidence-workflow.sh
          bash -n scripts/qa/verify-ci-cd-pipeline.sh
          bash -n scripts/qa/verify-a11y-tenant-branding-workflow.sh
          bash -n scripts/qa/verify-certificate-branding-workflow.sh
          bash -n scripts/qa/verify-email-template-branding-workflow.sh
          bash -n scripts/qa/verify-mfe-selector-hardening-workflow.sh
          bash -n scripts/qa/verify-paragon-runtime-contract-workflow.sh
          bash -n scripts/qa/verify-paragon-theme-budget-workflow.sh
          bash -n scripts/qa/verify-cross-browser-branding-workflow.sh
          bash -n scripts/qa/verify-npm-start-smoke-workflow.sh
          bash -n scripts/qa/verify-frontend-performance-spotcheck-workflow.sh
          bash -n scripts/qa/verify-frontend-runtime-qa-workflow.sh
          bash -n scripts/qa/verify-frontend-before-after-visuals-workflow.sh
          bash -n scripts/qa/verify-make-help-contract.sh
          bash -n scripts/qa/verify-frontend-qa-make-targets.sh
          bash -n scripts/qa/verify-frontend-branding-closure-workflow.sh
          bash -n scripts/qa/verify-mfe-live-dom-audit-workflow.sh
          bash -n scripts/qa/verify-runtime-theme-drift-diagnose-workflow.sh
          bash -n scripts/qa/verify-phase7-dom-audit-contract.sh
          bash -n scripts/qa/verify-phase7-selector-list-coverage.sh
          bash -n scripts/qa/verify-runtime-theme-drift-lane.sh
          bash -n scripts/qa/verify-phase2-smoke-evidence-contract.sh
          bash -n scripts/qa/verify-phase2-smoke-evidence-workflow.sh
          bash -n scripts/qa/verify-accessibility-audit-workflow.sh
          bash -n scripts/qa/verify-a11y-runtime-lane-contract.sh
          bash -n scripts/qa/verify-branding-evidence-a11y-contract.sh
          bash -n scripts/qa/verify-branding-evidence-screenshot-contract.sh
          bash -n scripts/qa/verify-kustomize-no-deprecated-keys.sh
          bash -n scripts/qa/verify-dev-prod-image-parity.sh
          bash -n scripts/qa/verify-site-id-hardening.sh
          bash -n scripts/qa/verify-no-latest-prod-tags.sh
          bash -n scripts/qa/lint-active-docs-env-model.sh

      - name: Verify release automation contract
        run: |
          ./scripts/qa/verify-release-automation.sh

      - name: Verify build workflow contract
        run: |
          ./scripts/qa/verify-build-workflow-contract.sh

      - name: Verify release workflow invocation flags
        run: |
          bash ./scripts/qa/verify-release-workflow-invocation.sh

      - name: Verify release dry-run contract
        run: |
          ./scripts/qa/verify-release-dry-run-contract.sh

      - name: Verify release evidence workflow contract
        run: |
          ./scripts/qa/verify-release-evidence-workflow.sh

      - name: Verify consolidated CI/CD gitops contract
        run: |
          ./scripts/qa/verify-ci-cd-pipeline.sh --section gitops

      - name: Verify a11y tenant branding workflow contract
        run: |
          ./scripts/qa/verify-a11y-tenant-branding-workflow.sh

      - name: Verify certificate branding workflow contract
        run: |
          ./scripts/qa/verify-certificate-branding-workflow.sh

      - name: Verify email-template-branding workflow contract
        run: |
          ./scripts/qa/verify-email-template-branding-workflow.sh

      - name: Verify MFE selector hardening workflow contract
        run: |
          ./scripts/qa/verify-mfe-selector-hardening-workflow.sh

      - name: Verify paragon runtime contract workflow
        run: |
          ./scripts/qa/verify-paragon-runtime-contract-workflow.sh

      - name: Verify paragon theme budget workflow
        run: |
          ./scripts/qa/verify-paragon-theme-budget-workflow.sh

      - name: Verify cross-browser branding workflow contract
        run: |
          ./scripts/qa/verify-cross-browser-branding-workflow.sh

      - name: Verify npm-start smoke workflow contract
        run: |
          ./scripts/qa/verify-npm-start-smoke-workflow.sh

      - name: Verify frontend performance spot-check workflow contract
        run: |
          ./scripts/qa/verify-frontend-performance-spotcheck-workflow.sh

      - name: Verify frontend runtime QA workflow contract
        run: |
          ./scripts/qa/verify-frontend-runtime-qa-workflow.sh

      - name: Verify frontend before/after visuals workflow contract
        run: |
          ./scripts/qa/verify-frontend-before-after-visuals-workflow.sh

      - name: Verify Makefile help contract
        run: |
          ./scripts/qa/verify-make-help-contract.sh

      - name: Verify frontend QA Makefile target contract
        run: |
          ./scripts/qa/verify-frontend-qa-make-targets.sh

      - name: Verify frontend branding closure workflow contract
        run: |
          ./scripts/qa/verify-frontend-branding-closure-workflow.sh

      - name: Verify MFE live DOM audit workflow contract
        run: |
          ./scripts/qa/verify-mfe-live-dom-audit-workflow.sh

      - name: Verify runtime-theme-drift-diagnose workflow contract
        run: |
          ./scripts/qa/verify-runtime-theme-drift-diagnose-workflow.sh

      - name: Verify Phase 7 DOM audit contract
        run: |
          ./scripts/qa/verify-phase7-dom-audit-contract.sh

      - name: Verify Phase 7 selector-list coverage contract
        run: |
          ./scripts/qa/verify-phase7-selector-list-coverage.sh

      - name: Verify runtime-theme drift lane contract
        run: |
          ./scripts/qa/verify-runtime-theme-drift-lane.sh

      - name: Verify Phase 2 smoke-evidence contract
        run: |
          ./scripts/qa/verify-phase2-smoke-evidence-contract.sh

      - name: Verify Phase 2 smoke-evidence workflow contract
        run: |
          ./scripts/qa/verify-phase2-smoke-evidence-workflow.sh

      - name: Verify accessibility-audit workflow contract
        run: |
          ./scripts/qa/verify-accessibility-audit-workflow.sh

      - name: Verify a11y runtime lane contract
        run: |
          ./scripts/qa/verify-a11y-runtime-lane-contract.sh

      - name: Verify branding evidence a11y contract
        run: |
          ./scripts/qa/verify-branding-evidence-a11y-contract.sh

      - name: Verify branding evidence screenshot contract
        run: |
          ./scripts/qa/verify-branding-evidence-screenshot-contract.sh

      - name: Verify no deprecated kustomize keys
        run: |
          ./scripts/qa/verify-kustomize-no-deprecated-keys.sh

      - name: Verify dev/prod image parity
        run: |
          ./scripts/qa/verify-dev-prod-image-parity.sh

      - name: Verify SITE_ID hardening contract
        run: |
          ./scripts/qa/verify-site-id-hardening.sh

      - name: Verify no mutable latest tags in prod overlays
        run: |
          ./scripts/qa/verify-no-latest-prod-tags.sh

      - name: Lint active docs env model wording
        run: |
          ./scripts/qa/lint-active-docs-env-model.sh
