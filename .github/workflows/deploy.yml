name: Deploy Prototype to VPS

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy to VPS
        run: |
          DEST=/home/gurpreet/projects/standalone/lms-prototype/dist

          # Pipe tarball over tailscale ssh and extract on VPS
          tar -czf - -C frontend/dist . | \
            tailscale ssh root@g-mereka-vps "rm -rf ${DEST}/* && tar -xzf - -C ${DEST}"

          echo "Deployed to https://lms-prototype.mereka.dev"
