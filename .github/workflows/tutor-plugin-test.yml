name: Tutor Plugin / Render Contract

on:
  push:
    paths:
      - 'infrastructure/tutor/plugins/**'
      - 'infrastructure/tutor/config.example.yml'
      - 'scripts/ci/preflight-check.sh'
      - 'scripts/infra/sync-tutor-plugin-mirror.sh'
      - 'scripts/infra/verify-tutor-config.sh'
  pull_request:
    paths:
      - 'infrastructure/tutor/plugins/**'
      - 'infrastructure/tutor/config.example.yml'
      - 'scripts/ci/preflight-check.sh'
      - 'scripts/infra/sync-tutor-plugin-mirror.sh'
      - 'scripts/infra/verify-tutor-config.sh'
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  lint-plugins:
    name: Lint Plugin Sources
    runs-on: ${{ vars.CI_FASTLANE_CI_LABEL || 'mereka-k8s-runners' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'
          extra-deps: 'ruff black'

      - name: Compile plugin sources
        run: python3 -m compileall infrastructure/tutor/plugins

      - name: Lint with ruff
        run: ruff check infrastructure/tutor/plugins/

      - name: Check formatting with black
        run: black --check infrastructure/tutor/plugins/

  verify-retired-legacy-shim:
    name: Verify Retired Legacy Shim Contract
    runs-on: ${{ vars.CI_FASTLANE_CI_LABEL || 'mereka-k8s-runners' }}
    needs: lint-plugins
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify standalone shim is metadata-only
        run: |
          grep -Fq "Legacy compatibility shim for the retired standalone mfe_oauth_fix Tutor plugin." infrastructure/tutor/plugins/mfe_oauth_fix.py
          if grep -Eq "hooks\\.Filters\\.ENV_PATCHES" infrastructure/tutor/plugins/mfe_oauth_fix.py; then
            echo "Legacy shim must not emit ENV_PATCHES" >&2
            exit 1
          fi
          if grep -En "^\\s*- mfe_oauth_fix$" infrastructure/tutor/config.example.yml; then
            echo "Legacy standalone plugin must remain disabled in config.example.yml" >&2
            exit 1
          fi

  render-contract-preflight:
    name: Render Contract Preflight
    runs-on: ${{ vars.CI_FASTLANE_CI_LABEL || 'mereka-k8s-runners' }}
    needs: [lint-plugins, verify-retired-legacy-shim]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'

      - name: Install Tutor into CI preflight venv
        run: |
          # `python3 -m venv` needs the ensurepip stdlib module, which is
          # packaged separately on Debian/Ubuntu (python3.12-venv). Some
          # fastlane-ci-* runners are provisioned without it and fail with:
          #   "The virtual environment was not created successfully because
          #    ensurepip is not available."
          # Mirror the fallback pattern from .github/actions/setup-python-env:
          # try normal venv first, then fall back to --without-pip + get-pip.py.
          if ! python3 -m venv .ci-venv 2>/dev/null; then
            echo "::notice::ensurepip unavailable on this runner — falling back to get-pip.py"
            rm -rf .ci-venv
            python3 -m venv --without-pip .ci-venv
            GET_PIP="${RUNNER_TEMP:-/tmp}/get-pip.py"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "$GET_PIP" "https://bootstrap.pypa.io/get-pip.py"
            .ci-venv/bin/python "$GET_PIP"
            rm -f "$GET_PIP"
          fi
          source .ci-venv/bin/activate
          pip install -U pip
          pip install -r requirements-tutor.txt

      - name: Run rendered Dockerfile preflight
        env:
          TUTOR_VENV: ${{ github.workspace }}/.ci-venv
        run: ./scripts/ci/preflight-check.sh
