name: Secret Scan Audit

on:
  schedule:
    # 1st of each month at 03:00 UTC (per-PR scan in ci.yml covers new commits continuously)
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog — Full History Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # SHA pin for trufflesecurity/trufflehog@main (2026-02-24)
        uses: trufflesecurity/trufflehog@b54e4af0e57be44a32be35db9315ea2dd4ac8dab
        continue-on-error: true
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --json --no-update --only-verified
        id: trufflehog

      - name: Save results to file
        if: always()
        run: |
          echo '${{ toJson(steps.trufflehog.outputs) }}' > trufflehog-results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 30
          if-no-files-found: ignore
