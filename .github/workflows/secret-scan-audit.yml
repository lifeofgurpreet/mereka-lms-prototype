name: Secret Scan Audit

on:
  schedule:
    # 1st of each month at 03:00 UTC (per-PR scan in ci.yml covers new commits continuously)
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  trufflehog:
    name: TruffleHog — Full History Scan
    runs-on: mereka-k8s-runners
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # SHA pin for trufflesecurity/trufflehog@main (2026-02-24)
        uses: trufflesecurity/trufflehog@b54e4af0e57be44a32be35db9315ea2dd4ac8dab
        continue-on-error: true
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --json --no-update --only-verified
        id: trufflehog

      - name: Save results to file
        if: always()
        run: |
          echo '${{ toJson(steps.trufflehog.outputs) }}' > trufflehog-results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 30
          if-no-files-found: ignore
