name: Smoke - Authn MFE Config

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke-authn-mfe:
    name: Authn MFE Smoke Tests
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run authn MFE smoke tests (dry-run)
        run: ./scripts/qa/smoke-authn-mfe.sh --dry-run
