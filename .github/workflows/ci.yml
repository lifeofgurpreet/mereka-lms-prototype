          bash -n scripts/qa/verify-mfe-first-policy.sh
          bash -n scripts/qa/verify-tenant-branding-runtime.sh
          bash -n scripts/qa/verify-slot-matrix.sh
          bash -n scripts/qa/verify-interaction-state-contract.sh
          bash -n scripts/qa/verify-mfe-selector-hardening.sh
          bash -n scripts/qa/verify-mfe-footer-slot-migration.sh
          bash -n scripts/qa/verify-performance-budget.sh
          bash -n scripts/qa/verify-footer-slot-migration.sh
          bash -n scripts/qa/verify-multisite-ux-consistency.sh
          bash -n scripts/qa/verify-plugin-slot-migration-register.sh
          bash -n scripts/qa/verify-release-deployment-choreography.sh
