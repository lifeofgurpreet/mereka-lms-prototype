      - name: Verify contrast ratios (tokens ↔ WCAG AA thresholds)
        run: ./scripts/qa/verify-contrast-compliance.sh

  custom-app-drift:
    name: Custom App Install Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify custom apps (settings ↔ plugin ↔ directory)
        run: ./scripts/qa/verify-custom-app-drift.sh

  design-token-usage:
    name: Design Token Usage Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint for hardcoded colors
        run: ./scripts/qa/verify-design-token-usage.sh

  frontend-version-truth:
    name: Frontend Version Truth (AC-UIVER-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frontend version consistency (docs ↔ CI ↔ scripts ↔ K8s)
        run: ./scripts/qa/verify-frontend-version-truth.sh

  legacy-ecommerce-guard:
    name: Legacy Ecommerce UI Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for legacy ecommerce UI references
        run: ./scripts/qa/verify-legacy-ecommerce-ui-refs.sh

  accessibility-gates:
    name: Accessibility Gates (syntax + structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n scripts/qa/verify-ui-accessibility.sh
      - name: Verify axe journey coverage
        run: |
          # Ensure all 4 required journeys are defined
          grep -q '/authn/login' scripts/qa/verify-ui-accessibility.sh
          grep -q '/learner-dashboard/' scripts/qa/verify-ui-accessibility.sh
          grep -q '/learning/' scripts/qa/verify-ui-accessibility.sh
          grep -q '/discussions/' scripts/qa/verify-ui-accessibility.sh
          echo "All 4 required journeys present"
      - name: Verify visual regression page count
        run: |
          # Count page targets in visual regression script (should have 18+ entries in CRITICAL_PAGES)
          PAGE_COUNT=$(grep -c '^\s*\["' scripts/qa/visual-regression-test.sh || echo 0)
          echo "Visual regression covers ${PAGE_COUNT} page entries"
          if [[ $PAGE_COUNT -lt 18 ]]; then
            echo "ERROR: Expected at least 18 page entries, found $PAGE_COUNT"
            exit 1
          fi
          echo "Page count verification passed (${PAGE_COUNT} pages)"

  mfe-first-policy:
    name: MFE-First Policy Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check MFE-first policy compliance
        run: ./scripts/qa/verify-mfe-first-policy.sh

  analytics-key-guard:
    name: Analytics Key Injection Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify analytics key injection safety
        run: ./scripts/qa/verify-analytics-key.sh

  branding-token-integrity:
    name: Branding Token Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify branding token integrity
        run: ./scripts/qa/verify-branding-token-integrity.sh

  footer-variant-matrix:
    name: Footer Variant Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify footer variant matrix (AC-FTVAR-001 through AC-FTVAR-005)
        run: ./scripts/qa/verify-footer-variant-matrix.sh

  no-dom-overrides:
    name: No DOM Overrides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/qa/verify-no-dom-overrides.sh

      - name: Verify no forbidden DOM overrides (AC-FTR-001 through AC-FTR-004)
        run: ./scripts/qa/verify-no-dom-overrides.sh

  migration-lock:
    name: Migration Lock Gate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.title, 'branding') ||
        contains(github.event.pull_request.title, 'theme') ||
        contains(github.event.pull_request.title, 'mfe') ||
        contains(github.event.pull_request.title, 'slot') ||
        contains(github.event.pull_request.title, 'migration')
      )
    steps:
      - uses: actions/checkout@v4
      - name: Run migration lock gate
        run: ./scripts/qa/verify-migration-lock.sh

  tenant-branding-qa:
    name: Tenant Branding QA (Consolidated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/qa/run-tenant-branding-qa.sh

      - name: Run consolidated tenant branding QA (AC-TBQA-001 through AC-TBQA-005)
        run: ./scripts/qa/run-tenant-branding-qa.sh

  enterprise-ui-review:
    name: Enterprise UI Review Gate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.title, 'enterprise') ||
        contains(github.event.pull_request.title, 'branding') ||
        contains(github.event.pull_request.title, 'brand')
      )
    steps:
      - uses: actions/checkout@v4
      - name: Run enterprise UI review gate
        run: ./scripts/qa/verify-enterprise-ui-review.sh

  tenant-branding-matrix:
    name: Tenant Branding Matrix Gate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.title, 'tenant') ||
        contains(github.event.pull_request.title, 'branding') ||
        contains(github.event.pull_request.title, 'multisite') ||
        contains(github.event.pull_request.title, 'domain')
      )
    steps:
      - uses: actions/checkout@v4
      - name: Run tenant branding matrix gate
        run: ./scripts/qa/verify-tenant-branding-matrix.sh

  footer-parity:
    name: Footer Parity Gate
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.title, 'footer') ||
        contains(github.event.pull_request.title, 'branding') ||
        contains(github.event.pull_request.title, 'parity')
      )
    steps:
      - uses: actions/checkout@v4
      - name: Run footer parity gate
        run: ./scripts/qa/verify-footer-parity.sh
