          echo "All 4 required journeys present"
      - name: Verify visual regression page count
        run: |
          # Count page targets in visual regression script (should have 18+ entries in CRITICAL_PAGES)
          PAGE_COUNT=$(grep -c '^\s*\["' scripts/qa/visual-regression-test.sh || echo 0)
          echo "Visual regression covers ${PAGE_COUNT} page entries"
