name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff yamllint

      - name: Lint Python files
        run: |
          ruff check scripts/ services/ || true

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml infrastructure/ deploy/ || true

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find deploy/k8s -name '*.yml' -o -name '*.yaml' | \
            xargs kubeconform -strict -ignore-missing-schemas || true

  validate-tutor-config:
    name: Validate Tutor Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate config.example.yml
        run: |
          python3 -c "
          import yaml
          with open('infrastructure/tutor/config.example.yml') as f:
              config = yaml.safe_load(f)
              print(f'✅ Config has {len(config)} top-level keys')
          "

      - name: Check patch script syntax
        run: |
          bash -n infrastructure/tutor/apply-patches.sh
          echo "✅ Patch script syntax valid"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Check Dockerfiles
        run: |
          if find . -name 'Dockerfile*' | head -1 | grep -q .; then
            docker run --rm -v $(pwd):/src hadolint/hadolint:latest \
              hadolint /src/**/Dockerfile* || true
          fi
