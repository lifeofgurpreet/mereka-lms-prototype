          bash -n scripts/qa/verify-footer-parity.sh
          bash -n scripts/qa/verify-footer-slot-only.sh
          bash -n scripts/qa/verify-mfe-routing-parity.sh
          bash -n scripts/qa/verify-a11y-contrast-focus.sh
          bash -n scripts/qa/verify-a11y-authenticated-routes.sh
