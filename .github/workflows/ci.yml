name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  spec-lint:
    name: Spec Integrity Gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint specs
        run: python3 scripts/qa/spec-tools/mereka_spec_lint.py specs/ --severity-filter error

      - name: Verify spec-testmap mapping (informational)
        run: python3 scripts/qa/spec-tools/mereka_spec_verify.py specs/ --repo-root . --testmaps-dir specs/testmaps/ || true

      - name: Validate testmap format
        run: python3 scripts/qa/spec-tools/validate_testmap_format.py specs/testmaps/

      - name: Coverage report
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ --testmaps-dir specs/testmaps/ --repo-root . \
            --format markdown --output var/spec-coverage.md --fail-under 80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: spec-coverage
          path: var/spec-coverage.md

  generated-docs:
    name: Generated Docs Are Up To Date
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Verify OPENEDX_HOSTNAMES.md is generated and current
        run: |
          ./scripts/gen/update-openedx-hostnames-doc.sh
          git diff --exit-code -- docs/operations/OPENEDX_HOSTNAMES.md

  design-token-validation:
    name: Design Token Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Validate tokens.css syntax
        run: |
          python3 -c "
          import re, sys
          css = open('assets/branding/tokens.css').read()
          if ':root' not in css:
              print('FAIL: tokens.css missing :root selector'); sys.exit(1)
          # Check balanced braces
          if css.count('{') != css.count('}'):
              print('FAIL: tokens.css has unbalanced braces'); sys.exit(1)
          # Check all properties end with semicolons
          props = re.findall(r'--[a-z0-9_-]+\s*:', css)
          if len(props) < 80:
              print(f'FAIL: tokens.css only has {len(props)} properties (expected >= 80)'); sys.exit(1)
          print(f'OK: tokens.css has {len(props)} token definitions')
          "

      - name: Validate tokens.provenance.json
        run: |
          python3 -c "
          import json, re, sys
          p = json.load(open('assets/branding/tokens.provenance.json'))
          required = ['source_repo','source_path','source_branch','source_commit','source_sha256','synced_at_utc']
          missing = [k for k in required if not p.get(k)]
          if missing:
              print(f'FAIL: provenance missing keys: {missing}'); sys.exit(1)
          if not re.fullmatch(r'[0-9a-f]{40}', p['source_commit']):
              print('FAIL: source_commit is not a valid 40-char SHA'); sys.exit(1)
          if not re.fullmatch(r'[0-9a-f]{64}', p['source_sha256']):
              print('FAIL: source_sha256 is not a valid 64-char SHA256'); sys.exit(1)
          print('OK: tokens.provenance.json is valid')
          "

      - name: Verify token drift (tokens.css vs overrides)
        run: |
          ./scripts/branding/verify-token-drift.sh

      - name: Verify design tokens (all 12 ACs)
        run: |
          ./scripts/qa/verify-design-tokens.sh

      - name: Verify token values in theme files
        run: |
          python3 -c "
          import re, sys
          tokens_css = open('assets/branding/tokens.css').read()
          overrides = open('infrastructure/tutor/themes/mereka/common/static/css/mereka-overrides.css').read()
          mfe_scss = open('infrastructure/tutor/themes/mereka/mfe/mereka.scss').read()
          # Extract color hex values from tokens.css
          colors = dict(re.findall(r'(--color-(?:teal|magenta|blue|sky))\s*:\s*(#[0-9a-fA-F]{6})', tokens_css))
          fails = []
          for name, val in colors.items():
              if val.lower() not in overrides.lower():
                  fails.append(f'{name}={val} missing from mereka-overrides.css')
              if val.lower() not in mfe_scss.lower():
                  # MFE uses var() references, check for the token name instead
                  alias = name.replace('--color-', '--mereka-color-')
                  if alias not in mfe_scss:
                      fails.append(f'{name} / {alias} not referenced in mfe/mereka.scss')
          if fails:
              for f in fails: print(f'FAIL: {f}')
              sys.exit(1)
          print(f'OK: {len(colors)} key token values verified in theme files')
          "

  branding-preflight:
    name: Branding Preflight (Source)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run source-only branding gate (deep)
        run: |
          RUN_LIVE_GATE=0 \
          BRANDING_LEVEL=deep \
          ./scripts/branding/run-branding-gates.sh prod

