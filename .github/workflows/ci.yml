# @covers AC-RS-001, AC-RS-002, AC-RS-003, AC-RS-004
# @spec: repository-structure_spec.md
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tools/docs/**'
      - 'generated/catalogs/**'
      - 'docs/catalog.json'
      - 'specs/testmaps/README.md'
      - 'specs/_generated/testmaps/README.md'
      - '.github/workflows/docs-compliance.yml'
      - '.github/workflows/docs-policy.yml'
      - '.github/workflows/codeql.yml'
      - '*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  change-scope:
    name: Detect docs-only control-plane scope
    runs-on: mereka-k8s-runners
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect docs-only control-plane diff
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          if [[ "${#CHANGED[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          for path in "${CHANGED[@]}"; do
            case "$path" in
              docs/*|tools/docs/*|generated/catalogs/*|generated/adr-bundles/*|generated/decision-maps/*|generated/graphs/*|specs/testmaps/README.md|specs/_generated/testmaps/README.md|scripts/qa/build_decision_graph.py|scripts/qa/generate_adr_readme.py|scripts/qa/sync-openedx-audit-pr-status.sh|.github/workflows/docs-compliance.yml|.github/workflows/docs-policy.yml|.github/workflows/ci.yml|.github/workflows/codeql.yml|*.md|CLAUDE.md|AGENTS.md|CONTRIBUTING.md|SECURITY.md|LICENSE)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done

          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # Job 1: static-validation
  # Runs on every PR and push. Replaces 65+ micro-jobs:
  #   spec-lint, generated-docs, design-token-validation, branding-preflight,
  #   monitoring-guardrails, atlas-modulestore-guardrails, tenant-branding-contract,
  #   brand-pack-schema, gitops-image-contract, prod-tag-guard, lint, validate-k8s,
  #   validate-tutor-config, validate-infisical, verify-static, security-scan,
  #   pip-audit, mfe-footer-slot, mfe-route-drift, token-definitions,
  #   plugin-slot-wiring, mfe-footer-slot-migration, mfe-selector-hardening,
  #   mfe-selector-hardening-pr, plugin-slot-migration, contrast-compliance,
  #   custom-app-drift, design-token-usage, frontend-version-truth,
  #   token-integrity-routing, legacy-ecommerce-guard, accessibility-gates,
  #   mfe-first-policy, analytics-key-guard, branding-token-integrity,
  #   token-drift, footer-variant-matrix, no-dom-overrides, migration-lock,
  #   tenant-branding-qa, enterprise-ui-review, tenant-branding-matrix,
  #   footer-parity, mfe-routing-parity, a11y-contrast-focus,
  #   a11y-authenticated-routes, performance-budget, copy-terminology,
  #   visual-smoke-baseline, tenant-ui-smoke, footer-slot-only,
  #   tenant-isolation-evidence, a11y-tenant-branding, visual-parity-checkpoints,
  #   ui-ux-hardening-bundle, multitenant-brand-platform,
  #   tenant-footer-variant-lane, mfe-analytics-plugin-parity,
  #   module-surface-validation, release-deployment-choreography,
  #   postmerge-governance-closure, analytics-undefined-regression,
  #   analytics-key-elimination, legacy-footer-removal, selector-to-slot-migration,
  #   multi-tenant-branding-ops, analytics-hardening, tenant-config-handoff,
  #   translation-validation, and verify-specs.yml fast-verification.
  # ============================================================================
  static-validation:
    name: Static Validation
    needs: change-scope
    if: ${{ github.event_name != 'pull_request' || needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: mereka-k8s-runners
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Full history needed for origin/main...HEAD range in spec integrity gates

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'

      - name: Prepare local tool cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/bin"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"

      # ── Install kubeconform (cached) ──────────────────────────────────────
      - name: Cache kubeconform
        id: cache-kubeconform
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache/bin/kubeconform
          key: kubeconform-v0.6.4-linux-amd64

      - name: Install kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          # kubeconform v0.6.4 — checksum computed 2026-03-05
          EXPECTED_SHA="2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07"
          TARBALL="kubeconform-linux-amd64.tar.gz"
          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download/v0.6.4/${TARBALL}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "${TARBALL}" "${KUBECONFORM_URL}"
          echo "${EXPECTED_SHA}  ${TARBALL}" | sha256sum -c -
          tar xzf "${TARBALL}"
          install -m 0755 kubeconform "$GITHUB_WORKSPACE/.cache/bin/kubeconform"
          rm "${TARBALL}"
          kubeconform -v

      # ── Install ripgrep (needed by verification scripts) ──────────────────
      - name: Install ripgrep
        run: |
          if ! command -v rg &>/dev/null; then
            RG_VERSION="15.1.0"
            RG_TARBALL="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            RG_BASE_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}" "${RG_BASE_URL}/${RG_TARBALL}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}.sha256" "${RG_BASE_URL}/${RG_TARBALL}.sha256"
            sha256sum -c "${RG_TARBALL}.sha256"
            tar xzf "${RG_TARBALL}"
            install -m 0755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" \
              "$GITHUB_WORKSPACE/.cache/bin/rg"
            rm -rf "${RG_TARBALL}" "${RG_TARBALL}.sha256" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          fi

      # ── Phase A: Shell script syntax check (all scripts in parallel) ───────
      - name: Syntax check all shell scripts
        run: |
          find scripts/ -name '*.sh' -type f | xargs -P8 bash -n
          bash -n scripts/qa/verify-multisite-ux-consistency.sh
          bash -n infrastructure/tutor/apply-patches.sh
          echo "All shell script syntax checks passed"

      # ── Phase B: Linting ──────────────────────────────────────────────────
      - name: Lint Python files
        run: ruff check scripts/ services/

      - name: Lint YAML files
        run: yamllint -c .yamllint.yml infrastructure/ deploy/

      - name: Enforce repo conventions (includes immutable workflow refs)
        run: ./scripts/qa/lint-repo-conventions.sh

      - name: Lint shell scripts (shellcheck)
        run: |
          if ! command -v shellcheck &>/dev/null; then
            SC_VERSION="v0.10.0"
            SC_TARBALL="shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
            SC_URL="https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/${SC_TARBALL}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${SC_TARBALL}" "${SC_URL}"
            # xz may not be available on ARC runners; use Python as fallback
            if command -v xz &>/dev/null; then
              tar xJf "${SC_TARBALL}"
            else
              python3 -c "
          import lzma, tarfile, io, sys
          with open('${SC_TARBALL}', 'rb') as f:
              decompressed = lzma.decompress(f.read())
          with tarfile.open(fileobj=io.BytesIO(decompressed)) as t:
              t.extractall()
          "
            fi
            install -m 0755 "shellcheck-${SC_VERSION}/shellcheck" "$GITHUB_WORKSPACE/.cache/bin/shellcheck"
            rm -rf "${SC_TARBALL}" "shellcheck-${SC_VERSION}"
          fi
          find scripts/ -name '*.sh' -type f -print0 | xargs -0 shellcheck --severity=error

      - name: Validate Kubernetes manifests
        run: |
          find deploy/k8s -name '*.yml' -o -name '*.yaml' | \
            grep -v '/patches/' | \
            grep -v '/config/' | \
            grep -v '/settings/' | \
            grep -v 'helm-values' | \
            grep -v 'registry\.yaml' | \
            grep -v 'SECRET_CLASSIFICATION' | \
            xargs kubeconform -strict -ignore-missing-schemas

      # ── Phase B (continued): Spec linting ─────────────────────────────────
      - name: Run spec integrity gates
        run: bash scripts/qa/run-spec-integrity-gates.sh

      - name: Spec coverage report
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ --repo-root . \
            --format markdown --output var/spec-coverage.md --fail-under 80

      - name: Upload spec coverage artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: spec-coverage
          path: var/spec-coverage.md
          retention-days: 3

      # ── Phase B (continued): PR spec coverage report (fast-verification) ──
      - name: Spec coverage report for PR
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ \
            --scan-dirs scripts/ tests/ deploy/ infrastructure/ services/ \
            --manual-file specs/manual_verifications.yaml \
            --repo-root . \
            --format markdown \
            --output var/spec-coverage-pr.md

      - name: Upload PR coverage artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: spec-coverage-pr
          path: var/spec-coverage-pr.md
          retention-days: 3

      - name: Markdown linting
        run: |
          npm install -g markdownlint-cli
          markdownlint docs/ specs/ --ignore docs/archive/ || true

      # ── Phase C: Run all static verification scripts in parallel ──────────
      - name: Run static verification scripts
        run: PARALLELISM=4 TIMEOUT_SECS=120 ./scripts/qa/run-release-verification-gates.sh

      - name: Generate aggregate summary report
        if: always()
        run: |
          mkdir -p var
          SUMMARY_FILE="var/verification-summary.md"
          echo "# Verification Summary" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$SUMMARY_FILE"
          echo "**Commit**: ${{ github.sha }}" >> "$SUMMARY_FILE"
          echo "**Branch**: ${{ github.ref_name }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "## Script Results" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          if [[ -f var/ci-results/summary.txt ]]; then
            PASS=$(grep -c "^PASS"    var/ci-results/summary.txt || true)
            FAIL=$(grep -c "^FAIL"    var/ci-results/summary.txt || true)
            TIMEOUTS=$(grep -c "^TIMEOUT" var/ci-results/summary.txt || true)
            SKIPS=$(grep -c "^SKIP"   var/ci-results/summary.txt || true)
            TOTAL=$((PASS + FAIL + TIMEOUTS + SKIPS))
            echo "| Metric | Count |" >> "$SUMMARY_FILE"
            echo "|--------|-------|" >> "$SUMMARY_FILE"
            echo "| Passed | $PASS |" >> "$SUMMARY_FILE"
            echo "| Failed | $FAIL |" >> "$SUMMARY_FILE"
            echo "| Timeout | $TIMEOUTS |" >> "$SUMMARY_FILE"
            echo "| Skipped | $SKIPS |" >> "$SUMMARY_FILE"
            echo "| Total | $TOTAL |" >> "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            if [[ $((PASS + FAIL + TIMEOUTS)) -gt 0 ]]; then
              SUCCESS_RATE=$(awk "BEGIN {printf \"%.1f\", ($PASS / ($PASS + $FAIL + $TIMEOUTS)) * 100}")
              echo "**Success Rate**: ${SUCCESS_RATE}% (${PASS}/$((PASS + FAIL + TIMEOUTS)))" >> "$SUMMARY_FILE"
            fi
            echo "" >> "$SUMMARY_FILE"
            echo "## Per-Script Results" >> "$SUMMARY_FILE"
            echo '```' >> "$SUMMARY_FILE"
            cat var/ci-results/summary.txt >> "$SUMMARY_FILE"
            echo '```' >> "$SUMMARY_FILE"
          else
            echo "_No results file found_" >> "$SUMMARY_FILE"
          fi
          echo "" >> "$SUMMARY_FILE"
          echo "---" >> "$SUMMARY_FILE"
          echo "*Generated by ci.yml static-validation job*" >> "$SUMMARY_FILE"
          cat "$SUMMARY_FILE"

      - name: Upload CI results artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: ci-results
          path: var/ci-results/
          retention-days: 3

      - name: Upload verification summary artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: verification-summary
          path: var/verification-summary.md
          retention-days: 90

      # ── Phase D: A11y sequential chain (R5 dependency preserved) ──────────
      - name: Verify authenticated smoke + WCAG AA contrast gates
        run: |
          bash -n scripts/qa/verify-authenticated-smoke-a11y.sh
          ./scripts/qa/verify-authenticated-smoke-a11y.sh

      - name: Verify a11y regression lane (depends on smoke-a11y above)
        run: |
          bash -n scripts/qa/verify-a11y-regression-lane.sh
          ./scripts/qa/verify-a11y-regression-lane.sh

      # ── Phase E: Validation checks (extracted scripts) ────────────────────
      - name: Validate design token syntax
        run: python3 scripts/qa/check-design-token-syntax.py

      - name: Validate tokens.provenance.json
        run: python3 scripts/qa/check-tokens-provenance.py

      - name: Validate token values in theme files
        run: python3 scripts/qa/check-token-values-in-theme.py

      - name: Syntax check token drift verifier
        run: bash -n scripts/qa/verify-token-drift.sh

      - name: Verify token drift
        run: ./scripts/qa/verify-token-drift.sh

      - name: Validate config.example.yml
        run: python3 scripts/qa/check-config-example-yaml.py

      - name: Verify OPENEDX_HOSTNAMES.md is generated and current
        run: |
          ./scripts/gen/update-openedx-hostnames-doc.sh
          git diff --exit-code -- docs/reference/operations/OPENEDX

      - name: Verify axe journey coverage
        run: bash scripts/qa/check-axe-journey-coverage.sh

      - name: Verify visual regression page count
        run: bash scripts/qa/check-visual-regression-page-count.sh

      - name: Verify visual smoke baseline
        run: ./scripts/qa/verify-visual-smoke-baseline.sh

      - name: Verify visual parity checkpoints
        run: ./scripts/qa/verify-visual-parity-checkpoints.sh

      - name: Verify generated token layers are in sync
        run: ./scripts/branding/generate-tokens-from-canonical.sh --check

      - name: Run source-only branding gate
        run: |
          RUN_LIVE_GATE=0 BRANDING_LEVEL=deep ./scripts/branding/run-branding-gates.sh prod

      - name: Verify certificate branding surfaces
        run: ./scripts/qa/verify-certificate-branding.sh

      - name: Verify FPF slot coverage truth
        run: ./scripts/qa/verify-fpf-slot-coverage.sh

      - name: Run frontend performance spot-check
        run: ./scripts/qa/verify-frontend-performance-spotcheck.sh

      - name: Run local observability audit
        run: ./scripts/qa/audit-observability.sh --mode local

      - name: Generate offline monitoring plan
        run: |
          OFFLINE_PLAN=1 ./scripts/infra/apply-monitoring-configs.sh plan | tee monitoring-plan.txt
          grep -q "Offline plan complete" monitoring-plan.txt
          grep -q "gcloud monitoring" monitoring-plan.txt

      - name: Upload monitoring plan artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: monitoring-offline-plan-static
          path: monitoring-plan.txt
          retention-days: 3

      - name: Run Atlas modulestore contract check
        run: ./scripts/qa/verify-atlas-modulestore-path.sh --mode local

      # ── Phase F: Infisical validation (conditional) ────────────────────────
      - name: Validate Infisical secrets
        if: ${{ vars.HAS_INFISICAL == 'true' }}
        env:
          INFISICAL_DOMAIN: https://secrets.mereka.io/api
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          ENABLE_STAGING_ENV: ${{ vars.ENABLE_STAGING_ENV }}
        run: |
          npm i -g @infisical/cli
          STRICT=1 INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh
          STRICT=1 INFISICAL_ENV=dev  ./scripts/infra/infisical-validate-mereka-lms.sh
          if [[ "${ENABLE_STAGING_ENV:-false}" == "true" ]]; then
            STRICT=1 INFISICAL_ENV=staging ./scripts/infra/infisical-validate-mereka-lms.sh
          else
            echo "Staging Infisical validation skipped (ENABLE_STAGING_ENV != true)"
          fi

      # ── Phase G: Translation validation ───────────────────────────────────
      - name: Verify atlas.yml and translation infrastructure
        run: bash scripts/qa/check-atlas-translation-infra.sh

      - name: Validate .po file syntax (if present)
        run: python3 scripts/qa/check-po-file-syntax.py

      - name: Validate MFE messages.json syntax (if present)
        run: python3 scripts/qa/check-messages-json-syntax.py

      - name: Run offline translation verification
        run: |
          set -euo pipefail
          mkdir -p var/ci
          bash -n scripts/qa/verify-translations.sh
          ./scripts/qa/verify-translations.sh --offline | tee var/ci/translation-validation.log || true
          grep -q "^FAIL\b\|✗ FAIL" var/ci/translation-validation.log && {
            echo "::error::Translation verification found failures — see log above"
            exit 1
          } || echo "Translation verification passed (SKIP/WARN are acceptable)"

      - name: Upload translation validation log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: translation-validation-log
          path: var/ci/translation-validation.log
          if-no-files-found: warn
          retention-days: 3

      # ── PR comment: spec verification summary ─────────────────────────────
      - name: Post PR comment with spec verification summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const fs = require('fs');
            let coverageContent = '';
            try {
              coverageContent = fs.readFileSync('var/spec-coverage-pr.md', 'utf8');
            } catch (error) {
              coverageContent = '_Coverage report not available_';
            }
            // Sanitize: truncate and escape HTML to prevent injection
            if (coverageContent.length > 5000) {
              coverageContent = coverageContent.substring(0, 5000) + '\n\n..._[Truncated to 5000 chars]_';
            }
            coverageContent = coverageContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const jobResult = '${{ job.status }}';
            const statusEmoji = jobResult === 'success' ? '✅' : '❌';
            const body = `## ${statusEmoji} CI Static Validation

            **Job result**: ${jobResult}

            ### Spec Coverage

            <details>
            <summary>View coverage report</summary>

            ${coverageContent}

            </details>

            ### Next Steps

            ${jobResult === 'success'
              ? '- ✅ Static validation passed\n- Full verification will run on merge to main'
              : '- ❌ Some checks failed — review workflow logs\n- Fix issues before merging'}

            ---
            *Automated by ci.yml static-validation job*
            `;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Static Validation')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # ============================================================================
  # Job 2: tutor-config-tests
  # Renders a full Tutor environment + applies patches + runs test suite.
  # Replaces: tutor-config-tests, validate-tutor-config from old ci.yml.
  # ============================================================================
  tutor-config-tests:
    name: Tutor Configuration Tests
    needs: change-scope
    if: ${{ github.event_name != 'pull_request' || needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: mereka-k8s-runners
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'

      - name: Install Tutor
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install -r requirements-tutor.txt

      - name: Render Tutor environment + apply patches
        env:
          TUTOR_ROOT: ${{ github.workspace }}/tutor_env
        run: |
          source .venv/bin/activate
          export TUTOR_ROOT="${{ github.workspace }}/tutor_env"
          tutor config save
          ./infrastructure/tutor/apply-patches.sh

      - name: Run tutor apply patches test
        run: bash tests/tutor/test_tutor_apply.sh

      - name: Run tutor verify patches test
        run: bash tests/tutor/test_verify_patches.sh

      - name: Run tutor pre-commit hook test
        run: bash tests/tutor/test_pre_commit_hook.sh

      - name: Run tutor idempotency test
        run: bash tests/tutor/test_idempotency.sh

      - name: Run tutor edge cases test
        run: bash tests/tutor/test_edge_cases.sh

      - name: Validate config.example.yml structure
        run: |
          source .venv/bin/activate
          python3 scripts/qa/check-config-example-yaml.py

      - name: Generate offline monitoring plan
        run: |
          OFFLINE_PLAN=1 ./scripts/infra/apply-monitoring-configs.sh plan | tee monitoring-plan.txt
          grep -q "Offline plan complete" monitoring-plan.txt
          grep -q "gcloud monitoring" monitoring-plan.txt

      - name: Upload monitoring plan artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: monitoring-offline-plan
          path: monitoring-plan.txt
          retention-days: 3

  # ============================================================================
  # Job 3: security-scans
  # TruffleHog (HEAD only), Hadolint on all Dockerfiles, pip-audit.
  # Replaces: security-scan, pip-audit from old ci.yml.
  # ============================================================================
  security-scans:
    name: Security Scans
    needs: change-scope
    if: ${{ github.event_name != 'pull_request' || needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: mereka-k8s-runners
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2  # TruffleHog needs parent commit for diff

      - name: Prepare local tool cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/bin"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"

      - name: Install TruffleHog
        run: |
          TH_VERSION="3.93.7"
          TH_TARBALL="trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          TH_BASE_URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "${TH_TARBALL}" "${TH_BASE_URL}/${TH_TARBALL}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "trufflehog_checksums.txt" "${TH_BASE_URL}/trufflehog_${TH_VERSION}_checksums.txt"
          grep " ${TH_TARBALL}\$" trufflehog_checksums.txt | sha256sum -c -
          tar xzf "${TH_TARBALL}"
          install -m 0755 trufflehog "$GITHUB_WORKSPACE/.cache/bin/trufflehog"
          rm -f "${TH_TARBALL}" trufflehog trufflehog_checksums.txt
          trufflehog --version

      - name: TruffleHog secret scan (HEAD only, verified only)
        run: |
          BASE_SHA=""
          HEAD_SHA=""
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                BASE_SHA="${{ github.event.before }}"
              fi
              HEAD_SHA="${{ github.sha }}"
              ;;
          esac

          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            trufflehog git "file://$PWD" \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --fail \
              --no-update \
              --github-actions \
              --only-verified
          else
            trufflehog filesystem . \
              --fail \
              --no-update \
              --github-actions \
              --only-verified
          fi

      - name: Install hadolint
        run: |
          HADOLINT_VERSION="2.14.0"
          HADOLINT_BINARY="hadolint-linux-x86_64"
          HADOLINT_URL="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/${HADOLINT_BINARY}"
          HADOLINT_SHA_URL="${HADOLINT_URL}.sha256"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "${HADOLINT_BINARY}" "${HADOLINT_URL}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "${HADOLINT_BINARY}.sha256" "${HADOLINT_SHA_URL}"
          sha256sum -c "${HADOLINT_BINARY}.sha256"
          install -m 0755 "${HADOLINT_BINARY}" "$GITHUB_WORKSPACE/.cache/bin/hadolint"
          rm -f "${HADOLINT_BINARY}" "${HADOLINT_BINARY}.sha256"
          hadolint --version

      - name: Hadolint Dockerfile lint
        run: |
          mapfile -t dockerfiles < <(find . -type f \( -name 'Dockerfile' -o -name '*.Dockerfile' \) | sort)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            echo "Linting ${dockerfile}"
            hadolint "${dockerfile}" || true
          done

      - name: Set up Python for pip-audit
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'
          extra-deps: 'pip-audit'

      - name: Install project deps (optional)
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Run pip-audit (dry-run, informational)
        run: pip-audit --desc --fix --dry-run 2>&1 || true

      - name: Run pip-audit (strict)
        run: pip-audit --desc

  # ============================================================================
  # Job 4: test-coverage
  # Python test suite with coverage enforcement. Non-blocking (continue-on-error).
  # Kept exactly as-is from original ci.yml.
  # ============================================================================
  test-coverage:
    name: Python test coverage
    needs: change-scope
    if: ${{ github.event_name != 'pull_request' || needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: mereka-k8s-runners
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'
          extra-deps: 'pytest pytest-cov'

      - name: Install project deps (optional)
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=40 -q
        continue-on-error: true  # Non-blocking until coverage improves

      - name: Upload coverage report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: coverage-report
          path: .coverage
          retention-days: 3
