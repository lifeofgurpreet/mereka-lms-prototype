          bash -n scripts/qa/verify-email-ace-channels.sh
          bash -n scripts/qa/verify-email-inapp-code.sh
          bash -n scripts/qa/verify-email-push-code.sh
          bash -n scripts/qa/verify-email-bulk-campaigns.sh
          bash -n scripts/qa/verify-email-digests-code.sh
