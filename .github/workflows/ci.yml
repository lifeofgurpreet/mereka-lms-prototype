name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  generated-docs:
    name: Generated Docs Are Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify OPENEDX_HOSTNAMES.md is generated and current
        run: |
          ./scripts/gen/update-openedx-hostnames-doc.sh
          git diff --exit-code -- docs/operations/OPENEDX_HOSTNAMES.md

  branding-preflight:
    name: Branding Preflight (Source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run source-only branding gate (deep)
        run: |
          RUN_LIVE_GATE=0 \
          BRANDING_LEVEL=deep \
          ./scripts/branding/run-branding-gates.sh prod

  monitoring-guardrails:
    name: Monitoring Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify script syntax
        run: |
          bash -n scripts/infra/apply-monitoring-configs.sh
          bash -n scripts/qa/audit-observability.sh

      - name: Run local observability audit
        run: |
          ./scripts/qa/audit-observability.sh --mode local

      - name: Generate offline monitoring plan
        run: |
          OFFLINE_PLAN=1 ./scripts/infra/apply-monitoring-configs.sh plan | tee monitoring-plan.txt
          grep -q "Offline plan complete" monitoring-plan.txt
          grep -q "gcloud monitoring" monitoring-plan.txt

      - name: Upload monitoring plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-offline-plan
          path: monitoring-plan.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff yamllint

      - name: Lint Python files
        run: |
          ruff check scripts/ services/

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml infrastructure/ deploy/

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find deploy/k8s -name '*.yml' -o -name '*.yaml' | \
            xargs kubeconform -strict -ignore-missing-schemas

  validate-tutor-config:
    name: Validate Tutor Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate config.example.yml
        run: |
          python3 -c "
          import yaml
          with open('infrastructure/tutor/config.example.yml') as f:
              config = yaml.safe_load(f)
              print(f'✅ Config has {len(config)} top-level keys')
          "

      - name: Check patch script syntax
        run: |
          bash -n infrastructure/tutor/apply-patches.sh
          echo "✅ Patch script syntax valid"

  validate-infisical:
    name: Validate Infisical Secrets (prod/dev)
    runs-on: ubuntu-latest
    if: ${{ secrets.INFISICAL_TOKEN != '' && secrets.INFISICAL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (Infisical CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Infisical CLI
        run: npm i -g @infisical/cli

      - name: Validate secrets in Infisical (strict)
        env:
          INFISICAL_DOMAIN: https://secrets.mereka.io/api
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          STRICT=1 INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh
          STRICT=1 INFISICAL_ENV=dev  ./scripts/infra/infisical-validate-mereka-lms.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Check Dockerfiles
        run: |
          if find . -name 'Dockerfile*' | head -1 | grep -q .; then
            docker run --rm -v $(pwd):/src hadolint/hadolint:latest \
              hadolint /src/**/Dockerfile*
          fi
