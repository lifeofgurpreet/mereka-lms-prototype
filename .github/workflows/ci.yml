name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  spec-lint:
    name: Spec Integrity Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint specs
        run: python3 scripts/qa/spec-tools/mereka_spec_lint.py specs/ --severity-filter error

      - name: Verify spec-testmap mapping (informational)
        run: python3 scripts/qa/spec-tools/mereka_spec_verify.py specs/ --repo-root . --testmaps-dir specs/testmaps/ || true

      - name: Validate testmap format
        run: python3 scripts/qa/spec-tools/validate_testmap_format.py specs/testmaps/

      - name: Coverage report
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ --testmaps-dir specs/testmaps/ --repo-root . \
            --format markdown --output var/spec-coverage.md --fail-under 80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-coverage
          path: var/spec-coverage.md

  generated-docs:
    name: Generated Docs Are Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify OPENEDX_HOSTNAMES.md is generated and current
        run: |
          ./scripts/gen/update-openedx-hostnames-doc.sh
          git diff --exit-code -- docs/operations/OPENEDX_HOSTNAMES.md

  branding-preflight:
    name: Branding Preflight (Source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run source-only branding gate (deep)
        run: |
          RUN_LIVE_GATE=0 \
          BRANDING_LEVEL=deep \
          ./scripts/branding/run-branding-gates.sh prod

  monitoring-guardrails:
    name: Monitoring Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify script syntax
        run: |
          bash -n scripts/infra/apply-monitoring-configs.sh
          bash -n scripts/qa/audit-observability.sh
          bash -n scripts/qa/run-operations-gates.sh
          bash -n scripts/qa/verify-gitops-image-overrides.sh
          bash -n scripts/qa/verify-alert-routing.sh
          bash -n scripts/qa/build-dr-evidence-bundle.sh
          bash -n scripts/infra/release-openedx-gitops.sh
          bash -n scripts/qa/verify-release-automation.sh
          bash -n scripts/qa/verify-build-workflow-contract.sh
          bash -n scripts/qa/verify-release-workflow-invocation.sh
          bash -n scripts/qa/verify-release-dry-run-contract.sh
          bash -n scripts/qa/verify-release-evidence-workflow.sh
          bash -n scripts/qa/verify-kustomize-no-deprecated-keys.sh
          bash -n scripts/qa/verify-dev-prod-image-parity.sh
          bash -n scripts/qa/verify-site-id-hardening.sh
          bash -n scripts/qa/lint-active-docs-env-model.sh

      - name: Run local observability audit
        run: |
          ./scripts/qa/audit-observability.sh --mode local

      - name: Verify release automation contract
        run: |
          ./scripts/qa/verify-release-automation.sh

      - name: Verify build workflow contract
        run: |
          ./scripts/qa/verify-build-workflow-contract.sh

      - name: Verify release workflow invocation flags
        run: |
          bash ./scripts/qa/verify-release-workflow-invocation.sh

      - name: Verify release dry-run contract
        run: |
          ./scripts/qa/verify-release-dry-run-contract.sh

      - name: Verify release evidence workflow contract
        run: |
          ./scripts/qa/verify-release-evidence-workflow.sh

      - name: Verify no deprecated kustomize keys
        run: |
          ./scripts/qa/verify-kustomize-no-deprecated-keys.sh

      - name: Verify dev/prod image parity
        run: |
          ./scripts/qa/verify-dev-prod-image-parity.sh

      - name: Verify SITE_ID hardening contract
        run: |
          ./scripts/qa/verify-site-id-hardening.sh

      - name: Lint active docs env model wording
        run: |
          ./scripts/qa/lint-active-docs-env-model.sh

      - name: Generate offline monitoring plan
        run: |
          OFFLINE_PLAN=1 ./scripts/infra/apply-monitoring-configs.sh plan | tee monitoring-plan.txt
          grep -q "Offline plan complete" monitoring-plan.txt
          grep -q "gcloud monitoring" monitoring-plan.txt

      - name: Upload monitoring plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-offline-plan
          path: monitoring-plan.txt

  atlas-modulestore-guardrails:
    name: Atlas Modulestore Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Atlas guard script syntax
        run: |
          bash -n scripts/qa/verify-atlas-modulestore-path.sh

      - name: Run repository Atlas modulestore contract check
        run: |
          ./scripts/qa/verify-atlas-modulestore-path.sh --mode local

  gitops-image-contract:
    name: GitOps Image Override Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify image override contract (repo-local)
        run: |
          ./scripts/qa/verify-gitops-image-overrides.sh --skip-infra

  prod-tag-guard:
    name: Production Tag Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no mutable latest tags in prod overlays
        run: |
          bash -n scripts/qa/verify-no-latest-prod-tags.sh
          ./scripts/qa/verify-no-latest-prod-tags.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff yamllint

      - name: Lint Python files
        run: |
          ruff check scripts/ services/

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint.yml infrastructure/ deploy/

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find deploy/k8s -name '*.yml' -o -name '*.yaml' | \
            xargs kubeconform -strict -ignore-missing-schemas

  validate-tutor-config:
    name: Validate Tutor Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate config.example.yml
        run: |
          python3 -c "
          import yaml
          with open('infrastructure/tutor/config.example.yml') as f:
              config = yaml.safe_load(f)
              print(f'✅ Config has {len(config)} top-level keys')
          "

      - name: Check patch script syntax
        run: |
          bash -n infrastructure/tutor/apply-patches.sh
          echo "✅ Patch script syntax valid"

  tutor-config-tests:
    name: Tutor Configuration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tutor apply patches test
        run: bash tests/tutor/test_tutor_apply.sh

      - name: Run tutor verify patches test
        run: bash tests/tutor/test_verify_patches.sh

      - name: Run tutor pre-commit hook test
        run: bash tests/tutor/test_pre_commit_hook.sh

      - name: Run tutor idempotency test
        run: bash tests/tutor/test_idempotency.sh

      - name: Run tutor edge cases test
        run: bash tests/tutor/test_edge_cases.sh

  validate-infisical:
    name: Validate Infisical Secrets (prod/dev)
    runs-on: ubuntu-latest
    if: ${{ secrets.INFISICAL_TOKEN != '' && secrets.INFISICAL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (Infisical CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Infisical CLI
        run: npm i -g @infisical/cli

      - name: Validate secrets in Infisical (strict)
        env:
          INFISICAL_DOMAIN: https://secrets.mereka.io/api
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          STRICT=1 INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh
          STRICT=1 INFISICAL_ENV=dev  ./scripts/infra/infisical-validate-mereka-lms.sh

  verify-static:
    name: Static Verification Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run static verification scripts
        run: |
          PASS=0
          FAIL=0
          SKIP=0
          SCRIPTS=(
            scripts/qa/verify-repo-structure.sh
            scripts/qa/verify-no-hardcoded-secrets.sh
            scripts/qa/verify-secrets-naming-convention.sh
            scripts/qa/verify-k8s-deployment-spec.sh
            scripts/qa/verify-k8s-externalsecrets.sh
            scripts/qa/verify-k8s-images.sh
            scripts/qa/verify-k8s-secrets-hygiene.sh
            scripts/qa/verify-kustomize-no-deprecated-keys.sh
            scripts/qa/verify-multisite-config.sh
            scripts/qa/verify-tutor-multisite-domains.sh
            scripts/qa/verify-mongodb-atlas-integration.sh
            scripts/qa/verify-atlas-data-persistence.sh
            scripts/qa/verify-data-migration-contracts.sh
            scripts/qa/verify-forum-migration-contracts.sh
            scripts/qa/verify-dev-prod-secret-separation.sh
            scripts/qa/verify-no-latest-prod-tags.sh
            scripts/qa/verify-sli-foundation.sh
            scripts/qa/verify-error-budget.sh
            scripts/qa/verify-sentry-wiring.sh
            scripts/qa/verify-sentry-cli-contract.sh
            scripts/qa/verify-observability-stack.sh
            scripts/qa/verify-cicd-merge-gates-and-secrets.sh
            scripts/qa/verify-build-workflow-contract.sh
            scripts/qa/verify-mfe-build-contract.sh
            scripts/qa/verify-mfe-build-prereqs.sh
            scripts/qa/verify-mfe-config-contract.sh
          )
          for f in "${SCRIPTS[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "SKIP $f (not found)"
              SKIP=$((SKIP + 1))
              continue
            fi
            if timeout 60 bash "$f" >/dev/null 2>&1; then
              echo "PASS $(basename "$f")"
              PASS=$((PASS + 1))
            else
              echo "FAIL $(basename "$f")"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "=== Results: $PASS passed, $FAIL failed, $SKIP skipped ==="
          if [[ $FAIL -gt 0 ]]; then
            echo "::error::$FAIL static verification script(s) failed"
            exit 1
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Check Dockerfiles
        run: |
          if find . -name 'Dockerfile*' | head -1 | grep -q .; then
            docker run --rm -v $(pwd):/src hadolint/hadolint:latest \
              hadolint /src/**/Dockerfile*
          fi
