          path: var/ci-results/
          retention-days: 3

  static-validation-postchecks:
    name: Static Validation Postchecks
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'

      - name: Prepare local tool cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/bin"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep
        run: |
          if ! command -v rg &>/dev/null; then
            RG_VERSION="15.1.0"
            RG_TARBALL="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            RG_BASE_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}" "${RG_BASE_URL}/${RG_TARBALL}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}.sha256" "${RG_BASE_URL}/${RG_TARBALL}.sha256"
            sha256sum -c "${RG_TARBALL}.sha256"
            tar xzf "${RG_TARBALL}"
            install -m 0755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" \
              "$GITHUB_WORKSPACE/.cache/bin/rg"
            rm -rf "${RG_TARBALL}" "${RG_TARBALL}.sha256" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          fi

      - name: Verify authenticated smoke + WCAG AA contrast gates
        run: |
          bash -n scripts/qa/verify-authenticated-smoke-a11y.sh
          ./scripts/qa/verify-authenticated-smoke-a11y.sh

      - name: Verify a11y regression lane (depends on smoke-a11y above)
        run: |
          bash -n scripts/qa/verify-a11y-regression-lane.sh
          ./scripts/qa/verify-a11y-regression-lane.sh

      - name: Validate design token syntax
        run: python3 scripts/qa/check-design-token-syntax.py

      - name: Validate tokens.provenance.json
        run: python3 scripts/qa/check-tokens-provenance.py

      - name: Validate token values in theme files
        run: python3 scripts/qa/check-token-values-in-theme.py

      - name: Syntax check token drift verifier
        run: bash -n scripts/qa/verify-token-drift.sh

      - name: Verify token drift
        run: ./scripts/qa/verify-token-drift.sh

      - name: Validate config.example.yml
        run: python3 scripts/qa/check-config-example-yaml.py

      - name: Verify OPENEDX_HOSTNAMES.md is generated and current
        run: |
          ./scripts/gen/update-openedx-hostnames-doc.sh
          git diff --exit-code -- docs/reference/operations/OPENEDX

      - name: Verify axe journey coverage
        run: bash scripts/qa/check-axe-journey-coverage.sh

      - name: Verify visual regression page count
        run: bash scripts/qa/check-visual-regression-page-count.sh

      - name: Verify visual smoke baseline
        run: ./scripts/qa/verify-visual-smoke-baseline.sh

      - name: Verify visual parity checkpoints
        run: ./scripts/qa/verify-visual-parity-checkpoints.sh

      - name: Verify generated token layers are in sync
        run: ./scripts/branding/generate-tokens-from-canonical.sh --check

      - name: Run source-only branding gate
        run: |
          RUN_LIVE_GATE=0 BRANDING_LEVEL=deep ./scripts/branding/run-branding-gates.sh prod

      - name: Verify certificate branding surfaces
        run: ./scripts/qa/verify-certificate-branding.sh

      - name: Verify FPF slot coverage truth
        run: ./scripts/qa/verify-fpf-slot-coverage.sh

      - name: Run frontend performance spot-check
        run: ./scripts/qa/verify-frontend-performance-spotcheck.sh

      - name: Run local observability audit
        run: ./scripts/qa/audit-observability.sh --mode local

      - name: Generate offline monitoring plan
        run: |
          OFFLINE_PLAN=1 ./scripts/infra/apply-monitoring-configs.sh plan | tee monitoring-plan.txt
          grep -q "Offline plan complete" monitoring-plan.txt
          grep -q "gcloud monitoring" monitoring-plan.txt

      - name: Upload monitoring plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: monitoring-offline-plan-static
          path: monitoring-plan.txt
          retention-days: 3

      - name: Run Atlas modulestore contract check
        run: ./scripts/qa/verify-atlas-modulestore-path.sh --mode local

      - name: Validate Infisical secrets
        if: ${{ vars.HAS_INFISICAL == 'true' }}
        env:
          INFISICAL_DOMAIN: https://secrets.mereka.io/api
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          ENABLE_STAGING_ENV: ${{ vars.ENABLE_STAGING_ENV }}
        run: |
          npm i -g @infisical/cli
          STRICT=1 INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh
          STRICT=1 INFISICAL_ENV=dev  ./scripts/infra/infisical-validate-mereka-lms.sh
          if [[ "${ENABLE_STAGING_ENV:-false}" == "true" ]]; then
            STRICT=1 INFISICAL_ENV=staging ./scripts/infra/infisical-validate-mereka-lms.sh
          else
            echo "Staging Infisical validation skipped (ENABLE_STAGING_ENV != true)"
          fi

      - name: Verify atlas.yml and translation infrastructure
        run: bash scripts/qa/check-atlas-translation-infra.sh

      - name: Validate .po file syntax (if present)
        run: python3 scripts/qa/check-po-file-syntax.py

      - name: Validate MFE messages.json syntax (if present)
        run: python3 scripts/qa/check-messages-json-syntax.py

      - name: Run offline translation verification
        run: |
          set -euo pipefail
          mkdir -p var/ci
          bash -n scripts/qa/verify-translations.sh
          ./scripts/qa/verify-translations.sh --offline | tee var/ci/translation-validation.log || true
          grep -q "^FAIL\b\|✗ FAIL" var/ci/translation-validation.log && {
            echo "::error::Translation verification found failures — see log above"
            exit 1
          } || echo "Translation verification passed (SKIP/WARN are acceptable)"

      - name: Upload translation validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: translation-validation-log
          path: var/ci/translation-validation.log
          if-no-files-found: warn
          retention-days: 3

  static-validation:
    name: Static Validation
    needs:
      - change-scope
      - static-validation-precheck
      - static-validation-lint
      - static-validation-shards
      - static-validation-postchecks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download PR coverage artifact
        if: ${{ github.event_name == 'pull_request' && needs.static-validation-precheck.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spec-coverage-pr
          path: var/spec-coverage-pr

      - name: Generate aggregate summary report
        if: always()
        run: |
          mkdir -p var
          SUMMARY_FILE="var/verification-summary.md"
          cat > "$SUMMARY_FILE" <<EOF
          # Verification Summary

          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}

          ## Job Results

          | Lane | Result |
          |------|--------|
          | Static Validation Precheck | ${{ needs.static-validation-precheck.result }} |
          | Static Validation Lint | ${{ needs.static-validation-lint.result }} |
          | Static Validation Scripts | ${{ needs.static-validation-shards.result }} |
          | Static Validation Postchecks | ${{ needs.static-validation-postchecks.result }} |

          ## Execution Model

          - Static script inventory is still authoritative via \`script-registry.yaml#ci_static_inventory\`.
          - Phase C now runs as three generated shards instead of one opaque monolith.
          - Branch protection still keys off this final \`Static Validation\` aggregate.

          ---
          *Generated by ci.yml static-validation aggregate job*
          EOF
          cat "$SUMMARY_FILE"

      - name: Upload verification summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verification-summary
          path: var/verification-summary.md
          retention-days: 90

      - name: Post PR comment with spec verification summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let coverageContent = '';
            try {
              coverageContent = fs.readFileSync('var/spec-coverage-pr/spec-coverage-pr.md', 'utf8');
            } catch (error) {
              coverageContent = '_Coverage report not available_';
            }
            if (coverageContent.length > 5000) {
              coverageContent = coverageContent.substring(0, 5000) + '\n\n..._[Truncated to 5000 chars]_';
            }
            coverageContent = coverageContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const dependencyResults = {
              precheck: '${{ needs.static-validation-precheck.result }}',
              lint: '${{ needs.static-validation-lint.result }}',
              shards: '${{ needs.static-validation-shards.result }}',
              postchecks: '${{ needs.static-validation-postchecks.result }}',
            };
            const dependencyFailure = Object.values(dependencyResults).some(result => result !== 'success');
            const jobResult = dependencyFailure ? 'failure' : 'success';
            const statusEmoji = jobResult === 'success' ? '✅' : '❌';
            const body = `## ${statusEmoji} CI Static Validation

            **Aggregate result**: ${jobResult}

            ### Lane Results

            - Static Validation Precheck: ${dependencyResults.precheck}
            - Static Validation Lint: ${dependencyResults.lint}
            - Static Validation Scripts: ${dependencyResults.shards}
            - Static Validation Postchecks: ${dependencyResults.postchecks}

            ### Spec Coverage

            <details>
            <summary>View coverage report</summary>

            ${coverageContent}

            </details>

            ### Next Steps

            ${jobResult === 'success'
              ? '- ✅ Static validation passed\n- Full verification will run on merge to main'
              : '- ❌ One or more static validation lanes failed\n- Review the failing lane instead of one monolithic job'}

            ---
            *Automated by ci.yml static-validation aggregate job*
            `;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Static Validation')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail if any static validation dependency failed
        if: ${{ needs.static-validation-precheck.result != 'success' || needs.static-validation-lint.result != 'success' || needs.static-validation-shards.result != 'success' || needs.static-validation-postchecks.result != 'success' }}
        run: |
          echo "::error::Static validation aggregate failed because one or more lanes failed"
          exit 1

  # ============================================================================
  # Job 2: tutor-config-tests
  # Renders a full Tutor environment + applies patches + runs test suite.
  # Replaces: tutor-config-tests, validate-tutor-config from old ci.yml.
  # ============================================================================
  tutor-config-tests:
    name: Tutor Configuration Tests
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ github.event_name == 'pull_request' && needs.change-scope.outputs.tutor_required != 'true' && 'ubuntu-latest' || needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        if: needs.change-scope.outputs.tutor_required == 'true'
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'
          isolated-venv: 'true'
          cache-isolated-venv: 'true'
          isolated-venv-name: 'tutor-ci-py312'

      - name: Skip tutor lane for unrelated PR diff
        if: needs.change-scope.outputs.tutor_required != 'true'
        run: |
          echo "Tutor Configuration Tests skipped: no tutor-authority changes in this PR."
          echo "Workflow-only CI control-plane changes are enforced by the"
          echo "workflow contract verifiers, not by a full Tutor render."

      - name: Render Tutor environment through canonical wrapper
        if: needs.change-scope.outputs.tutor_required == 'true'
        env:
          TUTOR_ROOT: ${{ github.workspace }}/tutor_env
        run: |
          export TUTOR_ROOT="${{ github.workspace }}/tutor_env"
          ./scripts/infra/tutor-config-save.sh

      - name: Run tutor apply patches test
        if: needs.change-scope.outputs.tutor_required == 'true'
        run: bash tests/tutor/test_tutor_apply.sh

      - name: Run tutor verify patches test
        if: needs.change-scope.outputs.tutor_required == 'true'
        run: bash tests/tutor/test_verify_patches.sh

      - name: Run tutor pre-commit hook test
        if: needs.change-scope.outputs.tutor_required == 'true'
        run: bash tests/tutor/test_pre_commit_hook.sh

      - name: Run tutor idempotency test
        if: needs.change-scope.outputs.tutor_required == 'true'
        env:
          TUTOR_TEST_ASSUME_PATCHED_BASELINE: '1'
        run: bash tests/tutor/test_idempotency.sh

      - name: Run tutor edge cases test
        if: needs.change-scope.outputs.tutor_required == 'true'
        env:
          TUTOR_TEST_ASSUME_PATCHED_BASELINE: '1'
        run: bash tests/tutor/test_edge_cases.sh

      - name: Validate config.example.yml structure
        if: needs.change-scope.outputs.tutor_required == 'true'
        run: python3 scripts/qa/check-config-example-yaml.py

  # ============================================================================
  # Job 3: security-scans
  # TruffleHog (HEAD only), Hadolint on all Dockerfiles, pip-audit.
  # Replaces: security-scan, pip-audit from old ci.yml.
  # ============================================================================
  security-scans:
    name: Security Scans
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # PR merge refs need full ancestry for TruffleHog merge-base resolution

      - name: Prepare local tool cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/bin"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"

      - name: Install TruffleHog
        run: |
          TH_VERSION="3.93.7"
          TH_TARBALL="trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          TH_BASE_URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "${TH_TARBALL}" "${TH_BASE_URL}/${TH_TARBALL}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "trufflehog_checksums.txt" "${TH_BASE_URL}/trufflehog_${TH_VERSION}_checksums.txt"
          grep " ${TH_TARBALL}\$" trufflehog_checksums.txt | sha256sum -c -
          tar xzf "${TH_TARBALL}"
          install -m 0755 trufflehog "$GITHUB_WORKSPACE/.cache/bin/trufflehog"
          rm -f "${TH_TARBALL}" trufflehog trufflehog_checksums.txt
          trufflehog --version

      - name: TruffleHog secret scan (HEAD only, verified only)
        run: |
          BASE_SHA=""
          HEAD_SHA=""
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                BASE_SHA="${{ github.event.before }}"
              fi
              HEAD_SHA="${{ github.sha }}"
              ;;
            workflow_dispatch)
              git fetch --no-tags --prune origin main
              BASE_SHA="$(git merge-base HEAD origin/main || true)"
              HEAD_SHA="$(git rev-parse HEAD)"
              ;;
          esac

          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            trufflehog git "file://$PWD" \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --fail \
              --no-update \
              --github-actions \
              --only-verified
          else
            printf '^\\.git/' > "$RUNNER_TEMP/trufflehog-exclude-paths.txt"
            trufflehog filesystem . \
              --exclude-paths "$RUNNER_TEMP/trufflehog-exclude-paths.txt" \
              --fail \
              --no-update \
              --github-actions \
              --only-verified
          fi

      - name: Install hadolint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HADOLINT_VERSION="2.14.0"
          HADOLINT_BINARY="hadolint-linux-x86_64"
          HADOLINT_REPO="hadolint/hadolint"
          HADOLINT_URL="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/${HADOLINT_BINARY}"
          HADOLINT_SHA_URL="${HADOLINT_URL}.sha256"
          HADOLINT_DOWNLOAD_TIMEOUT="${HADOLINT_DOWNLOAD_TIMEOUT:-120}"
          HADOLINT_CONNECT_TIMEOUT="${HADOLINT_CONNECT_TIMEOUT:-15}"
          HADOLINT_MAX_TIME="${HADOLINT_MAX_TIME:-90}"
          download_hadolint_via_curl() {
            timeout "${HADOLINT_DOWNLOAD_TIMEOUT}" curl --fail --location \
              --retry 5 --retry-all-errors --retry-connrefused \
              --connect-timeout "${HADOLINT_CONNECT_TIMEOUT}" \
              --max-time "${HADOLINT_MAX_TIME}" \
              --silent --show-error \
              --output "${HADOLINT_BINARY}" "${HADOLINT_URL}"
            timeout "${HADOLINT_DOWNLOAD_TIMEOUT}" curl --fail --location \
              --retry 5 --retry-all-errors --retry-connrefused \
              --connect-timeout "${HADOLINT_CONNECT_TIMEOUT}" \
              --max-time "${HADOLINT_MAX_TIME}" \
              --silent --show-error \
              --output "${HADOLINT_BINARY}.sha256" "${HADOLINT_SHA_URL}"
          }
          if [ -n "${GH_TOKEN:-${GITHUB_TOKEN:-}}" ]; then
            if ! GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}" gh release download "v${HADOLINT_VERSION}" \
              --repo "${HADOLINT_REPO}" \
              --pattern "${HADOLINT_BINARY}" \
              --output "${HADOLINT_BINARY}" \
              --clobber; then
              echo "gh release download failed; falling back to curl"
              rm -f "${HADOLINT_BINARY}" "${HADOLINT_BINARY}.sha256"
              download_hadolint_via_curl
            elif ! GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}" gh release download "v${HADOLINT_VERSION}" \
              --repo "${HADOLINT_REPO}" \
              --pattern "${HADOLINT_BINARY}.sha256" \
              --output "${HADOLINT_BINARY}.sha256" \
              --clobber; then
              echo "gh checksum download failed; falling back to curl"
              rm -f "${HADOLINT_BINARY}" "${HADOLINT_BINARY}.sha256"
              download_hadolint_via_curl
            fi
          else
            download_hadolint_via_curl
          fi
          sha256sum -c "${HADOLINT_BINARY}.sha256"
          install -m 0755 "${HADOLINT_BINARY}" "$GITHUB_WORKSPACE/.cache/bin/hadolint"
          rm -f "${HADOLINT_BINARY}" "${HADOLINT_BINARY}.sha256"
          hadolint --version

      - name: Hadolint Dockerfile lint
        run: |
          mapfile -t dockerfiles < <(find . -type f \( -name 'Dockerfile' -o -name '*.Dockerfile' \) | sort)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles found"
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            echo "Linting ${dockerfile}"
            hadolint "${dockerfile}" || true
          done

      - name: Set up Python for pip-audit
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'
          isolated-venv: 'true'
          extra-deps: 'pip-audit'

      - name: Install project deps (optional)
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Run pip-audit (dry-run, informational)
        run: pip-audit --desc --fix --dry-run 2>&1 || true

      - name: Run pip-audit (strict)
        run: |
          # CVE-2026-4539: Pygments ≤2.19.2 ReDoS in AdlLexer (local-only, no fix released).
          # Suppress until upstream releases a patched version.
          pip-audit --desc --ignore-vuln CVE-2026-4539

  # ============================================================================
  # Job 4: test-coverage
  # Python test suite with coverage enforcement. Non-blocking (continue-on-error).
  # Kept exactly as-is from original ci.yml.
  # ============================================================================
  test-coverage:
    name: Python test coverage
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          install-base-deps: 'false'
          extra-deps: 'pytest pytest-cov'

      - name: Install project deps (optional)
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=40 -q
        continue-on-error: true  # Non-blocking until coverage improves

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: .coverage
          retention-days: 3
