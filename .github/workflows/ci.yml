# @covers AC-RS-001, AC-RS-002, AC-RS-003, AC-RS-004
# @spec: repository-structure_spec.md
name: CI

on:
  pull_request:
    branches: [main]
      # Keep CI attached for docs-only and control-plane-only PRs so the
      # required branch-protection contexts still report. The jobs themselves
      # already no-op cleanly via the docs_only scope gate when repo-static
      # validation is not needed.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep only the newest run per ref, including main, so stale pushes do not
  # consume runner capacity while the latest head waits in queue.
  cancel-in-progress: true

jobs:
  change-scope:
    name: Detect docs-only control-plane scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      tutor_required: ${{ steps.scope.outputs.tutor_required }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect docs-only control-plane diff
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "tutor_required=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t CHANGED < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          if [[ "${#CHANGED[@]}" -eq 0 ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "tutor_required=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed_files<<EOF"
            printf '%s\n' "${CHANGED[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          docs_only=true
          tutor_required=false
          for path in "${CHANGED[@]}"; do
            case "$path" in
              docs/*|tools/docs/*|generated/catalogs/*|generated/adr-bundles/*|generated/decision-maps/*|generated/graphs/*|specs/testmaps/README.md|specs/_generated/testmaps/README.md|scripts/qa/build_decision_graph.py|scripts/qa/generate_adr_readme.py|scripts/qa/sync-openedx-audit-pr-status.sh|.github/workflows/docs-compliance.yml|.github/workflows/docs-policy.yml|.github/workflows/codeql.yml|*.md|CLAUDE.md|AGENTS.md|CONTRIBUTING.md|SECURITY.md|LICENSE)
                ;;
              *)
                docs_only=false
                ;;
            esac

            case "$path" in
              .github/actions/setup-python-env/*|\
              .githooks/pre-commit|\
              requirements-tutor.txt|\
              infrastructure/tutor/*|\
              tests/tutor/*|\
              scripts/qa/check-config-example-yaml.py|\
              scripts/qa/verify-tutor-patches.sh)
                tutor_required=true
                ;;
            esac
          done

          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "tutor_required=${tutor_required}" >> "$GITHUB_OUTPUT"

  select-ci-lane:
    name: Select CI lane
    needs: change-scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runner_label: ${{ steps.select.outputs.runner_label }}
      decision: ${{ steps.select.outputs.decision }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Select runner label
        id: select
        uses: Biji-Biji-Initiative/bbi-infrastructure/.github/actions/select-runner-lane@main
        with:
          # Prefer fastlane for CI by default. The selector still falls back to
          # mereka-k8s-runners when fastlane is unavailable or the event is not
          # trusted, so this keeps merge tails short without hard-blocking CI.
          enabled: ${{ vars.CI_FASTLANE_CI_ENABLED || 'true' }}
          # Force trusted CI events onto the dedicated fastlane. The selector's
          # auto status probe is currently falling back even when the fastlane
          # runner exists and is idle, which leaves required Tutor checks stuck
          # behind the generic ARC queue.
          lane_mode: fastlane
          fastlane_label: ${{ vars.CI_FASTLANE_CI_LABEL || 'mereka-lms-vps-fastlane-ci' }}
          routing_policy: lms_ci_prefer_fastlane
          fallback_label: mereka-k8s-runners
          runner_status_token: ${{ secrets.FASTLANE_RUNNER_STATUS_TOKEN }}
          github_app_id: ${{ secrets.GITOPS_GITHUB_APP_ID }}
          github_app_installation_id: ${{ secrets.GITOPS_GITHUB_APP_INSTALLATION_ID }}
          github_app_private_key: ${{ secrets.GITOPS_GITHUB_APP_PRIVATE_KEY }}
          allow_push_main: true
          allow_workflow_dispatch: true
          allow_pull_request: true
          allow_merge_group: true

  # ============================================================================
  # Job 1a-1e: static-validation split graph
  # Runs on every PR and push. Keeps the same overall contracts as the old
  # consolidated Static Validation job, but splits the opaque Phase C script
  # batch into generated shards:
  #   1a. precheck   — setup, manifests, spec/inventory gates
  #   1b. lint       — shellcheck + markdown advisory lint on hosted runners
  #   1c. shards     — generated ci_static_inventory shard manifests in parallel
  #   1d. postchecks — sequential static follow-up checks that do not depend on shards
  #   1e. aggregate  — final branch-protection surface named "Static Validation"
  #
  # The overall surface still replaces 65+ micro-jobs:
  #   spec-lint, generated-docs, design-token-validation, branding-preflight,
  #   monitoring-guardrails, atlas-modulestore-guardrails, tenant-branding-contract,
  #   brand-pack-schema, gitops-image-contract, prod-tag-guard, lint, validate-k8s,
  #   validate-tutor-config, validate-infisical, verify-static, security-scan,
  #   pip-audit, mfe-footer-slot, mfe-route-drift, token-definitions,
  #   plugin-slot-wiring, mfe-footer-slot-migration, mfe-selector-hardening,
  #   mfe-selector-hardening-pr, plugin-slot-migration, contrast-compliance,
  #   custom-app-drift, design-token-usage, frontend-version-truth,
  #   token-integrity-routing, legacy-ecommerce-guard, accessibility-gates,
  #   mfe-first-policy, analytics-key-guard, branding-token-integrity,
  #   token-drift, footer-variant-matrix, no-dom-overrides, migration-lock,
  #   tenant-branding-qa, enterprise-ui-review, tenant-branding-matrix,
  #   footer-parity, mfe-routing-parity, a11y-contrast-focus,
  #   a11y-authenticated-routes, performance-budget, copy-terminology,
  #   visual-smoke-baseline, tenant-ui-smoke, footer-slot-only,
  #   tenant-isolation-evidence, a11y-tenant-branding, visual-parity-checkpoints,
  #   ui-ux-hardening-bundle, multitenant-brand-platform,
  #   tenant-footer-variant-lane, mfe-analytics-plugin-parity,
  #   module-surface-validation, release-deployment-choreography,
  #   postmerge-governance-closure, analytics-undefined-regression,
  #   analytics-key-elimination, legacy-footer-removal, selector-to-slot-migration,
  #   multi-tenant-branding-ops, analytics-hardening, tenant-config-handoff,
  #   translation-validation, and verify-specs.yml fast-verification.
  # ============================================================================
  static-validation-precheck:
    name: Static Validation Precheck
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'

      - name: Prepare local tool cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/bin"
          mkdir -p "$GITHUB_WORKSPACE/.cache/kubeconform-schemas"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"

      - name: Cache kubeconform
        id: cache-kubeconform
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: .cache/bin/kubeconform
          key: kubeconform-v0.6.4-linux-amd64

      - name: Cache kubeconform schemas
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: .cache/kubeconform-schemas
          key: kubeconform-schemas-v1-${{ hashFiles('deploy/k8s/**/*.yml', 'deploy/k8s/**/*.yaml') }}
          restore-keys: |
            kubeconform-schemas-v1-

      - name: Install kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: |
          EXPECTED_SHA="2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07"
          TARBALL="kubeconform-linux-amd64.tar.gz"
          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download/v0.6.4/${TARBALL}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output "${TARBALL}" "${KUBECONFORM_URL}"
          echo "${EXPECTED_SHA}  ${TARBALL}" | sha256sum -c -
          tar xzf "${TARBALL}"
          install -m 0755 kubeconform "$GITHUB_WORKSPACE/.cache/bin/kubeconform"
          rm "${TARBALL}"
          kubeconform -v

      - name: Install kubectl
        run: |
          if ! command -v kubectl &>/dev/null; then
            KUBECTL_VERSION="v1.32.5"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            install -m 0755 kubectl "$GITHUB_WORKSPACE/.cache/bin/kubectl"
            rm kubectl
          fi
          kubectl version --client

      - name: Install ripgrep
        run: |
          if ! command -v rg &>/dev/null; then
            RG_VERSION="15.1.0"
            RG_TARBALL="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            RG_BASE_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}" "${RG_BASE_URL}/${RG_TARBALL}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}.sha256" "${RG_BASE_URL}/${RG_TARBALL}.sha256"
            sha256sum -c "${RG_TARBALL}.sha256"
            tar xzf "${RG_TARBALL}"
            install -m 0755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" \
              "$GITHUB_WORKSPACE/.cache/bin/rg"
            rm -rf "${RG_TARBALL}" "${RG_TARBALL}.sha256" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          fi

      - name: Syntax check all shell scripts
        run: |
          find scripts/ -name '*.sh' -type f | xargs -P8 bash -n
          bash -n scripts/qa/verify-multisite-ux-consistency.sh
          bash -n infrastructure/tutor/apply-patches.sh
          echo "All shell script syntax checks passed"

      - name: Lint Python files
        run: ruff check scripts/ services/

      - name: Lint YAML files
        run: yamllint -c .yamllint.yml infrastructure/ deploy/

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail

          mapfile -t manifests < <(
            find deploy/k8s \( -name '*.yml' -o -name '*.yaml' \) | \
              grep -v '/patches/' | \
              grep -v '/config/' | \
              grep -v '/settings/' | \
              grep -v 'helm-values' | \
              grep -v 'registry\.yaml' | \
              grep -v 'SECRET_CLASSIFICATION'
          )

          if [[ ${#manifests[@]} -eq 0 ]]; then
            echo "No Kubernetes manifests found for kubeconform validation"
            exit 0
          fi

          validate_manifests() {
            local log_file="$1"
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              -cache "$GITHUB_WORKSPACE/.cache/kubeconform-schemas" \
              "${manifests[@]}" 2>&1 | tee "$log_file"
            return "${PIPESTATUS[0]}"
          }

          log_file="$(mktemp)"
          attempt=1
          max_attempts=3

          until validate_manifests "$log_file"; do
            exit_code=$?
            if ! grep -Eq "(error while|failed) downloading schema" "$log_file"; then
              exit "$exit_code"
            fi

            if (( attempt >= max_attempts )); then
              echo "kubeconform schema download kept failing after ${attempt} attempts"
              exit "$exit_code"
            fi

            sleep_seconds=$(( attempt * 15 ))
            echo "Transient kubeconform schema download failure detected; retrying in ${sleep_seconds}s (attempt $(( attempt + 1 ))/${max_attempts})"
            rm -f "$log_file"
            log_file="$(mktemp)"
            sleep "$sleep_seconds"
            ((attempt++))
          done

      - name: Run spec integrity gates
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            RUN_INFO_CHECKS=0 bash scripts/qa/run-spec-integrity-gates.sh
          else
            bash scripts/qa/run-spec-integrity-gates.sh
          fi

      - name: Spec coverage report
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ \
            --scan-dirs scripts/ tests/ deploy/ infrastructure/ services/ \
            --manual-file specs/plans/manual_verifications.yaml \
            --repo-root . \
            --format markdown --output var/spec-coverage.md --fail-under 80

      - name: Upload spec coverage artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spec-coverage
          path: var/spec-coverage.md
          retention-days: 3

      - name: Spec coverage report for PR
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ \
            --scan-dirs scripts/ tests/ deploy/ infrastructure/ services/ \
            --manual-file specs/plans/manual_verifications.yaml \
            --repo-root . \
            --format markdown \
            --output var/spec-coverage-pr.md \
            --fail-under 80

      - name: Upload PR coverage artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spec-coverage-pr
          path: var/spec-coverage-pr.md
          retention-days: 3

      - name: Verify generated surfaces are current
        run: bash scripts/qa/verify-generated-surfaces.sh

      - name: Verify CI cache policy
        run: bash scripts/qa/verify-ci-cache-policy.sh

  static-validation-lint:
    name: Static Validation Lint
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Prepare local tool path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint shell scripts (shellcheck)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v shellcheck &>/dev/null; then
            SC_VERSION="v0.10.0"
            SC_TARBALL="shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
            SC_URL="https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/${SC_TARBALL}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${SC_TARBALL}" "${SC_URL}"
            if command -v xz &>/dev/null; then
              tar xJf "${SC_TARBALL}"
            else
              python3 -c "
          import lzma, tarfile, io, sys
          with open('${SC_TARBALL}', 'rb') as f:
              decompressed = lzma.decompress(f.read())
          with tarfile.open(fileobj=io.BytesIO(decompressed)) as t:
              t.extractall()
          "
            fi
            install -m 0755 "shellcheck-${SC_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"
            rm -rf "${SC_TARBALL}" "shellcheck-${SC_VERSION}"
          fi

          # On pull requests, lint only the changed shell scripts under
          # scripts/. Keep full-tree shellcheck on mainline pushes, merge groups,
          # and manual runs so the authoritative rails still cover the entire
          # shell surface.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            mapfile -t shell_files < <(
              git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
                | awk '/^scripts\/.*\.sh$/ { print }' \
                | while read -r f; do [ -f "$f" ] && echo "$f"; done
            )

            if [[ "${#shell_files[@]}" -eq 0 ]]; then
              echo "No shell script changes under scripts/ in PR; skipping shellcheck"
              exit 0
            fi

            printf 'Linting changed shell scripts:\n'
            printf ' - %s\n' "${shell_files[@]}"
            shellcheck --severity=error "${shell_files[@]}"
            exit 0
          fi

          mapfile -d '' -t shell_files < <(find scripts/ -name '*.sh' -type f -print0)
          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo "No shell scripts found under scripts/; skipping shellcheck"
            exit 0
          fi

          shellcheck_jobs="$(
            getconf _NPROCESSORS_ONLN 2>/dev/null \
              || nproc 2>/dev/null \
              || echo 4
          )"
          printf 'Running shellcheck across %s files with %s parallel workers\n' "${#shell_files[@]}" "$shellcheck_jobs"
          printf '%s\0' "${shell_files[@]}" \
            | xargs -0 -n 32 -P "$shellcheck_jobs" shellcheck --severity=error

      - name: Markdown linting
        shell: bash
        run: |
          set -euo pipefail

          # Markdown lint remains advisory in this lane. For pull requests, lint
          # only the changed docs/spec markdown files so mixed code PRs do not
          # pay full-tree docs lint cost. Keep full-tree coverage on mainline
          # pushes, merge groups, and manual runs.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            mapfile -t markdown_files < <(
              git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
                | awk '/^(docs|specs)\/.*\.md$/ && $0 !~ /^docs\/archive\// { print }'
            )

            if [[ "${#markdown_files[@]}" -eq 0 ]]; then
              echo "No docs/spec markdown changes in PR; skipping advisory markdown lint"
              exit 0
            fi

            printf 'Linting changed markdown files:\n'
            printf ' - %s\n' "${markdown_files[@]}"
            npx --yes markdownlint-cli "${markdown_files[@]}" || true
            exit 0
          fi

          npx --yes markdownlint-cli docs/ specs/ --ignore docs/archive/ || true

  static-validation-shards:
    name: Static Validation Scripts (${{ matrix.shard.key }})
    needs:
      - change-scope
      - select-ci-lane
    runs-on: ${{ needs.select-ci-lane.outputs.runner_label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - key: shard-01
            file: .github/ci-scripts-static-shard-01.txt
          - key: shard-02
            file: .github/ci-scripts-static-shard-02.txt
          - key: shard-03
            file: .github/ci-scripts-static-shard-03.txt

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'

      - name: Prepare local tool cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/bin"
          echo "$GITHUB_WORKSPACE/.cache/bin" >> "$GITHUB_PATH"

      - name: Install kubectl
        run: |
          if ! command -v kubectl &>/dev/null; then
            KUBECTL_VERSION="v1.32.5"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            install -m 0755 kubectl "$GITHUB_WORKSPACE/.cache/bin/kubectl"
            rm kubectl
          fi
          kubectl version --client

      - name: Install ripgrep
        run: |
          if ! command -v rg &>/dev/null; then
            RG_VERSION="15.1.0"
            RG_TARBALL="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            RG_BASE_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}" "${RG_BASE_URL}/${RG_TARBALL}"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
              --output "${RG_TARBALL}.sha256" "${RG_BASE_URL}/${RG_TARBALL}.sha256"
            sha256sum -c "${RG_TARBALL}.sha256"
            tar xzf "${RG_TARBALL}"
            install -m 0755 "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" \
              "$GITHUB_WORKSPACE/.cache/bin/rg"
            rm -rf "${RG_TARBALL}" "${RG_TARBALL}.sha256" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          fi

      - name: Run static verification scripts
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            export LINT_REPO_CONVENTIONS_SCOPE=changed
            export LINT_REPO_CONVENTIONS_BASE_SHA="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            export LINT_REPO_CONVENTIONS_HEAD_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            export CI_CHANGED_FILES="$(git diff --name-only "$LINT_REPO_CONVENTIONS_BASE_SHA" "$LINT_REPO_CONVENTIONS_HEAD_SHA")"
            export VERIFY_SECRETS_ISOLATION_SCOPE=changed
            export VERIFY_SECRETS_ISOLATION_CHANGED_FILES="$CI_CHANGED_FILES"
            export TEST_BUILD_VALIDATOR_DRIFT_REVIEW_PACKET_SCOPE=changed
            export TEST_BUILD_VALIDATOR_DRIFT_REVIEW_PACKET_CHANGED_FILES="$CI_CHANGED_FILES"
            export TEST_VERIFY_BUILD_WORKFLOW_CONTRACT_SCOPE=changed
            export TEST_VERIFY_BUILD_WORKFLOW_CONTRACT_CHANGED_FILES="$CI_CHANGED_FILES"
            export VALIDATE_REGISTRY_SCOPE=changed
            export VALIDATE_REGISTRY_CHANGED_FILES="$CI_CHANGED_FILES"
            export VERIFY_NETWORK_POLICIES_SCOPE=changed
            export VERIFY_NETWORK_POLICIES_CHANGED_FILES="$CI_CHANGED_FILES"
            export VERIFY_MANIFEST_INTEGRITY_SCOPE=changed
            export VERIFY_MANIFEST_INTEGRITY_CHANGED_FILES="$CI_CHANGED_FILES"
            export VERIFY_CI_SCRIPT_LIST_SCOPE=changed
            export VERIFY_CI_SCRIPT_LIST_CHANGED_FILES="$CI_CHANGED_FILES"
            export VERIFY_VERIFICATION_CATALOG_SCOPE=changed
            export VERIFY_VERIFICATION_CATALOG_CHANGED_FILES="$CI_CHANGED_FILES"
            export TEST_VERIFY_GENERATED_SURFACES_SCOPE=changed
