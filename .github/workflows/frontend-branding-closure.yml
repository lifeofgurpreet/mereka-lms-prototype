name: Frontend Branding Closure

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      cross_browser_matrix:
        description: "Run cross-browser matrix (chromium/firefox/mobile, plus webkit probe fallback)"
        required: true
        default: true
        type: boolean
      require_runtime_theme:
        description: "Require runtime theme mode (/theme/*.min.css) for smoke and performance checks"
        required: true
        default: false
        type: boolean
      require_branding_markers:
        description: "Require slot-rendered Mereka marker classes in runtime DOM smoke checks"
        required: true
        default: true
        type: boolean
      require_webkit:
        description: "Fail closure run if WebKit cannot install/launch in cross-browser gate"
        required: true
        default: false
        type: boolean
      run_performance_gate:
        description: "Run frontend performance spot-check gate"
        required: true
        default: true
        type: boolean
      run_paragon_budget_gate:
        description: "Run Paragon runtime theme CSS budget gate"
        required: true
        default: true
        type: boolean
      run_certificate_branding_gate:
        description: "Run certificate branding gate"
        required: true
        default: true
        type: boolean
      run_email_template_gate:
        description: "Run transactional/marketing email branding gate"
        required: true
        default: true
        type: boolean
      run_selector_hardening_gate:
        description: "Run MFE selector hardening regression gate"
        required: true
        default: true
        type: boolean
      run_runtime_theme_contract_gate:
        description: "Run runtime theme contract gate (verify-paragon-runtime)"
        required: true
        default: true
        type: boolean
      run_live_dom_audit_gate:
        description: "Run runtime DOM selector audit gate for authn surface"
        required: true
        default: false
        type: boolean
      live_dom_audit_profile:
        description: "Preset profile for live DOM selector audit defaults"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - phase7_strict
          - phase7_full
      run_npm_start_smoke_gate:
        description: "Run npm-start smoke + screenshot gate (requires reachable base URL)"
        required: true
        default: true
        type: boolean
      run_screenshot_gate:
        description: "Capture public branding screenshots as closure evidence"
        required: true
        default: false
        type: boolean
      screenshot_scope:
        description: "Screenshot surface scope when screenshot gate is enabled"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - mfe-only
      npm_start_base_url:
        description: "Base URL for npm-start smoke (empty = auto by env)"
        required: false
        default: ""
        type: string
      npm_start_project:
        description: "Playwright project for npm-start smoke"
        required: false
        default: "chromium"
        type: string
      live_dom_audit_project:
        description: "Playwright project for live DOM selector audit"
        required: false
        default: "chromium"
        type: string
      live_dom_audit_min_hits:
        description: "Minimum tracked selector hits for live DOM selector audit"
        required: false
        default: "3"
        type: string
      live_dom_audit_routes:
        description: "Optional comma-separated route paths for live DOM selector audit"
        required: false
        default: ""
        type: string
      live_dom_audit_selectors:
        description: "Optional comma-separated CSS selectors for live DOM selector audit"
        required: false
        default: ""
        type: string
      live_dom_audit_min_custom_hits:
        description: "Minimum custom selectors that must match across audited routes"
        required: false
        default: "0"
        type: string
      selector_audit_path:
        description: "Route path used for runtime selector DOM audit"
        required: false
        default: "/authn/login"
        type: string
      runtime_theme_url:
        description: "Override runtime theme origin (empty = auto by env)"
        required: false
        default: ""
        type: string
      runtime_theme_timeout_seconds:
        description: "Timeout seconds for runtime theme contract gate"
        required: false
        default: "300"
        type: string
      learning_path:
        description: "Optional learning route path for smoke checks"
        required: false
        default: "/learning"
        type: string
      a11y_mode:
        description: "Accessibility scan mode"
        required: true
        default: "hybrid"
        type: choice
        options:
          - offline
          - online
          - hybrid
      a11y_target_url:
        description: "Accessibility scan origin (empty = auto apps domain by env)"
        required: false
        default: ""
        type: string
      a11y_routes:
        description: "Optional CSV routes for accessibility online scan"
        required: false
        default: ""
        type: string
      a11y_allow_missing_reports:
        description: "Allow missing axe reports for some routes"
        required: true
        default: false
        type: boolean

jobs:
  frontend-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Run frontend closure pipeline
        shell: bash
        run: |
          set -euo pipefail

          TARGET_ENV="${{ inputs.target_environment || 'prod' }}"
          CROSS_BROWSER_MATRIX="${{ inputs.cross_browser_matrix || 'true' }}"
          REQUIRE_RUNTIME_THEME="${{ inputs.require_runtime_theme || 'false' }}"
          REQUIRE_BRANDING_MARKERS="${{ inputs.require_branding_markers || 'true' }}"
          REQUIRE_WEBKIT="${{ inputs.require_webkit || 'false' }}"
          RUN_PERF="${{ inputs.run_performance_gate || 'true' }}"
          RUN_PARAGON_BUDGET="${{ inputs.run_paragon_budget_gate || 'true' }}"
          RUN_CERTIFICATE_BRANDING="${{ inputs.run_certificate_branding_gate || 'true' }}"
          RUN_EMAIL_TEMPLATE="${{ inputs.run_email_template_gate || 'true' }}"
          RUN_SELECTOR_HARDENING="${{ inputs.run_selector_hardening_gate || 'true' }}"
          RUN_RUNTIME_THEME_CONTRACT="${{ inputs.run_runtime_theme_contract_gate || 'true' }}"
          RUN_LIVE_DOM_AUDIT="${{ inputs.run_live_dom_audit_gate || 'false' }}"
          LIVE_DOM_AUDIT_PROFILE="${{ inputs.live_dom_audit_profile || 'standard' }}"
          RUN_NPM_START_SMOKE="${{ inputs.run_npm_start_smoke_gate || 'false' }}"
          RUN_SCREENSHOTS="${{ inputs.run_screenshot_gate || 'false' }}"
          SCREENSHOT_SCOPE="${{ inputs.screenshot_scope || 'full' }}"
          STRICT_WEBKIT=$([[ "$REQUIRE_WEBKIT" == "true" ]] && echo 1 || echo 0)
          NPM_START_BASE_URL="${{ inputs.npm_start_base_url || '' }}"
          NPM_START_PROJECT="${{ inputs.npm_start_project || 'chromium' }}"
          LIVE_DOM_AUDIT_PROJECT="${{ inputs.live_dom_audit_project || 'chromium' }}"
          LIVE_DOM_AUDIT_MIN_HITS="${{ inputs.live_dom_audit_min_hits || '3' }}"
          LIVE_DOM_AUDIT_ROUTES="${{ inputs.live_dom_audit_routes || '' }}"
          LIVE_DOM_AUDIT_SELECTORS="${{ inputs.live_dom_audit_selectors || '' }}"
          LIVE_DOM_AUDIT_MIN_CUSTOM_HITS="${{ inputs.live_dom_audit_min_custom_hits || '0' }}"
          SELECTOR_AUDIT_PATH="${{ inputs.selector_audit_path || '/authn/login' }}"
          RUNTIME_THEME_URL="${{ inputs.runtime_theme_url || '' }}"
          RUNTIME_THEME_TIMEOUT_SECONDS="${{ inputs.runtime_theme_timeout_seconds || '300' }}"
          LEARNING_PATH="${{ inputs.learning_path || '/learning' }}"
          A11Y_MODE="${{ inputs.a11y_mode || 'hybrid' }}"
          A11Y_TARGET_URL="${{ inputs.a11y_target_url || '' }}"
          A11Y_ROUTES="${{ inputs.a11y_routes || '' }}"
          A11Y_ALLOW_MISSING_REPORTS="${{ inputs.a11y_allow_missing_reports || 'false' }}"

          args=(--env "$TARGET_ENV" --frontend-only)
          if [[ "$CROSS_BROWSER_MATRIX" == "true" ]]; then
            args+=(--cross-browser)
          fi
          if [[ "$REQUIRE_RUNTIME_THEME" == "true" ]]; then
            args+=(--require-runtime-theme)
          fi

          RUN_BASELINE_GATES=0 \
          RUN_CROSS_BROWSER=1 \
          RUN_A11Y=1 \
          RUN_SCREENSHOTS=0 \
          RUN_PERFORMANCE=$([[ "$RUN_PERF" == "true" ]] && echo 1 || echo 0) \
          RUN_PARAGON_THEME_BUDGET=$([[ "$RUN_PARAGON_BUDGET" == "true" ]] && echo 1 || echo 0) \
          RUN_CERTIFICATE_BRANDING=$([[ "$RUN_CERTIFICATE_BRANDING" == "true" ]] && echo 1 || echo 0) \
          RUN_EMAIL_TEMPLATE_BRANDING=$([[ "$RUN_EMAIL_TEMPLATE" == "true" ]] && echo 1 || echo 0) \
          RUN_SELECTOR_HARDENING=$([[ "$RUN_SELECTOR_HARDENING" == "true" ]] && echo 1 || echo 0) \
          RUN_RUNTIME_THEME_CONTRACT=$([[ "$RUN_RUNTIME_THEME_CONTRACT" == "true" ]] && echo 1 || echo 0) \
          RUN_MFE_LIVE_DOM_AUDIT=$([[ "$RUN_LIVE_DOM_AUDIT" == "true" ]] && echo 1 || echo 0) \
          RUN_NPM_START_SMOKE=$([[ "$RUN_NPM_START_SMOKE" == "true" ]] && echo 1 || echo 0) \
          STRICT_WEBKIT="$STRICT_WEBKIT" \
          REQUIRE_BRANDING_MARKERS=$([[ "$REQUIRE_BRANDING_MARKERS" == "true" ]] && echo 1 || echo 0) \
          RUN_SCREENSHOTS=$([[ "$RUN_SCREENSHOTS" == "true" ]] && echo 1 || echo 0) \
          SCREENSHOT_SCOPE="$SCREENSHOT_SCOPE" \
          NPM_START_BASE_URL="$NPM_START_BASE_URL" \
          NPM_START_PROJECT="$NPM_START_PROJECT" \
          LIVE_DOM_AUDIT_PROFILE="$LIVE_DOM_AUDIT_PROFILE" \
          LIVE_DOM_AUDIT_PROJECT="$LIVE_DOM_AUDIT_PROJECT" \
          LIVE_DOM_AUDIT_MIN_HITS="$LIVE_DOM_AUDIT_MIN_HITS" \
          LIVE_DOM_AUDIT_ROUTES="$LIVE_DOM_AUDIT_ROUTES" \
          LIVE_DOM_AUDIT_SELECTORS="$LIVE_DOM_AUDIT_SELECTORS" \
          LIVE_DOM_AUDIT_MIN_CUSTOM_HITS="$LIVE_DOM_AUDIT_MIN_CUSTOM_HITS" \
          SELECTOR_AUDIT_PATH="$SELECTOR_AUDIT_PATH" \
          RUNTIME_THEME_URL="$RUNTIME_THEME_URL" \
          RUNTIME_THEME_TIMEOUT_SECONDS="$RUNTIME_THEME_TIMEOUT_SECONDS" \
          LEARNING_PATH="$LEARNING_PATH" \
          A11Y_MODE="$A11Y_MODE" \
          A11Y_TARGET="$A11Y_TARGET_URL" \
          A11Y_ROUTES="$A11Y_ROUTES" \
          A11Y_ALLOW_MISSING_REPORTS=$([[ "$A11Y_ALLOW_MISSING_REPORTS" == "true" ]] && echo 1 || echo 0) \
          ./scripts/qa/run-branding-evidence-pipeline.sh "${args[@]}"

      - name: Summarize closure results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(ls -1dt var/evidence/branding/* 2>/dev/null | head -1 || true)"
          {
            echo "## Frontend Branding Closure"
            echo
            echo "- Environment: \`${{ inputs.target_environment || 'prod' }}\`"
            echo "- Cross-browser matrix: \`${{ inputs.cross_browser_matrix || 'true' }}\`"
            echo "- Require runtime theme mode: \`${{ inputs.require_runtime_theme || 'false' }}\`"
            echo "- Require branding markers: \`${{ inputs.require_branding_markers || 'true' }}\`"
            echo "- Require WebKit availability: \`${{ inputs.require_webkit || 'false' }}\`"
            echo "- Performance gate: \`${{ inputs.run_performance_gate || 'true' }}\`"
            echo "- Paragon budget gate: \`${{ inputs.run_paragon_budget_gate || 'true' }}\`"
            echo "- Certificate branding gate: \`${{ inputs.run_certificate_branding_gate || 'true' }}\`"
            echo "- Email template gate: \`${{ inputs.run_email_template_gate || 'true' }}\`"
            echo "- Selector hardening gate: \`${{ inputs.run_selector_hardening_gate || 'true' }}\`"
            echo "- Runtime theme contract gate: \`${{ inputs.run_runtime_theme_contract_gate || 'true' }}\`"
            echo "- Live DOM selector audit gate: \`${{ inputs.run_live_dom_audit_gate || 'false' }}\`"
            echo "- Live DOM audit profile: \`${{ inputs.live_dom_audit_profile || 'standard' }}\`"
            echo "- npm-start smoke gate: \`${{ inputs.run_npm_start_smoke_gate || 'false' }}\`"
            echo "- Screenshot gate: \`${{ inputs.run_screenshot_gate || 'false' }}\`"
            echo "- Screenshot scope: \`${{ inputs.screenshot_scope || 'full' }}\`"
            echo "- npm-start base URL: \`${{ inputs.npm_start_base_url || '(auto by env)' }}\`"
            echo "- npm-start project: \`${{ inputs.npm_start_project || 'chromium' }}\`"
            echo "- Live DOM audit project: \`${{ inputs.live_dom_audit_project || 'chromium' }}\`"
            echo "- Live DOM minimum selector hits: \`${{ inputs.live_dom_audit_min_hits || '3' }}\`"
            echo "- Live DOM audit routes: \`${{ inputs.live_dom_audit_routes || '(selector_audit_path only)' }}\`"
            echo "- Live DOM custom selectors: \`${{ inputs.live_dom_audit_selectors || '(none)' }}\`"
            echo "- Live DOM minimum custom selector hits: \`${{ inputs.live_dom_audit_min_custom_hits || '0' }}\`"
            echo "- Live DOM audit path: \`${{ inputs.selector_audit_path || '/authn/login' }}\`"
            echo "- Runtime theme URL: \`${{ inputs.runtime_theme_url || '(auto by env)' }}\`"
            echo "- Runtime theme timeout: \`${{ inputs.runtime_theme_timeout_seconds || '300' }}\`"
            echo "- Learning path: \`${{ inputs.learning_path || '/learning' }}\`"
            echo "- A11y mode: \`${{ inputs.a11y_mode || 'hybrid' }}\`"
            echo "- A11y target URL: \`${{ inputs.a11y_target_url || '(auto apps by env)' }}\`"
            echo "- A11y routes: \`${{ inputs.a11y_routes || '(verifier defaults)' }}\`"
            echo "- A11y allow missing reports: \`${{ inputs.a11y_allow_missing_reports || 'false' }}\`"
            if [[ -n "$LATEST" ]]; then
              echo "- Evidence directory: \`$LATEST\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closure artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: frontend-branding-closure-artifacts
          path: |
            var/evidence/branding/**
            var/qa/cross-browser-branding-smoke-*.log
            var/e2e-report/**
            var/e2e-artifacts/**
          if-no-files-found: warn
