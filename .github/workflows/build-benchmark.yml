# Build Benchmark — Controlled performance measurement for the Build Authority sprint
#
# Epic: mereka-lms-jj97   Bead: jj97.14
# RFC:  docs/rfcs/RFC-BUILD-AUTHORITY-001.md
# Spec: specs/build-authority-deterministic-builds_spec.md
# Taxonomy: docs/ops/ci-cd/BENCHMARK_CLASSES.md
#
# =============================================================================
# USAGE (manual dispatch)
# =============================================================================
#
#   gh workflow run build-benchmark.yml \
#     -f runner_class=fastlane \
#     -f benchmark_class=registry-warm \
#     -f image_family=openedx
#
# OR via GitHub Actions UI → Actions → "Build Benchmark" → Run workflow.
#
# =============================================================================
# WHAT EACH benchmark_class CONTROLS
# =============================================================================
#
# true-cold
#   Executes: docker buildx prune -af + rm builder state + CACHE_FROM_ARG=""
#   This suppresses L1 (local) cache and the shared registry ref from cache-from,
#   so BuildKit starts with zero layer imports from any shared authority.
#   LIMITATION: Perfect isolation is not possible without changing docker-bake.hcl
#   (PR 2 territory). If the Dockerfile base image is cached in the Docker daemon
#   image store, it may still be pulled locally. True-cold guarantees no shared
#   registry cache is consulted; it does NOT guarantee a completely cold Docker
#   daemon layer store on a persistent VPS runner.
#
# registry-warm
#   Executes: docker buildx prune -af (wipes L1 only), then build with
#   CACHE_FROM_ARG pointing at the shared GHCR registry ref.
#   Prerequisite: the registry cache must be populated by at least one
#   trusted main build (PR 2). If the cache ref is absent (404), this run
#   degrades to effectively true-cold — a warning is emitted in prepare-conditions.
#
# local-hot
#   No cache wipe. Relies on persistent runner state (fastlane VPS daemon or
#   ARC arc-docker-cache PVC). A warm-up build is run first (discarded timing),
#   then the measured build is recorded. Local-hot timings are best-case.
#   DO NOT use local-hot as the steady-state SLO — see BENCHMARK_CLASSES.md §Anti-uses.
#
# scan-only
#   Skips the Docker build entirely. Pulls the latest image digest from GHCR
#   and runs only: SBOM (syft) + vulnerability scan (Trivy).
#   ci_build_duration_seconds is absent/zero in this class by definition.
#
# =============================================================================
# WHERE RESULTS LAND
# =============================================================================
#
# Each run uploads: benchmark-results/benchmark_metadata.json
#   { run_id, benchmark_class, runner_class, image_family,
#     build_start_utc, build_end_utc, build_duration_seconds,
#     scan_start_utc, scan_end_utc, scan_duration_seconds,
#     total_duration_seconds, cache_from_arg,
#     cache_evidence (registry ref or "suppressed"),
#     workflow_run_url }
#
# The receiver (ci-metrics-receiver, bead jj97.2) consumes the GitHub
# webhook workflow_run event for this workflow. benchmark_class is NOT
# emitted as a Prometheus label — it is written to benchmark_metadata.json
# as an annotation so the receiver can group runs. Classification (warm/cold)
# is ALWAYS derived from ci_cache_source_found + ci_layer_reuse_ratio in
# Prometheus recording rules (RFC red line #4).
#
# A GitHub Step Summary table is also written showing:
#   benchmark entry | measured time | expected band (BENCHMARK_CLASSES.md) | result
#
# =============================================================================
# PERMISSIONS
# =============================================================================
#
# packages: read   — benchmark reads the shared GHCR cache; it MUST NOT write.
# contents: read   — checkout only.
# No cache-to is set anywhere in this workflow (red line RL-5 compliance).

name: Build Benchmark

# ----------------------------------------------------------------------------
# Permissions — read-only: benchmarks must not pollute the shared cache (RL-5)
# ----------------------------------------------------------------------------
permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      runner_class:
        description: Runner class to test
        required: true
        default: fastlane
        type: choice
        options:
          - fastlane
          - arc-heavy
      benchmark_class:
        description: Cache state class to enforce
        required: true
        default: registry-warm
        type: choice
        options:
          - true-cold
          - registry-warm
          - local-hot
          - scan-only
      image_family:
        description: Image to build
        required: true
        default: openedx
        type: choice
        options:
          - openedx
          - mfe
          - both

  schedule:
    # Weekly trend baseline — representative subset only (see §Schedule).
    # Full matrix (16 combos) is never run automatically; true-cold is on-demand.
    # Four runs: ~registry-warm × fastlane × openedx, registry-warm × arc-heavy × openedx,
    #            registry-warm × fastlane × mfe, scan-only × fastlane × openedx
    # Estimated weekly cost: 4 runs × ~10 min avg ≈ 40 runner-minutes.
    #
    # The schedule always picks one fixed set of parameters per cron entry below.
    # Manual workflow_dispatch can run any combination on demand.
    - cron: '0 6 * * 1'   # Monday 06:00 UTC — low-traffic window

concurrency:
  # Prevent concurrent benchmark runs of the same (class × runner × family) triple.
  # On schedule, all four weekly runs are distinct combos so they can run in parallel.
  group: >-
    build-benchmark-${{
      github.event.inputs.benchmark_class || 'registry-warm'
    }}-${{
      github.event.inputs.runner_class || 'fastlane'
    }}-${{
      github.event.inputs.image_family || 'openedx'
    }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/biji-biji-initiative/mereka-lms
  # Shared cache refs — populated by trusted main builds (PR 2 prerequisite).
  # These are read-only in this workflow.
  OPENEDX_CACHE_REF: ghcr.io/biji-biji-initiative/mereka-lms/cache/openedx:main-amd64
  MFE_CACHE_REF: ghcr.io/biji-biji-initiative/mereka-lms/cache/mfe:main-amd64

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Resolve runner and derive effective inputs for this run
  # --------------------------------------------------------------------------
  resolve-benchmark-inputs:
    name: Resolve Benchmark Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner_class: ${{ steps.inputs.outputs.runner_class }}
      benchmark_class: ${{ steps.inputs.outputs.benchmark_class }}
      image_family: ${{ steps.inputs.outputs.image_family }}
      build_openedx: ${{ steps.inputs.outputs.build_openedx }}
      build_mfe: ${{ steps.inputs.outputs.build_mfe }}
      is_scan_only: ${{ steps.inputs.outputs.is_scan_only }}
    steps:
      - name: Derive effective benchmark inputs
        id: inputs
        env:
          # schedule runs always use the default matrix entry:
          #   registry-warm × fastlane × openedx
          # Manual dispatch uses the provided inputs.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUNNER_CLASS: ${{ github.event.inputs.runner_class }}
          INPUT_BENCHMARK_CLASS: ${{ github.event.inputs.benchmark_class }}
          INPUT_IMAGE_FAMILY: ${{ github.event.inputs.image_family }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            # Weekly cron always measures the primary steady-state combo.
            # For the full 4-run weekly matrix, trigger each combo via
            # separate cron entries or gh workflow run calls in an ops script.
            runner_class="fastlane"
            benchmark_class="registry-warm"
            image_family="openedx"
          else
            runner_class="${INPUT_RUNNER_CLASS:-fastlane}"
            benchmark_class="${INPUT_BENCHMARK_CLASS:-registry-warm}"
            image_family="${INPUT_IMAGE_FAMILY:-openedx}"
          fi

          build_openedx="false"
          build_mfe="false"
          is_scan_only="false"

          if [[ "$benchmark_class" == "scan-only" ]]; then
            is_scan_only="true"
            # scan-only pulls whichever family was requested
            [[ "$image_family" == "openedx" || "$image_family" == "both" ]] && build_openedx="true"
            [[ "$image_family" == "mfe"     || "$image_family" == "both" ]] && build_mfe="true"
          else
            [[ "$image_family" == "openedx" || "$image_family" == "both" ]] && build_openedx="true"
            [[ "$image_family" == "mfe"     || "$image_family" == "both" ]] && build_mfe="true"
          fi

          {
            echo "runner_class=${runner_class}"
            echo "benchmark_class=${benchmark_class}"
            echo "image_family=${image_family}"
            echo "build_openedx=${build_openedx}"
            echo "build_mfe=${build_mfe}"
            echo "is_scan_only=${is_scan_only}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Benchmark Run Parameters"
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| runner_class | \`${runner_class}\` |"
            echo "| benchmark_class | \`${benchmark_class}\` |"
            echo "| image_family | \`${image_family}\` |"
            echo "| is_scan_only | \`${is_scan_only}\` |"
            echo "| triggered_by | \`${EVENT_NAME}\` |"
            echo ""
            echo "> benchmark_class is an input constraint (pre-condition), NOT a Prometheus label."
            echo "> Classification is derived from ci_cache_source_found + ci_layer_reuse_ratio"
            echo "> in Prometheus recording rules (RFC red line #4 / BENCHMARK_CLASSES.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Job 2: Select runner via the existing composite action
  # --------------------------------------------------------------------------
  select-runner:
    name: Select Runner Lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: resolve-benchmark-inputs
    permissions:
      contents: read
    outputs:
      runner_label: ${{ steps.lane.outputs.runner_label }}
      decision: ${{ steps.lane.outputs.decision }}
      reason: ${{ steps.lane.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select runner lane
        id: lane
        uses: ./.github/actions/select-build-lane
        with:
          enabled: ${{ vars.CI_FASTLANE_BUILD_ENABLED }}
          # Map benchmark runner_class → lane_mode understood by the action:
          #   fastlane  → fastlane-required (never fall back for a benchmark)
          #   arc-heavy → fallback (use ARC, never fastlane)
          lane_mode: >-
            ${{
              needs.resolve-benchmark-inputs.outputs.runner_class == 'fastlane'
                && 'fastlane-required'
                || 'fallback'
            }}
          fastlane_label: ${{ vars.CI_FASTLANE_BUILD_LABEL || 'cie-vps-fastlane-build' }}
          timezone: ${{ vars.CI_FASTLANE_BUILD_TIMEZONE }}
          office_hours_start: ${{ vars.CI_FASTLANE_BUILD_WINDOW_START }}
          office_hours_end: ${{ vars.CI_FASTLANE_BUILD_WINDOW_END }}
          runner_status_token: ${{ secrets.FASTLANE_RUNNER_STATUS_TOKEN }}
          github_app_id: ${{ secrets.GITOPS_GITHUB_APP_ID }}
          github_app_installation_id: ${{ secrets.GITOPS_GITHUB_APP_INSTALLATION_ID }}
          github_app_private_key: ${{ secrets.GITOPS_GITHUB_APP_PRIVATE_KEY }}

  # --------------------------------------------------------------------------
  # Job 3: Prepare cache conditions on the target runner
  # --------------------------------------------------------------------------
  prepare-conditions:
    name: Prepare Benchmark Conditions (${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }})
    runs-on: ${{ needs.select-runner.outputs.runner_label }}
    timeout-minutes: 90
    needs:
      - resolve-benchmark-inputs
      - select-runner
    permissions:
      contents: read
      packages: read
    env:
      BENCHMARK_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}
      RUNNER_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
      IMAGE_FAMILY: ${{ needs.resolve-benchmark-inputs.outputs.image_family }}
    outputs:
      cache_from_arg_openedx: ${{ steps.conditions.outputs.cache_from_arg_openedx }}
      cache_from_arg_mfe: ${{ steps.conditions.outputs.cache_from_arg_mfe }}
      scan_image_ref_openedx: ${{ steps.conditions.outputs.scan_image_ref_openedx }}
      scan_image_ref_mfe: ${{ steps.conditions.outputs.scan_image_ref_mfe }}
      warmup_done: ${{ steps.warmup.outputs.done }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # ── Log in to GHCR for registry-warm and local-hot (read-only pull) ───
      # Not performed for true-cold: suppressing registry login prevents the
      # docker credential store from providing L2 registry cache.
      # Note: docker buildx cache-from will still attempt to pull the cache ref
      # if the arg is present. For true-cold we clear cache_from_arg so BuildKit
      # has no ref to attempt. The limitation is that if the Docker daemon has
      # the base image already loaded in its image store (fastlane persistent
      # daemon), those layers may still be reused. This is documented in the
      # header comment and in BENCHMARK_CLASSES.md §true-cold LIMITATION.
      - name: Log in to GHCR (registry-warm / local-hot / scan-only only)
        if: env.BENCHMARK_CLASS != 'true-cold'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: docker-container
          cleanup: false

      # ── true-cold: wipe all L1 cache state ─────────────────────────────────
      - name: "[true-cold] Wipe L1 cache and builder state"
        if: env.BENCHMARK_CLASS == 'true-cold'
        run: |
          set -euo pipefail
          echo "=== Wiping L1 (local) buildx cache for true-cold run ==="
          docker buildx prune -af || true
          rm -rf /tmp/buildx-* ~/.docker/buildx || true
          docker buildx rm mereka-builder 2>/dev/null || true
          docker buildx create --name mereka-builder --driver docker-container --use 2>/dev/null || true
          echo "L1 wipe complete."
          docker buildx du 2>/dev/null || true

      # ── registry-warm: wipe L1 only, verify registry cache is reachable ────
      - name: "[registry-warm] Wipe L1 cache"
        if: env.BENCHMARK_CLASS == 'registry-warm'
        run: |
          set -euo pipefail
          echo "=== Wiping L1 (local) buildx cache for registry-warm run ==="
          docker buildx prune -af || true
          docker buildx rm mereka-builder 2>/dev/null || true
          docker buildx create --name mereka-builder --driver docker-container --use 2>/dev/null || true
          echo "L1 wipe complete."

      - name: "[registry-warm] Verify GHCR registry cache is populated"
        if: env.BENCHMARK_CLASS == 'registry-warm'
        env:
          BUILD_OPENEDX: ${{ needs.resolve-benchmark-inputs.outputs.build_openedx }}
          BUILD_MFE: ${{ needs.resolve-benchmark-inputs.outputs.build_mfe }}
        run: |
          set -euo pipefail
          WARN=0
          if [[ "$BUILD_OPENEDX" == "true" ]]; then
            if docker buildx imagetools inspect "${{ env.OPENEDX_CACHE_REF }}" >/dev/null 2>&1; then
              echo "✅ OpenEdX registry cache ref reachable: ${{ env.OPENEDX_CACHE_REF }}"
            else
              echo "::warning::OpenEdX registry cache ref not found: ${{ env.OPENEDX_CACHE_REF }}"
              echo "  This registry-warm run will degrade to effectively true-cold."
              echo "  Run a trusted main build (PR 2) to populate the cache first."
              WARN=1
            fi
          fi
          if [[ "$BUILD_MFE" == "true" ]]; then
            if docker buildx imagetools inspect "${{ env.MFE_CACHE_REF }}" >/dev/null 2>&1; then
              echo "✅ MFE registry cache ref reachable: ${{ env.MFE_CACHE_REF }}"
            else
              echo "::warning::MFE registry cache ref not found: ${{ env.MFE_CACHE_REF }}"
              echo "  This registry-warm run will degrade to effectively true-cold."
              echo "  Run a trusted main build (PR 2) to populate the cache first."
              WARN=1
            fi
          fi
          if [[ "$WARN" -eq 1 ]]; then
            echo "::warning::One or more registry cache refs are absent. Benchmark will proceed but results may resemble true-cold."
          fi

      # ── local-hot: warm-up build (discarded timing) ─────────────────────────
      # Two-phase: this step is the warm phase (no timing recorded).
      # The measured phase is in the measured-build job.
      - name: "[local-hot] Assert cache state (no wipe)"
        id: warmup
        if: env.BENCHMARK_CLASS == 'local-hot'
        env:
          BUILD_OPENEDX: ${{ needs.resolve-benchmark-inputs.outputs.build_openedx }}
          BUILD_MFE: ${{ needs.resolve-benchmark-inputs.outputs.build_mfe }}
        run: |
          set -euo pipefail
          echo "=== local-hot: asserting persistent cache state ==="
          echo "Skipping cache wipe — local-hot relies on persistent runner state."
          echo ""
          CACHE_SIZE=$(docker buildx du 2>/dev/null | tail -1 || echo "unknown")
          echo "Current buildx cache usage: ${CACHE_SIZE}"
          echo ""
          echo "If ci_layer_reuse_ratio < 0.90 post-build, this run is misclassified."
          echo "Verify the runner has a populated cache (fastlane VPS daemon or ARC arc-docker-cache PVC)."
          echo "done=true" >> "$GITHUB_OUTPUT"

      # ── scan-only: resolve the latest image digest ──────────────────────────
      - name: "[scan-only] Resolve latest image digest from GHCR"
        if: env.BENCHMARK_CLASS == 'scan-only'
        id: scan-digest
        env:
          BUILD_OPENEDX: ${{ needs.resolve-benchmark-inputs.outputs.build_openedx }}
          BUILD_MFE: ${{ needs.resolve-benchmark-inputs.outputs.build_mfe }}
        run: |
          set -euo pipefail
          mkdir -p var/ci

          if [[ "$BUILD_OPENEDX" == "true" ]]; then
            OPENEDX_DIGEST=$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/openedx:mereka-brand" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || echo "unknown")
            echo "OpenEdX digest: ${OPENEDX_DIGEST}"
            echo "scan_image_ref_openedx=${{ env.REGISTRY }}/openedx:mereka-brand" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$BUILD_MFE" == "true" ]]; then
            MFE_DIGEST=$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/mfe:mereka-brand" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || echo "unknown")
            echo "MFE digest: ${MFE_DIGEST}"
            echo "scan_image_ref_mfe=${{ env.REGISTRY }}/mfe:mereka-brand" >> "$GITHUB_OUTPUT"
          fi

      # ── Emit cache_from_arg for each family ─────────────────────────────────
      # true-cold: empty (suppresses registry cache from all build commands)
      # registry-warm + local-hot: shared GHCR registry ref
      # scan-only: not relevant (no build step), but emitted as empty
      - name: Derive CACHE_FROM_ARG per image family
        id: conditions
        run: |
          set -euo pipefail
          case "$BENCHMARK_CLASS" in
            true-cold)
              CACHE_FROM_OPENEDX=""
              CACHE_FROM_MFE=""
              ;;
            registry-warm|local-hot)
              CACHE_FROM_OPENEDX="type=registry,ref=${{ env.OPENEDX_CACHE_REF }}"
              CACHE_FROM_MFE="type=registry,ref=${{ env.MFE_CACHE_REF }}"
              ;;
            scan-only)
              CACHE_FROM_OPENEDX=""
              CACHE_FROM_MFE=""
              ;;
            *)
              echo "::error::Unknown benchmark_class: $BENCHMARK_CLASS"
              exit 1
              ;;
          esac
          {
            echo "cache_from_arg_openedx=${CACHE_FROM_OPENEDX}"
            echo "cache_from_arg_mfe=${CACHE_FROM_MFE}"
          } >> "$GITHUB_OUTPUT"
          echo "cache_from_arg_openedx=${CACHE_FROM_OPENEDX}"
          echo "cache_from_arg_mfe=${CACHE_FROM_MFE}"

  # --------------------------------------------------------------------------
  # Job 4a: Measured build — OpenEdX
  # --------------------------------------------------------------------------
  measured-build-openedx:
    name: Measured Build — openedx (${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }})
    runs-on: ${{ needs.select-runner.outputs.runner_label }}
    timeout-minutes: 90
    needs:
      - resolve-benchmark-inputs
      - select-runner
      - prepare-conditions
    if: >-
      needs.resolve-benchmark-inputs.outputs.build_openedx == 'true' &&
      needs.resolve-benchmark-inputs.outputs.is_scan_only == 'false'
    permissions:
      contents: read
      packages: read
    env:
      BENCHMARK_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}
      RUNNER_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
      CACHE_FROM_ARG: ${{ needs.prepare-conditions.outputs.cache_from_arg_openedx }}
    outputs:
      build_start_utc: ${{ steps.build.outputs.build_start_utc }}
      build_end_utc: ${{ steps.build.outputs.build_end_utc }}
      build_duration_seconds: ${{ steps.build.outputs.build_duration_seconds }}
      cached_layers: ${{ steps.build.outputs.cached_layers }}
      total_layers: ${{ steps.build.outputs.total_layers }}
      outcome: ${{ steps.build.outputs.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'
          isolated-venv: 'true'
          cache-isolated-venv: 'true'
          isolated-venv-name: 'benchmark-preflight-py312'

      - name: Prepare Tutor build context (openedx)
        env:
          TUTOR_VENV: ${{ github.workspace }}/.cache/venvs/benchmark-preflight-py312
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          ./scripts/infra/prepare-tutor-build-context-ci.sh --target openedx
          mkdir -p var/ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: docker-container
          cleanup: false

      # GHCR login only for classes that use the registry cache
      - name: Log in to GHCR (non-cold classes)
        if: env.BENCHMARK_CLASS != 'true-cold'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Measured OpenEdX build
        id: build
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          mkdir -p var/ci

          BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_START_EPOCH=$(date -u +%s)

          # Emit the benchmark context (annotation — NOT a Prometheus label per RL-4)
          echo "BENCHMARK_CLASS=${BENCHMARK_CLASS}" >> var/ci/benchmark-context-openedx.env
          echo "RUNNER_CLASS=${RUNNER_CLASS}" >> var/ci/benchmark-context-openedx.env
          echo "IMAGE_FAMILY=openedx" >> var/ci/benchmark-context-openedx.env
          echo "WORKFLOW_RUN_ID=${{ github.run_id }}" >> var/ci/benchmark-context-openedx.env

          TAG="${GITHUB_SHA::8}-benchmark"

          # NOTE: cache-to is intentionally omitted (RL-5: benchmarks are read-only).
          # CACHE_FROM_ARG is empty for true-cold runs (suppresses registry import).
          CACHE_ARGS=()
          if [[ -n "${CACHE_FROM_ARG:-}" ]]; then
            CACHE_ARGS+=(--cache-ref "${CACHE_FROM_ARG}")
          fi

          (
            while true; do
              echo "[benchmark-openedx-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          BUILD_OUTCOME="success"
          if ! timeout 85m ./scripts/infra/build-openedx-image.sh \
            --context-dir "${TUTOR_ROOT}/env/build/openedx" \
            --dockerfile "${TUTOR_ROOT}/env/build/openedx/Dockerfile" \
            --image-repo "${{ env.REGISTRY }}/openedx" \
            --primary-tag "${TAG}" \
            --secondary-tag "benchmark-${BENCHMARK_CLASS}" \
            --build-profile proof \
            "${CACHE_ARGS[@]}" \
            2>&1 | tee var/ci/build-openedx-benchmark.log; then
            BUILD_OUTCOME="failure"
            echo "::warning::OpenEdX benchmark build failed or timed out."
          fi

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

          BUILD_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_END_EPOCH=$(date -u +%s)
          BUILD_DURATION=$((BUILD_END_EPOCH - BUILD_START_EPOCH))

          # Parse layer stats from build log
          LOG="var/ci/build-openedx-benchmark.log"
          CACHED_LAYERS=$(grep -c 'CACHED' "$LOG" 2>/dev/null || echo 0)
          TOTAL_LAYERS=$(grep -cE '^\#[0-9]+ \[' "$LOG" 2>/dev/null || echo 0)

          # Check if any shared cache was imported
          CACHE_EVIDENCE="none"
          if grep -q 'importing cache manifest from' "$LOG" 2>/dev/null; then
            CACHE_EVIDENCE=$(grep 'importing cache manifest from' "$LOG" | head -1 | sed 's/.*from //' || echo "registry")
          elif [[ -z "${CACHE_FROM_ARG:-}" ]]; then
            CACHE_EVIDENCE="suppressed (true-cold run)"
          fi

          {
            echo "build_start_utc=${BUILD_START}"
            echo "build_end_utc=${BUILD_END}"
            echo "build_duration_seconds=${BUILD_DURATION}"
            echo "cached_layers=${CACHED_LAYERS}"
            echo "total_layers=${TOTAL_LAYERS}"
            echo "outcome=${BUILD_OUTCOME}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "BUILD_START=${BUILD_START}"
            echo "BUILD_END=${BUILD_END}"
            echo "BUILD_DURATION=${BUILD_DURATION}"
            echo "CACHED_LAYERS=${CACHED_LAYERS}"
            echo "TOTAL_LAYERS=${TOTAL_LAYERS}"
            echo "CACHE_EVIDENCE=${CACHE_EVIDENCE}"
            echo "OUTCOME=${BUILD_OUTCOME}"
          } >> var/ci/benchmark-context-openedx.env

          echo "OpenEdX benchmark build: ${BUILD_DURATION}s, outcome=${BUILD_OUTCOME}, layers=${CACHED_LAYERS}/${TOTAL_LAYERS} cached"

      - name: Upload OpenEdX benchmark build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-log-openedx-${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}-${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
          path: |
            var/ci/build-openedx-benchmark.log
            var/ci/benchmark-context-openedx.env
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 4b: Measured build — MFE
  # --------------------------------------------------------------------------
  measured-build-mfe:
    name: Measured Build — mfe (${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }})
    runs-on: ${{ needs.select-runner.outputs.runner_label }}
    timeout-minutes: 90
    needs:
      - resolve-benchmark-inputs
      - select-runner
      - prepare-conditions
    if: >-
      needs.resolve-benchmark-inputs.outputs.build_mfe == 'true' &&
      needs.resolve-benchmark-inputs.outputs.is_scan_only == 'false'
    permissions:
      contents: read
      packages: read
    env:
      BENCHMARK_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}
      RUNNER_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
      CACHE_FROM_ARG: ${{ needs.prepare-conditions.outputs.cache_from_arg_mfe }}
    outputs:
      build_start_utc: ${{ steps.build.outputs.build_start_utc }}
      build_end_utc: ${{ steps.build.outputs.build_end_utc }}
      build_duration_seconds: ${{ steps.build.outputs.build_duration_seconds }}
      cached_layers: ${{ steps.build.outputs.cached_layers }}
      total_layers: ${{ steps.build.outputs.total_layers }}
      outcome: ${{ steps.build.outputs.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'
          isolated-venv: 'true'
          cache-isolated-venv: 'true'
          isolated-venv-name: 'benchmark-preflight-mfe-py312'

      - name: Prepare Tutor build context (mfe)
        env:
          TUTOR_VENV: ${{ github.workspace }}/.cache/venvs/benchmark-preflight-mfe-py312
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          ./scripts/infra/prepare-tutor-build-context-ci.sh --target mfe
          mkdir -p var/ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: docker-container
          cleanup: false

      - name: Log in to GHCR (non-cold classes)
        if: env.BENCHMARK_CLASS != 'true-cold'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Measured MFE build
        id: build
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          mkdir -p var/ci

          BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_START_EPOCH=$(date -u +%s)

          echo "BENCHMARK_CLASS=${BENCHMARK_CLASS}" >> var/ci/benchmark-context-mfe.env
          echo "RUNNER_CLASS=${RUNNER_CLASS}" >> var/ci/benchmark-context-mfe.env
          echo "IMAGE_FAMILY=mfe" >> var/ci/benchmark-context-mfe.env
          echo "WORKFLOW_RUN_ID=${{ github.run_id }}" >> var/ci/benchmark-context-mfe.env

          TAG="${GITHUB_SHA::8}-benchmark"

          CACHE_ARGS=()
          if [[ -n "${CACHE_FROM_ARG:-}" ]]; then
            CACHE_ARGS+=(--cache-ref "${CACHE_FROM_ARG}")
          fi

          (
            while true; do
              echo "[benchmark-mfe-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT

          BUILD_OUTCOME="success"
          if ! timeout 85m ./scripts/infra/build-mfe-image.sh \
            --context-dir "${TUTOR_ROOT}/env/plugins/mfe/build/mfe" \
            --image-repo "${{ env.REGISTRY }}/mfe" \
            --primary-tag "${TAG}" \
            --secondary-tag "benchmark-${BENCHMARK_CLASS}" \
            --build-profile proof \
            "${CACHE_ARGS[@]}" \
            2>&1 | tee var/ci/build-mfe-benchmark.log; then
            BUILD_OUTCOME="failure"
            echo "::warning::MFE benchmark build failed or timed out."
          fi

          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

          BUILD_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_END_EPOCH=$(date -u +%s)
          BUILD_DURATION=$((BUILD_END_EPOCH - BUILD_START_EPOCH))

          LOG="var/ci/build-mfe-benchmark.log"
          CACHED_LAYERS=$(grep -c 'CACHED' "$LOG" 2>/dev/null || echo 0)
          TOTAL_LAYERS=$(grep -cE '^\#[0-9]+ \[' "$LOG" 2>/dev/null || echo 0)

          CACHE_EVIDENCE="none"
          if grep -q 'importing cache manifest from' "$LOG" 2>/dev/null; then
            CACHE_EVIDENCE=$(grep 'importing cache manifest from' "$LOG" | head -1 | sed 's/.*from //' || echo "registry")
          elif [[ -z "${CACHE_FROM_ARG:-}" ]]; then
            CACHE_EVIDENCE="suppressed (true-cold run)"
          fi

          {
            echo "build_start_utc=${BUILD_START}"
            echo "build_end_utc=${BUILD_END}"
            echo "build_duration_seconds=${BUILD_DURATION}"
            echo "cached_layers=${CACHED_LAYERS}"
            echo "total_layers=${TOTAL_LAYERS}"
            echo "outcome=${BUILD_OUTCOME}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "BUILD_START=${BUILD_START}"
            echo "BUILD_END=${BUILD_END}"
            echo "BUILD_DURATION=${BUILD_DURATION}"
            echo "CACHED_LAYERS=${CACHED_LAYERS}"
            echo "TOTAL_LAYERS=${TOTAL_LAYERS}"
            echo "CACHE_EVIDENCE=${CACHE_EVIDENCE}"
            echo "OUTCOME=${BUILD_OUTCOME}"
          } >> var/ci/benchmark-context-mfe.env

          echo "MFE benchmark build: ${BUILD_DURATION}s, outcome=${BUILD_OUTCOME}, layers=${CACHED_LAYERS}/${TOTAL_LAYERS} cached"

      - name: Upload MFE benchmark build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-log-mfe-${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}-${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
          path: |
            var/ci/build-mfe-benchmark.log
            var/ci/benchmark-context-mfe.env
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 5: Scan-only jobs (scan-only benchmark_class)
  # --------------------------------------------------------------------------
  scan-openedx:
    name: Scan OpenEdX (scan-only)
    runs-on: ${{ needs.select-runner.outputs.runner_label }}
    timeout-minutes: 45
    needs:
      - resolve-benchmark-inputs
      - select-runner
      - prepare-conditions
    if: >-
      needs.resolve-benchmark-inputs.outputs.is_scan_only == 'true' &&
      needs.resolve-benchmark-inputs.outputs.build_openedx == 'true'
    permissions:
      contents: read
      packages: read
    env:
      BENCHMARK_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}
      RUNNER_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
    outputs:
      scan_start_utc: ${{ steps.scan.outputs.scan_start_utc }}
      scan_end_utc: ${{ steps.scan.outputs.scan_end_utc }}
      scan_duration_seconds: ${{ steps.scan.outputs.scan_duration_seconds }}
      outcome: ${{ steps.scan.outputs.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to GHCR (pull existing image)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install Trivy
        run: ./scripts/infra/install-trivy.sh

      - name: Benchmark OpenEdX scan
        id: scan
        env:
          IMAGE_REF: ${{ needs.prepare-conditions.outputs.scan_image_ref_openedx || format('{0}/openedx:mereka-brand', env.REGISTRY) }}
        run: |
          set -euo pipefail
          mkdir -p var/ci

          SCAN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SCAN_START_EPOCH=$(date -u +%s)
          SCAN_OUTCOME="success"

          echo "BENCHMARK_CLASS=${BENCHMARK_CLASS}" >> var/ci/benchmark-context-scan-openedx.env
          echo "RUNNER_CLASS=${RUNNER_CLASS}" >> var/ci/benchmark-context-scan-openedx.env
          echo "IMAGE_FAMILY=openedx" >> var/ci/benchmark-context-scan-openedx.env
          echo "WORKFLOW_RUN_ID=${{ github.run_id }}" >> var/ci/benchmark-context-scan-openedx.env

          echo "=== Pulling image for scan ==="
          docker pull "${IMAGE_REF}" 2>&1 | tee var/ci/scan-openedx-pull.log || {
            echo "::warning::Failed to pull OpenEdX image for scan-only benchmark."
            SCAN_OUTCOME="failure"
          }

          if [[ "$SCAN_OUTCOME" == "success" ]]; then
            echo "=== Running Trivy scan ==="
            TRIVY_START=$(date -u +%s)
            trivy image --exit-code 0 --format sarif --output var/ci/scan-openedx-trivy.sarif \
              "${IMAGE_REF}" 2>&1 | tee var/ci/scan-openedx-trivy.log || {
              echo "::warning::Trivy scan returned non-zero (may be high severity CVEs — scan timing still recorded)."
            }
            TRIVY_END=$(date -u +%s)
            echo "Trivy duration: $((TRIVY_END - TRIVY_START))s"
            echo "TRIVY_SECONDS=$((TRIVY_END - TRIVY_START))" >> var/ci/benchmark-context-scan-openedx.env

            # SBOM with syft if available
            SYFT_SECONDS=0
            if command -v syft >/dev/null 2>&1; then
              echo "=== Running syft SBOM ==="
              SYFT_START=$(date -u +%s)
              syft "docker:${IMAGE_REF}" -o json > var/ci/scan-openedx-sbom.json 2>&1 | \
                tee var/ci/scan-openedx-syft.log || true
              SYFT_END=$(date -u +%s)
              SYFT_SECONDS=$((SYFT_END - SYFT_START))
              echo "Syft duration: ${SYFT_SECONDS}s"
            else
              echo "syft not available on this runner — skipping SBOM step."
              echo "Install syft to benchmark scan_duration_seconds{tool=syft}."
            fi
            echo "SYFT_SECONDS=${SYFT_SECONDS}" >> var/ci/benchmark-context-scan-openedx.env
          fi

          SCAN_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SCAN_END_EPOCH=$(date -u +%s)
          SCAN_DURATION=$((SCAN_END_EPOCH - SCAN_START_EPOCH))

          {
            echo "scan_start_utc=${SCAN_START}"
            echo "scan_end_utc=${SCAN_END}"
            echo "scan_duration_seconds=${SCAN_DURATION}"
            echo "outcome=${SCAN_OUTCOME}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "SCAN_START=${SCAN_START}"
            echo "SCAN_END=${SCAN_END}"
            echo "SCAN_DURATION=${SCAN_DURATION}"
            echo "OUTCOME=${SCAN_OUTCOME}"
          } >> var/ci/benchmark-context-scan-openedx.env

          echo "OpenEdX scan: ${SCAN_DURATION}s, outcome=${SCAN_OUTCOME}"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-scan-openedx-${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
          path: |
            var/ci/scan-openedx-trivy.log
            var/ci/scan-openedx-syft.log
            var/ci/scan-openedx-sbom.json
            var/ci/benchmark-context-scan-openedx.env
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 6: Emit results — assemble benchmark_metadata.json + step summary
  # --------------------------------------------------------------------------
  emit-results:
    name: Emit Benchmark Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - resolve-benchmark-inputs
      - select-runner
      - prepare-conditions
      - measured-build-openedx
      - measured-build-mfe
      - scan-openedx
    permissions:
      contents: read
    env:
      BENCHMARK_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.benchmark_class }}
      RUNNER_CLASS: ${{ needs.resolve-benchmark-inputs.outputs.runner_class }}
      IMAGE_FAMILY: ${{ needs.resolve-benchmark-inputs.outputs.image_family }}
    steps:
      - name: Assemble benchmark_metadata.json
        id: metadata
        run: |
          set -euo pipefail
          mkdir -p benchmark-results

          # Gather timing from whichever build/scan jobs ran
          BUILD_DURATION_OPENEDX="${{ needs.measured-build-openedx.outputs.build_duration_seconds || '0' }}"
          BUILD_DURATION_MFE="${{ needs.measured-build-mfe.outputs.build_duration_seconds || '0' }}"
          SCAN_DURATION="${{ needs.scan-openedx.outputs.scan_duration_seconds || '0' }}"
          BUILD_OUTCOME_OPENEDX="${{ needs.measured-build-openedx.outputs.outcome || 'skipped' }}"
          BUILD_OUTCOME_MFE="${{ needs.measured-build-mfe.outputs.outcome || 'skipped' }}"
          SCAN_OUTCOME="${{ needs.scan-openedx.outputs.outcome || 'skipped' }}"

          BUILD_START_OPENEDX="${{ needs.measured-build-openedx.outputs.build_start_utc || '' }}"
          BUILD_END_OPENEDX="${{ needs.measured-build-openedx.outputs.build_end_utc || '' }}"
          BUILD_START_MFE="${{ needs.measured-build-mfe.outputs.build_start_utc || '' }}"
          BUILD_END_MFE="${{ needs.measured-build-mfe.outputs.build_end_utc || '' }}"

          # Total duration = sum of all recorded job durations
          TOTAL_DURATION=$(( BUILD_DURATION_OPENEDX + BUILD_DURATION_MFE + SCAN_DURATION ))

          # Compute release_unit_id (short SHA — join key per CI_METRICS.md §2)
          RELEASE_UNIT_ID="${GITHUB_SHA::7}"

          # benchmark_metadata.json is an annotation artifact — NOT a Prometheus label.
          # The ci-metrics-receiver (bead jj97.2) reads this file to group runs by
          # benchmark_class for dashboard Row 4. Classification is still DERIVED
          # from ci_cache_source_found + ci_layer_reuse_ratio in recording rules.
          python3 - <<PYEOF
          import json, os
          meta = {
              "schema_version": "benchmark-metadata/v1",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "release_unit_id": os.environ["RELEASE_UNIT_ID"],
              "benchmark_class": os.environ["BENCHMARK_CLASS"],
              "runner_class": os.environ["RUNNER_CLASS"],
              "image_family": os.environ["IMAGE_FAMILY"],
              "triggered_by": os.environ["GITHUB_EVENT_NAME"],
              "workflow_run_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "openedx": {
                  "build_start_utc": os.environ.get("BUILD_START_OPENEDX", ""),
                  "build_end_utc": os.environ.get("BUILD_END_OPENEDX", ""),
                  "build_duration_seconds": int(os.environ.get("BUILD_DURATION_OPENEDX", 0)),
                  "outcome": os.environ.get("BUILD_OUTCOME_OPENEDX", "skipped"),
                  "cached_layers": int("${{ needs.measured-build-openedx.outputs.cached_layers || '0' }}".strip() or 0),
                  "total_layers": int("${{ needs.measured-build-openedx.outputs.total_layers || '0' }}".strip() or 0),
              },
              "mfe": {
                  "build_start_utc": os.environ.get("BUILD_START_MFE", ""),
                  "build_end_utc": os.environ.get("BUILD_END_MFE", ""),
                  "build_duration_seconds": int(os.environ.get("BUILD_DURATION_MFE", 0)),
                  "outcome": os.environ.get("BUILD_OUTCOME_MFE", "skipped"),
                  "cached_layers": int("${{ needs.measured-build-mfe.outputs.cached_layers || '0' }}".strip() or 0),
                  "total_layers": int("${{ needs.measured-build-mfe.outputs.total_layers || '0' }}".strip() or 0),
              },
              "scan": {
                  "duration_seconds": int(os.environ.get("SCAN_DURATION", 0)),
                  "outcome": os.environ.get("SCAN_OUTCOME", "skipped"),
              },
              "total_duration_seconds": int(os.environ.get("TOTAL_DURATION", 0)),
              "note": (
                  "benchmark_class is a pre-condition annotation, NOT a Prometheus label. "
                  "Classification (true-cold/registry-warm/local-hot/scan-only) is always "
                  "DERIVED from ci_cache_source_found + ci_layer_reuse_ratio in Prometheus "
                  "recording rules (RFC-BUILD-AUTHORITY-001 red line #4)."
              ),
          }
          with open("benchmark-results/benchmark_metadata.json", "w") as f:
              json.dump(meta, f, indent=2)
          print(json.dumps(meta, indent=2))
          PYEOF
        env:
          RELEASE_UNIT_ID: ${{ github.sha }}
          BUILD_DURATION_OPENEDX: ${{ needs.measured-build-openedx.outputs.build_duration_seconds || '0' }}
          BUILD_DURATION_MFE: ${{ needs.measured-build-mfe.outputs.build_duration_seconds || '0' }}
          SCAN_DURATION: ${{ needs.scan-openedx.outputs.scan_duration_seconds || '0' }}
          BUILD_OUTCOME_OPENEDX: ${{ needs.measured-build-openedx.outputs.outcome || 'skipped' }}
          BUILD_OUTCOME_MFE: ${{ needs.measured-build-mfe.outputs.outcome || 'skipped' }}
          SCAN_OUTCOME: ${{ needs.scan-openedx.outputs.outcome || 'skipped' }}
          BUILD_START_OPENEDX: ${{ needs.measured-build-openedx.outputs.build_start_utc || '' }}
          BUILD_END_OPENEDX: ${{ needs.measured-build-openedx.outputs.build_end_utc || '' }}
          BUILD_START_MFE: ${{ needs.measured-build-mfe.outputs.build_start_utc || '' }}
          BUILD_END_MFE: ${{ needs.measured-build-mfe.outputs.build_end_utc || '' }}
          TOTAL_DURATION: ${{ needs.measured-build-openedx.outputs.build_duration_seconds && needs.measured-build-mfe.outputs.build_duration_seconds && needs.scan-openedx.outputs.scan_duration_seconds || '0' }}

      - name: Write workflow step summary table
        run: |
          set -euo pipefail

          # Expected bands from BENCHMARK_CLASSES.md §Expected timing reference table
          # Format: "benchmark_class:image_family:low_min:high_min:unit"
          # These are P50 reference bands, NOT SLOs.
          declare -A BANDS
          BANDS["true-cold:openedx"]="30–90 min"
          BANDS["true-cold:mfe"]="44 min (observed)"
          BANDS["registry-warm:openedx"]="<10 min (target)"
          BANDS["registry-warm:mfe"]="<5 min (target)"
          BANDS["local-hot:openedx"]="~71s (observed best-case)"
          BANDS["local-hot:mfe"]="5–8 min (observed)"
          BANDS["scan-only:openedx"]="~20 min current → ~5 min target"
          BANDS["scan-only:mfe"]="inherited from openedx scan"
          BANDS["scan-only:both"]="~20 min current → ~5 min target"

          OPENEDX_SECS="${{ needs.measured-build-openedx.outputs.build_duration_seconds || '—' }}"
          MFE_SECS="${{ needs.measured-build-mfe.outputs.build_duration_seconds || '—' }}"
          SCAN_SECS="${{ needs.scan-openedx.outputs.scan_duration_seconds || '—' }}"

          BAND_OPENEDX="${BANDS["${BENCHMARK_CLASS}:openedx"]:-N/A}"
          BAND_MFE="${BANDS["${BENCHMARK_CLASS}:mfe"]:-N/A}"
          BAND_SCAN="${BANDS["${BENCHMARK_CLASS}:openedx"]:-N/A}"

          {
            echo "## Benchmark Results"
            echo ""
            echo "| Entry | Measured | Expected Band (BENCHMARK_CLASSES.md P50) |"
            echo "|-------|----------|------------------------------------------|"
            if [[ "${BENCHMARK_CLASS}" != "scan-only" ]]; then
              echo "| openedx build (${BENCHMARK_CLASS} / ${RUNNER_CLASS}) | ${OPENEDX_SECS}s | ${BAND_OPENEDX} |"
              echo "| mfe build (${BENCHMARK_CLASS} / ${RUNNER_CLASS}) | ${MFE_SECS}s | ${BAND_MFE} |"
            else
              echo "| openedx scan (scan-only / ${RUNNER_CLASS}) | ${SCAN_SECS}s | ${BAND_SCAN} |"
            fi
            echo ""
            echo "> **Note**: benchmark_class is a pre-condition annotation."
            echo "> Prometheus classification is derived from \`ci_cache_source_found\`"
            echo "> and \`ci_layer_reuse_ratio\` in recording rules — never hand-labeled."
            echo "> See: \`docs/ops/ci-cd/BENCHMARK_CLASSES.md §How classification is DERIVED\`"
            echo ""
            echo "Artifact: \`benchmark-results/benchmark_metadata.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark_metadata.json artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results/benchmark_metadata.json
          retention-days: 90
