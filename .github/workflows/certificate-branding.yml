name: Certificate Branding

on:
  workflow_dispatch:

permissions: {}

jobs:
  certificate-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run certificate branding gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/qa
          ./scripts/qa/verify-certificate-branding.sh \
            | tee var/qa/certificate-branding.log

      - name: Upload certificate branding artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: certificate-branding-${{ github.run_number }}
          path: |
            var/qa/certificate-branding.log
          if-no-files-found: warn
