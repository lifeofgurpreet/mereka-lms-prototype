name: ADR Governance

on:
  pull_request:
    paths:
      - "docs/adr/**"
      - "docs/concepts/architecture/**"
      - "evidence/**"
      - "docs/ops/runbooks/**"
      - "scripts/qa/run-adr-gates.sh"
      - "scripts/qa/generate_adr_readme.py"
      - "tools/docs/adr_ledger.py"
      - "tools/docs/build_adr_ledger.py"
      - "tools/docs/verify/verify_adr_*"
  push:
    branches: ["main"]
    paths:
      - "docs/adr/**"
      - "docs/concepts/architecture/**"
      - "evidence/**"
      - "docs/ops/runbooks/**"
      - "scripts/qa/run-adr-gates.sh"
      - "scripts/qa/generate_adr_readme.py"
      - "tools/docs/adr_ledger.py"
      - "tools/docs/build_adr_ledger.py"
      - "tools/docs/verify/verify_adr_*"

jobs:
  adr-suite:
    name: ADR Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run ADR suite
        run: |
          make adr-governance
