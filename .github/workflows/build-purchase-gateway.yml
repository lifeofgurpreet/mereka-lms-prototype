name: Build Purchase Gateway

on:
  push:
    branches: [main]
    paths:
      - "services/purchase-gateway/**"
      - ".github/workflows/build-purchase-gateway.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}  # Deny-all at workflow level; each job grants only what it needs

jobs:
  build:
    # contents: read — checkout in reusable workflow
    # packages: write — push image to GHCR
    # id-token: write — OIDC for Workload Identity Federation (GCP auth)
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Biji-Biji-Initiative/bbi-infrastructure/.github/workflows/reusable-build-push.yml@ca61f1f34ca7010d1a1275e6123de5a6ad0ba8a4
    with:
      app_name: purchase-gateway
      dockerfile: services/purchase-gateway/Dockerfile
      context: services/purchase-gateway

  update-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    # contents: read — checkout in reusable workflow
    # id-token: write — OIDC for Workload Identity Federation used by reusable workflow
    permissions:
      contents: read
      id-token: write
    uses: Biji-Biji-Initiative/bbi-infrastructure/.github/workflows/reusable-update-dev-tag.yml@ca61f1f34ca7010d1a1275e6123de5a6ad0ba8a4
    with:
      app_name: mereka-lms
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      image_repository: ghcr.io/biji-biji-initiative/purchase-gateway
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN_BBI_KUBERNATE }}
