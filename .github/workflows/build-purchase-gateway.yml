name: Build Purchase Gateway

on:
  push:
    branches: [main]
    paths:
      - "services/purchase-gateway/**"
      - ".github/workflows/build-purchase-gateway.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: Biji-Biji-Initiative/bbi-infrastructure/.github/workflows/reusable-build-push.yml@ca61f1f34ca7010d1a1275e6123de5a6ad0ba8a4
    with:
      app_name: purchase-gateway
      dockerfile: services/purchase-gateway/Dockerfile
      context: services/purchase-gateway

  update-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: Biji-Biji-Initiative/bbi-infrastructure/.github/workflows/reusable-update-dev-tag.yml@ca61f1f34ca7010d1a1275e6123de5a6ad0ba8a4
    with:
      app_name: mereka-lms
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      image_repository: ghcr.io/biji-biji-initiative/purchase-gateway
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN_BBI_KUBERNATE }}
