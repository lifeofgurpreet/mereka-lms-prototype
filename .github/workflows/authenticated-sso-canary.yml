name: Authenticated SSO Canary

on:
  schedule:
    # Keep this frequent enough to catch regressions quickly, but not so frequent
    # that Authentik rate-limits or lockouts become likely.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      env_scope:
        description: "Environment scope"
        required: false
        default: "prod"
        type: choice
        options:
          - prod
          - dev
          - both

jobs:
  sso-canary:
    name: Run Credentialed SSO Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.50.0"
          python -m playwright install --with-deps chromium

      - name: Run canary
        env:
          INPUT_ENV_SCOPE: ${{ github.event.inputs.env_scope || 'prod' }}
          # Secrets (prefer explicit env-scoped secrets; fall back to generic if set)
          SSO_CANARY_EMAIL_PROD: ${{ secrets.SSO_CANARY_EMAIL_PROD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_EMAIL_DEV: ${{ secrets.SSO_CANARY_EMAIL_DEV }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_EMAIL: ${{ secrets.SSO_CANARY_EMAIL }}
          SSO_CANARY_PASSWORD: ${{ secrets.SSO_CANARY_PASSWORD }}
          # Fail loudly: if the secrets are missing, we want to know.
          REQUIRE_SECRETS: "1"
          SSO_CANARY_TIMEOUT_SECONDS: "180"
        run: |
          ./scripts/qa/verify-authenticated-sso-canary.sh --env "$INPUT_ENV_SCOPE"

      - name: Upload canary artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sso-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/auth-sso-canary/
          retention-days: 30

