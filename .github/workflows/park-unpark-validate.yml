name: Park/Unpark Script Validation

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  validate-scripts:
    name: Validate park/unpark scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate scripts exist and are executable
        run: |
          for script in scripts/ops/park-prod.sh scripts/ops/unpark-prod.sh; do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: $script not found"
              exit 1
            fi
            if [[ ! -x "$script" ]]; then
              echo "ERROR: $script is not executable"
              exit 1
            fi
            echo "OK: $script exists and is executable"
          done

      - name: Run shellcheck on park/unpark scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/ops/park-prod.sh
          shellcheck scripts/ops/unpark-prod.sh
          echo "OK: shellcheck passed for both scripts"

      - name: Dry-run syntax check
        run: |
          bash -n scripts/ops/park-prod.sh
          echo "OK: scripts/ops/park-prod.sh syntax valid"
          bash -n scripts/ops/unpark-prod.sh
          echo "OK: scripts/ops/unpark-prod.sh syntax valid"

      - name: Check for set -euo pipefail
        run: |
          for script in scripts/ops/park-prod.sh scripts/ops/unpark-prod.sh; do
            if ! grep -q 'set -euo pipefail' "$script"; then
              echo "ERROR: $script missing 'set -euo pipefail'"
              exit 1
            fi
            echo "OK: $script has 'set -euo pipefail'"
          done

      - name: Check for shared config sourcing
        run: |
          for script in scripts/ops/park-prod.sh scripts/ops/unpark-prod.sh; do
            if grep -q 'source.*config\.sh' "$script"; then
              echo "OK: $script sources config.sh"
            else
              echo "INFO: $script does not source config.sh (uses inline variables)"
            fi
          done
