name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate semver tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '${TAG}' is not a valid semver tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Find previous tag
        id: prev-tag
        run: |
          set -euo pipefail
          CURRENT_TAG="${TAG}"
          # Find the most recent tag before the current one
          PREV_TAG="$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -1 || true)"
          if [[ -z "${PREV_TAG}" ]]; then
            echo "No previous semver tag found — using first commit as base"
            PREV_REF="$(git rev-list --max-parents=0 HEAD)"
          else
            echo "Previous tag: ${PREV_TAG}"
            PREV_REF="${PREV_TAG}"
          fi
          echo "prev_ref=${PREV_REF}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          PREV_REF: ${{ steps.prev-tag.outputs.prev_ref }}
        run: |
          set -euo pipefail

          CURRENT_TAG="${TAG}"
          PREV_REF="${PREV_REF}"

          # Collect commits since previous tag/ref
          COMMITS="$(git log "${PREV_REF}..${CURRENT_TAG}" \
            --pretty=format:'%s' \
            --no-merges \
            | grep -E '^(feat|fix|docs|refactor|chore|test|perf|ci)(\(.+\))?!?:' \
            || true)"

          # Group by type
          FEATURES="$(echo "${COMMITS}" | grep -E '^feat(\(.+\))?!?:' || true)"
          FIXES="$(echo "${COMMITS}" | grep -E '^fix(\(.+\))?!?:' || true)"
          BREAKING="$(echo "${COMMITS}" | grep -E '^(feat|fix|refactor)(\(.+\))?!:' || true)"
          DOCS="$(echo "${COMMITS}" | grep -E '^docs(\(.+\))?!?:' || true)"
          REFACTORS="$(echo "${COMMITS}" | grep -E '^refactor(\(.+\))?!?:' || true)"
          CHORES="$(echo "${COMMITS}" | grep -E '^(chore|ci|test|perf)(\(.+\))?!?:' || true)"
          OTHER="$(git log "${PREV_REF}..${CURRENT_TAG}" \
            --pretty=format:'%s' \
            --no-merges \
            | grep -vE '^(feat|fix|docs|refactor|chore|test|perf|ci)(\(.+\))?!?:' \
            || true)"

          # Build changelog body
          BODY=""

          if [[ -n "${BREAKING}" ]]; then
            BODY+=$'## Breaking Changes\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${BREAKING}"
            BODY+=$'\n'
          fi

          if [[ -n "${FEATURES}" ]]; then
            BODY+=$'## Features\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${FEATURES}"
            BODY+=$'\n'
          fi

          if [[ -n "${FIXES}" ]]; then
            BODY+=$'## Bug Fixes\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${FIXES}"
            BODY+=$'\n'
          fi

          if [[ -n "${DOCS}" ]]; then
            BODY+=$'## Documentation\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${DOCS}"
            BODY+=$'\n'
          fi

          if [[ -n "${REFACTORS}" ]]; then
            BODY+=$'## Refactoring\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${REFACTORS}"
            BODY+=$'\n'
          fi

          if [[ -n "${CHORES}" ]]; then
            BODY+=$'## Chores / CI\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${CHORES}"
            BODY+=$'\n'
          fi

          if [[ -n "${OTHER}" ]]; then
            BODY+=$'## Other\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${OTHER}"
            BODY+=$'\n'
          fi

          PREV_TAG="${{ steps.prev-tag.outputs.prev_tag }}"
          if [[ -n "${PREV_TAG}" ]]; then
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            BODY+="**Full diff**: ${COMPARE_URL}"$'\n'
          fi

          if [[ -z "${BODY}" ]]; then
            BODY="No conventional commits found since ${PREV_REF}."
          fi

          # Write body to file (avoids env var length limits)
          echo "${BODY}" > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Determine if pre-release
        id: prerelease
        run: |
          set -euo pipefail
          # Treat 0.x.x as pre-release
          MAJOR="$(echo "${TAG}" | cut -d. -f1 | tr -d v)"
          if [[ "${MAJOR}" == "0" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY_FILE: ${{ steps.changelog.outputs.body_file }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${BODY_FILE}" \
            ${PRERELEASE_FLAG}
          echo "GitHub Release created: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
