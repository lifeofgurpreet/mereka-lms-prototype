name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

env:
  REGISTRY: ghcr.io/biji-biji-initiative/mereka-lms

jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: mereka-k8s-runners
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate semver tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '${TAG}' is not a valid semver tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Validate release-object control-plane projection consumer (INV-016)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path("scripts/qa/verify-release-object.sh").read_text(encoding="utf-8")
          missing = []
          if "release-object-projection-schema.yaml" not in verifier:
              missing.append("verify-release-object.sh must reference release-object-projection-schema.yaml")
          if "PLATFORM_CONTROL_PLANE_ROOT" not in verifier:
              missing.append("verify-release-object.sh must resolve PLATFORM_CONTROL_PLANE_ROOT")
          if missing:
              raise SystemExit("\n".join(missing))
          print("PASS: Release-object control-plane projection consumer validated")
          PY

      - name: Find previous tag
        id: prev-tag
        run: |
          set -euo pipefail
          CURRENT_TAG="${TAG}"
          # Find the most recent tag before the current one
          PREV_TAG="$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${CURRENT_TAG}$" \
            | head -1 || true)"
          if [[ -z "${PREV_TAG}" ]]; then
            echo "No previous semver tag found — using first commit as base"
            PREV_REF="$(git rev-list --max-parents=0 HEAD)"
          else
            echo "Previous tag: ${PREV_TAG}"
            PREV_REF="${PREV_TAG}"
          fi
          echo "prev_ref=${PREV_REF}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          PREV_REF: ${{ steps.prev-tag.outputs.prev_ref }}
        run: |
          set -euo pipefail

          CURRENT_TAG="${TAG}"
          PREV_REF="${PREV_REF}"

          # Collect commits since previous tag/ref
          COMMITS="$(git log "${PREV_REF}..${CURRENT_TAG}" \
            --pretty=format:'%s' \
            --no-merges \
            | grep -E '^(feat|fix|docs|refactor|chore|test|perf|ci)(\(.+\))?!?:' \
            || true)"

          # Group by type
          FEATURES="$(echo "${COMMITS}" | grep -E '^feat(\(.+\))?!?:' || true)"
          FIXES="$(echo "${COMMITS}" | grep -E '^fix(\(.+\))?!?:' || true)"
          BREAKING="$(echo "${COMMITS}" | grep -E '^(feat|fix|refactor)(\(.+\))?!:' || true)"
          DOCS="$(echo "${COMMITS}" | grep -E '^docs(\(.+\))?!?:' || true)"
          REFACTORS="$(echo "${COMMITS}" | grep -E '^refactor(\(.+\))?!?:' || true)"
          CHORES="$(echo "${COMMITS}" | grep -E '^(chore|ci|test|perf)(\(.+\))?!?:' || true)"
          OTHER="$(git log "${PREV_REF}..${CURRENT_TAG}" \
            --pretty=format:'%s' \
            --no-merges \
            | grep -vE '^(feat|fix|docs|refactor|chore|test|perf|ci)(\(.+\))?!?:' \
            || true)"

          # Build changelog body
          BODY=""

          if [[ -n "${BREAKING}" ]]; then
            BODY+=$'## Breaking Changes\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${BREAKING}"
            BODY+=$'\n'
          fi

          if [[ -n "${FEATURES}" ]]; then
            BODY+=$'## Features\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${FEATURES}"
            BODY+=$'\n'
          fi

          if [[ -n "${FIXES}" ]]; then
            BODY+=$'## Bug Fixes\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${FIXES}"
            BODY+=$'\n'
          fi

          if [[ -n "${DOCS}" ]]; then
            BODY+=$'## Documentation\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${DOCS}"
            BODY+=$'\n'
          fi

          if [[ -n "${REFACTORS}" ]]; then
            BODY+=$'## Refactoring\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${REFACTORS}"
            BODY+=$'\n'
          fi

          if [[ -n "${CHORES}" ]]; then
            BODY+=$'## Chores / CI\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${CHORES}"
            BODY+=$'\n'
          fi

          if [[ -n "${OTHER}" ]]; then
            BODY+=$'## Other\n\n'
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              BODY+="- ${line}"$'\n'
            done <<< "${OTHER}"
            BODY+=$'\n'
          fi

          PREV_TAG="${{ steps.prev-tag.outputs.prev_tag }}"
          if [[ -n "${PREV_TAG}" ]]; then
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            BODY+="**Full diff**: ${COMPARE_URL}"$'\n'
          fi

          if [[ -z "${BODY}" ]]; then
            BODY="No conventional commits found since ${PREV_REF}."
          fi

          # Write body to file (avoids env var length limits)
          echo "${BODY}" > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Determine if pre-release
        id: prerelease
        run: |
          set -euo pipefail
          # Treat 0.x.x as pre-release
          MAJOR="$(echo "${TAG}" | cut -d. -f1 | tr -d v)"
          if [[ "${MAJOR}" == "0" ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY_FILE: ${{ steps.changelog.outputs.body_file }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${BODY_FILE}" \
            ${PRERELEASE_FLAG}
          echo "GitHub Release created: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  promote-to-production:
    name: Promote to Production
    runs-on: mereka-k8s-runners
    needs: create-github-release
    # Manual approval is enforced by the 'production' GitHub environment protection rules.
    # Configure required reviewers at: Settings → Environments → production
    environment: production
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history so release-openedx-gitops.sh can read app SHA for GitOps base ref bump
          fetch-depth: 0

      - name: Validate semver tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Tag '${TAG}' is not a valid semver tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          # The image tag in GHCR is the full commit SHA of the tagged commit.
          # build-tutor-images.yml pushes with: TAG="${{ inputs.image_tag || github.sha }}"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verify images exist in registry
        # Gate: confirm both images were built and pushed before allowing promotion.
        # resolve-image-digest.sh uses 'docker buildx imagetools inspect' which requires
        # GHCR login for private packages.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          OPENEDX_REF="${{ env.REGISTRY }}/openedx:${IMAGE_TAG}"
          MFE_REF="${{ env.REGISTRY }}/mfe:${IMAGE_TAG}"

          echo "Verifying openedx image: ${OPENEDX_REF}"
          OPENEDX_DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${OPENEDX_REF}")"
          if [[ -z "${OPENEDX_DIGEST}" || ! "${OPENEDX_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::openedx image not found or digest invalid for ${OPENEDX_REF}"
            echo "::error::The image must be built by build-tutor-images.yml before tagging a release."
            exit 1
          fi
          echo "openedx digest: ${OPENEDX_DIGEST}"
          echo "OPENEDX_DIGEST=${OPENEDX_DIGEST}" >> "$GITHUB_ENV"

          echo "Verifying mfe image: ${MFE_REF}"
          MFE_DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${MFE_REF}")"
          if [[ -z "${MFE_DIGEST}" || ! "${MFE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::mfe image not found or digest invalid for ${MFE_REF}"
            echo "::error::The image must be built by build-tutor-images.yml before tagging a release."
            exit 1
          fi
          echo "mfe digest: ${MFE_DIGEST}"
          echo "MFE_DIGEST=${MFE_DIGEST}" >> "$GITHUB_ENV"

          echo "Image existence gate passed: both images verified in registry."
          echo "**openedx:** \`${OPENEDX_REF}\` → \`${OPENEDX_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**mfe:** \`${MFE_REF}\` → \`${MFE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Mint GitOps writer app token
        id: gitops-app-token
        env:
          GITHUB_APP_ID: ${{ secrets.GITOPS_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITOPS_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITOPS_GITHUB_APP_PRIVATE_KEY }}
        if: ${{ env.GITHUB_APP_ID != '' && env.GITHUB_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: Biji-Biji-Initiative
          repositories: bbi-infrastructure

      - name: Validate GitOps checkout credential
        env:
          APP_TOKEN: ${{ steps.gitops-app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_TOKEN}" ]]; then
            echo "GitOps writer app credentials are required to update bbi-infrastructure." >&2
            exit 1
          fi

      - name: Checkout bbi-infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Biji-Biji-Initiative/bbi-infrastructure
          path: bbi-infrastructure
          token: ${{ steps.gitops-app-token.outputs.token }}

      - name: Select GitOps automation token
        env:
          APP_TOKEN: ${{ steps.gitops-app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_TOKEN}" ]]; then
            echo "GitOps writer app credentials are required to update bbi-infrastructure." >&2
            exit 1
          fi
          echo "GITOPS_PUSH_TOKEN=${APP_TOKEN}" >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE/bbi-infrastructure" remote set-url origin "https://x-access-token:${GITOPS_PUSH_TOKEN}@github.com/Biji-Biji-Initiative/bbi-infrastructure.git"

      - name: Promote image tags to production via GitOps
        run: |
          set -euo pipefail
          CONFIRM_RELEASE_OPENEDX_GITOPS=RELEASE_OPENEDX_GITOPS \
          CONFIRM_PUSH_RELEASE_OPENEDX_GITOPS=PUSH_RELEASE_OPENEDX_GITOPS \
          ALLOW_PROD_APPLY=1 \
          ./scripts/infra/release-openedx-gitops.sh \
            --target-env production \
            --openedx-tag "${IMAGE_TAG}" \
            --mfe-tag "${IMAGE_TAG}" \
            --openedx-digest "${OPENEDX_DIGEST}" \
            --mfe-digest "${MFE_DIGEST}" \
            --require-digests \
            --app-repo "$GITHUB_WORKSPACE" \
            --infra-repo "$GITHUB_WORKSPACE/bbi-infrastructure" \
            --skip-branding-runtime-guard \
            --skip-paragon-runtime-guard \
            --skip-footer-runtime-guard \
            --skip-mfe-route-runtime-guard \
            --skip-mfe-route-smoke-guard \
            --skip-enterprise-site-mapping-guard \
            --skip-enterprise-readiness-integrity-guard \
            --skip-enterprise-sso-runtime-guard \
            --skip-enterprise-runtime-app-guard \
            --skip-enterprise-schema-guard \
            --apply --commit --push

      - name: Summary
        run: |
          set -euo pipefail
          GITOPS_COMMIT="$(git -C "$GITHUB_WORKSPACE/bbi-infrastructure" rev-parse HEAD)"
          echo "### Production Promotion Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Semver tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**openedx digest:** \`${OPENEDX_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**mfe digest:** \`${MFE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps commit:** \`${GITOPS_COMMIT}\`" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will reconcile within 3 minutes. Monitor at: https://argocd.academyv2.mereka.io"
