name: MFE Selector Hardening

on:
  workflow_dispatch:
    inputs:
      pgn_selector_ceiling:
        description: "Optional override ceiling for non-comment .pgn__ selector lines"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  mfe-selector-hardening:
    runs-on: mereka-k8s-runners
    timeout-minutes: 20
    permissions:
      contents: read  # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run selector hardening gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/qa

          PGN_SELECTOR_CEILING="${{ inputs.pgn_selector_ceiling || '' }}"
          if [[ -n "$PGN_SELECTOR_CEILING" ]]; then
            env PGN_SELECTOR_CEILING="$PGN_SELECTOR_CEILING" ./scripts/qa/verify-mfe-selector-hardening.sh \
              | tee var/qa/mfe-selector-hardening.log
          else
            ./scripts/qa/verify-mfe-selector-hardening.sh \
              | tee var/qa/mfe-selector-hardening.log
          fi

      - name: Upload selector hardening artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mfe-selector-hardening-${{ github.run_number }}
          path: |
            var/qa/mfe-selector-hardening.log
            var/mfe-selector-hardening-verification.txt
          if-no-files-found: warn
