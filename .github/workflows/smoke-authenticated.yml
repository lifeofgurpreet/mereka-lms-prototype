name: Authenticated Smoke Tests

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours — SSO canary + smoke
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL to test'
        required: false
        default: 'https://academyv2.mereka.io'
      env_scope:
        description: 'SSO canary environment scope'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
          - staging
          - both
          - all

permissions: {}

jobs:
  smoke-authenticated:
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          node-version: '18'

      - name: Resolve authenticated smoke target and credentials
        id: resolve-smoke
        env:
          INPUT_ENV_SCOPE: ${{ github.event.inputs.env_scope || 'prod' }}
          INPUT_TARGET: ${{ github.event.inputs.target || '' }}
          SMOKE_SSO_USERNAME: ${{ secrets.SMOKE_SSO_USERNAME }}
          SMOKE_SSO_PASSWORD: ${{ secrets.SMOKE_SSO_PASSWORD }}
          SSO_CANARY_EMAIL_PROD: ${{ secrets.SSO_CANARY_EMAIL_PROD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_EMAIL_DEV: ${{ secrets.SSO_CANARY_EMAIL_DEV }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_EMAIL_STAGING: ${{ secrets.SSO_CANARY_EMAIL_STAGING }}
          SSO_CANARY_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_PASSWORD_STAGING }}
        run: |
          set -euo pipefail

          scope="${INPUT_ENV_SCOPE:-prod}"
          run_smoke=1

          case "$scope" in
            ""|prod)
              target="${INPUT_TARGET:-https://academyv2.mereka.io}"
              username="${SMOKE_SSO_USERNAME:-${SSO_CANARY_EMAIL_PROD:-}}"
              password="${SMOKE_SSO_PASSWORD:-${SSO_CANARY_PASSWORD_PROD:-}}"
              lms_domain="academyv2.mereka.io"
              studio_domain="studio.academyv2.mereka.io"
              mfe_domain="apps.academyv2.mereka.io"
              ;;
            dev)
              target="${INPUT_TARGET:-https://academyv2.mereka.dev}"
              username="${SSO_CANARY_EMAIL_DEV:-}"
              password="${SSO_CANARY_PASSWORD_DEV:-}"
              lms_domain="academyv2.mereka.dev"
              studio_domain="studio.academyv2.mereka.dev"
              mfe_domain="apps.academyv2.mereka.dev"
              ;;
            staging)
              target="${INPUT_TARGET:-https://staging.academyv2.mereka.io}"
              username="${SSO_CANARY_EMAIL_STAGING:-}"
              password="${SSO_CANARY_PASSWORD_STAGING:-}"
              lms_domain="staging.academyv2.mereka.io"
              studio_domain="staging.studio.academyv2.mereka.io"
              mfe_domain="staging.apps.academyv2.mereka.io"
              ;;
            both|all)
              run_smoke=0
              target=""
              username=""
              password=""
              lms_domain=""
              studio_domain=""
              mfe_domain=""
              ;;
            *)
              echo "::error::Unsupported env_scope=${scope}"
              exit 1
              ;;
          esac

          {
            echo "run_smoke=$run_smoke"
            echo "smoke_target=$target"
            echo "lms_domain=$lms_domain"
            echo "studio_domain=$studio_domain"
            echo "mfe_domain=$mfe_domain"
          } >> "$GITHUB_OUTPUT"

          if [[ "$run_smoke" != "1" ]]; then
            echo "skip_reason=env_scope=${scope} is covered by the multi-environment sso-canary job" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$username" || -z "$password" ]]; then
            echo "::error::No authenticated smoke credentials resolved for env_scope=${scope}"
            exit 1
          fi

          {
            echo "sso_username<<EOF"
            echo "$username"
            echo "EOF"
            echo "sso_password<<EOF"
            echo "$password"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run authenticated smoke tests
        if: ${{ steps.resolve-smoke.outputs.run_smoke == '1' }}
        env:
          SMOKE_TARGET: ${{ steps.resolve-smoke.outputs.smoke_target }}
          SSO_USERNAME: ${{ steps.resolve-smoke.outputs.sso_username }}
          SSO_PASSWORD: ${{ steps.resolve-smoke.outputs.sso_password }}
        run: ./scripts/qa/smoke-authenticated.sh --target "$SMOKE_TARGET"

      - name: Skip multi-environment authenticated smoke
        if: ${{ steps.resolve-smoke.outputs.run_smoke != '1' }}
        run: echo "Skipping smoke-authenticated job because ${{ steps.resolve-smoke.outputs.skip_reason }}"

      - name: Run visual regression tests (authenticated)
        if: ${{ always() && steps.resolve-smoke.outputs.run_smoke == '1' }}
        env:
          SSO_USERNAME: ${{ steps.resolve-smoke.outputs.sso_username }}
          SSO_PASSWORD: ${{ steps.resolve-smoke.outputs.sso_password }}
          LMS_DOMAIN: ${{ steps.resolve-smoke.outputs.lms_domain }}
          STUDIO_DOMAIN: ${{ steps.resolve-smoke.outputs.studio_domain }}
          MFE_DOMAIN: ${{ steps.resolve-smoke.outputs.mfe_domain }}
        run: ./scripts/qa/visual-regression-test.sh --env production --authenticated || true

      - name: Sanitize smoke test artifacts
        if: always()
        env:
          SMOKE_SSO_PASSWORD: ${{ secrets.SMOKE_SSO_PASSWORD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_PASSWORD_STAGING }}
        run: |
          set -euo pipefail
          for ARTIFACT_DIR in var/screenshots; do
            [[ -d "$ARTIFACT_DIR" ]] || continue
            # Remove Playwright traces (contain full network payloads with credentials)
            find "$ARTIFACT_DIR" -type f -name "*.trace.zip" -delete 2>/dev/null || true
            # Redact known passwords from text logs using perl (safe with special chars)
            for secret_var in SMOKE_SSO_PASSWORD SSO_CANARY_PASSWORD_PROD SSO_CANARY_PASSWORD_DEV SSO_CANARY_PASSWORD_STAGING; do
              secret_val="${!secret_var:-}"
              if [[ -n "$secret_val" ]]; then
                find "$ARTIFACT_DIR" -type f \( -name "*.txt" -o -name "*.log" -o -name "*.json" \) \
                  -exec perl -pi -e "s/\Q${secret_val}\E/***REDACTED***/g" {} + 2>/dev/null || true
              fi
            done
          done
          # Redact from loose log files in workspace root
          for secret_var in SMOKE_SSO_PASSWORD SSO_CANARY_PASSWORD_PROD SSO_CANARY_PASSWORD_DEV SSO_CANARY_PASSWORD_STAGING; do
            secret_val="${!secret_var:-}"
            if [[ -n "$secret_val" ]]; then
              find . -maxdepth 1 -type f -name "*.log" \
                -exec perl -pi -e "s/\Q${secret_val}\E/***REDACTED***/g" {} + 2>/dev/null || true
            fi
          done

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: smoke-authenticated-artifacts
          path: |
            var/screenshots/
            *.log
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────────────
  # SSO Canary — previously authenticated-sso-canary.yml (merged here).
  # Uses Python Playwright to test the full OIDC/Authentik SSO roundtrip
  # against LMS + Studio on prod and/or dev, with per-env credentials.
  # ──────────────────────────────────────────────────────────────────────────
  sso-canary:
    name: SSO Canary
    runs-on: mereka-k8s-runners
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-py-1.50.0-${{ runner.os }}

      - name: Install Playwright (Chromium)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.50.0"
          python -m playwright install chromium

      - name: Run SSO canary
        env:
          INPUT_ENV_SCOPE: ${{ github.event.inputs.env_scope || 'prod' }}
          SSO_CANARY_EMAIL_PROD: ${{ secrets.SSO_CANARY_EMAIL_PROD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_EMAIL_DEV: ${{ secrets.SSO_CANARY_EMAIL_DEV }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_EMAIL_STAGING: ${{ secrets.SSO_CANARY_EMAIL_STAGING }}
          SSO_CANARY_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_PASSWORD_STAGING }}
          SSO_CANARY_STUDIO_EMAIL_PROD: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_PROD }}
          SSO_CANARY_STUDIO_PASSWORD_PROD: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_PROD }}
          SSO_CANARY_STUDIO_EMAIL_DEV: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_DEV }}
          SSO_CANARY_STUDIO_PASSWORD_DEV: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_DEV }}
          SSO_CANARY_STUDIO_EMAIL_STAGING: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_STAGING }}
          SSO_CANARY_STUDIO_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_STAGING }}
          SSO_CANARY_EMAIL: ${{ secrets.SSO_CANARY_EMAIL }}
          SSO_CANARY_PASSWORD: ${{ secrets.SSO_CANARY_PASSWORD }}
          REQUIRE_SECRETS: '1'
          REQUIRE_STUDIO_CANARY: '0'
          SSO_CANARY_TIMEOUT_SECONDS: '180'
        run: ./scripts/qa/verify-authenticated-sso-canary.sh --env "$INPUT_ENV_SCOPE"

      - name: Sanitize canary artifacts
        if: always()
        env:
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_PASSWORD_STAGING }}
          SSO_CANARY_STUDIO_PASSWORD_PROD: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_PROD }}
          SSO_CANARY_STUDIO_PASSWORD_DEV: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_DEV }}
          SSO_CANARY_STUDIO_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_STAGING }}
          SSO_CANARY_PASSWORD: ${{ secrets.SSO_CANARY_PASSWORD }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="var/auth-sso-canary"
          [[ -d "$ARTIFACT_DIR" ]] || exit 0
          # Remove Playwright traces (contain full network payloads with credentials)
          find "$ARTIFACT_DIR" -type f -name "*.trace.zip" -delete 2>/dev/null || true
          # Redact known passwords from text logs using perl (safe with special chars)
          for secret_var in SSO_CANARY_PASSWORD_PROD SSO_CANARY_PASSWORD_DEV SSO_CANARY_PASSWORD_STAGING SSO_CANARY_STUDIO_PASSWORD_PROD SSO_CANARY_STUDIO_PASSWORD_DEV SSO_CANARY_STUDIO_PASSWORD_STAGING SSO_CANARY_PASSWORD; do
            secret_val="${!secret_var:-}"
            if [[ -n "$secret_val" ]]; then
              find "$ARTIFACT_DIR" -type f \( -name "*.txt" -o -name "*.log" -o -name "*.json" \) \
                -exec perl -pi -e "s/\Q${secret_val}\E/***REDACTED***/g" {} + 2>/dev/null || true
            fi
          done

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: sso-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/auth-sso-canary/
          retention-days: 30
