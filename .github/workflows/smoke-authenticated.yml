name: Authenticated Smoke Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target URL to test'
        required: false
        default: 'https://academyv2.mereka.io'
  # schedule:
  #   - cron: '0 */6 * * *'  # Every 6 hours (enable when ready)

permissions: {}

jobs:
  smoke-authenticated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '18'

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run authenticated smoke tests
        env:
          SMOKE_TARGET: ${{ github.event.inputs.target || 'https://academyv2.mereka.io' }}
          SSO_USERNAME: ${{ secrets.SMOKE_SSO_USERNAME }}
          SSO_PASSWORD: ${{ secrets.SMOKE_SSO_PASSWORD }}
        run: ./scripts/qa/smoke-authenticated.sh --target "$SMOKE_TARGET"

      - name: Run visual regression tests (authenticated)
        if: success() || failure()
        env:
          SSO_USERNAME: ${{ secrets.SMOKE_SSO_USERNAME }}
          SSO_PASSWORD: ${{ secrets.SMOKE_SSO_PASSWORD }}
        run: ./scripts/qa/visual-regression-test.sh --env production --authenticated || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: smoke-authenticated-artifacts
          path: |
            var/screenshots/
            *.log
          retention-days: 7
