name: E2E Critical Path Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target LMS URL (leave blank to use the canonical URL for the selected environment)'
        required: false
        default: ''
      environment:
        description: 'Target environment for canonical URL + credential fallback'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      course_id:
        description: 'Course ID for enroll/video/forum tests (e.g. course-v1:Mereka+TEST101+2024)'
        required: false
        default: ''
  # schedule:
  #   - cron: '0 6 * * *'  # Daily at 06:00 UTC (enable when credentials are configured)

permissions: {}

jobs:
  e2e-framework-verify:
    name: Verify E2E Framework (offline)
    runs-on: mereka-k8s-runners
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify E2E framework files (offline)
        run: ./scripts/qa/verify-e2e-framework.sh

      - name: Publish framework check summary
        if: always()
        run: |
          {
            echo "## E2E Framework Check (offline)"
            echo ""
            echo "Verified:"
            echo "- \`tests/e2e/playwright.config.ts\` exists"
            echo "- \`tests/e2e/package.json\` has @playwright/test"
            echo "- \`tests/e2e/tests/critical-path.spec.ts\` has 5 tests"
            echo "- @covers annotations present"
            echo "- BASE_URL env var wiring"
            echo "- Five critical paths: login, enroll, video, forum, certificate"
            echo "- Forum test uses /api/discussion/v2/ (Forum v2, in-process)"
            echo "- No Oscar ecommerce references (deprecated)"
            echo "- Node.js >= 18 engine constraint"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-critical-path:
    name: E2E Critical Path (${{ github.event.inputs.environment || 'staging' }})
    runs-on: mereka-k8s-runners
    timeout-minutes: 30
    # Only run if credentials are configured (avoid failing on PRs without secrets)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.E2E_ENABLED == 'true')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          node-version: '18'
          npm-cache-dependency-path: tests/e2e/package-lock.json

      - name: Install npm dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Resolve target environment and base URL
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          INPUT_TARGET: ${{ github.event.inputs.target || '' }}
        run: |
          set -euo pipefail
          environment="${INPUT_ENVIRONMENT:-staging}"
          default_target="https://staging.academyv2.mereka.io"

          if [[ "$environment" == "production" ]]; then
            default_target="https://academyv2.mereka.io"
          fi

          target="${INPUT_TARGET:-$default_target}"

          {
            echo "E2E_BASE_URL=$target"
            echo "E2E_ENVIRONMENT=$environment"
          } >> "$GITHUB_ENV"

      - name: Resolve E2E credential source
        env:
          E2E_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SSO_CANARY_EMAIL_PROD: ${{ secrets.SSO_CANARY_EMAIL_PROD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_EMAIL_STAGING: ${{ secrets.SSO_CANARY_EMAIL_STAGING }}
          SSO_CANARY_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_PASSWORD_STAGING }}
        run: |
          set -euo pipefail
          username="${E2E_USERNAME:-}"
          password="${E2E_PASSWORD:-}"
          source_label="E2E_TEST_* override"

          if [[ -z "$username" || -z "$password" ]]; then
            case "${E2E_ENVIRONMENT:-staging}" in
              staging)
                username="${username:-${SSO_CANARY_EMAIL_STAGING:-}}"
                password="${password:-${SSO_CANARY_PASSWORD_STAGING:-}}"
                source_label="SSO_CANARY_*_STAGING fallback"
                ;;
              *)
                username="${username:-${SSO_CANARY_EMAIL_PROD:-}}"
                password="${password:-${SSO_CANARY_PASSWORD_PROD:-}}"
                source_label="SSO_CANARY_*_PROD fallback"
                ;;
            esac
          fi

          if [[ -n "$password" ]]; then
            echo "::add-mask::$password"
          fi

          {
            echo "E2E_USERNAME<<EOF"
            echo "$username"
            echo "EOF"
            echo "E2E_PASSWORD<<EOF"
            echo "$password"
            echo "EOF"
            echo "E2E_SECRET_SOURCE=$source_label"
          } >> "$GITHUB_ENV"

      - name: Run E2E critical path tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_COURSE_ID: ${{ github.event.inputs.course_id || secrets.E2E_TEST_COURSE_ID }}
          E2E_CERT_URL: ${{ secrets.E2E_TEST_CERT_URL }}
          CI: 'true'
        run: npx playwright test

      - name: Sanitize test artifacts
        if: always()
        env:
          E2E_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_PASSWORD_STAGING: ${{ secrets.SSO_CANARY_PASSWORD_STAGING }}
        run: |
          set -euo pipefail
          for ARTIFACT_DIR in var/e2e-report var/e2e-artifacts; do
            [[ -d "$ARTIFACT_DIR" ]] || continue
            # Remove Playwright traces (contain full network payloads with credentials)
            find "$ARTIFACT_DIR" -type f -name "*.trace.zip" -delete 2>/dev/null || true
            # Redact known passwords from text logs using perl (safe with special chars)
            for secret_var in E2E_PASSWORD SSO_CANARY_PASSWORD_PROD SSO_CANARY_PASSWORD_STAGING; do
              secret_val="${!secret_var:-}"
              if [[ -n "$secret_val" ]]; then
                find "$ARTIFACT_DIR" -type f \( -name "*.txt" -o -name "*.log" -o -name "*.json" \) \
                  -exec perl -pi -e "s/\Q${secret_val}\E/***REDACTED***/g" {} + 2>/dev/null || true
              fi
            done
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: playwright-report
          path: var/e2e-report/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload test artifacts (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: playwright-artifacts
          path: var/e2e-artifacts/
          retention-days: 3
          if-no-files-found: ignore

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## E2E Critical Path Tests"
            echo ""
            echo "**Environment**: \`${E2E_ENVIRONMENT:-staging}\`"
            echo "**Target**: \`${E2E_BASE_URL}\`"
            echo ""
            echo "### Test coverage"
            echo "| # | Test | Description |"
            echo "|---|------|-------------|"
            echo "| 1 | Login | Authentik SSO → LMS session |"
            echo "| 2 | Enroll | Course about page → enrollment widget |"
            echo "| 3 | Video | Mux-hosted video player in courseware |"
            echo "| 4 | Forum | Forum v2 discussions MFE (Python, in-process) |"
            echo "| 5 | Certificate | Certificate page renders |"
            echo ""
            echo "### Notes"
            echo "- Default automated lane is \`staging\`; production remains an explicit manual target while parked"
            echo "- Authenticated tests use \`E2E_TEST_*\` overrides first, then fall back to the matching \`SSO_CANARY_*\` credentials"
            echo "- Credential source: \`${E2E_SECRET_SOURCE:-not resolved}\`"
            echo "- Set \`E2E_COURSE_ID\` secret or manual input for enroll/video/forum tests"
            echo "- Set \`E2E_CERT_URL\` secret for certificate test"
            echo "- Report artifact: \`playwright-report\`"
          } >> "$GITHUB_STEP_SUMMARY"
