name: Operations Gates Runtime

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      env_scope:
        description: "Environment scope for auth/multisite checks"
        required: false
        default: "both"
        type: choice
        options:
          - prod
          - dev
          - both
      strict_runtime:
        description: "Fail when runtime dependencies are unavailable"
        required: false
        default: true
        type: boolean
      run_alert_routing_audit:
        description: "Run alert routing verification inside operations gate"
        required: false
        default: true
        type: boolean
      run_authenticated_sso_canary:
        description: "Run credentialed browser SSO canary (requires canary secrets)"
        required: false
        default: false
        type: boolean

jobs:
  operations-gates:
    name: Run Operations Gates (Runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public auth surface checks (no cluster access)
        env:
          INPUT_ENV_SCOPE: ${{ github.event.inputs.env_scope || 'both' }}
        run: |
          ./scripts/qa/verify-auth-surfaces.sh "$INPUT_ENV_SCOPE"

      - name: Optional credentialed SSO canary (no cluster access)
        if: ${{ (github.event.inputs.run_authenticated_sso_canary == 'true') || (vars.RUN_AUTHENTICATED_SSO_CANARY == 'true') }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Optional credentialed SSO canary (no cluster access) - run
        if: ${{ (github.event.inputs.run_authenticated_sso_canary == 'true') || (vars.RUN_AUTHENTICATED_SSO_CANARY == 'true') }}
        env:
          INPUT_ENV_SCOPE: ${{ github.event.inputs.env_scope || 'both' }}
          SSO_CANARY_EMAIL_PROD: ${{ secrets.SSO_CANARY_EMAIL_PROD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_EMAIL_DEV: ${{ secrets.SSO_CANARY_EMAIL_DEV }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_STUDIO_EMAIL_PROD: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_PROD }}
          SSO_CANARY_STUDIO_PASSWORD_PROD: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_PROD }}
          SSO_CANARY_STUDIO_EMAIL_DEV: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_DEV }}
          SSO_CANARY_STUDIO_PASSWORD_DEV: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_DEV }}
          REQUIRE_SECRETS: "1"
          REQUIRE_STUDIO_CANARY: "0"
          SSO_CANARY_TIMEOUT_SECONDS: "180"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.50.0"
          python -m playwright install --with-deps chromium
          ./scripts/qa/verify-authenticated-sso-canary.sh --env "$INPUT_ENV_SCOPE"

      - name: Authenticate to GCP
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: mereka-lms

      - name: Get GKE credentials
        if: ${{ secrets.GCP_SA_KEY != '' }}
        env:
          GKE_CLUSTER_PROJECT: ${{ vars.GKE_CLUSTER_PROJECT || 'bbi-k8' }}
          GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION || 'asia-southeast1-c' }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'bbi-k8-cluster' }}
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'true' }}
        run: |
          if gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --project "$GKE_CLUSTER_PROJECT" \
            --zone "$GKE_CLUSTER_LOCATION"; then
            echo "CAN_RUN_RUNTIME=true" >> "$GITHUB_ENV"
          else
            echo "CAN_RUN_RUNTIME=false" >> "$GITHUB_ENV"
            if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
              echo "ERROR: unable to get GKE credentials (set strict_runtime=false to skip runtime gates)" >&2
              exit 1
            fi
            echo "WARN: unable to get GKE credentials; skipping runtime gates (strict_runtime=false)" >&2
          fi

      - name: Run consolidated operations gate
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        env:
          INPUT_ENV_SCOPE: ${{ github.event.inputs.env_scope || 'both' }}
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'true' }}
          INPUT_RUN_ALERT_ROUTING_AUDIT: ${{ github.event.inputs.run_alert_routing_audit || 'true' }}
          INPUT_RUN_AUTHENTICATED_SSO_CANARY: ${{ github.event.inputs.run_authenticated_sso_canary || vars.RUN_AUTHENTICATED_SSO_CANARY || 'false' }}
          SSO_CANARY_EMAIL_PROD: ${{ secrets.SSO_CANARY_EMAIL_PROD }}
          SSO_CANARY_PASSWORD_PROD: ${{ secrets.SSO_CANARY_PASSWORD_PROD }}
          SSO_CANARY_EMAIL_DEV: ${{ secrets.SSO_CANARY_EMAIL_DEV }}
          SSO_CANARY_PASSWORD_DEV: ${{ secrets.SSO_CANARY_PASSWORD_DEV }}
          SSO_CANARY_STUDIO_EMAIL_PROD: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_PROD }}
          SSO_CANARY_STUDIO_PASSWORD_PROD: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_PROD }}
          SSO_CANARY_STUDIO_EMAIL_DEV: ${{ secrets.SSO_CANARY_STUDIO_EMAIL_DEV }}
          SSO_CANARY_STUDIO_PASSWORD_DEV: ${{ secrets.SSO_CANARY_STUDIO_PASSWORD_DEV }}
          SSO_CANARY_EMAIL: ${{ secrets.SSO_CANARY_EMAIL }}
          SSO_CANARY_PASSWORD: ${{ secrets.SSO_CANARY_PASSWORD }}
        run: |
          if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
            export STRICT_RUNTIME=1
          else
            export STRICT_RUNTIME=0
          fi

          if [[ "$INPUT_RUN_ALERT_ROUTING_AUDIT" == "true" ]]; then
            export RUN_ALERT_ROUTING_AUDIT=1
          else
            export RUN_ALERT_ROUTING_AUDIT=0
          fi

          # VPS atlas monitor cron/status checks are host-local and not available in GH runner.
          export ALERT_ROUTING_RUN_ATLAS_VPS_AUDIT=0
          export RUN_ATLAS_ALLOWLIST_AUDIT=0
          # Runtime workflow must validate live exporter telemetry, not just local contracts.
          export RUN_DB_EXPORTER_TELEMETRY_AUDIT=1
          export DB_EXPORTER_AUDIT_MODE=runtime

          if [[ "$INPUT_RUN_AUTHENTICATED_SSO_CANARY" == "true" ]]; then
            export RUN_AUTHENTICATED_SSO_CANARY=1
            export AUTHENTICATED_SSO_CANARY_REQUIRE_SECRETS=1
            # Optional: only require Studio staff canary when secrets are present.
            require_studio=1
            if [[ "$INPUT_ENV_SCOPE" == "prod" || "$INPUT_ENV_SCOPE" == "both" ]]; then
              if [[ -z "${SSO_CANARY_STUDIO_EMAIL_PROD:-}" || -z "${SSO_CANARY_STUDIO_PASSWORD_PROD:-}" ]]; then
                require_studio=0
              fi
            fi
            if [[ "$INPUT_ENV_SCOPE" == "dev" || "$INPUT_ENV_SCOPE" == "both" ]]; then
              if [[ -z "${SSO_CANARY_STUDIO_EMAIL_DEV:-}" || -z "${SSO_CANARY_STUDIO_PASSWORD_DEV:-}" ]]; then
                require_studio=0
              fi
            fi
            export REQUIRE_STUDIO_CANARY="$require_studio"
          else
            export RUN_AUTHENTICATED_SSO_CANARY=0
          fi

          ./scripts/qa/run-operations-gates.sh --env "$INPUT_ENV_SCOPE"

      - name: Upload operations gate artifacts
        if: ${{ always() && env.CAN_RUN_RUNTIME == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: operations-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/operations-gates/
          retention-days: 30
