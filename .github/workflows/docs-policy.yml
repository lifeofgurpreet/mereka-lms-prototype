name: Docs Policy Gates

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs-policy.yml"
      - "docs/qa/verify-docs-policy.sh"

permissions: {}

jobs:
  docs-policy:
    name: Enforce docs anti-regression gates
    runs-on: mereka-k8s-runners
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify docs policy
        env:
          DOCS_POLICY_RANGE: ${{ github.event.before }}...${{ github.sha }}
        run: |
          chmod +x docs/qa/verify-docs-policy.sh
          ./docs/qa/verify-docs-policy.sh
