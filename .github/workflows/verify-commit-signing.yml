name: Verify Commit Signing

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC
  workflow_dispatch:

permissions: {}

jobs:
  verify-commit-signing:
    name: Commit Signing Check (soft gate)
    runs-on: mereka-k8s-runners
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify commit signing
        run: |
          set -euo pipefail
          mkdir -p var/ci
          ./scripts/qa/verify-commit-signing.sh --count 20 --threshold 50 \
            | tee var/ci/commit-signing-verify.log

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## Commit Signing Verification"
            echo ""
            echo "### What was checked"
            echo "- Last 20 commits on this branch"
            echo "- Signature status per commit (\`G\`=good, \`U\`=unknown key, \`X/Y\`=expired, \`N\`=unsigned, \`E/B\`=error)"
            echo "- Soft-gate threshold: 50% signed"
            echo ""
            echo "### Gate mode"
            echo "This check is currently **informational only** (\`continue-on-error: true\`)."
            echo "It will not block merges during the adoption ramp-up period."
            echo ""
            echo "### Next steps"
            echo "- See \`docs/reference/operations/COMMIT_SIGNING.md\` for setup instructions"
            echo "- GPG, SSH, or Sigstore Gitsign all produce valid signatures"
            echo "- Migration plan: soft gate → hard gate timeline is in the doc above"
            echo ""
            if [[ -f var/ci/commit-signing-verify.log ]]; then
              echo "### Script output"
              echo "\`\`\`"
              cat var/ci/commit-signing-verify.log
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: commit-signing-verify-logs
          path: var/ci/commit-signing-verify.log
          retention-days: 3
          if-no-files-found: warn
