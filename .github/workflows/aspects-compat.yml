name: Aspects Version Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'requirements*'
      - 'tutor_env/config*'
  schedule:
    - cron: '0 6 * * 1'  # weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  aspects-compat:
    name: Aspects Version Compatibility Check
    runs-on: mereka-k8s-runners
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run Aspects compatibility check
        run: |
          bash scripts/qa/verify-aspects-compat.sh
