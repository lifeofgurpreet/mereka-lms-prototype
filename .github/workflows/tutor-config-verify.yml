# @covers AC-TCR-006
# @spec: tutor-configuration-resilience_spec.md
name: Tutor Config Verification

on:
  push:
    paths:
      - 'tutor_env/config.yml'
      - 'infrastructure/tutor/**'
  pull_request:
    paths:
      - 'tutor_env/config.yml'
      - 'infrastructure/tutor/**'
  workflow_dispatch:

jobs:
  verify-patches:
    name: Verify Patches Applied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tutor and dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install "tutor[full]==18.2.2" tutor-mfe==18.1.0
          pip install pyyaml jinja2

      - name: Set Tutor environment
        run: |
          echo "TUTOR_ROOT=$(pwd)/tutor_env" >> $GITHUB_ENV

      - name: Generate clean config
        run: |
          source .venv/bin/activate
          mkdir -p tutor_env
          cp infrastructure/tutor/config.example.yml tutor_env/config.yml
          tutor config save

      - name: Apply patches
        run: |
          source .venv/bin/activate
          ./infrastructure/tutor/apply-patches.sh

      - name: Verify MySQL authentication patch
        run: |
          if ! grep -q "mysql_native_password" tutor_env/env/local/docker-compose.yml; then
            echo "❌ AC-001 FAILED: MySQL native password patch not applied"
            exit 1
          fi
          echo "✅ AC-001 PASSED: MySQL authentication patch applied"

      - name: Verify MFE Node.js patch
        run: |
          if ! grep -q "NODE_OPTIONS.*6144" tutor_env/env/build/openedx/Dockerfile; then
            echo "❌ AC-002 FAILED: MFE Node.js memory patch not applied"
            exit 1
          fi
          echo "✅ AC-002 PASSED: MFE Node.js patch applied"

      - name: Upload patch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-failure-artifacts
          path: |
            tutor_env/env/local/docker-compose.yml
            tutor_env/env/build/openedx/Dockerfile
            tutor_env/env/apps/openedx/settings/lms/production.py

  verify-multi-site-domains:
    name: Verify Multi-Site Domains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tutor and dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install "tutor[full]==18.2.2" tutor-mfe==18.1.0
          pip install pyyaml jinja2

      - name: Set Tutor environment
        run: |
          echo "TUTOR_ROOT=$(pwd)/tutor_env" >> $GITHUB_ENV

      - name: Generate clean config
        run: |
          source .venv/bin/activate
          mkdir -p tutor_env
          cp infrastructure/tutor/config.example.yml tutor_env/config.yml
          tutor config save

      - name: Apply patches
        run: |
          source .venv/bin/activate
          ./infrastructure/tutor/apply-patches.sh

      - name: Verify all production domains in ALLOWED_HOSTS
        run: |
          SETTINGS_FILE="tutor_env/env/apps/openedx/settings/lms/production.py"
          if [ ! -f "$SETTINGS_FILE" ]; then
            echo "❌ AC-003 FAILED: LMS settings file not found"
            exit 1
          fi

          MISSING_DOMAINS=""
          for domain in "academy.biji-biji.com" "skillourfuture.academy.mereka.io" "academyv2.mereka.io"; do
            if ! grep -q "$domain" "$SETTINGS_FILE"; then
              MISSING_DOMAINS="$MISSING_DOMAINS $domain"
            fi
          done

          if [ -n "$MISSING_DOMAINS" ]; then
            echo "❌ AC-003 FAILED: Missing domains in ALLOWED_HOSTS:$MISSING_DOMAINS"
            exit 1
          fi
          echo "✅ AC-003 PASSED: All production domains present in ALLOWED_HOSTS"

      - name: Verify CSRF_TRUSTED_ORIGINS includes all domains
        run: |
          SETTINGS_FILE="tutor_env/env/apps/openedx/settings/lms/production.py"
          MISSING_ORIGINS=""

          for origin in "https://academy.biji-biji.com" "https://skillourfuture.academy.mereka.io" "https://academyv2.mereka.io" "https://apps.academyv2.mereka.io"; do
            if ! grep -q "$origin" "$SETTINGS_FILE"; then
              MISSING_ORIGINS="$MISSING_ORIGINS $origin"
            fi
          done

          if [ -n "$MISSING_ORIGINS" ]; then
            echo "❌ FAILED: Missing origins in CSRF_TRUSTED_ORIGINS:$MISSING_ORIGINS"
            exit 1
          fi
          echo "✅ PASSED: All CSRF trusted origins configured"

      - name: Verify SESSION_COOKIE_DOMAIN set correctly
        run: |
          SETTINGS_FILE="tutor_env/env/apps/openedx/settings/lms/production.py"
          if ! grep -q 'SESSION_COOKIE_DOMAIN.*academyv2\.mereka\.io' "$SETTINGS_FILE"; then
            echo "❌ FAILED: SESSION_COOKIE_DOMAIN not set correctly"
            exit 1
          fi
          echo "✅ PASSED: SESSION_COOKIE_DOMAIN configured for cross-subdomain sessions"

  verify-enterprise-features:
    name: Verify Enterprise Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tutor and dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install "tutor[full]==18.2.2" tutor-mfe==18.1.0
          pip install pyyaml jinja2

      - name: Set Tutor environment
        run: |
          echo "TUTOR_ROOT=$(pwd)/tutor_env" >> $GITHUB_ENV

      - name: Generate clean config
        run: |
          source .venv/bin/activate
          mkdir -p tutor_env
          cp infrastructure/tutor/config.example.yml tutor_env/config.yml
          tutor config save

      - name: Apply patches
        run: |
          source .venv/bin/activate
          ./infrastructure/tutor/apply-patches.sh

      - name: Verify custom apps installed
        run: |
          SETTINGS_FILE="tutor_env/env/apps/openedx/settings/lms/production.py"

          if ! grep -q "mfe_oauth_fix" "$SETTINGS_FILE"; then
            echo "❌ AC-004 FAILED: mfe_oauth_fix app not installed"
            exit 1
          fi
          echo "✅ AC-004 PASSED: mfe_oauth_fix app installed"

          if ! grep -q "django_prometheus" "$SETTINGS_FILE"; then
            echo "❌ AC-005 FAILED: django_prometheus not installed"
            exit 1
          fi
          echo "✅ AC-005 PASSED: django_prometheus installed"

      - name: Verify Redwood compatibility apps
        run: |
          SETTINGS_FILE="tutor_env/env/apps/openedx/settings/lms/production.py"

          for app in "content_libraries" "bookmarks" "discussions" "theming"; do
            if ! grep -q "$app" "$SETTINGS_FILE"; then
              echo "⚠️ WARNING: Redwood app $app may not be installed"
            fi
          done
          echo "✅ PASSED: Redwood compatibility verified"

  verify-idempotency:
    name: Verify Patch Idempotency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tutor and dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install "tutor[full]==18.2.2" tutor-mfe==18.1.0
          pip install pyyaml jinja2

      - name: Set Tutor environment
        run: |
          echo "TUTOR_ROOT=$(pwd)/tutor_env" >> $GITHUB_ENV

      - name: Generate clean config
        run: |
          source .venv/bin/activate
          mkdir -p tutor_env
          cp infrastructure/tutor/config.example.yml tutor_env/config.yml
          tutor config save

      - name: Apply patches first time
        run: |
          source .venv/bin/activate
          ./infrastructure/tutor/apply-patches.sh

      - name: Capture first run checksums
        run: |
          find tutor_env/env -type f -name "*.py" -o -name "*.yml" -o -name "Dockerfile" | \
            sort | xargs sha256sum > /tmp/checksums-1.txt

      - name: Apply patches second time
        run: |
          source .venv/bin/activate
          ./infrastructure/tutor/apply-patches.sh

      - name: Capture second run checksums
        run: |
          find tutor_env/env -type f -name "*.py" -o -name "*.yml" -o -name "Dockerfile" | \
            sort | xargs sha256sum > /tmp/checksums-2.txt

      - name: Verify idempotency
        run: |
          if ! diff /tmp/checksums-1.txt /tmp/checksums-2.txt; then
            echo "❌ FAILED: Patch script is not idempotent"
            exit 1
          fi
          echo "✅ PASSED: Patch script is idempotent"

  post-failure-comment:
    name: Post PR Comment on Failure
    runs-on: ubuntu-latest
    needs: [verify-patches, verify-multi-site-domains, verify-enterprise-features]
    if: failure() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post failure comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ❌ Tutor Configuration Verification Failed

            One or more Tutor configuration checks failed. This usually means patches were not applied correctly.

            ### Common Issues

            1. **Missing MySQL Authentication Patch**
               - Symptom: \`mysql_native_password\` not found in docker-compose.yml
               - Fix: Verify \`infrastructure/tutor/apply-patches.sh\` applies MySQL auth patch

            2. **Missing Multi-Site Domains**
               - Symptom: Production domains not in ALLOWED_HOSTS or CSRF_TRUSTED_ORIGINS
               - Fix: Check that \`apply-patches.sh\` adds all domains to LMS settings

            3. **Missing Custom Apps**
               - Symptom: \`mfe_oauth_fix\` or \`django_prometheus\` not installed
               - Fix: Ensure custom app patches are applied

            ### How to Fix

            \`\`\`bash
            # Re-run patch application
            export TUTOR_ROOT="\$(pwd)/tutor_env"
            ./infrastructure/tutor/apply-patches.sh

            # Verify patches applied
            make validate-tutor-config
            \`\`\`

            See [Tutor Configuration Spec](specs/tutor-configuration_spec.md) for full requirements.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
