# @spec: mobile-apps-secrets-management_spec.md
# @covers AC-MAS-008, AC-MAS-010, AC-MAS-012, AC-MAS-019, AC-MAS-020, AC-MAS-021
name: Mobile Secrets Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-app.yml'
      - '.github/workflows/build-android-app.yml'
      - 'deploy/k8s/base/secrets/external-secrets-mobile.yaml'
      - 'scripts/mobile/**'
      - 'mobile/**'
      - '.github/workflows/mobile-secrets-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ios-app.yml'
      - '.github/workflows/build-android-app.yml'
      - 'deploy/k8s/base/secrets/external-secrets-mobile.yaml'
      - 'scripts/mobile/**'
      - 'mobile/**'
      - '.github/workflows/mobile-secrets-check.yml'
  merge_group:
  schedule:
    # Weekly on Monday at 09:00 UTC — catches drift even without code changes
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  mobile-secrets-check:
    name: Mobile Secrets Offline Check
    runs-on: mereka-k8s-runners
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Script syntax check
        run: bash -n scripts/qa/verify-mobile-secrets-runtime.sh

      - name: Run mobile secrets verification (offline)
        # Non-blocking initially: the iOS build workflow and mobile ExternalSecret
        # are partially implemented. Promote to blocking once AC-MAS-008/010/012 pass.
        continue-on-error: true
        run: ./scripts/qa/verify-mobile-secrets-runtime.sh --offline
