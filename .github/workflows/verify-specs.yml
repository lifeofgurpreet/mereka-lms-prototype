# @covers AC-RS-001, AC-RS-002, AC-RS-003, AC-RS-004
# @spec: repository-structure_spec.md
name: Verify Specifications

on:
  pull_request:
    branches: [main]
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'scripts/qa/**'
      - 'tests/**'
      - '.github/workflows/verify-specs.yml'
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'scripts/qa/**'
      - 'tests/**'
      - '.github/workflows/verify-specs.yml'
  workflow_dispatch:
    inputs:
      verification_level:
        description: 'Verification level'
        required: false
        type: choice
        options:
          - 'fast'
          - 'full'
        default: 'full'

jobs:
  # Fast checks for PRs (must complete <5 min)
  fast-verification:
    name: Fast Verification (PR)
    runs-on: ubuntu-latest
    # Run on PRs and push to main
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pyyaml ruff yamllint

      - name: Documentation standards check
        run: |
          bash scripts/qa/verify-documentation-standards.sh

      - name: Spec coverage report (no execution)
        run: |
          mkdir -p var
          python3 scripts/qa/spec-tools/spec_coverage_report.py \
            --specs-dir specs/ \
            --repo-root . \
            --format markdown \
            --output var/spec-coverage-pr.md

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-coverage-pr
          path: var/spec-coverage-pr.md
          retention-days: 7

      - name: Lint specs
        run: |
          python3 scripts/qa/spec-tools/mereka_spec_lint.py specs/ --severity-filter error

      - name: Validate testmap format
        run: |
          python3 scripts/qa/spec-tools/validate_testmap_format.py specs/testmaps/

      - name: Markdown linting
        run: |
          # Install markdownlint-cli
          npm install -g markdownlint-cli
          # Lint with warnings (non-blocking)
          markdownlint docs/ specs/ --ignore docs/archive/ || true

      - name: Check for broken internal links
        run: |
          # Simple grep-based link checker for markdown files
          bash scripts/qa/verify-documentation-links.sh || true

  # Full verification suite on merge to main
  full-verification:
    name: Full Verification Suite
    runs-on: ubuntu-latest
    # Run on push to main or manual workflow_dispatch with 'full' level
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.verification_level == 'full')
    strategy:
      fail-fast: false
      matrix:
        verification_group:
          - name: 'repository-structure'
            scripts:
              - 'verify-repo-structure.sh'
              - 'verify-documentation-standards.sh'
          - name: 'secrets-management'
            scripts:
              - 'verify-secrets-management.sh'
              - 'verify-secrets-naming-convention.sh'
              - 'verify-secrets-inventory.sh'
              - 'verify-no-hardcoded-secrets.sh'
              - 'verify-dev-prod-secret-separation.sh'
          - name: 'k8s-deployment'
            scripts:
              - 'verify-k8s-deployment-spec.sh'
              - 'verify-k8s-externalsecrets.sh'
              - 'verify-k8s-images.sh'
              - 'verify-k8s-secrets-hygiene.sh'
              - 'verify-kustomize-render.sh'
              - 'verify-kustomize-no-deprecated-keys.sh'
          - name: 'mongodb-atlas'
            scripts:
              - 'verify-mongodb-atlas-integration.sh'
              - 'verify-atlas-data-persistence.sh'
              - 'verify-atlas-modulestore-path.sh'
          - name: 'multisite'
            scripts:
              - 'verify-multisite-config.sh'
              - 'verify-tutor-multisite-domains.sh'
              - 'verify-csrf-multisite.sh'
              - 'verify-favicon-multisite.sh'
          - name: 'branding'
            scripts:
              - 'verify-public-branding.sh'
              - 'verify-studio-authoring-branding.sh'
              - 'verify-tutor-branding-render.sh'
              - 'verify-mfe-image-branding.sh'
          - name: 'forum'
            scripts:
              - 'verify-forum-service.sh'
              - 'verify-forum-migration-contracts.sh'
          - name: 'tutor-config'
            scripts:
              - 'verify-tutor-patches.sh'
              - 'verify-idempotency.sh'
          - name: 'observability'
            scripts:
              - 'verify-observability-stack.sh'
              - 'verify-sentry-wiring.sh'
              - 'verify-sentry-cli-contract.sh'
              - 'verify-alert-routing.sh'
              - 'verify-sli-foundation.sh'
              - 'verify-error-budget.sh'
          - name: 'cicd'
            scripts:
              - 'verify-cicd-merge-gates-and-secrets.sh'
              - 'verify-build-workflow-contract.sh'
              - 'verify-release-automation.sh'
              - 'verify-release-workflow-invocation.sh'
              - 'verify-release-dry-run-contract.sh'
              - 'verify-release-evidence-workflow.sh'
              - 'verify-deployment-gate.sh'
          - name: 'mfe'
            scripts:
              - 'verify-mfe-build-contract.sh'
              - 'verify-mfe-build-prereqs.sh'
              - 'verify-mfe-config-contract.sh'
          - name: 'auth'
            scripts:
              - 'verify-auth-hardening.sh'
              - 'verify-oidc-provider-configs.sh'
              - 'verify-oidc-cookie-middleware-order.sh'
              - 'verify-oidc-user-password-state.sh'
              - 'verify-jwt-uniqueness.sh'
              - 'verify-cms-oauth2-secret-present.sh'
          - name: 'migrations'
            scripts:
              - 'verify-data-migration-contracts.sh'
              - 'verify-kajabi-export.sh'
              - 'verify-kajabi-transform.sh'
              - 'verify-kajabi-olx-packages.sh'
              - 'verify-kajabi-thumbnails.sh'
              - 'verify-kajabi-completions-export.sh'
              - 'verify-mct-export.sh'
              - 'verify-mct-transform.sh'
              - 'verify-mct-olx-packages.sh'
              - 'verify-mct-video-urls.sh'
          - name: 'enterprise'
            scripts:
              - 'verify-enterprise-service-deployment.sh'
              - 'verify-enterprise-secrets.sh'
              - 'verify-enterprise-catalog.sh'
              - 'verify-enterprise-access-subsidy.sh'
              - 'verify-enterprise-license-management.sh'
              - 'verify-enterprise-integrated-channels.sh'
              - 'verify-enterprise-tenant-isolation.sh'
              - 'verify-enterprise-sso-saml.sh'
              - 'verify-enterprise-observability.sh'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pyyaml jinja2

      - name: Run verification group - ${{ matrix.verification_group.name }}
        id: verify
        run: |
          PASS=0
          FAIL=0
          SKIP=0
          TIMEOUT=0

          mkdir -p var/verification-results
          RESULT_FILE="var/verification-results/${{ matrix.verification_group.name }}.txt"

          echo "=== Verification Group: ${{ matrix.verification_group.name }} ===" | tee "$RESULT_FILE"
          echo "" | tee -a "$RESULT_FILE"

          # Parse matrix scripts (YAML array format)
          SCRIPTS=($(echo '${{ toJson(matrix.verification_group.scripts) }}' | jq -r '.[]'))

          for script_name in "${SCRIPTS[@]}"; do
            script_path="scripts/qa/$script_name"

            if [[ ! -f "$script_path" ]]; then
              echo "SKIP $script_name (not found)" | tee -a "$RESULT_FILE"
              SKIP=$((SKIP + 1))
              continue
            fi

            echo "Running $script_name..." | tee -a "$RESULT_FILE"

            if timeout 120 bash "$script_path" > "var/verification-results/${script_name}.log" 2>&1; then
              echo "✓ PASS $script_name" | tee -a "$RESULT_FILE"
              PASS=$((PASS + 1))
            else
              exit_code=$?
              if [[ $exit_code -eq 124 ]]; then
                echo "⏱ TIMEOUT $script_name" | tee -a "$RESULT_FILE"
                TIMEOUT=$((TIMEOUT + 1))
              else
                echo "✗ FAIL $script_name" | tee -a "$RESULT_FILE"
                echo "  Last 10 lines:" | tee -a "$RESULT_FILE"
                tail -10 "var/verification-results/${script_name}.log" | sed 's/^/    /' | tee -a "$RESULT_FILE"
                FAIL=$((FAIL + 1))
              fi
            fi
          done

          echo "" | tee -a "$RESULT_FILE"
          echo "=== Summary for ${{ matrix.verification_group.name }} ===" | tee -a "$RESULT_FILE"
          echo "Passed: $PASS" | tee -a "$RESULT_FILE"
          echo "Failed: $FAIL" | tee -a "$RESULT_FILE"
          echo "Timeout: $TIMEOUT" | tee -a "$RESULT_FILE"
          echo "Skipped: $SKIP" | tee -a "$RESULT_FILE"

          # Export for later steps
          echo "pass_count=$PASS" >> $GITHUB_OUTPUT
          echo "fail_count=$FAIL" >> $GITHUB_OUTPUT
          echo "timeout_count=$TIMEOUT" >> $GITHUB_OUTPUT
          echo "skip_count=$SKIP" >> $GITHUB_OUTPUT

          # Fail job if critical scripts failed
          if [[ $FAIL -gt 0 ]]; then
            echo "::error::$FAIL verification script(s) failed in group ${{ matrix.verification_group.name }}"
            exit 1
          fi

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ matrix.verification_group.name }}
          path: var/verification-results/
          retention-days: 30

      - name: Comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const group = '${{ matrix.verification_group.name }}';
            const pass = ${{ steps.verify.outputs.pass_count || 0 }};
            const fail = ${{ steps.verify.outputs.fail_count || 0 }};
            const timeout = ${{ steps.verify.outputs.timeout_count || 0 }};
            const skip = ${{ steps.verify.outputs.skip_count || 0 }};

            const body = `## ❌ Verification Failed: ${group}

            **Summary**:
            - ✓ Passed: ${pass}
            - ✗ Failed: ${fail}
            - ⏱ Timeout: ${timeout}
            - ⊘ Skipped: ${skip}

            Check the workflow logs for detailed output and artifacts for complete results.

            **Next Steps**:
            1. Review failed scripts in workflow logs
            2. Download verification results artifact
            3. Fix issues and re-run verification

            See [docs/DOCUMENTATION_STANDARDS.md](docs/DOCUMENTATION_STANDARDS.md) for requirements.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # Aggregate results from all verification groups
  aggregate-results:
    name: Aggregate Verification Results
    runs-on: ubuntu-latest
    needs: full-verification
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all verification results
        uses: actions/download-artifact@v4
        with:
          path: var/all-verification-results/
          pattern: verification-results-*

      - name: Generate summary report
        run: |
          mkdir -p var
          SUMMARY_FILE="var/verification-summary.md"

          echo "# Verification Summary Report" > "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$SUMMARY_FILE"
          echo "**Commit**: ${{ github.sha }}" >> "$SUMMARY_FILE"
          echo "**Branch**: ${{ github.ref_name }}" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          TOTAL_PASS=0
          TOTAL_FAIL=0
          TOTAL_TIMEOUT=0
          TOTAL_SKIP=0

          echo "## Results by Group" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "| Group | Pass | Fail | Timeout | Skip |" >> "$SUMMARY_FILE"
          echo "|-------|------|------|---------|------|" >> "$SUMMARY_FILE"

          # Aggregate from downloaded artifacts
          for result_dir in var/all-verification-results/verification-results-*/; do
            if [[ -d "$result_dir" ]]; then
              group_name=$(basename "$result_dir" | sed 's/verification-results-//')
              result_file="${result_dir}${group_name}.txt"

              if [[ -f "$result_file" ]]; then
                pass=$(grep "^Passed:" "$result_file" | awk '{print $2}')
                fail=$(grep "^Failed:" "$result_file" | awk '{print $2}')
                timeout=$(grep "^Timeout:" "$result_file" | awk '{print $2}')
                skip=$(grep "^Skipped:" "$result_file" | awk '{print $2}')

                echo "| $group_name | $pass | $fail | $timeout | $skip |" >> "$SUMMARY_FILE"

                TOTAL_PASS=$((TOTAL_PASS + pass))
                TOTAL_FAIL=$((TOTAL_FAIL + fail))
                TOTAL_TIMEOUT=$((TOTAL_TIMEOUT + timeout))
                TOTAL_SKIP=$((TOTAL_SKIP + skip))
              fi
            fi
          done

          echo "" >> "$SUMMARY_FILE"
          echo "## Overall Summary" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "- ✓ **Passed**: $TOTAL_PASS" >> "$SUMMARY_FILE"
          echo "- ✗ **Failed**: $TOTAL_FAIL" >> "$SUMMARY_FILE"
          echo "- ⏱ **Timeout**: $TOTAL_TIMEOUT" >> "$SUMMARY_FILE"
          echo "- ⊘ **Skipped**: $TOTAL_SKIP" >> "$SUMMARY_FILE"

          TOTAL_RUN=$((TOTAL_PASS + TOTAL_FAIL + TOTAL_TIMEOUT))
          if [[ $TOTAL_RUN -gt 0 ]]; then
            SUCCESS_RATE=$(awk "BEGIN {printf \"%.1f\", ($TOTAL_PASS / $TOTAL_RUN) * 100}")
            echo "" >> "$SUMMARY_FILE"
            echo "**Success Rate**: ${SUCCESS_RATE}% ($TOTAL_PASS/$TOTAL_RUN)" >> "$SUMMARY_FILE"
          fi

          echo "" >> "$SUMMARY_FILE"
          echo "---" >> "$SUMMARY_FILE"
          echo "*Generated by verify-specs.yml workflow*" >> "$SUMMARY_FILE"

          cat "$SUMMARY_FILE"

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary
          path: var/verification-summary.md
          retention-days: 90

      - name: Check critical failures
        run: |
          TOTAL_FAIL=0
          for result_dir in var/all-verification-results/verification-results-*/; do
            if [[ -d "$result_dir" ]]; then
              group_name=$(basename "$result_dir" | sed 's/verification-results-//')
              result_file="${result_dir}${group_name}.txt"

              if [[ -f "$result_file" ]]; then
                fail=$(grep "^Failed:" "$result_file" | awk '{print $2}')
                TOTAL_FAIL=$((TOTAL_FAIL + fail))
              fi
            fi
          done

          if [[ $TOTAL_FAIL -gt 0 ]]; then
            echo "::error::$TOTAL_FAIL total verification script(s) failed"
            exit 1
          fi

          echo "✅ All verification scripts passed"

  # Comment summary on PR
  pr-summary:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs: fast-verification
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: spec-coverage-pr
          path: var/

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverageContent = '';

            try {
              coverageContent = fs.readFileSync('var/spec-coverage-pr.md', 'utf8');
            } catch (error) {
              coverageContent = '_Coverage report not available_';
            }

            const status = '${{ needs.fast-verification.result }}';
            const statusEmoji = status === 'success' ? '✅' : '❌';

            const body = `## ${statusEmoji} Specification Verification

            **Fast verification completed**: ${status}

            ### Spec Coverage

            <details>
            <summary>View coverage report</summary>

            ${coverageContent}

            </details>

            ### Next Steps

            ${status === 'success'
              ? '- ✅ Fast verification passed\n- Full verification will run on merge to main'
              : '- ❌ Some checks failed - review workflow logs\n- Fix issues before merging'}

            ---
            *Automated by verify-specs.yml workflow*
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Specification Verification')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
