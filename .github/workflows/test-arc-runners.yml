# Temporary workflow to verify ARC self-hosted runners
# DELETE after confirming runners work
name: Test ARC Runners

permissions: {}  # Deny-all at workflow level; each job grants only what it needs

on:
  workflow_dispatch:

jobs:
  test-standard:
    runs-on: mereka-k8s-runners
    permissions: {}  # No code checkout or GitHub API calls — no permissions needed
    steps:
      - name: Runner info
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $(uname -a)"
          echo "CPU: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "Disk: $(df -h / | tail -1 | awk '{print $4}')"
          echo "SUCCESS: Standard runner works!"

  test-heavy:
    runs-on: mereka-k8s-heavy-builders
    permissions: {}  # No code checkout or GitHub API calls — no permissions needed
    steps:
      - name: Runner info
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $(uname -a)"
          echo "CPU: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "Disk: $(df -h / | tail -1 | awk '{print $4}')"
          echo "SUCCESS: Heavy builder runner works!"
