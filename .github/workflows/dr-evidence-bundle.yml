# @covers AC-010
# @spec: disaster-recovery-business-continuity_spec.md
name: DR Evidence Bundle

on:
  schedule:
    - cron: '30 2 1 * *'
  workflow_dispatch:
    inputs:
      strict_runtime:
        description: "Fail when runtime dependencies are unavailable"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  dr-evidence:
    name: Build DR Evidence Bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
        with:
          project_id: mereka-lms

      - name: Get GKE credentials
        env:
          GKE_CLUSTER_PROJECT: ${{ vars.GKE_CLUSTER_PROJECT || 'bbi-k8' }}
          GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION || 'asia-southeast1-c' }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'bbi-k8-cluster' }}
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'true' }}
        run: |
          if gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --project "$GKE_CLUSTER_PROJECT" \
            --zone "$GKE_CLUSTER_LOCATION"; then
            echo "CAN_RUN_RUNTIME=true" >> "$GITHUB_ENV"
          else
            echo "CAN_RUN_RUNTIME=false" >> "$GITHUB_ENV"
            if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
              echo "ERROR: unable to get GKE credentials (set strict_runtime=false to skip runtime evidence)" >&2
              exit 1
            fi
            echo "WARN: unable to get GKE credentials; skipping runtime evidence (strict_runtime=false)" >&2
          fi

      - name: Prepare output path
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        run: |
          echo "EVIDENCE_DIR=var/dr-evidence/github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build DR evidence bundle
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        env:
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'true' }}
        run: |
          if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
            export STRICT_RUNTIME=1
          else
            export STRICT_RUNTIME=0
          fi

          ./scripts/qa/build-dr-evidence-bundle.sh --out-dir "$EVIDENCE_DIR" --tar

      - name: Upload DR evidence artifacts
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_DIR }}
            ${{ env.EVIDENCE_DIR }}.tar.gz
          retention-days: 120
