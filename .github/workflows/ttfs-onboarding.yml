name: TTFS Onboarding Flow Verification

on:
  workflow_dispatch:

permissions: {}

jobs:
  ttfs-onboarding:
    name: Verify TTFS Onboarding Funnel Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Verify TTFS onboarding funnel config (offline)
        run: |
          set -euo pipefail
          mkdir -p var/ci
          ./scripts/qa/verify-ttfs-onboarding.sh | tee var/ci/ttfs-onboarding-verify.log

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## TTFS Onboarding Flow Verification"
            echo ""
            echo "### What was checked"
            echo "- Registration endpoint referenced in LMS config (\`FRONTEND_REGISTER_URL\`, \`/register\`)"
            echo "- Enrollment API referenced in deployment settings"
            echo "- Course discovery service route present in Caddy + OAuth2 secrets in ExternalSecrets"
            echo "- Courseware URLs (\`/learning/course/*\`) present in MFE Caddyfile"
            echo "- SMTP/email credentials referenced in deployments or settings (email verification)"
            echo "- MFE authn route (\`/authn/login\`, \`/authn/register\`) present in MFE Caddyfile"
            echo ""
            echo "### Funnel steps verified"
            echo "1. Registration → account created, verification email dispatched"
            echo "2. Login → JWT session established, redirect to Dashboard"
            echo "3. Course Enrollment → \`POST /api/enrollment/v1/enrollment\`"
            echo "4. First Lesson Completion → courseware reachable via \`/learning/course/\`"
            echo ""
            echo "### Next steps"
            echo "- For live funnel testing, see \`docs/operations/TTFS_ONBOARDING.md\`"
            echo "- For performance budgets at each step, see \`docs/operations/LIGHTHOUSE_BUDGETS.md\`"
            echo ""
            echo "Log artifacts: \`var/ci/ttfs-onboarding-verify.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ttfs-onboarding-verify-logs
          path: var/ci/ttfs-onboarding-verify.log
          if-no-files-found: warn
