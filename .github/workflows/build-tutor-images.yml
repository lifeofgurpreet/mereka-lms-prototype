name: Build Tutor Images

permissions:
  contents: read
  packages: write
  id-token: write
on:
  push:
    branches:
      - main
    paths:
      - 'requirements-tutor.txt'
      - '.github/actions/setup-python-env/**'
      - 'infrastructure/tutor/config.example.yml'
      - 'infrastructure/tutor/apply-patches.sh'
      - 'infrastructure/tutor/patches/**'
      - 'infrastructure/tutor/custom-apps/**'
      - 'infrastructure/tutor/plugins/**'
      - 'infrastructure/tutor/themes/**'
      - 'infrastructure/tutor/brand-*/**'
      - 'assets/branding/**'
      - 'infrastructure/tutor/apply-patches.sh'
      - 'infrastructure/tutor/patches/**'
      - 'scripts/infra/resolve-build-scope.sh'
      - 'scripts/infra/install-cosign.sh'
      - 'scripts/infra/generate-build-provenance.sh'
      - 'scripts/infra/generate-release-bundle.sh'
      - 'scripts/infra/release-openedx-gitops.sh'
      - 'scripts/infra/resolve-image-digest.sh'
      - 'scripts/lib/lane-normalize.sh'
      - 'scripts/qa/verify-build-provenance.sh'
      - 'scripts/qa/verify-release-bundle.sh'
      - 'scripts/qa/verify-mfe-image-branding.sh'
      - 'scripts/qa/verify-mfe-runtime-contract.sh'
      - '.github/workflows/build-tutor-images.yml'
      - '!infrastructure/tutor/**/*.md'
      - '!infrastructure/tutor/mfe-build/**'
  workflow_dispatch:
    inputs:
      build_openedx:
        description: 'Build OpenEdX image (LMS/CMS)'
        type: boolean
        default: true
      build_mfe:
        description: 'Build MFE image'
        type: boolean
        default: true
      update_gitops:
        description: 'Manual cross-repo GitOps bridge after build (guarded; not the standard dev promotion path)'
        type: boolean
        default: false
      target_environment:
        description: 'GitOps target environment (required when update_gitops=true)'
        type: choice
        options:
          - select-environment
          - production
          - staging
        default: select-environment
      image_tag:
        description: 'Image tag (default: git SHA)'
        type: string
        required: false

concurrency:
  # Main builds share one workflow-level slot so push and workflow_dispatch
  # runs cannot race each other into competing release artifacts. Non-main refs
  # stay supersedable at the workflow level.
  group: build-tutor-images-${{ github.ref == 'refs/heads/main' && 'main' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io/biji-biji-initiative/mereka-lms
  DOCKER_BUILDKIT: 1

jobs:
  cancel-superseded-queued-main-builds:
    name: Cancel Superseded Queued Main Builds
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older queued Build Tutor Images runs on main
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.notice('Skipping queued-build janitor outside main.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const cancelled = [];

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'build-tutor-images.yml',
                branch: 'main',
                status: 'queued',
                per_page: 100,
              }
            );

            for (const run of runs) {
              if (run.id === currentRunId || run.id > currentRunId) {
                continue;
              }

              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              cancelled.push({
                id: run.id,
                createdAt: run.created_at,
                url: run.html_url,
              });
            }

            if (cancelled.length === 0) {
              core.notice('No older queued Build Tutor Images runs found on main.');
              return;
            }

            core.summary
              .addHeading('Cancelled older queued Build Tutor Images runs on main')
              .addTable([
                [
                  { data: 'Run ID', header: true },
                  { data: 'Created At', header: true },
                  { data: 'URL', header: true },
                ],
                ...cancelled.map((run) => [
                  String(run.id),
                  run.createdAt,
                  run.url,
                ]),
              ]);
            await core.summary.write();

  resolve-build-scope:
    name: Resolve Build Scope
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    needs: cancel-superseded-queued-main-builds
    permissions:
      contents: read
    outputs:
      build_openedx: ${{ steps.scope.outputs.build_openedx }}
      build_mfe: ${{ steps.scope.outputs.build_mfe }}
      scope_label: ${{ steps.scope.outputs.scope_label }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve build scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD_OPENEDX: ${{ inputs.build_openedx }}
          INPUT_BUILD_MFE: ${{ inputs.build_mfe }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p var/ci

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            build_openedx="${INPUT_BUILD_OPENEDX}"
            build_mfe="${INPUT_BUILD_MFE}"
            scope_label="manual"
            {
              echo "build_openedx=${build_openedx}"
              echo "build_mfe=${build_mfe}"
              echo "scope_label=${scope_label}"
            } >> "$GITHUB_OUTPUT"

            {
              echo "### Build Scope"
              echo "- Scope label: \`${scope_label}\`"
              echo "- Build OpenEdX: \`${build_openedx}\`"
              echo "- Build MFE: \`${build_mfe}\`"
              echo
              echo "- Source: workflow_dispatch inputs"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          git diff --name-only "$base_sha" "$PUSH_HEAD_SHA" > var/ci/build-scope-files.txt

          ./scripts/infra/resolve-build-scope.sh \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file var/ci/build-scope-summary.md \
            < var/ci/build-scope-files.txt

          {
            echo "### Build Scope"
            echo "- Diff range: \`${base_sha}..${PUSH_HEAD_SHA}\`"
            cat var/ci/build-scope-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Validate
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    needs: cancel-superseded-queued-main-builds
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate Tutor config
        run: |
          # Check for syntax errors in YAML configs (no pip on ARC runners)
          python3 -c "
          import json, re, sys
          with open('infrastructure/tutor/config.example.yml') as f:
              content = f.read()
          # Basic syntax: no tabs, valid UTF-8, non-empty
          if '\t' in content:
              print('ERROR: tabs in YAML'); sys.exit(1)
          if not content.strip():
              print('ERROR: empty file'); sys.exit(1)
          print('✅ Config YAML basic validation passed')
          "

      - name: Lint shell scripts
        continue-on-error: true  # ARC runner image lacks xz; tracked as CI infra debt
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './infrastructure/tutor'
          severity: warning

  build-openedx:
    name: Build OpenEdX Image
    runs-on: mereka-k8s-heavy-builders
    concurrency:
      # Never cancel an in-progress main build. Queue the newest run behind the
      # active main build after the janitor clears older queued workflow runs.
      group: build-openedx-${{ github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: false
    # Keep outer timeout comfortably above inner image-build timeout (170m)
    # so pre/post-build checks and artifact upload have recovery headroom.
    timeout-minutes: 200
    needs: [resolve-build-scope, lint]
    if: ${{ needs.resolve-build-scope.outputs.build_openedx == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Free disk space for large image builds
        run: |
          # GitHub-hosted runners have ~14GB free. OpenEdX image build needs
          # ~12GB+ (base layers + pip packages + webpack + image export).
          # Remove pre-installed tools we don't need to reclaim ~6GB.
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Enable swap for heavy image builds
        run: |
          # GitHub hosted runners can OOM during large Open edX layer export.
          # Add swap to reduce abrupt SIGKILL during docker/buildx workloads.
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Verify Tutor version
        run: tutor --version

      - name: Set up Tutor environment
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          mkdir -p $TUTOR_ROOT

          # Sync plugin package to Tutor plugins directory.
          # Cannot source tutor-env.sh directly (requires .venv which CI lacks).
          PLUGIN_SRC_DIR="$(pwd)/infrastructure/tutor/plugins"
          PLUGIN_DIR="${TUTOR_PLUGINS_DIR:-$HOME/.local/share/tutor-plugins}"
          mkdir -p "$PLUGIN_DIR"
          cp "$PLUGIN_SRC_DIR/mereka_lms.py" "$PLUGIN_DIR/mereka_lms.py"
          cp "$PLUGIN_SRC_DIR/mereka_lms_mfe_slots.py" "$PLUGIN_DIR/mereka_lms_mfe_slots.py"
          cp -R "$PLUGIN_SRC_DIR/_mereka_lms" "$PLUGIN_DIR/_mereka_lms"

          # Enable the Mereka LMS plugin so hooks fire during image build
          tutor plugins enable mereka_lms

          # Initialize Tutor config
          tutor config save \
            --set LMS_HOST=academyv2.mereka.io \
            --set CMS_HOST=studio.academyv2.mereka.io \
            --set ENABLE_HTTPS=true

          # Apply patches
          ./infrastructure/tutor/apply-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          # OpenEdX still needs a loadable local image for downstream branding,
          # retag/push steps, and post-build runtime checks. The docker-container + GHA cache
          # path regressed on main with "failed to solve: DeadlineExceeded: no
          # active session" during Tutor's final local-daemon export, so keep
          # this job on the reliable docker driver until the build no longer
          # depends on output=type=docker.
          driver: docker

      - name: Fix DinD network MTU
        run: |
          # ARC DinD containers inherit docker0 bridge MTU 1500, but the pod
          # network (eth0) uses MTU 1280 on rke2-nonprod.  Large packets
          # (TLS handshakes, apt downloads) get silently dropped.
          # Fix: write daemon.json with correct MTU and SIGHUP dockerd.
          #
          # Uses --pid=host + nsenter to access the DinD daemon's mount
          # namespace and modify /etc/docker/daemon.json in-place.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"mtu\":1280}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            echo "DinD daemon.json written with MTU=1280, dockerd reloaded."
            sleep 2
            # Verify the MTU took effect
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR (build cache)
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build OpenEdX image
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          mkdir -p var/ci

          # Cache strategy (D4 — build cache realization):
          #   --no-registry-cache: skip upstream overhangio cache refs (can't push)
          #   -d --cache-from:     pull our last GHCR image's inline cache metadata
          #   -a BUILDKIT_INLINE_CACHE=1: embed cache metadata in built image
          #
          # On first run (bootstrap), cache-from silently misses. After push,
          # subsequent builds reuse matching layers via inline cache metadata.
          CACHE_REF="${{ env.REGISTRY }}/openedx:mereka-brand"

          BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (
            while true; do
              echo "[build-openedx-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          if ! timeout 170m tutor images build openedx \
            --no-registry-cache \
            -d "--cache-from=type=registry,ref=${CACHE_REF}" \
            -a BUILDKIT_INLINE_CACHE=1 2>&1 | tee var/ci/build-openedx.log; then
            echo "OpenedX image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT
          BUILD_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_START=${BUILD_START}" >> var/ci/build-openedx-timing.env
          echo "BUILD_END=${BUILD_END}" >> var/ci/build-openedx-timing.env

          # Tutor 21 with buildx names images docker.io/overhangio/openedx:*
          # Retag for downstream steps (branding verify, SBOM, Trivy, push).
          OPENEDX_LOCAL_IMAGE="tutor_local/openedx:latest"
          TUTOR_IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|docker.io/)overhangio/openedx:' | head -1 || true)"
          if [[ -n "$TUTOR_IMAGE" && -z "$(docker images -q "$OPENEDX_LOCAL_IMAGE" 2>/dev/null)" ]]; then
            echo "Retagging $TUTOR_IMAGE → $OPENEDX_LOCAL_IMAGE"
            docker tag "$TUTOR_IMAGE" "$OPENEDX_LOCAL_IMAGE"
          fi
          if [[ -z "$(docker images -q "$OPENEDX_LOCAL_IMAGE" 2>/dev/null)" ]]; then
            echo "::error::Tutor build completed without a loadable local OpenEdX image" >&2
            echo "Available OpenEdX images after build:" >&2
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'openedx' >&2 || true
            exit 1
          fi
          echo "OPENEDX_LOCAL_IMAGE=$OPENEDX_LOCAL_IMAGE" >> "$GITHUB_ENV"

      - name: Verify OpenEdX build cache health
        if: always()
        run: |
          set -euo pipefail
          LOG="var/ci/build-openedx.log"
          SUMMARY=""
          FAILURES=0

          if [[ ! -f "$LOG" ]]; then
            echo "::warning::No build log found — cache verification skipped"
            exit 0
          fi

          # 1. Check cache-from was in the buildx command
          if grep -q 'cache-from=type=registry' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ --cache-from=type=registry present in build command"
          else
            SUMMARY="${SUMMARY}\n❌ --cache-from NOT found in build command"
            FAILURES=$((FAILURES + 1))
          fi

          if grep -q 'cache-from=type=gha' "$LOG" || grep -q 'cache-to=type=gha,mode=max' "$LOG"; then
            SUMMARY="${SUMMARY}\n❌ GHA cache exporters unexpectedly present for OpenEdX build"
            FAILURES=$((FAILURES + 1))
          else
            SUMMARY="${SUMMARY}\n✅ GHA cache exporters intentionally absent for OpenEdX build (docker driver + local image export)"
          fi

          # 2. Check cache manifest was imported
          if grep -q 'importing cache manifest from' "$LOG"; then
            CACHE_REF_USED=$(grep 'importing cache manifest from' "$LOG" | head -1 | sed 's/.*from //')
            SUMMARY="${SUMMARY}\n✅ Cache manifest imported from: ${CACHE_REF_USED}"
          else
            SUMMARY="${SUMMARY}\n⚠️  No cache manifest import found (bootstrap or auth failure)"
          fi

          # 3. Check inline cache was exported
          if grep -q 'preparing layers for inline cache' "$LOG"; then
            EXPORT_TIME=$(grep 'preparing layers for inline cache.*done' "$LOG" | head -1 | sed 's/.*cache //')
            SUMMARY="${SUMMARY}\n✅ Inline cache exported (${EXPORT_TIME})"
          else
            SUMMARY="${SUMMARY}\n❌ Inline cache export NOT found — next build will be cold"
            FAILURES=$((FAILURES + 1))
          fi

          # 4. Check BUILDKIT_INLINE_CACHE=1 was in the command
          if grep -q 'BUILDKIT_INLINE_CACHE=1' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ BUILDKIT_INLINE_CACHE=1 present"
          else
            SUMMARY="${SUMMARY}\n❌ BUILDKIT_INLINE_CACHE=1 NOT found"
            FAILURES=$((FAILURES + 1))
          fi

          # 5. Count CACHED vs rebuilt layers
          CACHED_LAYERS=$(grep -c 'CACHED' "$LOG" 2>/dev/null || echo 0)
          TOTAL_LAYERS=$(grep -cE '^\#[0-9]+ \[' "$LOG" 2>/dev/null || echo 0)
          SUMMARY="${SUMMARY}\n📊 Layers: ${CACHED_LAYERS} cached / ${TOTAL_LAYERS} total"

          # 6. Build timing
          if [[ -f var/ci/build-openedx-timing.env ]]; then
            source var/ci/build-openedx-timing.env
            SUMMARY="${SUMMARY}\n⏱️  Build: ${BUILD_START} → ${BUILD_END}"
          fi

          # Emit summary
          echo -e "\n=== OpenEdX Build Cache Health ==="
          echo -e "$SUMMARY"

          # Write to GitHub step summary
          {
            echo "### OpenEdX Build Cache Health"
            echo -e "$SUMMARY"
            if [[ $FAILURES -gt 0 ]]; then
              echo ""
              echo "**⚠️ ${FAILURES} cache health check(s) failed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $FAILURES -gt 0 ]]; then
            echo "::warning::${FAILURES} cache health check(s) failed for OpenEdX build"
          fi

      - name: Verify OpenEdX image branding contract
        continue-on-error: true  # Non-blocking until FE-003 (LMS SCSS entry point) is resolved
        run: |
          # Since ADR-012 eliminated runtime CSS overlays, branding CSS must be
          # baked into the image. Verify the branded CSS file exists and the
          # branding revision marker is present.
          mkdir -p var/ci
          EXPECTED_LMS_BRANDING_REV="$(sed -nE 's/.*--mereka-branding-rev:[[:space:]]*"([^"]+)".*/\1/p' infrastructure/tutor/themes/mereka/lms/static/css/mereka-overrides.css | head -n 1)"
          echo "Expected LMS branding rev: ${EXPECTED_LMS_BRANDING_REV:-<none>}"

          # Extract staticfiles.json from the built image to verify collectstatic ran
          docker run --rm "${OPENEDX_LOCAL_IMAGE}" \
            python -c "import json; data=json.load(open('/openedx/staticfiles/staticfiles.json')); css=data['paths'].get('mereka/css/mereka-overrides.css','MISSING'); print(f'CSS hash: {css}')" \
            | tee var/ci/verify-openedx-image-branding.log

          # Verify the hashed CSS file actually exists in the image
          HASHED_CSS="$(docker run --rm "${OPENEDX_LOCAL_IMAGE}" \
            python -c "import json; data=json.load(open('/openedx/staticfiles/staticfiles.json')); print(data['paths'].get('mereka/css/mereka-overrides.css','MISSING'))")"
          if [[ "$HASHED_CSS" == "MISSING" ]]; then
            echo "FAIL: mereka-overrides.css not found in staticfiles.json" | tee -a var/ci/verify-openedx-image-branding.log
            exit 1
          fi
          docker run --rm "${OPENEDX_LOCAL_IMAGE}" \
            test -f "/openedx/staticfiles/${HASHED_CSS}" \
            && echo "PASS: /openedx/staticfiles/${HASHED_CSS} exists" | tee -a var/ci/verify-openedx-image-branding.log \
            || { echo "FAIL: /openedx/staticfiles/${HASHED_CSS} missing" | tee -a var/ci/verify-openedx-image-branding.log; exit 1; }

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/openedx:${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          docker tag "${OPENEDX_LOCAL_IMAGE}" ${{ env.REGISTRY }}/openedx:${TAG}
          docker tag "${OPENEDX_LOCAL_IMAGE}" ${{ env.REGISTRY }}/openedx:${SHORT_SHA}

          docker push ${{ env.REGISTRY }}/openedx:${TAG}
          docker push ${{ env.REGISTRY }}/openedx:${SHORT_SHA}

          # Retain mutable mereka-brand as a compatibility/debug alias only.
          # Dev promotion now consumes immutable tags + digests via the
          # infra-owned bbi-infrastructure promotion workflows.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag "${OPENEDX_LOCAL_IMAGE}" ${{ env.REGISTRY }}/openedx:mereka-brand
            docker push ${{ env.REGISTRY }}/openedx:mereka-brand
            echo "**Mutable tag:** \`mereka-brand\` (compatibility alias only; dev promotion is infra-owned)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### OpenEdX Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/openedx:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve pushed openedx digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/openedx:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve openedx digest for ${REF} (got: '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "**OpenedX digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload OpenEdX branding verification log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: openedx-branding-contract-log
          path: var/ci/verify-openedx-image-branding.log
          retention-days: 3

  build-mfe:
    name: Build MFE Image
    runs-on: mereka-k8s-heavy-builders
    concurrency:
      # Never cancel an in-progress main build. Queue the newest run behind the
      # active main build after the janitor clears older queued workflow runs.
      group: build-mfe-${{ github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 120
    needs: [resolve-build-scope, lint]
    if: ${{ needs.resolve-build-scope.outputs.build_mfe == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Enable swap for heavy image builds
        run: |
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Verify Tutor version
        run: tutor --version

      - name: Set up Tutor environment
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          mkdir -p $TUTOR_ROOT

          # Sync plugin package to Tutor plugins directory.
          PLUGIN_SRC_DIR="$(pwd)/infrastructure/tutor/plugins"
          PLUGIN_DIR="${TUTOR_PLUGINS_DIR:-$HOME/.local/share/tutor-plugins}"
          mkdir -p "$PLUGIN_DIR"
          cp "$PLUGIN_SRC_DIR/mereka_lms.py" "$PLUGIN_DIR/mereka_lms.py"
          cp "$PLUGIN_SRC_DIR/mereka_lms_mfe_slots.py" "$PLUGIN_DIR/mereka_lms_mfe_slots.py"
          cp -R "$PLUGIN_SRC_DIR/_mereka_lms" "$PLUGIN_DIR/_mereka_lms"

          # Enable the Mereka LMS plugin so hooks fire during image build
          tutor plugins enable mereka_lms

          # Initialize Tutor config
          tutor config save \
            --set LMS_HOST=academyv2.mereka.io \
            --set MFE_HOST=apps.academyv2.mereka.io \
            --set ENABLE_HTTPS=true

          # Apply patches (includes Node 18 + webpack memory fixes)
          ./infrastructure/tutor/apply-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: docker-container

      - name: Fix DinD network MTU
        run: |
          # ARC DinD containers inherit docker0 bridge MTU 1500, but the pod
          # network (eth0) uses MTU 1280 on rke2-nonprod.  Large packets
          # (TLS handshakes, apt downloads) get silently dropped.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"mtu\":1280}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            echo "DinD daemon.json written with MTU=1280, dockerd reloaded."
            sleep 2
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR (build cache)
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build MFE image
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          export NODE_OPTIONS="--max-old-space-size=6144"
          mkdir -p var/ci

          # Cache strategy: same as openedx build (see D4 comments above).
          CACHE_REF="${{ env.REGISTRY }}/mfe:mereka-brand"

          BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (
            while true; do
              echo "[build-mfe-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          if ! timeout 110m tutor images build mfe \
            --no-registry-cache \
            -d "--cache-from=type=gha" \
            -d "--cache-to=type=gha,mode=max" \
            -d "--cache-from=type=registry,ref=${CACHE_REF}" \
            -a BUILDKIT_INLINE_CACHE=1 2>&1 | tee var/ci/build-mfe.log; then
            echo "MFE image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT
          BUILD_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_START=${BUILD_START}" >> var/ci/build-mfe-timing.env
          echo "BUILD_END=${BUILD_END}" >> var/ci/build-mfe-timing.env

          # Tutor 21 with buildx names MFE images docker.io/overhangio/openedx-mfe:*
          # instead of tutor_local/openedx-mfe:latest. Retag for downstream steps.
          MFE_LOCAL_IMAGE="tutor_local/openedx-mfe:latest"
          TUTOR_MFE_IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|docker.io/)overhangio/openedx-mfe:' | head -1 || true)"
          if [[ -n "$TUTOR_MFE_IMAGE" && -z "$(docker images -q "$MFE_LOCAL_IMAGE" 2>/dev/null)" ]]; then
            echo "Retagging $TUTOR_MFE_IMAGE → $MFE_LOCAL_IMAGE"
            docker tag "$TUTOR_MFE_IMAGE" "$MFE_LOCAL_IMAGE"
          fi
          if [[ -z "$(docker images -q "$MFE_LOCAL_IMAGE" 2>/dev/null)" ]]; then
            echo "::error::Tutor build completed without a loadable local MFE image" >&2
            echo "Available MFE images after build:" >&2
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'openedx-mfe' >&2 || true
            exit 1
          fi
          echo "MFE_LOCAL_IMAGE=$MFE_LOCAL_IMAGE" >> "$GITHUB_ENV"

      - name: Verify MFE build cache health
        if: always()
        run: |
          set -euo pipefail
          LOG="var/ci/build-mfe.log"
          SUMMARY=""
          FAILURES=0

          if [[ ! -f "$LOG" ]]; then
            echo "::warning::No build log found — cache verification skipped"
            exit 0
          fi

          # 1. Check cache-from was in the buildx command
          if grep -q 'cache-from=type=registry' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ --cache-from=type=registry present in build command"
          else
            SUMMARY="${SUMMARY}\n❌ --cache-from NOT found in build command"
            FAILURES=$((FAILURES + 1))
          fi

          if grep -q 'cache-from=type=gha' "$LOG" && grep -q 'cache-to=type=gha,mode=max' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ GHA cache read/write is enabled for MFE build"
          else
            SUMMARY="${SUMMARY}\n❌ GHA cache read/write flags NOT found in build command"
            FAILURES=$((FAILURES + 1))
          fi

          # 2. Check cache manifest was imported
          if grep -q 'importing cache manifest from' "$LOG"; then
            CACHE_REF_USED=$(grep 'importing cache manifest from' "$LOG" | head -1 | sed 's/.*from //')
            SUMMARY="${SUMMARY}\n✅ Cache manifest imported from: ${CACHE_REF_USED}"
          else
            SUMMARY="${SUMMARY}\n⚠️  No cache manifest import found (bootstrap or auth failure)"
          fi

          # 3. Check inline cache was exported
          if grep -q 'preparing layers for inline cache' "$LOG"; then
            EXPORT_TIME=$(grep 'preparing layers for inline cache.*done' "$LOG" | head -1 | sed 's/.*cache //')
            SUMMARY="${SUMMARY}\n✅ Inline cache exported (${EXPORT_TIME})"
          else
            SUMMARY="${SUMMARY}\n❌ Inline cache export NOT found — next build will be cold"
            FAILURES=$((FAILURES + 1))
          fi

          # 4. Check BUILDKIT_INLINE_CACHE=1 was in the command
          if grep -q 'BUILDKIT_INLINE_CACHE=1' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ BUILDKIT_INLINE_CACHE=1 present"
          else
            SUMMARY="${SUMMARY}\n❌ BUILDKIT_INLINE_CACHE=1 NOT found"
            FAILURES=$((FAILURES + 1))
          fi

          # 5. Count CACHED vs rebuilt layers
          CACHED_LAYERS=$(grep -c 'CACHED' "$LOG" 2>/dev/null || echo 0)
          TOTAL_LAYERS=$(grep -cE '^\#[0-9]+ \[' "$LOG" 2>/dev/null || echo 0)
          SUMMARY="${SUMMARY}\n📊 Layers: ${CACHED_LAYERS} cached / ${TOTAL_LAYERS} total"

          # 6. Build timing
          if [[ -f var/ci/build-mfe-timing.env ]]; then
            source var/ci/build-mfe-timing.env
            SUMMARY="${SUMMARY}\n⏱️  Build: ${BUILD_START} → ${BUILD_END}"
          fi

          # Emit summary
          echo -e "\n=== MFE Build Cache Health ==="
          echo -e "$SUMMARY"

          # Write to GitHub step summary
          {
            echo "### MFE Build Cache Health"
            echo -e "$SUMMARY"
            if [[ $FAILURES -gt 0 ]]; then
              echo ""
              echo "**⚠️ ${FAILURES} cache health check(s) failed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $FAILURES -gt 0 ]]; then
            echo "::warning::${FAILURES} cache health check(s) failed for MFE build"
          fi

      - name: Verify MFE image branding contract
        run: |
          mkdir -p var/ci
          EXPECTED_MFE_BRANDING_REV="$(sed -nE 's/.*--mereka-mfe-branding-rev:[[:space:]]*"([^"]+)".*/\1/p' infrastructure/tutor/themes/mereka/mfe/mereka.scss | head -n 1)"
          scripts/qa/verify-mfe-image-branding.sh "${MFE_LOCAL_IMAGE}" "${EXPECTED_MFE_BRANDING_REV}" \
            | tee var/ci/verify-mfe-image-branding.log

      - name: Verify MFE runtime contract (image)
        run: |
          mkdir -p var/ci
          scripts/qa/verify-mfe-runtime-contract.sh --image "${MFE_LOCAL_IMAGE}" \
            | tee var/ci/verify-mfe-runtime-contract.log

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/mfe:${TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          docker tag "${MFE_LOCAL_IMAGE}" ${{ env.REGISTRY }}/mfe:${TAG}
          docker tag "${MFE_LOCAL_IMAGE}" ${{ env.REGISTRY }}/mfe:${SHORT_SHA}

          docker push ${{ env.REGISTRY }}/mfe:${TAG}
          docker push ${{ env.REGISTRY }}/mfe:${SHORT_SHA}

          # Retain mutable mereka-brand as a compatibility/debug alias only.
          # Dev promotion now consumes immutable tags + digests via the
          # infra-owned bbi-infrastructure promotion workflows.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag "${MFE_LOCAL_IMAGE}" ${{ env.REGISTRY }}/mfe:mereka-brand
            docker push ${{ env.REGISTRY }}/mfe:mereka-brand
            echo "**Mutable tag:** \`mereka-brand\` (compatibility alias only; dev promotion is infra-owned)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### MFE Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/mfe:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve pushed mfe digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/mfe:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve mfe digest for ${REF} (got: '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "**MFE digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload MFE branding verification log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: mfe-branding-contract-log
          path: var/ci/verify-mfe-image-branding.log
          retention-days: 3

      - name: Upload MFE runtime contract log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: mfe-runtime-contract-log
          path: var/ci/verify-mfe-runtime-contract.log
          retention-days: 3

  scan-openedx-image:
    name: Post-push OpenEdX Scan
    runs-on: mereka-k8s-runners
    timeout-minutes: 45
    needs: [build-openedx]
    if: ${{ needs.build-openedx.result == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate SBOM for OpenEdX image
        continue-on-error: true  # Non-blocking: SBOM is informational, should not block image delivery
        env:
          OPENEDX_IMAGE_REF: ${{ env.REGISTRY }}/openedx@${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          # Install syft v1.42.1 — checksum computed 2026-03-05
          SYFT_VERSION="v1.42.1"
          SYFT_INSTALL_SHA="01d0d15aff461f1bc54d1716feb4824341918c4f37e1b6a5a0c0caee2251be67"
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            -o /tmp/syft-install.sh
          echo "${SYFT_INSTALL_SHA}  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b "$HOME/.local/bin"
          rm /tmp/syft-install.sh
          set +e
          timeout 20m "$HOME/.local/bin/syft" scan "registry:${OPENEDX_IMAGE_REF}" \
            -o cyclonedx-json=var/ci/sbom-openedx.cdx.json
          sbom_status=$?
          set -e
          if [[ "$sbom_status" -eq 0 ]]; then
            exit 0
          fi
          if [[ "$sbom_status" -eq 124 ]]; then
            echo "OpenEdX registry SBOM generation timed out after 20m; continuing without SBOM artifact." >&2
          else
            echo "OpenEdX registry SBOM generation failed with exit code ${sbom_status}; continuing without SBOM artifact." >&2
          fi
          exit "$sbom_status"

      - name: Upload OpenEdX SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: sbom-openedx
          path: var/ci/sbom-openedx.cdx.json
          retention-days: 90

      - name: Install Trivy CLI
        run: |
          # trivy v0.69.3 — checksum computed 2026-03-05
          TRIVY_VERSION="v0.69.3"
          TRIVY_INSTALL_SHA="e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            -o /tmp/trivy-install.sh
          echo "${TRIVY_INSTALL_SHA}  /tmp/trivy-install.sh" | sha256sum -c -
          sh /tmp/trivy-install.sh -b "$HOME/.local/bin"
          rm /tmp/trivy-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan OpenEdX image for vulnerabilities
        continue-on-error: true  # Non-blocking: upstream CVEs should not block image delivery
        env:
          OPENEDX_IMAGE_REF: ${{ env.REGISTRY }}/openedx@${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          trivy image \
            --format json \
            --output var/ci/trivy-openedx.json \
            --ignorefile .trivyignore \
            --severity CRITICAL,HIGH \
            "${OPENEDX_IMAGE_REF}"

          CRITICAL_COUNT=$(jq '[(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' var/ci/trivy-openedx.json)
          echo "CRITICAL vulnerabilities: ${CRITICAL_COUNT}"

          jq -r '
            ["Severity","PkgName","VulnerabilityID","Title"],
            ((.Results // [])[] | .Vulnerabilities // []
              | .[]
              | select(.Severity == "HIGH")
              | [.Severity, .PkgName, .VulnerabilityID, (.Title // "-")])
            | @tsv' var/ci/trivy-openedx.json \
            > var/ci/trivy-openedx-high-summary.txt || true

          if [[ "${CRITICAL_COUNT}" -gt 0 ]]; then
            echo "FAIL: ${CRITICAL_COUNT} CRITICAL vulnerabilities found in openedx image." >&2
            jq -r '(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName)\t\(.Title // "-")"' \
              var/ci/trivy-openedx.json >&2
            exit 1
          fi

      - name: Upload Trivy OpenEdX scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: trivy-openedx-scan
          path: var/ci/trivy-openedx*
          retention-days: 3

