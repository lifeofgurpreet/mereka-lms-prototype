name: Build Tutor Images

permissions: {}
on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/tutor/**'
      - 'assets/branding/**'
      - '.github/workflows/build-tutor-images.yml'
  workflow_dispatch:
    inputs:
      build_openedx:
        description: 'Build OpenEdX image (LMS/CMS)'
        type: boolean
        default: true
      build_mfe:
        description: 'Build MFE image'
        type: boolean
        default: true
      deploy_to_staging:
        description: 'DEPRECATED: use update_gitops. Kept for backward compatibility'
        type: boolean
        default: false
      update_gitops:
        description: 'Update GitOps after build'
        type: boolean
        default: false
      target_environment:
        description: 'GitOps target environment (required when update_gitops=true)'
        type: choice
        options:
          - select-environment
          - production
          - staging
        default: select-environment
      openedx_runner:
        description: 'Runner for image builds (workflow_dispatch only)'
        type: choice
        options:
          - github-hosted
          - heavy-builder
        default: heavy-builder
      image_tag:
        description: 'Image tag (default: git SHA)'
        type: string
        required: false

concurrency:
  # Keep push runs preemptive, but do not let manual workflow_dispatch runs
  # cancel each other (or get canceled by a push run) on long image builds.
  group: build-tutor-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  PROJECT_ID: mereka-lms
  REGION: asia-southeast1
  REPOSITORY: openedx
  REGISTRY: asia-southeast1-docker.pkg.dev/mereka-lms/openedx
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate Tutor config
        run: |
          # Check for syntax errors in YAML configs
          python3 -c "import yaml; yaml.safe_load(open('infrastructure/tutor/config.example.yml'))"
          echo "✅ Config YAML is valid"

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './infrastructure/tutor'
          severity: warning

  build-openedx:
    name: Build OpenEdX Image
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.openedx_runner == 'github-hosted' && 'ubuntu-24.04' || 'mereka-k8s-heavy-builders' }}
    # Keep outer timeout comfortably above inner image-build timeout (170m)
    # so pre/post-build checks and artifact upload have recovery headroom.
    timeout-minutes: 200
    needs: lint
    if: ${{ github.event_name == 'push' || inputs.build_openedx }}
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Enable swap for heavy image builds
        run: |
          # GitHub hosted runners can OOM during large Open edX layer export.
          # Add swap to reduce abrupt SIGKILL during docker/buildx workloads.
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Verify Tutor version
        run: tutor --version

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-gke-auth
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          skip_gke: 'true'
          skip_gcloud: 'true'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Tutor environment
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          mkdir -p $TUTOR_ROOT

          # Initialize Tutor config
          tutor config save \
            --set LMS_HOST=academyv2.mereka.io \
            --set CMS_HOST=studio.academyv2.mereka.io \
            --set ENABLE_HTTPS=true

          # Apply patches
          ./infrastructure/tutor/apply-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          driver: docker
          # Use 'docker' driver so Tutor's 'docker build' benefits from BuildKit.
          # The 'docker-container' driver would require 'docker buildx build'.

      - name: Build OpenEdX image
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          # Prefer lower peak-memory Docker build mode on GitHub-hosted runners
          # to avoid abrupt OOM kills during layer export.
          # Keep BuildKit enabled on self-hosted runners for better cache reuse.
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            echo "GitHub-hosted runner detected: BuildKit disabled for stability."
          else
            echo "Self-hosted runner detected: BuildKit remains enabled."
            if [[ -d /cache/docker ]]; then
              mkdir -p /cache/docker/buildkit
              export DOCKER_BUILD_OPTIONS="--cache-from=type=local,src=/cache/docker/buildkit --cache-to=type=local,dest=/cache/docker/buildkit,mode=max"
              echo "BuildKit local cache enabled via /cache/docker/buildkit."
            else
              echo "No /cache/docker mount found; continuing without explicit BuildKit cache args."
            fi
          fi
          (
            while true; do
              echo "[build-openedx-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          build_cmd=(tutor images build openedx)
          if [[ -n "${DOCKER_BUILD_OPTIONS:-}" ]]; then
            read -r -a build_opts <<< "$DOCKER_BUILD_OPTIONS"
            build_cmd+=("${build_opts[@]}")
          fi
          if ! timeout 170m "${build_cmd[@]}"; then
            echo "OpenedX image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

      - name: Verify OpenEdX image branding contract
        run: |
          # Since ADR-012 eliminated runtime CSS overlays, branding CSS must be
          # baked into the image. Verify the branded CSS file exists and the
          # branding revision marker is present.
          mkdir -p var/ci
          EXPECTED_LMS_BRANDING_REV="$(sed -nE 's/.*--mereka-branding-rev:[[:space:]]*"([^"]+)".*/\1/p' infrastructure/tutor/themes/mereka/lms/static/css/mereka-overrides.css | head -n 1)"
          echo "Expected LMS branding rev: ${EXPECTED_LMS_BRANDING_REV:-<none>}"

          # Extract staticfiles.json from the built image to verify collectstatic ran
          docker run --rm tutor_local/openedx:latest \
            python -c "import json; data=json.load(open('/openedx/staticfiles/staticfiles.json')); css=data['paths'].get('mereka/css/mereka-overrides.css','MISSING'); print(f'CSS hash: {css}')" \
            | tee var/ci/verify-openedx-image-branding.log

          # Verify the hashed CSS file actually exists in the image
          HASHED_CSS="$(docker run --rm tutor_local/openedx:latest \
            python -c "import json; data=json.load(open('/openedx/staticfiles/staticfiles.json')); print(data['paths'].get('mereka/css/mereka-overrides.css','MISSING'))")"
          if [[ "$HASHED_CSS" == "MISSING" ]]; then
            echo "FAIL: mereka-overrides.css not found in staticfiles.json" | tee -a var/ci/verify-openedx-image-branding.log
            exit 1
          fi
          docker run --rm tutor_local/openedx:latest \
            test -f "/openedx/staticfiles/${HASHED_CSS}" \
            && echo "PASS: /openedx/staticfiles/${HASHED_CSS} exists" | tee -a var/ci/verify-openedx-image-branding.log \
            || { echo "FAIL: /openedx/staticfiles/${HASHED_CSS} missing" | tee -a var/ci/verify-openedx-image-branding.log; exit 1; }

      - name: Generate SBOM for OpenEdX image
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d  # v0.20.10
        with:
          image: tutor_local/openedx:latest
          format: cyclonedx-json
          output-file: var/ci/sbom-openedx.cdx.json

      - name: Upload OpenEdX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: sbom-openedx
          path: var/ci/sbom-openedx.cdx.json
          retention-days: 90

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan OpenEdX image for vulnerabilities
        run: |
          mkdir -p var/ci
          trivy image \
            --format json \
            --output var/ci/trivy-openedx.json \
            --ignorefile .trivyignore \
            --severity CRITICAL,HIGH \
            tutor_local/openedx:latest

          # Fail the build if any CRITICAL vulns are present
          CRITICAL_COUNT=$(jq '[(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' var/ci/trivy-openedx.json)
          echo "CRITICAL vulnerabilities: ${CRITICAL_COUNT}"

          # Emit human-readable HIGH summary for the artifact
          jq -r '
            ["Severity","PkgName","VulnerabilityID","Title"],
            ((.Results // [])[] | .Vulnerabilities // []
              | .[]
              | select(.Severity == "HIGH")
              | [.Severity, .PkgName, .VulnerabilityID, (.Title // "-")])
            | @tsv' var/ci/trivy-openedx.json \
            > var/ci/trivy-openedx-high-summary.txt || true

          if [[ "${CRITICAL_COUNT}" -gt 0 ]]; then
            echo "FAIL: ${CRITICAL_COUNT} CRITICAL vulnerabilities found in openedx image." >&2
            jq -r '(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName)\t\(.Title // "-")"' \
              var/ci/trivy-openedx.json >&2
            exit 1
          fi

      - name: Upload Trivy OpenEdX scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: trivy-openedx-scan
          path: var/ci/trivy-openedx*
          retention-days: 3

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/openedx:${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          docker tag tutor_local/openedx:latest ${{ env.REGISTRY }}/openedx:${TAG}
          docker tag tutor_local/openedx:latest ${{ env.REGISTRY }}/openedx:${SHORT_SHA}

          docker push ${{ env.REGISTRY }}/openedx:${TAG}
          docker push ${{ env.REGISTRY }}/openedx:${SHORT_SHA}

          # Push mutable mereka-brand tag so the dev overlay (rke2-nonprod)
          # auto-deploys via ArgoCD when a new image lands on main.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag tutor_local/openedx:latest ${{ env.REGISTRY }}/openedx:mereka-brand
            docker push ${{ env.REGISTRY }}/openedx:mereka-brand
            echo "**Mutable tag:** \`mereka-brand\` (dev auto-deploy)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### OpenEdX Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/openedx:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve pushed openedx digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/openedx:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "**OpenedX digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload OpenEdX branding verification log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: openedx-branding-contract-log
          path: var/ci/verify-openedx-image-branding.log
          retention-days: 3

  build-mfe:
    name: Build MFE Image
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.openedx_runner == 'github-hosted' && 'ubuntu-24.04' || 'mereka-k8s-heavy-builders' }}
    timeout-minutes: 120
    needs: lint
    if: ${{ github.event_name == 'push' || inputs.build_mfe }}
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Enable swap for heavy image builds
        run: |
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Verify Tutor version
        run: tutor --version

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-gke-auth
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          skip_gke: 'true'
          skip_gcloud: 'true'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Tutor environment
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          mkdir -p $TUTOR_ROOT

          # Initialize Tutor config
          tutor config save \
            --set LMS_HOST=academyv2.mereka.io \
            --set MFE_HOST=apps.academyv2.mereka.io \
            --set ENABLE_HTTPS=true

          # Apply patches (includes Node 18 + webpack memory fixes)
          ./infrastructure/tutor/apply-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          driver: docker

      - name: Build MFE image
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          # Keep BuildKit enabled on self-hosted runners for cache efficiency.
          # Disable only on GitHub-hosted runners when operators explicitly select that mode.
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            echo "GitHub-hosted runner detected: BuildKit disabled for stability."
          else
            echo "Self-hosted runner detected: BuildKit remains enabled."
            if [[ -d /cache/docker ]]; then
              mkdir -p /cache/docker/buildkit
              export DOCKER_BUILD_OPTIONS="--cache-from=type=local,src=/cache/docker/buildkit --cache-to=type=local,dest=/cache/docker/buildkit,mode=max"
              echo "BuildKit local cache enabled via /cache/docker/buildkit."
            else
              echo "No /cache/docker mount found; continuing without explicit BuildKit cache args."
            fi
          fi
          export NODE_OPTIONS="--max-old-space-size=6144"
          (
            while true; do
              echo "[build-mfe-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          build_cmd=(tutor images build mfe)
          if [[ -n "${DOCKER_BUILD_OPTIONS:-}" ]]; then
            read -r -a build_opts <<< "$DOCKER_BUILD_OPTIONS"
            build_cmd+=("${build_opts[@]}")
          fi
          if ! timeout 110m "${build_cmd[@]}"; then
            echo "MFE image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

      - name: Verify MFE image branding contract
        run: |
          mkdir -p var/ci
          EXPECTED_MFE_BRANDING_REV="$(sed -nE 's/.*--mereka-mfe-branding-rev:[[:space:]]*"([^"]+)".*/\1/p' infrastructure/tutor/themes/mereka/mfe/mereka.scss | head -n 1)"
          scripts/qa/verify-mfe-image-branding.sh tutor_local/openedx-mfe:latest "${EXPECTED_MFE_BRANDING_REV}" \
            | tee var/ci/verify-mfe-image-branding.log

      - name: Generate SBOM for MFE image
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d  # v0.20.10
        with:
          image: tutor_local/openedx-mfe:latest
          format: cyclonedx-json
          output-file: var/ci/sbom-mfe.cdx.json

      - name: Upload MFE SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: sbom-mfe
          path: var/ci/sbom-mfe.cdx.json
          retention-days: 90

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan MFE image for vulnerabilities
        run: |
          mkdir -p var/ci
          trivy image \
            --format json \
            --output var/ci/trivy-mfe.json \
            --ignorefile .trivyignore \
            --severity CRITICAL,HIGH \
            tutor_local/openedx-mfe:latest

          # Fail the build if any CRITICAL vulns are present
          CRITICAL_COUNT=$(jq '[(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' var/ci/trivy-mfe.json)
          echo "CRITICAL vulnerabilities: ${CRITICAL_COUNT}"

          # Emit human-readable HIGH summary for the artifact
          jq -r '
            ["Severity","PkgName","VulnerabilityID","Title"],
            ((.Results // [])[] | .Vulnerabilities // []
              | .[]
              | select(.Severity == "HIGH")
              | [.Severity, .PkgName, .VulnerabilityID, (.Title // "-")])
            | @tsv' var/ci/trivy-mfe.json \
            > var/ci/trivy-mfe-high-summary.txt || true

          if [[ "${CRITICAL_COUNT}" -gt 0 ]]; then
            echo "FAIL: ${CRITICAL_COUNT} CRITICAL vulnerabilities found in mfe image." >&2
            jq -r '(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName)\t\(.Title // "-")"' \
              var/ci/trivy-mfe.json >&2
            exit 1
          fi

      - name: Upload Trivy MFE scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: trivy-mfe-scan
          path: var/ci/trivy-mfe*
          retention-days: 3

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/mfe:${TAG}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          docker tag tutor_local/openedx-mfe:latest ${{ env.REGISTRY }}/mfe:${TAG}
          docker tag tutor_local/openedx-mfe:latest ${{ env.REGISTRY }}/mfe:${SHORT_SHA}

          docker push ${{ env.REGISTRY }}/mfe:${TAG}
          docker push ${{ env.REGISTRY }}/mfe:${SHORT_SHA}

          # Push mutable mereka-brand tag so the dev overlay (rke2-nonprod)
          # auto-deploys via ArgoCD when a new image lands on main.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag tutor_local/openedx-mfe:latest ${{ env.REGISTRY }}/mfe:mereka-brand
            docker push ${{ env.REGISTRY }}/mfe:mereka-brand
            echo "**Mutable tag:** \`mereka-brand\` (dev auto-deploy)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### MFE Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/mfe:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve pushed mfe digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/mfe:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "**MFE digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload MFE branding verification log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: mfe-branding-contract-log
          path: var/ci/verify-mfe-image-branding.log
          retention-days: 3

  slsa-provenance:
    name: SLSA Provenance & Attestation
    runs-on: ubuntu-24.04
    needs: [build-openedx, build-mfe]
    if: ${{ always() && (needs.build-openedx.result == 'success' || needs.build-mfe.result == 'success') }}
    permissions:
      contents: read
      id-token: write   # keyless signing via Sigstore OIDC
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2

      - name: Authenticate to GCP
        uses: ./.github/actions/gcp-gke-auth
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          skip_gke: 'true'
          skip_gcloud: 'true'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Generate provenance for OpenEdX image
        if: ${{ needs.build-openedx.result == 'success' }}
        env:
          OPENEDX_DIGEST: ${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          TAG="${{ inputs.image_tag || github.sha }}"
          IMAGE_REF="${{ env.REGISTRY }}/openedx@${OPENEDX_DIGEST}"

          # Build in-toto provenance predicate
          cat > var/ci/provenance-openedx.json <<PROVENANCE
          {
            "buildType": "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/.github/workflows/build-tutor-images.yml",
            "builder": {
              "id": "https://github.com/Biji-Biji-Initiative/mereka-lms/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/build-tutor-images.yml"
              },
              "environment": {
                "github_actor": "${{ github.actor }}",
                "github_event_name": "${{ github.event_name }}",
                "github_run_id": "${{ github.run_id }}",
                "github_run_attempt": "${{ github.run_attempt }}",
                "runner_os": "Linux",
                "runner_image": "ubuntu-24.04"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": { "parameters": true, "environment": true, "materials": false },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ],
            "subject": [
              {
                "name": "${{ env.REGISTRY }}/openedx",
                "digest": { "sha256": "${OPENEDX_DIGEST#sha256:}" }
              }
            ]
          }
          PROVENANCE

          # Attest the image (keyless via Sigstore OIDC)
          cosign attest --yes \
            --predicate var/ci/provenance-openedx.json \
            --type slsaprovenance \
            "${IMAGE_REF}"

          echo "### OpenEdX SLSA Provenance Attached" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_REF}\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate provenance for MFE image
        if: ${{ needs.build-mfe.result == 'success' }}
        env:
          MFE_DIGEST: ${{ needs.build-mfe.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          TAG="${{ inputs.image_tag || github.sha }}"
          IMAGE_REF="${{ env.REGISTRY }}/mfe@${MFE_DIGEST}"

          cat > var/ci/provenance-mfe.json <<PROVENANCE
          {
            "buildType": "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/.github/workflows/build-tutor-images.yml",
            "builder": {
              "id": "https://github.com/Biji-Biji-Initiative/mereka-lms/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/build-tutor-images.yml"
              },
              "environment": {
                "github_actor": "${{ github.actor }}",
                "github_event_name": "${{ github.event_name }}",
                "github_run_id": "${{ github.run_id }}",
                "github_run_attempt": "${{ github.run_attempt }}",
                "runner_os": "Linux",
                "runner_image": "ubuntu-24.04"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": { "parameters": true, "environment": true, "materials": false },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ],
            "subject": [
              {
                "name": "${{ env.REGISTRY }}/mfe",
                "digest": { "sha256": "${MFE_DIGEST#sha256:}" }
              }
            ]
          }
          PROVENANCE

          cosign attest --yes \
            --predicate var/ci/provenance-mfe.json \
            --type slsaprovenance \
            "${IMAGE_REF}"

          echo "### MFE SLSA Provenance Attached" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_REF}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: slsa-provenance
          path: var/ci/provenance-*.json
          retention-days: 90

  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-24.04
    needs: [build-openedx, build-mfe]
    if: ${{ (github.event_name != 'workflow_dispatch' && (inputs.update_gitops || inputs.deploy_to_staging)) || (github.event_name == 'workflow_dispatch' && inputs.update_gitops && inputs.target_environment != 'select-environment') }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
    permissions:
      contents: write
    env:
      ENABLE_STAGING_ENV: ${{ vars.ENABLE_STAGING_ENV || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate manual dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${{ inputs.deploy_to_staging }}" == "true" ]]; then
            echo "deploy_to_staging is deprecated; use update_gitops=true." >&2
            exit 1
          fi
          if [[ "${{ inputs.update_gitops }}" != "true" ]]; then
            echo "update_gitops must be true for manual GitOps update." >&2
            exit 1
          fi
          if [[ "${{ inputs.target_environment }}" == "select-environment" ]]; then
            echo "target_environment must be explicitly selected." >&2
            exit 1
          fi
          if [[ "${{ inputs.target_environment }}" == "staging" && "${ENABLE_STAGING_ENV}" != "true" ]]; then
            echo "target_environment=staging is disabled. Set repository variable ENABLE_STAGING_ENV=true when staging is ready." >&2
            exit 1
          fi
          if [[ "${{ inputs.build_openedx }}" != "true" || "${{ inputs.build_mfe }}" != "true" ]]; then
            echo "update_gitops requires build_openedx=true and build_mfe=true so digests are captured deterministically." >&2
            exit 1
          fi

      - name: Validate GitOps token
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          if [[ -z "${GITOPS_PAT}" ]]; then
            echo "GITOPS_PAT secret is required to update bbi-infrastructure." >&2
            exit 1
          fi

      - name: Checkout bbi-infrastructure
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: Biji-Biji-Initiative/bbi-infrastructure
          path: bbi-infrastructure
          token: ${{ secrets.GITOPS_PAT }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update app + GitOps tags via release orchestrator
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          OPENEDX_DIGEST="${{ needs.build-openedx.outputs.image_digest }}"
          MFE_DIGEST="${{ needs.build-mfe.outputs.image_digest }}"
          if [[ -z "${OPENEDX_DIGEST}" || -z "${MFE_DIGEST}" ]]; then
            echo "Missing image digests from build jobs (openedx='${OPENEDX_DIGEST}' mfe='${MFE_DIGEST}')." >&2
            exit 1
          fi
          EXTRA_ARGS=()
          if [[ "${TARGET_ENV}" == "production" ]]; then
            # Production rollouts require runtime convergence verification.
            EXTRA_ARGS+=(--verify-runtime --wait-seconds 900)
          fi
          ./scripts/infra/release-openedx-gitops.sh \
            --target-env "${TARGET_ENV}" \
            --openedx-tag "${TAG}" \
            --mfe-tag "${TAG}" \
            --openedx-digest "${OPENEDX_DIGEST}" \
            --mfe-digest "${MFE_DIGEST}" \
            --require-digests \
            --app-repo "$GITHUB_WORKSPACE" \
            --infra-repo "$GITHUB_WORKSPACE/bbi-infrastructure" \
            --apply --commit --push \
            "${EXTRA_ARGS[@]}"

      - name: Summary
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          OPENEDX_DIGEST="${{ needs.build-openedx.outputs.image_digest }}"
          MFE_DIGEST="${{ needs.build-mfe.outputs.image_digest }}"
          echo "### Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** GitOps update" >> $GITHUB_STEP_SUMMARY
          echo "**Target environment:** \`${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**OpenedX digest:** \`${OPENEDX_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**MFE digest:** \`${MFE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
