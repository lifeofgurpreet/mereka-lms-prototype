name: Build Tutor Images

permissions:
  contents: read
  packages: write
  id-token: write
on:
  push:
    branches:
      - main
    paths:
      - 'requirements-tutor.txt'
      - '.github/actions/setup-python-env/**'
      - 'infrastructure/tutor/config.example.yml'
      - 'infrastructure/tutor/apply-patches.sh'
      - 'infrastructure/tutor/patches/**'
      - 'infrastructure/tutor/custom-apps/**'
      - 'infrastructure/tutor/plugins/**'
      - 'infrastructure/tutor/themes/**'
      - 'infrastructure/tutor/brand-*/**'
      - 'assets/branding/**'
      - 'scripts/infra/prepare-tutor-build-context.sh'
      - 'scripts/infra/prepare-tutor-build-context-ci.sh'
      - 'scripts/ci/preflight-check.sh'
      - 'scripts/infra/sync-tutor-plugin-mirror.sh'
      - 'infrastructure/tutor/apply-patches.sh'
      - 'infrastructure/tutor/patches/**'
      - 'scripts/infra/resolve-build-scope.sh'
      - 'scripts/infra/install-cosign.sh'
      - 'scripts/infra/install-trivy.sh'
      - 'scripts/infra/install-envsubst.sh'
      - 'scripts/infra/generate-build-provenance.sh'
      - 'scripts/infra/generate-release-bundle.sh'
      - 'scripts/release/emit-proof-envelope.sh'
      - 'scripts/release/render_control_plane_release_bundle_projection.py'
      - 'scripts/release/generate_release_object.py'
      - 'scripts/release/generate_truth_ledger.py'
      - 'scripts/release/release-gate.sh'
      - 'scripts/qa/verify-control-plane-release-bundle-projection.sh'
      - 'scripts/release/release_object_bindings.py'
      - 'scripts/infra/build-openedx-image.sh'
      - 'scripts/infra/build-mfe-image.sh'
      - 'scripts/infra/release-openedx-gitops.sh'
      - 'scripts/infra/resolve-image-digest.sh'
      - 'scripts/lib/lane-normalize.sh'
      - 'bin/lms-ops'
      - 'scripts/qa/verify-build-provenance.sh'
      - 'scripts/qa/verify-openedx-image-branding.sh'
      - 'scripts/qa/verify-release-bundle.sh'
      - 'scripts/qa/verify-release-object.sh'
      - 'scripts/qa/verify-mfe-image-branding.sh'
      - 'scripts/qa/verify-mfe-runtime-contract.sh'
      - '.github/workflows/build-tutor-images.yml'
      - '!infrastructure/tutor/**/*.md'
      - '!infrastructure/tutor/mfe-build/**'
  workflow_dispatch:
    inputs:
      lane_mode:
        description: 'Routing override for build jobs'
        type: choice
        options:
          - auto
          - fastlane
          - fastlane-required
          - fallback
        default: auto
      build_openedx:
        description: 'Build OpenEdX image (LMS/CMS)'
        type: boolean
        default: true
      build_mfe:
        description: 'Build MFE image'
        type: boolean
        default: true
      update_gitops:
        description: 'Manual cross-repo GitOps bridge after build (guarded; not the standard dev promotion path)'
        type: boolean
        default: false
      target_environment:
        description: 'GitOps target environment (required when update_gitops=true)'
        type: choice
        options:
          - select-environment
          - production
          - staging
        default: select-environment
      image_tag:
        description: 'Image tag (default: git SHA)'
        type: string
        required: false
      build_profile:
        description: 'Build profile: proof is promotable; fast is cache-oriented and non-promotable'
        type: choice
        options:
          - proof
          - fast
        default: proof
      mfe_build_profile:
        description: 'MFE build profile override'
        type: choice
        options:
          - proof
          - fast
        default: proof

concurrency:
  # Main builds share one workflow-level slot so push and workflow_dispatch
  # runs cannot race each other into competing release artifacts. Non-main refs
  # stay supersedable at the workflow level.
  group: build-tutor-images-${{ github.ref == 'refs/heads/main' && 'main' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io/biji-biji-initiative/mereka-lms
  DOCKER_BUILDKIT: 1

jobs:
  cancel-superseded-queued-main-builds:
    name: Cancel Superseded Queued Main Builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older queued Build Tutor Images runs on main
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.notice('Skipping queued-build janitor outside main.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const cancelled = [];

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'build-tutor-images.yml',
                branch: 'main',
                status: 'queued',
                per_page: 100,
              }
            );

            for (const run of runs) {
              if (run.id === currentRunId || run.id > currentRunId) {
                continue;
              }

              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              cancelled.push({
                id: run.id,
                createdAt: run.created_at,
                url: run.html_url,
              });
            }

            if (cancelled.length === 0) {
              core.notice('No older queued Build Tutor Images runs found on main.');
              return;
            }

            core.summary
              .addHeading('Cancelled older queued Build Tutor Images runs on main')
              .addTable([
                [
                  { data: 'Run ID', header: true },
                  { data: 'Created At', header: true },
                  { data: 'URL', header: true },
                ],
                ...cancelled.map((run) => [
                  String(run.id),
                  run.createdAt,
                  run.url,
                ]),
              ]);
            await core.summary.write();

  resolve-build-scope:
    name: Resolve Build Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cancel-superseded-queued-main-builds
    permissions:
      contents: read
    outputs:
      build_openedx: ${{ steps.scope.outputs.build_openedx }}
      build_mfe: ${{ steps.scope.outputs.build_mfe }}
      scope_label: ${{ steps.scope.outputs.scope_label }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve build scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUILD_OPENEDX: ${{ inputs.build_openedx }}
          INPUT_BUILD_MFE: ${{ inputs.build_mfe }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p var/ci

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            build_openedx="${INPUT_BUILD_OPENEDX}"
            build_mfe="${INPUT_BUILD_MFE}"
            scope_label="manual"
            {
              echo "build_openedx=${build_openedx}"
              echo "build_mfe=${build_mfe}"
              echo "scope_label=${scope_label}"
            } >> "$GITHUB_OUTPUT"

            {
              echo "### Build Scope"
              echo "- Scope label: \`${scope_label}\`"
              echo "- Build OpenEdX: \`${build_openedx}\`"
              echo "- Build MFE: \`${build_mfe}\`"
              echo
              echo "- Source: workflow_dispatch inputs"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          git diff --name-only "$base_sha" "$PUSH_HEAD_SHA" > var/ci/build-scope-files.txt

          ./scripts/infra/resolve-build-scope.sh \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file var/ci/build-scope-summary.md \
            < var/ci/build-scope-files.txt

          {
            echo "### Build Scope"
            echo "- Diff range: \`${base_sha}..${PUSH_HEAD_SHA}\`"
            cat var/ci/build-scope-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cancel-superseded-queued-main-builds
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate Tutor config
        run: |
          # Check for syntax errors in YAML configs (no pip on ARC runners)
          python3 -c "
          import json, re, sys
          with open('infrastructure/tutor/config.example.yml') as f:
              content = f.read()
          # Basic syntax: no tabs, valid UTF-8, non-empty
          if '\t' in content:
              print('ERROR: tabs in YAML'); sys.exit(1)
          if not content.strip():
              print('ERROR: empty file'); sys.exit(1)
          print('✅ Config YAML basic validation passed')
          "

      - name: Lint shell scripts
        continue-on-error: true  # ARC runner image lacks xz; tracked as CI infra debt
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './infrastructure/tutor'
          severity: warning

  render-preflight:
    name: Render Preflight Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve-build-scope, lint]
    if: ${{ needs.resolve-build-scope.outputs.build_openedx == 'true' || needs.resolve-build-scope.outputs.build_mfe == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'
          isolated-venv: 'true'
          cache-isolated-venv: 'true'
          isolated-venv-name: 'tutor-preflight-py312'

      - name: Run rendered Dockerfile preflight tripwire
        env:
          TUTOR_VENV: ${{ github.workspace }}/.cache/venvs/tutor-preflight-py312
        run: ./scripts/ci/preflight-check.sh

  prepare-build-context:
    name: Prepare Tutor Build Context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve-build-scope, lint, render-preflight]
    if: ${{ needs.resolve-build-scope.outputs.build_openedx == 'true' || needs.resolve-build-scope.outputs.build_mfe == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Resolve build-context prep target
        id: prep-target
        env:
          BUILD_OPENEDX: ${{ needs.resolve-build-scope.outputs.build_openedx }}
          BUILD_MFE: ${{ needs.resolve-build-scope.outputs.build_mfe }}
        run: |
          if [[ "$BUILD_OPENEDX" == 'true' && "$BUILD_MFE" == 'true' ]]; then
            echo "target=all" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_OPENEDX" == 'true' ]]; then
            echo "target=openedx" >> "$GITHUB_OUTPUT"
          elif [[ "$BUILD_MFE" == 'true' ]]; then
            echo "target=mfe" >> "$GITHUB_OUTPUT"
          else
            echo "No Tutor build context requested." >&2
            exit 1
          fi

      - name: Prepare Tutor build context
        env:
          BUILD_OPENEDX: ${{ needs.resolve-build-scope.outputs.build_openedx }}
          BUILD_MFE: ${{ needs.resolve-build-scope.outputs.build_mfe }}
        run: |
          ./scripts/infra/prepare-tutor-build-context-ci.sh --target "${{ steps.prep-target.outputs.target }}"
          mkdir -p var/ci
          if [[ "$BUILD_OPENEDX" == 'true' ]]; then
            tar -C tutor_env/env/build -czf var/ci/openedx-build-context.tgz openedx
          fi
          if [[ "$BUILD_MFE" == 'true' ]]; then
            tar -C tutor_env/env/plugins/mfe/build -czf var/ci/mfe-build-context.tgz mfe
          fi

      - name: Upload Tutor build-context artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: tutor-build-contexts
          path: var/ci/
          retention-days: 3

  select-build-lane:
    name: Select Build Lane
    runs-on: ubuntu-latest
    needs: [resolve-build-scope]
    if: ${{ needs.resolve-build-scope.outputs.build_openedx == 'true' || needs.resolve-build-scope.outputs.build_mfe == 'true' }}
    permissions:
      contents: read
    outputs:
      runner_label: ${{ steps.select.outputs.runner_label }}
      decision: ${{ steps.select.outputs.decision }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Select runner lane
        id: select
        uses: ./.github/actions/select-build-lane
        with:
          enabled: ${{ vars.CI_FASTLANE_BUILD_ENABLED }}
          lane_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.lane_mode || 'auto' }}
          fastlane_label: ${{ vars.CI_FASTLANE_BUILD_LABEL || 'cie-vps-fastlane-build' }}
          timezone: ${{ vars.CI_FASTLANE_BUILD_TIMEZONE }}
          office_hours_start: ${{ vars.CI_FASTLANE_BUILD_WINDOW_START }}
          office_hours_end: ${{ vars.CI_FASTLANE_BUILD_WINDOW_END }}
          runner_status_token: ${{ secrets.FASTLANE_RUNNER_STATUS_TOKEN }}
          github_app_id: ${{ secrets.FASTLANE_GITHUB_APP_ID }}
          github_app_installation_id: ${{ secrets.FASTLANE_GITHUB_APP_INSTALLATION_ID }}
          github_app_private_key: ${{ secrets.FASTLANE_GITHUB_APP_PRIVATE_KEY }}

  build-openedx:
    name: Build OpenEdX Image
    runs-on: ${{ needs.select-build-lane.outputs.runner_label }}
    concurrency:
      # Never cancel an in-progress main build. Queue the newest run behind the
      # active main build after the janitor clears older queued workflow runs.
      group: build-openedx-${{ github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: false
    # Keep outer timeout comfortably above inner image-build timeout (170m)
    # so pre/post-build checks and artifact upload have recovery headroom.
    timeout-minutes: 200
    needs: [resolve-build-scope, lint, prepare-build-context, select-build-lane]
    if: ${{ needs.resolve-build-scope.outputs.build_openedx == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Free disk space for large image builds
        run: |
          # GitHub-hosted runners have ~14GB free. OpenEdX image build needs
          # ~12GB+ (base layers + pip packages + webpack + image export).
          # Remove pre-installed tools we don't need to reclaim ~6GB.
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Enable swap for heavy image builds
        run: |
          # GitHub hosted runners can OOM during large Open edX layer export.
          # Add swap to reduce abrupt SIGKILL during docker/buildx workloads.
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Download OpenEdX build context artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tutor-build-contexts
          path: var/ci

      - name: Extract OpenEdX build context artifact
        run: |
          mkdir -p tutor_env/env/build
          tar -C tutor_env/env/build -xzf var/ci/openedx-build-context.tgz
          test -f tutor_env/env/build/openedx/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          # OpenEdX now builds from the rendered Tutor context via the repo-owned
          # build-openedx-image.sh helper. That removes the last local-image
          # dependency from this lane, so we can use docker-container and first-
          # class GHA cache exporters like the MFE build.
          driver: docker-container
          # This job runs on disposable runners, and the OpenEdX lane has
          # already proven that Buildx teardown can hang long after the image
          # digest is published. Skip builder cleanup to keep the critical path
          # bounded; the runner is discarded at job exit anyway.
          cleanup: false

      - name: Fix DinD network MTU
        run: |
          # ARC DinD containers inherit docker0 bridge MTU 1500, but the pod
          # network (eth0) uses MTU 1280 on rke2-nonprod.  Large packets
          # (TLS handshakes, apt downloads) get silently dropped.
          #
          # MTU authority lives in the heavy-runner dockerd startup flags and
          # ARC daemon config. Do not rewrite "mtu" here; doing so collides
          # with dockerd's existing --mtu flag during SIGHUP reload.
          #
          # This job-time step only injects DNS fallback into daemon.json, then
          # reloads dockerd so buildx/buildkit can pick up the resolver config.
          #
          # Uses --pid=host + nsenter to access the DinD daemon's mount
          # namespace and modify /etc/docker/daemon.json in-place.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"dns\":[\"8.8.8.8\",\"1.1.1.1\"]}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            echo "DinD daemon.json written with DNS fallback, dockerd reloaded."
            sleep 2
            # Verify the MTU took effect
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR (build cache)
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build OpenEdX image
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          mkdir -p var/ci

          # Cache strategy:
          #   --cache-from=type=gha            first-class shared BuildKit cache
          #   --cache-to=type=gha,mode=max    persist cache state between runs
          #   --cache-from=type=registry      secondary warm path from last push
          #   BUILDKIT_INLINE_CACHE=1         preserve registry fallback metadata
          BUILD_PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.build_profile || 'proof' }}"
          if [[ "${BUILD_PROFILE}" == "proof" ]]; then
            CACHE_REF="${{ env.REGISTRY }}/openedx:mereka-brand"
          else
            CACHE_REF="${{ env.REGISTRY }}/openedx:mereka-brand-fast"
          fi
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"
          MUTABLE_ARGS=()
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${BUILD_PROFILE}" == "proof" ]]; then
            MUTABLE_ARGS=(--mutable-tag mereka-brand)
          fi

          BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (
            while true; do
              echo "[build-openedx-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          if ! timeout 170m ./scripts/infra/build-openedx-image.sh \
            --context-dir "${TUTOR_ROOT}/env/build/openedx" \
            --dockerfile "${TUTOR_ROOT}/env/build/openedx/Dockerfile" \
            --image-repo "${{ env.REGISTRY }}/openedx" \
            --primary-tag "${TAG}" \
            --secondary-tag "${SHORT_SHA}" \
            --cache-ref "${CACHE_REF}" \
            --build-profile "${BUILD_PROFILE}" \
            "${MUTABLE_ARGS[@]}" \
            2>&1 | tee var/ci/build-openedx.log; then
            echo "OpenedX image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT
          BUILD_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_START=${BUILD_START}" >> var/ci/build-openedx-timing.env
          echo "BUILD_END=${BUILD_END}" >> var/ci/build-openedx-timing.env

      - name: Verify OpenEdX build cache health
        if: always()
        run: |
          set -euo pipefail
          LOG="var/ci/build-openedx.log"
          SUMMARY=""
          FAILURES=0

          if [[ ! -f "$LOG" ]]; then
            echo "::warning::No build log found — cache verification skipped"
            exit 0
          fi

          # 1. Check cache-from was in the buildx command
          if grep -q 'cache-from=type=registry' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ --cache-from=type=registry present in build command"
          else
            SUMMARY="${SUMMARY}\n❌ --cache-from NOT found in build command"
            FAILURES=$((FAILURES + 1))
          fi

          if grep -q 'cache-from=type=gha' "$LOG" && grep -q 'cache-to=type=gha,mode=max' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ GHA cache read/write is enabled for OpenEdX build"
          else
            SUMMARY="${SUMMARY}\n❌ GHA cache read/write flags NOT found in OpenEdX build command"
            FAILURES=$((FAILURES + 1))
          fi

          # 2. Check cache manifest was imported
          if grep -q 'importing cache manifest from' "$LOG"; then
            CACHE_REF_USED=$(grep 'importing cache manifest from' "$LOG" | head -1 | sed 's/.*from //')
            SUMMARY="${SUMMARY}\n✅ Cache manifest imported from: ${CACHE_REF_USED}"
          else
            SUMMARY="${SUMMARY}\n⚠️  No cache manifest import found (bootstrap or auth failure)"
          fi

          # 3. Check inline cache was exported
          if grep -q 'preparing layers for inline cache' "$LOG"; then
            EXPORT_TIME=$(grep 'preparing layers for inline cache.*done' "$LOG" | head -1 | sed 's/.*cache //')
            SUMMARY="${SUMMARY}\n✅ Inline cache exported (${EXPORT_TIME})"
          else
            SUMMARY="${SUMMARY}\n❌ Inline cache export NOT found — next build will be cold"
            FAILURES=$((FAILURES + 1))
          fi

          # 4. Check BUILDKIT_INLINE_CACHE=1 was in the command
          if grep -q 'BUILDKIT_INLINE_CACHE=1' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ BUILDKIT_INLINE_CACHE=1 present"
          else
            SUMMARY="${SUMMARY}\n❌ BUILDKIT_INLINE_CACHE=1 NOT found"
            FAILURES=$((FAILURES + 1))
          fi

          # 5. Count CACHED vs rebuilt layers
          CACHED_LAYERS=$(grep -c 'CACHED' "$LOG" 2>/dev/null || echo 0)
          TOTAL_LAYERS=$(grep -cE '^\#[0-9]+ \[' "$LOG" 2>/dev/null || echo 0)
          SUMMARY="${SUMMARY}\n📊 Layers: ${CACHED_LAYERS} cached / ${TOTAL_LAYERS} total"

          # 6. Build timing
          if [[ -f var/ci/build-openedx-timing.env ]]; then
            source var/ci/build-openedx-timing.env
            SUMMARY="${SUMMARY}\n⏱️  Build: ${BUILD_START} → ${BUILD_END}"
          fi

          # Emit summary
          echo -e "\n=== OpenEdX Build Cache Health ==="
          echo -e "$SUMMARY"

          # Write to GitHub step summary
          {
            echo "### OpenEdX Build Cache Health"
            echo -e "$SUMMARY"
            if [[ $FAILURES -gt 0 ]]; then
              echo ""
              echo "**⚠️ ${FAILURES} cache health check(s) failed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $FAILURES -gt 0 ]]; then
            echo "::warning::${FAILURES} cache health check(s) failed for OpenEdX build"
          fi

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/openedx:${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Resolve pushed openedx digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/openedx:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve openedx digest for ${REF} (got: '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "### OpenEdX Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "**Mutable tag:** \`mereka-brand\` (compatibility alias only; dev promotion is infra-owned)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**OpenedX digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

  build-mfe:
    name: Build MFE Image
    runs-on: ${{ needs.select-build-lane.outputs.runner_label }}
    concurrency:
      # Never cancel an in-progress main build. Queue the newest run behind the
      # active main build after the janitor clears older queued workflow runs.
      group: build-mfe-${{ github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 150
    needs: [resolve-build-scope, lint, prepare-build-context, select-build-lane]
    if: ${{ needs.resolve-build-scope.outputs.build_mfe == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Enable swap for heavy image builds
        run: |
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Download MFE build context artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tutor-build-contexts
          path: var/ci

      - name: Extract MFE build context artifact
        run: |
          mkdir -p tutor_env/env/plugins/mfe/build
          tar -C tutor_env/env/plugins/mfe/build -xzf var/ci/mfe-build-context.tgz
          test -f tutor_env/env/plugins/mfe/build/mfe/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: docker-container
          # Heavy image-build lanes run on ephemeral runners, so leaving the
          # builder behind is cheaper than risking post-job cleanup stalls.
          cleanup: false
          # Note: the previous attempt to cap parallelism via
          #   buildkitd-flags: --oci-worker-max-parallelism=4
          # was bogus — that flag does not exist in buildkitd. Baseline builds
          # (pre-cap) ran webpack to completion without OOM on 12GB heavy
          # builders, so no cap is required. If concurrent MFE webpack starts
          # pushing memory later, the correct lever is config-inline:
          #   config-inline: |
          #     [worker.oci]
          #       max-parallelism = 4
          # which writes a real buildkitd.toml the worker respects.

      - name: Fix DinD network MTU
        run: |
          # ARC DinD containers inherit docker0 bridge MTU 1500, but the pod
          # network (eth0) uses MTU 1280 on rke2-nonprod.  Large packets
          # (TLS handshakes, apt downloads) get silently dropped.
          #
          # MTU authority lives in the heavy-runner dockerd startup flags and
          # ARC daemon config. Do not rewrite "mtu" here; doing so collides
          # with dockerd's existing --mtu flag during SIGHUP reload.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"dns\":[\"8.8.8.8\",\"1.1.1.1\"]}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            echo "DinD daemon.json written with DNS fallback, dockerd reloaded."
            sleep 2
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR (build cache)
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build MFE image
        run: |
          set -euo pipefail
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          export NODE_OPTIONS="--max-old-space-size=6144"
          mkdir -p var/ci

          # Cache strategy: same as openedx build (see D4 comments above).
          BUILD_PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.mfe_build_profile || 'proof' }}"
          if [[ "${BUILD_PROFILE}" == "proof" ]]; then
            CACHE_REF="${{ env.REGISTRY }}/mfe:mereka-brand"
          else
            CACHE_REF="${{ env.REGISTRY }}/mfe:mereka-brand-fast"
          fi
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"
          MUTABLE_ARGS=()
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${BUILD_PROFILE}" == "proof" ]]; then
            MUTABLE_ARGS=(--mutable-tag mereka-brand)
          fi

          BUILD_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (
            while true; do
              echo "[build-mfe-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          # 140m: 12 MFEs + learner-record on separate Node 18 base needs extra time.
          # Note: BUILDKIT_MAX_PARALLELISM env var is not read by the
          # docker-container driver, so exporting it here was a no-op. Removed.
          if ! timeout 140m ./scripts/infra/build-mfe-image.sh \
            --context-dir "${TUTOR_ROOT}/env/plugins/mfe/build/mfe" \
            --dockerfile "${TUTOR_ROOT}/env/plugins/mfe/build/mfe/Dockerfile" \
            --image-repo "${{ env.REGISTRY }}/mfe" \
            --primary-tag "${TAG}" \
            --secondary-tag "${SHORT_SHA}" \
            --cache-ref "${CACHE_REF}" \
            --build-profile "${BUILD_PROFILE}" \
            "${MUTABLE_ARGS[@]}" \
            2>&1 | tee var/ci/build-mfe.log; then
            echo "MFE image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT
          BUILD_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_START=${BUILD_START}" >> var/ci/build-mfe-timing.env
          echo "BUILD_END=${BUILD_END}" >> var/ci/build-mfe-timing.env

      - name: Verify MFE build cache health
        if: always()
        run: |
          set -euo pipefail
          LOG="var/ci/build-mfe.log"
          SUMMARY=""
          FAILURES=0

          if [[ ! -f "$LOG" ]]; then
            echo "::warning::No build log found — cache verification skipped"
            exit 0
          fi

          # 1. Check cache-from was in the buildx command
          if grep -q 'cache-from=type=registry' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ --cache-from=type=registry present in build command"
          else
            SUMMARY="${SUMMARY}\n❌ --cache-from NOT found in build command"
            FAILURES=$((FAILURES + 1))
          fi

          if grep -q 'cache-from=type=gha' "$LOG" && grep -q 'cache-to=type=gha,mode=max' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ GHA cache read/write is enabled for MFE build"
          else
            SUMMARY="${SUMMARY}\n❌ GHA cache read/write flags NOT found in build command"
            FAILURES=$((FAILURES + 1))
          fi

          # 2. Check cache manifest was imported
          if grep -q 'importing cache manifest from' "$LOG"; then
            CACHE_REF_USED=$(grep 'importing cache manifest from' "$LOG" | head -1 | sed 's/.*from //')
            SUMMARY="${SUMMARY}\n✅ Cache manifest imported from: ${CACHE_REF_USED}"
          else
            SUMMARY="${SUMMARY}\n⚠️  No cache manifest import found (bootstrap or auth failure)"
          fi

          # 3. Check inline cache was exported
          if grep -q 'preparing layers for inline cache' "$LOG"; then
            EXPORT_TIME=$(grep 'preparing layers for inline cache.*done' "$LOG" | head -1 | sed 's/.*cache //')
            SUMMARY="${SUMMARY}\n✅ Inline cache exported (${EXPORT_TIME})"
          else
            SUMMARY="${SUMMARY}\n❌ Inline cache export NOT found — next build will be cold"
            FAILURES=$((FAILURES + 1))
          fi

          # 4. Check BUILDKIT_INLINE_CACHE=1 was in the command
          if grep -q 'BUILDKIT_INLINE_CACHE=1' "$LOG"; then
            SUMMARY="${SUMMARY}\n✅ BUILDKIT_INLINE_CACHE=1 present"
          else
            SUMMARY="${SUMMARY}\n❌ BUILDKIT_INLINE_CACHE=1 NOT found"
            FAILURES=$((FAILURES + 1))
          fi

          # 5. Count CACHED vs rebuilt layers
          CACHED_LAYERS=$(grep -c 'CACHED' "$LOG" 2>/dev/null || echo 0)
          TOTAL_LAYERS=$(grep -cE '^\#[0-9]+ \[' "$LOG" 2>/dev/null || echo 0)
          SUMMARY="${SUMMARY}\n📊 Layers: ${CACHED_LAYERS} cached / ${TOTAL_LAYERS} total"

          # 6. Build timing
          if [[ -f var/ci/build-mfe-timing.env ]]; then
            source var/ci/build-mfe-timing.env
            SUMMARY="${SUMMARY}\n⏱️  Build: ${BUILD_START} → ${BUILD_END}"
          fi

          # Emit summary
          echo -e "\n=== MFE Build Cache Health ==="
          echo -e "$SUMMARY"

          # Write to GitHub step summary
          {
            echo "### MFE Build Cache Health"
            echo -e "$SUMMARY"
            if [[ $FAILURES -gt 0 ]]; then
              echo ""
              echo "**⚠️ ${FAILURES} cache health check(s) failed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $FAILURES -gt 0 ]]; then
            echo "::warning::${FAILURES} cache health check(s) failed for MFE build"
          fi

      - name: Verify generated MFE runtime contract
        run: |
          mkdir -p var/ci
          scripts/qa/verify-mfe-runtime-contract.sh \
            --generated-env-config "${TUTOR_ROOT}/env/plugins/mfe/build/mfe/env.config.jsx" \
            | tee var/ci/verify-mfe-generated-runtime-contract.log

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/mfe:${TAG}" >> $GITHUB_OUTPUT

      - name: Resolve pushed mfe digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/mfe:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve mfe digest for ${REF} (got: '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "### MFE Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "**Mutable tag:** \`mereka-brand\` (compatibility alias only; dev promotion is infra-owned)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**MFE digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload generated MFE runtime contract log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: mfe-generated-runtime-contract-log
          path: var/ci/verify-mfe-generated-runtime-contract.log
          retention-days: 3

  scan-openedx-image:
    name: Post-push OpenEdX Scan
    runs-on: mereka-k8s-heavy-builders
    timeout-minutes: 45
    needs: [build-openedx]
    if: ${{ needs.build-openedx.result == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          driver: docker-container

      - name: Fix DinD network MTU
        run: |
          # Keep post-push image verification aligned with the heavy build
          # lanes. MTU authority lives in the heavy-runner dockerd startup
          # flags and ARC daemon config; this step only injects DNS fallback.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"dns\":[\"8.8.8.8\",\"1.1.1.1\"]}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            sleep 2
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.ORG_GHCR_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify OpenEdX image branding contract
        continue-on-error: true  # Non-blocking until FE-003 (LMS SCSS entry point) is resolved
        env:
          OPENEDX_IMAGE_REF: ${{ env.REGISTRY }}/openedx@${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          EXPECTED_LMS_BRANDING_REV="$(sed -nE 's/.*--mereka-branding-rev:[[:space:]]*\"([^\"]+)\".*/\1/p' infrastructure/tutor/themes/mereka/lms/static/css/mereka-overrides.css | head -n 1)"
          scripts/qa/verify-openedx-image-branding.sh "${OPENEDX_IMAGE_REF}" "${EXPECTED_LMS_BRANDING_REV}" \
            | tee var/ci/verify-openedx-image-branding.log

      - name: Upload OpenEdX branding verification log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: openedx-branding-contract-log
          path: var/ci/verify-openedx-image-branding.log
          retention-days: 3

      - name: Generate SBOM for OpenEdX image
        continue-on-error: true  # Non-blocking: SBOM is informational, should not block image delivery
        env:
          OPENEDX_IMAGE_REF: ${{ env.REGISTRY }}/openedx@${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          # Install syft v1.42.1 — checksum computed 2026-03-05
          SYFT_VERSION="v1.42.1"
          SYFT_INSTALL_SHA="01d0d15aff461f1bc54d1716feb4824341918c4f37e1b6a5a0c0caee2251be67"
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            -o /tmp/syft-install.sh
          echo "${SYFT_INSTALL_SHA}  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b "$HOME/.local/bin"
          rm /tmp/syft-install.sh
          set +e
          timeout 20m "$HOME/.local/bin/syft" scan "registry:${OPENEDX_IMAGE_REF}" \
            -o cyclonedx-json=var/ci/sbom-openedx.cdx.json
          sbom_status=$?
          set -e
          if [[ "$sbom_status" -eq 0 ]]; then
            exit 0
          fi
          if [[ "$sbom_status" -eq 124 ]]; then
            echo "OpenEdX registry SBOM generation timed out after 20m; continuing without SBOM artifact." >&2
            echo "timeout" > var/ci/sbom-openedx.status.txt
          else
            echo "OpenEdX registry SBOM generation failed with exit code ${sbom_status}; continuing without SBOM artifact." >&2
            echo "error:${sbom_status}" > var/ci/sbom-openedx.status.txt
          fi
          exit 0

      - name: Upload OpenEdX SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: sbom-openedx
          path: var/ci/sbom-openedx*
          retention-days: 90

      - name: Install Trivy CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/infra/install-trivy.sh

      - name: Scan OpenEdX image for vulnerabilities
        continue-on-error: true  # Non-blocking: upstream CVEs should not block image delivery
        env:
          OPENEDX_IMAGE_REF: ${{ env.REGISTRY }}/openedx@${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          set +e
          timeout 20m trivy image \
            --format json \
            --output var/ci/trivy-openedx.json \
            --ignorefile .trivyignore \
            --severity CRITICAL,HIGH \
            "${OPENEDX_IMAGE_REF}"
          trivy_status=$?
          set -e

          if [[ "$trivy_status" -eq 124 ]]; then
            echo "OpenEdX Trivy scan timed out after 20m; continuing without vulnerability verdict." >&2
            echo "timeout" > var/ci/trivy-openedx.status.txt
            exit 0
          fi
          if [[ "$trivy_status" -ne 0 ]]; then
            echo "OpenEdX Trivy scan failed with exit code ${trivy_status}; continuing without vulnerability verdict." >&2
            echo "error:${trivy_status}" > var/ci/trivy-openedx.status.txt
            exit 0
          fi

          CRITICAL_COUNT=$(jq '[(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' var/ci/trivy-openedx.json)
          echo "CRITICAL vulnerabilities: ${CRITICAL_COUNT}"
          echo "critical-count:${CRITICAL_COUNT}" > var/ci/trivy-openedx.status.txt

          jq -r '
            ["Severity","PkgName","VulnerabilityID","Title"],
            ((.Results // [])[] | .Vulnerabilities // []
              | .[]
              | select(.Severity == "HIGH")
              | [.Severity, .PkgName, .VulnerabilityID, (.Title // "-")])
            | @tsv' var/ci/trivy-openedx.json \
            > var/ci/trivy-openedx-high-summary.txt || true

          if [[ "${CRITICAL_COUNT}" -gt 0 ]]; then
            echo "::warning::${CRITICAL_COUNT} CRITICAL vulnerabilities found in openedx image; release delivery remains non-blocking."
            jq -r '(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName)\t\(.Title // "-")"' \
              var/ci/trivy-openedx.json >&2
          fi

      - name: Upload Trivy OpenEdX scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: trivy-openedx-scan
          path: var/ci/trivy-openedx*
          retention-days: 3

