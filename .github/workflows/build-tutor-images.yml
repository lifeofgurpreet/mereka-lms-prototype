name: Build Tutor Images

permissions: {}
on:
  push:
    branches:
      - main
    paths:
      - 'deploy/k8s/base/apps/openedx/**'
      - 'infrastructure/tutor/**'
      - 'assets/branding/**'
      - '.github/workflows/build-tutor-images.yml'
  workflow_dispatch:
    inputs:
      build_openedx:
        description: 'Build OpenEdX image (LMS/CMS)'
        type: boolean
        default: true
      build_mfe:
        description: 'Build MFE image'
        type: boolean
        default: true
      update_gitops:
        description: 'Update GitOps after build'
        type: boolean
        default: false
      target_environment:
        description: 'GitOps target environment (required when update_gitops=true)'
        type: choice
        options:
          - select-environment
          - production
          - staging
        default: select-environment
      image_tag:
        description: 'Image tag (default: git SHA)'
        type: string
        required: false

concurrency:
  # Never cancel in-progress builds on main (prevents orphaned GHCR layers /
  # corrupted GitOps commits). PRs and workflow_dispatch on other refs can still
  # be superseded.
  group: build-tutor-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io/biji-biji-initiative/mereka-lms
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint & Validate
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate Tutor config
        run: |
          # Check for syntax errors in YAML configs (no pip on ARC runners)
          python3 -c "
          import json, re, sys
          with open('infrastructure/tutor/config.example.yml') as f:
              content = f.read()
          # Basic syntax: no tabs, valid UTF-8, non-empty
          if '\t' in content:
              print('ERROR: tabs in YAML'); sys.exit(1)
          if not content.strip():
              print('ERROR: empty file'); sys.exit(1)
          print('✅ Config YAML basic validation passed')
          "

      - name: Lint shell scripts
        continue-on-error: true  # ARC runner image lacks xz; tracked as CI infra debt
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          scandir: './infrastructure/tutor'
          severity: warning

  build-openedx:
    name: Build OpenEdX Image
    runs-on: mereka-k8s-heavy-builders
    # Keep outer timeout comfortably above inner image-build timeout (170m)
    # so pre/post-build checks and artifact upload have recovery headroom.
    timeout-minutes: 200
    needs: lint
    if: ${{ github.event_name == 'push' || inputs.build_openedx }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Free disk space for large image builds
        run: |
          # GitHub-hosted runners have ~14GB free. OpenEdX image build needs
          # ~12GB+ (base layers + pip packages + webpack + image export).
          # Remove pre-installed tools we don't need to reclaim ~6GB.
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Enable swap for heavy image builds
        run: |
          # GitHub hosted runners can OOM during large Open edX layer export.
          # Add swap to reduce abrupt SIGKILL during docker/buildx workloads.
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Verify Tutor version
        run: tutor --version

      - name: Set up Tutor environment
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          mkdir -p $TUTOR_ROOT

          # Sync plugin package to Tutor plugins directory.
          # Cannot source tutor-env.sh directly (requires .venv which CI lacks).
          PLUGIN_SRC_DIR="$(pwd)/infrastructure/tutor/plugins"
          PLUGIN_DIR="${TUTOR_PLUGINS_DIR:-$HOME/.local/share/tutor-plugins}"
          mkdir -p "$PLUGIN_DIR"
          cp "$PLUGIN_SRC_DIR/mereka_lms.py" "$PLUGIN_DIR/mereka_lms.py"
          cp "$PLUGIN_SRC_DIR/mereka_lms_mfe_slots.py" "$PLUGIN_DIR/mereka_lms_mfe_slots.py"
          cp -R "$PLUGIN_SRC_DIR/_mereka_lms" "$PLUGIN_DIR/_mereka_lms"

          # Enable the Mereka LMS plugin so hooks fire during image build
          tutor plugins enable mereka_lms

          # Initialize Tutor config
          tutor config save \
            --set LMS_HOST=academyv2.mereka.io \
            --set CMS_HOST=studio.academyv2.mereka.io \
            --set ENABLE_HTTPS=true

          # Apply patches
          ./infrastructure/tutor/apply-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          # Uses 'docker' driver: tutor defaults --output=type=docker to load
          # images into the local daemon for downstream steps (branding
          # verification, SBOM, Trivy, push).
          # Cache strategy: BUILDKIT_INLINE_CACHE=1 embeds cache metadata in
          # the built image. After push to GHCR, next build pulls metadata via
          # --cache-from=type=registry and reuses matching layers.
          driver: docker

      - name: Fix DinD network MTU
        run: |
          # ARC DinD containers inherit docker0 bridge MTU 1500, but the pod
          # network (eth0) uses MTU 1280 on rke2-nonprod.  Large packets
          # (TLS handshakes, apt downloads) get silently dropped.
          # Fix: write daemon.json with correct MTU and SIGHUP dockerd.
          #
          # Uses --pid=host + nsenter to access the DinD daemon's mount
          # namespace and modify /etc/docker/daemon.json in-place.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"mtu\":1280}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            echo "DinD daemon.json written with MTU=1280, dockerd reloaded."
            sleep 2
            # Verify the MTU took effect
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR (build cache)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build OpenEdX image
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1

          # Cache strategy (D4 — build cache realization):
          #   --no-registry-cache: skip upstream overhangio cache refs (can't push)
          #   -d --cache-from:     pull our last GHCR image's inline cache metadata
          #   -a BUILDKIT_INLINE_CACHE=1: embed cache metadata in built image
          #
          # On first run (bootstrap), cache-from silently misses. After push,
          # subsequent builds reuse matching layers via inline cache metadata.
          # Expected savings: ~25-35 min on cache hit (base+pip+npm+assets).
          CACHE_REF="${{ env.REGISTRY }}/openedx:mereka-brand"

          (
            while true; do
              echo "[build-openedx-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          if ! timeout 170m tutor images build openedx \
            --no-registry-cache \
            -d "--cache-from=type=registry,ref=${CACHE_REF}" \
            -a BUILDKIT_INLINE_CACHE=1; then
            echo "OpenedX image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

          # Tutor 21 with buildx names images docker.io/overhangio/openedx:*
          # Retag for downstream steps (branding verify, SBOM, Trivy, push).
          TUTOR_IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'overhangio/openedx:' | head -1)"
          if [[ -n "$TUTOR_IMAGE" && -z "$(docker images -q tutor_local/openedx:latest 2>/dev/null)" ]]; then
            echo "Retagging $TUTOR_IMAGE → tutor_local/openedx:latest"
            docker tag "$TUTOR_IMAGE" tutor_local/openedx:latest
          fi

      - name: Verify OpenEdX image branding contract
        continue-on-error: true  # Non-blocking until FE-003 (LMS SCSS entry point) is resolved
        run: |
          # Since ADR-012 eliminated runtime CSS overlays, branding CSS must be
          # baked into the image. Verify the branded CSS file exists and the
          # branding revision marker is present.
          mkdir -p var/ci
          EXPECTED_LMS_BRANDING_REV="$(sed -nE 's/.*--mereka-branding-rev:[[:space:]]*"([^"]+)".*/\1/p' infrastructure/tutor/themes/mereka/lms/static/css/mereka-overrides.css | head -n 1)"
          echo "Expected LMS branding rev: ${EXPECTED_LMS_BRANDING_REV:-<none>}"

          # Extract staticfiles.json from the built image to verify collectstatic ran
          docker run --rm tutor_local/openedx:latest \
            python -c "import json; data=json.load(open('/openedx/staticfiles/staticfiles.json')); css=data['paths'].get('mereka/css/mereka-overrides.css','MISSING'); print(f'CSS hash: {css}')" \
            | tee var/ci/verify-openedx-image-branding.log

          # Verify the hashed CSS file actually exists in the image
          HASHED_CSS="$(docker run --rm tutor_local/openedx:latest \
            python -c "import json; data=json.load(open('/openedx/staticfiles/staticfiles.json')); print(data['paths'].get('mereka/css/mereka-overrides.css','MISSING'))")"
          if [[ "$HASHED_CSS" == "MISSING" ]]; then
            echo "FAIL: mereka-overrides.css not found in staticfiles.json" | tee -a var/ci/verify-openedx-image-branding.log
            exit 1
          fi
          docker run --rm tutor_local/openedx:latest \
            test -f "/openedx/staticfiles/${HASHED_CSS}" \
            && echo "PASS: /openedx/staticfiles/${HASHED_CSS} exists" | tee -a var/ci/verify-openedx-image-branding.log \
            || { echo "FAIL: /openedx/staticfiles/${HASHED_CSS} missing" | tee -a var/ci/verify-openedx-image-branding.log; exit 1; }

      - name: Generate SBOM for OpenEdX image
        continue-on-error: true  # Non-blocking: SBOM is informational, should not block image push
        run: |
          mkdir -p var/ci
          # Install syft v1.42.1 — checksum computed 2026-03-05
          SYFT_VERSION="v1.42.1"
          SYFT_INSTALL_SHA="01d0d15aff461f1bc54d1716feb4824341918c4f37e1b6a5a0c0caee2251be67"
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            -o /tmp/syft-install.sh
          echo "${SYFT_INSTALL_SHA}  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b "$HOME/.local/bin"
          rm /tmp/syft-install.sh
          # Use docker: source explicitly so syft reads from the local Docker daemon
          # (anchore/sbom-action fails on ARC DinD runners because it can't resolve local images)
          "$HOME/.local/bin/syft" scan "docker:tutor_local/openedx:latest" \
            -o cyclonedx-json=var/ci/sbom-openedx.cdx.json

      - name: Upload OpenEdX SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: sbom-openedx
          path: var/ci/sbom-openedx.cdx.json
          retention-days: 90

      - name: Install Trivy CLI
        run: |
          # trivy v0.69.3 — checksum computed 2026-03-05
          TRIVY_VERSION="v0.69.3"
          TRIVY_INSTALL_SHA="e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            -o /tmp/trivy-install.sh
          echo "${TRIVY_INSTALL_SHA}  /tmp/trivy-install.sh" | sha256sum -c -
          sh /tmp/trivy-install.sh -b "$HOME/.local/bin"
          rm /tmp/trivy-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan OpenEdX image for vulnerabilities
        continue-on-error: true  # Non-blocking: upstream CVEs should not block image delivery
        run: |
          mkdir -p var/ci
          trivy image \
            --format json \
            --output var/ci/trivy-openedx.json \
            --ignorefile .trivyignore \
            --severity CRITICAL,HIGH \
            tutor_local/openedx:latest

          # Fail the build if any CRITICAL vulns are present
          CRITICAL_COUNT=$(jq '[(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' var/ci/trivy-openedx.json)
          echo "CRITICAL vulnerabilities: ${CRITICAL_COUNT}"

          # Emit human-readable HIGH summary for the artifact
          jq -r '
            ["Severity","PkgName","VulnerabilityID","Title"],
            ((.Results // [])[] | .Vulnerabilities // []
              | .[]
              | select(.Severity == "HIGH")
              | [.Severity, .PkgName, .VulnerabilityID, (.Title // "-")])
            | @tsv' var/ci/trivy-openedx.json \
            > var/ci/trivy-openedx-high-summary.txt || true

          if [[ "${CRITICAL_COUNT}" -gt 0 ]]; then
            echo "FAIL: ${CRITICAL_COUNT} CRITICAL vulnerabilities found in openedx image." >&2
            jq -r '(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName)\t\(.Title // "-")"' \
              var/ci/trivy-openedx.json >&2
            exit 1
          fi

      - name: Upload Trivy OpenEdX scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: trivy-openedx-scan
          path: var/ci/trivy-openedx*
          retention-days: 3

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/openedx:${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          docker tag tutor_local/openedx:latest ${{ env.REGISTRY }}/openedx:${TAG}
          docker tag tutor_local/openedx:latest ${{ env.REGISTRY }}/openedx:${SHORT_SHA}

          docker push ${{ env.REGISTRY }}/openedx:${TAG}
          docker push ${{ env.REGISTRY }}/openedx:${SHORT_SHA}

          # Push mutable mereka-brand tag so the dev overlay (rke2-nonprod)
          # auto-deploys via ArgoCD when a new image lands on main.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag tutor_local/openedx:latest ${{ env.REGISTRY }}/openedx:mereka-brand
            docker push ${{ env.REGISTRY }}/openedx:mereka-brand
            echo "**Mutable tag:** \`mereka-brand\` (dev auto-deploy)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### OpenEdX Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/openedx:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve pushed openedx digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/openedx:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve openedx digest for ${REF} (got: '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "**OpenedX digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload OpenEdX branding verification log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: openedx-branding-contract-log
          path: var/ci/verify-openedx-image-branding.log
          retention-days: 3

  build-mfe:
    name: Build MFE Image
    runs-on: mereka-k8s-heavy-builders
    timeout-minutes: 120
    needs: lint
    if: ${{ github.event_name == 'push' || inputs.build_mfe }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Enable swap for heavy image builds
        run: |
          # Best-effort: swapon requires CAP_SYS_ADMIN which ARC container
          # runners lack. Keep the block non-fatal so it works on GitHub-hosted
          # runners but silently skips on ARC.
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            if sudo fallocate -l 8G /swapfile 2>/dev/null && \
               sudo chmod 600 /swapfile && \
               sudo mkswap /swapfile && \
               sudo swapon /swapfile 2>/dev/null; then
              echo "Swap provisioned (8 GB)."
            else
              echo "Swap provisioning skipped (likely container runner without CAP_SYS_ADMIN)."
              sudo rm -f /swapfile 2>/dev/null || true
            fi
          else
            echo "Skipping swap provisioning: sudo is unavailable/non-interactive on this runner."
          fi
          free -h || true

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          requirements-file: 'requirements-tutor.txt'

      - name: Verify Tutor version
        run: tutor --version

      - name: Set up Tutor environment
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          mkdir -p $TUTOR_ROOT

          # Sync plugin package to Tutor plugins directory.
          PLUGIN_SRC_DIR="$(pwd)/infrastructure/tutor/plugins"
          PLUGIN_DIR="${TUTOR_PLUGINS_DIR:-$HOME/.local/share/tutor-plugins}"
          mkdir -p "$PLUGIN_DIR"
          cp "$PLUGIN_SRC_DIR/mereka_lms.py" "$PLUGIN_DIR/mereka_lms.py"
          cp "$PLUGIN_SRC_DIR/mereka_lms_mfe_slots.py" "$PLUGIN_DIR/mereka_lms_mfe_slots.py"
          cp -R "$PLUGIN_SRC_DIR/_mereka_lms" "$PLUGIN_DIR/_mereka_lms"

          # Enable the Mereka LMS plugin so hooks fire during image build
          tutor plugins enable mereka_lms

          # Initialize Tutor config
          tutor config save \
            --set LMS_HOST=academyv2.mereka.io \
            --set MFE_HOST=apps.academyv2.mereka.io \
            --set ENABLE_HTTPS=true

          # Apply patches (includes Node 18 + webpack memory fixes)
          ./infrastructure/tutor/apply-patches.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
        with:
          driver: docker

      - name: Fix DinD network MTU
        run: |
          # ARC DinD containers inherit docker0 bridge MTU 1500, but the pod
          # network (eth0) uses MTU 1280 on rke2-nonprod.  Large packets
          # (TLS handshakes, apt downloads) get silently dropped.
          if docker info >/dev/null 2>&1; then
            docker run --privileged --pid=host busybox \
              nsenter -t 1 -m -- sh -c '
                mkdir -p /etc/docker
                echo "{\"mtu\":1280}" > /etc/docker/daemon.json
                kill -HUP 1
              '
            echo "DinD daemon.json written with MTU=1280, dockerd reloaded."
            sleep 2
            docker network inspect bridge --format '{{json .Options}}' || true
          fi

      - name: Log in to GHCR (build cache)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build MFE image
        run: |
          export TUTOR_ROOT=$(pwd)/tutor_env
          export DOCKER_BUILDKIT=1
          export NODE_OPTIONS="--max-old-space-size=6144"

          # Cache strategy: same as openedx build (see D4 comments above).
          CACHE_REF="${{ env.REGISTRY }}/mfe:mereka-brand"

          (
            while true; do
              echo "[build-mfe-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ) still building..."
              sleep 60
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill $HEARTBEAT_PID 2>/dev/null || true' EXIT
          if ! timeout 110m tutor images build mfe \
            --no-registry-cache \
            -d "--cache-from=type=registry,ref=${CACHE_REF}" \
            -a BUILDKIT_INLINE_CACHE=1; then
            echo "MFE image build timed out or failed after timeout guard" >&2
            exit 1
          fi
          kill "$HEARTBEAT_PID" 2>/dev/null || true
          trap - EXIT

          # Tutor 21 with buildx names MFE images docker.io/overhangio/openedx-mfe:*
          # instead of tutor_local/openedx-mfe:latest. Retag for downstream steps.
          TUTOR_MFE_IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'overhangio/openedx-mfe:' | head -1)"
          if [[ -n "$TUTOR_MFE_IMAGE" && -z "$(docker images -q tutor_local/openedx-mfe:latest 2>/dev/null)" ]]; then
            echo "Retagging $TUTOR_MFE_IMAGE → tutor_local/openedx-mfe:latest"
            docker tag "$TUTOR_MFE_IMAGE" tutor_local/openedx-mfe:latest
          fi

      - name: Verify MFE image branding contract
        continue-on-error: true  # Non-blocking until branding pipeline is fully verified
        run: |
          mkdir -p var/ci
          EXPECTED_MFE_BRANDING_REV="$(sed -nE 's/.*--mereka-mfe-branding-rev:[[:space:]]*"([^"]+)".*/\1/p' infrastructure/tutor/themes/mereka/mfe/mereka.scss | head -n 1)"
          scripts/qa/verify-mfe-image-branding.sh tutor_local/openedx-mfe:latest "${EXPECTED_MFE_BRANDING_REV}" \
            | tee var/ci/verify-mfe-image-branding.log

      - name: Generate SBOM for MFE image
        continue-on-error: true  # Non-blocking: SBOM is informational, should not block image push
        run: |
          mkdir -p var/ci
          # Install syft v1.42.1 — checksum computed 2026-03-05
          SYFT_VERSION="v1.42.1"
          SYFT_INSTALL_SHA="01d0d15aff461f1bc54d1716feb4824341918c4f37e1b6a5a0c0caee2251be67"
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            -o /tmp/syft-install.sh
          echo "${SYFT_INSTALL_SHA}  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b "$HOME/.local/bin"
          rm /tmp/syft-install.sh
          # Use docker: source explicitly so syft reads from the local Docker daemon
          "$HOME/.local/bin/syft" scan "docker:tutor_local/openedx-mfe:latest" \
            -o cyclonedx-json=var/ci/sbom-mfe.cdx.json

      - name: Upload MFE SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: sbom-mfe
          path: var/ci/sbom-mfe.cdx.json
          retention-days: 90

      - name: Install Trivy CLI
        run: |
          # trivy v0.69.3 — checksum computed 2026-03-05
          TRIVY_VERSION="v0.69.3"
          TRIVY_INSTALL_SHA="e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            -o /tmp/trivy-install.sh
          echo "${TRIVY_INSTALL_SHA}  /tmp/trivy-install.sh" | sha256sum -c -
          sh /tmp/trivy-install.sh -b "$HOME/.local/bin"
          rm /tmp/trivy-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan MFE image for vulnerabilities
        continue-on-error: true  # Non-blocking: upstream CVEs should not block image delivery
        run: |
          mkdir -p var/ci
          trivy image \
            --format json \
            --output var/ci/trivy-mfe.json \
            --ignorefile .trivyignore \
            --severity CRITICAL,HIGH \
            tutor_local/openedx-mfe:latest

          # Fail the build if any CRITICAL vulns are present
          CRITICAL_COUNT=$(jq '[(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' var/ci/trivy-mfe.json)
          echo "CRITICAL vulnerabilities: ${CRITICAL_COUNT}"

          # Emit human-readable HIGH summary for the artifact
          jq -r '
            ["Severity","PkgName","VulnerabilityID","Title"],
            ((.Results // [])[] | .Vulnerabilities // []
              | .[]
              | select(.Severity == "HIGH")
              | [.Severity, .PkgName, .VulnerabilityID, (.Title // "-")])
            | @tsv' var/ci/trivy-mfe.json \
            > var/ci/trivy-mfe-high-summary.txt || true

          if [[ "${CRITICAL_COUNT}" -gt 0 ]]; then
            echo "FAIL: ${CRITICAL_COUNT} CRITICAL vulnerabilities found in mfe image." >&2
            jq -r '(.Results // [])[] | .Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName)\t\(.Title // "-")"' \
              var/ci/trivy-mfe.json >&2
            exit 1
          fi

      - name: Upload Trivy MFE scan results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: trivy-mfe-scan
          path: var/ci/trivy-mfe*
          retention-days: 3

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "tags=${{ env.REGISTRY }}/mfe:${TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          SHORT_SHA="${GITHUB_SHA::8}"

          docker tag tutor_local/openedx-mfe:latest ${{ env.REGISTRY }}/mfe:${TAG}
          docker tag tutor_local/openedx-mfe:latest ${{ env.REGISTRY }}/mfe:${SHORT_SHA}

          docker push ${{ env.REGISTRY }}/mfe:${TAG}
          docker push ${{ env.REGISTRY }}/mfe:${SHORT_SHA}

          # Push mutable mereka-brand tag so the dev overlay (rke2-nonprod)
          # auto-deploys via ArgoCD when a new image lands on main.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag tutor_local/openedx-mfe:latest ${{ env.REGISTRY }}/mfe:mereka-brand
            docker push ${{ env.REGISTRY }}/mfe:mereka-brand
            echo "**Mutable tag:** \`mereka-brand\` (dev auto-deploy)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### MFE Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/mfe:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Immutable tags:** \`${TAG}\`, \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

      - name: Resolve pushed mfe digest
        id: digest
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          REF="${{ env.REGISTRY }}/mfe:${TAG}"
          DIGEST="$(./scripts/infra/resolve-image-digest.sh --image-ref "${REF}")"
          if [[ -z "${DIGEST}" || ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve mfe digest for ${REF} (got: '${DIGEST}')"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "**MFE digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload MFE branding verification log
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: mfe-branding-contract-log
          path: var/ci/verify-mfe-image-branding.log
          retention-days: 3

  slsa-provenance:
    name: SLSA Provenance & Attestation
    runs-on: mereka-k8s-runners
    timeout-minutes: 15
    needs: [build-openedx, build-mfe]
    if: ${{ always() && (needs.build-openedx.result == 'success' || needs.build-mfe.result == 'success') }}
    permissions:
      contents: read
      id-token: write   # keyless signing via Sigstore OIDC
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate provenance for OpenEdX image
        if: ${{ needs.build-openedx.result == 'success' }}
        env:
          OPENEDX_DIGEST: ${{ needs.build-openedx.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          TAG="${{ inputs.image_tag || github.sha }}"
          IMAGE_REF="${{ env.REGISTRY }}/openedx@${OPENEDX_DIGEST}"

          # Build in-toto provenance predicate
          cat > var/ci/provenance-openedx.json <<PROVENANCE
          {
            "buildType": "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/.github/workflows/build-tutor-images.yml",
            "builder": {
              "id": "https://github.com/Biji-Biji-Initiative/mereka-lms/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/build-tutor-images.yml"
              },
              "environment": {
                "github_actor": "${{ github.actor }}",
                "github_event_name": "${{ github.event_name }}",
                "github_run_id": "${{ github.run_id }}",
                "github_run_attempt": "${{ github.run_attempt }}",
                "runner_os": "Linux",
                "runner_image": "ubuntu-24.04"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": { "parameters": true, "environment": true, "materials": false },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ],
            "subject": [
              {
                "name": "${{ env.REGISTRY }}/openedx",
                "digest": { "sha256": "${OPENEDX_DIGEST#sha256:}" }
              }
            ]
          }
          PROVENANCE

          # Attest the image (keyless via Sigstore OIDC)
          cosign attest --yes \
            --predicate var/ci/provenance-openedx.json \
            --type slsaprovenance \
            "${IMAGE_REF}"

          echo "### OpenEdX SLSA Provenance Attached" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_REF}\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate provenance for MFE image
        if: ${{ needs.build-mfe.result == 'success' }}
        env:
          MFE_DIGEST: ${{ needs.build-mfe.outputs.image_digest }}
        run: |
          mkdir -p var/ci
          TAG="${{ inputs.image_tag || github.sha }}"
          IMAGE_REF="${{ env.REGISTRY }}/mfe@${MFE_DIGEST}"

          cat > var/ci/provenance-mfe.json <<PROVENANCE
          {
            "buildType": "https://github.com/Biji-Biji-Initiative/mereka-lms/blob/main/.github/workflows/build-tutor-images.yml",
            "builder": {
              "id": "https://github.com/Biji-Biji-Initiative/mereka-lms/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/build-tutor-images.yml"
              },
              "environment": {
                "github_actor": "${{ github.actor }}",
                "github_event_name": "${{ github.event_name }}",
                "github_run_id": "${{ github.run_id }}",
                "github_run_attempt": "${{ github.run_attempt }}",
                "runner_os": "Linux",
                "runner_image": "ubuntu-24.04"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": { "parameters": true, "environment": true, "materials": false },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ],
            "subject": [
              {
                "name": "${{ env.REGISTRY }}/mfe",
                "digest": { "sha256": "${MFE_DIGEST#sha256:}" }
              }
            ]
          }
          PROVENANCE

          cosign attest --yes \
            --predicate var/ci/provenance-mfe.json \
            --type slsaprovenance \
            "${IMAGE_REF}"

          echo "### MFE SLSA Provenance Attached" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_REF}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: always()
        with:
          name: slsa-provenance
          path: var/ci/provenance-*.json
          retention-days: 90

  release-bundle:
    name: Generate Release Bundle
    runs-on: mereka-k8s-runners
    timeout-minutes: 15
    needs: [build-openedx, build-mfe, slsa-provenance]
    if: ${{ needs.build-openedx.result == 'success' && needs.build-mfe.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      bundle_id: ${{ steps.bundle.outputs.bundle_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2

      - name: Generate release bundle
        id: bundle
        run: |
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          ./scripts/infra/generate-release-bundle.sh \
            --output var/ci/release-bundle.json \
            --repo "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow ".github/workflows/build-tutor-images.yml" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --target-environment "${TARGET_ENV}" \
            --openedx-image "${{ env.REGISTRY }}/openedx" \
            --openedx-digest "${{ needs.build-openedx.outputs.image_digest }}" \
            --mfe-image "${{ env.REGISTRY }}/mfe" \
            --mfe-digest "${{ needs.build-mfe.outputs.image_digest }}"
          cosign sign-blob --yes \
            --output-signature var/ci/release-bundle.sig \
            --output-certificate var/ci/release-bundle.pem \
            var/ci/release-bundle.json
          CERT_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/build-tutor-images.yml@${{ github.ref }}"
          ./scripts/qa/verify-release-bundle.sh var/ci/release-bundle.json \
            --signature var/ci/release-bundle.sig \
            --certificate var/ci/release-bundle.pem \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          BUNDLE_ID="$(python3 -c 'import json;print(json.load(open("var/ci/release-bundle.json"))["bundle_id"])')"
          echo "bundle_id=${BUNDLE_ID}" >> "$GITHUB_OUTPUT"
          echo "**Release bundle:** \`${BUNDLE_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Bundle signature:** \`var/ci/release-bundle.sig\`" >> $GITHUB_STEP_SUMMARY
          echo "**Bundle certificate:** \`var/ci/release-bundle.pem\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload release bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: release-bundle
          path: |
            var/ci/release-bundle.json
            var/ci/release-bundle.sig
            var/ci/release-bundle.pem
          retention-days: 90

  update-gitops:
    name: Update GitOps
    runs-on: mereka-k8s-runners
    needs: [build-openedx, build-mfe, release-bundle]
    # Push to main → auto-deploy to production.
    # workflow_dispatch → deploy only when update_gitops=true and environment selected.
    # NOTE: inputs.* are undefined on push events, so we can't reference them in that branch.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.update_gitops && inputs.target_environment != 'select-environment') }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
    permissions:
      contents: write
    env:
      ENABLE_STAGING_ENV: ${{ vars.ENABLE_STAGING_ENV || 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate manual dispatch inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${{ inputs.update_gitops }}" != "true" ]]; then
            echo "update_gitops must be true for manual GitOps update." >&2
            exit 1
          fi
          if [[ "${{ inputs.target_environment }}" == "select-environment" ]]; then
            echo "target_environment must be explicitly selected." >&2
            exit 1
          fi
          if [[ "${{ inputs.target_environment }}" == "staging" && "${ENABLE_STAGING_ENV}" != "true" ]]; then
            echo "target_environment=staging is disabled. Set repository variable ENABLE_STAGING_ENV=true when staging is ready." >&2
            exit 1
          fi
          if [[ "${{ inputs.build_openedx }}" != "true" || "${{ inputs.build_mfe }}" != "true" ]]; then
            echo "update_gitops requires build_openedx=true and build_mfe=true so digests are captured deterministically." >&2
            exit 1
          fi

      - name: Validate GitOps token
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          if [[ -z "${GITOPS_PAT}" ]]; then
            echo "GITOPS_PAT secret is required to update bbi-infrastructure." >&2
            exit 1
          fi

      - name: Checkout bbi-infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Biji-Biji-Initiative/bbi-infrastructure
          path: bbi-infrastructure
          token: ${{ secrets.GITOPS_PAT }}

      - name: Download release bundle artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: release-bundle
          path: var/ci

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159  # v3.9.2

      - name: Verify release bundle signature
        run: |
          CERT_IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/build-tutor-images.yml@${{ github.ref }}"
          ./scripts/qa/verify-release-bundle.sh var/ci/release-bundle.json \
            --signature var/ci/release-bundle.sig \
            --certificate var/ci/release-bundle.pem \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Validate release bundle consistency gate
        run: |
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          OPENEDX_DIGEST="${{ needs.build-openedx.outputs.image_digest }}"
          MFE_DIGEST="${{ needs.build-mfe.outputs.image_digest }}"
          RELEASE_BUNDLE_ID="${{ needs.release-bundle.outputs.bundle_id }}"
          export TARGET_ENV OPENEDX_DIGEST MFE_DIGEST RELEASE_BUNDLE_ID
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          path = "var/ci/release-bundle.json"
          if not os.path.exists(path):
              print(f"release bundle artifact missing: {path}", file=sys.stderr)
              sys.exit(1)

          bundle = json.load(open(path, encoding="utf-8"))
          expected = {
              "bundle_id": os.environ["RELEASE_BUNDLE_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "target_environment": os.environ["TARGET_ENV"],
              "openedx_digest": os.environ["OPENEDX_DIGEST"],
              "mfe_digest": os.environ["MFE_DIGEST"],
          }
          actual = {
              "bundle_id": bundle.get("bundle_id"),
              "commit_sha": bundle.get("commit_sha"),
              "target_environment": bundle.get("target_environment"),
              "openedx_digest": (((bundle.get("images") or {}).get("openedx") or {}).get("digest")),
              "mfe_digest": (((bundle.get("images") or {}).get("mfe") or {}).get("digest")),
          }

          errors = []
          for k, v in expected.items():
              if not v:
                  errors.append(f"expected {k} missing from workflow context")
          for k in expected:
              if expected[k] != actual[k]:
                  errors.append(f"{k} mismatch: expected={expected[k]!r} actual={actual[k]!r}")

          if not re.fullmatch(r"rb-[0-9a-f]{7,40}-[0-9]{8}T[0-9]{6}Z", str(actual["bundle_id"] or "")):
              errors.append(f"bundle_id format invalid: {actual['bundle_id']!r}")
          if not re.fullmatch(r"[0-9a-f]{40}", str(actual["commit_sha"] or "")):
              errors.append(f"commit_sha format invalid: {actual['commit_sha']!r}")
          for key in ("openedx_digest", "mfe_digest"):
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", str(actual[key] or "")):
                  errors.append(f"{key} format invalid: {actual[key]!r}")

          if errors:
              print("release-bundle consistency gate failed:", file=sys.stderr)
              for err in errors:
                  print(f" - {err}", file=sys.stderr)
              sys.exit(1)

          print("PASS: release-bundle artifact matches workflow commit/environment/digest context")
          PY

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update app + GitOps tags via release orchestrator
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          ALLOW_PROD_APPLY=0
          if [[ "${TARGET_ENV}" == "production" ]]; then
            ALLOW_PROD_APPLY=1
          fi
          OPENEDX_DIGEST="${{ needs.build-openedx.outputs.image_digest }}"
          MFE_DIGEST="${{ needs.build-mfe.outputs.image_digest }}"
          RELEASE_BUNDLE_ID="${{ needs.release-bundle.outputs.bundle_id }}"
          if [[ -z "${OPENEDX_DIGEST}" || -z "${MFE_DIGEST}" ]]; then
            echo "Missing image digests from build jobs (openedx='${OPENEDX_DIGEST}' mfe='${MFE_DIGEST}')." >&2
            exit 1
          fi
          if [[ -z "${RELEASE_BUNDLE_ID}" ]]; then
            echo "Missing release bundle id from release-bundle job." >&2
            exit 1
          fi
          EXTRA_ARGS=()
          if [[ "${TARGET_ENV}" == "production" ]]; then
            # Production rollouts require runtime convergence verification.
            EXTRA_ARGS+=(--verify-runtime --wait-seconds 900)
          fi
          CONFIRM_RELEASE_OPENEDX_GITOPS=RELEASE_OPENEDX_GITOPS \
          CONFIRM_PUSH_RELEASE_OPENEDX_GITOPS=PUSH_RELEASE_OPENEDX_GITOPS \
          ALLOW_PROD_APPLY="${ALLOW_PROD_APPLY}" \
          ./scripts/infra/release-openedx-gitops.sh \
            --target-env "${TARGET_ENV}" \
            --openedx-tag "${TAG}" \
            --mfe-tag "${TAG}" \
            --openedx-digest "${OPENEDX_DIGEST}" \
            --mfe-digest "${MFE_DIGEST}" \
            --require-digests \
            --app-repo "$GITHUB_WORKSPACE" \
            --infra-repo "$GITHUB_WORKSPACE/bbi-infrastructure" \
            --apply --commit --push \
            "${EXTRA_ARGS[@]}"

      - name: Generate build provenance
        # NOTE: This is an app-scoped build provenance record, NOT a canonical
        # promotion_record. The canonical promotion authority lives in
        # bbi-infrastructure (gitops-ops promote workflow).
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          OPENEDX_DIGEST="${{ needs.build-openedx.outputs.image_digest }}"
          MFE_DIGEST="${{ needs.build-mfe.outputs.image_digest }}"
          RELEASE_BUNDLE_ID="${{ needs.release-bundle.outputs.bundle_id }}"
          GITOPS_COMMIT="$(git -C "$GITHUB_WORKSPACE/bbi-infrastructure" rev-parse HEAD)"
          ./scripts/infra/generate-build-provenance.sh \
            --output var/ci/build-provenance.json \
            --repository "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --target-environment "${TARGET_ENV}" \
            --openedx-digest "${OPENEDX_DIGEST}" \
            --mfe-digest "${MFE_DIGEST}" \
            --release-bundle-id "${RELEASE_BUNDLE_ID}" \
            --gitops-repo "Biji-Biji-Initiative/bbi-infrastructure" \
            --gitops-commit "${GITOPS_COMMIT}"
          ./scripts/qa/verify-build-provenance.sh var/ci/build-provenance.json

      - name: Emit app release-gate proof envelope via lms-ops
        run: |
          set -euo pipefail
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          case "$TARGET_ENV" in
            production) LANE="prod" ;;
            staging)    LANE="staging" ;;
            dev)        LANE="dev" ;;
            *)
              echo "Unsupported target environment for lms-ops proof lane mapping: $TARGET_ENV" >&2
              exit 1
              ;;
          esac
          ./bin/lms-ops proof \
            --concern release-gate \
            --lane "$LANE" \
            --skip-cluster
          cp var/proof/release-gate.json var/ci/release-gate-envelope.json

      - name: Upload build provenance
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: build-provenance
          path: |
            var/ci/build-provenance.json
            var/ci/release-gate-envelope.json
          retention-days: 90

      - name: Summary
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}"
          OPENEDX_DIGEST="${{ needs.build-openedx.outputs.image_digest }}"
          MFE_DIGEST="${{ needs.build-mfe.outputs.image_digest }}"
          RELEASE_BUNDLE_ID="${{ needs.release-bundle.outputs.bundle_id }}"
          GITOPS_COMMIT="$(git -C "$GITHUB_WORKSPACE/bbi-infrastructure" rev-parse HEAD)"
          echo "### Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** GitOps update" >> $GITHUB_STEP_SUMMARY
          echo "**Target environment:** \`${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**OpenedX digest:** \`${OPENEDX_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**MFE digest:** \`${MFE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release bundle:** \`${RELEASE_BUNDLE_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps commit:** \`${GITOPS_COMMIT}\`" >> $GITHUB_STEP_SUMMARY
