name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios-app.yml'
  workflow_dispatch:  # Manual trigger

env:
  BUNDLE_ID: 'com.mereka.academy.mobile'

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout mereka-lms
        uses: actions/checkout@v4
      
      - name: Clone OpenEdX iOS App
        run: |
          # Clone latest release tag (v2.2 Ulmo.1 - Swift 6)
          git clone https://github.com/openedx/openedx-app-ios.git ios-app
          cd ios-app
          LATEST_TAG=$(git describe --tags --abbrev=0)
          git checkout "$LATEST_TAG"
          echo "OpenEdX iOS version: $LATEST_TAG"
      
      # ============================================
      # Environment setup (follow OpenEdX CI exactly)
      # ============================================
      
      - name: Preflight - Print Environment
        run: |
          echo "=== System Info ==="
          sw_vers
          xcode-select -p
          xcodebuild -version
          
          echo ""
          echo "=== Available Xcode Versions ==="
          ls -la /Applications | grep Xcode || true
      
      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: ios-app/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('ios-app/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios-app/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios-app/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Setup Environment
        run: |
          cd ios-app
          
          # Install deps per OpenEdX CI
          brew update && brew install xcodegen git-lfs || true
          
          # Update Gemfile to use latest fastlane (fixes UNIVERSAL filter bug)
          cat > Gemfile << 'EOF'
          source "https://rubygems.org"
          gem "fastlane", ">= 2.230.0"
          gem "xcode-install"
          EOF
          
          # Remove old Gemfile.lock to allow fresh install
          rm -f Gemfile.lock
          
          # Bundle setup with updated Gemfile
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
          
          # Pod install
          pod install --repo-update
      
      # ============================================
      # Configuration (using OpenEdX whitelabel script)
      # ============================================
      
      - name: Create Mereka Config
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create API/feature config
          mkdir -p ios-app/default_config/mereka
          
          cat > ios-app/default_config/mereka/config.yaml << 'EOF'
          API_HOST_URL: "https://staging.academy.mereka.io"
          OAUTH_CLIENT_ID: "mereka-mobile-app"
          DISCOVERY_BASE_URL: ""
          
          FEATURES:
            PRE_LOGIN_EXPERIENCE_ENABLED: false
            COURSE_NESTED_LIST_ENABLED: true
            COURSE_UNIT_PROGRESS_ENABLED: true
            COURSE_DATES_CALENDAR_SYNC: true
            WHAT_IS_NEW_ENABLED: true
            SOCIAL_AUTH_ENABLED: true
          
          GOOGLE:
            ENABLED: false
          MICROSOFT:
            ENABLED: false
          FACEBOOK:
            ENABLED: false
          APPLE_SIGNIN:
            ENABLED: true
          SEGMENT_IO:
            ENABLED: false
          FIREBASE:
            ENABLED: false
          BRAZE:
            ENABLED: false
          BRANCH:
            ENABLED: false
          
          AGREEMENT_URLS:
            PRIVACY_POLICY_URL: "https://staging.academy.mereka.io/privacy"
            TOS_URL: "https://staging.academy.mereka.io/tos"
          
          FEEDBACK_EMAIL: "team@mereka.io"
          
          THEME:
            PRIMARY_COLOR: "#1A1A2E"
            ACCENT_COLOR: "#E94560"
          EOF
          
          # Update the root config_settings.yaml to point to mereka config
          cat > ios-app/default_config/config_settings.yaml << 'EOF'
          config_directory: './default_config/mereka'
          config_mapping:
            prod: 'prod'
            stage: 'prod'
            dev: 'prod'
          EOF
          
          # Create the prod config directory structure
          mkdir -p ios-app/default_config/mereka/prod
          
          # Move the config.yaml to prod folder
          mv ios-app/default_config/mereka/config.yaml ios-app/default_config/mereka/prod/shared.yaml
          
          # Create ios.yaml with Firebase placeholders (needed for GoogleService-Info.plist generation)
          cat > ios-app/default_config/mereka/prod/ios.yaml << 'EOF'
          FIREBASE:
            ENABLED: false
            API_KEY: "AIzaSyPlaceholder"
            BUNDLE_ID: "com.mereka.academy.mobile"
            CLIENT_ID: "000000000000-placeholder.apps.googleusercontent.com"
            GOOGLE_APP_ID: "1:000000000000:ios:0000000000000000"
            GCM_SENDER_ID: "000000000000"
            PROJECT_ID: "mereka-academy-placeholder"
            REVERSED_CLIENT_ID: "com.googleusercontent.apps.000000000000-placeholder"
            ANALYTICS_SOURCE: "none"
          EOF
          
          # Create file_mappings.yaml (this is what process_config.py expects)
          cat > ios-app/default_config/mereka/prod/file_mappings.yaml << 'EOF'
          ios:
            files:
              - ios.yaml
              - shared.yaml
          EOF
          
          echo "Config structure created:"
          ls -laR ios-app/default_config/
      
      - name: Configure Project with Whitelabel Script
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios-app
          
          # Create whitelabel config for Mereka Academy
          # Note: OpenEdX uses configuration names like ReleaseProd, DebugProd, etc.
          cat > whitelabel_config.yaml << EOF
          project_config:
            project_path: 'OpenEdX.xcodeproj/project.pbxproj'
            dev_team: '${TEAM_ID}'
            # All framework targets need the same team ID
            project_extra_targets: ['WhatsNew', 'Dashboard', 'Course', 'Profile', 'Discovery', 'Discussion', 'Core', 'Theme', 'Authorization', 'Downloads']
            marketing_version: '1.0.0'
            current_project_version: '${GITHUB_RUN_NUMBER}'
            configurations:
              # Production configs (used by OpenEdXProd scheme)
              ReleaseProd:
                app_bundle_id: "${BUNDLE_ID}"
                product_name: "Mereka Academy"
                env_config: 'prod'
              DebugProd:
                app_bundle_id: "${BUNDLE_ID}"
                product_name: "Mereka Academy"
                env_config: 'prod'
              # Stage configs
              ReleaseStage:
                app_bundle_id: "${BUNDLE_ID}"
                product_name: "Mereka Academy"
                env_config: 'stage'
              DebugStage:
                app_bundle_id: "${BUNDLE_ID}"
                product_name: "Mereka Academy"
                env_config: 'stage'
              # Dev configs
              ReleaseDev:
                app_bundle_id: "${BUNDLE_ID}"
                product_name: "Mereka Academy"
                env_config: 'dev'
              DebugDev:
                app_bundle_id: "${BUNDLE_ID}"
                product_name: "Mereka Academy"
                env_config: 'dev'
          EOF
          
          echo "=== Whitelabel Config ==="
          cat whitelabel_config.yaml
          
          # Install whitelabel script dependencies in a venv
          python3 -m venv .whitelabel-venv
          source .whitelabel-venv/bin/activate
          pip install pyyaml pillow coloredlogs
          
          # Run the whitelabel script to configure bundle ID and team
          # Try different argument formats since OpenEdX may have changed the interface
          python config_script/whitelabel.py whitelabel_config.yaml 2>/dev/null || \
          python config_script/whitelabel.py --config whitelabel_config.yaml 2>/dev/null || \
          python config_script/whitelabel.py --config-file whitelabel_config.yaml 2>/dev/null || \
          echo "Whitelabel script completed (may have warnings)"
          deactivate
          
          # CRITICAL: Explicitly set DEVELOPMENT_TEAM in main project since whitelabel may have failed
          echo ""
          echo "=== Setting DEVELOPMENT_TEAM explicitly ==="
          main_proj="OpenEdX.xcodeproj/project.pbxproj"
          if [ -f "$main_proj" ]; then
            # Replace empty DEVELOPMENT_TEAM with actual team ID
            sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$main_proj"
            # Also replace any existing DEVELOPMENT_TEAM values
            sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$main_proj"
            echo "DEVELOPMENT_TEAM set to ${TEAM_ID}"
            grep "DEVELOPMENT_TEAM" "$main_proj" | head -3
          fi
          
          # CRITICAL: OpenEdX uses xcconfig files that OVERRIDE project.pbxproj settings
          # We must patch the xcconfig files directly to change the bundle ID
          echo ""
          echo "=== Patching xcconfig files for bundle ID ==="
          
          # Find and patch all xcconfig files that set PRODUCT_BUNDLE_IDENTIFIER
          for xcconfig in $(find . -name "*.xcconfig" -type f 2>/dev/null); do
            if grep -q "PRODUCT_BUNDLE_IDENTIFIER" "$xcconfig"; then
              echo "Patching: $xcconfig"
              # Replace any bundle ID with our bundle ID
              sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}/g" "$xcconfig"
              grep "PRODUCT_BUNDLE_IDENTIFIER" "$xcconfig" || true
            fi
          done
          
          # Also check the OpenEdX/Info.plist if it has hardcoded bundle ID
          if [ -f "OpenEdX/Info.plist" ]; then
            echo ""
            echo "=== Checking Info.plist ==="
            # Use PlistBuddy to update bundle identifier if it's hardcoded
            if /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" OpenEdX/Info.plist 2>/dev/null | grep -v '\$'; then
              echo "Info.plist has hardcoded bundle ID, updating..."
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" OpenEdX/Info.plist || true
            else
              echo "Info.plist uses build setting variable (good)"
            fi
          fi
          
          # Verify the changes in xcconfig
          echo ""
          echo "=== Verifying Bundle ID in xcconfig files ==="
          find . -name "*.xcconfig" -type f -exec grep -l "PRODUCT_BUNDLE_IDENTIFIER" {} \; 2>/dev/null | while read f; do
            echo "$f:"
            grep "PRODUCT_BUNDLE_IDENTIFIER" "$f"
          done
          
          # Verify the changes in project.pbxproj
          echo ""
          echo "=== Verifying Bundle ID in project.pbxproj ==="
          grep -E "PRODUCT_BUNDLE_IDENTIFIER = .*${BUNDLE_ID}" OpenEdX.xcodeproj/project.pbxproj | head -5 || echo "Bundle ID not found in project.pbxproj"
          grep "PRODUCT_BUNDLE_IDENTIFIER" OpenEdX.xcodeproj/project.pbxproj | head -10
          
          # Update framework projects to completely disable code signing (they get signed when embedded)
          # This is the standard CI pattern for iOS frameworks
          echo ""
          echo "=== Configuring framework signing ==="
          
          # Our custom frameworks - COMPLETELY DISABLE signing (they get signed when embedded in app)
          for framework_dir in WhatsNew Dashboard Course Profile Discovery Discussion Core Theme Authorization Downloads; do
            proj_path="${framework_dir}/${framework_dir}.xcodeproj/project.pbxproj"
            if [ -f "$proj_path" ]; then
              echo "Configuring ${framework_dir} to skip signing..."
              
              # Replace ALL CODE_SIGN_STYLE with Manual
              sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$proj_path"
              
              # Replace ALL CODE_SIGN_IDENTITY with "-" (means "don't sign")
              sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "-";/g' "$proj_path"
              
              # Set CODE_SIGNING_REQUIRED = NO and CODE_SIGNING_ALLOWED = NO for all build configs
              # These are the key settings that tell Xcode not to sign frameworks
              sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$proj_path"
              sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$proj_path"
              
              # Clear provisioning profile
              sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "";/g' "$proj_path"
              
              # Add CODE_SIGNING_ALLOWED = NO after DEVELOPMENT_TEAM if not present
              # This catches cases where the setting doesn't exist
              if ! grep -q "CODE_SIGNING_ALLOWED" "$proj_path"; then
                sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/&\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' "$proj_path"
              fi
              
              echo "  ✓ ${framework_dir} configured"
            else
              echo "  ! ${framework_dir} project not found at $proj_path"
            fi
          done
          
          # Configure main OpenEdX project for manual signing
          echo ""
          echo "=== Configuring main app for manual signing ==="
          main_proj="OpenEdX.xcodeproj/project.pbxproj"
          if [ -f "$main_proj" ]; then
            # Set ALL CODE_SIGN_STYLE to Manual
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$main_proj"
            
            # INJECT PROVISIONING_PROFILE_SPECIFIER after DEVELOPMENT_TEAM (if not already present)
            # This adds the setting if it doesn't exist
            if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" "$main_proj"; then
              echo "  Injecting PROVISIONING_PROFILE_SPECIFIER..."
              sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/&\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "match AppStore '"${BUNDLE_ID}"'";/g' "$main_proj"
            else
              # Replace existing PROVISIONING_PROFILE_SPECIFIER
              sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/PROVISIONING_PROFILE_SPECIFIER = "match AppStore '"${BUNDLE_ID}"'";/g' "$main_proj"
            fi
            
            # INJECT CODE_SIGN_IDENTITY if not present or replace existing
            if ! grep -q "CODE_SIGN_IDENTITY" "$main_proj"; then
              echo "  Injecting CODE_SIGN_IDENTITY..."
              sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/&\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";/g' "$main_proj"
            else
              sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$main_proj"
            fi
            
            # Verify the changes
            echo "Checking CODE_SIGN_STYLE values:"
            grep "CODE_SIGN_STYLE" "$main_proj" | head -5
            echo ""
            echo "Checking PROVISIONING_PROFILE_SPECIFIER values:"
            grep "PROVISIONING_PROFILE_SPECIFIER" "$main_proj" | head -5
            echo ""
            echo "Checking CODE_SIGN_IDENTITY values:"
            grep "CODE_SIGN_IDENTITY" "$main_proj" | head -5
            
            echo "  ✓ Main app configured for manual signing"
          fi
          
          echo ""
          echo "=== Framework signing configuration complete ==="
          
          # Final verification - show all places where bundle ID is set
          echo ""
          echo "=== Final Bundle ID verification ==="
          echo "Searching for org.openedx.app (should find NONE):"
          grep -r "org.openedx.app" --include="*.xcconfig" --include="*.pbxproj" . 2>/dev/null | head -10 || echo "✓ No references to org.openedx.app found"
          echo ""
          echo "Searching for ${BUNDLE_ID} (should find several):"
          grep -r "${BUNDLE_ID}" --include="*.xcconfig" --include="*.pbxproj" . 2>/dev/null | head -10 || echo "WARNING: Bundle ID not found!"
      
      # ============================================
      # Signing setup
      # ============================================
      
      - name: Setup SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          cat >> ~/.ssh/config << EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF
      
      - name: Create Matchfile
        run: |
          cd ios-app
          mkdir -p fastlane
          
          cat > fastlane/Matchfile << 'EOF'
          git_url("git@github.com:Biji-Biji-Initiative/ios-certificates.git")
          storage_mode("git")
          type("appstore")
          readonly(true)
          EOF
      
      - name: Create CI Fastfile
        run: |
          cd ios-app
          
          # Backup original Fastfile
          cp fastlane/Fastfile fastlane/Fastfile.original
          
          # Create the correct CI Fastfile
          cat > fastlane/Fastfile << 'EOF'
          # Mereka Academy CI Fastfile
          # Proper approach: setup_ci + match + manual export_options
          
          default_platform(:ios)
          
          require "base64"
          
          platform :ios do
            before_all do
              # Use xcodes plugin to select Xcode 16.4 (Swift 6)
              xcodes(
                version: '16.4',
                select_for_current_build_only: true,
              )
              
              ENV["FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT"] = "180"
              ENV["FASTLANE_XCODE_LIST_TIMEOUT"] = "180"
            end
            
            # API Key helper
            private_lane :asc_api_key do
              key_content = Base64.decode64(ENV.fetch("ASC_KEY_P8_BASE64"))
              app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_content: key_content,
                in_house: false
              )
            end
            
            # CI lane for TestFlight
            lane :ci_testflight do
              # Create temp keychain for CI
              create_keychain(
                name: "fastlane_tmp_keychain",
                password: "fastlane_tmp_keychain",
                default_keychain: true,
                unlock: true,
                timeout: 3600
              )
              
              api_key = asc_api_key
              
              # Fetch signing certificates and profiles
              # Using force: true to regenerate profiles with any capability changes from the Developer Portal
              # Note: If this fails with "missing capabilities", enable them manually at:
              # https://developer.apple.com/account/resources/identifiers/ -> com.mereka.academy.mobile
              # Required capabilities: Push Notifications, Associated Domains, Sign in with Apple
              match(
                type: "appstore",
                api_key: api_key,
                readonly: false,  # Allow regeneration
                force: true,  # Force regeneration of profile
                app_identifier: [ENV.fetch("BUNDLE_ID")],
                git_url: "git@github.com:Biji-Biji-Initiative/ios-certificates.git",
                platform: "ios",
                keychain_name: "fastlane_tmp_keychain",
                keychain_password: "fastlane_tmp_keychain"
              )
              
              # DEBUG: Dump profile entitlements to verify capabilities are present
              UI.message("=== Debugging: Checking installed profile entitlements ===")
              sh <<~BASH
                echo "=== Searching for installed provisioning profiles ==="
                for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
                  if [ -d "$dir" ]; then
                    echo "Checking: $dir"
                    for p in "$dir"/*.mobileprovision; do
                      [ -f "$p" ] || continue
                      security cms -D -i "$p" > /tmp/profile.plist 2>/dev/null || continue
                      BID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist 2>/dev/null || true)
                      if echo "$BID" | grep -q "com.mereka.academy.mobile"; then
                        echo ""
                        echo "=== FOUND PROFILE FOR com.mereka.academy.mobile ==="
                        echo "File: $p"
                        echo ""
                        echo "=== Profile Entitlements ==="
                        /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/profile.plist 2>/dev/null || true
                        echo ""
                        echo "=== Checking for specific capabilities ==="
                        echo -n "aps-environment (Push): "
                        /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/profile.plist 2>/dev/null || echo "NOT FOUND"
                        echo -n "associated-domains: "
                        /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" /tmp/profile.plist 2>/dev/null || echo "NOT FOUND"
                        echo -n "sign-in-with-apple: "
                        /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" /tmp/profile.plist 2>/dev/null || echo "NOT FOUND"
                      fi
                    done
                  fi
                done
                echo "=== Profile debug complete ==="
              BASH
              
              # Build the app
              # Note: xcargs apply to BOTH archive AND export steps
              # - Archive needs: CODE_SIGN_STYLE, CODE_SIGN_IDENTITY, PROVISIONING_PROFILE_SPECIFIER for main app
              # - Export fails if these apply to frameworks (they don't support profiles)
              # Solution: Set framework targets to skip signing entirely (CODE_SIGNING_ALLOWED=NO in project)
              build_app(
                workspace: "OpenEdX.xcworkspace",
                scheme: "OpenEdXProd",
                export_method: "app-store",
                output_directory: "./build",
                output_name: "MerekaAcademy.ipa",
                clean: true,
                # Export options tell xcodebuild which profiles to use for export
                export_options: {
                  signingStyle: "manual",
                  teamID: ENV.fetch("TEAM_ID"),
                  provisioningProfiles: {
                    ENV.fetch("BUNDLE_ID") => "match AppStore #{ENV.fetch("BUNDLE_ID")}"
                  },
                  compileBitcode: false,
                },
                # ONLY non-signing xcargs - signing is handled by export_options
                # DO NOT add CODE_SIGN_*, PROVISIONING_PROFILE_* here - they leak to all targets!
                xcargs: [
                  "-skipPackagePluginValidation",
                  "-skipMacroValidation",
                  "CONFIG_DIRECTORY=mereka",
                ].join(" ")
              )
              
              # SANITY CHECK: Verify the IPA has the correct bundle ID before uploading
              # This catches whitelabel/config issues immediately
              expected_bundle_id = ENV.fetch('BUNDLE_ID')
              UI.message("=== Verifying IPA Bundle ID (expecting: #{expected_bundle_id}) ===")
              sh("set -euo pipefail; " \
                 "IPA='./build/MerekaAcademy.ipa'; " \
                 "TMP=$(mktemp -d); " \
                 "unzip -q $IPA -d $TMP; " \
                 "APP=$(find $TMP/Payload -maxdepth 1 -name '*.app' -type d | head -1); " \
                 "ACTUAL=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $APP/Info.plist); " \
                 "echo \"Bundle ID in IPA: $ACTUAL\"; " \
                 "echo \"Expected: #{expected_bundle_id}\"; " \
                 "/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist; " \
                 "/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $APP/Info.plist; " \
                 "rm -rf $TMP; " \
                 "if [ \"$ACTUAL\" != '#{expected_bundle_id}' ]; then echo 'ERROR: Bundle ID mismatch!'; exit 1; fi")
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                ipa: "./build/MerekaAcademy.ipa",
                app_identifier: ENV.fetch("BUNDLE_ID"),
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF
      
      # ============================================
      # Build and Upload
      # ============================================
      
      - name: Build and Upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cd ios-app
          
          # CRITICAL: Override OpenEdX's Appfile which has org.openedx.app
          # This prevents pilot/upload_to_testflight from using the wrong bundle ID
          cat > fastlane/Appfile <<EOF
          app_identifier(ENV["BUNDLE_ID"])
          EOF
          echo "=== Appfile overridden with bundle ID: ${BUNDLE_ID} ==="
          cat fastlane/Appfile
          
          # Use bundle exec fastlane (per OpenEdX CI approach)
          bundle exec fastlane ci_testflight
      
      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.ssh/match_key || true
