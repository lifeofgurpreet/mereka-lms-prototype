name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios-app.yml'
  workflow_dispatch:  # Manual trigger

env:
  XCODE_VERSION: '16.2'
  BUNDLE_ID: 'com.mereka.academy.mobile'
  APP_NAME: 'Mereka Academy'

jobs:
  build-and-upload:
    runs-on: macos-14
    timeout-minutes: 90
    
    steps:
      - name: Checkout mereka-lms
        uses: actions/checkout@v4
      
      - name: Clone OpenEdX iOS App
        run: |
          git clone https://github.com/openedx/openedx-app-ios.git ios-app
          cd ios-app
          git checkout $(git describe --tags --abbrev=0) || true
          echo "OpenEdX iOS version: $(git describe --tags 2>/dev/null || echo 'latest')"
      
      - name: Update Bundle Identifier
        env:
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cd ios-app
          
          # Update bundle ID in project.pbxproj
          find . -name "project.pbxproj" -exec sed -i '' "s/org\.openedx\.app/${BUNDLE_ID}/g" {} \;
          find . -name "project.pbxproj" -exec sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" {} \;
          
          # Update in Info.plist files if any
          find . -name "Info.plist" -exec sed -i '' "s/org\.openedx\.app/${BUNDLE_ID}/g" {} \;
          
          echo "Bundle ID updated to: $BUNDLE_ID"
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios-app/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios-app/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Install CocoaPods
        run: |
          cd ios-app
          pod install --repo-update
      
      - name: Create Mereka Config
        run: |
          mkdir -p ios-app/default_config/mereka
          
          cat > ios-app/default_config/mereka/config.yaml << 'EOF'
          API_HOST_URL: "https://staging.academy.mereka.io"
          OAUTH_CLIENT_ID: "mereka-mobile-app"
          DISCOVERY_BASE_URL: ""
          
          FEATURES:
            PRE_LOGIN_EXPERIENCE_ENABLED: false
            COURSE_NESTED_LIST_ENABLED: true
            COURSE_UNIT_PROGRESS_ENABLED: true
            COURSE_DATES_CALENDAR_SYNC: true
            WHAT_IS_NEW_ENABLED: true
            SOCIAL_AUTH_ENABLED: true
          
          GOOGLE:
            ENABLED: false
          MICROSOFT:
            ENABLED: false
          FACEBOOK:
            ENABLED: false
          APPLE_SIGNIN:
            ENABLED: true
          SEGMENT_IO:
            ENABLED: false
          FIREBASE:
            ENABLED: false
          BRAZE:
            ENABLED: false
          BRANCH:
            ENABLED: false
          
          AGREEMENT_URLS:
            PRIVACY_POLICY_URL: "https://staging.academy.mereka.io/privacy"
            TOS_URL: "https://staging.academy.mereka.io/tos"
          
          FEEDBACK_EMAIL: "team@mereka.io"
          
          THEME:
            PRIMARY_COLOR: "#1A1A2E"
            ACCENT_COLOR: "#E94560"
          EOF
          
          cat > ios-app/default_config/mereka/config_settings.yaml << 'EOF'
          config_directory: "mereka"
          config_mapping:
            prod: "config.yaml"
            stage: "config.yaml"
            dev: "config.yaml"
          EOF
      
      - name: Install Fastlane
        run: |
          cd ios-app
          gem install fastlane -NV
      
      - name: Setup SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          # Configure SSH to use this key for github.com
          cat >> ~/.ssh/config << EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF
      
      - name: Setup Keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      
      - name: Create Matchfile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios-app
          
          cat > fastlane/Matchfile << EOF
          git_url("git@github.com:Biji-Biji-Initiative/ios-certificates.git")
          storage_mode("git")
          type("appstore")
          app_identifier("${{ env.BUNDLE_ID }}")
          team_id("$APPLE_TEAM_ID")
          readonly(false)
          EOF
      
      - name: Create Fastfile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios-app
          
          cat > fastlane/Fastfile << 'FASTFILE'
          default_platform(:ios)
          
          platform :ios do
            before_all do
              ENV["FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT"] = "180"
              ENV["FASTLANE_XCODE_LIST_TIMEOUT"] = "180"
            end
            
            desc "Sync certificates and profiles with match"
            lane :certificates do
              # Read the API key content directly
              key_content = File.read(File.expand_path("~/.private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_API_KEY_ID']}.p8"))
              
              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_API_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: key_content,
                duration: 1200,
                in_house: false
              )
              
              # Sync development certificates (for framework targets)
              match(
                type: "development",
                app_identifier: ENV["BUNDLE_ID"],
                team_id: ENV["APPLE_TEAM_ID"],
                keychain_name: ENV["KEYCHAIN_PATH"],
                keychain_password: ENV["KEYCHAIN_PASSWORD"],
                readonly: false,
                generate_apple_certs: true,
                api_key: api_key
              )
              
              # Sync App Store distribution certificates
              match(
                type: "appstore",
                app_identifier: ENV["BUNDLE_ID"],
                team_id: ENV["APPLE_TEAM_ID"],
                keychain_name: ENV["KEYCHAIN_PATH"],
                keychain_password: ENV["KEYCHAIN_PASSWORD"],
                readonly: false,
                generate_apple_certs: true,
                api_key: api_key
              )
            end
            
            desc "Build and upload to TestFlight"
            lane :release do
              # First sync certificates
              certificates
              
              # Update project code signing to use match profiles
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "OpenEdX.xcodeproj",
                team_id: ENV["APPLE_TEAM_ID"],
                bundle_identifier: ENV["BUNDLE_ID"],
                profile_name: "match AppStore #{ENV['BUNDLE_ID']}",
                code_sign_identity: "Apple Distribution"
              )
              
              # Build the app
              gym(
                workspace: "OpenEdX.xcworkspace",
                scheme: "OpenEdXProd",
                configuration: "Release",
                export_method: "app-store",
                export_team_id: ENV["APPLE_TEAM_ID"],
                xcargs: "-skipPackagePluginValidation -skipMacroValidation CONFIG_DIRECTORY=mereka DEVELOPMENT_TEAM=#{ENV['APPLE_TEAM_ID']} CODE_SIGN_IDENTITY='Apple Distribution'",
                output_directory: "./build",
                output_name: "MerekaAcademy.ipa",
                clean: true,
                include_bitcode: false,
                codesigning_identity: "Apple Distribution",
                export_options: {
                  signingStyle: "manual",
                  provisioningProfiles: {
                    ENV["BUNDLE_ID"] => "match AppStore #{ENV['BUNDLE_ID']}"
                  }
                }
              )
              
              # Upload to TestFlight
              key_content = File.read(File.expand_path("~/.private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_API_KEY_ID']}.p8"))
              
              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_API_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                key_content: key_content,
                duration: 1200,
                in_house: false
              )
              
              pilot(
                api_key: api_key,
                ipa: "./build/MerekaAcademy.ipa",
                skip_waiting_for_build_processing: true
              )
            end
          end
          FASTFILE
      
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          chmod 600 ~/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          # Note: Not setting APP_STORE_CONNECT_API_KEY_PATH as env var to avoid fastlane conflicts
      
      - name: Build and Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cd ios-app
          
          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          # Run fastlane
          fastlane release
      
      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/.private_keys || true
          rm -rf ~/.ssh/match_key || true
