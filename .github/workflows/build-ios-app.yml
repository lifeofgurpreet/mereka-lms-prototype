name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios-app.yml'
  workflow_dispatch:  # Manual trigger

env:
  BUNDLE_ID: 'com.mereka.academy.mobile'

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout mereka-lms
        uses: actions/checkout@v4
      
      - name: Clone OpenEdX iOS App
        run: |
          # Clone latest release tag (v2.2 Ulmo.1 - Swift 6)
          git clone https://github.com/openedx/openedx-app-ios.git ios-app
          cd ios-app
          LATEST_TAG=$(git describe --tags --abbrev=0)
          git checkout "$LATEST_TAG"
          echo "OpenEdX iOS version: $LATEST_TAG"
      
      # ============================================
      # Environment setup (follow OpenEdX CI exactly)
      # ============================================
      
      - name: Preflight - Print Environment
        run: |
          echo "=== System Info ==="
          sw_vers
          xcode-select -p
          xcodebuild -version
          
          echo ""
          echo "=== Available Xcode Versions ==="
          ls -la /Applications | grep Xcode || true
      
      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: ios-app/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('ios-app/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios-app/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios-app/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Setup Environment
        run: |
          cd ios-app
          
          # Install deps per OpenEdX CI
          brew update && brew install xcodegen git-lfs || true
          
          # Update Gemfile to use latest fastlane (fixes UNIVERSAL filter bug)
          echo 'gem "fastlane", ">= 2.230.0"' > Gemfile
          echo 'gem "xcode-install"' >> Gemfile
          
          # Bundle setup with updated Gemfile
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
          
          # Pod install
          pod install --repo-update
      
      # ============================================
      # Configuration
      # ============================================
      
      - name: Create Mereka Config
        run: |
          mkdir -p ios-app/default_config/mereka
          
          cat > ios-app/default_config/mereka/config.yaml << 'EOF'
          API_HOST_URL: "https://staging.academy.mereka.io"
          OAUTH_CLIENT_ID: "mereka-mobile-app"
          DISCOVERY_BASE_URL: ""
          
          FEATURES:
            PRE_LOGIN_EXPERIENCE_ENABLED: false
            COURSE_NESTED_LIST_ENABLED: true
            COURSE_UNIT_PROGRESS_ENABLED: true
            COURSE_DATES_CALENDAR_SYNC: true
            WHAT_IS_NEW_ENABLED: true
            SOCIAL_AUTH_ENABLED: true
          
          GOOGLE:
            ENABLED: false
          MICROSOFT:
            ENABLED: false
          FACEBOOK:
            ENABLED: false
          APPLE_SIGNIN:
            ENABLED: true
          SEGMENT_IO:
            ENABLED: false
          FIREBASE:
            ENABLED: false
          BRAZE:
            ENABLED: false
          BRANCH:
            ENABLED: false
          
          AGREEMENT_URLS:
            PRIVACY_POLICY_URL: "https://staging.academy.mereka.io/privacy"
            TOS_URL: "https://staging.academy.mereka.io/tos"
          
          FEEDBACK_EMAIL: "team@mereka.io"
          
          THEME:
            PRIMARY_COLOR: "#1A1A2E"
            ACCENT_COLOR: "#E94560"
          EOF
          
          cat > ios-app/default_config/mereka/config_settings.yaml << 'EOF'
          config_directory: "mereka"
          config_mapping:
            prod: "config.yaml"
            stage: "config.yaml"
            dev: "config.yaml"
          EOF
      
      # ============================================
      # Signing setup
      # ============================================
      
      - name: Setup SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          cat >> ~/.ssh/config << EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF
      
      - name: Create Matchfile
        run: |
          cd ios-app
          mkdir -p fastlane
          
          cat > fastlane/Matchfile << 'EOF'
          git_url("git@github.com:Biji-Biji-Initiative/ios-certificates.git")
          storage_mode("git")
          type("appstore")
          readonly(true)
          EOF
      
      - name: Create CI Fastfile
        run: |
          cd ios-app
          
          # Backup original Fastfile
          cp fastlane/Fastfile fastlane/Fastfile.original
          
          # Create the correct CI Fastfile based on ChatGPT template
          cat > fastlane/Fastfile << 'EOF'
          # Mereka Academy CI Fastfile
          # Based on correct approach: setup_ci + readonly match + export_options
          
          default_platform(:ios)
          
          require "base64"
          
          platform :ios do
            before_all do
              # Use xcodes plugin to select Xcode 16.4 (Swift 6)
              xcodes(
                version: '16.4',
                select_for_current_build_only: true,
              )
              
              ENV["FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT"] = "180"
              ENV["FASTLANE_XCODE_LIST_TIMEOUT"] = "180"
            end
            
            # API Key helper
            private_lane :asc_api_key do
              key_content = Base64.decode64(ENV.fetch("ASC_KEY_P8_BASE64"))
              app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_content: key_content,
                in_house: false
              )
            end
            
            # CI lane - temporarily not using setup_ci to allow readonly:false
            lane :ci_testflight do
              # Create temp keychain manually (setup_ci forces readonly:true)
              create_keychain(
                name: "fastlane_tmp_keychain",
                password: "fastlane_tmp_keychain",
                default_keychain: true,
                unlock: true,
                timeout: 3600
              )
              
              api_key = asc_api_key
              
            # Match - temporarily using readonly: false to regenerate profile with capabilities
            # TODO: Change back to readonly: true after profile is generated
            match(
              type: "appstore",
              api_key: api_key,
              readonly: false,
              app_identifier: [ENV.fetch("BUNDLE_ID")],
              git_url: "git@github.com:Biji-Biji-Initiative/ios-certificates.git",
              force_for_new_devices: true,
              platform: "ios",
              keychain_name: "fastlane_tmp_keychain",
              keychain_password: "fastlane_tmp_keychain"
            )
              
              # Build the app - signing config in export_options, NOT xcargs
              build_app(
                workspace: "OpenEdX.xcworkspace",
                scheme: "OpenEdXProd",
                export_method: "app-store",
                output_directory: "./build",
                output_name: "MerekaAcademy.ipa",
                clean: true,
                export_options: {
                  signingStyle: "manual",
                  teamID: ENV.fetch("TEAM_ID"),
                  provisioningProfiles: {
                    ENV.fetch("BUNDLE_ID") => "match AppStore #{ENV.fetch("BUNDLE_ID")}"
                  }
                },
                # Only DEVELOPMENT_TEAM in xcargs, nothing else
                xcargs: "-skipPackagePluginValidation -skipMacroValidation CONFIG_DIRECTORY=mereka DEVELOPMENT_TEAM=#{ENV.fetch('TEAM_ID')}"
              )
              
              # Upload to TestFlight
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF
      
      # ============================================
      # Build and Upload
      # ============================================
      
      - name: Build and Upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cd ios-app
          
          # Use bundle exec fastlane (per OpenEdX CI approach)
          bundle exec fastlane ci_testflight
      
      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.ssh/match_key || true
