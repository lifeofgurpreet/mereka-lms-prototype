name: Build iOS App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/build-ios-app.yml'
  workflow_dispatch:  # Manual trigger

env:
  BUNDLE_ID: 'com.mereka.academy.mobile'
  APP_NAME: 'Mereka Academy'

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout mereka-lms
        uses: actions/checkout@v4
      
      - name: Clone OpenEdX iOS App
        run: |
          # Clone latest release tag
          git clone https://github.com/openedx/openedx-app-ios.git ios-app
          cd ios-app
          LATEST_TAG=$(git describe --tags --abbrev=0)
          git checkout "$LATEST_TAG"
          echo "OpenEdX iOS version: $LATEST_TAG"
      
      # ============================================
      # PHASE 1: Environment setup (follow OpenEdX CI exactly)
      # ============================================
      
      - name: Preflight Check - Print Environment
        run: |
          echo "=== System Info ==="
          sw_vers
          xcode-select -p
          xcodebuild -version
          
          echo ""
          echo "=== Available Xcode Versions ==="
          ls -la /Applications | grep Xcode || true
      
      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: ios-app/vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('ios-app/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios-app/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios-app/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      
      - name: Setup Environment (OpenEdX CI approach)
        run: |
          cd ios-app
          
          # Install dependencies per OpenEdX CI
          brew update && brew install xcodegen git-lfs || true
          
          # Bundle setup
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
          
          # Pod install
          pod install --repo-update
          
          echo "=== Environment setup complete ==="
      
      # ============================================
      # PHASE 2: Configuration (bundle ID, config files)
      # Do NOT edit pbxproj files - use proper tooling
      # ============================================
      
      - name: Create Mereka Config
        run: |
          mkdir -p ios-app/default_config/mereka
          
          cat > ios-app/default_config/mereka/config.yaml << 'EOF'
          API_HOST_URL: "https://staging.academy.mereka.io"
          OAUTH_CLIENT_ID: "mereka-mobile-app"
          DISCOVERY_BASE_URL: ""
          
          FEATURES:
            PRE_LOGIN_EXPERIENCE_ENABLED: false
            COURSE_NESTED_LIST_ENABLED: true
            COURSE_UNIT_PROGRESS_ENABLED: true
            COURSE_DATES_CALENDAR_SYNC: true
            WHAT_IS_NEW_ENABLED: true
            SOCIAL_AUTH_ENABLED: true
          
          GOOGLE:
            ENABLED: false
          MICROSOFT:
            ENABLED: false
          FACEBOOK:
            ENABLED: false
          APPLE_SIGNIN:
            ENABLED: true
          SEGMENT_IO:
            ENABLED: false
          FIREBASE:
            ENABLED: false
          BRAZE:
            ENABLED: false
          BRANCH:
            ENABLED: false
          
          AGREEMENT_URLS:
            PRIVACY_POLICY_URL: "https://staging.academy.mereka.io/privacy"
            TOS_URL: "https://staging.academy.mereka.io/tos"
          
          FEEDBACK_EMAIL: "team@mereka.io"
          
          THEME:
            PRIMARY_COLOR: "#1A1A2E"
            ACCENT_COLOR: "#E94560"
          EOF
          
          cat > ios-app/default_config/mereka/config_settings.yaml << 'EOF'
          config_directory: "mereka"
          config_mapping:
            prod: "config.yaml"
            stage: "config.yaml"
            dev: "config.yaml"
          EOF
      
      # ============================================
      # PHASE 3: Signing setup (match with proper governance)
      # ============================================
      
      - name: Setup SSH for Match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          cat >> ~/.ssh/config << EOF
          Host github.com
            IdentityFile ~/.ssh/match_key
            IdentitiesOnly yes
          EOF
      
      - name: Setup Keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
      
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          chmod 600 ~/.private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
      
      - name: Create Matchfile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios-app
          
          cat > fastlane/Matchfile << EOF
          git_url("git@github.com:Biji-Biji-Initiative/ios-certificates.git")
          storage_mode("git")
          type("appstore")
          app_identifier("${{ env.BUNDLE_ID }}")
          team_id("$APPLE_TEAM_ID")
          readonly(true)  # CI should be readonly - certs managed separately
          EOF
      
      - name: Create Release Fastfile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios-app
          
          # Backup original Fastfile
          cp fastlane/Fastfile fastlane/Fastfile.original
          
          # Create our release lane (appending to existing Fastfile)
          cat >> fastlane/Fastfile << 'ENDOFFILE'

          # Mereka Release Lane
          lane :mereka_release do
            # Read the API key
            key_content = File.read(File.expand_path("~/.private_keys/AuthKey_#{ENV['APP_STORE_CONNECT_API_KEY_ID']}.p8"))
            
            api_key = app_store_connect_api_key(
              key_id: ENV["APP_STORE_CONNECT_API_KEY_ID"],
              issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
              key_content: key_content,
              duration: 1200,
              in_house: false
            )
            
            # Sync certificates (readonly mode)
            match(
              type: "appstore",
              app_identifier: ENV["BUNDLE_ID"],
              team_id: ENV["APPLE_TEAM_ID"],
              keychain_name: ENV["KEYCHAIN_PATH"],
              keychain_password: ENV["KEYCHAIN_PASSWORD"],
              readonly: true,
              api_key: api_key
            )
            
            # Build the app using OpenEdXProd scheme with manual signing
            gym(
              workspace: "OpenEdX.xcworkspace",
              scheme: "OpenEdXProd",
              configuration: "Release",
              export_method: "app-store",
              export_team_id: ENV["APPLE_TEAM_ID"],
              xcargs: "-skipPackagePluginValidation -skipMacroValidation CONFIG_DIRECTORY=mereka DEVELOPMENT_TEAM=#{ENV['APPLE_TEAM_ID']} PRODUCT_BUNDLE_IDENTIFIER=#{ENV['BUNDLE_ID']}",
              output_directory: "./build",
              output_name: "MerekaAcademy.ipa",
              clean: true,
              include_bitcode: false,
              export_options: {
                method: "app-store",
                teamID: ENV["APPLE_TEAM_ID"],
                signingStyle: "manual",
                signingCertificate: "Apple Distribution",
                uploadBitcode: false,
                uploadSymbols: true,
                provisioningProfiles: {
                  ENV["BUNDLE_ID"] => "match AppStore #{ENV['BUNDLE_ID']}"
                }
              }
            )
            
            # Upload to TestFlight
            pilot(
              api_key: api_key,
              ipa: "./build/MerekaAcademy.ipa",
              skip_waiting_for_build_processing: true
            )
          end
          ENDOFFILE
      
      # ============================================
      # PHASE 4: Preflight verification
      # ============================================
      
      - name: Preflight Verification
        run: |
          cd ios-app
          
          echo "=== Selected Xcode ==="
          xcode-select -p
          xcodebuild -version
          
          echo ""
          echo "=== Scheme List ==="
          xcodebuild -list -workspace OpenEdX.xcworkspace 2>/dev/null | head -30 || true
          
          echo ""
          echo "=== Match Profile Check ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles installed yet"
      
      # ============================================
      # PHASE 5: Build and Upload
      # ============================================
      
      - name: Build and Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          cd ios-app
          
          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          # Use bundle exec fastlane (per OpenEdX CI approach)
          bundle exec fastlane mereka_release
      
      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/.private_keys || true
          rm -rf ~/.ssh/match_key || true
