name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tools/docs/**'
      - 'generated/catalogs/**'
      - 'generated/adr-bundles/**'
      - 'generated/decision-maps/**'
      - 'generated/graphs/**'
      - 'docs/catalog.json'
      - 'specs/testmaps/README.md'
      - 'specs/_generated/testmaps/README.md'
      - 'scripts/qa/build_decision_graph.py'
      - 'scripts/qa/generate_adr_readme.py'
      - 'scripts/qa/sync-openedx-audit-pr-status.sh'
      - '.github/workflows/docs-compliance.yml'
      - '.github/workflows/docs-policy.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql.yml'
      - '*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
  merge_group:
  schedule:
    - cron: '0 8 * * 3'  # Weekly Wednesday 8am UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep only the newest run per ref, including main, so stale pushes do not
  # consume runner capacity while the latest head waits in queue.
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: mereka-k8s-runners
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v4.0.4
        with:
          node-version: '20'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4a7bc332abaec03596ff2803dd7f3ca3a238975  # v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4a7bc332abaec03596ff2803dd7f3ca3a238975  # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c4a7bc332abaec03596ff2803dd7f3ca3a238975  # v3
        with:
          category: "/language:${{ matrix.language }}"
