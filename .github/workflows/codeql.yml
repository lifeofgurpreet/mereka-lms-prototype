name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tools/docs/**'
      - 'generated/catalogs/**'
      - 'docs/catalog.json'
      - '*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
  merge_group:
  schedule:
    - cron: '0 8 * * 3'  # Weekly Wednesday 8am UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: mereka-k8s-runners
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4a7bc332abaec03596ff2803dd7f3ca3a238975  # v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@c4a7bc332abaec03596ff2803dd7f3ca3a238975  # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@c4a7bc332abaec03596ff2803dd7f3ca3a238975  # v3
        with:
          category: "/language:${{ matrix.language }}"
