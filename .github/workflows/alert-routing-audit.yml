name: Alert Routing Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      strict_runtime:
        description: "Fail when runtime dependencies are unavailable"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  audit-routing:
    name: Verify Alert Routing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
        with:
          project_id: mereka-lms

      - name: Get GKE credentials (if available)
        env:
          GKE_CLUSTER_PROJECT: ${{ vars.GKE_CLUSTER_PROJECT || 'bbi-k8' }}
          GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION || 'asia-southeast1-c' }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'bbi-k8-cluster' }}
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'true' }}
        run: |
          if gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --project "$GKE_CLUSTER_PROJECT" \
            --zone "$GKE_CLUSTER_LOCATION"; then
            echo "CAN_RUN_RUNTIME=true" >> "$GITHUB_ENV"
          else
            echo "CAN_RUN_RUNTIME=false" >> "$GITHUB_ENV"
            if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
              echo "ERROR: unable to get GKE credentials (set strict_runtime=false to skip runtime audit)" >&2
              exit 1
            fi
            echo "WARN: unable to get GKE credentials; skipping runtime audit (strict_runtime=false)" >&2
          fi

      - name: Run alert routing audit
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        env:
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'true' }}
        run: |
          if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
            export STRICT_RUNTIME=1
          else
            export STRICT_RUNTIME=0
          fi

          RUN_ATLAS_VPS_AUDIT=0 ./scripts/qa/verify-alert-routing.sh | tee alert-routing-audit.txt

      - name: Upload alert routing audit artifact
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: alert-routing-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: alert-routing-audit.txt
          retention-days: 30
