name: Runtime Theme Drift Diagnose

on:
  workflow_dispatch:

permissions: {}

jobs:
  runtime-theme-drift-diagnose:
    name: Diagnose Runtime Theme Drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run runtime-theme drift diagnose lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/qa
          make qa-runtime-theme-drift-diagnose | tee var/qa/runtime-theme-drift-diagnose.log

      - name: Upload runtime-theme drift diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: runtime-theme-drift-diagnose-${{ github.run_number }}
          path: |
            var/qa/runtime-theme-drift-diagnose.log
            var/qa/runtime-theme-drift-diagnose-*.log
          if-no-files-found: warn
