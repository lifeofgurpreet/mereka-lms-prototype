name: MFE Live DOM Audit

permissions: {}
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      base_url:
        description: "Override LMS base URL (empty = auto by environment)"
        required: false
        default: ""
        type: string
      require_runtime_theme:
        description: "Require runtime /theme/*.css mode"
        required: true
        default: false
        type: boolean
      require_branding_markers:
        description: "Require branded markers in runtime DOM"
        required: true
        default: true
        type: boolean
      audit_profile:
        description: "Preset profile for route/selector defaults"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - phase7_strict
          - phase7_full
      selector_audit_path:
        description: "Path used for selector DOM audit"
        required: false
        default: "/authn/login"
        type: string
      selector_audit_routes:
        description: "Comma-separated MFE route paths for selector DOM audit (empty = selector_audit_path)"
        required: false
        default: ""
        type: string
      selector_audit_selectors:
        description: "Comma-separated CSS selectors to audit across configured routes"
        required: false
        default: ""
        type: string
      min_selector_hits:
        description: "Minimum tracked selector hits required"
        required: false
        default: "3"
        type: string
      min_custom_selector_hits:
        description: "Minimum custom selectors that must match across all audited routes"
        required: false
        default: "0"
        type: string
      project:
        description: "Playwright project"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox

permissions: {}

jobs:
  live-dom-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Run live DOM selector audit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ENV="${{ inputs.target_environment || 'prod' }}"
          BASE_URL_INPUT="${{ inputs.base_url || '' }}"
          REQUIRE_RUNTIME_THEME="${{ inputs.require_runtime_theme || 'false' }}"
          REQUIRE_BRANDING_MARKERS="${{ inputs.require_branding_markers || 'true' }}"
          AUDIT_PROFILE="${{ inputs.audit_profile || 'standard' }}"
          SELECTOR_AUDIT_PATH="${{ inputs.selector_audit_path || '/authn/login' }}"
          SELECTOR_AUDIT_ROUTES="${{ inputs.selector_audit_routes || '' }}"
          SELECTOR_AUDIT_SELECTORS="${{ inputs.selector_audit_selectors || '' }}"
          MIN_SELECTOR_HITS="${{ inputs.min_selector_hits || '3' }}"
          MIN_CUSTOM_SELECTOR_HITS="${{ inputs.min_custom_selector_hits || '0' }}"
          PROJECT="${{ inputs.project || 'chromium' }}"

          args=(--env "$TARGET_ENV" --audit-profile "$AUDIT_PROFILE" --selector-audit-path "$SELECTOR_AUDIT_PATH" --min-selector-hits "$MIN_SELECTOR_HITS" --min-custom-selector-hits "$MIN_CUSTOM_SELECTOR_HITS" --project "$PROJECT")
          if [[ -n "$SELECTOR_AUDIT_ROUTES" ]]; then
            args+=(--selector-audit-routes "$SELECTOR_AUDIT_ROUTES")
          fi
          if [[ -n "$SELECTOR_AUDIT_SELECTORS" ]]; then
            args+=(--selector-audit-selectors "$SELECTOR_AUDIT_SELECTORS")
          fi
          if [[ -n "$BASE_URL_INPUT" ]]; then
            args+=(--base-url "$BASE_URL_INPUT")
          fi
          if [[ "$REQUIRE_RUNTIME_THEME" == "true" ]]; then
            args+=(--require-runtime-theme)
          fi
          if [[ "$REQUIRE_BRANDING_MARKERS" == "true" ]]; then
            args+=(--require-branding-markers)
          else
            args+=(--allow-unbranded-shell)
          fi

          ./scripts/qa/verify-mfe-live-dom-audit.sh "${args[@]}"

      - name: Upload live DOM audit artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: mfe-live-dom-audit-${{ inputs.target_environment || 'prod' }}-${{ github.run_number }}
          path: |
            var/qa/mfe-live-dom-audit-*.log
            var/e2e-artifacts/**
            var/e2e-report/**
          if-no-files-found: warn

      - name: Summarize live DOM audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$(ls -1t var/qa/mfe-live-dom-audit-*.log 2>/dev/null | head -1 || true)"
          {
            echo "## MFE Live DOM Audit"
            echo
            echo "- Target environment: \`${{ inputs.target_environment || 'prod' }}\`"
            echo "- Audit profile: \`${{ inputs.audit_profile || 'standard' }}\`"
            echo "- Base URL override: \`${{ inputs.base_url || '(auto by env)' }}\`"
            echo "- Require runtime theme mode: \`${{ inputs.require_runtime_theme || 'false' }}\`"
            echo "- Require branding markers: \`${{ inputs.require_branding_markers || 'true' }}\`"
            echo "- Selector audit path: \`${{ inputs.selector_audit_path || '/authn/login' }}\`"
            echo "- Selector audit routes: \`${{ inputs.selector_audit_routes || '(selector_audit_path only)' }}\`"
            echo "- Selector audit selectors: \`${{ inputs.selector_audit_selectors || '(none)' }}\`"
            echo "- Min tracked selector hits: \`${{ inputs.min_selector_hits || '3' }}\`"
            echo "- Min custom selector hits: \`${{ inputs.min_custom_selector_hits || '0' }}\`"
            echo "- Playwright project: \`${{ inputs.project || 'chromium' }}\`"
            if [[ -n "$LOG_FILE" ]]; then
              echo "- Log file: \`$LOG_FILE\`"
            else
              echo "- Log file: not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
