# @covers AC-TCR-007
# @spec: tutor-configuration-resilience_spec.md
name: Verify Patch Idempotency

on:
  pull_request:
    paths:
      - 'infrastructure/tutor/**'
  workflow_dispatch:

permissions: {}

jobs:
  idempotency:
    name: Patch Idempotency
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tutor and dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -U pip
          pip install "tutor[full]==18.2.2" tutor-mfe==18.1.0
          pip install pyyaml jinja2

      - name: Set Tutor environment
        run: |
          echo "TUTOR_ROOT=$(pwd)/tutor_env" >> $GITHUB_ENV

      - name: Generate clean config
        run: |
          source .venv/bin/activate
          mkdir -p tutor_env
          cp infrastructure/tutor/config.example.yml tutor_env/config.yml
          tutor config save

      - name: Run idempotency verification
        run: |
          source .venv/bin/activate
          ./scripts/qa/verify-patch-idempotency.sh --tutor

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: idempotency-failure-artifacts
          path: |
            tutor_env/env/apps/openedx/settings/lms/production.py
            tutor_env/env/build/openedx/Dockerfile
            tutor_env/env/plugins/mfe/build/mfe/Dockerfile
            tutor_env/env/local/docker-compose.yml
            tutor_env/env/apps/caddy/Caddyfile
          retention-days: 3
