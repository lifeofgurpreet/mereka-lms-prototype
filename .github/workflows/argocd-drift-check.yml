name: ArgoCD Drift Check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_run:
    workflows:
      - "Build Tutor Images"
    types:
      - completed
  workflow_dispatch:
    inputs:
      app:
        description: "ArgoCD Application to check"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - mereka-lms-dev
          - mereka-lms-prod

permissions: {}

jobs:
  offline-drift-check:
    name: Offline Drift Check (git manifests)
    runs-on: mereka-k8s-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Checkout bbi-infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: Biji-Biji-Initiative/bbi-infrastructure
          path: bbi-infrastructure
          token: ${{ secrets.BBI_INFRA_TOKEN }}

      - name: Run offline drift check (dev)
        if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'mereka-lms-dev' || github.event_name == 'schedule' }}
        env:
          BBI_INFRA: ${{ github.workspace }}/bbi-infrastructure
        run: |
          ./scripts/qa/verify-argocd-drift.sh --app mereka-lms-dev --offline | tee var-drift-dev-offline.log

      - name: Run offline drift check (prod)
        if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'mereka-lms-prod' || github.event_name == 'schedule' }}
        env:
          BBI_INFRA: ${{ github.workspace }}/bbi-infrastructure
        run: |
          ./scripts/qa/verify-argocd-drift.sh --app mereka-lms-prod --offline | tee var-drift-prod-offline.log

      - name: Upload offline logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: argocd-drift-offline-logs
          path: var-drift-*.log
          retention-days: 3
          if-no-files-found: warn

  online-drift-check:
    name: Online Drift Check (live cluster)
    runs-on: mereka-k8s-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Authenticate to GCP and get GKE credentials
        id: gke-auth
        if: ${{ (vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SA != '') || vars.HAS_GCP_SA_KEY == 'true' }}
        uses: ./.github/actions/gcp-gke-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          wif_service_account: ${{ vars.GCP_WIF_SA }}
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
          auth_mode: auto
          gcloud_project: bbi-k8
          gke_project: ${{ vars.GKE_CLUSTER_PROJECT || 'bbi-k8' }}
          gke_location: ${{ vars.GKE_CLUSTER_LOCATION || 'asia-southeast1-c' }}
          gke_cluster: ${{ vars.GKE_CLUSTER_NAME || 'bbi-k8-cluster' }}
          strict_runtime: 'false'

      - name: Run online drift check (prod)
        if: ${{ steps.gke-auth.outputs.has_cluster == 'true' && (github.event.inputs.app == 'all' || github.event.inputs.app == 'mereka-lms-prod' || github.event_name == 'schedule') }}
        run: |
          ./scripts/qa/verify-argocd-drift.sh --app mereka-lms-prod --online | tee var-drift-prod-online.log

      - name: Upload online logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: argocd-drift-online-logs
          path: var-drift-*.log
          retention-days: 3
          if-no-files-found: warn

  alert-on-drift:
    name: Alert on Drift
    needs: [offline-drift-check, online-drift-check]
    if: failure()
    runs-on: mereka-k8s-runners
    permissions:
      issues: write
    steps:
      - name: Create drift alert issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const title = `ArgoCD drift detected (${new Date().toISOString().slice(0,10)})`;

            // Check for existing open issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'argocd-drift',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              // Comment on existing issue instead
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Drift re-detected at ${new Date().toISOString()}.\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              labels: ['argocd-drift', 'ops'],
              body: [
                '## ArgoCD Drift Detected',
                '',
                `**Workflow run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### What to check',
                '1. Download the log artifacts from the workflow run above',
                '2. Look for `FAIL` lines indicating drift',
                '3. Follow the runbook: `docs/operations/ARGOCD_DRIFT.md`',
                '',
                '### Common causes',
                '- Manual `kubectl patch` on ArgoCD-managed Application or ApplicationSet',
                '- Automated sync disabled by someone debugging',
                '- bbi-infrastructure overlay path changed without updating ApplicationSet',
                '',
                '### Resolution',
                '**Never patch in-cluster.** Fix in git (bbi-infrastructure repo) and let ArgoCD reconcile.',
              ].join('\n'),
            });
