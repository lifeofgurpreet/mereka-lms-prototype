name: Verify Image Tags

on:
  pull_request:
    paths:
      - 'deploy/k8s/overlays/production/**'
  push:
    branches:
      - main
    paths:
      - 'deploy/k8s/overlays/production/**'
  workflow_dispatch:

permissions: {}

jobs:
  verify-no-latest:
    name: No :latest tags in production overlays
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Verify no :latest image tags
        run: ./scripts/qa/verify-no-latest-tags.sh
