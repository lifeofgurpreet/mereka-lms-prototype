name: Unauthenticated Smoke Tests

permissions: {}

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 6am UTC
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev

jobs:
  smoke:
    name: Smoke (${{ inputs.target_environment || 'prod' }})
    runs-on: mereka-k8s-runners
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Resolve base URL
        id: resolve
        run: |
          TARGET="${{ inputs.target_environment || 'prod' }}"
          if [[ "$TARGET" == "dev" ]]; then
            echo "base_url=https://academyv2.mereka.dev" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://academyv2.mereka.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unauthenticated smoke tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
        run: |
          npx playwright test smoke-unauthenticated --project chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: smoke-unauthenticated-results
          path: |
            var/e2e-report/**
            var/e2e-artifacts/**
          retention-days: 7
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Unauthenticated Smoke Tests"
            echo ""
            echo "- Environment: \`${{ inputs.target_environment || 'prod' }}\`"
            echo "- Base URL: \`${{ steps.resolve.outputs.base_url }}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
