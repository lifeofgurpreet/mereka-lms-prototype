name: Observability Audit

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode"
        required: false
        default: "all"
        type: choice
        options:
          - local
          - runtime
          - all
      strict_runtime:
        description: "Fail if runtime dependencies (gcloud/k8s) are unavailable"
        required: false
        default: false
        type: boolean
      include_legacy:
        description: "Include legacy Cloud SQL monitoring templates"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  local-audit:
    name: Local Observability Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run local audit
        run: |
          ./scripts/qa/audit-observability.sh --mode local --json | tee observability-audit-local.json

      - name: Upload local audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: observability-audit-local
          path: observability-audit-local.json

  runtime-audit:
    name: Runtime Observability Audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
        with:
          project_id: mereka-lms

      - name: Get GKE credentials (if available)
        env:
          GKE_CLUSTER_PROJECT: ${{ vars.GKE_CLUSTER_PROJECT || 'bbi-k8' }}
          GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION || 'asia-southeast1-c' }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME || 'bbi-k8-cluster' }}
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'false' }}
        run: |
          if gcloud container clusters get-credentials "$GKE_CLUSTER_NAME" \
            --project "$GKE_CLUSTER_PROJECT" \
            --zone "$GKE_CLUSTER_LOCATION"; then
            echo "CAN_RUN_RUNTIME=true" >> "$GITHUB_ENV"
          else
            echo "CAN_RUN_RUNTIME=false" >> "$GITHUB_ENV"
            if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
              echo "ERROR: unable to get GKE credentials (set strict_runtime=false to skip runtime audit)" >&2
              exit 1
            fi
            echo "WARN: unable to get GKE credentials; skipping runtime audit (strict_runtime=false)" >&2
          fi

      - name: Run runtime/local audit bundle
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'all' }}
          INPUT_STRICT_RUNTIME: ${{ github.event.inputs.strict_runtime || 'false' }}
          INPUT_INCLUDE_LEGACY: ${{ github.event.inputs.include_legacy || 'false' }}
          GKE_CLUSTER_PROJECT: ${{ vars.GKE_CLUSTER_PROJECT || 'bbi-k8' }}
        run: |
          MODE="$INPUT_MODE"
          if [[ -z "$MODE" ]]; then MODE="all"; fi

          STRICT_FLAG=""
          if [[ "$INPUT_STRICT_RUNTIME" == "true" ]]; then
            export STRICT_RUNTIME=1
            STRICT_FLAG="--strict"
          else
            export STRICT_RUNTIME=0
          fi

          if [[ "$INPUT_INCLUDE_LEGACY" == "true" ]]; then
            export INCLUDE_LEGACY_MONITORING=1
          else
            export INCLUDE_LEGACY_MONITORING=0
          fi

          mkdir -p var/ci

          if [[ "$MODE" == "local" ]]; then
            ./scripts/qa/audit-observability.sh --mode local --json | tee observability-audit-runtime.json
          else
            OBSERVABILITY_ENV_LABEL=prod \
            OBSERVABILITY_DISPATCH_PROFILE=prod \
            OBSERVABILITY_K8S_CONTEXT="$(kubectl config current-context)" \
            OBSERVABILITY_GCP_PROJECT="${GCP_PROJECT:-mereka-lms}" \
            ./scripts/qa/run-observability-first-class.sh --mode "$MODE" $STRICT_FLAG

            if [[ "$MODE" == "runtime" ]]; then
              cp var/ci/observability-compliance-runtime.json observability-audit-runtime.json
            else
              cp var/ci/observability-compliance-all.json observability-audit-runtime.json
            fi
            cat observability-audit-runtime.json
          fi

      - name: Upload runtime audit artifact
        if: ${{ env.CAN_RUN_RUNTIME == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: observability-audit-runtime
          path: |
            observability-audit-runtime.json
            var/ci/observability-compliance-*.json
            var/ci/observability-compliance-*.md
            var/ci/observability-coverage-*.json
            var/ci/observability-coverage-*.md
            var/ci/observability-runtime-verify-*.txt
            var/ci/observability-runtime-verify-*.md
            var/ci/observability-first-class-*-evidence-index.json
