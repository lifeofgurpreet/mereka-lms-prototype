# Sanitized Tutor configuration overrides. Copy to tutor_env/config.yml and fill in secrets via `tutor config save`.
LMS_HOST: localhost
CMS_HOST: studio.localhost
DISCOVERY_HOST: discovery.localhost
ECOMMERCE_HOST: ecommerce.localhost
