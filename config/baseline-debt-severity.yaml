# ── Summary ─────────────────────────────────────────────────────────────

summary:
  high_severity: 0
  medium_severity: 3
  low_severity: 0
  fixed: 1
  total_active: 3
  merge_policy: >
    Zero high-severity failures required for merge.
    Medium-severity runtime failures are tolerated on main when
    the root cause is runner tooling, not product behavior.
    All 3 active medium failures share the same root cause:
    Playwright/Python version mismatch on ARC runners.
  recommended_fix: >
    Single fix: align ARC runner Python to 3.11 or update Playwright
