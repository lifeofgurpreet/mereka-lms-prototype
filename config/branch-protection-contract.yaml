# Branch Protection Contract — declared vs live GitHub settings
#
# Two sections per repo:
#   live: what GitHub actually enforces (audited 2026-04-08)
#   target: what the contract says SHOULD be enforced
#
# Consumed by: scripts/qa/verify-branch-protection-contract.sh
# Gaps between live and target are enforcement debt.
---
schema_version: "2.0"
audited_at: "2026-04-13"

repos:
  - repo: "Biji-Biji-Initiative/mereka-lms"
    branch: main
    live:
      enforce_admins: true
      required_approving_review_count: 0
      strict_status_checks: true
      required_status_checks:
        - "Static Validation"
        - "Tutor Configuration Tests"
        - "Security Scans"
        - "Python test coverage"
        - "Review dependencies"
        - "Trivy — K8s Manifests"
        - "Trivy — Terraform"
    target:
      enforce_admins: true
      required_approving_review_count: 0
      strict_status_checks: true
      required_status_checks:
        - "Static Validation"
        - "Tutor Configuration Tests"
        - "Security Scans"
        - "Python test coverage"
        - "Review dependencies"
        - "Trivy — K8s Manifests"
        - "Trivy — Terraform"
    gaps: []
    notes: "0 required reviews: PRs are agent-authored, owner-merged."

  - repo: "Biji-Biji-Initiative/bbi-infrastructure"
    branch: main
    live:
      enforce_admins: false
      required_approving_review_count: 1
      strict_status_checks: true
      required_status_checks:
        - "auth-verify"
        - "policy-guards"
    target:
      enforce_admins: false
      required_approving_review_count: 1
      strict_status_checks: true
      required_status_checks:
        - "auth-verify"
        - "policy-guards"
    gaps: []
    tolerated_deviations:
      - field: enforce_admins
        live_value: false
        reason: >
          bbi-infrastructure handles live GitOps (ArgoCD). Admin bypass
          is retained for emergency patches to cluster state. Admin
          merges must be logged in admin-merge-exception-ledger.yaml.
        review_date: "2026-07-01"
    notes: "2 required checks. Admin bypass is tolerated with ledger logging."
