# Branch Protection Contract — machine-readable main-branch governance rules
---
schema_version: "1.0"

defaults:
  branch: main
  exact_status_checks: true

repos:
  - repo: "Biji-Biji-Initiative/mereka-lms"
    branch: main
    enforce_admins: true
    required_approving_review_count: 1
    dismiss_stale_reviews: true
    required_conversation_resolution: true
    strict_status_checks: true
    required_status_checks:
      - "Static Validation"
      - "Tutor Configuration Tests"
      - "Security Scans"
      - "Python test coverage"
      - "Review dependencies"
      - "Trivy — K8s Manifests"
      - "Trivy — Terraform"
    allow_force_pushes: false
    allow_deletions: false
  - repo: "Biji-Biji-Initiative/bbi-infrastructure"
    branch: main
    enforce_admins: true
    required_approving_review_count: 1
    dismiss_stale_reviews: true
    required_conversation_resolution: true
    strict_status_checks: true
    required_status_checks:
      - "auth-verify"
      - "policy-guards"
    allow_force_pushes: false
    allow_deletions: false
  - repo: "Biji-Biji-Initiative/platform-control-plane"
    branch: main
    enforce_admins: true
    required_approving_review_count: 1
    dismiss_stale_reviews: true
    required_conversation_resolution: true
    strict_status_checks: true
    required_status_checks:
      - "pr-branch-freshness"
      - "validate (dev)"
      - "validate (prod)"
      - "enforce-governance"
    allow_force_pushes: false
    allow_deletions: false
