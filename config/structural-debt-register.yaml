# declared invariants. Each must have an owner, severity, and a
# kill/migrate/tolerate decision.
#
# Consumers:
#   - scripts/qa/verify-structural-debt-register.sh (freshness + schema)
#   - Agent execution workflows (debt-aware routing)
#   - Operational convergence sessions
#
# Classification:
#   severity: critical | high | medium | low
#   decision: kill | migrate | tolerate
#   status: open | in-progress | resolved
