# Proof Lane Status — machine-readable proof state per lane
#
# Each proof lane has a contract (what it proves), a set of
# verifiers (scripts that run), and a current status.
#
# This file is updated after each proof run. Manual edits
# must be backed by actual proof artifacts.
#
# Consumers:
#   - Release gate scripts
#   - Operational dashboards
#   - docs/status/active/ companion docs
---
