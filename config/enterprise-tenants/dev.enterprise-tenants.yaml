# Declarative Enterprise Tenant Bootstrap Spec
#
# This file defines the desired state for all enterprise tenants
# in the dev environment. It is consumed by:
#   - scripts/tenants/bootstrap-enterprise-tenants.py (bootstrap tool)
#   - scripts/tenants/validate-enterprise-tenants.py (validation tool)
#
# Default behavior: DRY RUN. Use --apply to mutate data.
#
# Idempotent: running twice produces no duplicate records.
---
version: "1.0"
environment: dev
lms_domain: academyv2.mereka.dev

tenants:
  - slug: mereka
    name: Mereka Academy
    org_code: MEREKA
    active: true
    contact_email: team@mereka.io
    country: MY
    is_platform_operator: true

    site:
      domain: academyv2.mereka.dev

    enterprise_customer:
      # UUID is generated on first create, then becomes stable.
      # If a UUID is provided, the tool uses it for get_or_create.
      # uuid: null  # auto-generated
      enable_data_sharing_consent: true
      enforce_data_sharing_consent: at_enrollment
      enable_audit_enrollment: false
      enable_learner_portal: true
      enable_portal_code_management: false
      enable_analytics_screen: true

    catalogs:
      - title: "Mereka Academy Full Catalog"
        catalog_query:
          content_filter:
            content_type: course
            aggregation_key: ["courserun:*"]
          # All MEREKA org courses
          org_filter:
            - MEREKA

    user_links:
      # Link admin users to this enterprise customer.
      # email is the lookup key. role is "admin" or "learner".
      - email: team@mereka.io
        role: admin
      # Additional admin/learner links can be added here.

    waffle_switches:
      enterprise.enable_learner_portal: true
      enterprise.enable_analytics_screen: true
      enterprise.enable_audit_enrollment: false
      enterprise.enable_portal_code_management: false
      enterprise.enable_integrated_learner_portal_search: true

  - slug: bijibiji
    name: Biji-Biji Academy
    org_code: BIJIBIJI
    active: true
    contact_email: admin@biji-biji.com
    country: MY
    is_platform_operator: false

    site:
      domain: academy.biji-biji.com
      # Dev: no biji-biji dev domain currently defined.
      # This entry provisions the prod-like record for data model validation.

    enterprise_customer:
      enable_data_sharing_consent: true
      enforce_data_sharing_consent: at_enrollment
      enable_audit_enrollment: false
      enable_learner_portal: true
      enable_portal_code_management: false
      enable_analytics_screen: true

    catalogs:
      - title: "Biji-Biji Academy Catalog"
        catalog_query:
          content_filter:
            content_type: course
            aggregation_key: ["courserun:*"]
          org_filter:
            - BIJIBIJI
            # NOTE: If biji-biji should also see MEREKA courses,
            # add MEREKA to this list. Decision pending.

    user_links:
      - email: admin@biji-biji.com
        role: admin

    waffle_switches:
      enterprise.enable_learner_portal: true
      enterprise.enable_analytics_screen: true
      enterprise.enable_audit_enrollment: false
      enterprise.enable_portal_code_management: false
      enterprise.enable_integrated_learner_portal_search: true

  - slug: skillourfuture
    name: Skill Our Future
    org_code: SKILLOURFUTURE
    active: true
    contact_email: admin@mereka.io
    country: MY
    is_platform_operator: false

    site:
      domain: skillourfuture.academy.mereka.io
      # Dev: no skillourfuture dev domain currently defined.

    enterprise_customer:
      enable_data_sharing_consent: true
      enforce_data_sharing_consent: at_enrollment
      enable_audit_enrollment: false
      enable_learner_portal: true
      enable_portal_code_management: false
      enable_analytics_screen: true

    catalogs:
      - title: "Skill Our Future Catalog"
        catalog_query:
          content_filter:
            content_type: course
            aggregation_key: ["courserun:*"]
          org_filter:
            - SKILLOURFUTURE
            # NOTE: If SOF should also see MEREKA courses,
            # add MEREKA to this list. Decision pending.

    user_links:
      - email: admin@mereka.io
        role: admin

    waffle_switches:
      enterprise.enable_learner_portal: true
      enterprise.enable_analytics_screen: true
      enterprise.enable_audit_enrollment: false
      enterprise.enable_portal_code_management: false
      enterprise.enable_integrated_learner_portal_search: true

# Decisions requiring human input before bootstrap --apply:
#
# 1. Should bijibiji and skillourfuture catalogs include MEREKA org courses?
#    Currently they only include their own org. If those orgs have zero courses,
#    the catalogs will be empty.
#
# 2. What UUID should the Mereka EnterpriseCustomer use?
#    If one already exists in the DB, provide it here to avoid duplicates.
#
# 3. Which admin users should be linked to each enterprise customer?
#    The email addresses above are placeholders from tenant-contracts.yml.
