# Declarative Enterprise Tenant Bootstrap Spec
#
# This file defines the desired state for all enterprise tenants
# in the production environment. It is consumed by:
#   - scripts/tenants/bootstrap-enterprise-tenants.py (bootstrap tool)
#   - scripts/tenants/validate-enterprise-tenants.py (validation tool)
#
# Default behavior: DRY RUN. Use --apply to mutate data.
#
# Idempotent: running twice produces no duplicate records.
#
# Domain authority: deploy/k8s/tenancy/tenant-registry.yaml (production section)
# Namespace: mereka-lms
# Auth host: auth0.mereka.io
#
# IMPORTANT: Only biji-biji enterprise tenant exists on prod currently.
# mereka and skillourfuture are spec-only — they will be bootstrapped
# when their enterprise features are activated on production.
---
version: "1.1"
environment: production
lms_domain: academyv2.mereka.io

# Global waffle flags (not per-tenant — apply once per environment)
waffle_flags:
  learner_home_mfe.enabled: true  # Redirect /dashboard to MFE learner-home

tenants:
  - slug: mereka
    name: Mereka Academy
    org_code: MEREKA
    active: true
    contact_email: team@mereka.io
    country: MY
    is_platform_operator: true

    site:
      domain: academyv2.mereka.io

    enterprise_customer:
      # UUID is generated on first create, then becomes stable.
      # If a UUID is provided, the tool uses it for get_or_create.
      # uuid: null  # auto-generated
      enable_data_sharing_consent: true
      enforce_data_sharing_consent: externally_managed
      enable_audit_enrollment: false
      enable_learner_portal: true
      enable_portal_code_management: false
      enable_analytics_screen: true

    catalogs:
      - title: "Mereka Academy Full Catalog"
        catalog_query:
          content_filter:
            content_type: course
            aggregation_key: ["courserun:*"]
          # All MEREKA org courses
          org_filter:
            - MEREKA

    user_links:
      # Link admin users to this enterprise customer.
      # email is the lookup key. role is "admin" or "learner".
      - email: team@mereka.io
        role: admin
      - email: lanea-enterprise-learner@synthetic.test
        role: learner
      - email: lanea-enterprise-admin@synthetic.test
        role: admin

    waffle_switches:
      enterprise.enable_learner_portal: true
      enterprise.enable_analytics_screen: true
      enterprise.enable_audit_enrollment: false
      enterprise.enable_portal_code_management: false
      enterprise.enable_integrated_learner_portal_search: true

  - slug: biji-biji
    name: Biji-Biji Academy
    org_code: BIJIBIJI
    active: true
    contact_email: admin@biji-biji.com
    country: MY
    is_platform_operator: false

    site:
      # Production biji-biji domain is academy.biji-biji.com (not a subdomain of mereka.io)
      domain: academy.biji-biji.com

    enterprise_customer:
      enable_data_sharing_consent: true
      enforce_data_sharing_consent: externally_managed
      enable_audit_enrollment: false
      enable_learner_portal: true
      enable_portal_code_management: false
      enable_analytics_screen: true

    catalogs:
      - title: "Biji-Biji Academy Catalog"
        catalog_query:
          content_filter:
            content_type: course
            aggregation_key: ["courserun:*"]
          org_filter:
            - BIJIBIJI
            # NOTE: If biji-biji should also see MEREKA courses,
            # add MEREKA to this list. Decision pending.

    user_links:
      - email: admin@biji-biji.com
        role: admin
      - email: lanea-enterprise-learner@synthetic.test
        role: learner
      - email: lanea-enterprise-admin@synthetic.test
        role: admin

    waffle_switches:
      enterprise.enable_learner_portal: true
      enterprise.enable_analytics_screen: true
      enterprise.enable_audit_enrollment: false
      enterprise.enable_portal_code_management: false
      enterprise.enable_integrated_learner_portal_search: true

  - slug: skillourfuture
    name: Skill Our Future
    org_code: SKILLOURFUTURE
    active: true
    contact_email: admin@mereka.io
    country: MY
    is_platform_operator: false

    site:
      # Production SOF domain — CURRENT: skillourfuture.academy.mereka.io
      # Migration target: skillourfuture.academyv2.mereka.io (no DNS yet)
      domain: skillourfuture.academy.mereka.io

    enterprise_customer:
      enable_data_sharing_consent: true
      enforce_data_sharing_consent: externally_managed
      enable_audit_enrollment: false
      enable_learner_portal: true
      enable_portal_code_management: false
      enable_analytics_screen: true

    catalogs:
      - title: "Skill Our Future Catalog"
        catalog_query:
          content_filter:
            content_type: course
            aggregation_key: ["courserun:*"]
          org_filter:
            - SKILLOURFUTURE
            # NOTE: If SOF should also see MEREKA courses,
            # add MEREKA to this list. Decision pending.

    user_links:
      - email: admin@mereka.io
        role: admin
      - email: lanea-enterprise-learner@synthetic.test
        role: learner
      - email: lanea-enterprise-admin@synthetic.test
        role: admin

    waffle_switches:
      enterprise.enable_learner_portal: true
      enterprise.enable_analytics_screen: true
      enterprise.enable_audit_enrollment: false
      enterprise.enable_portal_code_management: false
      enterprise.enable_integrated_learner_portal_search: true

# Decisions requiring human input before bootstrap --apply:
#
# 1. Should biji-biji and skillourfuture catalogs include MEREKA org courses?
#    Currently they only include their own org. If those orgs have zero courses,
#    the catalogs will be empty.
#
# 2. mereka and skillourfuture enterprise tenants may not yet exist on prod.
#    Use --tenant biji-biji to bootstrap only the live tenant:
#      python scripts/tenants/bootstrap-enterprise-tenants.py --env production --tenant biji-biji --apply
#
# 3. Admin users: email addresses below are for bootstrap user_links (ECU records).
#    Users must already exist in the production DB before bootstrap runs.
#
# 4. SOF domain migration: skillourfuture.academy.mereka.io is current.
#    When DNS migrates to skillourfuture.academyv2.mereka.io, update the
#    site.domain here and re-run bootstrap --apply --tenant skillourfuture.
