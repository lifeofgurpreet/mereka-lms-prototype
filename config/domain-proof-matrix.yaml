# DEPRECATION SHIM — This file has moved to platform-control-plane
#
# WHY: Proof scoring rules and blocker classifications are release-pipeline
# governance. They define what "proved" means for a surface and must be enforced
# consistently across all environments and lanes. This is not tenant runtime data —
# it is policy owned by platform-control-plane (Phase 7, Agent 1 VNext brief).
#
# CANONICAL LOCATION:
#   platform-control-plane/contracts/domain-proof-scoring-policy.yaml
#   https://github.com/Biji-Biji-Initiative/platform-control-plane/blob/main/contracts/domain-proof-scoring-policy.yaml
#
# NOTE: The file was renamed in platform-control-plane to domain-proof-scoring-policy.yaml
# to better reflect that it is a scoring policy contract, not live tenant data.
#
# MIGRATION DATE: 2026-04-10
#
# This shim file is intentionally kept at the original path to avoid breaking
# any tooling that reads config/domain-proof-matrix.yaml directly. It will be
# removed after all consumers have been updated to read from the canonical location.
#
# DO NOT EDIT THIS FILE. Edit the canonical file in platform-control-plane instead.
#
# ---
# The content below is a frozen snapshot as of migration date.
# It is preserved here for backwards compatibility only.
# ---
schema_version: "1.0"
_deprecated: true
_canonical: "https://github.com/Biji-Biji-Initiative/platform-control-plane/blob/main/contracts/domain-proof-scoring-policy.yaml"
_migration_date: "2026-04-10"

inputs:
  tenant_registry: "deploy/k8s/tenancy/tenant-registry.yaml"
  smoke_registry: "deploy/k8s/tenancy/smoke-account-registry.yaml"
  dns_records:
    - environment: production
      file: "infrastructure/cloudflare/records.json"
    - environment: staging
      file: "infrastructure/cloudflare/records.json"
    - environment: dev
      file: "infrastructure/cloudflare/records.mereka-dev.json"
    - environment: profiles-dev
      file: "infrastructure/cloudflare/records.mereka-dev.json"
  browser_matrices:
    - environment: production
      file: "generated/tenant-runtime/browser-matrix-production.json"
    - environment: staging
      file: "generated/tenant-runtime/browser-matrix-staging.json"
    - environment: dev
      file: "generated/tenant-runtime/browser-matrix-dev.json"
    - environment: profiles-dev
      file: "generated/tenant-runtime/browser-matrix-profiles-dev.json"

environments:
  production:
    count_in_scoreboard: true
    required_workflows:
      - ".github/workflows/build-tutor-images.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/smoke-authenticated.yml"
  staging:
    count_in_scoreboard: true
    required_workflows:
      - ".github/workflows/smoke-authenticated.yml"
  dev:
    count_in_scoreboard: true
    required_workflows:
      - ".github/workflows/build-tutor-images.yml"
      - ".github/workflows/smoke-authenticated.yml"
  profiles-dev:
    count_in_scoreboard: true
    required_workflows:
      - ".github/workflows/build-tutor-images.yml"
      - ".github/workflows/smoke-authenticated.yml"
  local:
    count_in_scoreboard: false
    required_workflows: []

scoring:
  count_statuses: [active]
  blocker_priority: [secrets, ci, promotion, runtime]
  success_statuses: [green, unknown, red]

default_surface_rule:
  proof_mode: metadata_only
  smoke_account_role: none
  smoke_account_required: false

surface_rules:
  - role: primary
    proof_mode: browser_matrix
    smoke_account_role: learner
    smoke_account_required: true
  - role: studio
    proof_mode: browser_matrix
    smoke_account_role: operator
    smoke_account_required: true
  - role: mfe
    proof_mode: browser_matrix
    smoke_account_role: learner
    smoke_account_required: true
  - role: enterprise-learner
    proof_mode: metadata_only
    smoke_account_role: learner
    smoke_account_required: true
  - role: enterprise-admin
    proof_mode: metadata_only
    smoke_account_id: smoke-enterprise-admin
    smoke_account_required: true
  - role: analytics
    proof_mode: metadata_only
    smoke_account_id: smoke-analytics-support
    smoke_account_required: true
  - role: auth
    proof_mode: metadata_only
    smoke_account_role: none
    smoke_account_required: false

outputs:
  summary_json: "var/qa/domain-proof-summary.json"
