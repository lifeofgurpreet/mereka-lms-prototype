#
# Consumed by:
#   - config/invariant-enforcement-map.yaml (links each to detector/CI/policy)
#   - scripts/qa/verify-gitops-sync-drift.sh (validates coverage)
#
# Source: distilled from AGENTS.md hard rules, EXECUTION_INVARIANTS.md,
# and PROMOTION_REALIZATION_AND_INCIDENT_FLOW.md.
