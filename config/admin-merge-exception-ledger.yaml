# Admin Merge Exception Ledger
#
# Every merge that bypasses normal CI gates or review requirements
# MUST be logged here with justification.
#
# Admin merges that skip checks are not ordinary. They create
# unverified truth on main.
#
# Rule: if you use admin merge, you MUST add an entry here in
# the same PR or a follow-up within 24 hours.
#
# Consumers:
#   - PR review checklist
#   - Audit processes
#   - Incident post-mortems
---
schema_version: "1.0"

policy:
  rule: "Admin merges must be logged as exceptions"
  enforcement: "PR template checklist + this ledger"
  escalation: "Unlogged admin merges are treated as incidents"

exceptions:
  # Template entry (copy this for new exceptions):
  # - date: "YYYY-MM-DD"
  #   pr: "https://github.com/Biji-Biji-Initiative/mereka-lms/pull/NNNN"
  #   commit: "SHA"
  #   bypassed_checks:
  #     - "check name 1"
  #     - "check name 2"
  #   justification: "Why this bypass was necessary"
  #   follow_up: "What was done to prevent recurrence"
  #   logged_by: "agent or human name"

  - date: "2026-04-04"
    pr: "https://github.com/Biji-Biji-Initiative/mereka-lms/pull/1334"
    commit: "25d88b5d2"
    bypassed_checks:
      - "static-validation (CI not yet run on PR)"
      - "branch protection merge requirements"
    justification: >
      Platform operationalization tranche — docs, skills, CI enforcement,
      playbooks, truth artifacts. All 3 local invariant checks pass green.
      Approved by repo owner for immediate merge to unblock permanence work.
    follow_up: >
      New process-invariants.yml workflow now runs these checks as dedicated
      visible CI statuses on all future PRs. This was the bootstrap merge.
    logged_by: "agent-2 (factory-droid)"
