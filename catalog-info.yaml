  definition: |
    openapi: "3.0.0"
    info:
      title: Course Discovery API
      version: "1.0"
    paths:
      /api/v1/catalogs:
        get:
          summary: List course catalogs
      /api/v1/courses:
        get:
          summary: List courses
---
