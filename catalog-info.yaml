apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mereka-lms
  description: Mereka Academy Learning Management System built on Open edX
  annotations:
    github.com/project-slug: Biji-Biji-Initiative/mereka-lms
  tags:
    - openedx
    - python
    - kubernetes
    - tutor
  links:
    - url: https://academyv2.mereka.dev
      title: LMS (Dev)
    - url: https://academy.mereka.io
      title: LMS (Prod)
spec:
  owner: guests
