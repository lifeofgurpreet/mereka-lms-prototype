# =============================================================================
# APIs
# =============================================================================
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mereka-lms-api
  description: Core Open edX LMS REST API (users, enrolments, courses, OAuth2).
  tags: [rest, openedx]
spec:
  type: openapi
  lifecycle: production
  owner: platform-eng
  system: mereka-lms-core
  definition: |
    openapi: "3.0.0"
    info:
      title: Mereka LMS API
      version: "1.0"
    servers:
      - url: https://academyv2.mereka.dev
        description: Dev
      - url: https://academyv2.mereka.io
        description: Production
    paths:
      /api/user/v1/me:
        get:
          summary: Current user info
      /api/enrollment/v1/enrollment:
        get:
          summary: User enrollments
      /oauth2/access_token:
        post:
          summary: OAuth2 token endpoint

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mereka-lms-discovery-api
  description: Course Discovery and Catalog API.
  tags: [rest, openedx, discovery]
spec:
  type: openapi
  lifecycle: production
  owner: platform-eng
  system: mereka-lms-core
  definition: |
    openapi: "3.0.0"
    info:
      title: Course Discovery API
      version: "1.0"
    paths:
      /api/v1/catalogs:
        get:
          summary: List course catalogs
      /api/v1/courses:
        get:
          summary: List courses

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mereka-lms-purchase-api
  description: Purchase Gateway ecommerce API (Stripe).
  tags: [rest, fastapi, stripe]
spec:
  type: openapi
  lifecycle: production
  owner: commerce-eng
  system: mereka-lms-commerce
  definition: |
    openapi: "3.0.0"
    info:
      title: Purchase Gateway API
      version: "1.0"
    paths:
      /api/v1/checkout:
        post:
          summary: Create checkout session
      /api/v1/webhooks/stripe:
        post:
          summary: Stripe webhook handler

