# Backstage catalog for mereka-lms.
#
# Hierarchy (4 Systems grouped under the `mereka-platform` tag):
#   System: mereka-lms-core       - Open edX IDAs, MFE bundle, routing, notes, xqueue, preview-redirect
#   System: mereka-lms-enterprise - B2B stack (enterprise-access/catalog/subsidy, license-manager, portal MFEs)
#   System: mereka-lms-commerce   - purchase-gateway (Stripe) + HubSpot/Kajabi webhooks
#   System: mereka-lms-data       - MySQL, Redis, MongoDB Atlas, Elasticsearch, Meilisearch, SMTP
#
# Ownership teams (`platform-eng`, `enterprise-eng`, `commerce-eng`) are placeholders.
# Rename the `owner:` values + the Group entities at the bottom to match real teams.

---
# =============================================================================
# SYSTEMS
# =============================================================================
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mereka-lms-core
  description: Open edX IDAs, MFE bundle, reverse proxy, discovery, credentials, notes, xqueue, preview-redirect, and tenant resolver.
  annotations:
    github.com/project-slug: Biji-Biji-Initiative/mereka-lms
  tags: [openedx, python, django, tutor, kubernetes, mereka-platform]
  links:
    - url: https://academyv2.mereka.io
      title: LMS (Prod)
    - url: https://studio.academyv2.mereka.io
      title: Studio (Prod)
    - url: https://apps.academyv2.mereka.io
      title: MFE (Prod)
    - url: https://academyv2.mereka.dev
      title: LMS (Dev)
spec:
  owner: platform-eng

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mereka-lms-enterprise
  description: Enterprise B2B stack - access, catalog, subsidy, license-manager, plus admin-portal and learner-portal MFEs.
  tags: [enterprise, b2b, django, python, mereka-platform]
spec:
  owner: enterprise-eng

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mereka-lms-commerce
  description: Payments and external integrations - custom FastAPI purchase gateway (Stripe), plus HubSpot and Kajabi webhook receivers.
  tags: [commerce, stripe, fastapi, webhooks, mereka-platform]
spec:
  owner: commerce-eng

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: mereka-lms-data
  description: Shared data plane - MySQL 8, Redis, MongoDB Atlas, Elasticsearch, Meilisearch, SMTP relay.
  tags: [database, cache, search, data, mereka-platform]
spec:
  owner: platform-eng

