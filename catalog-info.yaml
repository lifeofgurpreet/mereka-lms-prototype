apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mereka-lms-api
  description: Core Open edX LMS REST API
  tags:
    - rest
    - openedx
spec:
  type: openapi
  lifecycle: production
  owner: guests
  system: mereka-lms
  definition: |
    openapi: "3.0.0"
    info:
      title: Mereka LMS API
      version: "1.0"
    servers:
      - url: https://academyv2.mereka.dev
        description: Dev
      - url: https://academy.mereka.io
        description: Production
    paths:
      /api/user/v1/me:
        get:
          summary: Current user info
      /api/enrollment/v1/enrollment:
        get:
          summary: User enrollments
      /oauth2/access_token:
        post:
          summary: OAuth2 token endpoint
---
apiVersion: backstage.io/v1alpha1
