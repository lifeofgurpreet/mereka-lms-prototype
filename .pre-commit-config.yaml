repos:
  - repo: local
    hooks:
      - id: adr-governance-suite
        name: ADR governance suite
        entry: scripts/qa/verify_adr_precommit.sh
        language: system
        pass_filenames: false
        files: ^(docs/adr/|docs/architecture/|docs/evidence/|docs/runbooks/|scripts/qa/verify_adr_|scripts/qa/build_decision_graph\.py|scripts/qa/resolve_adr_impact\.py)

      - id: verification-catalog-regen
        name: Regenerate verification catalog
        entry: scripts/qa/regen-verification-catalog.sh
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            scripts/.*/verify-[^/]+\.sh|
            \.github/ci-scripts-static\.txt|
            \.github/workflows/[^/]+\.ya?ml|
            scripts/qa/run-release-verification-gates\.sh|
            scripts/qa/run-operations-gates\.sh|
            scripts/qa/run-multisite-governance-gates\.sh|
            verification/manifests/deprecated_verify_scripts\.json|
            verification/catalogs/verification_status_overrides\.json|
            scripts/qa/fixtures/script-basename-overlap-allowlist\.json
          )$

  # Python formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Shell linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1090, SC1091]  # Allow source commands

  # Shell formatting
  - repo: https://github.com/mvdan/sh
    rev: v3.7.0
    hooks:
      - id: shfmt
        args: [-w, -s, -i, 2]

  # JavaScript/TypeScript formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.2
    hooks:
      - id: prettier
        types: [javascript, json, yaml, markdown]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=10000]
      - id: check-merge-conflict
      - id: check-case-conflict

  # Secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.0
    hooks:
      - id: gitleaks

