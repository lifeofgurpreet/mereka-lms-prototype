# Netlify config for mereka-lms-proto
#
# Deploy strategy:
#   - `main` branch → builds the Vite SPA from /frontend/
#     (mereka-lms-proto.netlify.app serves the live SPA prototype).
#   - `phase-0/*` branches → also build the SPA (branch deploys).
#
# The Open edX backend is deployed separately via Biji-Biji-Initiative/mereka-lms.
# This prototype consumes academyv2.mereka.dev APIs — it does NOT modify them.
#
# API PROXY: Netlify edge proxies /api/* requests to academyv2.mereka.dev
# so the browser never makes cross-origin requests. No CORS needed.

[build]
  publish = "frontend/dist"
  command = "cd frontend && npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_OPENEDX_BASE_URL = ""
  VITE_OPENEDX_AUTHN_URL = "https://apps.academyv2.mereka.dev"
  VITE_OPENEDX_STUDIO_URL = "https://studio.academyv2.mereka.dev"
  VITE_USE_MOCK_DATA = "false"
  VITE_SHOW_CROSS_DOMAIN_AUTH_NOTICE = "true"

# -- Branch-level overrides (keep for phase-0/* branches) --
[context."phase-0/spa-foundation"]
  publish = "frontend/dist"
  command = "cd frontend && npm install && npm run build"

[context."phase-0/spa-foundation".environment]
  NODE_VERSION = "20"
  VITE_OPENEDX_BASE_URL = ""
  VITE_OPENEDX_AUTHN_URL = "https://apps.academyv2.mereka.dev"
  VITE_OPENEDX_STUDIO_URL = "https://studio.academyv2.mereka.dev"
  VITE_USE_MOCK_DATA = "false"
  VITE_SHOW_CROSS_DOMAIN_AUTH_NOTICE = "true"

# Generic branch deploys (future phase-1/*, feature/* branches)
[context.branch-deploy]
  publish = "frontend/dist"
  command = "cd frontend && npm install && npm run build"

[context.branch-deploy.environment]
  NODE_VERSION = "20"
  VITE_OPENEDX_BASE_URL = ""
  VITE_USE_MOCK_DATA = "false"

# Deploy previews (PRs against main) — also build the SPA.
[context.deploy-preview]
  publish = "frontend/dist"
  command = "cd frontend && npm install && npm run build"

[context.deploy-preview.environment]
  NODE_VERSION = "20"
  VITE_OPENEDX_BASE_URL = ""
  VITE_USE_MOCK_DATA = "false"

# -----------------------------------------------------------------------
# PROXY REDIRECTS — must come BEFORE the SPA catch-all.
# Netlify processes redirects in order; first match wins.
# Status 200 with a full URL = invisible proxy (not a 3xx redirect).
# -----------------------------------------------------------------------

# Proxy Open edX course API
[[redirects]]
  from = "/api/courses/*"
  to = "https://academyv2.mereka.dev/api/courses/:splat"
  status = 200
  force = true

# Proxy Open edX enrollment API
[[redirects]]
  from = "/api/enrollment/*"
  to = "https://academyv2.mereka.dev/api/enrollment/:splat"
  status = 200
  force = true

# Proxy Open edX user API
[[redirects]]
  from = "/api/user/*"
  to = "https://academyv2.mereka.dev/api/user/:splat"
  status = 200
  force = true

# Proxy any other /api/ path as catch-all
[[redirects]]
  from = "/api/*"
  to = "https://academyv2.mereka.dev/api/:splat"
  status = 200
  force = true

# Proxy Open edX course assets (images, files)
[[redirects]]
  from = "/lms-assets/*"
  to = "https://academyv2.mereka.io/:splat"
  status = 200
  force = true

# SPA catch-all (serves index.html for any non-API, non-asset client-side route)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

