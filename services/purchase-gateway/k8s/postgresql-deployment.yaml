---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-payments
  labels:
    app.kubernetes.io/name: postgresql-payments
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: mereka-lms
    app.kubernetes.io/part-of: mereka-lms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: mereka-lms
      app.kubernetes.io/name: postgresql-payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-payments
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: mereka-lms
        app.kubernetes.io/part-of: mereka-lms
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgresql
          image: docker.io/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "payments_gateway"
            - name: POSTGRES_USER
              value: "payments"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-gateway-secrets
                  key: POSTGRESQL_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - payments
                - -d
                - payments_gateway
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - payments
                - -d
                - payments_gateway
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-payments
