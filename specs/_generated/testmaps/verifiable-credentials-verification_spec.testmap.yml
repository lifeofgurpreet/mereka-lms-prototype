spec: verifiable-credentials-verification_spec.md
acceptance_criteria:
- id: AC-CRED-030
  description: 'Given a valid credential UUID, when `GET /verify/{uuid}/` is called,
    then the response contains `"verified": true` with all checks passing'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-031
  description: 'Given a VC with a tampered `proofValue`, when `POST /verify/` is called
    with the modified JSON, then the response contains `"verified": false` with `"check":
    "signature", "status": "fail"`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-032
  description: Given a credential UUID, when `GET /credentials/{uuid}/` is called
    in a browser, then a human-readable page displays credential details with a verification
    status badge
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-033
  description: Given a credential public page URL, when shared on LinkedIn or social
    media, then the platform renders a rich preview using Open Graph metadata
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-034
  description: Given the DID Document was previously resolved, when verification is
    called again within 1 hour, then the cached DID Document is used (no network request)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-035
  description: 'Given a credential with an `expirationDate` in the past, when verified,
    then the response contains `"check": "expiration", "status": "fail"`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-036
  description: Given the verification endpoint, when more than 100 requests/minute
    are made from a single IP, then HTTP 429 is returned
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh
- id: AC-CRED-037
  description: 'Given any valid credential, when `GET /credentials/{uuid}/?format=json`
    is called, then the raw VC JSON is returned with `Content-Type: application/ld+json`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-credentials-verification.sh
    command: scripts/qa/verify-credentials-verification.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-vc-verification.sh
    command: scripts/qa/verify-vc-verification.sh

