spec: k8s-deployment_spec.md
acceptance_criteria:
- id: AC-INT-001
  description: Given `secrets-management_spec.md` ExternalSecrets are deployed, when
    K8s deployments reference `openedx-secrets` and `database-secrets`, then all pods
    reach Running state with no missing environment variable errors in logs.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-configmap-hash-suffixes.sh
    command: scripts/qa/verify-configmap-hash-suffixes.sh
  - type: manual
    runbook: docs/ops/runbooks/K8S_DEPLOYMENT_RUNBOOK.md
    section: Integration Tests
    justification: Validated on live cluster — kubectl get pods -n mereka-lms shows
      all Running; ExternalSecrets READY=True
- id: AC-INT-002
  description: Given ExternalSecrets reach `SecretSynced` status, when LMS pods start,
    then `kubectl exec lms-pod -- env | grep OPENEDX_SECRET_KEY` returns a non-empty
    value matching the GCP Secret Manager source.
  verify:
  - type: manual
    runbook: docs/ops/runbooks/K8S_DEPLOYMENT_RUNBOOK.md
    section: Integration Tests
    justification: Validated on live cluster — kubectl exec lms-pod confirms OPENEDX_SECRET_KEY
      is set and non-empty
- id: AC-INT-003
  description: Given a secret is rotated in Infisical and synced to GCP SM, when ExternalSecrets
    refresh (within 1h) and pods restart, then new pods use the rotated value without
    manual K8s Secret edits.
  verify:
  - type: manual
    runbook: docs/ops/runbooks/K8S_DEPLOYMENT_RUNBOOK.md
    section: Secret Rotation
    justification: Secret rotation flow not yet end-to-end tested; ExternalSecret
      TTL=1h is configured but rotation test requires coordination with Infisical
- id: AC-INT-004
  description: Given `tutor-configuration_spec.md` patches are applied, when K8s manifests
    reference MySQL, then MySQL Deployment includes `--mysql-native-password=ON` flag
    and LMS connects without authentication errors.
  verify:
  - type: manual
    runbook: docs/ops/runbooks/TROUBLESHOOTING.md
    section: MySQL Authentication Verification
    justification: Requires running MySQL 8 pod in GKE; kubectl exec to verify flag;
      cannot run against live cluster in CI
    file: scripts/infra/verify-tutor-config.sh
- id: AC-INT-005
  description: Given Tutor config includes multi-site domains (academy.biji-biji.com,
    skillourfuture.academy.mereka.io), when LMS production settings are inspected
    in the running pod, then `ALLOWED_HOSTS` contains all three domains.
  verify:
  - type: manual
    runbook: docs/ops/runbooks/TROUBLESHOOTING.md
    section: Multi-Site Domain Verification
    justification: Requires running LMS pod with kubectl exec; cannot inspect runtime
      settings without live cluster access
    file: scripts/qa/verify-tutor-multisite-domains.sh
- id: AC-001
  description: Given the base Kustomize directory, when `kubectl kustomize deploy/k8s/overlays/local`
    is run, then it renders without errors and all resources are in namespace `mereka-lms`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/apply-kind-overlay.sh
    command: scripts/infra/apply-kind-overlay.sh
  - type: automated
    test_type: shell_verification
    file: scripts/infra/setup-k8s-overrides.sh
    command: scripts/infra/setup-k8s-overrides.sh
  - type: automated
    test_type: shell_verification
    file: scripts/infra/verify-k8s-overrides.sh
    command: scripts/infra/verify-k8s-overrides.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-deployment-lanes.sh
    command: scripts/qa/verify-deployment-lanes.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kustomize-no-deprecated-keys.sh
    command: scripts/qa/verify-kustomize-no-deprecated-keys.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kustomize-render.sh
    command: scripts/qa/verify-kustomize-render.sh
  - type: automated
    test_type: shell_verification
