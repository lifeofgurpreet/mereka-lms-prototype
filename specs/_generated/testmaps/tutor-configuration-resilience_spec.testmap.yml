spec: tutor-configuration-resilience_spec.md
acceptance_criteria:
- id: AC-TCR-001
  description: Given a clean checkout of the repository, when the Mereka Tutor plugin
    is installed and enabled, then the plugin loads without errors and `tutor plugins
    list` shows `mereka_lms` as available.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: unit
    file: infrastructure/tutor/plugins/test_plugin.py
    command: pytest infrastructure/tutor/plugins/test_plugin.py
  - type: automated
    test_type: shell_verification
    file: infrastructure/tutor/plugins/verify-plugin.sh
    command: infrastructure/tutor/plugins/verify-plugin.sh
- id: AC-TCR-002
  description: Given the Mereka plugin is enabled, when `tutor config save` is run,
    then the rendered `production.py` contains `academy.biji-biji.com` in `ALLOWED_HOSTS`
    without running `apply-patches.sh`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: shell_verification
    file: infrastructure/tutor/plugins/verify-plugin.sh
    command: infrastructure/tutor/plugins/verify-plugin.sh
- id: AC-TCR-003
  description: 'Given Tutor 21.0.4 renders local MySQL and the canonical patch path
    runs, then the rendered `docker-compose.yml` contains `mysql-native-password=ON`
    and `MYSQL_ROOT_HOST: "%"`.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
- id: AC-TCR-004
  description: Given the Mereka plugin is enabled and `prepare-tutor-build-context.sh
    --target all` is run, when `scripts/qa/verify-tutor-patches.sh` is executed, then
    all high-signal rendered patch markers report PASS.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/verify-tutor-config.sh
    command: scripts/infra/verify-tutor-config.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: shell_verification
    file: tests/tutor/test_verify_patches.sh
    command: tests/tutor/test_verify_patches.sh
- id: AC-TCR-005
  description: Given a developer modifies Tutor authority and attempts to commit,
    when the pre-commit hook runs, then it detects Tutor-scope changes and invokes
    the local verification path when available.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/tutor-config-rollback.sh
    command: scripts/infra/tutor-config-rollback.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-config-safety.sh
    command: scripts/qa/verify-tutor-config-safety.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: shell_verification
    file: tests/tutor/test_pre_commit_hook.sh
    command: tests/tutor/test_pre_commit_hook.sh
- id: AC-TCR-006
  description: Given a pull request that modifies any file under Tutor authority,
    when the CI workflow runs, then it renders Tutor, applies the canonical patch
    path, validates active manifest wiring, and executes rendered patch verification.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
- id: AC-TCR-007
  description: Given `infrastructure/tutor/patch-manifest.yml` is parsed, then every
    active patch entry contains id, module, function, target, target_family, authority_class,
    description, retirement_trigger, and required status.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
- id: AC-TCR-008
  description: Given a rendered Tutor environment is missing a required rendered marker
    checked by `scripts/qa/verify-tutor-patches.sh`, when the verifier is executed,
    then it emits a `[FAIL]` line and exits non-zero.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: shell_verification
    file: tests/tutor/test_verify_patches.sh
    command: tests/tutor/test_verify_patches.sh
- id: AC-TCR-009
  description: Given the `apply-patches.sh` script is run twice consecutively, when
    the rendered templates are compared, then they are byte-identical (idempotency).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-patch-idempotency.sh
    command: scripts/qa/verify-patch-idempotency.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-config-safety.sh
    command: scripts/qa/verify-tutor-config-safety.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: shell_verification
    file: tests/tutor/test_idempotency.sh
    command: tests/tutor/test_idempotency.sh
- id: AC-TCR-010
  description: Given a Tutor version upgrade from 18.x to 21.x, when the CI workflow
    runs on the upgrade PR, then it reports which patches need adaptation and blocks
    merge until all patches pass verification.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: manual
    runbook: docs/ops/runbooks/TUTOR_PLUGIN_MIGRATION_RUNBOOK.md
    section: Tutor Version Upgrade Procedure
    justification: Version upgrades are infrequent events requiring human judgment
      on patch adaptation; CI catches failures but upgrade planning is manual
- id: AC-TCR-011
  description: Given an active patch remains in `patch-manifest.yml`, then it has
    an explicit authority class and retirement trigger.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
- id: AC-TCR-012
  description: Given the `make tutor-apply` command is run, then it executes the canonical
    `tutor-config-save.sh` wrapper, which enables the canonical Tutor plugins, runs
    `tutor config save`, prepares the build context, runs verification, and then restarts
    services -- failing fast on any step.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/tutor-config-rollback.sh
    command: scripts/infra/tutor-config-rollback.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-config-safety.sh
    command: scripts/qa/verify-tutor-config-safety.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-resilience-full.sh
    command: scripts/qa/verify-tutor-resilience-full.sh
  - type: automated
    test_type: shell_verification
    file: tests/tutor/test_tutor_apply.sh
    command: tests/tutor/test_tutor_apply.sh
  - type: manual
    runbook: docs/ops/runbooks/TUTOR_CONFIGURATION_RUNBOOK.md
    section: Full Configuration Apply
    justification: End-to-end make tutor-apply requires Docker Compose stack; CI tests
      individual steps but full pipeline needs Docker environment

