spec: mobile-apps-secrets-management_spec.md
acceptance_criteria:
- id: AC-MAS-001
  description: 'Given the GitHub Actions secrets for `mereka-lms`, when `gh secret
    list` is run, then all 6 iOS secrets exist: `APPLE_TEAM_ID`, `APP_STORE_CONNECT_API_KEY_ID`,
    `APP_STORE_CONNECT_ISSUER_ID`, `APP_STORE_CONNECT_API_KEY_BASE64`, `MATCH_DEPLOY_KEY`,
    `MATCH_PASSWORD`.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-002
  description: Given the iOS CI/CD workflow (`.github/workflows/build-ios-app.yml`),
    when it references secrets, then every `${{ secrets.* }}` reference maps to a
    secret defined in the inventory table in this spec.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-003
  description: 'Given the Android CI/CD secrets are provisioned, when `gh secret list`
    is run, then all 5 Android secrets exist: `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON`,
    `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS`, `ANDROID_KEY_PASSWORD`.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-004
  description: 'Given the Infisical path `/k8s/mereka-lms`, when the mobile push notification
    backend is ready, then the following keys exist with non-empty values: `MEREKA_LMS_MOBILE_FCM_SERVICE_ACCOUNT_JSON`,
    `MEREKA_LMS_MOBILE_APNS_AUTH_KEY_BASE64`, `MEREKA_LMS_MOBILE_APNS_AUTH_KEY_ID`,
    `MEREKA_LMS_MOBILE_FIREBASE_PROJECT_ID`.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-005
  description: Given Infisical contains `MEREKA_LMS_MOBILE_*` keys, when the validation
    script runs with `STRICT=1`, then no key has an empty value, a placeholder value
    (`REPLACE_ME`, `CHANGE_ME`, `TODO`, `TBD`, `placeholder`, `AIzaSyPlaceholder`),
    or trailing CR/LF bytes.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-006
  description: Given all mobile secrets in Infisical, when their key names are inspected,
    then every mobile-specific key starts with `MEREKA_LMS_MOBILE_`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-007
  description: Given the ExternalSecret mapping for mobile secrets, when the `data`
    array is inspected, then each entry maps a `MEREKA_LMS_MOBILE_*` remote key to
    a `MOBILE_*` local K8s secret key.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-008
  description: Given the iOS CI/CD workflow, when a build is triggered on the `main`
    branch, then Fastlane match successfully fetches the Apple Distribution certificate
    and provisioning profile from the `ios-certificates` repo using `MATCH_DEPLOY_KEY`
    and `MATCH_PASSWORD`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-009
  description: Given the iOS CI/CD workflow, when the `build_app` step runs, then
    the built IPA is signed with the correct Apple Distribution certificate for Team
    ID `44F7G2D7U6` and bundle ID `com.mereka.academy.mobile`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-010
  description: Given the iOS CI/CD workflow, when the `upload_to_testflight` step
    runs, then it authenticates via the App Store Connect API using `ASC_KEY_ID`,
    `ASC_ISSUER_ID`, and `ASC_KEY_P8_BASE64` without manual Apple ID login.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-011
  description: Given the mobile push notification backend is deployed, when the LMS
    pod environment is inspected, then the `MOBILE_FCM_SERVICE_ACCOUNT_JSON` environment
    variable contains a valid Firebase service account JSON string.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-012
  description: 'Given the `mobile-secrets` (or `openedx-secrets`) ExternalSecret,
    when its spec is inspected, then `refreshInterval: 1h`, `secretStoreRef.name:
    gcp-secret-manager`, `target.deletionPolicy: Retain`, and `target.creationPolicy:
    Owner` are set.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-013
  description: Given the validation script `scripts/mobile/validate-mobile-secrets.sh`
    exists, when run with `--platform ios`, then it checks all 6 iOS GitHub Actions
    secrets and reports their presence status.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-014
  description: Given the validation script, when run with `--platform android`, then
    it checks all 5 Android GitHub Actions secrets and reports their presence status.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-015
  description: Given the validation script, when run with `--platform all --env prod`,
    then it checks all Infisical `MEREKA_LMS_MOBILE_*` keys at `/k8s/mereka-lms` and
    reports their presence and value status (non-empty, non-placeholder).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-016
  description: Given the validation script, when a required secret is missing, then
    the script exits with a non-zero status code and prints the missing secret name
    to stderr.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-017
  description: Given the validation script, when the Apple Distribution certificate
    expires within 60 days, then the script prints a warning. When it expires within
    30 days, the script exits with a non-zero status code.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-018
  description: Given the Apple Distribution certificate managed by Fastlane match,
    when its expiry date is 2027-01-22, then the validation script correctly parses
    and reports the remaining days until expiry.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-019
  description: 'Given a CI/CD workflow run, when the pre-build certificate check detects
    expiry within 30 days, then the workflow fails with a clear error message: "Apple
    Distribution certificate expires in N days. Rotate before continuing."'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-020
  description: Given the iOS CI/CD workflow output, when inspected after a successful
    build, then no secret values (API keys, passwords, base64 certificate data) appear
    in the workflow logs.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-021
  description: Given a pull request from a forked repository, when it triggers a workflow,
    then GitHub Actions secrets are NOT available to the workflow steps (GitHub default
    behavior, verified by workflow configuration).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-022
  description: Given the Android CI/CD workflow, when the build completes (success
    or failure), then the temporary keystore file is deleted in the cleanup step.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh
- id: AC-MAS-023
  description: Given the iOS app config at `default_config/mereka/prod/shared.yaml`,
    when `OAUTH_CLIENT_ID` is read, then it equals `mereka-mobile-app` and matches
    the OAuth application registered in the LMS.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-024
  description: Given the iOS app config at `default_config/mereka/prod/ios.yaml`,
    when `FIREBASE.PROJECT_ID` is read, then it matches the `MEREKA_LMS_MOBILE_FIREBASE_PROJECT_ID`
    value in Infisical (once Firebase is enabled).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-inventory.sh
    command: scripts/qa/verify-mobile-secrets-inventory.sh
- id: AC-MAS-025
  description: Given a dev/Kind environment, when mobile push notification secrets
    are inspected, then they reference a dev Firebase project (or dev-specific keys),
    not the production Firebase project credentials.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mobile-secrets-runtime.sh
    command: scripts/qa/verify-mobile-secrets-runtime.sh

