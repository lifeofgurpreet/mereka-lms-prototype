spec: branding-system_spec.md
acceptance_criteria:
- id: AC-INT-001
  description: Given `multi-site-domains_spec.md` configures three production domains
    (academyv2.mereka.io, academy.biji-biji.com, skillourfuture.academy.mereka.io),
    when branding assets are deployed, then Mereka logo and custom footer render correctly
    on all three domains with zero Open edX default branding leakage.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-branding-multi-domain.sh
    command: scripts/qa/verify-branding-multi-domain.sh
- id: AC-INT-002
  description: Given multi-site domains are configured, when `scripts/branding/verify-branding-health.sh`
    runs in production, then it passes for all configured domains without domain-specific
    branding regressions.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-branding-multi-domain.sh
    command: scripts/qa/verify-branding-multi-domain.sh
- id: AC-INT-003
  description: Given `tutor-configuration_spec.md` apply-patches workflow syncs theme
    assets, when `tutor images build openedx` completes, then Mereka logo variants
    exist in compiled static files and `grep -r "fonts.googleapis.com" tutor_env/env/build/openedx/`
    returns zero results.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-branding-asset-sync.sh
    command: scripts/qa/verify-branding-asset-sync.sh
- id: AC-001
  description: Mereka logo visible on LMS homepage
