  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-all-acs.sh
    command: scripts/qa/verify-enterprise-all-acs.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-license-management.sh
    command: scripts/qa/verify-enterprise-license-management.sh
