spec: enterprise-microservices_spec.md
acceptance_criteria:
- id: AC-001
  description: Given the K8s manifests are applied, when `kubectl get deployments -n mereka-lms -l app.kubernetes.io/component=enterprise`
    is run, then deployments for enterprise-catalog, license-manager, enterprise-access, and enterprise-subsidy are listed
    and each deployment has `READY == DESIRED` (steady-state full readiness)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-all-acs.sh
    command: scripts/qa/verify-enterprise-all-acs.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-deployment.sh
    command: scripts/qa/verify-enterprise-deployment.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-readiness-integrity.sh
    command: scripts/qa/verify-enterprise-readiness-integrity.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-service-deployment.sh
    command: scripts/qa/verify-enterprise-service-deployment.sh
- id: AC-002
  description: Given all enterprise services are deployed, when `kubectl get endpoints -n mereka-lms` is run, then each enterprise
    service has non-empty endpoints
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-all-acs.sh
    command: scripts/qa/verify-enterprise-all-acs.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-deployment.sh
    command: scripts/qa/verify-enterprise-deployment.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-service-deployment.sh
    command: scripts/qa/verify-enterprise-service-deployment.sh
- id: AC-003
  description: 'Given the enterprise-catalog service is running, when `curl http://enterprise-catalog:8160/health/` is called
    from within the cluster, then the response is HTTP 200 with `{"status": "ok"}`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-all-acs.sh
    command: scripts/qa/verify-enterprise-all-acs.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-deployment.sh
    command: scripts/qa/verify-enterprise-deployment.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-readiness-integrity.sh
    command: scripts/qa/verify-enterprise-readiness-integrity.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enterprise-service-deployment.sh
    command: scripts/qa/verify-enterprise-service-deployment.sh
