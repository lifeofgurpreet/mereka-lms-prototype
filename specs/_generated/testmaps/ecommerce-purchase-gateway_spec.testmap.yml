spec: ecommerce-purchase-gateway_spec.md
acceptance_criteria:
- id: AC-001
  description: Given a valid offering UUID and buyer email, when `POST /api/v1/checkout/`
    is called, then a Stripe Checkout Session is created and the response includes
    a `checkout_url` that redirects to Stripe
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-purchase-gateway-scaffold.sh
    command: scripts/qa/verify-purchase-gateway-scaffold.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-purchase-gateway.sh
    command: scripts/qa/verify-purchase-gateway.sh
  - type: automated
    test_type: automated
    file: services/purchase-gateway/app/routers/checkout.py
    command: pytest services/purchase-gateway/app/routers/checkout.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/integration/test_checkout_flow.py
    command: pytest services/purchase-gateway/tests/integration/test_checkout_flow.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
- id: AC-002
  description: Given a buyer with an existing LMS account completes Stripe Checkout,
    when the `checkout.session.completed` webhook fires, then the buyer is enrolled
    in the course within 30 seconds
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-purchase-gateway.sh
    command: scripts/qa/verify-purchase-gateway.sh
  - type: automated
    test_type: automated
    file: services/purchase-gateway/app/services/fulfillment.py
    command: pytest services/purchase-gateway/app/services/fulfillment.py
  - type: automated
    test_type: automated
    file: services/purchase-gateway/app/services/lms_client.py
    command: pytest services/purchase-gateway/app/services/lms_client.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_lms_client.py
    command: pytest services/purchase-gateway/tests/unit/test_lms_client.py
- id: AC-003
  description: Given a buyer without an LMS account completes Stripe Checkout, when
    the `checkout.session.completed` webhook fires, then an entitlement is created
    and an invitation email is sent to the buyer
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-purchase-gateway.sh
    command: scripts/qa/verify-purchase-gateway.sh
  - type: automated
    test_type: automated
    file: services/purchase-gateway/app/services/fulfillment.py
    command: pytest services/purchase-gateway/app/services/fulfillment.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-004
  description: Given an expired Stripe Checkout Session, when the `checkout.session.expired`
    webhook fires, then the order status transitions to `expired` and no fulfillment
    occurs
  verify:
