    command: scripts/qa/verify-purchase-gateway-stripe.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-purchase-gateway.sh
    command: scripts/qa/verify-purchase-gateway.sh
  - type: automated
    test_type: automated
    file: services/purchase-gateway/app/routers/webhooks.py
    command: pytest services/purchase-gateway/app/routers/webhooks.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/integration/test_webhook_processing.py
    command: pytest services/purchase-gateway/tests/integration/test_webhook_processing.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_stripe_service.py
    command: pytest services/purchase-gateway/tests/unit/test_stripe_service.py
