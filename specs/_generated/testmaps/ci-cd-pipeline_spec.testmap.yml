spec: ci-cd-pipeline_spec.md
acceptance_criteria:
- id: AC-INT-001
  description: Given K8s manifests pass `validate-k8s.sh`, when CI builds and pushes
    images to Artifact Registry, then production Kustomize overlay references the
    new image tags and `kubectl apply` succeeds without resource validation errors.
  verify:
  - type: manual
    runbook: docs/ops/runbooks/CI_CD_RUNBOOK.md
    section: Integration Tests
    justification: Requires live CI pipeline run with new image build; validated each
      release via release-openedx-gitops.sh dry-run + ArgoCD sync
- id: AC-INT-002
  description: Given K8s Deployments require specific ExternalSecrets, when CI deployment
    workflow runs, then it verifies ExternalSecrets reach `SecretSynced` before declaring
    deployment success.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-migration-init-contract.sh
    command: scripts/qa/verify-migration-init-contract.sh
  - type: manual
    runbook: docs/ops/runbooks/CI_CD_RUNBOOK.md
    section: Integration Tests
    justification: ExternalSecret sync gate not yet implemented in CI pipeline; operator
      manually confirms kubectl get externalsecrets -n mereka-lms shows READY=True
- id: AC-INT-003
  description: Given `secrets-management_spec.md` defines required secret keys, when
    CI runs secret validation (`infisical-validate-mereka-lms.sh`), then it fails
    the build if any required `MEREKA_LMS_*` key is missing or contains placeholder
    values in the target environment.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-infisical-env-validation-coverage.sh
    command: scripts/qa/verify-infisical-env-validation-coverage.sh
  - type: manual
    runbook: docs/ops/runbooks/CI_CD_RUNBOOK.md
    section: Secrets Validation
    justification: infisical-validate CI step not yet wired into GitHub Actions workflow;
      runs manually pre-deploy
- id: AC-INT-004
  description: Given branding assets are synced via `apply-patches.sh`, when CI builds
    openedx image, then `branding-preflight.sh` passes and verifies Mereka logo presence
    and Google Fonts absence in compiled artifacts.
  verify:
  - type: manual
    runbook: docs/ops/runbooks/CI_CD_RUNBOOK.md
    section: Branding Preflight Verification
    justification: Requires active GitHub Actions runner building the full openedx
      Docker image; cannot run image build in CI without Docker-in-Docker
    file: scripts/branding/run-branding-gates.sh
- id: AC-001
  description: Given a PR is opened against `main`, when CI runs, then all 12 CI jobs
    execute and their pass/fail status is reported as GitHub commit status checks.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-ci-cd-pipeline.sh
    command: scripts/qa/verify-ci-cd-pipeline.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
  - type: manual
    runbook: docs/ops/runbooks/CI_CD_RUNBOOK.md
    section: Quality Gates Verification
    justification: Requires active GitHub Actions runner with repository secrets;
      workflow dispatch cannot be fully automated in isolated test environment
    file: N/A
- id: AC-002
  description: Given the `spec-lint` job runs, when specs in `specs/` have structural
    issues (missing frontmatter, missing required sections), then the job fails with
    specific error messages identifying the non-conforming spec.
  verify:
  - type: automated
    test_type: automated
    file: scripts/qa/spec-tools/mereka_spec_lint.py
    command: pytest scripts/qa/spec-tools/mereka_spec_lint.py
  - type: automated
    test_type: automated
    file: scripts/qa/spec-tools/spec_coverage_dashboard.py
    command: pytest scripts/qa/spec-tools/spec_coverage_dashboard.py
  - type: automated
    test_type: automated
    file: scripts/qa/spec-tools/spec_fix.py
    command: pytest scripts/qa/spec-tools/spec_fix.py
  - type: automated
    test_type: unit
    file: scripts/qa/spec-tools/validate_testmap_format.py
    command: pytest scripts/qa/spec-tools/validate_testmap_format.py
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-003
  description: Given the `lint` job runs, when Python files in `scripts/` or `services/`
    have ruff violations, then the job fails.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/shared/ci-skip-guards.sh
    command: scripts/shared/ci-skip-guards.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
  - type: manual
    runbook: docs/ops/runbooks/CI_CD_RUNBOOK.md
    section: Quality Gates Verification
    justification: Ruff lint gate is verified by running the CI workflow; individual
      Python files can be checked locally with ruff check scripts/ services/
    file: N/A
- id: AC-004
  description: Given the `validate-k8s` job runs, when any YAML in `deploy/k8s/` is
    not a valid Kubernetes manifest, then kubeconform fails the job.
  verify:
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
