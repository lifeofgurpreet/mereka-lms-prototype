# branding-system_testmap.yaml
# Machine-readable mapping of spec acceptance criteria to verification methods.
# Source Spec: specs/branding-system_spec.md

spec: "specs/branding-system_spec.md"
acceptance_criteria:
  - id: "AC-001"
    description: "Mereka logo visible on LMS homepage"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_homepage_brand_logo function confirms themed logo path returns HTTP 200 with >2KB body"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-logo-setup.sh"
        command: "scripts/branding/verify-logo-setup.sh"
        notes: "Verifies source logos exist in assets/branding/ and all theme directories"

  - id: "AC-002"
    description: "Mereka logo visible on Studio homepage"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_studio_brand_css function confirms Studio serves themed CSS with brand selectors"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-health.sh"
        command: "scripts/branding/verify-branding-health.sh"
        notes: "Section 3 verifies CMS theme SCSS imports shared tokens"

  - id: "AC-003"
    description: "Custom Mereka footer renders on all MFEs (authn, account, profile, learning)"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_mfe_authn_surface verifies authn MFE has branding markers in compiled CSS"
      - type: "manual"
        runbook: "docs/BRANDING_VERIFICATION_CHECKLIST.md"
        section: "MFE Footer Verification"
        justification: "Account, profile, and learning MFE surfaces require interactive navigation to verify footer rendering; no headless script covers all four surfaces currently"

  - id: "AC-004"
    description: "Favicon loads correctly (mereka icon, not Open edX default)"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_any_follow_200 for favicon.ico confirmsHTTP 200"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-health.sh"
        command: "scripts/branding/verify-branding-health.sh"
        notes: "Section 4 checks favicon.ico exists in assets/branding/"

  - id: "AC-005"
    description: "Custom fonts load without Google Fonts fallback"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_homepage_brand_fonts + check_css_fontsverify Poppins/Lato @font-face with local .woff2 references"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-health.sh"
        command: "scripts/branding/verify-branding-health.sh"
        notes: "Section 2 checks all 9 required font files across common, lms, cms, mfe directories"

  - id: "AC-006"
    description: "grep fonts.googleapis.com in compiled CSS returns 0 results"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-health.sh"
        command: "scripts/branding/verify-branding-health.sh"
        notes: "Source-level Google Fonts absence verified via SCSS checks"
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_studio_brand_css explicitly checks forfonts.googleapis.com in live Studio CSS"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-studio-authoring-branding.sh"
        command: "STRICT_NO_GOOGLE_FONTS=1 scripts/qa/verify-studio-authoring-branding.sh prod"
        notes: "Strict mode fails if any Google Fonts importsfound in Studio authoring CSS"

  - id: "AC-007"
    description: "scripts/branding/verify-branding-health.shexits 0"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-health.sh"
        command: "scripts/branding/verify-branding-health.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/run-branding-gates.sh"
        command: "BRANDING_LEVEL=deep scripts/branding/run-branding-gates.sh prod"
        notes: "Full gate suite includes verify-branding-health.sh as source gate"

  - id: "AC-008"
    description: "Theme applies consistently across all domains (academyv2.mereka.io, academy.biji-biji.com)"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "Checks primary domain and iterates EXTRA_HOSTS (academy.biji-biji.com) for logo, fonts, and branding signals"

  - id: "AC-009"
    description: "Studio preview shows Mereka branding"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-studio-authoring-branding.sh"
        command: "scripts/qa/verify-studio-authoring-branding.sh prod"
        notes: "Checks Studio authoring surfaces for brandedCSS selectors and theme presence"
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_studio_brand_css confirms create-course, outline, xblock selectors in Studio CSS"

  - id: "AC-010"
    description: "Login page shows Mereka branding (not default Open edX)"
    verify:
      - type: "automated"
        test_type: "smoke_test"
        file: "scripts/qa/verify-public-branding.sh"
        command: "scripts/qa/verify-public-branding.sh prod"
        notes: "check_mfe_authn_surface verifies authn shell,Mereka gradient/font markers in compiled CSS, and MFE configbranding fields"
      - type: "manual"
        runbook: "docs/BRANDING_VERIFICATION_CHECKLIST.md"
        section: "Login Page Visual Verification"
        justification: "Visual confirmation that gradient, logo placement, and font rendering match brand guidelines requires human judgment"
