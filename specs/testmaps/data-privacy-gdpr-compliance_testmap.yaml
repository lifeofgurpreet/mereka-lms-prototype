  - criterion: "Edge Case: User registered before consent system deployed"
    test_file: tests/integration/test_consent_backfill.py
    test_name: "test_consent_prompt_for_pre_consent_users"
    type: integration

  - criterion: "Edge Case: Enterprise user with conflicting consent and DPA"
    test_file: tests/integration/test_consent_dpa_conflict.py
    test_name: "test_dpa_contract_basis_overrides_consent"
