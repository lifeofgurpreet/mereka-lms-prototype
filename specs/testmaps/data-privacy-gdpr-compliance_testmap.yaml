# Testmap for Disaster Recovery & Business Continuity Spec
# Spec: specs/disaster-recovery-business-continuity_spec.md
# Generated: 2026-02-10

spec: "specs/disaster-recovery-business-continuity_spec.md"

acceptance_criteria:
  # Backup Infrastructure
  - id: "AC-001"
    criterion: "Given production is running, when ./scripts/qa/audit-velero.sh --json executes, then it reports all threeschedules (hourly-critical, daily-all-apps, weekly-full) as active with recent Completed backups"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "./scripts/qa/audit-velero.sh --json | jq '.checks.failures' # must be 0"
      - type: "automated"
        test_type: "unit"
        file: "tests/qa/test_audit_velero.py"
        command: "pytest tests/qa/test_audit_velero.py -k test_backup_schedule_validation"

  - id: "AC-002"
    criterion: "Given the hourly-critical schedule runs, whenthe backup completes, then volumeSnapshotsCompleted equals the number of Bound PVCs reported by ./scripts/qa/list-critical-backup-pvcs.sh"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "./scripts/qa/audit-velero.sh --json | jq '.velero.schedules[] | select(.name | contains(\"hourly-critical\")) | .latest_completed_backup.volume_snapshots_completed'"
      - type: "automated"
        test_type: "unit"
        file: "tests/qa/test_audit_velero.py"
        command: "pytest tests/qa/test_audit_velero.py -k test_snapshot_count_vs_bound_pvc"

  - id: "AC-003"
    criterion: "Given a Velero backup exists, when BackupStorageLocation is queried, then its phase is Available"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "kubectl -n velero get backupstoragelocation-o json | jq -r '.items[].status.phase' # must be Available"
      - type: "automated"
        test_type: "unit"
        file: "tests/qa/test_audit_velero.py"
        command: "pytest tests/qa/test_audit_velero.py -k test_bsl_phase_available"

  - id: "AC-004"
    criterion: "Given production namespaces, when all Deployments/StatefulSets are inspected, then no critical stateful service uses emptyDir for persistent data"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "./scripts/qa/audit-velero.sh --json | jq '.app_data_risks[] | select(.severity == \"critical\" and (.risk | contains(\"emptyDir\")))' # must be empty"
      - type: "automated"
        test_type: "unit"
        file: "tests/qa/test_audit_velero.py"
        command: "pytest tests/qa/test_audit_velero.py -k test_emptydir_detection"

  # Restore Drills
  - id: "AC-005"
    criterion: "Given the monthly restore-test CronJob runs,when it completes, then a throwaway namespace is created, PVCs are restored to Bound state, and a MySQL SELECT 1 probe succeeds"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "infrastructure/k8s/velero/restore-test-script.sh"
        command: "./infrastructure/k8s/velero/restore-test-script.sh"
      - type: "automated"
        test_type: "integration"
        file: "tests/qa/test_restore_drill.sh"
        command: "./tests/qa/test_restore_drill.sh"

  - id: "AC-006"
    criterion: "Given a restore drill completes, when the throwaway namespace is inspected, then at least 1 PVC is in Bound state matching the source backup"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "tests/qa/test_restore_drill.sh"
        command: "./tests/qa/test_restore_drill.sh # verifiesPVC Bound count"

  - id: "AC-007"
    criterion: "Given a restore drill, when ./scripts/infra/fix-velero-restore-test.sh executes, then the drill passes end-to-end including PV validation and MySQL probe"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/infra/fix-velero-restore-test.sh"
        command: "./scripts/infra/fix-velero-restore-test.sh"

  - id: "AC-008"
    criterion: "Given the backup-verification CronJob, when it runs daily, then it confirms backup freshness within the last 2 hours for hourly schedule and 26 hours for daily schedule"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "tests/qa/test_backup_verification.sh"
        command: "./tests/qa/test_backup_verification.sh"
      - type: "monitoring"
        metric: "backup-verification CronJob lastSuccessfulTime"
        dashboard: "grafana://dashboards/dr-health"

  # DR Evidence
  - id: "AC-009"
    criterion: "Given the DR evidence bundle workflow runs, when STRICT_RUNTIME=1 ./scripts/qa/build-dr-evidence-bundle.sh--tar executes, then it produces a tarball containing audit-velero.json, audit-velero-alert-pipeline.json, audit-observability-runtime.json, restore-test logs, and PVC summary"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/build-dr-evidence-bundle.sh"
        command: "STRICT_RUNTIME=1 ./scripts/qa/build-dr-evidence-bundle.sh --tar"
      - type: "automated"
        test_type: "integration"
        file: "tests/qa/test_dr_evidence_bundle.sh"
        command: "./tests/qa/test_dr_evidence_bundle.sh"

  - id: "AC-010"
    criterion: "Given GitHub Actions DR Evidence Bundle workflow, when it runs monthly (1st of month at 02:30 UTC), then artifacts are uploaded with 120-day retention"
    verify:
      - type: "automated"
        test_type: "e2e"
        file: ".github/workflows/dr-evidence-bundle.yml"
        command: "gh workflow run dr-evidence-bundle.yml --ref main # manual trigger"
      - type: "monitoring"
        metric: "github_workflow_run_status"
        dashboard: "github://actions?workflow=dr-evidence-bundle"

  - id: "AC-011"
    criterion: "Given an enterprise audit request, when DR evidence is requested, then a complete evidence bundle can be generated within 1 business day"
    verify:
      - type: "manual"
        runbook: "docs/operations/DR_COMPLIANCE_REPORT_TEMPLATE.md"
        section: "Evidence Bundle Generation Procedure"
        justification: "Enterprise audit is infrequent; manual generation with script ensures latest data"

  # Alert Pipeline
  - id: "AC-012"
    criterion: "Given Velero backup fails, when the failure is detected, then an alert fires within 1 hour"
    verify:
      - type: "monitoring"
        metric: "velero_backup_failure_total"
        dashboard: "grafana://dashboards/dr-health"
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-alert-routing.sh"
        command: "./scripts/qa/verify-alert-routing.sh --alert VeleroBackupFailed"

  - id: "AC-013"
    criterion: "Given restore-test has not succeeded in 45+ days, when STRICT_RUNTIME=1 ./scripts/qa/audit-velero-alert-pipeline.sh runs, then it reports a stale-restore-test failure"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero-alert-pipeline.sh"
        command: "STRICT_RUNTIME=1 ./scripts/qa/audit-velero-alert-pipeline.sh --json | jq '.checks.failures' # must detect stale restore-test"

  - id: "AC-014"
    criterion: "Given ./scripts/qa/audit-velero-alert-pipeline.sh runs, then it validates both backup-verification and restore-test freshness signals"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero-alert-pipeline.sh"
        command: "./scripts/qa/audit-velero-alert-pipeline.sh--json"

  # Recovery Procedures
  - id: "AC-015"
    criterion: "Given a single PVC failure (DR-002), when thedocumented restore procedure is followed, then the PVC is restored from the latest hourly backup within 30 minutes"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "Recovery (Production Incident) > Recover PVs"
        justification: "Production PVC failure is rare; documented runbook with time tracking"

  - id: "AC-016"
    criterion: "Given a full namespace loss (DR-003), when velero restore create is executed with --namespace-mappings, then all resources including PVCs are restored within 1 hour"
    verify:
      - type: "automated"
        test_type: "e2e"
        file: "tests/e2e/test_full_restore.sh"
        command: "./tests/e2e/test_full_restore.sh # measurestime to completion"

  - id: "AC-017"
    criterion: "Given a secret compromise (DR-006), when thesecret rotation checklist is followed, then all affected secrets are rotated in Infisical, synced to GCP SM, and pods restarted within 1 hour"
    verify:
      - type: "manual"
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Full Rotation Procedure"
        justification: "Secret compromise is rare; manual checklist with time tracking"

  - id: "AC-018"
    criterion: "Given complete cluster loss (DR-007), when the cluster rebuild procedure is followed, then platform availability is restored within 4 hours with data loss not exceeding 1 hour (Tier 1 RPO)"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "Recovery (Production Incident) > Full Cluster Rebuild"
        justification: "Full cluster loss is catastrophic; tabletop exercise with time tracking"

  # Data Integrity
  - id: "AC-019"
    criterion: "Given a restore completes, when kubectl execmysql-pod -- mysql -e \"SELECT COUNT(*) FROM openedx.auth_user\" is run, then the count is within 5% of the pre-incident count"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "tests/qa/test_restore_drill.sh"
        command: "./tests/qa/test_restore_drill.sh # includesMySQL row count check"

  - id: "AC-020"
    criterion: "Given a restore completes, when ./scripts/qa/public-health-check.sh prod runs, then LMS homepage, Studio login, Discovery, and Ecommerce health endpoints all return 200/302"
    verify:
      - type: "automated"
        test_type: "e2e"
        file: "scripts/qa/public-health-check.sh"
        command: "./scripts/qa/public-health-check.sh prod"

  # Cross-Region Readiness
  - id: "AC-021"
    criterion: "Given Terraform/Kustomize configs exist, whenkubectl kustomize deploy/k8s/overlays/production is run, then it produces valid manifests deployable to any GKE cluster"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "deploy/k8s/overlays/production/kustomization.yaml"
        command: "kubectl kustomize deploy/k8s/overlays/production | kubectl apply --dry-run=client -f -"

  - id: "AC-022"
    criterion: "Given Velero backups are stored in GCS, whenthe backup bucket is inspected, then it is configured for multi-region storage or cross-region replication"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "infrastructure/gcs/backup-bucket.tf"
        command: "gsutil ls -L gs://BUCKET_NAME | grep -E 'Storage class|Location constraint' # must show multi-region"

