# Testmap: badges-credentials-enterprise_spec.md
# Maps every Acceptance Criterion to its verification method.
# Generated: 2026-02-10

spec: badges-credentials-enterprise_spec.md
plan: plans/badges-credentials-enterprise_plan.md
testplan: plans/badges-credentials-enterprise_testplan.md
tier: 5

acceptance_criteria:
  # --- Badgr Server Deployment ---
  - id: AC-001
    description: "Badgr Server deployment exists with READY replicas >= 1"
    test_type: kubectl_check
    test_file: "scripts/qa/verify-badgr-server-deployment.sh"
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-badgr-server-deployment.sh"
        command: "kubectl get deployment badgr-server -n mereka-lms -o jsonpath='{.status.readyReplicas}'"
    automated: true
    priority: P1

  - id: AC-002
    description: "Badgr Server internal health check returns HTTP 200"
    test_type: smoke_test
    test_file: "scripts/qa/verify-badgr-server-deployment.sh"
    verify:
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-badgr-server-deployment.sh"
        command: "kubectl exec -n mereka-lms deploy/lms -- curl -sf http://badgr-server:8000/health/"
    automated: true
    priority: P1

  - id: AC-003
    description: "Badgr Server external health check at badges.academyv2.mereka.io returns HTTP 200"
    test_type: smoke_test
    test_file: "scripts/qa/verify-badgr-server-deployment.sh"
    verify:
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-badgr-server-deployment.sh"
        command: "curl -sf https://badges.academyv2.mereka.io/health/"
    automated: true
    priority: P1

  - id: AC-004
    description: "Badgr worker deployment exists with READY replicas >= 1"
    test_type: kubectl_check
    test_file: "scripts/qa/verify-badgr-server-deployment.sh"
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-badgr-server-deployment.sh"
        command: "kubectl get deployment badgr-worker -n mereka-lms -o jsonpath='{.status.readyReplicas}'"
    automated: true
    priority: P1

