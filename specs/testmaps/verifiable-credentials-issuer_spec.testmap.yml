spec: verifiable-credentials-issuer_spec.md
acceptance_criteria:
- id: AC-CRED-010
  description: 'Given the Credentials Service, when `https://credentials.academyv2.mereka.io/.well-known/did.json`
    is requested, then a valid DID Document is returned with `id: "did:web:credentials.academyv2.mereka.io"`'
  verify: []
- id: AC-CRED-011
  description: Given a signing key is configured, when a VC is issued, then the `proof`
    object contains `type`, `created`, `verificationMethod` (referencing the DID Document),
    and `proofValue`
  verify: []
- id: AC-CRED-012
  description: Given the signing private key is stored in Infisical, when ExternalSecrets
    syncs, then `credential-signing-keys` K8s Secret exists in `mereka-lms` namespace
  verify: []
- id: AC-CRED-013
  description: Given a key rotation is performed, when the DID Document is fetched,
    then it contains both old and new public keys as `verificationMethod` entries
  verify: []
- id: AC-CRED-014
  description: Given a VC signed with an old key, when a verifier resolves the `verificationMethod`
    from the DID Document, then the old public key is present and verification succeeds
  verify: []
- id: AC-CRED-015
  description: Given a VC is issued in v1, when the VC JSON is inspected, then no
    `credentialStatus` field is present
  verify: []
_unmapped:
