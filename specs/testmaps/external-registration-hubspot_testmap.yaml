# external-registration-hubspot_testmap.yaml
# Machine-readable mapping of spec acceptance criteria to verification methods.
# Used by spec_verify.py for automated traceability checking.

spec: external-registration-hubspot_spec.md
plan: plans/external-registration-hubspot_plan.md
testplan: plans/external-registration-hubspot_testplan.md
tier: 2

acceptance_criteria:
  - id: AC-HUB-001
    description: "Valid HubSpot webhook POST with correct signature returns 200 OK within 2 seconds"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_webhook_receiver.js"
        test_case: "should return 200 OK within 2 seconds for valid webhook with correct signature"

  - id: AC-HUB-002
    description: "HubSpot webhook with invalid signature returns 401 Unauthorized and logs failure"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_signature.js"
        test_case: "should reject invalid signature with constant-time comparison"
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_webhook_receiver.js"
        test_case: "should return 401 Unauthorized for invalid signature and log failure"

  - id: AC-HUB-003
    description: "Webhook from unknown form GUID returns 400 Bad Request and logs unknown form"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_webhook_receiver.js"
        test_case: "should return 400 Bad Request for unknown form GUID and log form ID"

  - id: AC-HUB-004
    description: "Feature flag HUBSPOT_REGISTRATION_ENABLED=false returns 503 Service Unavailable"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_feature_flag.js"
        test_case: "should return 503 Service Unavailable when feature flag disabled"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/smoke-test-hubspot-registration.sh"
        command: "curl -X POST http://localhost:3000/api/hubspot/webhook/registration (feature flag disabled) -> 503"

  - id: AC-HUB-005
    description: "Contact profile fetch uses OAuth access token and retries 3 times on 5xx errors"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_hubspot_contacts.js"
        test_case: "should retry HubSpot API call 3 times on 5xx errors with exponential backoff"
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_hubspot_integration.js"
        test_case: "should fetch contact profile using OAuth token and retry on 5xx"

  - id: AC-HUB-006
    description: "Expired OAuth access token refreshed automatically and request retried"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_hubspot_oauth.js"
        test_case: "should refresh expired OAuth token and retry contact profile fetch"

  - id: AC-HUB-007
    description: "Multi-select HubSpot fields (semicolon delimited) parsed into arrays"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_field_parsing.js"
        test_case: "should parse semicolon-delimited multi-select fields into arrays"

  - id: AC-HUB-008
    description: "User creation checks if user exists by calling GET /api/user/v1/accounts?email={email} before creating"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_user_creation.js"
        test_case: "should call GET /api/user/v1/accounts?email={email} before user creation"

  - id: AC-HUB-009
    description: "Duplicate email skips user creation, logs warning with email hash, still sends welcome email"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_user_creation.js"
        test_case: "should skip user creation for duplicate email, log warning, and still send welcome email"

  - id: AC-HUB-010
    description: "Username generated with unique format {email_prefix}_{random_4_digit}"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_username_generation.js"
        test_case: "should generate username with format {email_prefix}_{random_4_digit}"

  - id: AC-HUB-011
    description: "Profile enrichment calls PATCH /api/user/v1/accounts/{username} with extended profile including hubspot_contact_id"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_profile_enrichment.js"
        test_case: "should call PATCH /api/user/v1/accounts/{username} with extended profile including hubspot_contact_id"

  - id: AC-HUB-012
    description: "Welcome email uses correct SendGrid template based on form GUID language"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_email_delivery.js"
        test_case: "should select correct SendGrid template ID based on form GUID language"

  - id: AC-HUB-013
    description: "Welcome email includes generated password in plaintext (sent once, never stored)"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_email_delivery.js"
        test_case: "should include plaintext password in welcome email dynamic data"

  - id: AC-HUB-014
    description: "Reminder email scheduled in Redis with encrypted password (AES-256-GCM), scheduled for 7 days later"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_reminder_scheduler.js"
        test_case: "should enqueue reminder job with AES-256-GCM encrypted password and 7-day schedule"

  - id: AC-HUB-015
    description: "7-day reminder job processed: sends email with correct language template, marks job completed"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_reminder_processor.js"
        test_case: "should process due reminder job, send email with correct template, and mark completed"

  - id: AC-HUB-016
    description: "Same email submitted twice within 24 hours results in only one user creation (deduplication via Redis)"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_idempotency.js"
        test_case: "should deduplicate webhooks by email hash within 24 hours"

  - id: AC-HUB-017
    description: "Deduplication key exists in Redis returns 200 OK immediately without processing"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_idempotency.js"
        test_case: "should return 200 OK immediately if deduplication key exists"

  - id: AC-HUB-018
    description: "User creation fails after 3 retries enqueues webhook to DLQ with full context"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_dlq.js"
        test_case: "should enqueue failed webhook to DLQ after 3 retries with full context"

  - id: AC-HUB-019
    description: "DLQ entry fails 3 retries sends error notification email to ops@mereka.dev"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_dlq.js"
        test_case: "should send error notification email after DLQ entry exhausts 3 retries"

  - id: AC-HUB-020
    description: "Admin API replays DLQ entry successfully and marks entry completed"
    priority: P2
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_dlq_replay.js"
        test_case: "should replay DLQ entry via POST /api/admin/v1/dlq/replay/{id} and mark completed"

  - id: AC-HUB-021
    description: "Signature verification failure logs metadata only (timestamp, source IP hash), not full request body"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_sanitize.js"
        test_case: "should sanitize signature verification failure logs to exclude request body"
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_webhook_receiver.js"
        test_case: "should log signature failure with email_hash and source IP hash, not plaintext email"

  - id: AC-HUB-022
    description: "Logs never contain plaintext passwords, API keys, or full email addresses (use email hash)"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_sanitize.js"
        test_case: "should hash email addresses with SHA-256 before logging"
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_logging.js"
        test_case: "should never log plaintext passwords, API keys, or full email addresses"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-hubspot-registration.sh"
        command: "kubectl logs -n mereka-lms -l app=hubspot-registration-service | rg -i '(password|api_key|secret)' (should find none)"

  - id: AC-HUB-023
    description: "Container runs as UID 1000 (non-root), filesystem read-only except /tmp"
    priority: P1
    verify:
      - type: manual
        runbook: "specs/plans/external-registration-hubspot_testplan.md"
        section: "Phase 5: Manual Verification > AC-HUB-023: Container security"
        justification: "Requires live K8s pod inspection with kubectl exec"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-hubspot-registration.sh"
        command: "kubectl exec into pod, verify UID 1000 and read-only filesystem"

  - id: AC-HUB-024
    description: "/metrics endpoint returns all Prometheus metrics (10 metrics with correct labels)"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_metrics.js"
        test_case: "should expose all 10 Prometheus metrics with correct labels"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/smoke-test-hubspot-registration.sh"
        command: "curl http://localhost:3000/metrics | grep hubspot_webhook_requests_total"

  - id: AC-HUB-025
    description: "Webhook processing emits structured JSON log with timestamp, level, contact_id, email_hash, duration_ms"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_logging.js"
        test_case: "should emit structured JSON log with all required fields"

  - id: AC-HUB-026
    description: "User creation success rate drops below 95% over 15 min fires critical alert to #ops-alerts"
    priority: P2
    verify:
      - type: manual
        runbook: "specs/plans/external-registration-hubspot_testplan.md"
        section: "Phase 5: Manual Verification > AC-HUB-026: Alert firing"
        justification: "Requires Prometheus + Alertmanager deployed; simulate failure by disabling Open edX API"

edge_cases:
  - id: EC-1
    description: "Duplicate Username Collision: Generated username collides with existing user (409 Conflict) -> retry with new suffix up to 3 times"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_username_collision.js"
        test_case: "should retry username generation on 409 Conflict up to 3 times with new suffix"

  - id: EC-2
    description: "HubSpot Form Field Schema Changes: HubSpot adds/removes field -> handle missing fields with defaults, ignore unknown fields"
    priority: P2
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_field_parsing.js"
        test_case: "should handle missing optional fields with defaults and ignore unknown fields"
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_hubspot_integration.js"
        test_case: "should handle contact profile with missing or extra fields gracefully"

  - id: EC-3
    description: "SendGrid Template Deprecation: Template ID returns 404 -> enqueue to DLQ, send error notification"
    priority: P2
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_email_delivery_failure.js"
        test_case: "should enqueue to DLQ and send error notification when SendGrid template returns 404"

  - id: EC-4
    description: "Redis Unavailability: Redis connection timeout -> degrade gracefully (skip deduplication, skip reminder scheduling), log error, emit metric"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_redis_failure.js"
        test_case: "should degrade gracefully when Redis unavailable: user creation succeeds, deduplication skipped, error logged"

  - id: EC-5
    description: "Open edX API Rate Limiting: 429 Too Many Requests with Retry-After -> back off exponentially, retry up to 3 times"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_rate_limiting.js"
        test_case: "should respect Retry-After header and back off exponentially on 429 Too Many Requests"

  - id: EC-6
    description: "HubSpot Webhook Replay After 24 Hours: HubSpot stops retrying -> ops manually exports contacts and replays via admin API"
    priority: P3
    verify:
      - type: manual
        runbook: "docs/runbooks/external-registration-runbook.md"
        section: "Manual Webhook Replay After 24 Hours"
        justification: "Disaster recovery scenario; requires manual operator intervention and CSV export from HubSpot"

  - id: EC-7
    description: "Multi-Language Template Missing: Form in language without template (e.g., Thai) -> fall back to English template, log warning"
    priority: P2
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_email_fallback.js"
        test_case: "should fall back to English template when form language template missing"

  - id: EC-8
    description: "Password Generation Weak Randomness: crypto.randomBytes() fails (rare) -> retry 3 times, enqueue to DLQ if all fail, never fall back to Math.random()"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_password_generator.js"
        test_case: "should retry password generation 3 times on crypto failure and never fall back to Math.random()"

  - id: EC-9
    description: "Consent Field Not 'true': HubSpot contact consent missing or not 'true' -> reject webhook with 400 Bad Request, log rejection reason"
    priority: P1
    verify:
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_consent_validation.js"
        test_case: "should reject webhook with 400 Bad Request when consent field not 'true'"

  - id: EC-10
    description: "Signature Timestamp Replay Attack: Webhook signature older than 5 minutes -> reject with 401 Unauthorized"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_signature.js"
        test_case: "should reject signature with timestamp older than 5 minutes"
      - type: automated
        test_type: integration
        file: "services/hubspot-registration/tests/integration/test_webhook_receiver.js"
        test_case: "should return 401 Unauthorized for replay attack with old timestamp"

  - id: EC-11
    description: "Concurrent Secret Updates: No automated test; covered by rotation checklist coordination"
    priority: P3
    verify:
      - type: manual
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Coordination During Concurrent Rotations"
        justification: "Operational coordination; requires human operator to follow checklist and avoid concurrent rotations"

  - id: EC-12
    description: "Error Stack Trace Includes Secrets: Stack trace contains environment variables -> sanitize before logging, strip env vars"
    priority: P1
    verify:
      - type: automated
        test_type: unit
        file: "services/hubspot-registration/tests/unit/test_sanitize.js"
        test_case: "should sanitize error stack traces to remove environment variables and secrets"
