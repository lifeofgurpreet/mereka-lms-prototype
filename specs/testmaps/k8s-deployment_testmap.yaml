# Testmap: k8s-deployment_spec.md
# Maps every Acceptance Criterion to its verification method.
# Generated: 2026-02-10

spec: k8s-deployment_spec.md
plan: plans/k8s-deployment_plan.md
testplan: plans/k8s-deployment_testplan.md
tier: 1

acceptance_criteria:
  # --- Namespace and Structure ---
  - id: AC-001
    description: "Local Kustomize overlay renders without errors; all resources in mereka-lms namespace"
    test_type: shell_verification
    test_file: "scripts/qa/verify-kustomize-render.sh"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-kustomize-render.sh"
        command: "scripts/qa/verify-kustomize-render.sh --overlay local"
    automated: true
    priority: P1

  - id: AC-002
    description: "Production Kustomize overlay renders without errors; all resources in mereka-lms namespace"
    test_type: shell_verification
    test_file: "scripts/qa/verify-kustomize-render.sh"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-kustomize-render.sh"
        command: "scripts/qa/verify-kustomize-render.sh --overlay production"
    automated: true
    priority: P1

  # --- Deployments ---
  - id: AC-003
    description: "All base Deployments reach Ready state within 10 minutes"
    test_type: kubectl_check
    test_file: "scripts/qa/verify-k8s-live-cluster.sh"
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-k8s-live-cluster.sh"
        command: "scripts/qa/verify-k8s-live-cluster.sh --check deployments"
    automated: true
    priority: P1

  - id: AC-004
    description: "Production overlay: LMS has 2 replicas, LMS-Worker has 2 replicas"
    test_type: shell_verification
