# Testmap for Forum Service Migration
# Maps acceptance criteria from spec to test files for traceability
# Verify coverage: python ~/projects/team-skills/plugins/core/skills/specs-vs-docs/tools/check_test_coverage.py specs/testmaps/forum-service-migration_testmap.yaml

spec: specs/forum-service-migration_spec.md

acceptance_criteria:
  # ============================================================================
  # Data Integrity (AC-001 through AC-004)
  # ============================================================================
  - id: "AC-001"
    description: "MongoDB Atlas connection successful - Python forum reads all collections without errors"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode runtime --check env-check"

  - id: "AC-002"
    description: "Thread count preservation - N threads before = N threads after"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_DATA_VERIFICATION.md"
        command: "Manual verification - compare thread counts in MongoDB Atlas before/after migration"
        notes: "Use MongoDB Atlas UI or mongosh to run db.contents.count({_type: 'CommentThread'})"

  - id: "AC-003"
    description: "Content hash comparison - SHA-256 of 1000 random posts matches 100%"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_DATA_VERIFICATION.md"
        command: "Manual verification - hash comparison requires sampling script not yet implemented"
        notes: "Run: mongosh cluster-mereka-lms.2pjex4s.mongodb.net --eval 'db.contents.aggregate([{$match: {_type: \"Comment\"}}, {$sample: {size: 1000}}])' | shasum"

  - id: "AC-004"
    description: "Vote count preservation - vote counts match between Python and Ruby APIs"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_DATA_VERIFICATION.md"
        command: "Manual verification - compare vote counts via API responses"
        notes: "Both services read same MongoDB database, so vote counts are inherently preserved"

  # ============================================================================
  # API Compatibility (AC-005 through AC-010)
  # ============================================================================
  - id: "AC-005"
    description: "Discussions MFE thread rendering - all threads display correctly with Python forum"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode runtime --check api-check"

  - id: "AC-006"
    description: "Thread creation via MFE - new thread appears in listing within 5 seconds"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_MFE_TESTING.md"
        command: "Manual E2E test - create thread via discussions MFE UI"
        notes: "Navigate to course discussions, create new thread, verify it appears in listing"

  - id: "AC-007"
    description: "Vote persistence - vote increments and persists across page refreshes"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_MFE_TESTING.md"
        command: "Manual E2E test - vote on post, refresh page, verify vote persists"

  - id: "AC-008"
    description: "Abuse flagging - flag recorded and post appears in moderation queue"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_MFE_TESTING.md"
        command: "Manual E2E test - flag post as abuse, verify in moderation queue"
        notes: "Requires moderator/staff account access"

  - id: "AC-009"
    description: "Search functionality - search query returns relevant results via Meilisearch"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode runtime --check meilisearch-health"
      - type: "manual"
        file: "docs/operations/FORUM_MFE_TESTING.md"
        command: "Manual test - search for 'assignment help' in course discussions"

  - id: "AC-010"
    description: "User activity API - Python forum returns activity list in expected format"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode runtime --check api-check"

  # ============================================================================
  # Deployment (AC-011 through AC-014)
  # ============================================================================
  - id: "AC-011"
    description: "K8s manifests - no standalone forum deployment, forum integrated into LMS"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode local --check no-forum-deployment"

  - id: "AC-012"
    description: "Forum API endpoint - responds HTTP 200 from LMS pod"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode runtime --check api-check"

  - id: "AC-013"
    description: "Production health - LMS pod with Python forum starts and passes health checks <60s"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode runtime --check pod-health"
      - type: "manual"
        file: "docs/operations/DEPLOYMENT_RUNBOOK.md"
        command: "kubectl logs -n mereka-lms -l app.kubernetes.io/name=lms --tail=50 | grep -i 'forum\\|startup\\|ready'"

  - id: "AC-014"
    description: "apply-patches.sh - Python forum configuration correctly injected"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode local --check config-check"

  # ============================================================================
  # Performance (AC-015 through AC-017)
  # ============================================================================
  - id: "AC-015"
    description: "Thread listing latency - p95 <=300ms under 50 concurrent requests"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_PERFORMANCE_TESTING.md"
        command: "Manual load test - requires load testing tools (locust, k6, or artillery)"
        notes: "Run: k6 run --vus 50 --duration 60s scripts/qa/load-test-forum-threads.js"

  - id: "AC-016"
    description: "Search latency - p95 <=500ms under 20 concurrent search requests"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_PERFORMANCE_TESTING.md"
        command: "Manual load test - requires load testing tools"
        notes: "Run: k6 run --vus 20 --duration 60s scripts/qa/load-test-forum-search.js"

  - id: "AC-017"
    description: "Memory usage - LMS pod RSS stays below 512Mi under normal load (10 req/s)"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_PERFORMANCE_TESTING.md"
        command: "kubectl top pods -n mereka-lms -l app.kubernetes.io/name=lms"
        notes: "Monitor memory over 10 minutes under sustained load"

  # ============================================================================
  # Rollback (AC-018 through AC-019)
  # ============================================================================
  - id: "AC-018"
    description: "Rollback procedure - documented steps to revert to Ruby forum if needed"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_ROLLBACK.md"
        command: "Manual verification - review rollback procedure documentation"
        notes: "In v21, Ruby forum no longer available upstream - rollback would require downgrade to v18"

  - id: "AC-019"
    description: "Rollback data integrity - posts created during Python period visible after rollback"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_ROLLBACK.md"
        command: "Manual verification - both services use same MongoDB database"
        notes: "Data integrity guaranteed by shared database - no migration needed in reverse direction"

  # ============================================================================
  # Observability (AC-020 through AC-021)
  # ============================================================================
  - id: "AC-020"
    description: "Auth failure alerts - log-auth-failures-forum alert fires on auth failure"
    verify:
      - type: "manual"
        file: "docs/operations/OBSERVABILITY_VERIFICATION.md"
        command: "Manual verification - trigger auth failure and verify alert fires in Alertmanager"
        notes: "Check infrastructure/monitoring/alerts/log-auth-failures-forum.json"

  - id: "AC-021"
    description: "Prometheus metrics - forum-specific metrics present in /metrics endpoint"
    verify:
      - type: "manual"
        file: "docs/operations/OBSERVABILITY_VERIFICATION.md"
        command: "kubectl exec -n mereka-lms $(kubectl get pods -n mereka-lms -l app.kubernetes.io/name=lms -o jsonpath='{.items[0].metadata.name}') -- curl -s http://localhost:8000/metrics | grep forum"
        notes: "Verify forum_request_duration_seconds, forum_request_total metrics present"

  # ============================================================================
  # Local Development (AC-022)
  # ============================================================================
  - id: "AC-022"
    description: "Local development - forum works with tutor local launch"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-forum-service.sh"
        command: "./scripts/qa/verify-forum-service.sh --mode all"
        notes: "Run after 'tutor local launch' completes"

  # ============================================================================
  # Edge Cases (UNGROUPED-23 through UNGROUPED-31)
  # ============================================================================
  - id: "EDGE-MONGODB-TIMEOUT"
    description: "Edge Case: MongoDB Atlas connection timeout - health check fails gracefully"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual test - simulate MongoDB timeout by blocking network or using invalid credentials"
        notes: "Verify LMS logs show clear error message, pod restarts with backoff"

  - id: "EDGE-MEILISEARCH-DOWN"
    description: "Edge Case: Meilisearch service unavailable - search returns 503 or graceful error"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "kubectl scale deployment meilisearch -n mereka-lms --replicas=0 && test search API"
        notes: "Search fails but thread listing/posting should continue to work"

  - id: "EDGE-API-KEY-MISMATCH"
    description: "Edge Case: Forum API key mismatch - returns 401 Unauthorized"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual test - modify FORUM_API_KEY secret and verify auth failure"

  - id: "EDGE-MEILISEARCH-INDEX-MISSING"
    description: "Edge Case: Meilisearch index not yet created - graceful error message"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual test - delete Meilisearch indexes and test search"

  - id: "EDGE-UNICODE-EMOJI"
    description: "Edge Case: Forum thread with Unicode emoji characters - handled correctly"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual test - create thread with emoji (😀, 🎉, etc.) and verify storage/display"

  - id: "EDGE-CONCURRENT-CREATION"
    description: "Edge Case: Concurrent thread creation race condition - no duplicates"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual load test - requires concurrent request simulation"

  - id: "EDGE-POST-SIZE-LIMIT"
    description: "Edge Case: Forum post exceeding size limit - rejected with 413"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual test - create post with >100KB content"

  - id: "EDGE-SQL-INJECTION"
    description: "Edge Case: Search query with SQL injection attempt - rejected safely"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_SECURITY_TESTING.md"
        command: "Manual security test - search for SQL injection payloads ('; DROP TABLE--)"
        notes: "Meilisearch uses JSON API, not SQL, so traditional SQL injection not applicable"

  - id: "EDGE-SAML-REPLAY"
    description: "Edge Case: SAML assertion replay after forum migration - replay cache persists"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_EDGE_CASES.md"
        command: "Manual test - not forum-specific, related to overall SSO implementation"
        notes: "Out of scope for forum migration - covered by auth-sso-enterprise spec"

  # ============================================================================
  # Performance (UNGROUPED-32 through UNGROUPED-35)
  # ============================================================================
  - id: "PERF-SUSTAINED-THREADS"
    description: "Performance: Thread listing latency under sustained load"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_PERFORMANCE_TESTING.md"
        command: "Manual load test - sustained 50 req/s for 10 minutes"

  - id: "PERF-SUSTAINED-SEARCH"
    description: "Performance: Search latency under sustained load"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_PERFORMANCE_TESTING.md"
        command: "Manual load test - sustained 20 search req/s for 10 minutes"

  - id: "PERF-SUSTAINED-MEMORY"
    description: "Performance: Memory usage under sustained load"
    verify:
      - type: "manual"
        file: "docs/operations/FORUM_PERFORMANCE_TESTING.md"
        command: "kubectl top pods -n mereka-lms -l app.kubernetes.io/name=lms --containers"
        notes: "Monitor for 30 minutes under sustained load"

  - id: "PERF-ERROR-RATE"
    description: "Performance: Forum API error rate under normal load <1%"
    verify:
      - type: "manual"
        file: "docs/operations/OBSERVABILITY_VERIFICATION.md"
        command: "Query Prometheus: rate(forum_request_total{status=~'5..'}[5m])"

  # ============================================================================
  # Observability (UNGROUPED-36 through UNGROUPED-38)
  # ============================================================================
  - id: "OBS-GRAFANA-DASHBOARD"
    description: "Observability: Grafana dashboard displays forum metrics"
    verify:
      - type: "manual"
        file: "docs/operations/OBSERVABILITY_VERIFICATION.md"
        command: "Open Grafana, navigate to Forum Dashboard, verify metrics appear"
        notes: "Dashboard should show request rate, latency, error rate, MongoDB query time"

  - id: "OBS-ALERT-ERROR-RATE"
    description: "Observability: Alert fires on forum error rate >5%"
    verify:
      - type: "manual"
        file: "docs/operations/OBSERVABILITY_VERIFICATION.md"
        command: "Manual test - trigger errors to exceed threshold, verify alert fires"

  - id: "OBS-MONGODB-BACKUP"
    description: "Observability: MongoDB Atlas backup integrity verified"
    verify:
      - type: "manual"
        file: "docs/operations/OBSERVABILITY_VERIFICATION.md"
        command: "Login to MongoDB Atlas, verify automated backups running, test restore"
        notes: "Atlas handles backups automatically - verify backup policy in Atlas UI"
