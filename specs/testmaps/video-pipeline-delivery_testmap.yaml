# Testmap: Video Pipeline Delivery
# Source Spec: specs/video-pipeline-delivery_spec.md
# Generated: 2026-02-10

spec: specs/video-pipeline-delivery_spec.md
acceptance_criteria:
- id: AC-001
  verify:
  - type: automated
    test_type: integration
    file: tests/test_mux_upload.py
    command: pytest tests/test_mux_upload.py -k test_upload_valid_mp4
  - type: automated
    test_type: unit
    file: tests/test_mux_api_utils.py
    command: pytest tests/test_mux_api_utils.py -k test_rate_limit_backoff
  description: Given a valid MP4 URL, when `upload_videos_to_mux.py` is executed, then a Mux asset is created with status
    "preparing" or "ready" and a playback_id is returned
- id: AC-002
  verify:
  - type: automated
    test_type: unit
    file: scripts/qa/verify-mux-upload-completeness.sh
    command: bash scripts/qa/verify-mux-upload-completeness.sh
  description: Given 503 MCT videos, when the Mux upload results file (`mux_upload_complete.json`) is checked, then all 503
    entries have a non-null `mux_asset_id` and `mux_playback_id`
- id: AC-003
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-studio-upload.sh
    command: bash scripts/qa/verify-studio-upload.sh
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-001: Studio Upload UX'
    justification: Requires browser interaction with Studio UI; cannot be fully automated without headless browser infrastructure
  description: Given a new video upload from Studio, when the author submits a video file, then a Mux direct upload URL is
    generated within 2 seconds and the file upload begins
- id: AC-004
  verify:
  - type: automated
    test_type: unit
    file: tests/test_mux_upload.py
    command: pytest tests/test_mux_upload.py -k test_batch_resume_from_checkpoint
  description: Given a batch upload of 10 videos, when the upload script runs, then progress is saved every 10 videos and
    the script can resume from the last checkpoint
- id: AC-005
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-hls-renditions.sh
    command: bash scripts/qa/verify-hls-renditions.sh
  description: Given a Mux asset with status "ready", when the HLS URL `https://stream.mux.com/{PLAYBACK_ID}.m3u8` is requested,
    then the response contains an HLS manifest with at least 3 quality renditions
- id: AC-006
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/smoke-video-playback.sh
    command: bash scripts/qa/smoke-video-playback.sh
  - type: automated
    test_type: unit
    file: scripts/qa/verify-poster-dimensions.sh
    command: bash scripts/qa/verify-poster-dimensions.sh
  description: Given an Open edX course with a Video XBlock, when the learner loads the unit page, then the video player displays
    a poster thumbnail and begins HLS playback within 2 seconds on a 5 Mbps connection
- id: AC-007
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-hls-renditions.sh
    command: bash scripts/qa/verify-hls-renditions.sh
  description: Given a mobile learner on a 1 Mbps connection, when the HLS player performs adaptive bitrate switching, then
    the video degrades to 240p without buffering
- id: AC-008
  verify:
  - type: automated
    test_type: unit
    file: tests/test_mux_subtitle_utils.py
    command: pytest tests/test_mux_subtitle_utils.py -k test_upload_srt_subtitle
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-002: Subtitle Display'
    justification: Synchronized subtitle display requires visual verification in browser video player
  description: Given a video with an uploaded SRT subtitle in English, when the learner enables captions, then English subtitles
    display synchronized with video playback
- id: AC-009
  verify:
  - type: automated
    test_type: unit
    file: tests/test_mux_subtitle_utils.py
    command: pytest tests/test_mux_subtitle_utils.py -k test_default_language_code_en
  description: Given a video with text tracks where `srclang` is empty, when the Mux asset is created, then the language_code
    defaults to "en"
- id: AC-010
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-video-subtitles.sh
    command: bash scripts/qa/verify-video-subtitles.sh
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-002: Subtitle Display'
    justification: Language selector UI behavior requires visual verification in browser
  description: Given a Vietnamese-localized course, when subtitle files in Vietnamese are uploaded to Mux, then the language
    selector in the video player shows "Vietnamese" as an option
- id: AC-011
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-mux-signed-playback.sh
    command: bash scripts/qa/verify-mux-signed-playback.sh
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-003: Content Protection'
    justification: Enrollment-gated access requires testing with authenticated user sessions in browser
  description: Given a restricted course with `signed` playback policy, when an unenrolled user attempts to play the video,
    then playback is denied with an appropriate error message
- id: AC-012
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-mux-signed-playback.sh
    command: bash scripts/qa/verify-mux-signed-playback.sh
  description: Given a signed playback token with 12-hour expiry, when the token is used after 12 hours, then Mux returns
    a 403 Forbidden response
- id: AC-013
  verify:
  - type: automated
    test_type: unit
    file: scripts/qa/verify-no-mux-asset-ids.sh
    command: bash scripts/qa/verify-no-mux-asset-ids.sh
  description: Given the LMS HTML source, when inspected in browser DevTools, then only Mux playback IDs are visible -- never
    Mux asset IDs or API credentials
- id: AC-014
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-video-xapi-events.sh
    command: bash scripts/qa/verify-video-xapi-events.sh
  description: Given a learner watching a video to completion, when the xAPI pipeline is checked, then `played` and `completed`
    events exist in ClickHouse with the correct video identifier
- id: AC-015
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-mux-data-dashboard.sh
    command: bash scripts/qa/verify-mux-data-dashboard.sh
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-004: Mux Data QoS'
    justification: Mux dashboard UI verification requires browser login to Mux dashboard
  description: Given Mux Data is enabled, when the Mux dashboard is accessed, then quality metrics (rebuffer ratio, TTFF,
    startup time) are visible for the last 7 days
- id: AC-016
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-superset-video-dashboard.sh
    command: bash scripts/qa/verify-superset-video-dashboard.sh
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-005: Superset Dashboard'
    justification: Superset dashboard visual correctness requires human verification
  description: Given a Superset dashboard for video engagement, when an instructor views it, then per-video play rates and
    average completion percentages are displayed
- id: AC-017
  verify:
  - type: monitoring
    metric: mux_storage_minutes
    dashboard: grafana://dashboards/video-cost
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-006: Cold Storage Cost'
    justification: Cold storage discounts require 90+ day wait; verified via Mux billing dashboard
  description: Given the current catalog of 1,290 video-minutes, when Mux storage charges are calculated after 90 days, then
    monthly storage cost is <= $1.55 (cold storage discount applied)
- id: AC-018
  verify:
  - type: monitoring
    metric: video_delivery_minutes_monthly
    dashboard: grafana://dashboards/video-cost
  - type: manual
    runbook: specs/plans/video-pipeline-delivery_testplan.md
    section: 'MV-006: Cold Storage Cost'
    justification: Delivery cost verification requires Mux billing dashboard access
  description: Given 30,000 delivery minutes/month, when the Mux invoice is reviewed, then delivery cost is $0.00 (within
    100K free tier)
- id: AC-019
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-mux-alerts.sh
    command: bash scripts/qa/verify-mux-alerts.sh
  - type: monitoring
    metric: video_delivery_minutes_monthly
    dashboard: grafana://dashboards/video-cost
  description: Given a monitoring alert rule, when monthly delivery minutes exceed 80,000, then a Slack/email alert is triggered
- id: AC-020
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-mux-secrets.sh
    command: bash scripts/qa/verify-mux-secrets.sh
  description: Given MUX_TOKEN_ID and MUX_TOKEN_SECRET in Infisical, when ExternalSecrets syncs, then the secrets are available
    in the `mereka-lms` K8s namespace as a Secret resource
- id: AC-021
  verify:
  - type: automated
    test_type: unit
    file: scripts/qa/scan-mux-credentials.sh
    command: bash scripts/qa/scan-mux-credentials.sh
  description: Given the application codebase, when searched for Mux credentials, then no hardcoded tokens are found (verified
    by pre-commit hook)
- id: AC-022
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-mux-asset-status.py
    command: python scripts/qa/verify-mux-asset-status.py
  description: Given `video_mapping_openedx.json`, when cross-referenced with Mux API `list assets`, then every mapped playback_id
    resolves to a valid, ready asset
- id: AC-023
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/smoke-video-playback.sh
    command: bash scripts/qa/smoke-video-playback.sh
  description: Given the 30 course packages rebuilt with Mux Video XBlocks, when imported into Open edX, then all video lessons
    play correctly with poster thumbnails
- id: AC-024
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-video-degradation.sh
    command: bash scripts/qa/verify-video-degradation.sh
  description: Given a Mux asset in "errored" state, when the Video XBlock renders, then a poster image with "Video temporarily
    unavailable" text is shown instead of a broken player
- id: AC-025
  verify:
  - type: automated
    test_type: integration
    file: scripts/qa/verify-video-degradation.sh
    command: bash scripts/qa/verify-video-degradation.sh
  - type: automated
    test_type: integration
    file: scripts/qa/smoke-video-playback.sh
    command: bash scripts/qa/smoke-video-playback.sh
  description: Given Mux API is unreachable, when the LMS page loads, then the page renders fully with video placeholder --
    no 500 errors or blank pages
