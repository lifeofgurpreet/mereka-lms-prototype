spec: verifiable-credentials-types_spec.md
acceptance_criteria:
- id: AC-CRED-001
  description: Given the Credentials Service is running, when the `verifiable_credentials`
    app is enabled in settings, then `django.apps.get_app_config('verifiable_credentials')`
    succeeds
  verify: []
- id: AC-CRED-002
  description: 'Given a learner completes a program, when a Program Credential is
    issued, then the VC JSON contains `type: ["VerifiableCredential", "AchievementCredential"]`
    and valid OBv3 fields'
  verify: []
- id: AC-CRED-003
  description: Given a learner completes a course, when a Course Certificate is issued,
    then the VC JSON maps course name, description, and criteria correctly
  verify: []
- id: AC-CRED-004
  description: Given a credential is issued, when the VC JSON is inspected, then the
    `credentialSubject.identifier` contains an opaque user ID, NOT a raw email address
  verify: []
- id: AC-CRED-005
  description: Given enterprise tenant A and B, when credentials are issued for their
    respective learners, then each credential's `issuer` field references the correct
    tenant's Issuer Profile
  verify: []
- id: AC-CRED-006
  description: Given the `ENABLE_VERIFIABLE_CREDENTIALS` flag is off, when a course
    is completed, then no VC is issued (only traditional certificate)
  verify: []
- id: AC-CRED-007
  description: Given the Mereka Academy default Issuer Profile, when a non-enterprise
    learner earns a credential, then the issuer name is "Mereka Academy" with the
    correct logo URL
  verify: []
- id: AC-CRED-008
  description: Given a credential VC JSON, when validated against the OBv3 JSON-LD
    context, then validation passes with zero errors
  verify: []
