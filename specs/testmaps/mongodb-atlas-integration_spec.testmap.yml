    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: monitoring
    metric: mongodb_atlas_connections_current
    dashboard: Atlas Console > Project > Cluster > Metrics > Connections
  - type: manual
    runbook: docs/ops/runbooks/MONGODB_ATLAS_RUNBOOK.md
    section: Verify Atlas Health > Active Connections
    justification: Atlas monitoring dashboard requires Atlas console credentials not
      available to CI; verified manually during deployment
