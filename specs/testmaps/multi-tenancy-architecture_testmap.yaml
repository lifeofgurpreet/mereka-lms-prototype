# Testmap for Multi-Tenancy Architecture
# Maps acceptance criteria from spec to test files for traceability
# Verify coverage: python ~/projects/team-skills/plugins/core/skills/specs-vs-docs/tools/check_test_coverage.py specs/testmaps/multi-tenancy-architecture_testmap.yaml

spec: specs/multi-tenancy-architecture_spec.md
tests:
  # Tenant Identity
  - criterion: "AC-001: Given a new enterprise client 'Acme Corp', when the provisioning script runs with --slug=acme-corp--name='Acme Corp' --domain=acme.academyv2.mereka.io, then an EnterpriseCustomer record is created with a unique UUID, aDjango Site with the specified domain, and a SiteConfiguration with Mereka default values"
    test_file: tests/integration/test_tenant_provisioning.py
    test_name: "test_provision_new_tenant_creates_all_records"
    type: integration

  - criterion: "AC-002: Given tenant 'Acme Corp' exists, whenthe provisioning script runs again with the same slug, thenno duplicate records are created and the script exits with asuccess message indicating 'already provisioned'"
    test_file: tests/integration/test_tenant_provisioning.py
    test_name: "test_provisioning_idempotency"
    type: integration

  # Data Isolation
  - criterion: "AC-003: Given tenant A (Acme) and tenant B (Beta), when admin A calls GET /api/v1/enterprise-catalogs/, then zero catalogs belonging to tenant B are returned"
    test_file: tests/integration/test_cross_tenant_isolation.py
    test_name: "test_api_isolation_enterprise_catalogs"
    type: integration

  - criterion: "AC-004: Given tenant A and tenant B, when admin A calls GET /api/v1/subscriptions/ with tenant B's UUID inthe path, then the response is HTTP 403"
    test_file: tests/integration/test_cross_tenant_isolation.py
    test_name: "test_api_isolation_subscriptions_403"
    type: integration

  - criterion: "AC-005: Given tenant A and tenant B, when admin A queries ClickHouse analytics via Superset, then zero xAPI events with tenant B's UUID are visible"
    test_file: tests/integration/test_analytics_isolation.py
    test_name: "test_superset_rls_enforces_tenant_isolation"
    type: integration

  - criterion: "AC-006: Given tenant A and tenant B, when a raw SQL query SELECT * FROM enterprise_enterprisecustomer is executed by a non-superuser database role, then only the requesting service's scoped records are returned (database user grants prevent cross-schema access for enterprise service databases)"
    test_file: tests/integration/test_database_grants.py
    test_name: "test_non_superuser_database_grants_scoped"
    type: integration

  - criterion: "AC-007: Given a learner belonging to both tenant A and tenant B, when they log into the enterprise learnerportal and select tenant A, then only tenant A's catalog, licenses, and enrollment data are visible"
    test_file: tests/e2e/test_multi_org_learner.py
    test_name: "test_multi_org_learner_tenant_selection"
    type: e2e

  # Branding
  - criterion: "AC-008: Given tenant 'Acme Corp' with a custom logo configured in SiteConfiguration, when a learner navigates to acme.academyv2.mereka.io, then the Acme Corp logo is displayed (not the default Mereka logo)"
    test_file: tests/integration/test_tenant_branding.py
    test_name: "test_custom_logo_displayed"
    type: integration

  - criterion: "AC-009: Given tenant 'Acme Corp' with custombrand colors configured, when the login page loads at acme.academyv2.mereka.io, then the primary brand color matches the configured value"
    test_file: tests/integration/test_tenant_branding.py
    test_name: "test_custom_brand_colors_applied"
    type: integration

  - criterion: "AC-010: Given tenant 'Acme Corp' with a custom footer configured, when any page loads, then the footer displays Acme Corp branding (not default Mereka footer)"
    test_file: tests/integration/test_tenant_branding.py
    test_name: "test_custom_footer_displayed"
    type: integration

  - criterion: "AC-011: Given a tenant branding asset update(new logo), when collectstatic is run, then the updated logois served without requiring an image rebuild"
    test_file: tests/integration/test_branding_deployment.py
    test_name: "test_branding_update_no_rebuild"
    type: integration

  # Domain Routing
  - criterion: "AC-012: Given tenant 'Acme Corp' with domainacme.academyv2.mereka.io, when a browser requests that domain, then the LMS responds with the correct Acme-branded page"
    test_file: tests/integration/test_multi_tenant_routing.py
    test_name: "test_tenant_domain_routing"
    type: integration

  - criterion: "AC-013: Given tenant 'Acme Corp' with a client-owned domain learning.acmecorp.com configured as a CNAME, when a browser requests that domain, then the LMS responds with the correct Acme-branded page and a valid SSL certificate"
    test_file: tests/integration/test_custom_domain_routing.py
    test_name: "test_custom_domain_routing_and_ssl"
    type: integration

  - criterion: "AC-014: Given two tenants with different domains, when requests arrive simultaneously for both domains, then each request resolves the correct SiteConfiguration basedon Host header"
    test_file: tests/integration/test_concurrent_site_resolution.py
    test_name: "test_concurrent_site_config_resolution"
    type: integration

  # Authentication
  - criterion: "AC-015: Given tenant 'Acme Corp' with SAML IdP configured, when a user navigates to /enterprise/login/acme-corp, then they are redirected to Acme's IdP"
    test_file: tests/integration/test_enterprise_sso_routing.py
    test_name: "test_saml_idp_redirect"
    type: integration

  - criterion: "AC-016: Given a successful SAML assertion from Acme's IdP for a new user, when processed, then the user isauto-provisioned and linked to the Acme EnterpriseCustomer"
    test_file: tests/integration/test_jit_provisioning_saml.py
    test_name: "test_jit_provision_via_saml"
    type: integration

  - criterion: "AC-017: Given tenant A's IdP and tenant B's IdP, when a user authenticates via tenant A's IdP, then they are linked to tenant A only (no cross-tenant linking from theSAML flow)"
    test_file: tests/integration/test_cross_tenant_idp_isolation.py
    test_name: "test_saml_assertion_creates_single_tenant_link"
    type: integration

  # Analytics
  - criterion: "AC-018: Given tenant 'Acme Corp' with enrolled learners, when a learner completes a course, then the xAPIevent in ClickHouse includes enterprise_customer_uuid matching Acme's UUID"
    test_file: tests/integration/test_xapi_tenant_tagging.py
    test_name: "test_xapi_event_tagged_with_tenant_uuid"
    type: integration

  - criterion: "AC-019: Given tenant 'Acme Corp' admin in Superset, when they query the enrollment dashboard, then row-level security filters ensure only Acme's data is visible"
    test_file: tests/integration/test_superset_rls.py
    test_name: "test_superset_rls_tenant_admin"
    type: integration

  - criterion: "AC-020: Given platform operator (superuser) in Superset, when they query the cross-tenant overview dashboard, then aggregate data from all tenants is visible"
    test_file: tests/integration/test_superset_rls.py
    test_name: "test_superset_rls_platform_operator_bypass"
    type: integration

  # Provisioning and Offboarding
  - criterion: "AC-021: Given valid provisioning inputs, whenscripts/tenants/provision-tenant.sh runs, then all requiredrecords (Site, SiteConfiguration, EnterpriseCustomer, catalogs, subscriptions, access policies) are created within 15 minutes"
    test_file: tests/integration/test_tenant_provisioning.py
    test_name: "test_provision_tenant_end_to_end"
    type: integration

  - criterion: "AC-022: Given tenant 'Acme Corp' is offboarded, when the offboarding script completes data deletion, thenSELECT count(*) FROM enterprise_catalog WHERE enterprise_customer_uuid = '{acme_uuid}' returns 0 across all enterprise service databases"
    test_file: tests/integration/test_tenant_offboarding.py
    test_name: "test_data_deletion_verified"
    type: integration

  - criterion: "AC-023: Given tenant 'Acme Corp' is offboarded, when ClickHouse is queried, then zero events with Acme's UUID exist"
    test_file: tests/integration/test_tenant_offboarding.py
    test_name: "test_clickhouse_deletion_verified"
    type: integration

  - criterion: "AC-024: Given a tenant offboarding action, when it completes, then an audit log entry exists with: tenantUUID, action 'offboarded', actor, timestamp"
    test_file: tests/integration/test_offboarding_audit_log.py
    test_name: "test_offboarding_audit_log_created"
    type: integration

  # Isolation Verification
  - criterion: "AC-025: Given tenants A and B are provisioned, when scripts/qa/verify-tenant-isolation.sh --tenant-a={uuid_a} --tenant-b={uuid_b} runs, then all isolation checks pass(API, portal, analytics, search)"
    test_file: scripts/qa/verify-tenant-isolation.sh
    test_name: "--tenant-a={uuid_a} --tenant-b={uuid_b}"
    type: manual

  - criterion: "AC-026: Given the nightly isolation test jobruns, when any isolation check fails, then a Critical alert is fired to the oncall channel"
    test_file: tests/integration/test_nightly_isolation_alerts.py
    test_name: "test_isolation_failure_fires_alert"
    type: integration

  # Performance
  - criterion: "AC-027: Given 10 active tenants, when enterprise catalog API queries are benchmarked, then p95 latency remains <= 300ms (per enterprise-microservices spec)"
    test_file: tests/performance/test_tenant_api_latency.py
    test_name: "test_enterprise_catalog_latency_10_tenants"
    type: performance

  - criterion: "AC-028: Given 50 active tenants simulated ina load test, when concurrent API requests are sent from 50 different tenant contexts, then no tenant's p95 latency exceeds120% of the single-tenant baseline"
    test_file: tests/performance/test_50_tenant_scale.py
    test_name: "test_50_tenant_concurrent_load"
    type: performance

  # Edge Cases (Negative Tests)
  - criterion: "EC-1: Partial provisioning failure supports resumption"
    test_file: tests/integration/test_provisioning_failure_recovery.py
    test_name: "test_partial_provisioning_resumable"
    type: integration

  - criterion: "EC-2: Duplicate slug rejected before creatingrecords"
    test_file: tests/unit/test_provisioning_validation.py
    test_name: "test_duplicate_slug_rejected"
    type: unit

  - criterion: "EC-3: Duplicate domain rejected"
    test_file: tests/unit/test_provisioning_validation.py
    test_name: "test_duplicate_domain_rejected"
    type: unit

  - criterion: "EC-4: Invalid SAML metadata skipped, provisioning continues"
    test_file: tests/integration/test_provisioning_saml_failure.py
    test_name: "test_invalid_saml_metadata_soft_failure"
    type: integration

  - criterion: "EC-5: User moves between tenants, enrollmentspersist"
    test_file: tests/integration/test_user_tenant_migration.py
    test_name: "test_user_tenant_transfer_enrollment_preservation"
    type: integration

  - criterion: "EC-6: Multi-org user without tenant selectionsees selection screen"
    test_file: tests/e2e/test_multi_org_learner.py
    test_name: "test_multi_org_tenant_selection_screen"
    type: e2e

  - criterion: "EC-7: Admin cross-tenant user lookup returns'not found' (enumeration prevention)"
    test_file: tests/integration/test_user_enumeration_prevention.py
    test_name: "test_cross_tenant_user_lookup_not_found"
    type: integration

  - criterion: "EC-8: Pending user invited by multiple tenants resolved to both on registration"
    test_file: tests/integration/test_pending_user_multi_tenant.py
    test_name: "test_pending_user_multi_tenant_resolution"
    type: integration

  - criterion: "EC-9: Shared course enrollment data segregated by tenant admin view"
    test_file: tests/integration/test_shared_course_isolation.py
    test_name: "test_shared_course_enrollment_segregated"
    type: integration

  - criterion: "EC-10: Redis cache collision prevented by UUID namespace"
    test_file: tests/unit/test_redis_tenant_namespace.py
    test_name: "test_cache_key_namespace_prevents_collision"
    type: unit

  - criterion: "EC-11: ClickHouse query without tenant filterblocked for non-superusers"
    test_file: tests/integration/test_superset_rls.py
    test_name: "test_unfiltered_query_blocked"
    type: integration

  - criterion: "EC-12: MongoDB forum threads shared across tenants for shared course"
    test_file: tests/integration/test_forum_shared_course.py
    test_name: "test_forum_threads_course_scoped"
    type: integration

  - criterion: "EC-13: Missing tenant branding assets fallback to Mereka default"
    test_file: tests/unit/test_tenant_branding_override.py
    test_name: "test_missing_branding_fallback"
    type: unit

  - criterion: "EC-14: Branding cache staleness handled by cache invalidation"
    test_file: tests/integration/test_branding_cache_invalidation.py
    test_name: "test_branding_cache_invalidation_on_update"
    type: integration

  - criterion: "EC-15: SiteConfiguration invalid JSON fallback to default"
    test_file: tests/unit/test_site_config_resolution.py
    test_name: "test_invalid_json_fallback"
    type: unit

  - criterion: "EC-16: IdP down displays clear error message"
    test_file: tests/integration/test_idp_unreachable.py
    test_name: "test_idp_timeout_user_friendly_error"
    type: integration

  - criterion: "EC-17: SAML assertion for wrong tenant rejected, security event logged"
    test_file: tests/integration/test_cross_tenant_idp_isolation.py
    test_name: "test_wrong_tenant_assertion_rejected"
    type: integration

  - criterion: "EC-18: Concurrent IdP metadata refresh isolated per tenant"
    test_file: tests/integration/test_concurrent_metadata_refresh.py
    test_name: "test_concurrent_metadata_refresh_isolated"
    type: integration

  - criterion: "EC-19: Offboarding tenant with active enrollments preserves LMS enrollments"
    test_file: tests/integration/test_tenant_offboarding.py
    test_name: "test_offboarding_preserves_lms_enrollments"
    type: integration

  - criterion: "EC-20: Offboarding tenant with pending channel sync cancels sync"
    test_file: tests/integration/test_offboarding_channel_sync.py
    test_name: "test_offboarding_cancels_pending_sync"
    type: integration

  - criterion: "EC-21: Data deletion race condition caught byre-scan"
    test_file: tests/integration/test_data_deletion_race.py
    test_name: "test_data_deletion_rescan"
    type: integration

  - criterion: "EC-22: Tenant-scoped API rate limits independent per tenant"
    test_file: tests/integration/test_tenant_rate_limiting.py
    test_name: "test_rate_limit_independent_per_tenant"
    type: integration

  # Observability
  - criterion: "Observability-1: tenant_count_active metric tracks active tenants"
    test_file: tests/integration/test_tenant_metrics.py
    test_name: "test_tenant_count_active_metric"
    type: integration

  - criterion: "Observability-2: tenant_isolation_check_result metric updated on test run"
    test_file: tests/integration/test_tenant_metrics.py
    test_name: "test_isolation_check_result_metric"
    type: integration

  - criterion: "Observability-3: Cross-tenant access denial alert fires on violation"
    test_file: tests/integration/test_tenant_alerts.py
    test_name: "test_cross_tenant_access_alert"
    type: integration

  - criterion: "Observability-4: Provisioning audit log contains required fields"
    test_file: tests/unit/test_provisioning_audit_log.py
    test_name: "test_audit_log_required_fields"
    type: unit

  - criterion: "Observability-5: Logs do not contain tenant PII"
    test_file: tests/unit/test_log_redaction.py
    test_name: "test_tenant_pii_redacted"
    type: unit

  - criterion: "Observability-6: Grafana dashboard queries valid"
    test_file: tests/unit/test_dashboard_queries.py
    test_name: "test_multi_tenancy_dashboard_promql_valid"
    type: unit
