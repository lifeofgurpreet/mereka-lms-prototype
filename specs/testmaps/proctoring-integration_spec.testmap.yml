- id: AC-026
  description: Given a reviewer selects an attempt, when they click "Reject" and enter
    a reason (25 characters), then the attempt transitions to `rejected`, the reason
    is stored, and the student is notified via email
  verify:
  - type: automated
    test_type: shell_verification
