  - type: manual
    runbook: docs/runbooks/proctoring-operations-runbook.md
    section: Verification > Admin Override
    justification: Feature not yet implemented; proctoring admin override with audit
      log not yet built
- id: AC-028
  description: Given an attempt has been in the review queue for longer than the enterprise's
    `review_sla_hours`, when the review dashboard loads, then the attempt is highlighted
    with an SLA warning
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-advanced.sh
    command: scripts/qa/verify-proctoring-advanced.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-integration.sh
