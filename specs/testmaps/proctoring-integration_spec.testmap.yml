    command: scripts/qa/verify-proctoring-advanced.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-integration.sh
    command: scripts/qa/verify-proctoring-integration.sh
  - type: manual
    runbook: docs/runbooks/proctoring-operations-runbook.md
    section: Verification > Reviewer Rejection
    justification: Feature not yet implemented; reviewer rejection flow not yet built
- id: AC-027
  description: Given a reviewer rejects an attempt, when a `proctoring_admin` user
    accesses the attempt, then they can override the rejection to `verified` with
