- id: AC-031
  description: Given an instructor overrides a rejected attempt, when the override
    is processed, then the original exam grade is restored and `proctoring_status`
    changes to `verified` with an override audit entry
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-advanced.sh
    command: scripts/qa/verify-proctoring-advanced.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-integration.sh
