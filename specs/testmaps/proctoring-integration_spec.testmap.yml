  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-integration.sh
    command: scripts/qa/verify-proctoring-integration.sh
  - type: manual
    runbook: docs/runbooks/proctoring-operations-runbook.md
    section: Verification > Review Dashboard Isolation
    justification: Feature not yet implemented; reviewer dashboard with customer-scoped
