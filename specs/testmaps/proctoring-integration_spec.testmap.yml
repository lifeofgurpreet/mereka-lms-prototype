  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-advanced.sh
    command: scripts/qa/verify-proctoring-advanced.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-proctoring-integration.sh
    command: scripts/qa/verify-proctoring-integration.sh
  - type: manual
    runbook: docs/runbooks/proctoring-operations-runbook.md
    section: Verification > Gradebook Sync
    justification: Feature not yet implemented; gradebook sync triggered by proctoring
