# Testmap for Cross-Cutting Requirements
# Maps acceptance criteria from spec to test files for traceability

spec: "specs/cross-cutting-requirements_spec.md"
acceptance_criteria:
  - id: "AC-CCR-001"
    description: "Tenant data isolation — API responses must contain zero records from other tenants"
    verify:
      - type: manual
        runbook: "docs/operations/TROUBLESHOOTING.md"
        section: "Tenant Isolation Testing"
        justification: "Requires multi-tenant test data and authenticated API calls across tenant contexts"

  - id: "AC-CCR-002"
    description: "All services must expose Prometheus metrics at /metrics or via sidecar"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-k8s-deployment-spec.sh"
        command: "bash scripts/qa/verify-k8s-deployment-spec.sh --check servicemonitor"

  - id: "AC-CCR-003"
    description: "All log entries must be structured JSON with timestamp, level, service, request_id"
    verify:
      - type: manual
        runbook: "docs/operations/TROUBLESHOOTING.md"
        section: "Log Format Verification"
        justification: "Requires running pods and log stream inspection via kubectl"

  - id: "AC-CCR-004"
    description: "Secrets must be read from environment variables, not hardcoded or from committed config"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-k8s-secrets-hygiene.sh"
        command: "bash scripts/qa/verify-k8s-secrets-hygiene.sh"

  - id: "AC-CCR-005"
    description: "Pre-commit hook must reject commits with hardcoded secret patterns"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-secrets-management.sh"
        command: "bash scripts/qa/verify-secrets-management.sh --check pre-commit-hook"

  - id: "AC-CCR-006"
    description: "Production API p95 latency < 500ms, availability >= 99.9% over 30 days"
    verify:
      - type: monitoring
        metric: "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[30d]))"
        dashboard: "Grafana: LMS Performance Dashboard"

  - id: "AC-CCR-007"
    description: "Tenant offboarding must produce cryptographic deletion certificate"
    verify:
      - type: manual
        runbook: "docs/operations/TROUBLESHOOTING.md"
        section: "Tenant Offboarding"
        justification: "Requires actual tenant data and deletion workflow — not yet implemented"

  - id: "AC-CCR-008"
    description: "All services must negotiate TLS 1.2 or higher for external traffic"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-k8s-deployment-spec.sh"
        command: "bash scripts/qa/verify-k8s-deployment-spec.sh --check ingress"

  - id: "AC-CCR-009"
    description: "All K8s manifests must include resource requests/limits, liveness/readiness probes"
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-k8s-deployment-spec.sh"
        command: "bash scripts/qa/verify-k8s-deployment-spec.sh --check resources"

  - id: "AC-CCR-010"
    description: "Financial write operations must be idempotent"
    verify:
      - type: manual
        runbook: "docs/operations/TROUBLESHOOTING.md"
        section: "Payment Idempotency Testing"
        justification: "Requires ecommerce/purchase-gateway service with test transactions — not yet implemented"

  - id: "AC-CCR-011"
    description: "Background job failure logs must include error code, message, context, and stack trace"
    verify:
      - type: manual
        runbook: "docs/operations/TROUBLESHOOTING.md"
        section: "Celery Worker Log Verification"
        justification: "Requires running Celery workers with forced failure scenarios"

  - id: "AC-CCR-012"
    description: "Redis Streams consumers must implement idempotent handling with deduplication"
    verify:
      - type: manual
        runbook: "docs/operations/TROUBLESHOOTING.md"
        section: "Event Bus Verification"
        justification: "Redis Streams event bus not yet implemented — deferred to Tier 4"
