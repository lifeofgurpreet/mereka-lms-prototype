spec: verifiable-credentials-ops_spec.md
acceptance_criteria:
- id: AC-CRED-040
  description: Given the Credentials Service is running, when `/metrics` is scraped,
    then all 10 VC-related metrics are present with correct types
  verify: []
- id: AC-CRED-041
  description: Given VC issuance p95 latency exceeds 30 seconds for 5 minutes, when
    Prometheus evaluates rules, then `VCIssuanceLatencyHigh` alert fires
  verify: []
- id: AC-CRED-042
  description: 'Given the signing key is missing from the environment, when the health
    endpoint is called, then HTTP 503 is returned with `"signing_key": "unavailable"`'
  verify: []
- id: AC-CRED-043
  description: Given learners completed a course before VC was enabled, when `backfill_credentials
    --course-id=... --dry-run` is run, then it reports how many VCs would be created
    without creating any
  verify: []
- id: AC-CRED-044
  description: Given the backfill command is run twice for the same course, when the
    second run executes, then zero new VCs are created (idempotent)
  verify: []
- id: AC-CRED-045
  description: Given a VC is issued, when the application log is inspected, then a
    structured JSON log entry exists with credential UUID, learner ID, tenant UUID,
    and timestamp
  verify: []
- id: AC-CRED-046
  description: Given expired claim tokens exist in the database, when the daily cleanup
    job runs, then tokens older than 24 hours are deleted
  verify: []
- id: AC-CRED-047
  description: Given the Grafana dashboard is loaded, then 7 panels are visible covering
    issuance, latency, claims, verification, DID, signing health, and LinkedIn shares
  verify: []
- id: AC-CRED-048
  description: Given key rotation runbook `docs/operations/credential-key-rotation-runbook.md`,
    when followed step by step, then old credentials verify successfully and new credentials
    use the new key
  verify: []
