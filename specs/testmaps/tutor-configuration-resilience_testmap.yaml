  - id: "EC-TCR-005"
    description: "Plugin conflicts with third-party Tutor plugins (tutor-mfe, tutor-indigo)"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "tests/tutor/test_edge_cases.sh"
        command: "bash tests/tutor/test_edge_cases.sh"
        status: "implemented"
        notes: "Tests double-application idempotency"

  - id: "EC-TCR-006"
    description: "Partial plugin migration -- some patches in plugin, some in script, developer disables one"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "tests/tutor/test_edge_cases.sh"
        command: "bash tests/tutor/test_edge_cases.sh"
        status: "implemented"
        notes: "Tests verification passes after apply-patches"

  - id: "EC-TCR-007"
    description: "Verification tool false positive -- grep pattern matches unrelated text"
    verify:
      - type: "automated"
        test_type: "unit"
        file: "tests/tutor/test_edge_cases.sh"
        command: "bash tests/tutor/test_edge_cases.sh"
        status: "implemented"
        notes: "Tests pattern specificity in manifest"
