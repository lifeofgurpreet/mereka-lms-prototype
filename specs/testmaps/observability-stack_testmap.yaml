# Observability Stack Testmap
# Maps every acceptance criterion from the spec to its verification method
#
# Source spec: specs/observability-stack_spec.md
# Implementation plan: specs/plans/observability-stack_plan.md
# Test plan: specs/plans/observability-stack_testplan.md

spec: observability-stack_spec.md
plan: plans/observability-stack_plan.md
testplan: plans/observability-stack_testplan.md
tier: 2

acceptance_criteria:
  - id: AC-001
    description: "Prometheus scrapes all pods: kubectl get servicemonitor -n mereka-lms"
    test_type: kubectl_check
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl get servicemonitor -n mereka-lms -o json | jq '.items | length >= 4'"
        description: "Verify at least 4 ServiceMonitors exist (LMS, CMS, MySQL, Redis)"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 && curl -s 'http://localhost:9090/api/v1/targets' | jq '.data.activeTargets | map(select(.labels.namespace==\"mereka-lms\")) | length > 0'"
        description: "Verify Prometheus targets for mereka-lms namespace are UP"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-observability-stack.sh"
        command: "grep -r 'interval:' deploy/k8s/base/monitoring/servicemonitor-*.yaml | grep -v '#' | awk -F: '{print $NF}' | tr -d ' s' | awk '{if($1>30) exit 1}'"
        description: "Verify all ServiceMonitor scrape intervals are <= 30 seconds"

  - id: AC-002
    description: "Grafana shows pod CPU/memory: Dashboard visible at https://grafana.mereka.io"
    test_type: smoke_test
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "curl -s -o /dev/null -w '%{http_code}' https://grafana.mereka.io/login | grep -q '200\\|302'"
        description: "Verify Grafana is accessible and requires authentication"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/audit-grafana-dashboard.sh"
        command: "./scripts/qa/audit-grafana-dashboard.sh --strict-required"
        description: "Verify required Grafana dashboards exist per dashboard contract"
      - type: manual
        runbook: "docs/operations/OBSERVABILITY_QUICKSTART.md"
        section: "Dashboard Verification"
        justification: "Dashboard load time and visual correctness require human verification in browser"
        description: "Verify dashboards load in under 3 seconds for 24h query window"

  - id: AC-003
    description: "LMS /metrics endpoint returns Prometheus metrics: curl https://academyv2.mereka.io/metrics"
    test_type: smoke_test
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl exec -n mereka-lms deploy/lms -- curl -s -o /dev/null -w '%{http_code}' localhost:8000/metrics | grep -q '200'"
        description: "Verify LMS /metrics returns HTTP 200"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl exec -n mereka-lms deploy/lms -- curl -s localhost:8000/metrics | grep -q 'http_requests_total'"
        description: "Verify /metrics contains http_requests_total counter"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl exec -n mereka-lms deploy/lms -- curl -s localhost:8000/metrics | grep -qE '(http_request_duration_seconds|django_db_query_duration_seconds|django_cache_hit_ratio|celery_task_duration_seconds|lms_enrollment_total|lms_active_users)'"
        description: "Verify /metrics contains custom Open edX metrics from spec"

  - id: AC-004
    description: "Loki receives logs: logcli query '{namespace=\"mereka-lms\"}' --limit 10"
    test_type: smoke_test
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl get daemonset promtail -n mereka-lms -o jsonpath='{.status.numberReady}' | awk '{if($1>0) exit 0; else exit 1}'"
        description: "Verify Promtail DaemonSet has ready pods on all nodes"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "curl -s 'https://loki.mereka.dev/loki/api/v1/query?query={namespace=%22mereka-lms%22}&limit=5' | jq '.data.result | length > 0'"
        description: "Verify Loki returns log entries for mereka-lms namespace"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "curl -s 'https://loki.mereka.dev/loki/api/v1/labels' | jq '.data | contains([\"namespace\",\"pod\",\"container\"])'"
        description: "Verify log labels include namespace, pod, container metadata"

  - id: AC-005
    description: "Tempo receives traces: tempo-cli query-trace <trace-id>"
    test_type: smoke_test
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: true
    priority: P2
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl get pods -n mereka-lms -l app.kubernetes.io/name=tempo -o jsonpath='{.items[0].status.phase}' | grep -q 'Running'"
        description: "Verify Tempo pod is running"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl port-forward -n mereka-lms svc/tempo 3200:3200 && curl -s http://localhost:3200/ready | grep -qi 'ready'"
        description: "Verify Tempo health endpoint returns ready"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-observability-stack.sh"
        command: "grep -q 'OTEL_TRACES_SAMPLER_ARG' infrastructure/tutor/apply-patches.sh || grep -q 'sampler' infrastructure/monitoring/tempo-values.yaml"
        description: "Verify trace sampling configuration exists"

  - id: AC-006
    description: "Alerts fire on OOM: Simulate OOM and verify alert in Slack"
    test_type: manual_verification
    test_file: "scripts/qa/verify-alert-routing.sh"
    automated: false
    priority: P1
    verify:
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl get prometheusrule lms-alerts -n mereka-lms -o yaml | grep -c 'alert:' | awk '{if($1>=5) exit 0; else exit 1}'"
        description: "Verify PrometheusRules contain at least 5 critical alert rules"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-alert-routing.sh"
        command: "kubectl get secret alertmanager-monitoring-kube-prometheus-alertmanager -n monitoring -o jsonpath='{.data.alertmanager\\.yaml}' | base64 -d | grep -q 'slack_configs'"
        description: "Verify Alertmanager has Slack routing configured"
      - type: manual
        runbook: "docs/operations/ONCALL_OBSERVABILITY_PLAYBOOK.md"
        section: "Alert Verification > OOM Simulation"
        justification: "OOM simulation requires deliberate resource exhaustion which cannot be safely automated in production"
        description: "Simulate OOM via stress-ng in LMS pod, verify LMSPodMemoryCritical alert fires and reaches Slack within 2 minutes"

  - id: AC-007
    description: "Log correlation works: Click trace ID in Grafana, jumps to Loki logs"
    test_type: manual_verification
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: false
    priority: P2
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-observability-stack.sh"
        command: "grep -q 'derivedFields' infrastructure/monitoring/grafana-datasources.yaml || kubectl get configmap -n monitoring grafana-datasource-loki -o yaml | grep -q 'derivedFields'"
        description: "Verify Grafana Loki datasource has derived fields for trace ID correlation"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "curl -s 'https://loki.mereka.dev/loki/api/v1/query?query={namespace=%22mereka-lms%22,app=%22lms%22}' | jq -r '.data.result[0].values[0][1]' | grep -q 'trace_id'"
        description: "Verify log entries contain trace_id field"
      - type: manual
        runbook: "docs/operations/OBSERVABILITY_QUICKSTART.md"
        section: "Trace-Log Correlation"
        justification: "Click-through navigation from logs to traces requires visual verification in Grafana UI"
        description: "In Grafana Explore, click a trace_id link in a Loki log entry and verify it navigates to the corresponding Tempo trace"

  - id: AC-008
    description: "Metrics retention 30 days: Query old metrics: rate(http_requests_total[30d])"
    test_type: smoke_test
    test_file: "scripts/qa/verify-observability-stack.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl get statefulset -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].spec.template.spec.containers[0].args}' | grep -oP 'retention\\.time=\\K[0-9]+d' | awk '{if($1>=30) exit 0; else exit 1}'"
        description: "Verify Prometheus retention flag is >= 30 days"
      - type: automated
        test_type: kubectl_check
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl get pvc -n monitoring -l app.kubernetes.io/name=prometheus -o jsonpath='{.items[0].status.phase}' | grep -q 'Bound'"
        description: "Verify Prometheus PersistentVolumeClaim is bound (data survives restarts)"
      - type: automated
        test_type: smoke_test
        file: "scripts/qa/verify-observability-stack.sh"
        command: "kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 && curl -s 'http://localhost:9090/api/v1/query?query=prometheus_tsdb_retention_limit_bytes' | jq '.status == \"success\"'"
        description: "Verify Prometheus TSDB retention configuration is active"
