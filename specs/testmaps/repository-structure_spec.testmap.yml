spec: repository-structure_spec.md
acceptance_criteria:
- id: AC-001
  description: Given a fresh clone of the repository, when listing top-level directories,
    then `deploy/`, `scripts/`, `infrastructure/`, `docs/`, `specs/`, `services/`,
    and `assets/` all exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-002
  description: Given the repository root, when listing `*.md` files, then only files
    in the defined allowlist (README.md, CLAUDE.md, AGENTS.md, CONTRIBUTING.md, MIGRATION_CHECKLIST.md,
    CHANGES.md, GEMINI.md) are present. Any others are violations.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-003
  description: Given the `scripts/` directory, when listing subdirectories, then `shared/`,
    `infra/`, `migrations/`, `branding/`, `analytics/`, and `qa/` all exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-004
  description: Given `scripts/shared/config.sh`, when sourcing it, then environment
    variables `GCP_PROJECT`, `GCP_REGION`, and `LMS_DOMAIN` are exported with non-empty
    values.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-005
  description: Given `deploy/k8s/overlays/`, when listing subdirectories, then `local/`
    and `production/` both exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-006
  description: 'Given the `deploy/k8s/base/secrets/` directory, when scanning YAML
    files, then no file contains a `kind: Secret` resource with `data:` or `stringData:`
    fields containing non-reference values.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-007
  description: Given the repository, when checking for `tools/` and `ops/` directories,
    then neither directory exists OR each contains only a `README.md` redirect file.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-008
  description: Given `docs/`, when listing subdirectories, then `adr/`, `onboarding/`,
    `operations/`, `migrations/`, `architecture/`, and `archive/` all exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-009
  description: Given `infrastructure/`, when listing subdirectories, then `tutor/`,
    `cloudflare/`, `terraform/`, and `monitoring/` all exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-010
  description: Given `var/` and `tutor_env/`, when checking `.gitignore`, then both
    directories are listed as gitignored patterns.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-011
  description: Given any `specs/*.md` file, when checking the filename, then it matches
    the pattern `*_spec.md`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh
- id: AC-012
  description: Given the full verification script, when executed against the repository,
    then it completes in under 5 seconds and reports PASS with zero violations.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-repo-structure.sh
    command: scripts/qa/verify-repo-structure.sh

