spec: secrets-management_spec.md
acceptance_criteria:
- id: AC-001
  description: Given the production GKE cluster, when `kubectl get externalsecrets
    -n mereka-lms` is run, then both `openedx-secrets` and `database-secrets` show
    `STATUS=SecretSynced`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-live-cluster.sh
    command: scripts/qa/verify-secrets-live-cluster.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
  - type: manual
    runbook: docs/runbooks/operations/SECRET_ROTATION_CHECKLIST.md
    section: Verification > ExternalSecrets are synced
    justification: Requires live GKE cluster access; cannot be verified in CI without
      cluster credentials
- id: AC-002
  description: Given a Deployment (e.g., `lms`), when its pod spec is inspected, then
    `envFrom` references `openedx-secrets` and `database-secrets` via `secretRef`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-live-cluster.sh
    command: scripts/qa/verify-secrets-live-cluster.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
  - type: manual
    runbook: docs/runbooks/operations/SECRET_ROTATION_CHECKLIST.md
    section: Verification > Pods have envFrom referencing secrets
    justification: Requires live GKE cluster access; K8sdeploy manifests reference
      envFrom but runtime verificationneeds cluster
- id: AC-003
  description: Given a running LMS pod, when `echo $OPENEDX_SECRET_KEY` is executed
    inside the container, then a non-empty value is returned (confirming the pipeline
    delivers secrets to application code).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-live-cluster.sh
    command: scripts/qa/verify-secrets-live-cluster.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
  - type: manual
    runbook: docs/runbooks/operations/SECRET_ROTATION_CHECKLIST.md
    section: Verification > Runtime health
    justification: Requires live GKE cluster with running LMS pod; cannot be simulated
      in CI
- id: AC-004
  description: Given the file `deploy/k8s/base/secrets/external-secrets.yaml`, when
    all `remoteRef.key` values are extracted, then every key starts with `MEREKA_LMS_`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-naming-convention.sh
    command: scripts/qa/verify-secrets-naming-convention.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-005
  description: Given the `openedx-secrets` ExternalSecret, when its `data` array is
    inspected, then each entry maps a `MEREKA_LMS_*` remote key to an application-expected
    local `secretKey` (without the prefix).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-naming-convention.sh
    command: scripts/qa/verify-secrets-naming-convention.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
- id: AC-006
  description: Given the Infisical CLI, when `infisical-audit-mereka-lms.sh` is run,
    then zero `MEREKA_LMS_*` keys are found outside the `/k8s/mereka-lms` path.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/infisical-audit-mereka-lms.sh
    command: scripts/infra/infisical-audit-mereka-lms.sh
  - type: automated
    test_type: shell_verification
    file: scripts/infra/infisical-sync-mereka-lms.sh
    command: scripts/infra/infisical-sync-mereka-lms.sh
  - type: automated
    test_type: shell_verification
    file: scripts/infra/normalize-mysql-secrets.sh
    command: scripts/infra/normalize-mysql-secrets.sh
  - type: automated
    test_type: shell_verification
    file: scripts/infra/sync-mereka-lms-secrets-to-gcpsm.sh
    command: scripts/infra/sync-mereka-lms-secrets-to-gcpsm.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-infisical.sh
    command: scripts/qa/verify-secrets-infisical.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-007
  description: Given both `prod` and `dev` Infisical environments, when `infisical-validate-mereka-lms.sh`
    is run, then it exits 0 confirming all expected keys exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/infisical-validate-mereka-lms.sh
    command: scripts/infra/infisical-validate-mereka-lms.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-infisical.sh
    command: scripts/qa/verify-secrets-infisical.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-008
  description: Given `STRICT=1`, when `infisical-validate-mereka-lms.sh` is run in
    both `prod` and `dev`, then it exits 0 confirming no empty values, no placeholders,
    and no trailing CR/LF bytes.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/infisical-validate-mereka-lms.sh
    command: scripts/infra/infisical-validate-mereka-lms.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-infisical.sh
    command: scripts/qa/verify-secrets-infisical.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-009
  description: Given the `openedx-secrets` K8s Secret in production, when its keys
    are listed, then at least 33 keys are present matching the inventory table in
    this spec.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-inventory.sh
    command: scripts/qa/verify-secrets-inventory.sh
  - type: manual
    runbook: specs/secrets-management_spec.md
    section: Verification > K8s secrets exist with correct key counts
    justification: Live key count verification requirescluster access
- id: AC-010
  description: 'Given the `database-secrets` K8s Secret in production, when its keys
    are listed, then exactly 7 keys are present: `MYSQL_ROOT_PASSWORD`, `OPENEDX_MYSQL_PASSWORD`,
    `MYSQL_DISCOVERY_PASSWORD`, `MYSQL_ECOMMERCE_PASSWORD`, `MYSQL_NOTES_PASSWORD`,
    `MYSQL_XQUEUE_PASSWORD`, `MYSQL_CREDENTIALS_PASSWORD`.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-inventory.sh
    command: scripts/qa/verify-secrets-inventory.sh
  - type: manual
    runbook: specs/secrets-management_spec.md
    section: Verification > K8s secrets exist with correct key counts
    justification: Live key count verification requirescluster access
- id: AC-011
  description: Given the Infisical path `/k8s/mereka-lms/atlas`, when its keys are
    listed, then `ATLAS_PUBLIC_KEY`, `ATLAS_PRIVATE_KEY`, `ATLAS_ORG_ID`, and `ATLAS_PROJECT_ID`
    exist.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-infisical.sh
    command: scripts/qa/verify-secrets-infisical.sh
  - type: manual
    runbook: docs/reference/operations/INFISICAL_MEREKA_LMS_KEYS.md
    section: Atlas Automation Keys
    justification: Atlas path is not referenced in ExternalSecrets (not synced to
      K8s); requires direct Infisical CLIaccess
- id: AC-012
  description: Given the entire `deploy/k8s/` directory, when scanned with `grep -r`
    for known secret patterns (excluding `secretKeyRef`, `secretRef`, `remoteRef`,
    `SecretStore`, `ExternalSecret`, `secretName`, `secretGenerator`, and comments),
    then zero matches are returned.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/scan-secrets-fast.sh
    command: scripts/qa/scan-secrets-fast.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-cms-oauth2-secret-present.sh
    command: scripts/qa/verify-cms-oauth2-secret-present.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-no-hardcoded-secrets.sh
    command: scripts/qa/verify-no-hardcoded-secrets.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-platform-admin-env.sh
    command: scripts/qa/verify-platform-admin-env.sh
- id: AC-013
  description: Given a test commit containing a hardcoded password pattern, when `git
    commit` is run with the pre-commit hook active, then the commit is blocked.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-precommit.sh
    command: scripts/qa/verify-secrets-precommit.sh
  - type: manual
    runbook: specs/secrets-management_spec.md
    section: Acceptance Criteria > No Hardcoded Secrets> AC-013
    justification: Pre-commit hook testing requires interactive git workflow; cannot
      run in CI without staging actualfiles
- id: AC-014
  description: Given all JWT secret keys in `openedx-secrets` (`JWT_SECRET_KEY_LMS`,
    `JWT_SECRET_KEY_CMS`, `JWT_SECRET_KEY_DISCOVERY`, `JWT_SECRET_KEY_ECOMMERCE`,
    `JWT_SECRET_KEY_NOTES`, `JWT_SECRET_KEY_XQUEUE`, `JWT_SECRET_KEY_CREDENTIALS`),
    when their GCP SM remote keys are inspected, then each maps to a distinct `MEREKA_LMS_JWT_SECRET_KEY_*`
    value (no two services share the same JWT secret).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-jwt-uniqueness.sh
    command: scripts/qa/verify-jwt-uniqueness.sh
- id: AC-015
  description: 'Given both ExternalSecrets, when their specs are inspected, then `refreshInterval:
    1h`, `secretStoreRef.name: gcp-secret-manager`, `target.deletionPolicy: Retain`,
    and `target.creationPolicy: Owner` are set.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-externalsecret-config.sh
    command: scripts/qa/verify-externalsecret-config.sh
- id: AC-016
  description: 'Given the ClusterSecretStore `gcp-secret-manager`, when its spec is
    inspected, then `projectID: bbi-k8` and `secretVersionSelectionPolicy: LatestOrFail`
    are configured.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-externalsecret-config.sh
    command: scripts/qa/verify-externalsecret-config.sh
- id: AC-017
  description: Given the local Kustomize overlay, when ExternalSecret patches are
    inspected, then Stripe and MySQL keys reference `*_DEV` suffixed GCP SM keys.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-dev-prod-secret-separation.sh
    command: scripts/qa/verify-dev-prod-secret-separation.sh
- id: AC-018
  description: Given a rotated secret value in Infisical, when `sync-mereka-lms-secrets-to-gcpsm.sh`
    is run followed by `kubectl annotate externalsecret openedx-secrets -n mereka-lms
    force-sync=$(date +%s) --overwrite`, then pods restarted after the sync receive
    the new value.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-secrets-live-cluster.sh
    command: scripts/qa/verify-secrets-live-cluster.sh
  - type: manual
    runbook: docs/runbooks/operations/SECRET_ROTATION_CHECKLIST.md
    section: Full Rotation Procedure
    justification: End-to-end rotation test requires live Infisical, GCP SM, GKE cluster,
      and running pods; executedquarterly during game days

