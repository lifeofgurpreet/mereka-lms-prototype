# design-tokens-system_testmap.yaml
# Machine-readable mapping of spec acceptance criteria to verification methods.
# Source Spec: specs/design-tokens-system_spec.md

spec: "specs/design-tokens-system_spec.md"
plan: "specs/plans/design-tokens-system_plan.md"
testplan: "specs/plans/design-tokens-system_testplan.md"
tier: 2

acceptance_criteria:
  - id: "AC-001"
    description: "All primary color tokens (--color-black, --color-white, --color-teal, --color-magenta, --color-blue) are defined with valid hex values"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Parses tokens.css and validates all primary color tokens are present and have hex values"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-design-tokens.sh"
        command: "scripts/branding/verify-design-tokens.sh"
        notes: "Phantom script - validates all token categories and value formats"

  - id: "AC-002"
    description: "All typography tokens (--font-heading, --font-body, --text-h1, etc.) are defined with valid CSS values"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Validates font family tokens contain expected typefaces (Lato, Poppins)"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-design-tokens.sh"
        command: "scripts/branding/verify-design-tokens.sh"
        notes: "Phantom script - validates typography token completeness"

  - id: "AC-003"
    description: "All spacing tokens (--space-0 through --space-24) are defined with pixel values following 4px base unit scale"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-design-tokens.sh"
        command: "scripts/branding/verify-design-tokens.sh"
        notes: "Phantom script - validates spacing tokens follow 4px scale (0, 4, 8, 12, 16, etc.)"

  - id: "AC-004"
    description: "All tokens are defined within a single :root selector, use kebab-case naming, and include section header comments"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-design-tokens.sh"
        command: "scripts/branding/verify-design-tokens.sh"
        notes: "Phantom script - validates token file structure, naming conventions, and section headers"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-health.sh"
        command: "scripts/branding/verify-branding-health.sh"
        notes: "Existing health check includes basic token file validation"

  - id: "AC-005"
    description: "Provenance file contains all required fields (source_repo, source_path, source_branch, source_commit, source_sha256, synced_at_utc)"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Validates provenance JSON structure and required fields presence"

  - id: "AC-006"
    description: "Provenance source_commit matches 40-character lowercase git SHA pattern [0-9a-f]{40}"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Validates commit SHA format in provenance file"

  - id: "AC-007"
    description: "Provenance source_sha256 matches 64-character lowercase SHA256 pattern [0-9a-f]{64}"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Validates SHA256 hash format in provenance file"

  - id: "AC-008"
    description: "verify-token-drift.sh exits 0 when tokens.css and mereka-overrides.css are in sync"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Primary drift detection script - exits 0 on success with message '✓ Token drift + provenance checks passed.'"

  - id: "AC-009"
    description: "verify-token-drift.sh exits non-zero when token values mismatch between tokens.css and mereka-overrides.css"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Negative test - script should detect drift violations and exit non-zero with error details"

  - id: "AC-010"
    description: "verify-token-drift.sh exits non-zero when tokens.css content is modified but provenance SHA256 is stale"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Provenance validation - detects SHA256 mismatches between file content and provenance record"

  - id: "AC-011"
    description: "update-token-provenance.sh syncs tokens from upstream and updates provenance metadata when SYNC_FILE=1"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/update-token-provenance.sh"
        command: "SYNC_FILE=1 scripts/branding/update-token-provenance.sh"
        notes: "Token sync script - copies upstream tokens.css and updates provenance with commit SHA and file hash"
      - type: "manual"
        runbook: "specs/design-tokens-system_spec.md"
        section: "Rollout & Rollback > Syncing New Tokens from Figma"
        justification: "Full sync workflow requires access to upstream bbbi-mereka-brand-assets repository"

  - id: "AC-012"
    description: "mereka-overrides.css contains --mereka-color-teal defined with value matching --color-teal from tokens.css"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-token-drift.sh"
        command: "scripts/branding/verify-token-drift.sh"
        notes: "Runtime token mapping validation - verifies required token pairs match between canonical and override files"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/branding/verify-branding-css.sh"
        command: "scripts/branding/verify-branding-css.sh"
        notes: "CSS override validation - checks override file references canonical tokens"
