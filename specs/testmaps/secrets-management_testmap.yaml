# secrets-management_testmap.yaml
# Machine-readable mapping of spec acceptance criteria to verification methods.
# Used by spec_verify.py for automated traceability checking.

spec: secrets-management_spec.md
plan: plans/secrets-management_plan.md
testplan: plans/secrets-management_testplan.md
tier: 0

acceptance_criteria:
  - id: AC-001
    description: "ExternalSecrets show STATUS=SecretSynced for openedx-secrets and database-secrets"
    test_type: kubectl_check
    test_file: ""
    test_command: "kubectl get externalsecrets -n mereka-lms"
    automated: false
    priority: P1
    verify:
      - type: manual
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Verification > ExternalSecrets are synced"
        justification: "Requires live GKE cluster access; cannot be verified in CI without cluster credentials"

  - id: AC-002
    description: "Deployments use envFrom with secretRef foropenedx-secrets and database-secrets"
    test_type: kubectl_check
    test_file: ""
    test_command: "kubectl get deploy lms -n mereka-lms -o yaml | grep -A3 envFrom"
    automated: false
    priority: P1
    verify:
      - type: manual
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Verification > Pods have envFrom referencing secrets"
        justification: "Requires live GKE cluster access; K8sdeploy manifests reference envFrom but runtime verificationneeds cluster"

  - id: AC-003
    description: "LMS pod has non-empty OPENEDX_SECRET_KEY environment variable"
    test_type: kubectl_check
    test_file: ""
    test_command: "kubectl exec -n mereka-lms deploy/lms -- printenv OPENEDX_SECRET_KEY"
    automated: false
    priority: P1
    verify:
      - type: manual
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Verification > Runtime health"
        justification: "Requires live GKE cluster with running LMS pod; cannot be simulated in CI"

  - id: AC-004
    description: "All remoteRef.key values in external-secrets.yaml start with MEREKA_LMS_"
    test_type: shell_verification
    test_file: "scripts/qa/verify-secrets-naming-convention.sh"
    test_command: "./scripts/qa/verify-secrets-naming-convention.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-secrets-naming-convention.sh"
        command: "./scripts/qa/verify-secrets-naming-convention.sh"

  - id: AC-005
    description: "ExternalSecret data entries map MEREKA_LMS_* remote keys to application-expected local keys"
    test_type: shell_verification
    test_file: "scripts/qa/verify-secrets-naming-convention.sh"
    test_command: "./scripts/qa/verify-secrets-naming-convention.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-secrets-naming-convention.sh"
        command: "./scripts/qa/verify-secrets-naming-convention.sh"

  - id: AC-006
    description: "Zero MEREKA_LMS_* keys found outside /k8s/mereka-lms path in Infisical"
    test_type: shell_verification
    test_file: "scripts/infra/infisical-audit-mereka-lms.sh"
    test_command: "./scripts/infra/infisical-audit-mereka-lms.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/infra/infisical-audit-mereka-lms.sh"
        command: "./scripts/infra/infisical-audit-mereka-lms.sh"
      - type: automated
        test_type: shell_verification
        file: "scripts/infra/infisical-sync-mereka-lms.sh"
        command: "./scripts/infra/infisical-sync-mereka-lms.sh --verify"
      - type: automated
        test_type: shell_verification
        file: "scripts/infra/sync-mereka-lms-secrets-to-gcpsm.sh"
        command: "./scripts/infra/sync-mereka-lms-secrets-to-gcpsm.sh --verify"
      - type: automated
        test_type: shell_verification
        file: "scripts/infra/normalize-mysql-secrets.sh"
        command: "./scripts/infra/normalize-mysql-secrets.sh --verify"

  - id: AC-007
    description: "infisical-validate-mereka-lms.sh exits 0 inboth prod and dev environments"
    test_type: ci_workflow
    test_file: ".github/workflows/ci.yml"
    test_command: "INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh && INFISICAL_ENV=dev ./scripts/infra/infisical-validate-mereka-lms.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/infra/infisical-validate-mereka-lms.sh"
        command: "INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh"
      - type: automated
        test_type: ci_workflow
        file: ".github/workflows/ci.yml"
        command: "validate-infisical job"

  - id: AC-008
    description: "STRICT=1 validation exits 0 in prod and dev(no empty, no placeholder, no trailing CR/LF)"
    test_type: ci_workflow
    test_file: ".github/workflows/ci.yml"
    test_command: "STRICT=1 INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh && STRICT=1 INFISICAL_ENV=dev ./scripts/infra/infisical-validate-mereka-lms.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/infra/infisical-validate-mereka-lms.sh"
        command: "STRICT=1 INFISICAL_ENV=prod ./scripts/infra/infisical-validate-mereka-lms.sh"
      - type: automated
        test_type: ci_workflow
        file: ".github/workflows/ci.yml"
        command: "validate-infisical job with STRICT=1"

  - id: AC-009
    description: "openedx-secrets K8s Secret has at least 33keys matching spec inventory"
    test_type: shell_verification
    test_file: "scripts/qa/verify-secrets-inventory.sh"
    test_command: "./scripts/qa/verify-secrets-inventory.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-secrets-inventory.sh"
        command: "./scripts/qa/verify-secrets-inventory.sh"
      - type: manual
        runbook: "specs/secrets-management_spec.md"
        section: "Verification > K8s secrets exist with correct key counts"
        justification: "Live key count verification requirescluster access"

  - id: AC-010
    description: "database-secrets K8s Secret has exactly 7 specified keys"
    test_type: shell_verification
    test_file: "scripts/qa/verify-secrets-inventory.sh"
    test_command: "./scripts/qa/verify-secrets-inventory.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-secrets-inventory.sh"
        command: "./scripts/qa/verify-secrets-inventory.sh"
      - type: manual
        runbook: "specs/secrets-management_spec.md"
        section: "Verification > K8s secrets exist with correct key counts"
        justification: "Live key count verification requirescluster access"

  - id: AC-011
    description: "Atlas secrets (ATLAS_PUBLIC_KEY, ATLAS_PRIVATE_KEY, ATLAS_ORG_ID, ATLAS_PROJECT_ID) exist at /k8s/mereka-lms/atlas"
    test_type: manual_verification
    test_file: ""
    test_command: "infisical secrets generate-example-env --path /k8s/mereka-lms/atlas --env prod"
    automated: false
    priority: P2
    verify:
      - type: manual
        runbook: "docs/operations/INFISICAL_MEREKA_LMS_KEYS.md"
        section: "Atlas Automation Keys"
        justification: "Atlas path is not referenced in ExternalSecrets (not synced to K8s); requires direct Infisical CLIaccess"

  - id: AC-012
    description: "Zero hardcoded secret patterns in deploy/k8s/ directory"
    test_type: shell_verification
    test_file: "scripts/qa/verify-no-hardcoded-secrets.sh"
    test_command: "./scripts/qa/verify-no-hardcoded-secrets.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-no-hardcoded-secrets.sh"
        command: "./scripts/qa/verify-no-hardcoded-secrets.sh"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/scan-secrets-fast.sh"
        command: "./scripts/qa/scan-secrets-fast.sh"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-cms-oauth2-secret-present.sh"
        command: "./scripts/qa/verify-cms-oauth2-secret-present.sh"
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-platform-admin-env.sh"
        command: "./scripts/qa/verify-platform-admin-env.sh"

  - id: AC-013
    description: "Pre-commit hook blocks commits containing hardcoded password patterns"
    test_type: manual_verification
    test_file: ".githooks/pre-commit"
    test_command: "echo 'PASSWORD = \"hunter2\"' > /tmp/test-secret.py && git add /tmp/test-secret.py && git commit -m test"
    automated: false
    priority: P1
    verify:
      - type: manual
        runbook: "specs/secrets-management_spec.md"
        section: "Acceptance Criteria > No Hardcoded Secrets> AC-013"
        justification: "Pre-commit hook testing requires interactive git workflow; cannot run in CI without staging actualfiles"

  - id: AC-014
    description: "All JWT secret keys map to distinct MEREKA_LMS_JWT_SECRET_KEY_* remote keys"
    test_type: shell_verification
    test_file: "scripts/qa/verify-jwt-uniqueness.sh"
    test_command: "./scripts/qa/verify-jwt-uniqueness.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-jwt-uniqueness.sh"
        command: "./scripts/qa/verify-jwt-uniqueness.sh"

  - id: AC-015
    description: "ExternalSecrets have refreshInterval:1h, deletionPolicy:Retain, creationPolicy:Owner, secretStoreRef gcp-secret-manager"
    test_type: shell_verification
    test_file: "scripts/qa/verify-externalsecret-config.sh"
    test_command: "./scripts/qa/verify-externalsecret-config.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-externalsecret-config.sh"
        command: "./scripts/qa/verify-externalsecret-config.sh"

  - id: AC-016
    description: "ClusterSecretStore has projectID:bbi-k8 andsecretVersionSelectionPolicy:LatestOrFail"
    test_type: shell_verification
    test_file: "scripts/qa/verify-externalsecret-config.sh"
    test_command: "./scripts/qa/verify-externalsecret-config.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-externalsecret-config.sh"
        command: "./scripts/qa/verify-externalsecret-config.sh"

  - id: AC-017
    description: "Local Kustomize overlay uses *_DEV suffixedGCP SM keys for Stripe and MySQL"
    test_type: shell_verification
    test_file: "scripts/qa/verify-dev-prod-secret-separation.sh"
    test_command: "./scripts/qa/verify-dev-prod-secret-separation.sh"
    automated: true
    priority: P1
    verify:
      - type: automated
        test_type: shell_verification
        file: "scripts/qa/verify-dev-prod-secret-separation.sh"
        command: "./scripts/qa/verify-dev-prod-secret-separation.sh"

  - id: AC-018
    description: "Rotated secret propagates end-to-end aftersync + force-sync annotation + pod restart"
    test_type: manual_verification
    test_file: ""
    test_command: ""
    automated: false
    priority: P2
    verify:
      - type: manual
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Full Rotation Procedure"
        justification: "End-to-end rotation test requires live Infisical, GCP SM, GKE cluster, and running pods; executedquarterly during game days"
