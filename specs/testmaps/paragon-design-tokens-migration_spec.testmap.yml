spec: paragon-design-tokens-migration_spec.md
acceptance_criteria:
- id: AC-TKN-001
  description: Given the repository, when `tokens/src/core/global.json` is parsed, then it contains at least 100 token entries
    covering colors (25+), typography (15+), spacing (14), sizing (16+), shadows (4), z-index (7), animation (9), border-radius
    (6).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-002
  description: Given `tokens/src/core/global.json`, when color token `color.teal` is read, then its value is `#237072` matching
    `assets/branding/tokens.css --color-teal`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-003
  description: Given `tokens/src/core/alias.json`, when semantic token `color.primary` is read, then its value is `{global.color.magenta}`
    (a reference, not a hardcoded hex value).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-004
  description: Given `tokens/src/core/alias.json`, when semantic token `color.secondary` is read, then its value is `{global.color.teal}`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-005
  description: Given `tokens/src/core/alias.json`, when all alias tokens are enumerated, then none contain raw hex values
    -- all use `{reference}` syntax.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-006
  description: 'Given `tokens/src/core/components/button.json`, when parsed, then it defines `border-radius` as `{global.radius.full}`
    (mapping the current `border-radius: 999px` override).'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-007
  description: Given `tokens/src/core/components/card.json`, when parsed, then it defines `border-radius` with a value referencing
    a global radius token.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-008
  description: 'Given `tokens/src/core/components/`, when all component JSON files are listed, then at least 9 files exist:
    `button.json`, `card.json`, `alert.json`, `modal.json`, `navbar.json`, `form-control.json`, `dropdown.json`, `tabs.json`,
    `badge.json`.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-009
  description: Given `style-dictionary.config.js` exists, when `./scripts/branding/build-tokens.sh` is run, then a CSS file
    is generated at the configured output path containing `--pgn-*` custom properties.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-010
  description: Given the generated CSS file, when `--pgn-color-primary` is extracted, then its value resolves to `#ab3b78`
    (Mereka magenta).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-011
  description: Given the generated CSS file, when `--pgn-color-secondary` is extracted, then its value resolves to `#237072`
    (Mereka teal).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-012
  description: Given the generated CSS file, when `--pgn-font-family-sans-serif` is extracted, then its value contains `Poppins`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-013
  description: Given the generated CSS file, when all custom properties are counted, then there are at least 100 `--pgn-*`
    entries.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-014
  description: Given the generated CSS file, when searched for `{`, then zero unresolved reference strings are found (all
    references fully resolved).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-015
  description: Given style-dictionary config, when a `modify` transform is defined (e.g., `darken` on `color.primary` by 10%),
    then the output CSS contains the computed color value (not a reference or function call).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-json-token-hierarchy.sh
    command: scripts/qa/verify-paragon-json-token-hierarchy.sh
- id: AC-TKN-016
  description: Given the Tutor plugin `mereka_lms.py`, when MFE config is rendered, then `PARAGON_THEME_URLS` is present with
    `core.urls.default` and `core.urls.brandOverride` keys.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-token-coverage.sh
    command: scripts/qa/verify-paragon-token-coverage.sh
- id: AC-TKN-017
  description: Given `PARAGON_THEME_URLS` is configured, when the authn MFE is loaded in a browser, then the page fetches
    the `brandOverride` CSS URL and applies Mereka branding (teal/magenta palette, Poppins/Lato fonts).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-token-coverage.sh
    command: scripts/qa/verify-paragon-token-coverage.sh
- id: AC-TKN-018
  description: Given `PARAGON_THEME_URLS` is configured, when the compiled CSS file at the `brandOverride` URL is updated
    and the browser cache is cleared, then the MFE reflects the updated brand values without MFE image rebuild.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-019
  description: 'Given production environment, when `PARAGON_THEME_URLS` CDN URL is accessed, then the response includes `Content-Type:
    text/css`, has `Cache-Control` headers, and the file is served with HTTP 200.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-020
  description: Given the compiled theme CSS, when Caddy configuration is inspected, then a route serves the theme CSS from
    a stable URL path (e.g., `/theme/mereka-brand.min.css`).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-token-coverage.sh
    command: scripts/qa/verify-paragon-token-coverage.sh
- id: AC-TKN-021
  description: Given the theme CSS is served via Caddy, when the URL is fetched, then the `Content-Type` header is `text/css`
    and the response body contains `--pgn-color-primary`.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-token-coverage.sh
    command: scripts/qa/verify-paragon-token-coverage.sh
- id: AC-TKN-022
  description: Given Phase 1-3 (migration in progress), when an MFE is built without `PARAGON_THEME_URLS` support, then the
    SCSS `$primary`, `$secondary`, `$font-family-sans-serif` variables from `_tokens.scss` still apply Mereka branding.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-token-coverage.sh
    command: scripts/qa/verify-paragon-token-coverage.sh
- id: AC-TKN-023
  description: Given Phase 1-3, when `_tokens.scss` is inspected, then both the SCSS variable block (lines 77-136) and the
    `:root` CSS custom property block (lines 37-74) are present.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-token-coverage.sh
    command: scripts/qa/verify-paragon-token-coverage.sh
- id: AC-TKN-024
  description: Given the component token files, when compiled, then the `.pgn__btn--primary` background, border, and shadow
    are controlled by token values (not BEM CSS overrides in `mereka.scss`).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-025
  description: Given the component token files, when compiled, then `.pgn__card` border-radius and box-shadow are controlled
    by token values.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-026
  description: Given the component token files, when compiled, then `.pgn__alert` border-radius and variant background colors
    are controlled by token values.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-027
  description: Given `mereka.scss` after Phase 3 migration, when its line count is measured, then it is fewer than 100 lines
    (down from 614).
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-028
  description: Given `mereka.scss` after Phase 3 migration, when parsed for hardcoded `rgba()` values, then fewer than 5 remain
    (down from ~40), with each justified as a structural override not expressible as a token.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-029
  description: 'Given `scripts/qa/verify-paragon-tokens.sh` exists, when run after a successful token build, then it validates:
    (a) token count >= 100, (b) zero unresolved references, (c) all canonical color values from `tokens.css` present in output.'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-030
  description: Given `scripts/qa/verify-paragon-tokens.sh`, when the token build output is missing `--pgn-color-primary`,
    then the script exits non-zero with an error message identifying the missing token.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-031
  description: Given the verification script is added to `.github/ci-scripts-static.txt`, when CI runs, then token validation
    is part of the static-validation job.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-tokens.sh
    command: scripts/qa/verify-paragon-tokens.sh
- id: AC-TKN-032
  description: Given visual regression testing is configured, when MFE screenshots are compared before and after token migration,
    then pixel difference is less than 1% for each of the 9 MFE landing pages.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-runtime-deferred.sh
    command: scripts/qa/verify-paragon-runtime-deferred.sh
- id: AC-TKN-033
  description: Given `tutor-contrib-paragon` is installed (or equivalent in `mereka_lms.py`), when `tutor images build mfe`
    is run, then the token compilation step executes and the compiled CSS is included in the MFE image.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-theme-urls.sh
    command: scripts/qa/verify-paragon-theme-urls.sh
- id: AC-TKN-034
  description: Given the Tutor plugin, when `tutor config save` is run followed by `apply-patches.sh`, then `PARAGON_THEME_URLS`
    is present in the rendered MFE environment configuration.
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-paragon-theme-urls.sh
    command: scripts/qa/verify-paragon-theme-urls.sh
