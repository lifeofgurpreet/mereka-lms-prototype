# Testmap: Data Migrations Kajabi Mct
# Source Spec: specs/data-migrations-kajabi-mct_spec.md

spec: specs/data-migrations-kajabi-mct_spec.md
acceptance_criteria:
- id: AC-001
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kajabi-export.sh
    command: bash scripts/qa/verify-kajabi-export.sh
  description: Given valid Kajabi API credentials in Infisical, when `kajabi-export.mjs` runs, then all 17 resource types
    are exported to `exports/kajabi/` as NDJSON files with row counts matching the Kajabi API total headers (within 5% tolerance
    for pagination duplicates)
- id: AC-002
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mct-export.sh
    command: bash scripts/qa/verify-mct-export.sh
  description: Given valid MCT Azure AD credentials, when `mct-export.mjs` runs, then users, categories, courses, and enrollment
    data are exported to `exports/mct/` with row counts matching MCT platform statistics (within 1% tolerance)
- id: AC-003
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kajabi-completions-export.sh
    command: bash scripts/qa/verify-kajabi-completions-export.sh
  description: Given Kajabi completion tags exist, when `kajabi-export-completions.mjs` runs with `filter[has_tag_id]`, then
    completion records are exported with correct `tag_type` classification (course_completed, quiz_completed, started, onboarded,
    certificate)
- id: AC-004
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mct-video-urls.sh
    command: bash scripts/qa/verify-mct-video-urls.sh
  description: Given MCT video content with Azure SAS tokens, when `mct-export.mjs --resources courses --force` runs, then
    fresh video URLs are exported that are valid for at least 6 hours
- id: AC-005
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kajabi-transform.sh
    command: bash scripts/qa/verify-kajabi-transform.sh
  description: Given Kajabi NDJSON exports, when `transform_data.py` runs, then `users_import.csv` contains only users with
    at least one enrollment (approximately 73K, not 326K contacts)
- id: AC-006
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kajabi-transform.sh
    command: bash scripts/qa/verify-kajabi-transform.sh --check-enrollments
  description: Given Kajabi NDJSON exports, when `prepare_openedx_imports.py` runs, then `enrollments_import.csv` contains
    deduplicated (email, course_id) pairs
- id: AC-007
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mct-transform.sh
    command: bash scripts/qa/verify-mct-transform.sh
  description: Given MCT NDJSON exports, when `transform_data.py` runs with category-level mapping, then exactly 30 course
    packages are generated (not 81 or 178)
- id: AC-008
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mct-transform.sh
    command: bash scripts/qa/verify-mct-transform.sh --check-enrollment-dedup
  description: Given MCT enrollment data (2.3M raw records), when deduplication runs, then unique (user, category) pairs total
    approximately 441K records
- id: AC-009
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kajabi-olx-packages.sh
    command: bash scripts/qa/verify-kajabi-olx-packages.sh
  description: Given Kajabi course structure data, when `build_course_packages.py` runs, then 109 OLX tarballs are generated
    with correct course keys in `course-v1:MEREKA+MEKA-{id}+RUN-{id}` format
- id: AC-010
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mct-olx-packages.sh
    command: bash scripts/qa/verify-mct-olx-packages.sh
  description: Given MCT category/course/lesson hierarchy, when OLX packages are built, then each package has MCT Category
    as Course, MCT "Course" as Chapter/Section, and MCT Lesson as Unit/Vertical
- id: AC-011
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-user-import-counts.sh
    command: bash scripts/qa/verify-user-import-counts.sh --source kajabi
  description: Given `users_import.csv` from Kajabi (73K rows), when batched import runs, then Open edX user count increases
    by at least 72K (allowing for email collisions) and each user has a `UserProfile` record
- id: AC-012
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-user-import-counts.sh
    command: bash scripts/qa/verify-user-import-counts.sh --source mct
  description: Given `users.csv` from MCT (69K rows), when batched import runs, then Open edX user count increases by at least
    68K (allowing for email collisions with existing users)
- id: AC-013
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-cross-system-identity.sh
    command: bash scripts/qa/verify-cross-system-identity.sh
  description: Given a user email exists in both Kajabi and MCT exports, when both imports run, then exactly one Open edX
    user account exists for that email with enrollments from both source systems
- id: AC-014
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-migration-contracts.sh
    command: bash scripts/qa/verify-data-migration-contracts.sh --ac 014
  - type: manual
    runbook: docs/migrations/VERIFICATION_CHECKLIST.md
    section: Pod Restart Recovery
    justification: Requires intentional pod kill during active import; cannot be safely automated in production GKE cluster
  description: Given a batch import is interrupted by a pod restart, when the import is re-executed, then it resumes from
    the last successful offset without duplicating previously imported users
- id: AC-015
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-course-import-counts.sh
    command: bash scripts/qa/verify-course-import-counts.sh --source kajabi
  description: Given 109 Kajabi OLX tarballs, when `import_courses.py` runs against CMS, then MongoDB `modulestore.active_versions`
    increases by 109 and all courses are visible in Studio
- id: AC-016
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-course-import-counts.sh
    command: bash scripts/qa/verify-course-import-counts.sh --source mct
  description: Given 30 MCT OLX tarballs with Mux Video XBlocks, when imported to CMS, then all courses contain properly structured
    Sections (from MCT "Courses") and Units (from MCT Lessons) with video playback URLs
- id: AC-017
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-course-structure-sample.sh
    command: bash scripts/qa/verify-course-structure-sample.sh --source kajabi
  description: Given a specific imported Kajabi course, when queried via modulestore, then it contains the expected number
    of modules and lessons matching the source `course_structure.json`
- id: AC-018
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-course-structure-sample.sh
    command: bash scripts/qa/verify-course-structure-sample.sh --source mct --course basic-microsoft
  description: Given a specific imported MCT course (e.g., Basic Microsoft), when inspected in Studio, then it contains 12
    sections matching the 12 MCT "Courses" under that category
- id: AC-019
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enrollment-import-counts.sh
    command: bash scripts/qa/verify-enrollment-import-counts.sh --source kajabi
  description: Given Kajabi enrollment CSV (~147K unique pairs after dedup), when batched import runs, then Open edX enrollment
    count increases by at least 146K (allowing for skips where user or course not found)
- id: AC-020
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enrollment-import-counts.sh
    command: bash scripts/qa/verify-enrollment-import-counts.sh --source mct
  description: Given MCT enrollment CSV (~441K unique pairs), when batched import runs, then Open edX enrollment count increases
    by at least 440K (allowing for profile-related failures <1%)
- id: AC-021
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enrollment-skip-handling.sh
    command: bash scripts/qa/verify-enrollment-skip-handling.sh --check user-not-found
  description: Given an enrollment record where the user email is not found in Open edX, when the import processes that record,
    then it is skipped with a log entry and the batch continues without failure
- id: AC-022
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-enrollment-skip-handling.sh
    command: bash scripts/qa/verify-enrollment-skip-handling.sh --check course-not-found
  description: Given an enrollment record where the course key is not found in Open edX, when the import processes that record,
    then it is skipped with a log entry and the batch continues without failure
- id: AC-023
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-certificate-issuance.sh
    command: bash scripts/qa/verify-certificate-issuance.sh --source kajabi
  description: Given Kajabi `completions.ndjson` with `course_completed` tags and `tag_prefix_to_course_mapping.json`, when
    `issue_certificates.py` runs, then `GeneratedCertificate` records are created for all mappable (email, course_key) pairs
    with `CertificateStatuses.downloadable`
- id: AC-024
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-certificate-issuance.sh
    command: bash scripts/qa/verify-certificate-issuance.sh --check-counts
  description: Given 3,268 Kajabi completion records, when certificate issuance runs, then at least 3,265 certificates are
    issued (allowing for 3 unfound emails)
- id: AC-025
  verify:
  - type: manual
    runbook: docs/migrations/VERIFICATION_CHECKLIST.md
    section: MCT Program Certificates
    justification: ProgramCertificate verification requires Discovery admin UI navigation and Credentials service API inspection;
      not scriptable without admin session tokens
  description: Given MCT Programs configured in Discovery with ProgramCertificate records, when a user completes all courses
    in a program, then the Credentials service can issue a program certificate
- id: AC-026
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mux-video-upload.sh
    command: bash scripts/qa/verify-mux-video-upload.sh
  description: Given 503 MCT videos with fresh Azure SAS URLs, when `upload_videos_to_mux.py` runs, then all 503 assets are
    created in Mux with proper titles and playback IDs
- id: AC-027
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mux-video-upload.sh
    command: bash scripts/qa/verify-mux-video-upload.sh --check-captions
  description: Given 34 videos with VTT caption tracks, when uploaded to Mux, then caption tracks are associated with the
    corresponding Mux assets
- id: AC-028
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mct-olx-packages.sh
    command: bash scripts/qa/verify-mct-olx-packages.sh --check-video-xblocks
  description: Given Mux upload results, when OLX packages are rebuilt with `build_courses_with_mux.py`, then Video XBlocks
    contain `https://stream.mux.com/{PLAYBACK_ID}.m3u8` source URLs
- id: AC-029
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-kajabi-thumbnails.sh
    command: bash scripts/qa/verify-kajabi-thumbnails.sh
  description: Given 109 Kajabi courses with thumbnail URLs, when `upload_thumbnails.py` runs, then `course_image` field is
    updated in modulestore for each course
- id: AC-030
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/migrations/run-verification-pipeline.sh
    command: bash scripts/migrations/run-verification-pipeline.sh
  description: Given migration complete, when count verification runs via Django shell, then reported counts for Users, Enrollments,
    and Courses are within 0.5% of source export counts
- id: AC-031
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/migrations/run-verification-pipeline.sh
    command: bash scripts/migrations/run-verification-pipeline.sh && test -f scripts/migrations/kajabi/output/verification/summary.txt
  description: Given migration complete, when `verify-and-sync-kajabi-to-openedx.py` runs, then a comparison report is produced
    showing discrepancies per course with explanations
- id: AC-032
  verify:
  - type: manual
    runbook: docs/migrations/VERIFICATION_CHECKLIST.md
    section: Studio Course Spot-Check
    justification: Visual rendering verification requires human inspection of Studio UI for 10 sample courses to confirm section/unit/content
      display
  description: Given migration complete, when a sample of 10 courses is inspected via Studio UI, then course structure (sections,
    units, content) renders correctly
- id: AC-033
  verify:
  - type: manual
    runbook: docs/migrations/VERIFICATION_CHECKLIST.md
    section: User Login Spot-Check
    justification: User login and dashboard verification requires browser-based interaction with the LMS as specific users
  description: Given migration complete, when a sample of 5 users logs into the LMS, then their enrolled courses are visible
    in the dashboard
- id: AC-034
  verify:
  - type: manual
    runbook: docs/migrations/VERIFICATION_CHECKLIST.md
    section: Full Rollback Test
    justification: Full database restore is a destructive operation that must be tested manually in a staging environment
      with operator oversight
  description: Given a database backup taken before import, when `tutor local do restore-db` runs, then Open edX reverts to
    pre-migration state
- id: AC-035
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-rollback-dry-run.sh
    command: bash scripts/qa/verify-rollback-dry-run.sh
  description: Given the rollback script `rollback-openedx-imports.py`, when run with `--action unenroll --dry-run`, then
    it reports the number of enrollments that would be removed without modifying data
- id: AC-036
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-idempotency.sh
    command: bash scripts/qa/verify-idempotency.sh
  description: Given a failed import, when re-executing the import pipeline from the beginning, then no duplicate records
    are created (idempotency)
- id: AC-037
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-idempotency.sh
    command: bash scripts/qa/verify-idempotency.sh --full-pipeline
  description: Given the full pipeline has already been run once, when the entire pipeline is re-executed with the same export
    data, then entity counts remain unchanged (no duplicates, no data loss)
- id: AC-038
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-incremental-sync.sh
    command: bash scripts/qa/verify-incremental-sync.sh
  description: Given new users/enrollments have appeared in Kajabi since last export, when a fresh export and import runs,
    then only net-new records are created and existing records are updated
- id: AC-039
  description: Kajabi webhook healthcheck returns 200 when secret configured
  verify:
  - type: automated
    test_type: unit
    file: services/kajabi-webhook/main.py
    command: curl -sf http://localhost:8080/healthz | grep -q ok
- id: AC-040
  description: Valid webhook with HMAC signature persists event to outbox
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-migration-contracts.sh
    command: bash scripts/qa/verify-data-migration-contracts.sh --ac 040
  - type: manual
    runbook: docs/operations/TROUBLESHOOTING.md
    section: Kajabi Webhook Testing
    justification: Requires running webhook service and valid HMAC signature computation
- id: AC-041
  description: Invalid signature returns HTTP 401
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-migration-contracts.sh
    command: bash scripts/qa/verify-data-migration-contracts.sh --ac 041
  - type: manual
    runbook: docs/operations/TROUBLESHOOTING.md
    section: Kajabi Webhook Testing
    justification: Requires running webhook service with crafted invalid signature
- id: AC-042
  description: Missing event key returns HTTP 400
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-migration-contracts.sh
    command: bash scripts/qa/verify-data-migration-contracts.sh --ac 042
  - type: manual
    runbook: docs/operations/TROUBLESHOOTING.md
    section: Kajabi Webhook Testing
    justification: Requires running webhook service with crafted payload
- id: AC-043
  description: Unknown event type written to unknown__ outbox file
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-migration-contracts.sh
    command: bash scripts/qa/verify-data-migration-contracts.sh --ac 043
  - type: manual
    runbook: docs/operations/TROUBLESHOOTING.md
    section: Kajabi Webhook Testing
    justification: Requires running webhook service with non-standard event type
- id: AC-044
  description: Missing KAJABI_WEBHOOK_SECRET returns HTTP 500 on healthcheck
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-migration-contracts.sh
    command: bash scripts/qa/verify-data-migration-contracts.sh --ac 044
  - type: manual
    runbook: docs/operations/TROUBLESHOOTING.md
    section: Kajabi Webhook Testing
    justification: Requires running webhook service without secret env var
