# Testmap for Authentication & SSO Enterprise Integration
# Maps acceptance criteria from spec to test files for traceability
# Verify coverage: python ~/projects/team-skills/plugins/core/skills/specs-vs-docs/tools/check_test_coverage.py specs/testmaps/auth-sso-enterprise_testmap.yaml

spec: specs/auth-sso-enterprise_spec.md
tests:
  # Identity Provider Federation
  - criterion: "AC-001: Given an enterprise tenant 'Acme Corp' with an Okta SAML IdP configured, when a user navigates tohttps://academyv2.mereka.io/enterprise/login/acme-corp, thenthey are redirected to Acme's Okta IdP login page"
    test_file: tests/e2e/test_enterprise_sso_flow.py
    test_name: "test_enterprise_saml_login_redirect_okta"
    type: e2e

  - criterion: "AC-001: Invalid tenant slug returns HTTP 404"
    test_file: tests/unit/test_enterprise_routing.py
    test_name: "test_enterprise_login_invalid_tenant_404"
    type: unit

  - criterion: "AC-002: Given an enterprise tenant 'Beta Inc'with an Azure AD OIDC provider configured, when a user navigates to https://academyv2.mereka.io/enterprise/login/beta-inc, then they are redirected to Beta's Azure AD authorization endpoint with PKCE parameters"
    test_file: tests/e2e/test_enterprise_sso_flow.py
    test_name: "test_enterprise_oidc_login_redirect_azure_ad"
    type: e2e

  - criterion: "AC-002: OIDC redirect includes PKCE parameters"
    test_file: tests/unit/test_oidc_pkce.py
    test_name: "test_oidc_authorization_includes_pkce_challenge"
    type: unit

  - criterion: "AC-003: Given two enterprise tenants with different IdPs, when a user authenticates via Acme's IdP, then the resulting EnterpriseCustomerUser record links to Acme only; no link to Beta is created"
    test_file: tests/integration/test_tenant_isolation.py
    test_name: "test_authentication_creates_single_tenant_link"
    type: integration

  - criterion: "AC-003: Cross-tenant IdP linking prevention"
    test_file: tests/integration/test_tenant_isolation.py
    test_name: "test_cross_tenant_assertion_rejected"
    type: integration

  - criterion: "AC-004: Given Authentik is configured as thedefault OIDC provider, when a non-enterprise user navigates to /auth/login/oidc/, then they are redirected to Authentik'sauthorize endpoint (existing behavior preserved)"
    test_file: tests/integration/test_authentik_oidc.py
    test_name: "test_authentik_oidc_redirect_preserved"
    type: integration

  - criterion: "AC-004: Authentik OIDC unchanged after enterprise SSO enabled"
    test_file: tests/integration/test_backward_compat.py
    test_name: "test_authentik_oidc_backward_compat"
    type: integration

  - criterion: "AC-005: Given a tenant with SAML IdP configured, when the LMS SP metadata is requested at /auth/saml/metadata.xml, then valid SP metadata is returned containing the ACS URL, entity ID, and signing certificate"
    test_file: tests/integration/test_saml_metadata.py
    test_name: "test_sp_metadata_generation"
    type: integration

  - criterion: "AC-005: SP metadata validates against SAML 2.schema"
    test_file: tests/unit/test_saml_metadata_schema.py
    test_name: "test_sp_metadata_schema_validation"
    type: unit

  # SAML Security
  - criterion: "AC-006: Given a valid SAML assertion from Acme's IdP, when the assertion signature is verified and time window is valid, then the user is authenticated and a session is created"
    test_file: tests/integration/test_saml_authentication.py
    test_name: "test_valid_saml_assertion_authenticates_user"
    type: integration

  - criterion: "AC-006: SAML attribute mapping extracts userfields"
    test_file: tests/unit/test_saml_attribute_mapping.py
    test_name: "test_saml_attribute_extraction"
    type: unit

  - criterion: "AC-007: Given a SAML assertion with an expired NotOnOrAfter timestamp (beyond clock skew tolerance), whenprocessed, then the assertion is rejected and a security event is logged"
    test_file: tests/unit/test_saml_validation.py
    test_name: "test_expired_assertion_rejected"
    type: unit

  - criterion: "AC-007: Clock skew tolerance allows assertions within boundary"
    test_file: tests/unit/test_saml_validation.py
    test_name: "test_assertion_within_clock_skew_accepted"
    type: unit

  - criterion: "AC-008: Given a SAML assertion that has already been processed (replay), when the same assertion ID is submitted again, then the assertion is rejected with 'Assertionreplay detected' and a security event is logged"
    test_file: tests/integration/test_saml_replay_prevention.py
    test_name: "test_duplicate_assertion_id_rejected"
    type: integration

  - criterion: "AC-008: Assertion ID cache has correct TTL"
    test_file: tests/unit/test_saml_replay_cache.py
    test_name: "test_assertion_id_cache_ttl"
    type: unit

  - criterion: "AC-009: Given a SAML assertion signed with SHA-1, when processed, then the assertion is rejected and a security event is logged indicating weak signature algorithm"
    test_file: tests/unit/test_saml_signature_validation.py
    test_name: "test_sha1_signature_rejected"
    type: unit

  - criterion: "AC-009: Strong signature algorithms accepted"
    test_file: tests/unit/test_saml_signature_validation.py
    test_name: "test_strong_signatures_accepted"
    type: unit

  - criterion: "AC-010: Given a SAML assertion with an Issuerthat does not match any configured tenant IdP entity ID, when processed, then the assertion is rejected and a security event is logged"
