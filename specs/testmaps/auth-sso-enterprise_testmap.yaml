  - criterion: "AC-012: Given an OIDC ID token with an expired exp claim, when validated, then the token is rejected and authentication fails with a clear error message"
    test_file: tests/unit/test_oidc_token_validation.py
    test_name: "test_expired_id_token_rejected"
