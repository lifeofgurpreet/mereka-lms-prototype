  verify: []
- id: AC-MTA-020
  description: Given platform operator (superuser) in Superset, when they query the
    cross-tenant overview dashboard, then aggregate data from all tenants is visible
  verify: []
- id: AC-MTA-021
  description: Given valid provisioning inputs, when `scripts/tenants/provision-tenant.sh`
    runs, then all required records (Site, SiteConfiguration, EnterpriseCustomer,
    catalogs, subscriptions, access policies) are created within 15 minutes
  verify: []
- id: AC-MTA-022
  description: Given tenant "Acme Corp" is offboarded, when the offboarding script
