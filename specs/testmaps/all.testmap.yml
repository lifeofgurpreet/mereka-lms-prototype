spec: multi-tenancy-architecture_spec.md
acceptance_criteria:
- id: AC-MTA-001
  description: Given a new enterprise client "Acme Corp", when the provisioning script
    runs with `--slug=acme-corp --name="Acme Corp" --domain=acme.academyv2.mereka.io`,
    then an `EnterpriseCustomer` record is created with a unique UUID, a Django `Site`
    with the specified domain, and a `SiteConfiguration` with Mereka default values
  verify: []
- id: AC-MTA-002
  description: Given tenant "Acme Corp" exists, when the provisioning script runs
    again with the same slug, then no duplicate records are created and the script
    exits with a success message indicating "already provisioned"
  verify: []
- id: AC-MTA-003
  description: Given tenant A (Acme) and tenant B (Beta), when admin A calls `GET
    /api/v1/enterprise-catalogs/`, then zero catalogs belonging to tenant B are returned
  verify: []
- id: AC-MTA-004
  description: Given tenant A and tenant B, when admin A calls `GET /api/v1/subscriptions/`
    with tenant B's UUID in the path, then the response is HTTP 403
  verify: []
- id: AC-MTA-005
  description: Given tenant A and tenant B, when admin A queries ClickHouse analytics
    via Superset, then zero xAPI events with tenant B's UUID are visible
  verify: []
- id: AC-MTA-006
  description: Given tenant A and tenant B, when a raw SQL query `SELECT * FROM enterprise_enterprisecustomer`
    is executed by a non-superuser database role, then only the requesting service's
    scoped records are returned (database user grants prevent cross-schema access
    for enterprise service databases)
  verify: []
- id: AC-MTA-007
  description: Given a learner belonging to both tenant A and tenant B, when they
    log into the enterprise learner portal and select tenant A, then only tenant A's
    catalog, licenses, and enrollment data are visible
  verify: []
- id: AC-MTA-008
  description: Given tenant "Acme Corp" with a custom logo configured in `SiteConfiguration`,
    when a learner navigates to `acme.academyv2.mereka.io`, then the Acme Corp logo
    is displayed (not the default Mereka logo)
  verify: []
- id: AC-MTA-009
  description: Given tenant "Acme Corp" with custom brand colors configured, when
    the login page loads at `acme.academyv2.mereka.io`, then the primary brand color
    matches the configured value
  verify: []
- id: AC-MTA-010
  description: Given tenant "Acme Corp" with a custom footer configured, when any
    page loads, then the footer displays Acme Corp branding (not default Mereka footer)
  verify: []
- id: AC-MTA-011
  description: Given a tenant branding asset update (new logo), when `collectstatic`
    is run, then the updated logo is served without requiring an image rebuild
  verify: []
- id: AC-MTA-012
  description: Given tenant "Acme Corp" with domain `acme.academyv2.mereka.io`, when
    a browser requests that domain, then the LMS responds with the correct Acme-branded
    page
  verify: []
- id: AC-MTA-013
  description: Given tenant "Acme Corp" with a client-owned domain `learning.acmecorp.com`
    configured as a CNAME, when a browser requests that domain, then the LMS responds
    with the correct Acme-branded page and a valid SSL certificate
  verify: []
- id: AC-MTA-014
  description: Given two tenants with different domains, when requests arrive simultaneously
    for both domains, then each request resolves the correct `SiteConfiguration` based
    on `Host` header
  verify: []
- id: AC-MTA-015
  description: Given tenant "Acme Corp" with SAML IdP configured, when a user navigates
    to `/enterprise/login/acme-corp`, then they are redirected to Acme's IdP
  verify: []
- id: AC-MTA-016
  description: Given a successful SAML assertion from Acme's IdP for a new user, when
    processed, then the user is auto-provisioned and linked to the Acme `EnterpriseCustomer`
  verify: []
- id: AC-MTA-017
  description: Given tenant A's IdP and tenant B's IdP, when a user authenticates
    via tenant A's IdP, then they are linked to tenant A only (no cross-tenant linking
    from the SAML flow)
  verify: []
- id: AC-MTA-018
  description: Given tenant "Acme Corp" with enrolled learners, when a learner completes
    a course, then the xAPI event in ClickHouse includes `enterprise_customer_uuid`
    matching Acme's UUID
  verify: []
- id: AC-MTA-019
  description: Given tenant "Acme Corp" admin in Superset, when they query the enrollment
