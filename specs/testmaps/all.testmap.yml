    = '{acme_uuid}'` returns 0 across all enterprise service databases
  verify: []
- id: AC-MTA-023
  description: Given tenant "Acme Corp" is offboarded, when ClickHouse is queried,
    then zero events with Acme's UUID exist
  verify: []
- id: AC-MTA-024
  description: 'Given a tenant offboarding action, when it completes, then an audit
    log entry exists with: tenant UUID, action "offboarded", actor, timestamp'
  verify: []
- id: AC-MTA-025
  description: Given tenants A and B are provisioned, when `scripts/qa/verify-tenant-isolation.sh
