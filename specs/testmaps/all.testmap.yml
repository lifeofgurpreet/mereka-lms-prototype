  verify: []
- id: AC-MAS-021
  description: Given a pull request from a forked repository, when it triggers a workflow,
    then GitHub Actions secrets are NOT available to the workflow steps (GitHub default
    behavior, verified by workflow configuration).
  verify: []
- id: AC-MAS-022
  description: Given the Android CI/CD workflow, when the build completes (success
