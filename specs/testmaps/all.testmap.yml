  verify: []
- id: AC-MAS-023
  description: Given the iOS app config at `default_config/mereka/prod/shared.yaml`,
    when `OAUTH_CLIENT_ID` is read, then it equals `mereka-mobile-app` and matches
    the OAuth application registered in the LMS.
  verify: []
- id: AC-MAS-024
  description: Given the iOS app config at `default_config/mereka/prod/ios.yaml`,
