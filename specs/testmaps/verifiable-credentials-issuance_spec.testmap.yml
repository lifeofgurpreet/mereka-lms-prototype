spec: verifiable-credentials-issuance_spec.md
acceptance_criteria:
- id: AC-CRED-020
  description: Given a learner completes a program, when the credential event is processed,
    then a signed OBv3 VC is stored in the Credentials Service within 30 seconds
  verify: []
- id: AC-CRED-021
  description: Given a learner views the Learner Record MFE, when they have earned
    credentials, then a "Get Verifiable Credential" button is visible for each eligible
    credential
  verify: []
- id: AC-CRED-022
  description: Given a learner clicks "Get Verifiable Credential", when a QR code
    is displayed, then scanning it with LCW successfully stores the VC in the wallet
  verify: []
- id: AC-CRED-023
  description: Given a claim token is generated, when it is used after 10 minutes,
    then the Credentials Service returns HTTP 401 (expired)
  verify: []
- id: AC-CRED-024
  description: Given a claim token is used once, when it is used a second time, then
    the Credentials Service returns HTTP 401 (consumed)
  verify: []
- id: AC-CRED-025
  description: Given a credential public URL, when opened in a browser, then the page
    displays credential details with Open Graph metadata and an "Add to LinkedIn"
    button
  verify: []
- id: AC-CRED-026
  description: Given a learner clicks "Add to LinkedIn", when redirected to LinkedIn,
    then the certification form is pre-populated with credential name, issuer, date,
    and URL
  verify: []
- id: AC-CRED-027
  description: Given the QR flow, when LCW scans the code but the Credentials Service
    is temporarily unavailable, then LCW shows a retry prompt (not a crash)
  verify: []
_unmapped:
