# Testmap: platform-middleware-custom-apps_spec.md
# Maps every Acceptance Criterion to its verification method.
# Generated: 2026-02-10

spec: specs/platform-middleware-custom-apps_spec.md
plan: specs/plans/platform-middleware-custom-apps_plan.md
testplan: specs/plans/platform-middleware-custom-apps_testplan.md
tier: 2

acceptance_criteria:
  # --- MerekaPlatformAdminMiddleware ---
  - id: AC-001
    description: "Authenticated user with email in MEREKA_PLATFORM_ADMIN_EMAILS but is_staff=False gets auto-escalated"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check admin-escalation
    automated: true
    priority: P1

  - id: AC-002
    description: "Authenticated user already with is_staff=True does not trigger redundant user.save()"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check admin-no-duplicate-save
    automated: true
    priority: P2

  - id: AC-003
    description: "User with email NOT in MEREKA_PLATFORM_ADMIN_EMAILS is not modified"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check admin-non-admin-user
    automated: true
    priority: P1

  # --- MerekaCookieDomainMiddleware ---
  - id: AC-004
    description: "Request to apps.academyv2.mereka.io sets sessionid cookie with domain=.academyv2.mereka.io"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check cookie-domain-mereka
    automated: true
    priority: P1

  - id: AC-005
    description: "Request to academy.biji-biji.com sets sessionid cookie with domain=.biji-biji.com"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check cookie-domain-biji
    automated: true
    priority: P1

  - id: AC-006
    description: "Request to apps.academy.biji-biji.com sets sessionid cookie with domain=.biji-biji.com (not .apps.academy.biji-biji.com)"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check cookie-domain-biji-subdomain
    automated: true
    priority: P1

  - id: AC-007
    description: "Request to localhost:8000 sets sessionid cookie with no domain attribute (host-only)"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check cookie-domain-localhost
    automated: true
    priority: P2

  - id: AC-008
    description: "Site.objects.get_current() with request to apps.academyv2.mereka.io returns correct Site row"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check sites-framework-patch
    automated: true
    priority: P1

  # --- MerekaForwardedHeadersMiddleware ---
  - id: AC-009
    description: "Request with X-Forwarded-Proto: https,http normalizes to 'https'"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check forwarded-proto-normalize
    automated: true
    priority: P1

  - id: AC-010
    description: "Request with CF-Visitor: {\"scheme\":\"https\"} sets X-Forwarded-Proto to 'https'"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check cf-visitor-parse
    automated: true
    priority: P1

  - id: AC-011
    description: "Request to /metrics with Host: 10.97.0.2:8000 rewrites Host to MEREKA_LMS_DOMAIN"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check metrics-host-rewrite
    automated: true
    priority: P1

  - id: AC-012
    description: "Request to https://academyv2.mereka.io with no X-Forwarded-Proto forces 'https'"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check forwarded-proto-force-https
    automated: true
    priority: P1

  # --- MFE OAuth Fix ---
  - id: AC-013
    description: "Request to /api/mfe_context with empty providers array gets OAuth providers injected"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-custom-apps.sh
        command: scripts/qa/verify-custom-apps.sh --check mfe-oauth-inject-empty
    automated: true
    priority: P1

  - id: AC-014
    description: "OAuth2ProviderConfig with slug='oidc' and name='Authentik' displays as 'Mereka'"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-custom-apps.sh
        command: scripts/qa/verify-custom-apps.sh --check mfe-oauth-rename-authentik
    automated: true
    priority: P1

  - id: AC-015
    description: "Request to /api/mfe_context with existing Authentik provider rewrites name to 'Mereka'"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-custom-apps.sh
        command: scripts/qa/verify-custom-apps.sh --check mfe-oauth-rewrite-existing
    automated: true
    priority: P1

  - id: AC-016
    description: "Request to /api/user/v1/me is not modified (middleware only intercepts /api/mfe_context)"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-custom-apps.sh
        command: scripts/qa/verify-custom-apps.sh --check mfe-oauth-path-filter
    automated: true
    priority: P2

  # --- openedx_prometheus ---
  - id: AC-017
    description: "Request to /metrics returns HTTP 200 with content-type text/plain"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-custom-apps.sh
        command: scripts/qa/verify-custom-apps.sh --check prometheus-metrics-endpoint
    automated: true
    priority: P1

  - id: AC-018
    description: "Prometheus /metrics includes django_http_requests_total_by_method and other core metrics"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-custom-apps.sh
        command: scripts/qa/verify-custom-apps.sh --check prometheus-metrics-content
    automated: true
    priority: P1

  # --- Feature Flags ---
  - id: AC-019
    description: "MerekaPlatformAdminMiddleware enabled only when MEREKA_PLATFORM_ADMIN_EMAILS is non-empty"
    verify:
      - type: automated
        test_type: shell_verification
        file: scripts/qa/verify-middleware-stack.sh
        command: scripts/qa/verify-middleware-stack.sh --check admin-feature-flag
    automated: true
    priority: P1

  - id: AC-020
    description: "openedx_prometheus app gracefully degrades if django-prometheus is not installed"
    verify:
      - type: manual
        test_type: manual_verification
        file: docs/operations/MIDDLEWARE_VERIFICATION.md
        command: Manual test with missing django-prometheus dependency
    automated: false
    priority: P3
