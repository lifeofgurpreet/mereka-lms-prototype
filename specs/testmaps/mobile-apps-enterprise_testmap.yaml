# Testmap for Mobile Apps (iOS + Android) Enterprise Deployment
# Maps acceptance criteria from spec to test files for traceability
# Verify coverage: python ~/projects/team-skills/plugins/core/skills/specs-vs-docs/tools/check_test_coverage.py specs/testmaps/mobile-apps-enterprise_testmap.yaml

spec: specs/mobile-apps-enterprise_spec.md
tests:
  # OAuth 2.0 Authentication (iOS)
  - criterion: "AC-001: Given a new user on iOS, when they tap Sign In, then the system browser opens to the LMS OAuth authorize endpoint with PKCE parameters (code_challenge, code_challenge_method=S256, response_type=code, client_id=mereka-mobile-app)"
    test_file: tests/mobile/e2e/ios/test_oauth_flow.py
    test_name: "test_ios_oauth_pkce_authorization"
    type: e2e

  - criterion: "AC-001: Apple Sign-In integration"
    test_file: tests/mobile/e2e/ios/test_apple_signin.py
    test_name: "test_apple_signin_flow"
    type: e2e

  # OAuth 2.0 Authentication (Android)
  - criterion: "AC-002: Given a new user on Android, when they tap Sign In, then a Custom Tab opens to the LMS OAuth authorize endpoint with identical PKCE parameters"
    test_file: tests/mobile/e2e/android/test_oauth_flow.py
    test_name: "test_android_oauth_pkce_authorization"
    type: e2e

  - criterion: "AC-002: Google Sign-In integration"
    test_file: tests/mobile/e2e/android/test_google_signin.py
    test_name: "test_google_signin_flow"
    type: e2e

  # Token Storage
  - criterion: "AC-003: Given a successful authorization codecallback, when the app exchanges the code for tokens, then the access token and refresh token are stored in platform-secure storage (Keychain on iOS, EncryptedSharedPreferences on Android)"
    test_file: tests/mobile/integration/ios/test_token_storage.swift
    test_name: "testTokensStoredInKeychainWithCorrectAccessLevel"
    type: integration

  - criterion: "AC-003: Android token storage in EncryptedSharedPreferences"
    test_file: tests/mobile/integration/android/TokenStorageTest.kt
    test_name: "testTokensStoredInEncryptedSharedPreferences"
    type: integration

  # Token Lifecycle Management
  - criterion: "AC-004: Given a stored access token with < 5minutes remaining validity, when the app makes an API call, then the token is refreshed proactively before the call proceeds"
    test_file: tests/mobile/unit/ios/TokenManagerTests.swift
    test_name: "testProactiveTokenRefreshWhenExpiringIn5Minutes"
    type: unit

  - criterion: "AC-004: Android proactive token refresh"
    test_file: tests/mobile/unit/android/TokenManagerTest.kt
    test_name: "testProactiveTokenRefreshWhenExpiringIn5Minutes"
    type: unit

  - criterion: "AC-005: Given a concurrent burst of 10 API calls during token refresh, when the refresh is in-flight, thenexactly one token refresh request is sent to the backend (single-flight)"
    test_file: tests/mobile/integration/ios/test_token_refresh_concurrency.swift
    test_name: "testSingleFlightTokenRefresh"
    type: integration

  - criterion: "AC-005: Android single-flight token refresh"
    test_file: tests/mobile/integration/android/TokenRefreshConcurrencyTest.kt
    test_name: "testSingleFlightTokenRefresh"
    type: integration

  - criterion: "AC-006: Given a 401 response from the API, when the refresh token is still valid, then the app refreshes the token and retries the original request exactly once"
    test_file: tests/mobile/integration/ios/test_token_retry_401.swift
    test_name: "testRetryAPICallAfterTokenRefreshOn401"
    type: integration

  - criterion: "AC-006: Android retry on 401"
    test_file: tests/mobile/integration/android/TokenRetry401Test.kt
    test_name: "testRetryAPICallAfterTokenRefreshOn401"
    type: integration

  - criterion: "AC-007: Given a failed token refresh (invalid/expired refresh token), when the app detects the failure, then the user is redirected to the login screen and all tokensare cleared"
    test_file: tests/mobile/integration/ios/test_token_refresh_failure.swift
    test_name: "testRedirectToLoginOnRefreshFailure"
    type: integration

  - criterion: "AC-007: Android redirect to login on refreshfailure"
    test_file: tests/mobile/integration/android/TokenRefreshFailureTest.kt
    test_name: "testRedirectToLoginOnRefreshFailure"
    type: integration

  - criterion: "AC-008: Given an authenticated user who tapsLogout, when logout completes, then the refresh token is revoked server-side and all local tokens, cached user data, and branding overrides are cleared"
