    test_name: "test_ios_logout_clears_all_data"
    type: e2e

  - criterion: "AC-008: Android logout flow"
    test_file: tests/mobile/e2e/android/test_logout_flow.py
    test_name: "test_android_logout_clears_all_data"
    type: e2e

