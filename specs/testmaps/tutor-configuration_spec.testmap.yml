spec: tutor-configuration_spec.md
acceptance_criteria:
- id: AC-001
  description: '`grep mysql-native-password=ON tutor_env/env/local/docker-compose.yml`
    returns results'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/infra/tutor-config-save.sh
    command: scripts/infra/tutor-config-save.sh
  - type: automated
    test_type: shell_verification
    file: scripts/infra/verify-tutor-patches.sh
    command: scripts/infra/verify-tutor-patches.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mfe-build-prereqs.sh
    command: scripts/qa/verify-mfe-build-prereqs.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mfe-image-branding.sh
    command: scripts/qa/verify-mfe-image-branding.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
- id: AC-002
  description: '`grep "NODE_OPTIONS.*6144" tutor_env/env/build/openedx/Dockerfile`
    returns results'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-003
  description: '`grep "academy.biji-biji.com" tutor_env/env/apps/openedx/settings/lms/production.py`
    returns results'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-004
  description: '`grep "mfe_oauth_fix" tutor_env/env/apps/openedx/settings/lms/production.py`
    returns results'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-005
  description: '`grep "django_prometheus" tutor_env/env/apps/openedx/settings/lms/production.py`
    returns results'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-patches.sh
    command: scripts/qa/verify-tutor-patches.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
- id: AC-006
  description: MFE images build successfully with Node 18
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-mfe-build-contract.sh
    command: scripts/qa/verify-mfe-build-contract.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
    runbook: docs/ops/runbooks/TUTOR_CONFIGURATION_RUNBOOK.md
    section: MFE Build Verification
    justification: Full image build (15-20 min) cannot run in CI; script verifies
      Dockerfile contract
- id: AC-007
  description: MySQL 8 connections succeed without authentication errors
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-services.sh
    command: scripts/qa/verify-tutor-services.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
    runbook: docs/ops/runbooks/TUTOR_CONFIGURATION_RUNBOOK.md
    section: MySQL Authentication Verification
    justification: Requires running MySQL 8 Docker container; cannot run in CI without
      Docker-in-Docker
- id: AC-008
  description: All three production domains (academyv2.mereka.io, academy.biji-biji.com,
    skillourfuture.academy.mereka.io) resolve and accept logins
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-multisite-domains.sh
    command: scripts/qa/verify-tutor-multisite-domains.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-009
  description: Mereka logo and custom footer render on all MFEs
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-branding-render.sh
    command: scripts/qa/verify-tutor-branding-render.sh
  - type: manual
    runbook: docs/ops/runbooks/TUTOR_CONFIGURATION_RUNBOOK.md
    section: Visual Branding Verification
    justification: Visual rendering requires browser inspection; automated checks
      verify file presence only
- id: AC-010
  description: '`tutor local dc ps` shows all services with status "Up"'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-tutor-services.sh
    command: scripts/qa/verify-tutor-services.sh
  - type: manual
    runbook: docs/ops/runbooks/TUTOR_CONFIGURATION_RUNBOOK.md
    section: Service Health Verification
    justification: Requires running Docker Compose stack; cannot run in standard CI

