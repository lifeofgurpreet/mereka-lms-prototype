# disaster-recovery-business-continuity_testmap.yaml
# Maps every Acceptance Criterion from the DR/BC spec to its verification method.
# Generated: 2026-02-10

spec: "specs/disaster-recovery-business-continuity_spec.md"

acceptance_criteria:

  # --- Backup Infrastructure ---

  - id: "AC-001"
    description: "All three Velero schedules active with recent Completed backups"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "./scripts/qa/audit-velero.sh --json"

  - id: "AC-002"
    description: "volumeSnapshotsCompleted matches Bound PVC count for hourly-critical"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "./scripts/qa/audit-velero.sh --json"
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/list-critical-backup-pvcs.sh"
        command: "./scripts/qa/list-critical-backup-pvcs.sh --json"

  - id: "AC-003"
    description: "BackupStorageLocation phase is Available"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "kubectl -n velero get backupstoragelocation default -o jsonpath='{.status.phase}' | grep -q Available"

  - id: "AC-004"
    description: "No critical stateful service uses emptyDir for persistent data"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero.sh"
        command: "./scripts/qa/audit-velero.sh --json"

  # --- Restore Drills ---

  - id: "AC-005"
    description: "Monthly restore-test CronJob creates throwaway NS, restores PVCs to Bound, MySQL SELECT 1 succeeds"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/infra/fix-velero-restore-test.sh"
        command: "RUN_NOW=1 ./scripts/infra/fix-velero-restore-test.sh"
      - type: "automated"
        test_type: "integration"
        file: "infrastructure/k8s/velero/restore-test-script.sh"
        command: "kubectl -n velero create job --from=cronjob/restore-test restore-test-manual-$(date +%s)"

  - id: "AC-006"
    description: "At least 1 PVC in Bound state after restore drill"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "infrastructure/k8s/velero/restore-test-script.sh"
        command: "kubectl -n velero-restore-test get pvc -o jsonpath='{.items[*].status.phase}' | grep -q Bound"

  - id: "AC-007"
    description: "fix-velero-restore-test.sh passes end-to-end including PV validation and MySQL probe"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/infra/fix-velero-restore-test.sh"
        command: "RUN_NOW=1 ./scripts/infra/fix-velero-restore-test.sh"

  - id: "AC-008"
    description: "backup-verification CronJob confirms backup freshness within 2h (hourly) and 26h (daily)"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero-alert-pipeline.sh"
        command: "STRICT_RUNTIME=1 ./scripts/qa/audit-velero-alert-pipeline.sh --json"

  # --- DR Evidence ---

  - id: "AC-009"
    description: "DR evidence bundle tarball contains all 6 required artifacts"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/build-dr-evidence-bundle.sh"
        command: "STRICT_RUNTIME=1 ./scripts/qa/build-dr-evidence-bundle.sh --tar"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/collect-velero-evidence.sh"
        command: "./scripts/qa/collect-velero-evidence.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/backup-db.sh"
        command: "./scripts/infra/backup-db.sh --verify"

  - id: "AC-010"
    description: "GitHub Actions DR Evidence Bundle workflow runs monthly with 120-day artifact retention"
    verify:
      - type: "automated"
        test_type: "integration"
        file: ".github/workflows/dr-evidence-bundle.yml"
        command: "grep -q 'cron:' .github/workflows/dr-evidence-bundle.yml && grep -q 'retention-days: 120' .github/workflows/dr-evidence-bundle.yml"

  - id: "AC-011"
    description: "Complete evidence bundle generated within 1 business day on request"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "DR Evidence Generation"
        justification: "Requires human to initiate enterprise audit request and verify completeness against client requirements"

  # --- Alert Pipeline ---

  - id: "AC-012"
    description: "Backup failure alert fires within 1 hour"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero-alert-pipeline.sh"
        command: "STRICT_RUNTIME=1 ./scripts/qa/audit-velero-alert-pipeline.sh --json"
      - type: "monitoring"
        metric: "velero_backup_failure_total"
        dashboard: "GCP Cloud Monitoring > Velero Alerts"

  - id: "AC-013"
    description: "Stale restore-test (>45 days) detected by audit pipeline"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero-alert-pipeline.sh"
        command: "STRICT_RUNTIME=1 ./scripts/qa/audit-velero-alert-pipeline.sh --json"
      - type: "monitoring"
        metric: "dr_restore_drill_age_days"
        dashboard: "GCP Cloud Monitoring > Velero Alerts"

  - id: "AC-014"
    description: "Alert pipeline validates both backup-verification and restore-test freshness"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/audit-velero-alert-pipeline.sh"
        command: "./scripts/qa/audit-velero-alert-pipeline.sh --json"

  # --- Recovery Procedures ---

  - id: "AC-015"
    description: "Single PVC restored from hourly backup within 30 minutes (DR-002)"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "DR-002: Single PVC Data Corruption"
        justification: "Requires live cluster with simulated PVC failure; destructive test cannot be fully automated against production"

  - id: "AC-016"
    description: "Full namespace restore via velero restore create within 1 hour (DR-003)"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "DR-003: Namespace Deletion/Corruption"
        justification: "Full namespace restore requires human approval gate and coordination; tested during quarterly drills"

  - id: "AC-017"
    description: "Secret rotation completes within 1 hour following DR-006 checklist"
    verify:
      - type: "manual"
        runbook: "docs/operations/SECRET_ROTATION_CHECKLIST.md"
        section: "Full Rotation Procedure"
        justification: "Secret rotation touches Infisical, GCP SM, and K8s in sequence; requires human verification of non-disruption"

  - id: "AC-018"
    description: "Full cluster rebuild within 4 hours with RPO <= 1 hour (DR-007)"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "DR-007: Full Cluster Loss"
        justification: "Full cluster rebuild cannot be automated as a test; verified via semi-annual tabletop exercise"

  # --- Data Integrity ---

  - id: "AC-019"
    description: "MySQL auth_user COUNT within 5% of pre-incident count post-restore"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "infrastructure/k8s/velero/restore-test-script.sh"
        command: "kubectl -n velero-restore-test exec deploy/mysql -- mysql -e 'SELECT COUNT(*) FROM openedx.auth_user'"
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "Data Integrity Verification"
        justification: "5% tolerance comparison requires baseline count from production which varies over time"

  - id: "AC-020"
    description: "public-health-check.sh returns all-green post-restore"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/public-health-check.sh"
        command: "./scripts/qa/public-health-check.sh prod"

  # --- Cross-Region Readiness ---

  - id: "AC-021"
    description: "Kustomize produces valid manifests deployable to any GKE cluster"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "deploy/k8s/overlays/production/kustomization.yaml"
        command: "kubectl kustomize deploy/k8s/overlays/production | kubectl apply --dry-run=server -f -"

  - id: "AC-022"
    description: "GCS backup bucket is multi-region or has cross-region replication"
    verify:
      - type: "manual"
        runbook: "docs/operations/DISASTER_RECOVERY.md"
        section: "Cross-Region Readiness Verification"
        justification: "GCS bucket configuration requires gcloud auth and varies by environment; verified during Phase 3 implementation"
