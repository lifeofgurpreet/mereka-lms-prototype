- id: AC-DELETE-001
  description: 'Given a deletion pipeline begins execution, when the pipeline orchestrates
    deletion across 15+ data stores (per classification matrix), then the orchestrator
    MUST execute stores in the documented sequence order: (1) session invalidation,
    (2) account deactivation, (3) forum anonymization, (4) analytics deletion, (5)
    purchase anonymization, (6) notes deletion, (7) enrollment/grades deletion, (8)
    certificates revocation, (9) profile deletion, (10) user account anonymization,
    (11) SSO linkage deletion, (12) consent anonymization, (13) audit trail anonymization,
    (14) cache cleanup, (15) log flagging'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-privacy-gdpr.sh
    command: scripts/qa/verify-data-privacy-gdpr.sh
- id: AC-DELETE-002
  description: Given the deletion pipeline processes data store X (e.g., MongoDB Atlas
    forum content), when the deletion step completes, then the pipeline MUST immediately
    verify deletion success by querying the data store for the user's identifiers
    (user_id, email, username) and confirming zero records returned OR anonymized
    values only
  verify:
  - type: manual
    runbook: docs/operations/PRIVACY_RUNBOOK.md
    section: Right to Erasure (RTBF)
    justification: Multi-store deletion pipeline with per-step verification not yet
      implemented
- id: AC-DELETE-003
  description: 'Given a deletion pipeline step fails for data store X (e.g., ClickHouse
    deletion query timeout after 30 minutes), when the failure is detected, then the
    pipeline MUST: (a) log the failure with full error context (error message, stack
    trace, data store endpoint), (b) retry the failed step 3 times with exponential
    backoff (30s, 60s, 120s), (c) if all retries fail, mark data store X as `failed`
    in deletion manifest, (d) continue processing remaining data stores (do NOT halt
    pipeline), (e) transition overall deletion request status to `partially_completed`,
    (f) fire Critical alert to privacy operations team with failed store name and
    user identifier'
  verify:
  - type: manual
    runbook: docs/operations/PRIVACY_RUNBOOK.md
    section: Rollback / Incident Response
    justification: Deletion pipeline retry orchestration not yet implemented
- id: AC-DELETE-004
  description: 'Given a deletion pipeline completes with status `partially_completed`
    (one or more stores failed), when the privacy operations team reviews the failure,
    then the team MUST have access to a re-run mechanism that: (a) loads the original
    deletion manifest, (b) skips already-completed stores (idempotent), (c) re-attempts
    only `failed` stores, (d) updates the deletion certificate upon successful re-run
    completion'
  verify:
  - type: manual
    runbook: docs/operations/PRIVACY_RUNBOOK.md
    section: Rollback / Incident Response
    justification: Idempotent deletion re-run mechanism not yet implemented
- id: AC-DELETE-005
  description: 'Given a deletion pipeline completes all stores successfully (status
    `completed`), when the deletion certificate is generated, then the certificate
    MUST contain: `deletion_request_id` (UUID), `user_id_hash` (SHA-256), `completion_timestamp`
    (ISO 8601), per-store manifest array with entries: `{data_store: "MySQL:auth_user",
    action: "anonymized", records_affected: 1, verification_query: "SELECT email FROM
    auth_user WHERE id=X", verification_result: "retired_email_abc123@retired.invalid",
    completed_at: "..."}`, `certificate_signature` (HMAC-SHA256 using platform secret
    key from Infisical)'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-data-privacy-gdpr.sh
    command: scripts/qa/verify-data-privacy-gdpr.sh
- id: AC-DELETE-006
  description: 'Given a deletion certificate is generated, when the certificate signature
    is verified by an independent auditor tool, then the tool MUST validate: (a) HMAC-SHA256
    signature matches certificate body using platform public key, (b) `completion_timestamp`
    is within 30 days of `deletion_request.created_at` (GDPR SLA compliance), (c)
    all data stores from classification matrix are listed in manifest (no stores skipped),
    (d) verification queries confirm anonymization/deletion for each store'
  verify:
  - type: manual
    runbook: docs/operations/PRIVACY_RUNBOOK.md
    section: Right to Erasure (RTBF)
    justification: Deletion certificate signing and verification not yet implemented
