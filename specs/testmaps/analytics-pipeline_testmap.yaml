# Analytics Pipeline (Aspects/Panorama) - Testmap
# Source Spec: specs/analytics-pipeline_spec.md
# Generated: 2026-02-10

spec: "specs/analytics-pipeline_spec.md"
acceptance_criteria:
  - id: "AC-001"
    description: "Aspects plugin enabled: tutor plugins list |grep aspects shows enabled"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-analytics-pipeline.sh"
        command: "bash scripts/qa/verify-analytics-pipeline.sh--check aspects-plugin"
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-analytics-pipeline.sh"
        command: "tutor plugins list | grep -q aspects"

  - id: "AC-002"
    description: "xAPI events flow to ClickHouse: SELECT count() FROM xapi_events_all returns > 0"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-analytics-pipeline.sh"
        command: "bash scripts/qa/verify-analytics-pipeline.sh--check events-flowing"
      - type: "monitoring"
        metric: "clickhouse_xapi_events_count"
        dashboard: "grafana://dashboards/analytics-pipeline"

  - id: "AC-003"
    description: "ClickHouse retention policy active: Events older than 90 days are deleted"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-analytics-pipeline.sh"
        command: "bash scripts/qa/verify-analytics-pipeline.sh--check retention-ttl"
      - type: "manual"
        runbook: "docs/operations/ANALYTICS_RUNBOOK.md"
        section: "ClickHouse Disk Space"
        justification: "Verifying actual TTL-based deletion requires inserting backdated data and waiting for merge cycle orforcing OPTIMIZE TABLE -- not automatable in a stateless CI run"

  - id: "AC-004"
    description: "Superset accessible at configured URL (analytics.academyv2.mereka.io)"
    verify:
      - type: "automated"
        test_type: "e2e"
        file: "scripts/qa/smoke-test-analytics.sh"
        command: "bash scripts/qa/smoke-test-analytics.sh"
      - type: "monitoring"
        metric: "superset_health_status"
        dashboard: "grafana://dashboards/analytics-pipeline"

  - id: "AC-005"
    description: "Pre-built dashboards visible in Superset forstaff users"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-analytics-pipeline.sh"
        command: "bash scripts/qa/verify-analytics-pipeline.sh--check dashboards-exist"
      - type: "manual"
        runbook: "docs/operations/ANALYTICS_RUNBOOK.md"
        section: "Dashboard Verification"
        justification: "Verifying dashboard load time < 5s andvisual correctness requires browser interaction that cannot be automated with kubectl alone"

  - id: "AC-006"
    description: "No PII in events: actor_id shows hashed IDs,no emails or IPs"
    verify:
      - type: "automated"
        test_type: "security"
        file: "scripts/qa/audit-analytics-pii.sh"
        command: "bash scripts/qa/audit-analytics-pii.sh"
      - type: "automated"
        test_type: "integration"
        file: "scripts/qa/verify-analytics-pipeline.sh"
        command: "bash scripts/qa/verify-analytics-pipeline.sh--check no-pii"

  - id: "AC-007"
    description: "Instructor dashboard embeds in LMS course pages"
    verify:
      - type: "manual"
        runbook: "docs/operations/ANALYTICS_RUNBOOK.md"
        section: "Dashboard Embedding Verification"
        justification: "Dashboard embedding requires browser-based verification of iframe rendering within LMS course pages;no headless equivalent available in the current test infrastructure"

  - id: "AC-008"
    description: "Data deletion works: Deleting user removes their events from ClickHouse"
    verify:
      - type: "automated"
        test_type: "integration"
        file: "scripts/analytics/delete-user-events.sh"
        command: "bash scripts/analytics/delete-user-events.sh--user-hash test_hash_abc123 && bash scripts/analytics/verify-user-deletion.sh --user-hash test_hash_abc123"
      - type: "automated"
        test_type: "integration"
        file: "scripts/analytics/verify-user-deletion.sh"
        command: "bash scripts/analytics/verify-user-deletion.sh --user-hash test_hash_abc123"
