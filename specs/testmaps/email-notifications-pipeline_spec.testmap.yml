spec: email-notifications-pipeline_spec.md
acceptance_criteria:
- id: AC-001
  description: Given the sending domain `academyv2.mereka.io`, when SES domain verification
    is checked, then DKIM, SPF, and DMARC all pass verification (verified via `dig`
    and SES console)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-notifications.sh
    command: scripts/qa/verify-email-notifications.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ses-infrastructure.sh
    command: scripts/qa/verify-email-ses-infrastructure.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: ACE Pipeline Verification
    justification: Requires active SES configuration with verified sender domain and
      test recipient
    file: scripts/infra/verify-ses-domain.sh
- id: AC-002
  description: Given the sending domain `academy.biji-biji.com`, when SES domain verification
    is checked, then DKIM, SPF, and DMARC all pass verification
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-notifications.sh
    command: scripts/qa/verify-email-notifications.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ses-infrastructure.sh
    command: scripts/qa/verify-email-ses-infrastructure.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Email Template Rendering
    justification: Requires sending actual test emails through SES to verify template
      rendering across email clients
    file: scripts/infra/verify-ses-domain.sh
- id: AC-003
  description: Given a learner triggers a password reset, when ACE dispatches the
    email, then the email is delivered via SES within 30 seconds and the `From` header
    shows `noreply@academyv2.mereka.io`
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-notifications-pipeline.sh
    command: scripts/qa/verify-email-notifications-pipeline.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ses-infrastructure.sh
    command: scripts/qa/verify-email-ses-infrastructure.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: ACE Pipeline Verification
    justification: Feature not yet implemented; ACE email pipeline with SES not yet
      deployed
- id: AC-004
  description: Given the custom MAIL FROM domain `mail.academyv2.mereka.io`, when
    an email is sent, then the envelope sender aligns with the header sender (DMARC
    alignment pass)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ses-infrastructure.sh
    command: scripts/qa/verify-email-ses-infrastructure.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: DMARC Alignment Verification
    justification: Requires sending actual test emails through SES with DMARC verification
- id: AC-005
  description: Given an enterprise tenant with `org_slug=acme`, when a course announcement
    email is sent, then the `From` display name shows "Acme Corp via Mereka Academy"
    and the sender address is `noreply@academyv2.mereka.io`
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ses-infrastructure.sh
    command: scripts/qa/verify-email-ses-infrastructure.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Enterprise Tenant Email Branding
    justification: Feature not yet implemented; per-tenant email branding not yet
      built
- id: AC-006
  description: Given ACE configuration with channels `["django_email", "push", "in_app"]`,
    when a `course_announcement` notification is triggered, then ACE dispatches to
    all three channels for users with all channels enabled
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ace-channels.sh
    command: scripts/qa/verify-email-ace-channels.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Multi-Channel Dispatch
    justification: Feature not yet implemented; ACE multi-channel pipeline not yet
      deployed
- id: AC-007
  description: Given a user who has disabled email for `course_announcement` but enabled
    push and in_app, when a course announcement is published, then the user receives
    push and in-app notifications but no email
  verify:
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Channel Preference Enforcement
    justification: Feature not yet implemented; preference-based channel filtering
      not yet built
- id: AC-008
  description: Given a `password_reset` message type, when the user has disabled all
    notification channels, then the email is still sent (system-critical, non-suppressible)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-ace-channels.sh
    command: scripts/qa/verify-email-ace-channels.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Non-Suppressible System Emails
    justification: Feature not yet implemented; non-suppressible email category not
      yet implemented
- id: AC-009
  description: Given Celery workers processing the `edx.lms.core.default` queue, when
    100 ACE messages are enqueued simultaneously, then all 100 are dispatched within
    60 seconds
  verify:
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Celery Queue Throughput
    justification: Feature not yet implemented; requires running Celery workers with
      load test
- id: AC-010
  description: 'Given a learner with 5 unread notifications, when they call `GET /api/notifications/v1/unread-count/`,
    then the response is `{"unread_count": 5}` with p95 latency <= 100ms'
  verify:
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Notification API Verification
    justification: Feature not yet implemented; in-app notification API not yet deployed
- id: AC-011
  description: Given 50 notifications for a user (30 read, 20 unread), when they call
    `GET /api/notifications/v1/?read=false`, then only the 20 unread notifications
    are returned, sorted by `created_at` descending
  verify:
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Notification List Filtering
    justification: Feature not yet implemented; in-app notification list API not yet
      deployed
- id: AC-012
  description: Given a notification with `expires_at` in the past, when the notification
    list is queried, then the expired notification is not included in the response
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-inapp-code.sh
    command: scripts/qa/verify-email-inapp-code.sh
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Notification Expiry
    justification: Feature not yet implemented; notification expiry enforcement not
      yet built
- id: AC-013
  description: 'Given a user calls `POST /api/notifications/v1/mark-all-read/`, when
    the operation completes, then `GET /api/notifications/v1/unread-count/` returns
    `{"unread_count": 0}`'
  verify:
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Mark All Read
    justification: Feature not yet implemented; mark-all-read API endpoint not yet
      created
- id: AC-014
  description: Given a user under `org_slug=acme`, when they query the notification
    list, then they see only notifications with `org_slug=acme` (no cross-tenant leakage)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-email-inapp-code.sh
    command: scripts/qa/verify-email-inapp-code.sh
  - type: manual
    runbook: docs/ops/runbooks/EMAIL_NOTIFICATIONS_RUNBOOK.md
    section: Tenant Notification Isolation
    justification: Feature not yet implemented; tenant-scoped notification query not
      yet implemented
- id: AC-015
  description: Given a device registers via `POST /api/mobile/v1/notifications/register/`
