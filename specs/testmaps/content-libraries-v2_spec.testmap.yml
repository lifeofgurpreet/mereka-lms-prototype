spec: content-libraries-v2_spec.md
acceptance_criteria:
- id: AC-001
  description: 'Given a user with `CONTENT_LIBRARY_CREATOR` permission and organization
    "Mereka", when they call `POST /api/libraries/v2/` with `{"org": "Mereka", "slug":
    "compliance-2026", "title": "Compliance Training 2026", "description": "Mandatory
    compliance modules", "type": "complex"}`, then a library is created with key `lib:Mereka:compliance-2026`
    and the response includes `id`, `org`, `slug`, `title`, `has_unpublished_changes:
    false`, `allow_public_read: false`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-olx-packages.sh
    command: scripts/qa/verify-olx-packages.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
- id: AC-002
  description: Given library `lib:Mereka:compliance-2026` exists, when the same `POST`
    is sent with the same slug, then the response is HTTP 400 with an error indicating
    the slug is already in use
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-003
  description: Given library `lib:Mereka:compliance-2026` with 5 components, when
    a Library Admin calls `DELETE /api/libraries/v2/lib:Mereka:compliance-2026/`,
    then the library is soft-deleted and no longer appears in listing responses, but
    can be restored within 30 days
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-004
  description: 'Given library `lib:Mereka:compliance-2026`, when a Library Author
    calls `POST /api/libraries/v2/lib:Mereka:compliance-2026/blocks/` with `{"block_type":
    "html", "definition_id": "intro-module"}`, then an HTML XBlock component is added
    to the library and `has_unpublished_changes` becomes `true`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-olx-packages.sh
    command: scripts/qa/verify-olx-packages.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-005
  description: Given a library with 10 components, when a Library Author edits the
    content of component `intro-module` via the OLX update endpoint, then the component
    content is updated in draft and `has_unpublished_changes` remains `true`
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_checkout_route.py
    command: pytest services/purchase-gateway/tests/unit/test_checkout_route.py
- id: AC-006
  description: Given a library with a `problem` type component, when a Library Author
    adds a `video` type component, then both components coexist in the library (mixed-type
    library support)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-007
  description: Given a library, when a user attempts to add a component of an XBlock
    type not installed on the platform, then the response is HTTP 400 with "XBlock
    type '{type}' is not installed"
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-008
  description: Given library `lib:Mereka:compliance-2026` with unpublished draft changes,
    when a Library Admin calls `POST /api/libraries/v2/lib:Mereka:compliance-2026/commit/`,
    then all draft changes are committed, `has_unpublished_changes` becomes `false`,
    and a version record is created with the publisher's username and timestamp
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-olx-packages.sh
    command: scripts/qa/verify-olx-packages.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_webhook_handler.py
    command: pytest services/purchase-gateway/tests/unit/test_webhook_handler.py
- id: AC-009
  description: Given library `lib:Mereka:compliance-2026` with no unpublished changes,
    when `POST /commit/` is called, then the response is HTTP 200 with a message "No
    changes to publish" and no new version record is created
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-010
  description: Given a library with 3 published versions, when a Library Admin calls
    the revert endpoint for version 2, then the library content reverts to the state
    of version 2 and `has_unpublished_changes` becomes `true` (the revert is staged
    as a draft, requiring another publish)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-011
  description: Given a library with a recently published component "quiz-1", when
    a course author views a course referencing that component in Studio, then Studio
    shows the published version of "quiz-1" (not any subsequent draft changes)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-012
  description: Given library `lib:Mereka:compliance-2026` with 20 published problem
    components, when a course author adds a `library_content` XBlock to a course unit
    and configures it with `source_library_id=lib:Mereka:compliance-2026` and `max_count=5`,
    then each learner sees 5 randomly selected problems from the library
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-013
  description: Given a `library_v2_ref` block in a course pointing to component "quiz-1"
    in library `lib:Mereka:compliance-2026`, when the library author updates and publishes
    "quiz-1", then Studio displays a notification on the course unit indicating "Library
    content has updates available"
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-014
  description: Given the notification from AC-013, when the course author clicks "Update
    from library", then the course unit receives the latest published version of "quiz-1"
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-015
  description: Given a library that is deleted after a course has synced its content,
    then the course retains its last-synced copies and continues to function without
    errors for learners
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-016
  description: 'Given a user who is a member of organization "Acme" (an enterprise
    tenant), when they call `GET /api/libraries/v2/`, then only libraries belonging
    to organization "Acme" and libraries with `allow_public_read: true` are returned'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
- id: AC-017
  description: Given a user who is a member of organization "Acme", when they call
    `GET /api/libraries/v2/lib:Beta:internal-training/`, then the response is HTTP
    403
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
- id: AC-018
  description: 'Given a Library Admin, when they call `POST /api/libraries/v2/lib:Mereka:compliance-2026/team/`
    with `{"username": "author1", "access_level": "author"}`, then author1 is granted
    Library Author access and a permission change audit log entry is created'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
- id: AC-019
  description: Given a Library Author, when they attempt to call `DELETE /api/libraries/v2/lib:Mereka:compliance-2026/`,
    then the response is HTTP 403 (authors cannot delete libraries)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-020
  description: Given enterprise tenant "Acme" with organization "AcmeCorp" and enterprise
    tenant "Beta" with organization "BetaCorp", when an Acme admin creates library
    `lib:AcmeCorp:acme-training`, then Beta users calling `GET /api/libraries/v2/`
    do NOT see `lib:AcmeCorp:acme-training` in results
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-021
  description: 'Given a platform-global library `lib:Mereka:shared-templates` with
    `allow_public_read: true`, when a user from any enterprise tenant calls `GET /api/libraries/v2/`,
    then `lib:Mereka:shared-templates` appears in results with read-only access'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: unit
    file: services/purchase-gateway/tests/unit/test_fulfillment.py
    command: pytest services/purchase-gateway/tests/unit/test_fulfillment.py
- id: AC-022
  description: Given a Beta user, when they attempt to add a component from `lib:AcmeCorp:acme-training`
    to a course via Studio, then the operation is denied and a security event is logged
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
- id: AC-023
  description: Given 50 libraries across 5 organizations, when a user from organization
    "Mereka" searches for "compliance" in the library listing, then only libraries
    from "Mereka" (and public libraries) containing "compliance" in the title, description,
    or component content are returned
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-024
  description: Given a library with 100 components, when the listing API is called
    with `?page_size=20&page=3`, then components 41-60 are returned with pagination
    metadata
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-025
  description: Given a library component tagged with taxonomy tag "assessments > multiple-choice",
    when a user searches for libraries with tag "assessments", then the library containing
    that component appears in results
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-026
  description: Given library `lib:Mereka:compliance-2026` referenced by 3 courses,
    when `GET /api/libraries/v2/lib:Mereka:compliance-2026/links/` is called, then
    the response lists all 3 courses with their course keys and the specific components
    referenced
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-027
  description: 'Given a learner completing a problem sourced from library `lib:Mereka:compliance-2026`,
    when the xAPI event is emitted, then the event context includes `library_key:
    lib:Mereka:compliance-2026`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-advanced.sh
    command: scripts/qa/verify-content-libraries-advanced.sh
- id: AC-028
  description: Given library `lib:Mereka:compliance-2026` with 50 components, when
    `GET /api/libraries/v2/lib:Mereka:compliance-2026/export/` is called, then a valid
    tar.gz OLX archive is returned containing all component content and metadata
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-olx-packages.sh
    command: scripts/qa/verify-olx-packages.sh
- id: AC-029
  description: 'Given a valid OLX archive exported from AC-028, when `POST /api/libraries/v2/import/`
    is called with the archive and `{"org": "Mereka", "slug": "compliance-restored"}`,
    then a new library is created with identical content to the original'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-olx-packages.sh
    command: scripts/qa/verify-olx-packages.sh
- id: AC-030
  description: Given an OLX archive containing a component of type `custom_xblock_v3`
    (not installed), when import is attempted, then the response is HTTP 400 listing
    the unsupported XBlock type
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-content-libraries-v2-enterprise.sh
    command: scripts/qa/verify-content-libraries-v2-enterprise.sh
- id: AC-031
  description: Given 100 libraries in organization "Mereka", when `GET /api/libraries/v2/?org=Mereka`
    is called, then the response is returned within 500ms at p95
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/load-test-libraries.sh
    command: scripts/qa/load-test-libraries.sh
- id: AC-032
  description: Given a library with 1,000 components, when `GET /api/libraries/v2/{library_key}/blocks/?page_size=50`
    is called, then the first page is returned within 1000ms at p95
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/load-test-libraries.sh
    command: scripts/qa/load-test-libraries.sh
- id: AC-033
  description: Given a library with 500 components, when the publish endpoint is called,
    then the operation completes within 30 seconds
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/load-test-libraries.sh
    command: scripts/qa/load-test-libraries.sh

