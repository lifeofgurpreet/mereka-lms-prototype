# Testmap: Slo Sla Service Level Management
# Source Spec: specs/slo-sla-service-level-management_spec.md
# Generated: 2026-02-10

spec: specs/slo-sla-service-level-management_spec.md
acceptance_criteria:
- id: AC-001
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-sli-foundation.sh
    command: bash scripts/qa/verify-sli-foundation.sh --check-tier-classification
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-site-id-hardening.sh
    command: bash scripts/qa/verify-site-id-hardening.sh
  - type: automated
    test_type: shell_verification
    file: scripts/qa/lint-active-docs-env-model.sh
    command: bash scripts/qa/lint-active-docs-env-model.sh
  description: Given the service tier table, when `kubectl get deploy -n mereka-lms` is run, then every listed deployment
    maps to exactly one tier as defined in this spec
- id: AC-002
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-sli-foundation.sh
    command: bash scripts/qa/verify-sli-foundation.sh --check-slo-sla-margin
  description: Given each tier definition, when the availability SLO target is compared to the external SLA target, then the
    SLO is strictly more stringent (higher percentage) than the SLA for every tier
- id: AC-003
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-sli-foundation.sh
    command: bash scripts/qa/verify-sli-foundation.sh --check-metrics-endpoint
  description: Given LMS is running, when `curl -s https://academyv2.mereka.io/metrics | grep http_request_duration_seconds`
    is run, then histogram buckets are returned showing request latency distribution
- id: AC-004
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-sli-foundation.sh
    command: bash scripts/qa/verify-sli-foundation.sh --check-availability-ratio
  description: Given Prometheus is running, when `promtool query instant http://prometheus:9090 'mereka:http_requests:availability_ratio_5m{service="lms"}'`
    is executed, then a value between 0 and 1 is returned
- id: AC-005
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-sli-foundation.sh
    command: bash scripts/qa/verify-sli-foundation.sh --check-recording-rules
  description: 'Given all recording rules are deployed, when `kubectl get prometheusrule -n mereka-lms -o yaml | grep "record:
    mereka:"` is run, then all recording rules defined in this spec are present'
- id: AC-006
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-sli-foundation.sh
    command: bash scripts/qa/verify-sli-foundation.sh --check-uptime-checks
  description: Given GCP uptime checks are active, when `gcloud monitoring uptime list-configs --project=mereka-lms --format=json`
    is run, then checks exist for all Tier 1 and Tier 2 service public endpoints
- id: AC-007
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-error-budget.sh
    command: bash scripts/qa/verify-error-budget.sh --check-budget-ratio
  description: Given 30 days of metrics data, when the `mereka:slo:error_budget_remaining_ratio` recording rule is queried
    for each service, then values are returned showing remaining budget as a ratio between 0 and 1
- id: AC-008
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-error-budget.sh
    command: bash scripts/qa/verify-error-budget.sh --check-dashboard
  - type: monitoring
    metric: mereka_slo_error_budget_remaining_ratio
    dashboard: https://grafana.mereka.io/d/mereka-slo-overview
  description: 'Given the SLO dashboard exists in Grafana, when `https://grafana.mereka.io/d/mereka-slo-overview` is loaded,
    then panels display: per-service availability ratio, error budget remaining, burn rate trend, and latency distributions'
- id: AC-009
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-error-budget.sh
    command: bash scripts/qa/verify-error-budget.sh --check-burn-rate-alerts
  - type: manual
    runbook: docs/operations/SLO_DASHBOARDS_SETUP.md
    section: Verification > Simulate Budget Burn
    justification: Requires scaling LMS to 0 replicas to trigger real alert; not safe to automate in production
  description: Given error budget drops below 50%, when the burn rate alert evaluates, then a Slack notification is sent to
    the engineering channel within 5 minutes
- id: AC-010
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-deployment-gate.sh
    command: bash scripts/qa/verify-deployment-gate.sh --test-budget-above-50
  description: Given error budget is >= 50% for all Tier 1 services, when a deployment pipeline runs, then the deployment
    gate check passes without manual approval
- id: AC-011
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-deployment-gate.sh
    command: bash scripts/qa/verify-deployment-gate.sh --test-budget-below-25
  description: Given error budget is < 25% for any Tier 1 service, when a deployment pipeline runs, then the gate check blocks
    deployment and requires documented approval
- id: AC-012
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-deployment-gate.sh
    command: bash scripts/qa/verify-deployment-gate.sh --test-override-logging
  description: 'Given an emergency deployment override occurs, when the override is logged, then the log entry contains: approver,
    timestamp, justification, and deployment identifier'
- id: AC-013
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-regression-detection.sh
    command: bash scripts/qa/verify-regression-detection.sh --check-regression-alerts
  - type: manual
    runbook: docs/operations/SLO_DASHBOARDS_SETUP.md
    section: Verification > Simulate Latency Regression
    justification: Requires injecting artificial latency in production to verify alert fires within 15 minutes; not safe to
      automate
  description: Given a stable 7-day latency baseline, when p95 latency exceeds 2x the baseline for 15 consecutive minutes,
    then a P2 alert fires and is delivered to on-call
- id: AC-014
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-regression-detection.sh
    command: bash scripts/qa/verify-regression-detection.sh --check-deployment-annotation-template
  description: Given a deployment event, when regression is detected within 30 minutes of the deployment, then the alert annotation
    includes the deployment identifier and commit SHA
- id: AC-015
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-regression-detection.sh
    command: bash scripts/qa/verify-regression-detection.sh --check-grafana-annotations
  - type: monitoring
    metric: mereka_slo_latency_p95_seconds
    dashboard: https://grafana.mereka.io/d/mereka-slo-overview
  description: Given deployment events are annotated in Grafana, when the SLO dashboard is viewed, then vertical markers appear
    at each deployment timestamp on latency and availability panels
- id: AC-016
  verify:
  - type: manual
    runbook: docs/operations/MAINTENANCE_WINDOWS.md
    section: Verification > SLA Exclusion Test
    justification: Requires declaring a real maintenance window and generating a monthly report to verify exclusion; involves
      calendar-dependent data that cannot be unit tested
  description: Given a maintenance window is declared 72 hours in advance, when SLA availability is calculated for the month,
    then the maintenance window duration is excluded from both numerator and denominator
- id: AC-017
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/generate-sla-report.sh
    command: bash scripts/qa/generate-sla-report.sh --dry-run | grep -q 'Maintenance Windows'
  - type: manual
    runbook: docs/operations/SLA_REPORTING.md
    section: Report Sections > Maintenance Windows
    justification: Requires actual maintenance window data to verify start/end/scope appear correctly; dry-run only checks
      section existence
  description: Given a maintenance window record, when the monthly SLA report is generated, then the maintenance window appears
    in the report with start time, end time, and scope
- id: AC-018
  verify:
  - type: manual
    runbook: docs/operations/ONCALL_ROTATION.md
    section: Incident Response > P1 Acknowledgement
    justification: Tests human response time to P1 alerts; requires a real or simulated incident with on-call engineer availability
  description: Given a P1 incident is declared, when the on-call engineer acknowledges, then acknowledgement occurs within
    15 minutes of alert firing
- id: AC-019
  verify:
  - type: manual
    runbook: docs/operations/INCIDENT_TEMPLATES.md
    section: Postmortem > Required Sections Checklist
    justification: Tests organizational process (postmortem published within 5 business days with required sections); cannot
      be automated without incident tracking system integration
  description: 'Given a P1/P2 incident is resolved, when the postmortem is published, then it is published within 5 business
    days and contains: timeline, root cause, impact, remediation, and prevention sections'
- id: AC-020
  verify:
  - type: manual
    runbook: docs/operations/ONCALL_ROTATION.md
    section: Schedule Verification
    justification: Requires inspecting on-call schedule for primary/secondary assignment and consecutive-day limits; format
      depends on tool choice (Slack, PagerDuty, wiki)
  description: Given the on-call schedule, when any week is inspected, then a primary and secondary on-call engineer are assigned
    and no engineer has consecutive on-call duty exceeding 7 days
- id: AC-021
  verify:
  - type: automated
    test_type: kubectl_check
    file: scripts/qa/verify-error-budget.sh
    command: bash scripts/qa/verify-error-budget.sh --check-escalation-config
  - type: manual
    runbook: docs/operations/ONCALL_ROTATION.md
    section: Escalation > Auto-Escalation Test
    justification: Full end-to-end escalation test requires primary on-call to be unreachable for 15 minutes; automated check
      verifies Alertmanager config only
  description: Given a P1 alert fires, when the primary on-call does not acknowledge within 15 minutes, then the alert automatically
    escalates to the secondary on-call
- id: AC-022
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/generate-sla-report.sh
    command: bash scripts/qa/generate-sla-report.sh --dry-run --validate-sections
  description: Given one month of production operation, when the monthly SLA report script runs, then a report is generated
    containing per-service availability, latency percentiles, error budget status, incident summary, and maintenance log
- id: AC-023
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-sla-report-security.sh
    command: bash scripts/qa/verify-sla-report-security.sh /tmp/sla-report-latest.md
  description: Given a generated SLA report, when reviewed for security, then it contains no internal IP addresses, secret
    names, or infrastructure hostnames
