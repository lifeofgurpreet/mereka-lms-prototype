# Testmap for CI/CD Pipeline
# Maps acceptance criteria from spec to test files for traceability
# Verify coverage: python ~/projects/team-skills/plugins/core/skills/specs-vs-docs/tools/check_test_coverage.py specs/testmaps/ci-cd-pipeline_testmap.yaml

spec: "specs/ci-cd-pipeline_spec.md"
acceptance_criteria:
  # Quality Gates
  - id: "AC-001"
    description: "Given a PR is opened against main, when CI runs, then all 12 CI jobs execute and their pass/fail status is reported as GitHub commit status checks"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q 'on:.*pull_request' .github/workflows/ci.yml && grep -q 'branches:.*main' .github/workflows/ci.yml"
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "yq eval '.jobs | keys | length' .github/workflows/ci.yml | grep -q '[0-9]'"
      - type: "manual"
        test_type: "e2e"
        file: "N/A"
        command: "gh pr checks <pr-number> --required"

  - id: "AC-002"
    description: "Given the spec-lint job runs, when specs in specs/ have structural issues (missing frontmatter, missing required sections), then the job fails with specific error messages identifying the non-conforming spec"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q 'spec-lint' .github/workflows/ci.yml && grep -q 'mereka_spec_lint.py' .github/workflows/ci.yml"
      - type: "automated"
        test_type: "unit"
        file: "scripts/qa/spec-tools/mereka_spec_lint.py"
        command: "python3 scripts/qa/spec-tools/mereka_spec_lint.py specs/ --severity-filter error"

  - id: "AC-003"
    description: "Given the lint job runs, when Python files in scripts/ or services/ have ruff violations, then the job fails"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q 'lint:' .github/workflows/ci.yml"
      - type: "automated"
        test_type: "unit"
        file: "pyproject.toml"
        command: "ruff check scripts/ services/ || test $? -eq 0"

  - id: "AC-004"
    description: "Given the validate-k8s job runs, when any YAML in deploy/k8s/ is not a valid Kubernetes manifest, then kubeconform fails the job"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q 'validate-k8s' .github/workflows/ci.yml && grep -q 'kubeconform' .github/workflows/ci.yml"
      - type: "automated"
        test_type: "integration"
        file: "deploy/k8s/"
        command: "find deploy/k8s/ -name '*.yaml' -o -name '*.yml' | wc -l | grep -q '[0-9]'"

  - id: "AC-005"
    description: "Given the security-scan job runs, when verified secrets are detected by TruffleHog, then the job fails and the finding is reported"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q 'security-scan' .github/workflows/ci.yml && grep -q 'trufflesecurity/trufflehog' .github/workflows/ci.yml"
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q '\\-\\-only-verified' .github/workflows/ci.yml"

  - id: "AC-006"
    description: "Given the prod-tag-guard job runs, when any production overlay references a :latest tag, then the job fails"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-no-latest-prod-tags.sh"
        command: "./scripts/qa/verify-no-latest-prod-tags.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/ci.yml"
        command: "grep -q 'prod-tag-guard' .github/workflows/ci.yml || grep -q 'verify-no-latest-prod-tags.sh' .github/workflows/ci.yml"

  - id: "AC-007"
    description: "Given all CI jobs pass, when the PR is reviewed and approved, then the merge button is enabled"
    verify:
      - type: "manual"
        test_type: "e2e"
        file: "N/A"
        command: "gh pr view <pr-number> --json statusCheckRollup"

  - id: "AC-008"
    description: "Given a CI job fails, when a developer views the PR, then the merge button is disabled"
    verify:
      - type: "manual"
        test_type: "e2e"
        file: "N/A"
        command: "gh pr view <pr-number> --json mergeable"

  # Image Build
  - id: "AC-009"
    description: "Given a push to main modifies infrastructure/tutor/**, when the build workflow triggers, then both openedx and MFE images are built, tagged with the git SHA and short SHA, and pushed to asia-southeast1-docker.pkg.dev/mereka-lms/openedx/"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'infrastructure/tutor' .github/workflows/build-tutor-images.yml && grep -q 'asia-southeast1-docker.pkg.dev/mereka-lms/openedx' .github/workflows/build-tutor-images.yml"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-build-workflow-contract.sh"
        command: "./scripts/qa/verify-build-workflow-contract.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-dev-prod-image-parity.sh"
        command: "./scripts/qa/verify-dev-prod-image-parity.sh"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run list --workflow=build-tutor-images.yml --limit 5"

  - id: "AC-010"
    description: "Given the openedx image is built, when it is pushed to Artifact Registry, then the job output contains the resolved image digest (sha256:...)"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/resolve-image-digest.sh"
        command: "./scripts/infra/resolve-image-digest.sh --verify"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run view <run-id> --log | grep -E 'sha256:[a-f0-9]{64}'"

  - id: "AC-011"
    description: "Given the MFE image is built, when the branding verification runs, then it validates that the authn index.html contains the expected branding revision marker"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'verify-mfe-image-branding.sh' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run view <run-id> --log | grep 'branding verification'"

  - id: "AC-012"
    description: "Given a manual dispatch with build_openedx=true and image_tag=v1.2.3, when the build completes, then the image is tagged as openedx:v1.2.3 and openedx:<short-sha>"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'workflow_dispatch' .github/workflows/build-tutor-images.yml && grep -q 'image_tag' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh workflow run build-tutor-images.yml -f build_openedx=true -f image_tag=v1.2.3"

  - id: "AC-013"
    description: "Given the build workflow, when images are pushed, then no :latest tag is published to Artifact Registry"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-no-latest-prod-tags.sh"
        command: "./scripts/qa/verify-no-latest-prod-tags.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "! grep -q ':latest' .github/workflows/build-tutor-images.yml || grep -q 'MUST NOT' .github/workflows/build-tutor-images.yml"

  # GitOps Deployment
  - id: "AC-014"
    description: "Given update_gitops=true and target_environment=production, when both builds succeed with digests, then release-openedx-gitops.sh is invoked with --apply --commit --push --require-digests and both digest flags"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/release-openedx-gitops.sh"
        command: "./scripts/infra/release-openedx-gitops.sh --dry-run"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-gitops-image-overrides.sh"
        command: "./scripts/qa/verify-gitops-image-overrides.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-gitops-mereka-lms-pin.sh"
        command: "./scripts/qa/verify-gitops-mereka-lms-pin.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'update_gitops' .github/workflows/build-tutor-images.yml && grep -q 'target_environment' .github/workflows/build-tutor-images.yml"

  - id: "AC-015"
    description: "Given update_gitops=true and target_environment=select-environment, when the workflow runs, then it fails with an error requiring explicit environment selection"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'select-environment' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh workflow run build-tutor-images.yml -f update_gitops=true -f target_environment=select-environment"

  - id: "AC-016"
    description: "Given update_gitops=true and target_environment=staging, when ENABLE_STAGING_ENV is not set to true, then the workflow fails with a message indicating staging is disabled"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'ENABLE_STAGING_ENV' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh variable list | grep ENABLE_STAGING_ENV"

  - id: "AC-017"
    description: "Given deploy_to_staging=true is used in manual dispatch, when the workflow runs, then it fails with a deprecation error directing the user to update_gitops"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'deploy_to_staging' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh workflow run build-tutor-images.yml -f deploy_to_staging=true"

  - id: "AC-018"
    description: "Given update_gitops=true but build_openedx=false, when the workflow runs, then it fails requiring both builds for deterministic digest capture"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'build_openedx' .github/workflows/build-tutor-images.yml && grep -q 'build_mfe' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh workflow run build-tutor-images.yml -f update_gitops=true -f build_openedx=false"

  # Release Process
  - id: "AC-019"
    description: "Given the release-evidence.yml workflow is dispatched with valid tags, when it completes, then a release-evidence-<env>-<run> artifact is uploaded containing: policy check logs, dry-run plan, resolved digests, and release-metadata.json"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/release-evidence.yml"
        command: "grep -q 'release-evidence' .github/workflows/release-evidence.yml && grep -q 'release-metadata.json' .github/workflows/release-evidence.yml"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-release-evidence-workflow.sh"
        command: "./scripts/qa/verify-release-evidence-workflow.sh"
      - type: "manual"
        test_type: "e2e"
        file: "N/A"
        command: "gh run download <run-id>"

  - id: "AC-020"
    description: "Given the policy-checks.yml workflow is dispatched, when all verification scripts pass, then the workflow succeeds"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/policy-checks.yml"
        command: "grep -q 'verify-release-automation.sh' .github/workflows/policy-checks.yml"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-release-automation.sh"
        command: "./scripts/qa/verify-release-automation.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-build-workflow-contract.sh"
        command: "./scripts/qa/verify-build-workflow-contract.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-release-workflow-invocation.sh"
        command: "./scripts/qa/verify-release-workflow-invocation.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/qa/verify-release-dry-run-contract.sh"
        command: "./scripts/qa/verify-release-dry-run-contract.sh"

  - id: "AC-021"
    description: "Given a production rollback is needed, when the operator runs release-openedx-gitops.sh with prior known-good tags, then the rollback completes without building new images and pods converge within 10 minutes"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/release-openedx-gitops.sh"
        command: "./scripts/infra/release-openedx-gitops.sh --dry-run"
      - type: "manual"
        test_type: "e2e"
        file: "docs/operations/RELEASE_CHECKLIST.md"
        command: "grep -q 'Rollback' docs/operations/RELEASE_CHECKLIST.md"

  # Scheduled Operations
  - id: "AC-022"
    description: "Given the public-health-check.yml runs on schedule, when branding is correct on prod and dev, then no failures are reported and logs are uploaded as artifacts"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/public-health-check.yml"
        command: "grep -q 'schedule:' .github/workflows/public-health-check.yml && grep -q 'cron:' .github/workflows/public-health-check.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run list --workflow=public-health-check.yml --limit 5"

  - id: "AC-023"
    description: "Given the operations-gates-runtime.yml runs on schedule, when GKE authentication succeeds, then operations gates execute against the live cluster and artifacts are uploaded with 30-day retention"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/operations-gates-runtime.yml"
        command: "grep -q 'schedule:' .github/workflows/operations-gates-runtime.yml && grep -q 'retention-days: 30' .github/workflows/operations-gates-runtime.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run list --workflow=operations-gates-runtime.yml --limit 5"

  - id: "AC-024"
    description: "Given the dr-evidence-bundle.yml runs on the 1st of the month, when GKE access is available, then a DR evidence bundle is generated and uploaded with 120-day retention"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/dr-evidence-bundle.yml"
        command: "grep -q 'cron:.*0 2 1 \\* \\*' .github/workflows/dr-evidence-bundle.yml && grep -q 'retention-days: 120' .github/workflows/dr-evidence-bundle.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run list --workflow=dr-evidence-bundle.yml --limit 5"

  # iOS Build
  - id: "AC-025"
    description: "Given the iOS workflow is manually dispatched, when it completes successfully, then a signed IPA is uploaded to TestFlight via App Store Connect API"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-ios-app.yml"
        command: "grep -q 'workflow_dispatch' .github/workflows/build-ios-app.yml && grep -q 'TestFlight' .github/workflows/build-ios-app.yml"
      - type: "manual"
        test_type: "e2e"
        file: "N/A"
        command: "gh run list --workflow=build-ios-app.yml --limit 5"

  - id: "AC-026"
    description: "Given the iOS workflow runs, when it completes (pass or fail), then SSH keys used for Match are cleaned up"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-ios-app.yml"
        command: "grep -q 'if: always()' .github/workflows/build-ios-app.yml && grep -q 'ssh-add -D' .github/workflows/build-ios-app.yml"

  # Security
  - id: "AC-027"
    description: "Given the pre-commit hook is installed, when a developer attempts to commit a file containing a hardcoded secret pattern, then the commit is rejected with a warning"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".githooks/pre-commit"
        command: "test -f .githooks/pre-commit && grep -q 'PASSWORD.*=.*[\"']' .githooks/pre-commit"
      - type: "automated"
        test_type: "unit"
        file: ".githooks/pre-commit"
        command: "bash -n .githooks/pre-commit"

  - id: "AC-028"
    description: "Given any workflow runs, when secrets are used, then no secret values appear in workflow logs (GitHub Actions masking)"
    verify:
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run view <run-id> --log | grep -q '\\*\\*\\*'"

  # Edge Cases
  - id: "EC-OOM-1"
    description: "OpenEdX build OOM fails clearly (not hang) with step summary suggesting remediation (local build or self-hosted runner)"
    verify:
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run view <run-id> --log | grep -i 'out of memory'"

  - id: "EC-OOM-2"
    description: "MFE build OOM error distinguishable from other failures"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'NODE_OPTIONS=--max-old-space-size=6144' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run view <run-id> --log | grep -i 'javascript heap out of memory'"

  - id: "EC-Network-1"
    description: "Docker push network failure fails build (no silent partial push)"
    verify:
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run view <run-id> --log | grep 'docker push'"

  - id: "EC-Network-2"
    description: "Re-running workflow after push failure is idempotent"
    verify:
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run rerun <run-id>"

  - id: "EC-Cache-1"
    description: "Stale Tutor cache with --no-cache produces correct build"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q '\\-\\-no-cache' .github/workflows/build-tutor-images.yml || grep -q 'tutor images build' .github/workflows/build-tutor-images.yml"

  - id: "EC-GitOps-1"
    description: "GitOps PAT expired fails before git operations with clear error"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'GITOPS_PAT' .github/workflows/build-tutor-images.yml"
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh secret list | grep GITOPS_PAT"

  - id: "EC-GitOps-2"
    description: "bbi-infrastructure merge conflict fails push (no force push)"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/release-openedx-gitops.sh"
        command: "! grep -q 'git push.*--force' scripts/infra/release-openedx-gitops.sh"

  - id: "EC-GitOps-3"
    description: "Digest mismatch (build vs registry) fails release script"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/release-openedx-gitops.sh"
        command: "grep -q '\\-\\-require-digests' scripts/infra/release-openedx-gitops.sh"
      - type: "automated"
        test_type: "shell_verification"
        file: "scripts/infra/resolve-image-digest.sh"
        command: "./scripts/infra/resolve-image-digest.sh --verify"

  - id: "EC-GitOps-4"
    description: "Partial build success (openedx builds, MFE fails) prevents GitOps update"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-tutor-images.yml"
        command: "grep -q 'needs:' .github/workflows/build-tutor-images.yml"

  - id: "EC-Schedule-1"
    description: "GKE auth failure in scheduled workflows (strict=false) skips GKE checks and reports warnings"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/operations-gates-runtime.yml"
        command: "grep -q 'strict_runtime' .github/workflows/operations-gates-runtime.yml"

  - id: "EC-Schedule-2"
    description: "GKE auth failure in scheduled workflows (strict=true) fails workflow"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/operations-gates-runtime.yml"
        command: "grep -q 'strict_runtime' .github/workflows/operations-gates-runtime.yml"

  - id: "EC-Rate-1"
    description: "GitHub API rate limits hit during scheduled workflows fail gracefully"
    verify:
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh api rate_limit"

  - id: "EC-Retry-1"
    description: "Failed workflow manual re-run succeeds (no stuck state)"
    verify:
      - type: "manual"
        test_type: "integration"
        file: "N/A"
        command: "gh run rerun <run-id>"

  # NFR-Performance (all manual - require CI run history analysis)
  - id: "NFR-Performance-1"
    description: "CI quality gate jobs complete within 10 minutes each"
    verify:
      - type: "manual"
        test_type: "performance"
        file: "N/A"
        command: "gh run list --workflow=ci.yml --limit 20 --json durationMs"

  - id: "NFR-Performance-2"
    description: "Full CI workflow completes within 15 minutes for typical PR"
    verify:
      - type: "manual"
        test_type: "performance"
        file: "N/A"
        command: "gh run list --workflow=ci.yml --limit 20 --json durationMs"

  - id: "NFR-Performance-3"
    description: "OpenEdX image build completes within 45 minutes"
    verify:
      - type: "manual"
        test_type: "performance"
        file: "N/A"
        command: "gh run list --workflow=build-tutor-images.yml --limit 20 --json durationMs"

  - id: "NFR-Performance-4"
    description: "MFE image build completes within 20 minutes"
    verify:
      - type: "manual"
        test_type: "performance"
        file: "N/A"
        command: "gh run list --workflow=build-tutor-images.yml --limit 20 --json durationMs"

  - id: "NFR-Performance-5"
    description: "iOS build completes within 90 minutes (timeout enforced)"
    verify:
      - type: "automated"
        test_type: "shell_verification"
        file: ".github/workflows/build-ios-app.yml"
