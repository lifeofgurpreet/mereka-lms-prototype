spec: badges-credentials-enterprise_spec.md
acceptance_criteria:
- id: AC-001
  description: Given the K8s manifests are applied, when `kubectl get deployment badgr-server
    -n mereka-lms` is run, then the deployment exists with READY replicas >= 1
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-k8s-deployment.sh
    command: scripts/qa/verify-badges-k8s-deployment.sh
- id: AC-002
  description: Given the Badgr Server is running, when `curl http://badgr-server:8000/health/`
    is called from within the cluster, then the response is HTTP 200
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-k8s-deployment.sh
    command: scripts/qa/verify-badges-k8s-deployment.sh
- id: AC-003
  description: Given the Badgr Server is externally accessible, when `curl https://badges.academyv2.mereka.io/health/`
    is called, then the response is HTTP 200
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-k8s-deployment.sh
    command: scripts/qa/verify-badges-k8s-deployment.sh
- id: AC-004
  description: Given the badgr-worker Deployment is running, when `kubectl get deployment
    badgr-worker -n mereka-lms` is run, then the deployment exists with READY replicas
    >= 1
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-k8s-deployment.sh
    command: scripts/qa/verify-badges-k8s-deployment.sh
- id: AC-005
  description: Given the service is deployed, its domain MUST use DNS-only Cloudflare
    mode with Let's Encrypt SSL (not Cloudflare proxy)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-k8s-deployment.sh
    command: scripts/qa/verify-badges-k8s-deployment.sh
- id: AC-006
  description: Given a course with an associated BadgeClass and a learner who completes
    the course, when the `COURSE_COMPLETION` event is processed, then a valid OpenBadges
    2.0 assertion is created in Badgr Server and an email notification is sent to
    the learner within 60 seconds
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-issuance.sh
    command: scripts/qa/verify-badges-issuance.sh
- id: AC-007
  description: Given a program with an associated BadgeClass and a learner who completes
    all courses in the program, when the `PROGRAM_COMPLETION` event is processed,
    then a valid OpenBadges 2.0 assertion is created for the program badge
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-issuance.sh
    command: scripts/qa/verify-badges-issuance.sh
- id: AC-008
  description: Given a learner who has already earned a badge for course X, when the
    same learner completes course X again (re-enrollment), then no duplicate assertion
    is created and the existing assertion is returned
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-issuance.sh
    command: scripts/qa/verify-badges-issuance.sh
- id: AC-009
  description: Given an enterprise admin in the admin portal, when they submit a manual
    badge issuance request with a valid learner email and BadgeClass, then the badge
    is issued and the learner receives a notification email
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-issuance.sh
    command: scripts/qa/verify-badges-issuance.sh
- id: AC-010
  description: Given an enterprise admin uploads a CSV with 1000 badge issuance rows,
    when the bulk issuance is submitted, then all 1000 badges are issued within 10
    minutes and a completion report is available in the admin portal
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-issuance.sh
    command: scripts/qa/verify-badges-issuance.sh
- id: AC-011
  description: Given enterprise customer A and enterprise customer B both have BadgeClasses,
    when admin A calls `GET /api/v1/badges/enterprise/{uuid_A}/badge-classes/`, then
    only badge classes belonging to tenant A are returned
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-multi-tenant.sh
    command: scripts/qa/verify-badges-multi-tenant.sh
- id: AC-012
  description: Given enterprise customer A has issued badges, when admin B calls `GET
    /api/v1/badges/enterprise/{uuid_A}/assertions/`, then the response is HTTP 403
    Forbidden
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-multi-tenant.sh
    command: scripts/qa/verify-badges-multi-tenant.sh
- id: AC-013
  description: Given enterprise customer A's issuer profile, when the badge assertion
    JSON is inspected, then the issuer name, logo, and URL reflect tenant A's branding,
    not Mereka Academy's default branding
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-multi-tenant.sh
    command: scripts/qa/verify-badges-multi-tenant.sh
  - type: manual
    runbook: docs/operations/BADGES_CREDENTIALS_RUNBOOK.md
    section: Badge Issuing Verification
    justification: Visual UI verification requires browser interaction
- id: AC-014
  description: Given a learner belonging to both enterprise customer A and B, when
    they view their credential portfolio, then they see badges from both tenants clearly
    labeled by issuer
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-multi-tenant.sh
    command: scripts/qa/verify-badges-multi-tenant.sh
- id: AC-015
  description: Given a valid, non-revoked badge assertion, when `GET https://badges.academyv2.mereka.io/public/assertions/{uid}`
    is called without authentication, then the response is HTTP 200 with valid OpenBadges
    2.0 assertion JSON and Content-Type `application/ld+json`
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-verification.sh
    command: scripts/qa/verify-badges-verification.sh
- id: AC-016
  description: Given a revoked badge assertion, when `GET https://badges.academyv2.mereka.io/public/assertions/{uid}`
    is called, then the response is HTTP 404 with a body indicating the assertion
    was revoked and the revocation date
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-verification.sh
    command: scripts/qa/verify-badges-verification.sh
- id: AC-017
  description: 'Given the public verification endpoint, when a request is made with
    `Origin: https://example.com`, then the response includes `Access-Control-Allow-Origin:
    *`'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-verification.sh
    command: scripts/qa/verify-badges-verification.sh
- id: AC-018
  description: Given the signing public key endpoint, when `GET https://badges.academyv2.mereka.io/.well-known/badgeclass-signing-key`
    is called, then the response contains the public key in PEM or JWK format
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-verification.sh
    command: scripts/qa/verify-badges-verification.sh
- id: AC-019
  description: Given an enterprise admin revokes a badge assertion with reason "Employment
    terminated", when the revocation is processed, then the public assertion URL returns
    HTTP 404 with revocation metadata and the learner's portfolio shows "Revoked"
    status
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-revocation.sh
    command: scripts/qa/verify-badges-revocation.sh
- id: AC-020
  description: Given a bulk revocation of 500 assertions, when the revocation is submitted,
    then all 500 assertions are revoked within 5 minutes and the revocation list endpoint
    is updated
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-revocation.sh
    command: scripts/qa/verify-badges-revocation.sh
- id: AC-021
  description: Given a revoked badge that was blockchain-anchored, when the revocation
    list is checked, then the assertion UID appears in the revocation list but the
    on-chain anchor transaction is unchanged
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-revocation.sh
    command: scripts/qa/verify-badges-revocation.sh
  - type: manual
    runbook: docs/operations/BADGES_CREDENTIALS_RUNBOOK.md
    section: Credential Template Testing
    justification: Full LinkedIn integration requires interactive browser verification
- id: AC-022
  description: Given a learner views a badge in their credential portfolio, when they
    click "Add to LinkedIn", then they are redirected to LinkedIn's certification
    add page with badge name, issuer organization, dates, and credential URL pre-populated
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-integration.sh
    command: scripts/qa/verify-badges-integration.sh
- id: AC-023
  description: Given a badge with a public assertion URL, when the URL is shared on
    LinkedIn or social media, then the page renders appropriate Open Graph metadata
    (title, description, badge image)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-integration.sh
    command: scripts/qa/verify-badges-integration.sh
- id: AC-024
  description: Given a valid enterprise admin JWT for tenant A, when `GET /api/v1/badges/enterprise/{uuid_A}/assertions/?issued_after=2026-01-01&badge_class_id=xyz`
    is called, then only matching assertions for tenant A's learners are returned
    with pagination
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-integration.sh
    command: scripts/qa/verify-badges-integration.sh
- id: AC-025
  description: 'Given an enterprise admin registers a webhook URL, when a badge is
    issued to one of their learners, then the webhook endpoint receives a POST with
    `event_type: badge_issued` within 60 seconds'
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-integration.sh
    command: scripts/qa/verify-badges-integration.sh
- id: AC-026
  description: Given a webhook delivery fails (HTTP 500), when the system retries,
    then it retries up to 5 times with exponential backoff and logs each failure
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-integration.sh
    command: scripts/qa/verify-badges-integration.sh
- id: AC-027
  description: Given a badge assertion, when the assertion JSON is inspected, then
    the `recipient.identity` field contains a SHA-256 hash of the email (not the plaintext
    email)
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-security.sh
    command: scripts/qa/verify-badges-security.sh
- id: AC-028
  description: Given more than 100 verification requests from a single IP within 1
    minute, when the next request arrives, then the response is HTTP 429 with a Retry-After
    header
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-security.sh
    command: scripts/qa/verify-badges-security.sh
  - type: monitoring
    metric: badge_verification_requests_total
    dashboard: infrastructure/observability/dashboards/badges-credentials-dashboard.json
- id: AC-029
  description: Given more than 1000 verification requests for a single assertion within
    1 hour, then an alert is triggered in the observability stack
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-security.sh
    command: scripts/qa/verify-badges-security.sh
  - type: manual
    runbook: docs/operations/BADGES_CREDENTIALS_RUNBOOK.md
    section: Badge Revocation Testing
    justification: Dashboard visual verification requires browser interaction
- id: AC-030
  description: Given an enterprise admin accesses the badge analytics dashboard, when
    the page loads, then it displays total badges issued, sharing rate, verification
    count, and top badge classes for their tenant only
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-observability.sh
    command: scripts/qa/verify-badges-observability.sh
- id: AC-031
  description: Given an enterprise admin calls `GET /api/v1/badges/enterprise/{uuid}/analytics/`,
    then the response includes aggregate metrics scoped to the requesting tenant
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-observability.sh
    command: scripts/qa/verify-badges-observability.sh
- id: AC-032
  description: Given the Badgr Server is running, when `/metrics` is scraped by Prometheus,
    then badge-specific metrics (issuance count, verification latency, queue depth)
    are present
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-observability.sh
    command: scripts/qa/verify-badges-observability.sh
- id: AC-033
  description: Given a badge issuance fails, when the error is logged, then the log
    entry includes `enterprise_customer_uuid`, `badge_class_id`, `learner_user_id`,
    `error_type`, and `correlation_id`
  verify:
  - type: automated
    test_type: shell_verification
    file: scripts/qa/verify-badges-observability.sh
    command: scripts/qa/verify-badges-observability.sh

