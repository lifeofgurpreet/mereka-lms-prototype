scripts:

  # ── Release Orchestration ────────────────────────────────────────────────────

  - path: scripts/infra/canonical-release.sh
    owner: platform-team
    purpose: >
      Top-level release wrapper — enforces canonical path/branch/worktree,
      checks image hash cache, and delegates to release-openedx-gitops.sh.
      Double-confirmation tokens required for --apply and --push.
    inputs:
      - CONFIRM_CANONICAL_RELEASE=CANONICAL_RELEASE
      - CONFIRM_PUSH_CANONICAL_RELEASE=PUSH_CANONICAL_RELEASE
      - ALLOW_PROD_APPLY=1
      - --openedx-tag TAG
      - --mfe-tag TAG
    outputs:
      - stdout (release summary)
    side_effects:
      - Delegates git commit + push to release-openedx-gitops.sh
      - Updates production kustomization.yaml image tags (via delegate)
    dry_run: true  # --check-only and --dry-run flags available
    lanes: [prod]
    proof_command: "bash scripts/infra/canonical-release.sh --check-only"
    criticality: release-blocking
    entrypoint_role: release  # canonical-entrypoints.yaml workflow: release

  - path: scripts/infra/release-openedx-gitops.sh
    owner: platform-team
    purpose: >
      Core gitops release orchestrator — writes image tags into the production
      overlay, commits, pushes, triggers ArgoCD sync, runs runtime verification
      guards, and optionally purges the frontend cache.
    inputs:
      - CONFIRM_RELEASE_OPENEDX_GITOPS=RELEASE_OPENEDX_GITOPS
      - CONFIRM_PUSH_RELEASE_OPENEDX_GITOPS=PUSH_RELEASE_OPENEDX_GITOPS
      - ALLOW_PROD_APPLY=1
      - --openedx-tag TAG
      - --mfe-tag TAG
      - --openedx-digest sha256:...
      - --mfe-digest sha256:...
    outputs:
      - deploy/k8s/overlays/production/kustomization.yaml (modified)
      - stdout (ArgoCD sync status)
    side_effects:
      - Writes and git-commits production overlay image tags
      - Pushes to origin main (with --push)
      - Triggers ArgoCD sync (live cluster mutation)
      - Purges Cloudflare frontend cache (with --purge-frontend-cache)
    dry_run: true  # --dry-run flag supported
    lanes: [prod, staging]
    proof_command: "bash scripts/infra/release-openedx-gitops.sh --dry-run --openedx-tag latest --mfe-tag latest 2>&1 | head -5"
    criticality: release-blocking
    entrypoint_role: promote  # canonical-entrypoints.yaml workflow: promote

  - path: scripts/infra/create-release.sh
    owner: platform-team
    purpose: >
      Creates a semver annotated git tag, generates a changelog from conventional
      commits, and pushes the tag to origin (triggering the release.yml workflow).
    inputs:
      - "positional: VERSION (e.g. v1.2.0)"
    outputs:
      - stdout (tag + changelog summary)
    side_effects:
      - Creates annotated git tag
      - Pushes tag to origin (triggers GitHub Actions release.yml)
    dry_run: false
    lanes: [prod]
    proof_command: "bash scripts/infra/create-release.sh --help 2>&1 | head -3 || true"
    criticality: release-blocking

  # ── Lane Acceptance ────────────────────────────────────────────────────────

  - path: scripts/acceptance/runtime-routing.sh
    owner: platform-team
    purpose: >
      Canonical runtime-routing lane wrapper. Generates the tenant browser matrix,
      runs the env runtime-proof script, and wraps the existing browser/runtime
      oracles into one proof bundle.
    inputs:
      - --env production|staging|dev|profiles-dev|local
      - --tenant slug (optional)
      - --output-dir PATH (optional)
      - --dry-run (optional)
      - --skip-runtime-proof (optional)
      - --skip-playwright (optional)
      - --skip-studio-sso (optional)
      - --with-footer (optional)
      - --skip-footer (legacy compatibility alias; optional)
    outputs:
      - var/acceptance/runtime-routing/<env>/<timestamp>/summary.json
      - var/acceptance/runtime-routing/<env>/<timestamp>/truth-ledger.json
      - var/acceptance/runtime-routing/<env>/<timestamp>/browser-matrix.json
      - per-tenant log files under the same proof bundle
    side_effects:
      - none in --dry-run
      - reads live app endpoints and may read live cluster state via delegated runtime-proof scripts
    dry_run: true
    lanes: [dev, staging, prod]
    proof_command: "bin/accept runtime-routing --env dev --tenant biji-biji --dry-run"
    criticality: release-supporting

  - path: scripts/acceptance/generate_runtime_routing_matrix.py
    owner: platform-team
    purpose: >
      Generates the canonical runtime-routing browser contract from
      deploy/k8s/tenancy/tenant-registry.yaml for one environment at a time.
    inputs:
      - --env production|staging|dev|profiles-dev|local
      - --tenant slug (optional)
      - --output PATH (optional)
      - --stdout (optional)
      - --check (optional)
    outputs:
      - generated/tenant-runtime/browser-matrix-<env>.json
      - stdout path or JSON when requested
    side_effects:
      - writes generated tenant-runtime contract files in the repo
    dry_run: true
    lanes: [dev, staging, prod]
    proof_command: "python3 scripts/acceptance/generate_runtime_routing_matrix.py --env dev --check"
    criticality: informational

  - path: scripts/release/generate_truth_ledger.py
    owner: platform-team
    purpose: >
      Joins the runtime-routing proof bundle with app, release, infra, Argo,
      and live runtime facts into one machine-readable truth ledger.
    inputs:
      - --summary-json PATH
      - --output PATH (optional)
      - --app-sha SHA (optional)
      - --infra-commit-sha SHA (optional)
      - --argo-app NAME (optional)
      - --namespace NAME (optional)
      - --release-object-json PATH (optional)
      - --release-openedx-image IMAGE@DIGEST (optional)
      - --release-mfe-image IMAGE@DIGEST (optional)
      - --image-repo REPOSITORY (optional, repeatable)
    outputs:
      - var/acceptance/runtime-routing/<env>/<timestamp>/truth-ledger.json
      - generated/truth-ledger/<lane>/<env>/<tenant-or-all>.json
      - stdout path to the emitted ledger
    side_effects:
      - reads kubectl/Argo live state when the relevant options are provided or inferred
    dry_run: true
    lanes: [dev, staging, prod]
    proof_command: "python3 scripts/release/generate_truth_ledger.py --summary-json /tmp/runtime-routing-summary.json --output /tmp/runtime-truth-ledger.json"
    criticality: release-supporting

  - path: scripts/release/generate_release_object.py
    owner: platform-team
    purpose: >
      Derives the canonical release object from the signed release bundle and optional
      build-provenance linkage. This is the app-repo promotion unit that later proof
      and GitOps consumers should reference instead of hand-joining SHA, digest, and
      contract facts.
    inputs:
      - --release-bundle-json PATH
      - --output PATH
      - --tenant-contract-path PATH (optional)
      - --build-provenance-json PATH (optional)
      - --proof-ref PATH (optional, repeatable)
      - --release-id ID (optional)
    outputs:
      - JSON file at --output path
    side_effects: none
    dry_run: true
    lanes: [dev, staging, prod]
    proof_command: "python3 scripts/release/generate_release_object.py --release-bundle-json /tmp/release-bundle.json --output /tmp/release-object.json"
    criticality: release-supporting

  # ── Image Tag Management ─────────────────────────────────────────────────────

