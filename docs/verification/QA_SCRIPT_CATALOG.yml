# QA Script Catalog
# Maps every verification script to its method class, tier, and target spec ACs.
#
# Last updated: 2026-02-13

version: "1.0.0"

method_taxonomy:
  static:
    description: "File existence, config format, syntax checks"
    examples: ["shellcheck", "spec frontmatter lint", "secret scan"]
    typical_tier: "P0"
  contract:
    description: "API schema validation, health endpoint checks"
    examples: ["endpoint health", "k8s resource validation"]
    typical_tier: "P0"
  behavioral:
    description: "Functional testing — unit, integration, e2e"
    examples: ["migration verification", "auth flow tests"]
    typical_tier: "P1"
  resilience:
    description: "Failure injection, recovery validation"
    examples: ["pod restart recovery", "backup restore drill"]
    typical_tier: "P1"
  monitoring:
    description: "Alert rule validation, metric scraping checks"
    examples: ["alert routing verify", "grafana dashboard audit"]
    typical_tier: "P2"

