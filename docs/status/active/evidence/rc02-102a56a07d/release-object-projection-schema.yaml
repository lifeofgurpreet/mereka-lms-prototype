      release_bundle_id: "rb-e4764d58-20260410T142410Z"
    images:
      openedx:
        name: "ghcr.io/biji-biji-initiative/mereka-lms/openedx"
        digest: "sha256:2eed29dbd0cf5df5ddb55f4075d23cdeb4bb3c48704d20b540f7746379dd4ea4"
      mfe:
        name: "ghcr.io/biji-biji-initiative/mereka-lms/mfe"
        digest: "sha256:9fff8d031b00feed62f1103baf21d2127c5f5721be064c6158aac018b3a15347"
    source_artifacts:
      release_bundle_json: "/home/runner/_work/mereka-lms/mereka-lms/var/ci/release-bundle.json"
