      control_plane_ref: "Biji-Biji-Initiative/platform-control-plane@efbf7f9bd023eebea6b22f6b8305b8e62d4a5522"
    build:
      workflow: ".github/workflows/build-tutor-images.yml"
      run_id: "24244345117"
