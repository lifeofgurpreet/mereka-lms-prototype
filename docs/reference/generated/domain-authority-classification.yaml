# Domain Authority Surface Classification
# Generated: 2026-03-31
# Purpose: Machine-readable inventory of all files that carry domain/hostname data.
# Each surface is classified by its authority level and ownership.
#
# Classifications:
#   canonical: The single source of truth for its concern. Editable by humans.
#   generated: Produced from canonical sources. Must not be hand-edited.
#   derived-helper: Convenience file that re-exports canonical data. May be hand-edited but must stay aligned.
#   historical: Stale or superseded. Should not be treated as truth.
#
# Staleness indicators:
#   stale: false  -- data is current and aligned with canonical source
#   stale: true   -- data has drifted from canonical source or is outdated
#   stale: partial -- some entries are current, some have drifted

# ==============================================================================
# APP REPO: mereka-lms
# ==============================================================================
surfaces:

  # --------------------------------------------------------------------------
  # CANONICAL SOURCES (app repo)
  # --------------------------------------------------------------------------

  - path: deploy/k8s/tenancy/tenant-registry.yaml
    repo: mereka-lms
    classification: canonical
    concern: tenant-host-intent
    description: >-
      Canonical source for ALL active domains across all environments and tenants.
      Contains tenant definitions, environment metadata, and a comprehensive domain
      registry with auth classification, cookie domain, proof priority, Caddy backend,
      CORS/CSRF/ALLOWED_HOSTS flags, and ingress TLS status per domain.
    consumers:
      - scripts/tenants/verify-dev-runtime-proof.sh
      - scripts/tenants/verify-staging-runtime-proof.sh
      - scripts/tenants/verify-staging-tenant-proof.sh
      - scripts/tenants/lib/runtime-proof-common.sh
      - scripts/qa/verify-rke2-tenant-routes.sh
      - scripts/qa/verify-mfe-config-api.sh
      - scripts/qa/verify-domain-url-invariants.sh
      - scripts/shared/config.sh (must stay aligned)
      - docs/reference/operations/DOMAIN_MATRIX.md (projection)
      - docs/reference/architecture/TENANT_DOMAIN_AUTHORITY_MATRIX.md (projection)
      - docs/reference/architecture/TENANT_DOMAIN_SURFACE_AUTHORITY.md (projection)
    stale: false
    notes: >-
      Version 1.2.0. Contains 60+ domain entries across production, dev, profiles-dev,
      staging, and local environments. This is the single authority for "what domains
      exist, who owns them, and what routing/auth/cookie policy applies."

  - path: infrastructure/tenants/tenant-contracts.yml
    repo: mereka-lms
    classification: canonical
    concern: tenant-metadata
    description: >-
      Canonical source for tenant business metadata: slug, registry_slug, name,
      org_code, contact_email, country, active status, and per-tenant MFE env file
      paths. Contains production domain entries under each tenant's domains map
      (lms, studio, apps, admin).
    consumers:
      - scripts/shared/config.sh (mereka_lms_canonical_domain_map_json helper)
      - scripts/tenants/ (provisioning scripts)
    stale: false
    notes: >-
      Contains hostnames in its domains map, but these are tenant-scoped production
      hostnames only. The tenant-registry.yaml is the comprehensive cross-environment
      domain authority. This file's hostname data MUST stay aligned with the tenant
      registry production entries. Slug inconsistency exists: biji-biji vs bijibiji.

  - path: deploy/k8s/base/apps/caddy/Caddyfile
    repo: mereka-lms
    classification: canonical
    concern: caddy-routing-template
    description: >-
      Canonical Caddy reverse proxy configuration template. Uses {$VAR} placeholders
      for domain names (LMS_HOST, STUDIO_HOST, MFE_HOST, DISCOVERY_HOST, NOTES_HOST,
      CREDENTIALS_HOST, ENTERPRISE_ADMIN_HOST, ENTERPRISE_LEARNER_HOST). Also contains
      hardcoded localhost entries for local development. Actual domain values are
      injected at runtime via overlay env var patches.
    consumers:
      - deploy/k8s/overlays/*/patches/caddy-env-patch.yaml (provides env var values)
      - bbi-infrastructure overlays/*/patches/caddy-env-patch.yaml (provides env var values)
    stale: false
    notes: >-
      Template is domain-agnostic by design. All environment-specific domain values
      come from overlay patches. The localhost blocks are the only hardcoded hostnames.

  - path: deploy/k8s/base/apps/openedx/settings/lms/production.py
    repo: mereka-lms
    classification: canonical
    concern: django-domain-defaults
    description: >-
      Django LMS settings with domain defaults read from environment variables.
      Hardcodes production defaults (academyv2.mereka.io, auth0.mereka.io) as
      fallbacks when env vars are unset. Constructs ALLOWED_HOSTS, CORS, CSRF,
      and service URLs from MEREKA_LMS_DOMAIN and related env vars. Also contains
      dev domain defaults (academyv2.mereka.dev) and multisite domain variables
      (MEREKA_BIJI_DOMAIN, MEREKA_SKILLOURFUTURE_DOMAIN).
    consumers:
      - LMS/CMS pods at runtime
      - deploy/k8s/overlays/*/patches/domain-env.yaml (overrides env vars)
      - bbi-infrastructure overlays/*/patches/lms-env-patch.yaml (overrides env vars)
    stale: false
    notes: >-
      The hardcoded defaults are production values. Nonprod overlays MUST set
      MEREKA_LMS_DOMAIN, MEREKA_AUTH_DOMAIN, etc. to override these defaults.
      Contains both prod and dev domain variable blocks.

  - path: infrastructure/tutor/plugins/_mereka_lms/config_defaults.py
    repo: mereka-lms
    classification: canonical
    concern: tutor-plugin-domain-defaults
    description: >-
      Tutor plugin config defaults. Hardcodes production domains in
      MEREKA_LMS_EXTRA_HOSTS (admin.academyv2.mereka.io, academy.biji-biji.com,
      learner.academyv2.mereka.io, skillourfuture.academy.mereka.io),
      MEREKA_LMS_EXTRA_CSRF_ORIGINS, MEREKA_SESSION_COOKIE_DOMAIN, and
      MEREKA_CSRF_COOKIE_DOMAIN (.academyv2.mereka.io).
    consumers:
      - tutor config save (Tutor plugin system)
      - tutor_env/ generated files
    stale: false
    notes: >-
      These are Tutor-time defaults for local development. K8s deployments
      do NOT use Tutor; they use the production.py settings and overlay patches.
      The domain values here must match the production entries in tenant-registry.yaml.

  - path: infrastructure/tutor/multisite-sites.yml
    repo: mereka-lms
    classification: canonical
    concern: openedx-site-records-prod
    description: >-
      Production Open edX Site records for django.contrib.sites. Defines
      per-tenant site_values including domain, LMS_ROOT_URL, CMS_ROOT_URL,
      MFE_BASE_URL, THEME_NAME, and course_org_filter. Three sites:
      academyv2.mereka.io, academy.biji-biji.com, skillourfuture.academy.mereka.io.
    consumers:
      - seed-sites management command
      - docs/reference/architecture/TENANT_DOMAIN_SURFACE_AUTHORITY.md
    stale: false
    notes: >-
      Domain values here must match tenant-registry.yaml production entries.
      This file drives the Django Site database records that control
      SiteConfiguration lookup on every HTTP request.

