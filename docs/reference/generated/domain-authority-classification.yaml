# ==============================================================================
# GITOPS REPO: bbi-infrastructure
# ==============================================================================

  # --------------------------------------------------------------------------
  # CANONICAL SOURCES (infra repo)
  # --------------------------------------------------------------------------

  - path: config/domain-registry.yaml
    repo: bbi-infrastructure
    classification: canonical
    concern: platform-domain-registry
    description: >-
      Platform-wide domain registry covering ALL BBI applications (openedx,
      mereka_v2, calcom, n8n, listmonk, temporal, twentycrm, zoom_rtms,
      climate-exchange, reka_slackbot, team_analytics, nfc_cards, agent_e),
      standalone VPS apps, ACFS services, and observability endpoints.
      Organized by environments (dev/staging/prod) with ingress IPs.
      OpenEdX section has dev/staging/prod hostnames for LMS, Studio, MFE,
      admin, preview, discovery, ecommerce, notes, credentials, learner.
    consumers:
      - tools/docs/build_domain_access_reference.py (in mereka-lms)
      - bbi-infrastructure helper scripts
      - platform-control-plane (reference)
    stale: partial
    notes: >-
      OpenEdX staging section has 'staging.ecommerce.mereka.io' (bare-zone
      pattern) which was removed from the app repo staging ingress. The
      staging section is missing 'learner' for dev. The prod section only
      has lms and studio (incomplete). This file is broader in scope
      (all BBI apps) but less complete for OpenEdX specifics than
      tenant-registry.yaml.

  - path: config/service-topology-catalog.yaml
    repo: bbi-infrastructure
    classification: canonical
    concern: service-placement-and-domains
    description: >-
      Per-service registry of environment availability, scope, packaging mode,
      namespaces, ArgoCD manifest files, and public domains. Contains domain
      entries for each service per environment (e.g., authentik dev/staging/prod,
      calcom, n8n, etc.). OpenEdX/mereka-lms entries may not be present in the
      truncated view but the catalog covers all env-scoped services.
    consumers:
      - scripts/verify-service-topology-sync.py (bbi-infrastructure)
      - ArgoCD ApplicationSets
    stale: false
    notes: >-
      Machine-checkable contract. Domain entries are per-service, not per-tenant.
      This is the authority for "which service runs where" but NOT for
      tenant-level domain mapping within a service.

  - path: config/cluster-topology-catalog.yaml
    repo: bbi-infrastructure
    classification: canonical
    concern: cluster-placement
    description: >-
      Physical cluster topology (nonprod-rke2, prod-gke) with environment
      assignments, node counts, and scope definitions. Does not contain
      domain/hostname data directly but defines the cluster→environment
      mapping that determines which overlay (and therefore which domains)
      applies where.
    consumers:
      - ADR-018
      - service-topology-catalog.yaml (referenced by)
    stale: false
    notes: >-
      Contains no hostname strings. Included in classification because
      cluster placement indirectly determines domain environment selection.

