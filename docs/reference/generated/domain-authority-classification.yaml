# ==============================================================================
# CONTROL-PLANE REPO: platform-control-plane
# ==============================================================================

  # --------------------------------------------------------------------------
  # CANONICAL SOURCES (control-plane repo)
  # --------------------------------------------------------------------------

  - path: contracts/staging-dns-cert-readiness.yaml
    repo: platform-control-plane
    classification: canonical
    concern: staging-dns-tls-readiness
    description: >-
      Canonical contract for staging DNS and TLS certificate readiness.
      Defines hostname patterns, DNS zone policies, ClusterIssuer assignments,
      and per-host readiness state (proven_now, blocked_external_dependency,
      blocked_on_control_plane_dns01_support). Contains 20 required_hosts
      with dns_status and cert_status per host. Defines the
      staging.*.mereka.io naming convention and biji-biji.com dedicated
      issuer policy.
    consumers:
      - scripts/docs/generate-reference.sh (in platform-control-plane)
      - docs/reference/generated/staging-readiness-reference.md (output)
      - bbi-infrastructure (staging cert-manager overlays)
    stale: false
    notes: >-
      This is the authority for "is a staging hostname DNS/TLS ready?"
      It does NOT define what hostnames should exist (that is tenant-registry.yaml).
      It tracks readiness state of hostnames defined elsewhere.

  - path: contracts/canonical-authority-registry.yaml
    repo: platform-control-plane
    classification: canonical
    concern: cross-repo-authority-policy
    description: >-
      Meta-contract defining which repo owns which truth domain.
      Covers lane_identity, lane_semantics_adapter, service_identity,
      alias_mapping, proof_object_schemas, secrets_metadata_pointers,
      and proof_retention_archive_policy. Does NOT contain domain/hostname
      data directly but defines the authority model that governs where
      domain truth lives.
    consumers:
      - bbi-infrastructure (promotion workflows)
      - mereka-lms (proof emission)
    stale: false
    notes: >-
      Contains no hostname strings. Included because it defines the
      meta-policy for authority allocation across repos. Domain/hostname
      authority is NOT explicitly listed as a truth_domain in this contract --
      that gap is what this classification file addresses.

  # --------------------------------------------------------------------------
  # GENERATED SOURCES (control-plane repo)
  # --------------------------------------------------------------------------

  - path: docs/reference/generated/staging-readiness-reference.md
    repo: platform-control-plane
    classification: generated
    concern: staging-readiness-docs
    canonical_source: contracts/staging-dns-cert-readiness.yaml
    description: >-
      Generated markdown table of all staging DNS/TLS hosts with their
      readiness state. Auto-generated by scripts/docs/generate-reference.sh.
      Contains 20 hostname rows with zone, TLS issuer, DNS/cert status.
    consumers:
      - operators (human reference)
    stale: false
    notes: >-
      Header states: "GENERATED FILE -- do not edit." Source is
      staging-dns-cert-readiness.yaml and staging-auth-surface.yaml.
      Some hostnames in this doc use inconsistent subdomain ordering
      vs tenant-registry.yaml (e.g., credentials.staging.academyv2 vs
      staging.credentials.academyv2) -- this reflects the readiness
      contract's own hostname patterns which include compatibility aliases.

