# ── Policies ──────────────────────────────────────────────────────────────────
local_proof_policy:
  rule: "Files under var/proofs/** are valid inputs but NOT canonical truth"
  promotion: "Must satisfy all 5 promotion criteria in CONVERGENCE_EVIDENCE_BUNDLE_CONTRACT.md"
  ref: docs/stabilization/CONVERGENCE_EVIDENCE_BUNDLE_CONTRACT.md

contradiction_policy:
  rule: "Later evidence supersedes earlier evidence; contradictions recorded, not erased"
  resolution: "New evidence must address both original claim and contradiction"
  ref: docs/stabilization/CONVERGENCE_EVIDENCE_BUNDLE_CONTRACT.md

promotion_rules:
  - "Merged PR fixing root cause = DURABLE evidence"
  - "Pinned image digest = DURABLE evidence"
  - "GitOps overlay change = DURABLE evidence"
  - "Browser proof + merged fix = CONFIRMED"
  - "Local proof file alone = NOT promotable"
  - "Screenshot alone = NOT promotable"
  - "kubectl exec result = NOT promotable"
  - "Manual DB write = NOT promotable"
